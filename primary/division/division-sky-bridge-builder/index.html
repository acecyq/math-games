<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skybridge Builder: Span &amp; Pillar Engineer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #061428;
      font-family: 'Exo 2', sans-serif;
      color: #e8f4ff;
    }
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      background: radial-gradient(ellipse at 50% 18%, #1a4a7a 0%, #0a2038 45%, #040e1c 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }
    #ui-overlay {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; padding: 10px 14px;
    }
    .hud-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      flex-wrap: nowrap; overflow-x: auto;
    }
    .hud-card {
      background: rgba(6, 28, 52, 0.88);
      border: 2px solid #3db8e8; border-radius: 8px;
      padding: 5px 10px; font-size: 12px; font-weight: 700;
      letter-spacing: 0.2px; text-shadow: 0 1px 2px #000;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45), inset 0 0 10px rgba(61,184,232,0.15);
      white-space: nowrap; flex-shrink: 0;
    }
    .hud-card.p1 { border-color: #ff6b5a; color: #ffcfc8; }
    .hud-card.p2 { border-color: #5ab0ff; color: #c8e4ff; }
    .hud-card.score { border-color: #f0c040; color: #ffe9a0; }
    .btn {
      pointer-events: auto;
      background: linear-gradient(180deg, #3db8e8 0%, #1a6a98 100%);
      color: #fff; border: 2px solid #9de8ff; border-radius: 6px;
      padding: 6px 12px; font-family: inherit; font-size: 12px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    }
    .btn:hover { filter: brightness(1.12); }
    .btn.muted { background: linear-gradient(180deg, #5a6a78, #2a3440); border-color: #8a9aa8; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
      <div class="hud-bar">
        <div class="hud-card p1" id="hud-p1">P1 ⛑×3 ★0</div>
        <div class="hud-card" id="hud-mode">MODE: CO-OP</div>
        <div class="hud-card" id="hud-tier">TIER 1 · TITLE</div>
        <div class="hud-card score" id="hud-score">COMBO ×1 · 0 PTS</div>
        <div class="hud-card p2" id="hud-p2">P2 ⛑×3 ★0</div>
        <button id="btn-audio" class="btn">AUDIO: ON</button>
      </div>
    </div>
  </div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 1280, H = 720, time = 0, shake = 0;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
  }
  window.addEventListener('resize', resize);
  resize();

  /* ===================== AUDIO ===================== */
  class SoundEngine {
    constructor() {
      this.ac = null; this.muted = false; this.timer = null; this.step = 0; this.tempo = 112;
    }
    init() {
      if (!this.ac) {
        this.ac = new (window.AudioContext || window.webkitAudioContext)();
        this.startBGM();
      } else if (this.ac.state === 'suspended') this.ac.resume();
    }
    toggleMute() {
      this.muted = !this.muted;
      const b = document.getElementById('btn-audio');
      b.textContent = `AUDIO: ${this.muted ? 'OFF' : 'ON'}`;
      b.classList.toggle('muted', this.muted);
    }
    tone(freq, dur, type = 'square', gain = 0.07, slide = 0) {
      if (this.muted || !this.ac) return;
      try {
        const t0 = this.ac.currentTime;
        const o = this.ac.createOscillator();
        const g = this.ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t0);
        if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t0 + dur);
        g.gain.setValueAtTime(gain, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(this.ac.destination);
        o.start(t0); o.stop(t0 + dur);
      } catch (_) {}
    }
    noise(dur = 0.12, gain = 0.06) {
      if (this.muted || !this.ac) return;
      try {
        const n = Math.floor(this.ac.sampleRate * dur);
        const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        const src = this.ac.createBufferSource();
        src.buffer = buf;
        const g = this.ac.createGain();
        g.gain.setValueAtTime(gain, this.ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ac.currentTime + dur);
        src.connect(g); g.connect(this.ac.destination);
        src.start();
      } catch (_) {}
    }
    wind() { this.tone(220, 0.28, 'sine', 0.05, 180); this.noise(0.22, 0.04); }
    stamp() { this.tone(720, 0.05, 'triangle', 0.09); this.tone(960, 0.04, 'square', 0.04); }
    girder() { this.tone(140, 0.18, 'sawtooth', 0.08); setTimeout(() => this.tone(320, 0.12, 'triangle', 0.06, 80), 40); this.noise(0.08, 0.05); }
    twang() { this.tone(480, 0.2, 'triangle', 0.05, -160); }
    error() { this.tone(140, 0.28, 'sawtooth', 0.14); this.noise(0.25, 0.1); }
    horn() { [392, 523, 659, 784].forEach((f, i) => setTimeout(() => this.tone(f, 0.28, 'square', 0.08), i * 90)); }
    fanfare() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.35, 'triangle', 0.09), i * 100)); }
    select() { this.tone(400, 0.04, 'triangle', 0.04); }
    click() { this.tone(540, 0.03, 'sine', 0.05); }
    startBGM() {
      if (this.timer) return;
      const bass = [130.81, 130.81, 146.83, 164.81, 130.81, 110, 146.83, 164.81];
      const lead = [523.25, 587.33, 659.25, 784, 659.25, 587.33, 523.25, 440];
      const ms = (60 / this.tempo) * 500;
      this.timer = setInterval(() => {
        if (!this.muted && this.ac && this.ac.state === 'running') {
          this.tone(bass[this.step % 8], 0.14, 'triangle', 0.035);
          if (this.step % 2 === 0) this.tone(lead[(this.step * 2) % 8], 0.09, 'square', 0.012);
          if (this.step % 4 === 0) this.noise(0.03, 0.015);
        }
        this.step = (this.step + 1) % 64;
      }, ms);
    }
  }
  const audio = new SoundEngine();
  document.getElementById('btn-audio').onclick = () => { audio.init(); audio.toggleMute(); };

  /* ===================== MATH ===================== */
  function generateLongDivision(dividend, divisor) {
    const digs = String(dividend).split('').map(Number);
    const steps = [];
    let idx = 0, working = 0, took = 0;
    while (idx < digs.length && working < divisor) {
      working = working * 10 + digs[idx++];
      took++;
    }
    while (true) {
      const q = Math.floor(working / divisor);
      const product = q * divisor;
      const rem = working - product;
      const more = idx < digs.length;
      steps.push({
        working, q, product, rem,
        bringDown: more ? digs[idx] : null,
        isFinal: !more,
        zeroPlaceholder: q === 0 && steps.length > 0,
        groupSpan: steps.length === 0 ? took : 1,
        digitEnd: idx - (more ? 0 : 0) // end index exclusive in dividend for this working start alignment
      });
      // Align working under dividend: compute start column
      steps[steps.length - 1].colEnd = idx; // exclusive index after digits consumed so far for this working
      if (!more) break;
      working = rem * 10 + digs[idx++];
    }
    // Fix column alignment for rendering
    let consumed = 0;
    for (let s = 0; s < steps.length; s++) {
      if (s === 0) consumed = steps[0].groupSpan;
      else consumed++;
      steps[s].colEnd = consumed;
      steps[s].colStart = consumed - String(steps[s].working).length;
    }
    return {
      dividend, divisor,
      quotient: Math.floor(dividend / divisor),
      remainder: dividend % divisor,
      digits: digs,
      steps,
      quotientDigits: steps.map(s => s.q)
    };
  }

  function distractors(correct, extras = []) {
    const set = new Set([correct, ...extras]);
    const out = [correct];
    const cand = [correct + 1, correct - 1, correct + 2, correct - 2, correct + 3,
      Math.max(0, correct - 3), correct * 2, Math.floor(correct / 2), correct + 10, Math.max(0, correct - 10)];
    for (const c of cand) {
      if (c >= 0 && !set.has(c) && out.length < 4) { set.add(c); out.push(c); }
    }
    let n = 0;
    while (out.length < 4 && n++ < 50) {
      const r = Math.max(0, correct + ((Math.random() * 9) | 0) - 4);
      if (!set.has(r)) { set.add(r); out.push(r); }
    }
    for (let i = out.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out.slice(0, 4);
  }

  const CAL_BANK = [
    { raw: 48, op: '×10', answer: 480, prompt: 'Fabricate 48 bundles of 10 m cable' },
    { raw: 307, op: '×10', answer: 3070, prompt: 'Fabricate 307 bundles of 10 m cable' },
    { raw: 650, op: '×10', answer: 6500, prompt: 'Fabricate 650 bundles of 10 m cable' },
    { raw: 73, op: '×10', answer: 730, prompt: 'Order 73 packs of 10 m girders' },
    { raw: 215, op: '×10', answer: 2150, prompt: 'Spin 215 reels of 10 m cable' },
    { raw: 90, op: '×10', answer: 900, prompt: 'Stamp 90 plates into 10 m beams' },
    { raw: 920, op: '÷10', answer: 92, prompt: 'Slice a 920 m master beam into 10 equal girders' },
    { raw: 4300, op: '÷10', answer: 430, prompt: 'Partition 4 300 m stock into 10 equal spans' },
    { raw: 8050, op: '÷10', answer: 805, prompt: 'Cut an 8 050 m cable into 10 equal runs' },
    { raw: 760, op: '÷10', answer: 76, prompt: 'Divide 760 m rail into 10 equal rails' },
    { raw: 5100, op: '÷10', answer: 510, prompt: 'Split 5 100 m into 10 equal girders' },
    { raw: 3400, op: '÷10', answer: 340, prompt: 'Slice 3 400 m into 10 equal beams' }
  ];

  const DIV_BANK = {
    1: [
      { d: 84, v: 4 }, { d: 96, v: 3 }, { d: 745, v: 5 }, { d: 864, v: 6 },
      { d: 63, v: 3 }, { d: 728, v: 8 }, { d: 936, v: 6 }, { d: 555, v: 5 }
    ],
    2: [
      { d: 816, v: 4 }, { d: 927, v: 9 }, { d: 618, v: 3 }, { d: 248, v: 4 },
      { d: 515, v: 5 }, { d: 824, v: 4 }, { d: 309, v: 3 }, { d: 726, v: 6 }
    ],
    3: [
      { d: 538, v: 4 }, { d: 749, v: 6 }, { d: 950, v: 7 }, { d: 473, v: 5 },
      { d: 682, v: 3 }, { d: 851, v: 8 }, { d: 367, v: 4 }, { d: 629, v: 7 }
    ]
  };

  /* ===================== PLAYERS ===================== */
  const players = [0, 1].map(id => ({
    id,
    name: id === 0 ? 'P1' : 'P2',
    color: id === 0 ? '#ff6b5a' : '#5ab0ff',
    glow: id === 0 ? 'rgba(255,107,90,0.55)' : 'rgba(90,176,255,0.55)',
    x: 0, y: 0, shields: 3, stars: 0, score: 0,
    keys: { up: 0, down: 0, left: 0, right: 0, action: 0 },
    gpAction: 0, lastAction: 0, stickX: 0, stickY: 0, sel: id, cool: 0
  }));

  window.addEventListener('keydown', e => {
    audio.init();
    const c = e.code;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(c)) e.preventDefault();
    if (c === 'KeyW') players[0].keys.up = 1;
    if (c === 'KeyS') players[0].keys.down = 1;
    if (c === 'KeyA') players[0].keys.left = 1;
    if (c === 'KeyD') players[0].keys.right = 1;
    if (c === 'KeyF' || c === 'Space') players[0].keys.action = 1;
    if (c === 'ArrowUp') players[1].keys.up = 1;
    if (c === 'ArrowDown') players[1].keys.down = 1;
    if (c === 'ArrowLeft') players[1].keys.left = 1;
    if (c === 'ArrowRight') players[1].keys.right = 1;
    if (c === 'Enter' || c === 'NumpadEnter') players[1].keys.action = 1;
  });
  window.addEventListener('keyup', e => {
    const c = e.code;
    if (c === 'KeyW') players[0].keys.up = 0;
    if (c === 'KeyS') players[0].keys.down = 0;
    if (c === 'KeyA') players[0].keys.left = 0;
    if (c === 'KeyD') players[0].keys.right = 0;
    if (c === 'KeyF' || c === 'Space') players[0].keys.action = 0;
    if (c === 'ArrowUp') players[1].keys.up = 0;
    if (c === 'ArrowDown') players[1].keys.down = 0;
    if (c === 'ArrowLeft') players[1].keys.left = 0;
    if (c === 'ArrowRight') players[1].keys.right = 0;
    if (c === 'Enter' || c === 'NumpadEnter') players[1].keys.action = 0;
  });

  function pollGamepads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < 2; i++) {
      const p = players[i], gp = pads[i];
      if (!gp) { p.gpAction = 0; continue; }
      const ax = Math.abs(gp.axes[0] || 0) > 0.35 ? gp.axes[0] : 0;
      const ay = Math.abs(gp.axes[1] || 0) > 0.35 ? gp.axes[1] : 0;
      p.stickX = (gp.buttons[15]?.pressed ? 1 : 0) - (gp.buttons[14]?.pressed ? 1 : 0) || ax;
      p.stickY = (gp.buttons[13]?.pressed ? 1 : 0) - (gp.buttons[12]?.pressed ? 1 : 0) || ay;
      p.gpAction = gp.buttons[0]?.pressed ? 1 : 0;
    }
  }

  /* ===================== STATE ===================== */
  const S = { TITLE: 'title', PLAY: 'play', WIN: 'win', OVER: 'over' };
  let state = S.TITLE;
  let gameMode = 'coop';
  let tier = 1, combo = 1, teamScore = 0, titleSel = 0;
  let popup = null, clouds = [], islands = [], sparks = [], trainX = -40;

  function blankBoard() {
    return {
      phase: 'cal', cal: null, div: null,
      dmsb: 'D', stepIdx: 0,
      stampedQ: [], doneM: [], doneS: [], brought: 0,
      options: [], correct: null,
      bridgeSeg: 0, complete: false, remainderLocked: false
    };
  }
  let boards = [blankBoard()];

  function showPopup(text, sub = '', color = '#7fdfff', dur = 150) {
    popup = { text, sub, color, t: dur, max: dur };
  }

  function updateHUD() {
    document.getElementById('hud-p1').textContent = `P1 ⛑×${players[0].shields} ★${players[0].stars}`;
    document.getElementById('hud-p2').textContent = `P2 ⛑×${players[1].shields} ★${players[1].stars}`;
    document.getElementById('hud-mode').textContent = `MODE: ${gameMode === 'coop' ? 'CO-OP' : 'COMPETE'}`;
    const phase = state === S.TITLE ? 'TITLE'
      : state === S.WIN ? 'BRIDGE OPEN'
      : state === S.OVER ? 'GAME OVER'
      : (boards[0] && boards[0].phase === 'cal' ? 'CALIBRATION ×÷10' : `LONG DIVISION`);
    document.getElementById('hud-tier').textContent = `TIER ${tier} · ${phase}`;
    document.getElementById('hud-score').textContent = `COMBO ×${combo} · ${teamScore} PTS`;
  }

  function pickCal() {
    const item = CAL_BANK[(Math.random() * CAL_BANK.length) | 0];
    const extras = item.op === '×10' ? [item.raw, item.raw * 100] : [item.raw, (item.raw / 100) | 0];
    return { ...item, shifted: false, options: distractors(item.answer, extras) };
  }

  function pickDiv() {
    const bank = DIV_BANK[tier];
    const item = bank[(Math.random() * bank.length) | 0];
    return generateLongDivision(item.d, item.v);
  }

  function setupOptions(board) {
    if (board.phase === 'cal') {
      board.options = board.cal.options.slice();
      board.correct = board.cal.answer;
      return;
    }
    const step = board.div.steps[board.stepIdx];
    if (!step) return;
    if (board.dmsb === 'D') {
      board.correct = step.q;
      board.options = distractors(step.q, [0, 1, step.q + 1]).map(o => Math.max(0, Math.min(9, o)));
      if (!board.options.includes(step.q)) board.options[0] = step.q;
    } else if (board.dmsb === 'M') {
      board.correct = step.product;
      board.options = distractors(step.product, [step.q * (board.div.divisor + 1), step.working]);
    } else if (board.dmsb === 'S') {
      board.correct = step.rem;
      board.options = distractors(step.rem, [step.working, step.product]);
    } else if (board.dmsb === 'B') {
      if (step.isFinal) { board.dmsb = 'R'; setupOptions(board); return; }
      board.correct = step.bringDown;
      board.options = distractors(step.bringDown, board.div.digits).map(o => Math.max(0, Math.min(9, o)));
      if (!board.options.includes(step.bringDown)) board.options[0] = step.bringDown;
    } else if (board.dmsb === 'R') {
      board.correct = board.div.remainder;
      const opts = new Set([board.div.remainder, 0, Math.max(0, board.div.remainder - 1), board.div.remainder + 1]);
      if (opts.size < 4) opts.add(board.div.divisor);
      board.options = [...opts].slice(0, 4);
      while (board.options.length < 4) board.options.push(board.options.length + 2);
      for (let i = board.options.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [board.options[i], board.options[j]] = [board.options[j], board.options[i]];
      }
    }
  }

  function startRound() {
    const cal = pickCal();
    const div = pickDiv();
    const n = gameMode === 'versus' ? 2 : 1;
    boards = [];
    for (let i = 0; i < n; i++) {
      const b = blankBoard();
      b.cal = JSON.parse(JSON.stringify(cal));
      b.div = JSON.parse(JSON.stringify(div));
      setupOptions(b);
      boards.push(b);
    }
    trainX = -40;
    state = S.PLAY;
    showPopup('GIRDER STOCK CALIBRATION', cal.prompt, '#7fdfff', 160);
    updateHUD();
  }

  function beginDivision(board) {
    board.phase = 'div';
    board.dmsb = 'D';
    board.stepIdx = 0;
    board.stampedQ = [];
    board.doneM = [];
    board.doneS = [];
    board.brought = 0;
    setupOptions(board);
    showPopup(
      `CHASM CONTRACT: ${board.div.dividend} m ÷ ${board.div.divisor} pillars`,
      `Tier ${tier} · Equal spans${tier === 3 ? ' + remainder ramp' : ''}`,
      '#f0c040', 170
    );
    updateHUD();
  }

  function coopOwner(dmsb) {
    return (dmsb === 'D' || dmsb === 'S') ? 0 : 1;
  }

  function boardFor(p) {
    return gameMode === 'coop' ? boards[0] : boards[p.id];
  }

  function mistake(player, tip) {
    audio.error();
    shake = 12;
    showPopup('STRUCTURAL WARNING!', tip, '#ff6b5a', 200);
    if (player) player.shields = Math.max(0, player.shields - 1);
    combo = 1;
    updateHUD();
    if (players[0].shields <= 0 && players[1].shields <= 0) {
      state = S.OVER;
      showPopup('ENGINEERING CREW DOWN', 'Press ACTION to return to title', '#ff6b5a', 9999);
    }
  }

  function award(player, pts) {
    teamScore += pts * combo;
    if (player) player.score += pts * combo;
    combo = Math.min(8, combo + 1);
    updateHUD();
  }

  function advance(board, player) {
    audio.stamp();
    const step = board.div.steps[board.stepIdx];

    if (board.dmsb === 'D') {
      board.stampedQ.push(step.q);
      if (step.zeroPlaceholder) {
        showPopup('0 PLACEHOLDER LOCKED',
          `${board.div.divisor} pillars cannot divide ${step.working} into whole tens — zero on the roof!`,
          '#f0c040', 130);
      }
      board.dmsb = 'M';
      setupOptions(board);
      award(player, 10);
      return;
    }
    if (board.dmsb === 'M') {
      board.doneM.push(step.product);
      board.dmsb = 'S';
      setupOptions(board);
      award(player, 10);
      return;
    }
    if (board.dmsb === 'S') {
      board.doneS.push(step.rem);
      board.dmsb = step.isFinal ? 'R' : 'B';
      setupOptions(board);
      award(player, 10);
      return;
    }
    if (board.dmsb === 'B') {
      audio.girder();
      audio.twang();
      board.bridgeSeg++;
      board.brought++;
      board.stepIdx++;
      board.dmsb = 'D';
      setupOptions(board);
      award(player, 15);
      showPopup('SPAN EXTENDED!', 'Crane brought down the next digit', '#7fdfff', 90);
      return;
    }
    if (board.dmsb === 'R') {
      board.remainderLocked = true;
      board.complete = true;
      board.bridgeSeg = board.div.steps.length;
      audio.girder();
      if (board.div.remainder > 0) {
        showPopup(`DEPLOY ${board.div.remainder}m REMAINDER RAMP!`, 'Cliff gap sealed', '#f0a020', 140);
      } else {
        showPopup('EXACT SPAN LOCK — R 0', 'Chasm fully bridged', '#7dffb0', 140);
      }
      award(player, 40);
      onBoardComplete(player);
    }
  }

  function onBoardComplete(player) {
    if (gameMode === 'versus') {
      // First finisher wins the race
      if (state === S.WIN) return;
      if (player) player.stars++;
    } else if (player) {
      player.stars++;
    }
    finishBridge(player);
  }

  function finishBridge(player) {
    state = S.WIN;
    trainX = -60;
    audio.horn();
    setTimeout(() => audio.fanfare(), 200);
    teamScore += 100 * combo;
    showPopup('HOVER-TRAIN CLEARED!', 'Architect Star earned — next contract inbound', '#f0c040', 200);
    updateHUD();
    setTimeout(() => {
      if (state !== S.WIN) return;
      if (Math.random() < 0.5 && tier < 3) tier++;
      players.forEach(p => { if (p.shields < 3) p.shields++; });
      startRound();
    }, 3000);
  }

  function trySelect(player, board) {
    if (!board || board.complete || state !== S.PLAY) return;
    const val = board.options[player.sel % board.options.length];

    if (board.phase === 'cal') {
      if (val === board.correct) {
        audio.wind();
        board.cal.shifted = true;
        award(player, 25);
        showPopup(
          `${board.cal.raw} ${board.cal.op} = ${board.cal.answer} m`,
          'Place-value shift locked · Begin chasm partitioning',
          '#7dffb0', 130
        );
        setTimeout(() => { if (!board.complete && board.phase === 'cal') beginDivision(board); }, 850);
      } else {
        const tip = board.cal.op === '×10'
          ? `×10 shifts digits LEFT and adds a 0. ${board.cal.raw} × 10 = ${board.cal.answer}, not ${val}!`
          : `÷10 shifts digits RIGHT (drop trailing 0). ${board.cal.raw} ÷ 10 = ${board.cal.answer}, not ${val}!`;
        mistake(player, tip);
      }
      return;
    }

    if (gameMode === 'coop') {
      const who = coopOwner(board.dmsb);
      if (player.id !== who) {
        audio.click();
        showPopup('HANDOFF REQUIRED',
          who === 0 ? 'P1 (Red) handles Divide & Subtract' : 'P2 (Blue) handles Multiply & Bring Down / Ramp',
          '#f0c040', 100);
        return;
      }
    }

    const step = board.div.steps[board.stepIdx];
    if (val === board.correct) {
      advance(board, player);
      return;
    }

    let tip = 'Recheck your engineering calc!';
    if (board.dmsb === 'D') {
      tip = (step.zeroPlaceholder || (step.working < board.div.divisor && step.q === 0))
        ? `${board.div.divisor} pillars cannot divide ${step.working} m into whole tens! Place a 0 placeholder on the roof before bringing down!`
        : `Divide: How many groups of ${board.div.divisor} fit in ${step.working}? Answer is ${step.q}, not ${val}.`;
    } else if (board.dmsb === 'M') {
      tip = `Check multiplication: ${step.q} × ${board.div.divisor} = ${step.product}, not ${val}!`;
    } else if (board.dmsb === 'S') {
      tip = val >= board.div.divisor
        ? `Remainder ${val} is greater than ${board.div.divisor} pillars — you can fit one more metre per span!`
        : `Subtract: ${step.working} − ${step.product} = ${step.rem}, not ${val}.`;
    } else if (board.dmsb === 'B') {
      tip = `Bring down the next digit: ${step.bringDown}, not ${val}.`;
    } else if (board.dmsb === 'R') {
      tip = board.div.remainder > 0 && val === 0
        ? `Cliff gap remains! Deploy the ${board.div.remainder} m REMAINDER RAMP.`
        : `Remainder must be ${board.div.remainder} m (less than ${board.div.divisor} pillars).`;
    }
    mistake(player, tip);
  }

  function handleAction(p) {
    const down = p.keys.action || p.gpAction;
    const pressed = down && !p.lastAction;
    p.lastAction = down;
    if (!pressed) return;
    audio.init();

    if (state === S.TITLE) {
      gameMode = titleSel === 0 ? 'coop' : 'versus';
      players.forEach(pl => { pl.shields = 3; pl.stars = 0; pl.score = 0; });
      teamScore = 0; combo = 1; tier = 1;
      startRound();
      return;
    }
    if (state === S.OVER) {
      state = S.TITLE;
      updateHUD();
      return;
    }
    if (state === S.WIN) return;
    const board = boardFor(p);
    if (board) trySelect(p, board);
  }

  function updateInput() {
    pollGamepads();
    if (state === S.TITLE) {
      for (const p of players) {
        if (p.cool > 0) p.cool--;
        const left = p.keys.left || p.stickX < -0.5;
        const right = p.keys.right || p.stickX > 0.5;
        if ((left || right) && p.cool <= 0) {
          titleSel = 1 - titleSel;
          p.cool = 12;
          audio.select();
        }
        handleAction(p);
      }
      return;
    }
    for (const p of players) {
      if (gameMode === 'versus' && !boards[p.id]) continue;
      const board = boardFor(p);
      if (!board) continue;
      const n = board.options.length || 4;
      if (p.cool > 0) p.cool--;
      const left = p.keys.left || p.stickX < -0.5;
      const right = p.keys.right || p.stickX > 0.5;
      const up = p.keys.up || p.stickY < -0.5;
      const down = p.keys.down || p.stickY > 0.5;
      if ((left || up) && p.cool <= 0) {
        p.sel = (p.sel - 1 + n) % n;
        p.cool = 10;
        audio.select();
      }
      if ((right || down) && p.cool <= 0) {
        p.sel = (p.sel + 1) % n;
        p.cool = 10;
        audio.select();
      }
      const cards = optionCards(n, p.id);
      const c = cards[p.sel % n];
      if (c) {
        p.x += (c.cx - p.x) * 0.3;
        p.y += (c.cy - p.y) * 0.3;
      }
      handleAction(p);
    }
  }

  function optionCards(n, pid) {
    const versus = gameMode === 'versus' && state !== S.TITLE;
    const zoneW = versus ? W * 0.46 : W * 0.92;
    const zoneX = versus ? (pid === 0 ? W * 0.02 : W * 0.52) : W * 0.04;
    const y = H * 0.88;
    const cw = Math.min(118, zoneW / n - 10);
    const total = n * cw + (n - 1) * 10;
    let x = zoneX + (zoneW - total) / 2;
    const cards = [];
    for (let i = 0; i < n; i++) {
      cards.push({ x, y: y - 34, w: cw, h: 60, cx: x + cw / 2, cy: y - 4 });
      x += cw + 10;
    }
    return cards;
  }

  /* ===================== DRAW ===================== */
  function initDecor() {
    clouds = Array.from({ length: 10 }, () => ({
      x: Math.random() * 1600, y: 40 + Math.random() * 160,
      s: 0.4 + Math.random() * 0.8, sp: 0.15 + Math.random() * 0.35
    }));
    islands = Array.from({ length: 5 }, (_, i) => ({
      x: 80 + i * 220, y: 80 + Math.random() * 70,
      w: 50 + Math.random() * 40, bob: Math.random() * 6
    }));
  }
  initDecor();

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#4aa3d8');
    g.addColorStop(0.45, '#1e5f96');
    g.addColorStop(1, '#0b2744');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const sx = W * 0.82, sy = H * 0.12;
    const sg = ctx.createRadialGradient(sx, sy, 8, sx, sy, 90);
    sg.addColorStop(0, 'rgba(255,230,150,0.95)');
    sg.addColorStop(0.45, 'rgba(255,200,80,0.3)');
    sg.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sx, sy, 90, 0, Math.PI * 2); ctx.fill();

    for (const c of clouds) {
      c.x += c.sp;
      if (c.x > W + 120) c.x = -120;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, 40 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x + 28 * c.s, c.y - 6 * c.s, 28 * c.s, 14 * c.s, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x - 24 * c.s, c.y + 2 * c.s, 26 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const isl of islands) {
      const by = isl.y + Math.sin(time * 0.02 + isl.bob) * 4;
      const x = ((isl.x + time * 0.05) % (W + 100)) - 20;
      ctx.fillStyle = '#3d5a40';
      ctx.beginPath();
      ctx.moveTo(x, by);
      ctx.quadraticCurveTo(x + isl.w * 0.5, by - 16, x + isl.w, by);
      ctx.lineTo(x + isl.w * 0.85, by + 20);
      ctx.quadraticCurveTo(x + isl.w * 0.5, by + 32, x + isl.w * 0.15, by + 20);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#6b8f71';
      ctx.beginPath();
      ctx.ellipse(x + isl.w * 0.5, by, isl.w * 0.42, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCliff(x, y, w, h, faceRight) {
    ctx.fillStyle = '#5a4a3a';
    ctx.beginPath();
    if (faceRight) {
      ctx.moveTo(x, y); ctx.lineTo(x + w, y + 8); ctx.lineTo(x + w * 0.9, y + h); ctx.lineTo(x, y + h);
    } else {
      ctx.moveTo(x + w, y); ctx.lineTo(x, y + 8); ctx.lineTo(x + w * 0.1, y + h); ctx.lineTo(x + w, y + h);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#4c8a4a';
    ctx.fillRect(faceRight ? x : x + 8, y - 5, w - 8, 8);
  }

  function drawBridge(board, ox, oy, bw, bh, label) {
    ctx.fillStyle = 'rgba(8,30,55,0.35)';
    ctx.strokeStyle = 'rgba(125,220,255,0.35)';
    ctx.lineWidth = 2;
    roundRect(ox, oy, bw, bh, 10); ctx.fill(); ctx.stroke();

    if (label) {
      ctx.fillStyle = '#9de8ff';
      ctx.font = '700 12px "Exo 2", sans-serif';
      ctx.fillText(label, ox + 12, oy + 16);
    }
    if (!board) return;

    const chasmTop = oy + bh * 0.32;
    const leftW = bw * 0.15, rightW = bw * 0.15;
    const gapX = ox + leftW, gapW = bw - leftW - rightW;
    const cliffH = bh * 0.5;
    drawCliff(ox + 6, chasmTop, leftW - 6, cliffH, true);
    drawCliff(ox + bw - rightW, chasmTop, rightW - 6, cliffH, false);

    const div = board.div;
    ctx.fillStyle = '#ffe9a0';
    ctx.font = '700 13px "Exo 2", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(
      div ? `${div.dividend} m chasm · ${div.divisor} pillars` : 'Calibrate stock…',
      ox + bw / 2, oy + 34
    );
    ctx.textAlign = 'left';

    const deckY = chasmTop + 6;
    const segs = div ? div.steps.length : 3;

    ctx.strokeStyle = 'rgba(220,230,240,0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(gapX, deckY - 36);
    ctx.quadraticCurveTo(gapX + gapW / 2, deckY - 64, gapX + gapW, deckY - 36);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(gapX, deckY + 5); ctx.lineTo(gapX + gapW, deckY + 5); ctx.stroke();
    ctx.setLineDash([]);

    const segW = gapW / Math.max(1, segs);
    const built = board.complete ? segs : board.bridgeSeg;
    for (let i = 0; i < built; i++) {
      const sx = gapX + i * segW;
      const col = ['#3de0c8', '#4ac8f0', '#6ae0ff'][i % 3];
      ctx.fillStyle = col;
      ctx.shadowColor = col; ctx.shadowBlur = 12;
      ctx.fillRect(sx + 2, deckY, segW - 4, 10);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#c8d0d8';
      ctx.fillRect(sx + segW - 3, deckY + 10, 5, cliffH * 0.32);
    }

    if (board.complete && div && div.remainder > 0) {
      const rx = gapX + gapW - 20;
      ctx.fillStyle = '#f0a020';
      ctx.shadowColor = '#f0a020'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(rx, deckY + 10); ctx.lineTo(rx + 22, deckY + 10); ctx.lineTo(rx + 22, deckY + 26);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff3c8';
      ctx.font = '700 11px "Exo 2", sans-serif';
      ctx.fillText(`R ${div.remainder}m`, rx - 6, deckY - 4);
    }

    const craneX = gapX + Math.min(built * segW, gapW - 16) + 8;
    const bob = Math.sin(time * 0.05) * 3;
    ctx.strokeStyle = '#f0c040'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(craneX, oy + 40 + bob); ctx.lineTo(craneX, deckY - 6); ctx.stroke();
    ctx.fillStyle = '#f0c040';
    ctx.fillRect(craneX - 14, oy + 34 + bob, 38, 12);
    ctx.fillStyle = '#ff8844';
    ctx.beginPath(); ctx.arc(craneX, deckY - 4, 5, 0, Math.PI * 2); ctx.fill();

    if (board.complete && state === S.WIN) {
      trainX += 3;
      const tx = gapX + ((trainX % (gapW + 80)) + gapW + 80) % (gapW + 80) - 40;
      ctx.fillStyle = '#e8f0ff'; ctx.fillRect(tx, deckY - 16, 36, 14);
      ctx.fillStyle = '#5ab0ff'; ctx.fillRect(tx + 4, deckY - 22, 16, 8);
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(tx + 8, deckY - 2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(tx + 28, deckY - 2, 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawCalibration(board, ox, oy, bw, bh) {
    ctx.fillStyle = 'rgba(4,20,40,0.72)';
    ctx.strokeStyle = 'rgba(125,220,255,0.5)';
    ctx.lineWidth = 2;
    roundRect(ox, oy, bw, bh, 10); ctx.fill(); ctx.stroke();
    if (!board?.cal) return;

    const cal = board.cal;
    ctx.fillStyle = '#9de8ff';
    ctx.font = '700 13px "Exo 2", sans-serif';
    ctx.fillText('ENGINEERING RAIL · PLACE VALUE [ Th | H | T | O ]', ox + 14, oy + 22);
    ctx.fillStyle = '#ffe9a0';
    ctx.font = '600 14px "Exo 2", sans-serif';
    ctx.fillText(cal.prompt, ox + 14, oy + 46);

    const places = ['Th', 'H', 'T', 'O'];
    const show = String(cal.shifted ? cal.answer : cal.raw).padStart(4, ' ');
    const trackX = ox + bw / 2 - 112;
    const trackY = oy + 88;

    for (let i = 0; i < 4; i++) {
      const px = trackX + i * 56;
      const lit = cal.shifted;
      ctx.fillStyle = lit ? 'rgba(60,140,90,0.45)' : 'rgba(30,80,120,0.5)';
      ctx.strokeStyle = lit ? '#7dffb0' : '#3db8e8';
      roundRect(px, trackY, 48, 56, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8ab';
      ctx.font = '700 11px "Exo 2", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(places[i], px + 24, trackY - 8);
      ctx.fillStyle = '#e8f4ff';
      ctx.font = '800 26px "JetBrains Mono", monospace';
      ctx.fillText(show[i] === ' ' ? '' : show[i], px + 24, trackY + 38);
      ctx.textAlign = 'left';
    }

    ctx.fillStyle = cal.op === '×10' ? '#7dffb0' : '#ffb07a';
    ctx.font = '700 15px "Exo 2", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(
      cal.op === '×10' ? '← SHIFT LEFT (×10) · insert trailing 0' : 'SHIFT RIGHT (÷10) · drop trailing 0 →',
      ox + bw / 2, trackY + 88
    );
    ctx.fillStyle = '#c8e8ff';
    ctx.font = '600 13px "Exo 2", sans-serif';
    ctx.fillText(`Lock calibrated metres for ${cal.raw} ${cal.op}`, ox + bw / 2, trackY + 112);
    ctx.textAlign = 'left';
  }

  function drawBracket(board, ox, oy, bw, bh) {
    ctx.fillStyle = 'rgba(4,20,40,0.75)';
    ctx.strokeStyle = 'rgba(125,220,255,0.5)';
    ctx.lineWidth = 2;
    roundRect(ox, oy, bw, bh, 10); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#9de8ff';
    ctx.font = '700 13px "Exo 2", sans-serif';
    ctx.fillText('BLUEPRINT · LONG DIVISION BRACKET', ox + 14, oy + 20);

    if (!board?.div) {
      ctx.fillStyle = '#8ab';
      ctx.font = '500 14px "JetBrains Mono", monospace';
      ctx.fillText('Calibrate girder stock first…', ox + 20, oy + 60);
      return;
    }

    const div = board.div;
    const cell = Math.min(24, (bw - 100) / Math.max(6, div.digits.length + 2));
    const baseX = ox + 64;
    const baseY = oy + 78;
    const mono = `700 ${Math.floor(cell * 0.85)}px "JetBrains Mono", monospace`;

    // Quotient
    ctx.font = mono;
    ctx.fillStyle = '#7dffb0';
    for (let i = 0; i < board.stampedQ.length; i++) {
      const col = div.steps[i].colEnd - 1;
      ctx.fillText(String(board.stampedQ[i]), baseX + col * cell, baseY - 30);
    }
    if (board.remainderLocked) {
      ctx.fillStyle = '#f0a020';
      ctx.fillText(`R${div.remainder}`, baseX + div.digits.length * cell + 8, baseY - 30);
    }

    // Bracket
    ctx.strokeStyle = '#c8e8ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(baseX - 6, baseY - 20);
    ctx.lineTo(baseX + div.digits.length * cell + 8, baseY - 20);
    ctx.moveTo(baseX - 6, baseY - 20);
    ctx.lineTo(baseX - 6, baseY + 6);
    ctx.stroke();

    ctx.fillStyle = '#ffe9a0';
    ctx.fillText(String(div.divisor), baseX - 28 - (String(div.divisor).length - 1) * 8, baseY);

    ctx.fillStyle = '#e8f4ff';
    for (let i = 0; i < div.digits.length; i++) {
      ctx.fillText(String(div.digits[i]), baseX + i * cell, baseY);
    }

    // Worked rows for completed DMS steps
    let rowY = baseY + 28;
    const maxShow = Math.min(board.doneM.length, board.stepIdx + (board.dmsb === 'R' || board.remainderLocked ? 1 : 0) + 1);
    for (let s = 0; s < board.doneM.length; s++) {
      const step = div.steps[s];
      const prod = String(step.product);
      const wStr = String(step.working);
      const prodCol = step.colEnd - prod.length;
      ctx.fillStyle = '#ff9b8a';
      ctx.fillText(`-${prod}`, baseX + prodCol * cell - cell * 0.35, rowY);
      ctx.strokeStyle = 'rgba(200,230,255,0.45)';
      ctx.beginPath();
      ctx.moveTo(baseX + step.colStart * cell - 2, rowY + 5);
      ctx.lineTo(baseX + step.colEnd * cell, rowY + 5);
      ctx.stroke();
      rowY += 22;

      if (s < board.doneS.length) {
        let showVal;
        if (s < board.brought && div.steps[s + 1]) {
          showVal = String(div.steps[s + 1].working);
          const next = div.steps[s + 1];
          ctx.fillStyle = '#9de8ff';
          ctx.fillText(showVal, baseX + next.colStart * cell, rowY);
        } else {
          showVal = String(board.doneS[s]);
          ctx.fillStyle = '#9de8ff';
          ctx.fillText(showVal, baseX + (step.colEnd - showVal.length) * cell, rowY);
        }
        rowY += 24;
      }
    }

    // Active working spotlight
    if (board.phase === 'div' && !board.complete && board.dmsb !== 'R') {
      const step = div.steps[board.stepIdx];
      if (step && board.dmsb === 'D') {
        ctx.strokeStyle = '#f0c040';
        ctx.lineWidth = 2;
        ctx.strokeRect(baseX + step.colStart * cell - 3, baseY - cell + 4, String(step.working).length * cell + 4, cell + 4);
      }
    }

    // D-M-S-B strip
    const labels = ['1. DIVIDE', '2. MULTIPLY', '3. SUBTRACT', '4. BRING DOWN'];
    const stages = ['D', 'M', 'S', 'B'];
    const active = board.dmsb === 'R' ? 3 : Math.max(0, stages.indexOf(board.dmsb));
    const sy = oy + bh - 46;
    for (let i = 0; i < 4; i++) {
      const on = board.phase === 'div' && i === active;
      const x = ox + 12 + i * ((bw - 24) / 4);
      ctx.fillStyle = on ? 'rgba(240,192,64,0.35)' : 'rgba(20,40,60,0.55)';
      ctx.strokeStyle = on ? '#f0c040' : 'rgba(100,140,170,0.45)';
      roundRect(x, sy, (bw - 32) / 4, 30, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = on ? '#ffe9a0' : '#8ab';
      ctx.font = '700 10px "Exo 2", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(labels[i], x + (bw - 32) / 8, sy + 19);
      ctx.textAlign = 'left';
    }

    if (gameMode === 'coop' && board.phase === 'div') {
      const who = coopOwner(board.dmsb);
      ctx.fillStyle = who === 0 ? '#ff6b5a' : '#5ab0ff';
      ctx.font = '700 12px "Exo 2", sans-serif';
      ctx.fillText(who === 0 ? '► P1 turn (Divide / Subtract)' : '► P2 turn (Multiply / Bring Down)', ox + 14, oy + 40);
    }

    // Compact answer preview
    ctx.fillStyle = '#8ab';
    ctx.font = '600 11px "JetBrains Mono", monospace';
    const qSoFar = board.stampedQ.join('') || '…';
    ctx.fillText(`roof: ${qSoFar}${board.remainderLocked ? ` R${div.remainder}` : ''}`, ox + 14, oy + bh - 56);
  }

  function drawOptions(board, pid) {
    if (!board?.options) return;
    const cards = optionCards(board.options.length, pid);
    const label = board.phase === 'cal' ? 'LOCK CALIBRATED METRES'
      : board.dmsb === 'D' ? 'STAMP QUOTIENT DIGIT [D]'
      : board.dmsb === 'M' ? 'LOCK STEEL USED [M]'
      : board.dmsb === 'S' ? 'LOCK REMAINING GAP [S]'
      : board.dmsb === 'B' ? 'BRING DOWN NEXT DIGIT [B]'
      : (board.div.remainder > 0 ? `DEPLOY ${board.div.remainder}m REMAINDER RAMP` : 'LOCK R 0 — EXACT SPAN');

    ctx.fillStyle = '#9de8ff';
    ctx.font = '700 12px "Exo 2", sans-serif';
    ctx.textAlign = 'center';
    const cx = gameMode === 'versus' ? (pid === 0 ? W * 0.25 : W * 0.75) : W / 2;
    ctx.fillText(label, cx, H * 0.785);
    ctx.textAlign = 'left';

    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      const selected = players.some(p => boardFor(p) === board && (p.sel % board.options.length) === i);
      ctx.fillStyle = selected ? 'rgba(240,192,64,0.25)' : 'rgba(10,35,60,0.88)';
      ctx.strokeStyle = selected ? '#f0c040' : '#3db8e8';
      ctx.lineWidth = selected ? 3 : 2;
      roundRect(c.x, c.y, c.w, c.h, 8); ctx.fill(); ctx.stroke();

      let text = String(board.options[i]);
      if (board.phase === 'cal') text = `${board.options[i]} m`;
      else if (board.dmsb === 'R') text = board.options[i] === 0 ? 'R 0' : `R ${board.options[i]}m`;

      ctx.fillStyle = '#e8f4ff';
      ctx.font = '800 17px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(text, c.cx, c.y + 38);
      ctx.textAlign = 'left';
    }
  }

  function drawReticles() {
    if (state === S.TITLE) return;
    for (const p of players) {
      if (gameMode === 'versus' && !boards[p.id]) continue;
      ctx.strokeStyle = p.color;
      ctx.shadowColor = p.glow; ctx.shadowBlur = 10;
      ctx.lineWidth = 2.5;
      const r = 15;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p.x - r - 4, p.y); ctx.lineTo(p.x - 4, p.y);
      ctx.moveTo(p.x + 4, p.y); ctx.lineTo(p.x + r + 4, p.y);
      ctx.moveTo(p.x, p.y - r - 4); ctx.lineTo(p.x, p.y - 4);
      ctx.moveTo(p.x, p.y + 4); ctx.lineTo(p.x, p.y + r + 4);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = p.color;
      ctx.font = '700 11px "Exo 2", sans-serif';
      ctx.fillText(p.name, p.x - 8, p.y - 20);
    }
  }

  function drawTitle() {
    ctx.fillStyle = 'rgba(4,18,36,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7fdfff';
    ctx.font = '800 42px "Exo 2", sans-serif';
    ctx.shadowColor = 'rgba(61,184,232,0.55)'; ctx.shadowBlur = 16;
    ctx.fillText('SKYBRIDGE BUILDER', W / 2, H * 0.26);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffe9a0';
    ctx.font = '700 20px "Exo 2", sans-serif';
    ctx.fillText('Span & Pillar Engineer', W / 2, H * 0.26 + 34);
    ctx.fillStyle = '#c8e8ff';
    ctx.font = '600 14px "Exo 2", sans-serif';
    ctx.fillText('Primary 3–4 · Place-value ×10 / ÷10 · Long Division D-M-S-B', W / 2, H * 0.26 + 60);

    const modes = [
      { t: 'CO-OP CONSTRUCTION', s: 'P1: Divide & Subtract · P2: Multiply & Bring Down · Shared combo' },
      { t: 'COMPETITIVE SPAN RACE', s: 'Parallel skybridges · Same contract · First hover-train wins' }
    ];
    for (let i = 0; i < 2; i++) {
      const x = W / 2 - 260 + i * 280, y = H * 0.5, on = titleSel === i;
      ctx.fillStyle = on ? 'rgba(240,192,64,0.2)' : 'rgba(10,35,60,0.85)';
      ctx.strokeStyle = on ? '#f0c040' : '#3db8e8';
      ctx.lineWidth = on ? 3 : 2;
      roundRect(x, y, 240, 100, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = on ? '#ffe9a0' : '#9de8ff';
      ctx.font = '800 14px "Exo 2", sans-serif';
      ctx.fillText(modes[i].t, x + 120, y + 36);
      ctx.fillStyle = '#a8c8e0';
      ctx.font = '600 11px "Exo 2", sans-serif';
      const words = modes[i].s.split(' ');
      let line = '', yy = y + 58;
      for (const w of words) {
        const test = line + w + ' ';
        if (ctx.measureText(test).width > 210) { ctx.fillText(line, x + 120, yy); line = w + ' '; yy += 14; }
        else line = test;
      }
      ctx.fillText(line, x + 120, yy);
    }

    ctx.fillStyle = '#e8f4ff';
    ctx.font = '600 13px "Exo 2", sans-serif';
    ctx.fillText('P1: WASD + F/Space  ·  P2: Arrows + Enter  ·  Gamepads: D-Pad + A', W / 2, H * 0.76);
    ctx.fillText('Press ACTION to start', W / 2, H * 0.76 + 24);
    ctx.textAlign = 'left';
  }

  function drawPopup() {
    if (!popup || popup.t <= 0) return;
    popup.t--;
    const a = Math.min(1, popup.t / 18, (popup.max - popup.t) / 12 + 0.65);
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(4,20,40,0.85)';
    roundRect(W / 2 - 290, H * 0.13, 580, 66, 10); ctx.fill();
    ctx.strokeStyle = popup.color; ctx.lineWidth = 2;
    roundRect(W / 2 - 290, H * 0.13, 580, 66, 10); ctx.stroke();
    ctx.fillStyle = popup.color;
    ctx.font = '800 17px "Exo 2", sans-serif';
    ctx.fillText(popup.text, W / 2, H * 0.13 + 28);
    if (popup.sub) {
      ctx.fillStyle = '#c8e8ff';
      ctx.font = '600 12px "Exo 2", sans-serif';
      ctx.fillText(popup.sub, W / 2, H * 0.13 + 50);
    }
    ctx.restore();
  }

  function drawSparks() {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.2; s.life--;
      ctx.fillStyle = `rgba(255,${140 + s.life},70,${s.life / 28})`;
      ctx.fillRect(s.x, s.y, 3, 3);
      if (s.life <= 0) sparks.splice(i, 1);
    }
  }

  /* pointer */
  canvas.addEventListener('pointerdown', e => {
    audio.init();
    const rect = canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (canvas.width / rect.width);
    const py = (e.clientY - rect.top) * (canvas.height / rect.height);

    if (state === S.TITLE) {
      for (let i = 0; i < 2; i++) {
        const x = W / 2 - 260 + i * 280, y = H * 0.5;
        if (px >= x && px <= x + 240 && py >= y && py <= y + 100) {
          if (titleSel === i) {
            players[0].keys.action = 1; handleAction(players[0]);
            players[0].keys.action = 0; players[0].lastAction = 0;
          } else { titleSel = i; audio.select(); }
          return;
        }
      }
      players[0].keys.action = 1; handleAction(players[0]);
      players[0].keys.action = 0; players[0].lastAction = 0;
      return;
    }

    const p = players[0];
    const board = boardFor(p);
    if (!board || state !== S.PLAY) return;
    const cards = optionCards(board.options.length, p.id);
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) {
        p.sel = i; p.x = c.cx; p.y = c.cy;
        trySelect(p, board);
        return;
      }
    }
  });

  /* ===================== LOOP ===================== */
  function frame() {
    time++;
    updateInput();

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.86;
      if (shake < 0.4) shake = 0;
      if (shake > 5) {
        sparks.push({
          x: W * 0.5 + (Math.random() - 0.5) * 220,
          y: H * 0.4, vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 4, life: 24
        });
      }
    }

    drawSky();

    if (state === S.TITLE) {
      drawBridge(blankBoard(), W * 0.12, H * 0.08, W * 0.76, H * 0.18, '');
      drawTitle();
    } else if (gameMode === 'versus') {
      for (let i = 0; i < 2; i++) {
        const ox = i === 0 ? W * 0.02 : W * 0.52;
        drawBridge(boards[i], ox, H * 0.055, W * 0.46, H * 0.30, i === 0 ? 'P1 BRIDGE' : 'P2 BRIDGE');
        if (boards[i].phase === 'cal') drawCalibration(boards[i], ox, H * 0.37, W * 0.46, H * 0.36);
        else drawBracket(boards[i], ox, H * 0.37, W * 0.46, H * 0.36);
        drawOptions(boards[i], i);
      }
      drawReticles();
    } else {
      drawBridge(boards[0], W * 0.02, H * 0.055, W * 0.50, H * 0.40, 'LIVE SKYBRIDGE CHASM');
      if (boards[0].phase === 'cal') {
        drawCalibration(boards[0], W * 0.54, H * 0.055, W * 0.44, H * 0.40);
        ctx.fillStyle = 'rgba(4,20,40,0.55)';
        roundRect(W * 0.02, H * 0.47, W * 0.50, H * 0.24, 10); ctx.fill();
        ctx.fillStyle = '#9de8ff';
        ctx.font = '700 14px "Exo 2", sans-serif';
        ctx.fillText('Shift digits on the illuminated rail, then lock the metre total.', W * 0.04, H * 0.54);
        ctx.fillStyle = '#c8e8ff';
        ctx.font = '600 13px "Exo 2", sans-serif';
        ctx.fillText('×10 → digits LEFT + trailing 0     ÷10 → digits RIGHT, drop ones 0', W * 0.04, H * 0.59);
        ctx.fillStyle = '#ffe9a0';
        ctx.fillText('Co-op: either engineer may lock calibration. Then P1/P2 hand off D-M-S-B.', W * 0.04, H * 0.65);
      } else {
        drawBracket(boards[0], W * 0.54, H * 0.055, W * 0.44, H * 0.66);
      }
      drawOptions(boards[0], 0);
      drawReticles();
    }

    if (state === S.OVER) {
      ctx.fillStyle = 'rgba(4,10,20,0.65)';
      ctx.fillRect(0, 0, W, H);
    }

    drawPopup();
    drawSparks();
    ctx.restore();
    requestAnimationFrame(frame);
  }

  players[0].x = W * 0.35; players[0].y = H * 0.85;
  players[1].x = W * 0.65; players[1].y = H * 0.85;
  updateHUD();
  showPopup('SKYBRIDGE BUILDER', 'Select mode · Calibrate · Partition the chasm', '#7fdfff', 180);
  requestAnimationFrame(frame);
})();
</script>
</body>
