  if (game.stage < 2) return { frac: part, question: false, opening: false };
  if (game.stage === 2) {
    const active = game.sliceWhich === which;
    const done = game.sliceWhich > which || (active && game.slicePhase === 'count' && !game.cutting);
    if (active && game.cutting) return { frac: part, question: false, subdiv: true };
    if (active && game.slicePhase === 'count') return { frac: eq, question: true };
    if (done) return { frac: eq, question: false };
    return { frac: part, question: false };
  }
  if (which === 0 && (game.regrouped || game.unboxing)) {
    if (game.unboxing && !game.regrouped) return { frac: s.aEq, opening: true };
    return { frac: { w: o.a.w - 1, n: s.aN + s.L, d: s.L, topping: part.topping }, looseNote: true };
  }
  if (game.stage >= 3) return { frac: eq, question: false };
  return { frac: part };
}

function pizzaCaption(which, vis) {
  const o = game.order;
  const part = which === 0 ? o.a : o.b;
  const name = TOPPING[part.topping].label;
  if (vis.question) return { label: name, sub: 'Count the colored slices' };
  if (vis.looseNote) return { label: name, sub: `${game.sol.aN + game.sol.L} loose slices` };
  return { label: name, sub: fracText(vis.frac) };
}

function drawArena() {
  const ui = game.ui;
  if (!game.order || !ui.slotA && !ui.slotM) return;
  if (game.stage === 4 || game.mode === 'success') {
    const shown = game.mode === 'success' ? game.sol.final : carryDisplay(game.sol.combined);
    const topping = game.order.op === '+' ? 'combo' : game.order.a.topping;
    drawFractionModel(ui.slotM, { ...shown, topping }, {
      label: game.mode === 'success' ? 'Ready to serve' : 'Pizza we have now',
      sub: game.mode === 'success' ? fracText(game.sol.final) : `from ${fracText(game.sol.combined)}`,
    });
    return;
  }
  const va = visualFrac(0);
  const vb = visualFrac(1);
  if (va.subdiv && ui.slotA) {
    const slot = ui.slotA;
    const r = clamp(Math.min(slot.w * 0.28, slot.h * 0.32), 40, 110);
    const cap = pizzaCaption(0, va);
    drawSubdividing(slot.x + slot.w / 2, slot.y + slot.h * 0.42, r, game.order.a, game.sol.L, game.animP);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = font(16, 800);
    ctx.fillText(cap.label, slot.x + slot.w / 2, slot.y + slot.h - 28);
    ctx.font = font(13, 700);
    ctx.fillStyle = '#7a4b32';
    ctx.fillText(cap.sub, slot.x + slot.w / 2, slot.y + slot.h - 12);
  } else if (ui.slotA) {
    const cap = pizzaCaption(0, va);
    drawFractionModel(ui.slotA, va.frac, { label: cap.label, sub: cap.sub, opening: va.opening, question: va.question });
  }
  if (vb.subdiv && ui.slotB) {
    const slot = ui.slotB;
    const r = clamp(Math.min(slot.w * 0.28, slot.h * 0.32), 40, 110);
    drawSubdividing(slot.x + slot.w / 2, slot.y + slot.h * 0.42, r, game.order.b, game.sol.L, game.animP);
  } else if (ui.slotB) {
    const cap = pizzaCaption(1, vb);
    const small = game.stage === 2 && game.sliceWhich !== 1;
    drawFractionModel(ui.slotB, vb.frac, { label: cap.label, sub: cap.sub, question: vb.question, small });
  }
  if ((game.stage === 1 || game.stage === 3) && ui.slotA && ui.slotB && game.mode === 'play') {
    ctx.fillStyle = INK;
    ctx.font = font(game.ui.narrow ? 28 : 42, 800);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(game.order.op === '+' ? '+' : '−', (ui.slotA.x + ui.slotA.w + ui.slotB.x) / 2, ui.slotA.y + ui.slotA.h * 0.42);
  }
}

function carryDisplay(f) {
  const w = f.w + Math.floor(f.n / f.d);
  const n = ((f.n % f.d) + f.d) % f.d;
  return { w, n, d: n === 0 ? 1 : f.d };
}

function buttonChrome(r, opts) {
  const hover = isHovered(r);
  const lift = hover ? 3 : 0;
  ctx.save();
  ctx.translate(0, -lift);
  roundRect(r.x, r.y + 5, r.w, r.h, 16);
  ctx.fillStyle = 'rgba(74,36,24,0.18)';
  ctx.fill();
  roundRect(r.x, r.y, r.w, r.h, 16);
  ctx.fillStyle = opts && opts.good ? '#d9f5d0' : opts && opts.bad ? '#ffd0c8' : opts && opts.accent ? '#ffe08a' : CREAM;
  ctx.fill();
  ctx.lineWidth = 4;
  const hovers = hoveringPlayers(r);
  ctx.strokeStyle = hovers.length ? hovers[0].color : INK;
  ctx.stroke();
  hovers.forEach((p, i) => {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(r.x + 16 + i * 14, r.y + 14, 5, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
  return lift;
}

function isHovered(r) {
  if (!r) return false;
  if (input.mouse.on && pointIn(input.mouse, r, 0)) return true;
  return PLAYERS.some((p) => pointIn(p, r, 8));
}

function hoveringPlayers(r) {
  return PLAYERS.filter((p) => pointIn(p, r, 8));
}

function drawOptionContent(r, opt, lift) {
  if (!opt) return;
  const cy = r.y + r.h / 2 + 6 - lift;
  const cx = r.x + r.w / 2;
  if (game.stage === 1 && opt.type === 'num') {
    drawCutter(cx, cy - 6, Math.min(34, r.h * 0.28), opt.n);
    return;
  }
  const size = Math.min(S(34), r.h * 0.46);
  const w = measureFrac(opt, size);
  if (game.stage === 4) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.08);
    ctx.beginPath();
    ctx.arc(0, 0, Math.min(r.w, r.h) * 0.32, 0, Math.PI * 2);
    ctx.strokeStyle = TOMATO;
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, Math.min(r.w, r.h) * 0.26, 0, Math.PI * 2);
    ctx.stroke();
    drawFrac(-w / 2, 2, opt, size * 0.85, TOMATO);
    ctx.restore();
    return;
  }
  drawFrac(cx - w / 2, cy, opt, size, INK);
}

function drawCutter(x, y, r, n) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#c5ccd4';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 3;
  ctx.stroke();
  const ang = -0.95;
  const hx = Math.cos(ang);
  const hy = Math.sin(ang);
  ctx.beginPath();
  ctx.moveTo(hx * r, hy * r);
  ctx.lineTo(hx * (r + 16), hy * (r + 16));
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(hx * (r + 16), hy * (r + 16), 4.5, 0, Math.PI * 2);
  ctx.fillStyle = '#8d96a3';
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.font = font(r * 0.9, 800);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(n), 0, 1);
  ctx.restore();
}

function drawSliceToken(r, topping, eaten) {
  ctx.save();
  roundRect(r.x, r.y, r.w, r.h, 12);
  ctx.fillStyle = eaten ? '#f0e2d2' : CREAM;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, Math.min(r.w, r.h) * 0.34, -Math.PI * 0.15, Math.PI * 0.7);
  ctx.closePath();
  ctx.fillStyle = eaten ? '#e7d3b0' : CHEESE;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.stroke();
  if (!eaten) drawTopping(topping, 4, 2, Math.min(16, r.w * 0.4));
  if (eaten) {
    ctx.fillStyle = 'rgba(74,36,24,0.35)';
    ctx.font = font(10, 800);
    ctx.textAlign = 'center';
    ctx.fillText('yum', 0, r.h * 0.28);
  }
  ctx.restore();
}

function pieceTopping(piece) {
  return piece.who === 'a' ? game.order.a.topping : game.order.b.topping;
}

function drawZoneLabel(zone, text) {
  if (!zone) return;
  ctx.fillStyle = INK;
  ctx.font = font(13, 800);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(text, zone.x + 8, zone.y + 4);
}

function drawStation() {
  const ui = game.ui;
  if (game.mode === 'title' || game.mode === 'finale') return;
  roundRect(10, ui.stationY + 2, ui.W - 20, ui.station - 8, 18);
  ctx.fillStyle = '#8a4b2b';
  ctx.fill();
  ctx.strokeStyle = '#4e2416';
  ctx.lineWidth = 4;
  ctx.stroke();
  if (!ui.narrow) {
    drawPerson(ui.rosa.x + ui.rosa.w / 2, ui.rosa.y + ui.rosa.h * 0.95, 0.5, {
      skin: '#f1c27d', hair: '#6b2410', shirt: '#f4f4f4', style: 'bob',
    }, 'happy', true);
  }
  const prompt = game.mode === 'play' ? promptText() : game.mode === 'success' ? 'Beautiful service!' : 'We can remake that order.';
  ctx.fillStyle = CREAM;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const lines = wrap(prompt, ui.prompt.w, font(ui.narrow ? 14 : 18, 800));
  ctx.font = font(ui.narrow ? 14 : 18, 800);
  lines.slice(0, 3).forEach((ln, i) => ctx.fillText(ln, ui.prompt.x, ui.prompt.y + i * (ui.narrow ? 16 : 20)));

  if (game.mode !== 'play' || game.help) return;
  const marked = (opt, id) => {
    if (!game.mark || game.waitT <= 0) return null;
    if (game.mark.key !== (opt ? optKey(opt) : id)) return null;
    return game.mark.good ? 'good' : 'bad';
  };
  if (ui.roll) {
    const lift = buttonChrome(ui.roll, { accent: true });
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = font(S(22), 800);
    const m = game.sliceWhich === 0 ? game.sol.ma : game.sol.mb;
    ctx.fillText(m === 1 ? 'Check this pizza' : 'Roll the cutter', ui.roll.x + ui.roll.w / 2, ui.roll.y + ui.roll.h / 2 - lift);
  }
  if (ui.unbox) {
    const lift = buttonChrome(ui.unbox, { accent: true });
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = font(S(22), 800);
    ctx.textBaseline = 'middle';
    ctx.fillText('Unbox Whole Pizza', ui.unbox.x + ui.unbox.w / 2, ui.unbox.y + ui.unbox.h / 2 - 8 - lift);
    ctx.font = font(14, 700);
    ctx.fillStyle = '#7a4b32';
    ctx.fillText(`Opens into ${game.sol.L}/${game.sol.L} loose slices`, ui.unbox.x + ui.unbox.w / 2, ui.unbox.y + ui.unbox.h / 2 + 18 - lift);
  }
  if (ui.anyway) {
    const state = marked(null, 'anyway');
    const lift = buttonChrome(ui.anyway, { bad: state === 'bad' });
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = font(16, 800);
    const linesA = wrap('Subtract anyway', ui.anyway.w - 20, font(16, 800));
    linesA.forEach((ln, i) => ctx.fillText(ln, ui.anyway.x + ui.anyway.w / 2, ui.anyway.y + ui.anyway.h / 2 - lift + i * 18));
  }
  ui.options.forEach((rect, i) => {
    const opt = game.options[i];
    const state = marked(opt);
    const lift = buttonChrome(rect, { good: state === 'good', bad: state === 'bad' });
    drawOptionContent(rect, opt, lift);
  });
  if (game.asmMode === 'hands') {
    [ui.sourceZone, ui.plateZone, ui.boxZone].forEach((zone) => {
      if (!zone) return;
      roundRect(zone.x, zone.y + 22, zone.w, zone.h - 28, 12);
      ctx.fillStyle = 'rgba(255,247,234,0.12)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,247,234,0.55)';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
    drawZoneLabel(ui.sourceZone, 'Loose slices');
    drawZoneLabel(ui.plateZone, "Chef's plate");
    const inside = game.order.op === '+'
      ? game.pieces.filter((p) => p.inBox).length
      : game.pieces.filter((p) => !p.eaten).length;
    drawZoneLabel(ui.boxZone, game.order.op === '+' ? `Takeaway box · ${inside}` : `Still in the box · ${inside}`);
    game.pieces.forEach((piece, i) => {
      const r = game.pieceRects[i];
      if (!r) return;
      if (input.drag && input.drag.piece === piece) return;
      drawSliceToken(r, pieceTopping(piece), piece.eaten);
    });
    if (ui.close) {
      const lift = buttonChrome(ui.close, { accent: true });
      ctx.fillStyle = INK;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = font(16, 800);
      const ls = wrap('Close the box', ui.close.w - 16, font(16, 800));
      ls.forEach((ln, i) => ctx.fillText(ln, ui.close.x + ui.close.w / 2, ui.close.y + ui.close.h / 2 - lift + (i - (ls.length - 1) / 2) * 18));
    }
    if (input.drag && input.drag.piece) {
      const s = 48;
      drawSliceToken({
        x: input.drag.x - s / 2,
        y: input.drag.y - s / 2,
        w: s,
        h: s,
      }, pieceTopping(input.drag.piece), input.drag.piece.eaten);
    }
  }
}

function drawBanner() {
  if (!game.feedback || game.waitT <= 0 || game.mode !== 'play') return;
  const ui = game.ui;
  const maxW = Math.min(760, ui.W - 80);
  const fnt = font(ui.narrow ? 15 : 18, 800);
  const lines = wrap(game.feedback, maxW - 36, fnt);
  const h = 22 + lines.length * 22;
  const w = maxW;
  const x = (ui.W - w) / 2;
  const y = ui.arena.y + 8;
  roundRect(x, y, w, h, 14);
  ctx.fillStyle = game.feedbackBad ? '#fff1ec' : '#eefae8';
  ctx.fill();
  ctx.strokeStyle = game.feedbackBad ? TOMATO : BASIL;
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.font = fnt;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lines.forEach((ln, i) => ctx.fillText(ln, ui.W / 2, y + 18 + i * 22));
}

function drawRibbon() {
  if (game.ribbonT <= 0 || !game.ribbon || game.mode !== 'play' || !game.ui.arena) return;
  const ui = game.ui;
  ctx.save();
  ctx.globalAlpha = clamp(game.ribbonT, 0, 1);
  ctx.font = font(15, 800);
  const w = Math.min(ctx.measureText(game.ribbon).width + 36, Math.min(420, ui.arena.w - 16));
  const h = 32;
  const x = ui.arena.x + (ui.arena.w - w) / 2;
  const pieBottom = ui.arena.y + ui.arena.h * 0.42 + Math.min(ui.arena.h * 0.3, 96);
  const y = clamp(pieBottom + 6, ui.arena.y + 4, ui.arena.y + ui.arena.h - h - 36);
  roundRect(x, y, w, h, 12);
  ctx.fillStyle = TOMATO;
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(game.ribbon, x + w / 2, y + h / 2 + 1);
  ctx.restore();
}

function drawFx() {
  fx.dust.forEach((p) => {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    ctx.fillStyle = '#fffaf0';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  fx.splats.forEach((p) => {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(74,36,24,0.3)';
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  fx.confetti.forEach((p) => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  });
  fx.floats.forEach((p) => {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.font = font(18, 800);
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
  });
  ctx.globalAlpha = 1;
}

function drawReticle(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-22, 0);
  ctx.lineTo(-8, 0);
  ctx.moveTo(8, 0);
  ctx.lineTo(22, 0);
  ctx.moveTo(0, -22);
  ctx.lineTo(0, -8);
  ctx.moveTo(0, 8);
  ctx.lineTo(0, 22);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  roundRect(-10, -30, 20, 12, 3);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = p.color;
  ctx.fillRect(-7, -34, 14, 6);
  ctx.fillStyle = INK;
  ctx.font = font(10, 800);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.name, 0, 30);
  ctx.restore();
}

function drawCard(x, y, w, h) {
  roundRect(x, y, w, h, 22);
  ctx.fillStyle = 'rgba(255, 250, 242, 0.96)';
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 5;
  ctx.stroke();
}

function drawTitle() {
  const ui = game.ui;
  const card = ui.card;
  if (!card) return;
  const { x, y, w, h } = card;
  drawCard(x, y, w, h);
  ctx.textAlign = 'center';
  ctx.fillStyle = TOMATO;
  ctx.font = font(ui.narrow ? 28 : 44, 800);
  ctx.textBaseline = 'top';
  ctx.fillText('Pizza Slicer Express', ui.W / 2, y + 22);
  ctx.fillStyle = INK;
  ctx.font = font(ui.narrow ? 16 : 22, 800);
  ctx.fillText('Fraction Pizzeria', ui.W / 2, y + (ui.narrow ? 58 : 74));
  ctx.font = font(ui.narrow ? 13 : 16, 700);
  ctx.fillStyle = '#7a4b32';
  const sub = wrap('Pick a year. Every customer brings a new fraction. Three lost customers close the kitchen.', w - 72, font(ui.narrow ? 13 : 16, 700));
  sub.forEach((ln, i) => ctx.fillText(ln, ui.W / 2, y + (ui.narrow ? 86 : 108) + i * 20));
  const stepsY = y + (ui.narrow ? 132 : 156);
  const labels = ['1  Common denominator', '2  Reslice the pizzas', '3  Add or subtract tops', '4  Simplify and stamp'];
  ctx.font = font(ui.narrow ? 13 : 16, 800);
  ctx.fillStyle = INK;
  if (ui.narrow) {
    labels.forEach((ln, i) => ctx.fillText(ln, ui.W / 2, stepsY + i * 20));
  } else {
    labels.forEach((ln, i) => {
      const col = i % 2;
      const row = Math.floor(i / 2);
      ctx.textAlign = 'left';
      ctx.fillText(ln, x + 70 + col * (w / 2), stepsY + row * 28);
    });
    ctx.textAlign = 'center';
  }
  const yearTop = ui.years && ui.years.length ? ui.years[0].y : y + h - 140;
  const crewY = Math.max(stepsY + (ui.narrow ? 92 : 70), yearTop - (ui.narrow ? 108 : 120));
  const crew = [
    { ...PLAYERS[0], person: { skin: '#f6c99a', hair: '#3a2418', shirt: '#ff4b4b', style: 'short' }, keys: 'Arrows + Space' },
    { ...PLAYERS[1], person: { skin: '#f1c27d', hair: '#1c1c1c', shirt: '#3c8dff', style: 'bob' }, keys: 'WASD + F' },
    { ...PLAYERS[2], person: { skin: '#e0ac69', hair: '#6b2410', shirt: '#e0a020', style: 'curly' }, keys: 'IJKL + H' },
  ];
  if (crewY + 70 < yearTop) {
    crew.forEach((c, i) => {
      const cx = x + w * (0.2 + i * 0.3);
      drawPerson(cx, crewY, ui.narrow ? 0.4 : 0.5, c.person, 'happy', true);
      ctx.fillStyle = c.color;
      ctx.font = font(12, 800);
      ctx.textAlign = 'center';
      ctx.fillText(c.name, cx, crewY + (ui.narrow ? 42 : 52));
      ctx.fillStyle = INK;
      ctx.font = font(11, 700);
      ctx.fillText(c.keys, cx, crewY + (ui.narrow ? 56 : 68));
    });
  }
  (ui.years || []).forEach((rect) => {
    const year = yearInfo(rect.id);
    const on = game.difficulty === year.id;
    const lift = buttonChrome(rect, { accent: on });
    ctx.fillStyle = INK;
    ctx.font = font(ui.narrow ? 16 : 18, 800);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(year.name, rect.x + rect.w / 2, rect.y + rect.h * 0.38 - lift);
    ctx.fillStyle = '#7a4b32';
    ctx.font = font(ui.narrow ? 11 : 13, 700);
    ctx.fillText(year.line, rect.x + rect.w / 2, rect.y + rect.h * 0.72 - lift);
  });
  if (ui.start) {
    const lift = buttonChrome(ui.start, { accent: true });
    ctx.fillStyle = INK;
    ctx.font = font(ui.narrow ? 18 : 22, 800);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`Open ${yearInfo(game.difficulty).name}`, ui.start.x + ui.start.w / 2, ui.start.y + ui.start.h / 2 - lift);
  }
}

function drawHelp() {
  const ui = game.ui;
  ctx.fillStyle = 'rgba(50, 24, 16, 0.45)';
  ctx.fillRect(0, 0, ui.W, ui.H);
  const w = Math.min(640, ui.W - 30);
  const h = Math.min(460, ui.H - 30);
  const x = (ui.W - w) / 2;
  const y = (ui.H - h) / 2;
  drawCard(x, y, w, h);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = INK;
  ctx.font = font(24, 800);
  ctx.fillText('How this kitchen works', x + 24, y + 20);
  const lines = [
    '1. Pick the least common multiple — a number both denominators divide into, the smallest one.',
    '2. Reslice. Multiply the numerator by the same number you multiplied the denominator.',
    '3. Add or subtract the numerators. The denominator stays. If you cannot subtract, unbox a whole pizza.',
    '4. Stamp the simplest form. Pull out wholes, then divide top and bottom by the same number.',
    'P1 red: arrow keys and Space, or gamepad 1.  P2 blue: WASD and F, or gamepad 2.',
    'P3 yellow: I J K L and H, or gamepad 3. The bottom face button is the action button.',
    'On small orders you can drag slices into the box. A click or the action button transfers a slice too.',
    'The till is shared. Each new customer has less time. After 3 customers leave, the kitchen closes.',
    'Choose Primary 4, 5, or 6. Every order is a new fraction, so the answer has to be worked out.',
  ];
  ctx.font = font(14, 700);
  let ly = y + 64;
  lines.forEach((line) => {
    const wrapped = wrap(line, w - 48, font(14, 700));
    wrapped.forEach((ln) => {
      ctx.fillText(ln, x + 24, ly);
      ly += 20;
    });
    ly += 6;
  });
  if (ui.closeHelp) {
    const lift = buttonChrome(ui.closeHelp, { accent: true });
    ctx.fillStyle = INK;
    ctx.font = font(18, 800);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Back to the kitchen', ui.closeHelp.x + ui.closeHelp.w / 2, ui.closeHelp.y + ui.closeHelp.h / 2 - lift);
  }
}

function drawOverlayCard() {
  if (game.mode !== 'success' && game.mode !== 'timeout' && game.mode !== 'finale') return;
  const ui = game.ui;
  const card = ui.card || { x: 20, y: 20, w: ui.W - 40, h: ui.H - 40 };
  ctx.fillStyle = 'rgba(50, 24, 16, 0.45)';
  ctx.fillRect(0, 0, ui.W, ui.H);
  const { x, y, w, h } = card;
  drawCard(x, y, w, h);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = INK;
  if (game.mode === 'success') {
    ctx.font = font(32, 800);
    ctx.fillText('Order served!', ui.W / 2, y + 24);
    const msg = game.lastStars === 3 ? 'Gold-star service!' : game.lastStars === 2 ? 'Tasty timing!' : 'Just in time!';
    ctx.font = font(18, 700);
    ctx.fillStyle = '#7a4b32';
    ctx.fillText(msg, ui.W / 2, y + 68);
    for (let i = 0; i < 3; i++) {
      drawStar(ui.W / 2 - 50 + i * 50, y + 120, 16, i < game.lastStars ? GOLD : '#e6d3b8');
    }
    ctx.fillStyle = BASIL;
    ctx.font = font(28, 800);
    ctx.fillText(`+$${game.lastPay}`, ui.W / 2, y + 150);
    ctx.fillStyle = '#7a4b32';
    ctx.font = font(15, 700);
    ctx.fillText(`$100 for the order, plus $${game.lastStars * 25} in star bonus`, ui.W / 2, y + 190);
    ctx.fillStyle = INK;
    ctx.font = font(16, 800);
    ctx.fillText(fracText(game.sol.final), ui.W / 2, y + 216);
  } else if (game.mode === 'timeout') {
    ctx.font = font(30, 800);
    ctx.fillText(game.lost >= 3 ? 'The kitchen has to close.' : 'This customer had to go.', ui.W / 2, y + 36);
    ctx.font = font(16, 700);
    ctx.fillStyle = '#7a4b32';
    const gone = game.lost >= 3
      ? 'Three customers left. Your team earnings are ready to compare with the record.'
      : `${game.lost} of 3 customers have left. The next order has a little less time, and the till stays.`;
    const lines = wrap(gone, w - 60, font(16, 700));
    lines.forEach((ln, i) => ctx.fillText(ln, ui.W / 2, y + 90 + i * 22));
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(ui.W / 2 - 36 + i * 36, y + 168, 8, 0, Math.PI * 2);
      ctx.fillStyle = i < game.lost ? TOMATO : '#e6d3b8';
      ctx.fill();
    }
  } else {
    ctx.font = font(32, 800);
    ctx.fillStyle = TOMATO;
    ctx.fillText('Kitchen closed', ui.W / 2, y + 28);
    ctx.fillStyle = '#7a4b32';
    ctx.font = font(16, 700);
    ctx.fillText('Three customers left hungry.', ui.W / 2, y + 70);
    ctx.fillStyle = INK;
    ctx.font = font(18, 800);
    ctx.fillText(`${game.served} orders served`, ui.W / 2, y + 112);
    ctx.fillText(`${game.starsTotal} gold stars`, ui.W / 2, y + 140);
    ctx.fillStyle = BASIL;
    ctx.font = font(28, 800);
    ctx.fillText(`Team earnings  $${game.team}`, ui.W / 2, y + 186);
    ctx.fillStyle = game.newRecord ? TOMATO : INK;
    ctx.font = font(18, 800);
    const year = yearInfo(game.difficulty);
    ctx.fillText(game.newRecord ? `New ${year.short} record  $${game.record}` : `${year.name} record  $${game.record}`, ui.W / 2, y + 226);
  }
  if (ui.next && (game.mode === 'success' || game.mode === 'timeout' || game.mode === 'finale')) {
    const lift = buttonChrome(ui.next, { accent: true });
    ctx.fillStyle = INK;
    ctx.font = font(16, 800);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let label = 'Next customer';
    if (game.mode === 'timeout' && game.lost >= 3) label = 'See team earnings';
    else if (game.mode === 'timeout') label = 'Next customer';
    else if (game.mode === 'finale') label = 'Play again';
    ctx.fillText(label, ui.next.x + ui.next.w / 2, ui.next.y + ui.next.h / 2 - lift);
  }
}

function drawToast() {
  if (game.toastT <= 0 || game.mode !== 'play') return;
  ctx.save();
  ctx.globalAlpha = clamp(game.toastT, 0, 1);
  ctx.fillStyle = INK;
  ctx.font = font(16, 800);
  ctx.textAlign = 'center';
  ctx.fillText(game.toast, view.w / 2, game.ui.tapeY + game.ui.tape + 18);
  ctx.restore();
}

function draw() {
  layout();
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, view.w, view.h);
  ctx.save();
  if (game.shake > 0) ctx.translate(game.shakeX, game.shakeY);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  drawBackground();
  drawHud();
  drawTape();
  drawTicket();
  if (game.order && game.mode !== 'title' && game.mode !== 'finale') drawArena();
  if (game.mode !== 'title') drawStation();
  drawRibbon();
  drawToast();
  drawBanner();
  drawFx();
  if (game.mode === 'title') drawTitle();
  if (game.help) drawHelp();
  drawOverlayCard();
  PLAYERS.forEach(drawReticle);
  ctx.restore();
}

/* ---------- loop ---------- */

function update(dt) {
  game.t += dt;
  PLAYERS.forEach((p) => { p.justA = false; });
  PLAYERS.forEach((p) => {
    p.action.forEach((code) => {
      if (held[code] && !prevHeld[code]) p.justA = true;
    });
  });
  pollPads();
  layout();
  buildHotspots();
  movePlayers(dt);
  resolvePointer();
  resolvePadAndKeys();
  updateWait(dt);
  if (game.mode === 'play' && !game.help && game.waitT <= 0 && !document.hidden) {
    game.timeLeft -= dt;
    if (game.timeLeft <= 0) {
      game.timeLeft = 0;
      doTimeout();
    }
  }
  game.ribbonT = Math.max(0, game.ribbonT - dt);
  game.toastT = Math.max(0, game.toastT - dt);
  game.wobble = Math.max(0, game.wobble - dt * 1.3);
  if (game.shake > 0) {
    game.shake = Math.max(0, game.shake - dt * 28);
    game.shakeX = (Math.random() - 0.5) * game.shake;
    game.shakeY = (Math.random() - 0.5) * game.shake;
  } else {
    game.shakeX = 0;
    game.shakeY = 0;
  }
  updateFx(dt);
  Object.keys(held).forEach((k) => { prevHeld[k] = held[k]; });
}

function frame(now) {
  if (!frame.last) frame.last = now;
  let dt = (now - frame.last) / 1000;
  frame.last = now;
  if (dt > 0.05) dt = 0.05;
  try {
    if (view.w > 2 && view.h > 2) {
      update(dt);
      draw();
    }
  } catch (err) {
    if (!game.err) {
      game.err = String((err && err.stack) || err);
      console.error(err);
    }
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = '#3a1d12';
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.fillStyle = '#fff7ea';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(game.err.slice(0, 180), 24, 40);
  }
  requestAnimationFrame(frame);
}

function resize() {
  view.dpr = Math.min(2, window.devicePixelRatio || 1);
  view.w = Math.max(320, window.innerWidth);
  view.h = Math.max(320, window.innerHeight);
  canvas.width = Math.floor(view.w * view.dpr);
  canvas.height = Math.floor(view.h * view.dpr);
  canvas.style.width = `${view.w}px`;
  canvas.style.height = `${view.h}px`;
}

window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {});
window.addEventListener('keydown', (e) => {
  if (BLOCK_KEYS.has(e.code)) e.preventDefault();
  held[e.code] = true;
  if (e.code === 'Escape' && game.help) game.help = false;
  audio.ensure();
});
window.addEventListener('keyup', (e) => {
  held[e.code] = false;
});
canvas.addEventListener('pointerdown', (e) => {
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* a synthetic click has no pointer to capture */ }
  const p = toWorld(e.clientX, e.clientY);
  input.queue.push({ type: 'down', x: p.x, y: p.y });
  input.mouse.x = p.x;
  input.mouse.y = p.y;
  input.mouse.on = true;
});
canvas.addEventListener('pointermove', (e) => {
  const p = toWorld(e.clientX, e.clientY);
  input.mouse.x = p.x;
  input.mouse.y = p.y;
  input.mouse.on = true;
});
canvas.addEventListener('pointerup', (e) => {
  const p = toWorld(e.clientX, e.clientY);
  input.queue.push({ type: 'up', x: p.x, y: p.y });
});
canvas.addEventListener('pointerleave', () => { input.mouse.on = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function toWorld(sx, sy) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (sx - r.left) * (view.w / r.width),
    y: (sy - r.top) * (view.h / r.height),
  };
}

game.records = loadRecords();
game.record = game.records.p4 || 0;
selfCheck();
announce();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
