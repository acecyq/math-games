      ctx.beginPath();
      ctx.moveTo(0, -s * 0.34);
      ctx.lineTo(s * 0.14, -s * 0.08);
      ctx.lineTo(0, s * 0.02);
      ctx.lineTo(-s * 0.14, -s * 0.08);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'necklace') {
      ctx.strokeStyle = '#f6c445';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -s * 0.05, s * 0.28, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
      ctx.fillStyle = '#e9d5ff';
      ctx.beginPath();
      ctx.moveTo(0, s * 0.05);
      ctx.lineTo(s * 0.1, s * 0.28);
      ctx.lineTo(-s * 0.1, s * 0.28);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'bracelet') {
      ctx.strokeStyle = '#f6c445';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.28, s * 0.18, 0, 0.4, Math.PI * 2 - 0.2);
      ctx.stroke();
      ctx.fillStyle = '#67e8f9';
      ctx.beginPath(); ctx.arc(s * 0.26, 0, s * 0.07, 0, Math.PI * 2); ctx.fill();
    } else if (type === 'house') {
      ctx.fillStyle = '#f6c445';
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.42);
      ctx.lineTo(s * 0.4, -s * 0.05);
      ctx.lineTo(-s * 0.4, -s * 0.05);
      ctx.closePath();
      ctx.fill();
      roundRect(-s * 0.28, -s * 0.05, s * 0.56, s * 0.4, 3);
      ctx.fillStyle = '#fff6d8';
      ctx.fill();
      ctx.fillStyle = '#b45309';
      ctx.fillRect(-s * 0.08, s * 0.08, s * 0.16, s * 0.27);
    } else if (type === 'plot') {
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.34);
      ctx.lineTo(s * 0.42, -s * 0.08);
      ctx.lineTo(0, s * 0.28);
      ctx.lineTo(-s * 0.42, -s * 0.08);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#bbf7d0';
      ctx.stroke();
    } else if (type === 'flask') {
      roundRect(-s * 0.08, -s * 0.4, s * 0.16, s * 0.18, 2);
      ctx.fillStyle = '#fde68a';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-s * 0.1, -s * 0.22);
      ctx.lineTo(-s * 0.28, s * 0.28);
      ctx.quadraticCurveTo(0, s * 0.42, s * 0.28, s * 0.28);
      ctx.lineTo(s * 0.1, -s * 0.22);
      ctx.closePath();
      ctx.fillStyle = '#f6c445';
      ctx.fill();
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(-s * 0.18, s * 0.02, s * 0.36, s * 0.2);
    } else if (type === 'yacht') {
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.moveTo(-s * 0.42, s * 0.05);
      ctx.lineTo(s * 0.42, s * 0.05);
      ctx.lineTo(s * 0.24, s * 0.28);
      ctx.lineTo(-s * 0.24, s * 0.28);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, s * 0.05);
      ctx.lineTo(0, -s * 0.36);
      ctx.stroke();
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.32);
      ctx.lineTo(s * 0.22, -s * 0.02);
      ctx.lineTo(0, -s * 0.02);
      ctx.closePath();
      ctx.fill();
    } else if (type === 'coin') {
      ctx.beginPath();
      ctx.fillStyle = '#f6c445';
      ctx.arc(0, 0, s * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7c4a12';
      ctx.font = '700 ' + Math.max(8, s * 0.28) + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, 1);
    }
    ctx.restore();
  }

  function drawTycoon(cx, top, name, mood) {
    const pal = CAST[name] || CAST.Asher;
    const bob = reduceMotion ? 0 : Math.sin(animT * 2.4 + name.length) * 2;
    const y = top + bob + (mood === 'cheer' && !reduceMotion ? Math.sin(animT * 12) * 2 : 0);
    const blink = !reduceMotion && Math.sin(animT * 1.7 + name.length * 1.3) > 0.94;
    ctx.save();
    ctx.translate(cx, y);
    if (mood === 'cheer') {
      ctx.strokeStyle = pal.suit;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-16, 78);
      ctx.lineTo(-34, 52);
      ctx.moveTo(16, 78);
      ctx.lineTo(34, 52);
      ctx.stroke();
    }
    roundRect(-34, 58, 68, 36, 14);
    ctx.fillStyle = pal.suit;
    ctx.fill();
    ctx.fillStyle = pal.accent;
    ctx.fillRect(-6, 64, 12, 16);
    ctx.beginPath();
    ctx.fillStyle = pal.skin;
    ctx.arc(0, 36, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = pal.hair;
    ctx.beginPath();
    ctx.arc(0, 28, 22, Math.PI, Math.PI * 2);
    ctx.fill();
    roundRect(-30, 8, 60, 8, 3);
    ctx.fillStyle = pal.hat;
    ctx.fill();
    roundRect(-16, -16, 32, 26, 4);
    ctx.fill();
    ctx.fillStyle = pal.accent;
    ctx.fillRect(-16, 2, 32, 4);
    ctx.fillStyle = INK;
    if (blink) {
      ctx.fillRect(-12, 34, 8, 2);
      ctx.fillRect(4, 34, 8, 2);
    } else {
      ctx.beginPath(); ctx.arc(-8, 34, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(8, 34, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    const mono = name === 'Bernard' || name === 'Melanie' || name === 'Gina';
    if (mono) {
      ctx.strokeStyle = pal.accent;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(9, 34, 7, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.strokeStyle = '#9a3412';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    if (mood === 'sad') ctx.arc(0, 52, 8, Math.PI * 1.15, Math.PI * 1.85, true);
    else ctx.arc(0, 42, 8, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.restore();
    text(name, cx, top + 132, '700 15px ' + FONT, CREAM, 'center');
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, '#0b4a38');
    g.addColorStop(0.45, '#063528');
    g.addColorStop(1, '#02140f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#f6c445';
    ctx.beginPath();
    ctx.ellipse(640, 80, 280, 40, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    const floor = ctx.createLinearGradient(0, 520, 0, 720);
    floor.addColorStop(0, 'rgba(246,196,69,0.08)');
    floor.addColorStop(1, 'rgba(246,196,69,0)');
    ctx.fillStyle = floor;
    ctx.beginPath();
    ctx.ellipse(640, 760, 620, 180, 0, 0, Math.PI * 2);
    ctx.fill();
    if (!reduceMotion) {
      for (let i = 0; i < 14; i++) {
        const x = (i * 97 + animT * 18) % VW;
        const y = 80 + (i * 53) % 500;
        ctx.globalAlpha = 0.15 + 0.15 * Math.sin(animT * 2 + i);
        ctx.fillStyle = i % 2 ? GOLD : '#6ee7b7';
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawHearts(x, y, n, max, color) {
    for (let i = 0; i < max; i++) {
      const on = i < n;
      ctx.save();
      ctx.translate(x + i * 22, y);
      ctx.fillStyle = on ? (color || '#fb7185') : 'rgba(255,246,216,0.18)';
      ctx.beginPath();
      ctx.moveTo(0, 4);
      ctx.bezierCurveTo(-8, -6, -12, 2, 0, 10);
      ctx.bezierCurveTo(12, 2, 8, -6, 0, 4);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawMute(x, y) {
    spot('mute', x, y, 78, 34);
    const hot = pointer.x >= x && pointer.x <= x + 78 && pointer.y >= y && pointer.y <= y + 34;
    roundRect(x, y, 78, 34, 10);
    ctx.fillStyle = hot ? '#14583f' : '#0c3b2c';
    ctx.fill();
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    text(sound.muted ? 'SOUND' : 'MUTE', x + 39, y + 17, '700 13px ' + FONT, CREAM, 'center');
  }

  function drawHUD() {
    const box = layout().hud;
    ctx.fillStyle = 'rgba(4, 28, 20, 0.92)';
    ctx.fillRect(box.x, box.y, box.w, box.h);
    ctx.fillStyle = GOLD;
    ctx.fillRect(0, 50, VW, 2);
    const meta = TIER_META[game.tier];
    const mode = game.mode === 'COOP' ? 'CO-OP' : game.mode;
    text(mode, 16, 26, '700 15px ' + FONT, CREAM, 'left');
    roundRect(108, 12, 78, 28, 8);
    ctx.fillStyle = meta.short === 'P6' ? '#fb7185' : (meta.short === 'P5B' ? '#fbbf24' : (meta.short === 'P5A' ? '#38bdf8' : MINT));
    ctx.fill();
    text(meta.short, 147, 26, '800 14px ' + FONT, INK, 'center');
    text('Q ' + (game.round + 1) + '/' + ROUNDS, 200, 26, '700 15px ' + FONT, CREAM, 'left');
    if (game.mode === 'DUEL') {
      let x = 300;
      for (let i = 0; i < game.players; i++) {
        const p = game.pilots[i];
        const col = PILOTS[i].color;
        text(PILOTS[i].id, x, 18, '800 12px ' + FONT, col, 'left');
        text('★ ' + p.stars, x + 28, 18, '700 13px ' + FONT, GOLD, 'left');
        drawHearts(x + 62, 14, p.lives, 3, col);
        if (p.stun > 0) text('LOCK', x + 128, 18, '700 11px ' + FONT, '#fb7185', 'left');
        x += game.players === 3 ? 210 : 250;
      }
    } else {
      const label = game.mode === 'COOP' ? 'TEAM NET WORTH' : 'NET WORTH';
      text(label, 340, 18, '700 11px ' + FONT, '#fde68a', 'left');
      text(comma(game.score), 340, 34, '800 16px ' + FONT, GOLD, 'left');
      drawHearts(520, 24, game.hearts, 3, '#fb7185');
      if (game.mode !== 'DUEL' && game.combo >= 2) {
        text('COMBO x' + comboMult(), 600, 26, '800 16px ' + FONT, '#f9a8d4', 'left');
      }
      const best = game.mode === 'COOP' ? game.bestCoop : game.bestSolo;
      if (best > 0) text('BEST ' + comma(best), 760, 26, '700 13px ' + FONT, '#d1fae5', 'left');
    }
    const frac = game.timeMax > 0 ? clamp(game.timeLeft / game.timeMax, 0, 1) : 0;
    const urgent = frac < 0.28;
    text(Math.ceil(game.timeLeft) + 's', 1048, 20, '800 16px ' + FONT, urgent ? '#fb7185' : GOLD, 'right');
    roundRect(900, 32, 150, 8, 4);
    ctx.fillStyle = 'rgba(255,246,216,0.15)';
    ctx.fill();
    roundRect(900, 32, Math.max(6, 150 * frac), 8, 4);
    ctx.fillStyle = urgent ? '#fb7185' : GOLD;
    ctx.fill();
    drawMute(1188, 9);
  }

  function drawBadges(badges, x, y, w, maxH) {
    const gap = 6;
    const bh = Math.min(32, Math.floor((maxH - gap * (badges.length - 1)) / badges.length));
    for (let i = 0; i < badges.length; i++) {
      const by = y + i * (bh + gap);
      const find = badges[i].indexOf('FIND:') === 0;
      roundRect(x, by, w, bh, 10);
      ctx.fillStyle = find ? '#f6c445' : 'rgba(255,246,216,0.1)';
      ctx.fill();
      ctx.strokeStyle = find ? '#fde68a' : 'rgba(246,196,69,0.45)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      let size = 15;
      const font = '700 ' + size + 'px ' + FONT;
      ctx.font = font;
      if (ctx.measureText(badges[i]).width > w - 20) size = 13;
      text(badges[i], x + w / 2, by + bh / 2, '700 ' + size + 'px ' + FONT, find ? INK : CREAM, 'center');
    }
  }

  function drawBanner(q) {
    const box = layout().banner;
    panel(box.x, box.y, box.w, box.h, 'rgba(6, 40, 28, 0.78)', 'rgba(246,196,69,0.45)');
    const cast = q.cast;
    if (cast.length >= 2) {
      drawTycoon(118, box.y + 8, cast[0], game.mood);
      drawTycoon(box.x + box.w - 102, box.y + 8, cast[1], game.mood);
      drawIcon(q.icons[0], 168, box.y + 78, 36);
      drawIcon(q.icons[1], box.x + box.w - 156, box.y + 78, 36);
      drawBadges(q.badges, 250, box.y + 10, 780, box.h - 20);
    } else {
      drawTycoon(130, box.y + 8, cast[0], game.mood);
      let ix = 230;
      for (let i = 0; i < q.icons.length; i++) {
        drawIcon(q.icons[i], ix, box.y + 78, 42);
        ix += 54;
      }
      drawBadges(q.badges, 420, box.y + 10, 800, box.h - 20);
    }
  }

  function drawSegments(x, y, w, h, units, highlight, color, hot) {
    const seg = w / units;
    for (let s = 0; s < units; s++) {
      const sx = x + s * seg;
      roundRect(sx + 2, y + 2, Math.max(2, seg - 4), h - 4, 6);
      ctx.fillStyle = s < highlight ? hot : color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(6,40,28,0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawBarModel(q, rect) {
    const bars = q.bars;
    const n = bars.length;
    const labelW = 150;
    const fullW = rect.w - labelW - 28;
    const gap = n > 2 ? 8 : 16;
    const caption = q.unitCaption && game.reveal > 0.55 ? 24 : 0;
    const avail = rect.h - caption - 12;
    const bh = Math.min(42, (avail - gap * (n - 1)) / n);
    const block = n * bh + (n - 1) * gap;
    const top = rect.y + caption + Math.max(6, (rect.h - caption - block) / 2);
    const maxU = Math.max.apply(null, bars.map((b) => b.units));
    for (let i = 0; i < n; i++) {
      const b = bars[i];
      const y = top + i * (bh + gap);
      const reveal = game.reveal;
      const equalW = fullW * 0.8;
      const trueW = fullW * (b.units / Math.max(1, maxU));
      const w = Math.max(20, equalW + (trueW - equalW) * reveal);
      const x = rect.x + labelW;
      text(b.label, rect.x + 18, y + bh / 2 - (reveal > 0.8 ? 6 : 0), '700 16px ' + FONT, CREAM, 'left');
      if (reveal > 0.8) text(b.units + 'u', rect.x + 18, y + bh / 2 + 12, '700 12px ' + FONT, GOLD, 'left');
      roundRect(x, y, w, bh, 8);
      ctx.fillStyle = 'rgba(255,246,216,0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(246,196,69,0.35)';
      ctx.stroke();
      if (reveal > 0.12) drawSegments(x, y, w, bh, b.units, b.highlight, b.color, b.hot);
      else text(b.tag || '?', x + w / 2, y + bh / 2, '700 14px ' + FONT, GOLD, 'center');
    }
    if (game.reveal > 0.7 && q.unitCaption) {
      text(q.unitCaption, rect.x + rect.w - 16, rect.y + 16, '800 16px ' + FONT, GOLD, 'right');
    }
  }

  function drawOverlap(q, rect) {
    if (game.reveal < 0.12) {
      const landH = Math.min(108, Math.max(64, rect.h - 28));
      roundRect(rect.x + 200, rect.y + 16, 460, landH, 12);
      ctx.fillStyle = '#166534';
      ctx.fill();
      drawIcon('house', rect.x + 330, rect.y + 16 + landH * 0.45, Math.min(84, landH));
      text('OVERLAP ?', rect.x + 470, rect.y + 16 + landH * 0.5, '800 18px ' + FONT, '#fde68a', 'left');
      return;
    }
    drawBarModel(q, rect);
  }

  function drawShift(q, rect) {
    const names = q.cast;
    const s = q.shift;
    const reveal = game.reveal;
    text('BEFORE', rect.x + 24, rect.y + 22, '800 12px ' + FONT, '#fde68a', 'left');
    text('AFTER', rect.x + 640, rect.y + 22, '800 12px ' + FONT, '#fde68a', 'left');
    const y1 = rect.y + 30;
    const y2 = rect.y + Math.min(92, Math.max(68, rect.h - 40));
    const rows = [
      { label: names[0], units: s.beforeA, ghost: 0, x: rect.x + 168, y: y1, lock: true },
      { label: names[1], units: s.beforeB, ghost: 0, x: rect.x + 168, y: y2, lock: false },
      { label: names[0], units: s.afterA, ghost: 0, x: rect.x + 760, y: y1, lock: true },
      { label: names[1], units: s.afterB, ghost: Math.max(0, -s.delta), x: rect.x + 760, y: y2, lock: false }
    ];
    const maxU = Math.max(s.beforeA, s.beforeB, s.afterA, s.afterB + Math.max(0, -s.delta));
    rows.forEach((row) => {
      text(row.label, row.x - 148, row.y + 16, '700 15px ' + FONT, row.lock ? GOLD : CREAM, 'left');
      const shown = Math.max(row.units, 1);
      const w = 420 * (shown / maxU);
      if (reveal < 0.12) {
        roundRect(row.x, row.y, 280, 32, 8);
        ctx.fillStyle = 'rgba(255,246,216,0.08)';
        ctx.fill();
        text(row.lock ? 'UNCHANGED ?' : 'CHANGES', row.x + 140, row.y + 16, '700 13px ' + FONT, GOLD, 'center');
      } else {
        const width = Math.max(24, w);
        drawSegments(row.x, row.y, width, 32, shown, row.lock ? shown : 0, row.lock ? '#f6c445' : '#0284c7', '#fde68a');
        if (!row.lock) {
          drawSegments(row.x, row.y, width, 32, shown, 0, '#0369a1', '#0369a1');
          if (row.ghost > 0) {
            const seg = width / shown;
            ctx.save();
            ctx.globalAlpha = 0.45;
            for (let g = 0; g < row.ghost; g++) {
              roundRect(row.x + shown * seg + g * seg + 2, row.y + 2, Math.max(2, seg - 4), 28, 5);
              ctx.fillStyle = '#fb7185';
              ctx.fill();
            }
            ctx.restore();
          }
        }
      }
    });
    if (reveal > 0.7 && q.unitCaption) text(q.unitCaption, rect.x + rect.w - 16, rect.y + 16, '800 15px ' + FONT, GOLD, 'right');
  }

  function drawAdvisor(rect) {
    const show = game.advisor && (game.advisorT > 0 || game.phase === 'celebrate' || game.phase === 'timeout' || game.phase === 'dead');
    if (!show) return;
    const lines = wrapText(game.advisor, rect.w - 48, '700 13px ' + FONT).slice(0, 3);
    const h = lines.length > 2 ? 66 : 50;
    const y = rect.y + rect.h - h - 6;
    roundRect(rect.x + 10, y, rect.w - 20, h, 10);
    ctx.fillStyle = 'rgba(20, 12, 4, 0.92)';
    ctx.fill();
    ctx.strokeStyle = game.phase === 'celebrate' ? GOLD : '#fb7185';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    for (let i = 0; i < lines.length; i++) {
      text(lines[i], rect.x + 24, y + 14 + i * 17, '700 13px ' + FONT, game.phase === 'celebrate' ? '#fff6d8' : '#ffe4e6', 'left');
    }
  }

  function drawStage(q) {
    const box = layout().stage;
    panel(box.x, box.y, box.w, box.h, 'rgba(4, 30, 22, 0.72)', 'rgba(246,196,69,0.4)');
    const adv = (game.advisor && (game.advisorT > 0 || game.phase === 'celebrate' || game.phase === 'timeout' || game.phase === 'dead')) ? 74 : 0;
    const inner = { x: box.x, y: box.y, w: box.w, h: box.h - adv };
    if (q.model === 'shift') drawShift(q, inner);
    else if (q.model === 'overlap') drawOverlap(q, inner);
    else drawBarModel(q, inner);
    if (game.phase === 'celebrate' || game.phase === 'timeout' || game.phase === 'dead') {
      game.advisor = game.phase === 'timeout' ? game.advisor : (game.advisor || q.because);
    }
    if (adv) drawAdvisor(box);
    if (game.phase === 'intro') {
      text('DEAL ' + (game.round + 1), box.x + box.w / 2, box.y + 18, '800 14px ' + FONT, GOLD, 'center');
    }
  }

  function drawPrompt(q) {
    const box = layout().prompt;
    if (game.toastT > 0 && game.toast) {
      roundRect(box.x, box.y, box.w, box.h, 8);
      ctx.fillStyle = '#7f1d1d';
      ctx.fill();
      text(game.toast, box.x + box.w / 2, box.y + 15, '800 15px ' + FONT, CREAM, 'center');
      return;
    }
    const step = showingStep();
    const title = step === 1 ? q.step1Title : ('CLAIM  ' + q.find);
    text('STEP ' + step, box.x + 8, box.y + 15, '800 16px ' + FONT, GOLD, 'left');
    text(title, box.x + 84, box.y + 15, '700 16px ' + FONT, CREAM, 'left');
    if (game.mode === 'COOP') {
      const p = PILOTS[activePlayer()];
      const label = p.badge + (step === 1 ? '  LOCKS UNITS' : '  CLAIMS');
      const tw = 240;
      roundRect(box.x + box.w - tw, box.y + 2, tw, 26, 8);
      ctx.fillStyle = p.color;
      ctx.fill();
      text(label, box.x + box.w - tw / 2, box.y + 15, '800 13px ' + FONT, p.ink, 'center');
    } else if (game.mode === 'DUEL') {
      text('FASTEST CORRECT CLAIM', box.x + box.w - 8, box.y + 15, '800 14px ' + FONT, '#f9a8d4', 'right');
    }
  }

  function drawCard(i) {
    const rect = layout().cards[i];
    const opt = optionsNow()[i];
    if (!opt) return;
    spot('card:' + i, rect.x, rect.y, rect.w, rect.h);
    const hover = pointer.x >= rect.x && pointer.x <= rect.x + rect.w && pointer.y >= rect.y && pointer.y <= rect.y + rect.h && game.phase === 'ask';
    let face = '#12382b';
    let edge = 'rgba(246,196,69,0.85)';
    if (opt.correct && (game.phase === 'snap' || game.phase === 'celebrate' || game.phase === 'timeout' || game.phase === 'dead')) {
      face = '#14532d';
      edge = '#4ade80';
    } else if (game.wrong[i]) {
      face = '#3f1d24';
      edge = '#fb7185';
    } else if (hover) {
      face = '#18543d';
      edge = '#fde68a';
    }
    const lift = hover && game.phase === 'ask' ? -4 : 0;
    roundRect(rect.x, rect.y + lift, rect.w, rect.h, 16);
    ctx.fillStyle = face;
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 3;
    ctx.stroke();
    for (let p = 0; p < game.players; p++) {
      if (!game.focusOn[p]) continue;
      if (game.focus[p] !== i) continue;
      if (game.mode === 'COOP' && p !== activePlayer() && game.phase === 'ask') continue;
      ctx.strokeStyle = PILOTS[p].color;
      ctx.lineWidth = 3;
      roundRect(rect.x + 4 + p * 2, rect.y + lift + 4 + p * 2, rect.w - 8 - p * 4, rect.h - 8 - p * 4, 14);
      ctx.stroke();
    }
    const keyRows = game.players;
    const textBottom = rect.y + lift + rect.h - 16 - keyRows * 22;
    const lines = opt.lines && opt.lines.length ? opt.lines : [opt.text];
    let size = lines.length > 2 ? 18 : (lines.length > 1 ? 22 : 28);
    const maxW = rect.w - 28;
    while (size > 13) {
      ctx.font = '800 ' + size + 'px ' + FONT;
      const wide = lines.some((ln) => ctx.measureText(ln).width > maxW);
      if (!wide) break;
      size -= 1;
    }
    const lh = size + 6;
    const blockH = lines.length * lh;
    const mid = (rect.y + lift + 16 + textBottom) / 2;
    let ty = mid - blockH / 2;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = game.wrong[i] ? '#fecdd3' : CREAM;
    for (let li = 0; li < lines.length; li++) {
      ctx.font = '800 ' + size + 'px ' + FONT;
      ctx.fillText(lines[li], rect.x + rect.w / 2, ty + lh * li + lh / 2);
    }
    for (let p = 0; p < game.players; p++) {
      const active = game.mode !== 'COOP' || activePlayer() === p || game.phase !== 'ask';
      const y = rect.y + lift + rect.h - 14 - (keyRows - p) * 22;
      ctx.globalAlpha = active ? 1 : 0.35;
      roundRect(rect.x + 16, y, 36, 18, 5);
      ctx.fillStyle = PILOTS[p].color;
      ctx.fill();
      text(KEYS[p][i], rect.x + 34, y + 9, '800 12px ' + FONT, PILOTS[p].ink, 'center');
      text(PILOTS[p].id, rect.x + 60, y + 9, '700 12px ' + FONT, CREAM, 'left');
      ctx.globalAlpha = 1;
    }
    if (game.wrong[i]) text('NOPE', rect.x + rect.w - 18, rect.y + lift + 18, '800 12px ' + FONT, '#fb7185', 'right');
    if (opt.correct && (game.phase === 'celebrate' || game.phase === 'snap')) text('YES', rect.x + rect.w - 18, rect.y + lift + 18, '800 12px ' + FONT, '#4ade80', 'right');
  }

  function drawFx() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = clamp(p.life, 0, 1);
      if (p.kind === 'coin') drawIcon('coin', 0, 0, p.size * 2.2);
      else if (p.kind === 'gem') drawIcon('gem', 0, 0, p.size * 2);
      else {
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size * 0.4, -p.size * 0.2, p.size, p.size * 0.45);
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    for (let i = 0; i < floaters.length; i++) {
      const f = floaters[i];
      ctx.globalAlpha = clamp(f.life, 0, 1);
      text(f.text, f.x, f.y, '800 22px ' + FONT, f.color, 'center');
    }
    ctx.globalAlpha = 1;
    if (game.flash > 0) {
      ctx.globalAlpha = game.flash * 0.18;
      ctx.fillStyle = GOLD;
      ctx.fillRect(0, 0, VW, VH);
      ctx.globalAlpha = 1;
    }
  }

  function drawPause() {
    ctx.fillStyle = 'rgba(2, 16, 12, 0.72)';
    ctx.fillRect(0, 0, VW, VH);
    panel(390, 220, 500, 220, '#083226', GOLD);
    text('PAUSED', 640, 280, '800 36px ' + FONT, GOLD, 'center');
    text('Esc resumes the show', 640, 330, '700 16px ' + FONT, CREAM, 'center');
    roundRect(520, 360, 240, 48, 12);
    ctx.fillStyle = GOLD;
    ctx.fill();
    spot('resume', 520, 360, 240, 48);
    text('RESUME', 640, 384, '800 18px ' + FONT, INK, 'center');
  }

  function chip(id, x, y, w, h, label, sub, on, rowHot) {
    spot(id, x, y, w, h);
    roundRect(x, y, w, h, 12);
    ctx.fillStyle = on ? GOLD : (rowHot ? '#14583f' : '#0c3b2c');
    ctx.fill();
    ctx.strokeStyle = on ? '#fff6d8' : 'rgba(246,196,69,0.55)';
    ctx.lineWidth = rowHot ? 3 : 1.5;
    ctx.stroke();
    text(label, x + w / 2, y + (sub ? h / 2 - 8 : h / 2), '800 ' + (w > 180 ? 16 : 15) + 'px ' + FONT, on ? INK : CREAM, 'center');
    if (sub) text(sub, x + w / 2, y + h / 2 + 12, '700 11px ' + FONT, on ? '#7c4a12' : '#fde68a', 'center');
  }

  function drawTitle() {
    drawBackground();
    drawTycoon(96, 250, 'Asher', 'cheer');
    drawTycoon(1184, 250, 'Melanie', 'cheer');
    drawIcon('vault', 96, 430, 54);
    drawIcon('ring', 1184, 430, 54);
    text('TYCOON VAULT', 640, 58, '800 54px ' + FONT, GOLD, 'center');
    text('Pictorial Bar-Model Showdown', 640, 104, '700 18px ' + FONT, CREAM, 'center');
    text('Primary 4–6  ·  equal fractions, repeated identity, overlap, unchanged', 640, 132, '700 14px ' + FONT, '#d1fae5', 'center');
    const rowY = [168, 292, 430];
    chip('players:1', 250, rowY[0], 240, 64, '1 PLAYER', 'Solo vault', game.players === 1, titleRow === 0);
    chip('players:2', 510, rowY[0], 240, 64, '2 PLAYERS', 'Co-op or duel', game.players === 2, titleRow === 0);
    chip('players:3', 770, rowY[0], 240, 64, '3 PLAYERS', 'Co-op or duel', game.players === 3, titleRow === 0);
    for (let i = 0; i < TIER_OPTS.length; i++) {
      const id = TIER_OPTS[i];
      const meta = TIER_META[id];
      chip('tier:' + id, 170 + i * 240, rowY[1], 220, 78, meta.label, meta.short, game.tier === id, titleRow === 1);
    }
    chip('mode:SOLO', 250, rowY[2], 240, 70, 'SOLO', 'High score', game.mode === 'SOLO', titleRow === 2);
    chip('mode:COOP', 510, rowY[2], 240, 70, 'TEAM CO-OP', 'One net worth', game.mode === 'COOP', titleRow === 2);
    chip('mode:DUEL', 770, rowY[2], 240, 70, 'TYCOON DUEL', 'Fastest star', game.mode === 'DUEL', titleRow === 2);
    const startHot = titleRow === 3;
    roundRect(390, 530, 500, 64, 16);
    ctx.fillStyle = startHot ? '#fde68a' : GOLD;
    ctx.fill();
    spot('start', 390, 530, 500, 64);
    text('OPEN THE VAULT', 640, 562, '800 26px ' + FONT, INK, 'center');
    const blurb = TIER_META[game.tier].blurb + '  ' + MODE_META[game.mode].blurb;
    const lines = wrapText(blurb, 900, '700 14px ' + FONT);
    for (let i = 0; i < lines.length && i < 2; i++) text(lines[i], 640, 612 + i * 18, '700 14px ' + FONT, CREAM, 'center');
    const bestBits = [];
    if (game.bestSolo) bestBits.push('SOLO BEST ' + comma(game.bestSolo));
    if (game.bestCoop) bestBits.push('TEAM BEST ' + comma(game.bestCoop));
    text((bestBits.join('    ') || '8 DEALS  ·  STEP 1 UNITS  ·  STEP 2 CLAIM') + '    ·    M mutes', 640, 668, '700 13px ' + FONT, '#fde68a', 'center');
    text('P1 mouse · 1 2 3 4 · pad 0     P2 Q W E R · pad 1     P3 U I O P · pad 2', 640, 694, '700 13px ' + FONT, '#a7f3d0', 'center');
    drawMute(1188, 16);
  }

  function drawPlay() {
    const q = game.question;
    drawBackground();
    if (!q) return;
    drawHUD();
    drawBanner(q);
    drawStage(q);
    drawPrompt(q);
    for (let i = 0; i < 4; i++) drawCard(i);
    if (game.paused) drawPause();
  }

  function drawResult() {
    drawBackground();
    drawMute(1188, 16);
    text('VAULT CLOSED', 640, 70, '800 42px ' + FONT, GOLD, 'center');
    if (game.mode === 'DUEL') {
      const rows = [];
      for (let i = 0; i < game.players; i++) rows.push({ i: i, stars: game.pilots[i].stars, points: game.pilots[i].points, lives: game.pilots[i].lives });
      rows.sort((a, b) => b.stars - a.stars || b.points - a.points);
      const top = rows[0];
      const tied = rows.filter((r) => r.stars === top.stars && r.points === top.points);
      text(tied.length > 1 ? 'THE VAULT IS SPLIT' : PILOTS[top.i].duel + ' TAKES THE VAULT', 640, 120, '800 22px ' + FONT, CREAM, 'center');
      for (let r = 0; r < rows.length; r++) {
        const row = rows[r];
        const y = 180 + r * 110;
        panel(300, y, 680, 96, 'rgba(6,40,28,0.85)', PILOTS[row.i].color);
        text(PILOTS[row.i].duel, 330, y + 32, '800 20px ' + FONT, PILOTS[row.i].color, 'left');
        text('★ ' + row.stars, 330, y + 64, '800 18px ' + FONT, GOLD, 'left');
        text('LIVES ' + row.lives, 470, y + 64, '700 16px ' + FONT, CREAM, 'left');
        text('BONUS ' + comma(row.points), 860, y + 48, '800 18px ' + FONT, CREAM, 'right');
      }
    } else {
      const team = game.mode === 'COOP';
      text(team ? 'TEAM NET WORTH' : 'NET WORTH', 640, 150, '800 18px ' + FONT, '#fde68a', 'center');
      text(comma(game.score), 640, 210, '800 64px ' + FONT, GOLD, 'center');
      if (game.newBest) text('NEW RECORD', 640, 260, '800 18px ' + FONT, '#f9a8d4', 'center');
      text('DEALS CLAIMED  ' + game.solved + ' / ' + ROUNDS, 640, 310, '700 18px ' + FONT, CREAM, 'center');
      text('BEST COMBO  x' + game.bestCombo, 640, 342, '700 16px ' + FONT, CREAM, 'center');
      const best = team ? game.bestCoop : game.bestSolo;
      text('RECORD  ' + comma(best), 640, 374, '700 16px ' + FONT, '#a7f3d0', 'center');
      if (team) text('One corporation. One net worth. No personal scores.', 640, 414, '700 15px ' + FONT, CREAM, 'center');
    }
    const yBtn = game.mode === 'DUEL' ? 540 : 470;
    roundRect(300, yBtn, 300, 58, 14);
    ctx.fillStyle = GOLD;
    ctx.fill();
    spot('again', 300, yBtn, 300, 58);
    text('PLAY AGAIN', 450, yBtn + 29, '800 18px ' + FONT, INK, 'center');
    roundRect(680, yBtn, 300, 58, 14);
    ctx.fillStyle = '#0c3b2c';
    ctx.fill();
    ctx.strokeStyle = GOLD;
    ctx.stroke();
    spot('title', 680, yBtn, 300, 58);
    text('TITLE', 830, yBtn + 29, '800 18px ' + FONT, CREAM, 'center');
  }

  function render() {
    hotspots.length = 0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#021610';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, offsetX * dpr, offsetY * dpr);
    ctx.save();
    if (game.shake > 0 && !reduceMotion) {
      const m = game.shake * 10;
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }
    if (game.screen === 'title') drawTitle();
    else if (game.screen === 'result') drawResult();
    else drawPlay();
    drawFx();
    ctx.restore();
  }

  function frame(now) {
    if (!lastNow) lastNow = now;
    const dt = Math.min(0.05, (now - lastNow) / 1000);
    lastNow = now;
    animT += dt;
    pollPads();
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  function resize() {
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(winW * dpr));
    canvas.height = Math.max(1, Math.floor(winH * dpr));
    scale = Math.min(winW / VW, winH / VH);
    offsetX = (winW - VW * scale) / 2;
    offsetY = (winH - VH * scale) / 2;
  }
  function screenToVirtual(clientX, clientY) {
    return { x: (clientX - offsetX) / scale, y: (clientY - offsetY) / scale };
  }

  function onTitle(id) {
    if (id.indexOf('players:') === 0) {
      setPlayers(Number(id.slice(8)));
      titleRow = 0;
      sfxClick();
      return;
    }
    if (id.indexOf('tier:') === 0) {
      game.tier = id.slice(5);
      titleRow = 1;
      sfxClick();
      return;
    }
    if (id.indexOf('mode:') === 0) {
      setMode(id.slice(5));
      titleRow = 2;
      sfxClick();
      return;
    }
    if (id === 'start') startMatch();
  }
  function onResult(id) {
    if (id === 'again') startMatch();
    else if (id === 'title') {
      game.screen = 'title';
      announce('Tycoon Vault title.');
    }
  }
  function onPointerDown(e) {
    unlock();
    canvas.focus();
    const p = screenToVirtual(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.down = true;
    const id = hitSpot(p.x, p.y);
    if (id === 'mute') {
      toggleMute();
      return;
    }
    if (game.screen === 'title') {
      if (id) onTitle(id);
      return;
    }
    if (game.screen === 'result') {
      if (id) onResult(id);
      return;
    }
    if (game.paused) {
      if (id === 'resume') game.paused = false;
      return;
    }
    if (id && id.indexOf('card:') === 0) {
      choose(mousePlayer(), Number(id.slice(5)));
      return;
    }
    if ((game.phase === 'celebrate' || game.phase === 'timeout' || game.phase === 'dead') && game.inputLock <= 0) skipWait();
  }
  function onPointerMove(e) {
    const p = screenToVirtual(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
    if (game.screen === 'play' && game.phase === 'ask' && !game.paused) {
      const id = hitSpot(p.x, p.y);
      if (id && id.indexOf('card:') === 0) {
        const who = mousePlayer();
        game.focus[who] = Number(id.slice(5));
        game.focusOn[who] = true;
      }
    }
  }
  function moveFocus(p, dir) {
    if (game.mode === 'DUEL') {
      if (game.pilots[p].stun > 0 || game.pilots[p].lives <= 0) return;
    } else if (game.mode === 'COOP') {
      if (p !== activePlayer()) {
        toast('WAIT — ' + PILOTS[activePlayer()].badge + ' PLAYS THIS STEP');
        return;
      }
    } else if (p !== 0) return;
    game.focus[p] = (game.focus[p] + dir + 4) % 4;
    game.focusOn[p] = true;
  }
  function confirmFocus(p) {
    choose(p, game.focus[p]);
  }
  function onKeyDown(e) {
    unlock();
    const code = e.code;
    if (code === 'ArrowLeft' || code === 'ArrowRight' || code === 'ArrowUp' || code === 'ArrowDown' || code === 'Space' || code === 'Enter' || KEY_MAP[code] || code === 'KeyM' || code === 'Escape') {
      e.preventDefault();
    }
    if (e.repeat) return;
    if (code === 'KeyM') {
      toggleMute();
      return;
    }
    if (game.screen === 'title') {
      if (code === 'ArrowUp') titleRow = (titleRow + 3) % 4;
      else if (code === 'ArrowDown') titleRow = (titleRow + 1) % 4;
      else if (code === 'ArrowLeft' && titleRow < 3) cycleRow(-1);
      else if (code === 'ArrowRight' && titleRow < 3) cycleRow(1);
      else if (code === 'Enter' || code === 'Space') startMatch();
      return;
    }
    if (game.screen === 'result') {
      if (code === 'Enter' || code === 'Space') startMatch();
      else if (code === 'Escape') {
        game.screen = 'title';
        announce('Tycoon Vault title.');
      }
      return;
    }
    if (code === 'Escape') {
      if (game.phase === 'celebrate' || game.phase === 'timeout' || game.phase === 'dead') return;
      game.paused = !game.paused;
      return;
    }
    if (game.paused) {
      if (code === 'Enter' || code === 'Space') game.paused = false;
      return;
    }
    if (game.phase === 'celebrate' || game.phase === 'timeout' || game.phase === 'dead') {
      if (game.inputLock <= 0 && (code === 'Enter' || code === 'Space' || KEY_MAP[code])) skipWait();
      return;
    }
    if (game.phase !== 'ask') return;
    if (KEY_MAP[code]) {
      const map = KEY_MAP[code];
      if (map.p >= game.players) return;
      game.focus[map.p] = map.s;
      game.focusOn[map.p] = true;
      choose(map.p, map.s);
      return;
    }
    if (code === 'ArrowLeft') moveFocus(0, -1);
    else if (code === 'ArrowRight') moveFocus(0, 1);
    else if (code === 'ArrowUp') moveFocus(0, -1);
    else if (code === 'ArrowDown') moveFocus(0, 1);
    else if (code === 'Space' || code === 'Enter') confirmFocus(0);
  }
  function pollPads() {
    const nav = typeof navigator !== 'undefined' ? navigator : null;
    if (!nav || !nav.getGamepads) return;
    const list = nav.getGamepads();
    if (!list) return;
    for (let i = 0; i < 3; i++) {
      const gp = list[i];
      if (!gp) {
        padState[i] = {};
        continue;
      }
      const b = (n) => !!(gp.buttons[n] && (gp.buttons[n].pressed || gp.buttons[n].value > 0.5));
      const ax = gp.axes && gp.axes.length ? gp.axes[0] : 0;
      const ay = gp.axes && gp.axes.length > 1 ? gp.axes[1] : 0;
      const now = {
        left: b(14) || ax < -0.55,
        right: b(15) || ax > 0.55,
        up: b(12) || ay < -0.55,
        down: b(13) || ay > 0.55,
        a: b(0),
        start: b(9)
      };
      const prev = padState[i] || {};
      const edge = (k) => now[k] && !prev[k];
      if (i < game.players || game.screen !== 'play') handlePad(i, edge);
      padState[i] = now;
    }
  }
  function handlePad(i, edge) {
    if (edge('start') || (game.screen === 'title' && i === 0 && edge('a'))) {
      unlock();
      if (game.screen === 'title' && (edge('start') || edge('a'))) startMatch();
      else if (game.screen === 'play' && edge('start')) game.paused = !game.paused;
      else if (game.screen === 'result' && i === 0 && (edge('start') || edge('a'))) startMatch();
      return;
    }
    if (game.screen === 'title') {
      if (i !== 0) return;
      if (edge('up')) titleRow = (titleRow + 3) % 4;
      else if (edge('down')) titleRow = (titleRow + 1) % 4;
      else if (edge('left') && titleRow < 3) cycleRow(-1);
      else if (edge('right') && titleRow < 3) cycleRow(1);
      return;
    }
    if (game.screen === 'result') return;
    if (game.paused || game.screen !== 'play') return;
    if (game.phase === 'celebrate' || game.phase === 'timeout' || game.phase === 'dead') {
      if (edge('a') && game.inputLock <= 0) skipWait();
      return;
    }
    if (game.phase !== 'ask') return;
    if (edge('left') || edge('up')) moveFocus(i, -1);
    if (edge('right') || edge('down')) moveFocus(i, 1);
    if (edge('a')) confirmFocus(i);
  }

  function boot() {
    canvas = document.getElementById('gameCanvas');
    if (!canvas || !canvas.getContext) return;
    ctx = canvas.getContext('2d');
    live = document.getElementById('live');
    reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    sound.muted = !!storageGet('tvault-mute', false);
    game.bestSolo = storageGet('tvault-best-solo', 0) || 0;
    game.bestCoop = storageGet('tvault-best-coop', 0) || 0;
    resize();
    window.addEventListener('resize', resize);
    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('keydown', onKeyDown);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    announce('Tycoon Vault. Choose players, grade, and mode, then open the vault.');
    requestAnimationFrame(frame);
  }

  boot();
})();
</script>
</body>
</html>
