<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #021610;

<canvas id="gameCanvas" tabindex="0" role="application" aria-label="Tycoon Vault. Pictorial bar-model showdown for Singapore Primary 4 to 6 fraction heuristics. Step 1 locks the equal unit split. Step 2 claims the asset value. Player 1 uses the mouse, keys 1 to 4, arrows and space, or gamepad 0. Player 2 uses Q W E R or gamepad 1. Player 3 uses U I O P or gamepad 2."></canvas>
<div id="live" class="sr" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const FONT = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
  const GOLD = '#f6c445';
  const GOLD_DEEP = '#b45309';
  const CREAM = '#fff6d8';
  const INK = '#06281c';
  const EMERALD = '#0f3d2e';
  const MINT = '#34d399';

  const NAMES = ['Asher', 'Bernard', 'Melanie', 'Arnie', 'Gina', 'Harun'];
  const CAST = {
    Asher:   { skin: '#f3c7a4', suit: '#6d28d9', hat: '#2e1065', accent: '#fbbf24', hair: '#3b2414' },
    Bernard: { skin: '#e7b48a', suit: '#0369a1', hat: '#0c4a6e', accent: '#7dd3fc', hair: '#1c120c' },
    Melanie: { skin: '#f6d2c2', suit: '#be185d', hat: '#831843', accent: '#f9a8d4', hair: '#7c2d12' },
    Arnie:   { skin: '#e0b07a', suit: '#c2410c', hat: '#7c2d12', accent: '#fdba74', hair: '#3f1d0b' },
    Gina:    { skin: '#f7d7c4', suit: '#047857', hat: '#064e3b', accent: '#6ee7b7', hair: '#4a1d12' },
    Harun:   { skin: '#c68642', suit: '#b91c1c', hat: '#7f1d1d', accent: '#fcd34d', hair: '#1c1008' }
  };
  const PILOTS = [
    { id: 'P1', badge: 'P1 RED', duel: 'P1 CRIMSON', color: '#ff3355', ink: '#ffffff' },
    { id: 'P2', badge: 'P2 BLUE', duel: 'P2 AZURE', color: '#38bdf8', ink: '#082f49' },
    { id: 'P3', badge: 'P3 GREEN', duel: 'P3 EMERALD', color: '#34d399', ink: '#052e16' }
  ];
  const KEYS = [
    ['1', '2', '3', '4'],
    ['Q', 'W', 'E', 'R'],
    ['U', 'I', 'O', 'P']
  ];
  const KEY_MAP = {
    Digit1: { p: 0, s: 0 }, Numpad1: { p: 0, s: 0 },
    Digit2: { p: 0, s: 1 }, Numpad2: { p: 0, s: 1 },
    Digit3: { p: 0, s: 2 }, Numpad3: { p: 0, s: 2 },

    KeyQ: { p: 1, s: 0 }, KeyW: { p: 1, s: 1 }, KeyE: { p: 1, s: 2 }, KeyR: { p: 1, s: 3 },
    KeyU: { p: 2, s: 0 }, KeyI: { p: 2, s: 1 }, KeyO: { p: 2, s: 2 }, KeyP: { p: 2, s: 3 }
  };
  const TIER_META = {
    EASY: { label: 'EASY P4', short: 'P4', blurb: 'Junior Tycoon. Equal fractions and a simple “as much as” comparison.' },
    MEDIUM: { label: 'MEDIUM P5A', short: 'P5A', blurb: 'Estate Mogul. Make the numerators equal, including money left and give-aways.' },
    HARD: { label: 'HARD P5B', short: 'P5B', blurb: 'Jewelry and land. Repeated identity, then an overlapping bungalow and land plot.' },
    EXTREME: { label: 'EXTREME P6', short: 'P6', blurb: 'Global Billionaire. One asset stays unchanged. Brisk timer and combo multipliers.' }
  };
  const MODE_META = {
    SOLO: { label: 'SOLO', blurb: 'One tycoon. Mouse, keys 1–4, arrows + space, or gamepad 0.' },
    COOP: { label: 'TEAM CO-OP', blurb: 'One team net worth and shared hearts. Co-founders rotate Step 1 and Step 2.' },
    DUEL: { label: 'TYCOON DUEL', blurb: 'Same deal, fastest correct claim wins the star. A miss stuns that lane for 1.5s.' }
  };
  const TIER_OPTS = ['EASY', 'MEDIUM', 'HARD', 'EXTREME'];
  const MODE_OPTS = ['SOLO', 'COOP', 'DUEL'];
  const PLAYER_OPTS = [1, 2, 3];
  const TIME_MAX = { EASY: 46, MEDIUM: 40, HARD: 32, EXTREME: 18 };
  const ROUNDS = 8;
  const MELODY = [587.33, 739.99, 880, 739.99, 698.46, 587.33, 880, 1046.5, 1174.7, 1046.5, 880, 783.99, 698.46, 880, 587.33, 698.46];
  const BASS = [146.83, 146.83, 196, 174.61, 220, 196, 174.61, 146.83];

  const history = [];
  const hotspots = [];
  const particles = [];
  const floaters = [];
  const padState = [{}, {}, {}];

  let canvas = null;
  let ctx = null;
  let live = null;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;
  let dpr = 1;
  let animT = 0;
  let lastNow = 0;
  let reduceMotion = false;
  let titleRow = 0;

  const pointer = { x: -2000, y: -2000, down: false };

  const game = {
    screen: 'title',
    players: 1,
    tier: 'EASY',
    mode: 'SOLO',
    phase: 'intro',
    round: 0,
    step: 1,
    score: 0,
    hearts: 3,
    combo: 0,
    bestCombo: 0,
    solved: 0,
    bestSolo: 0,
    bestCoop: 0,
    newBest: false,
    question: null,
    timeMax: 46,
    timeLeft: 46,
    lastSec: 99,
    focus: [0, 0, 0],
    focusOn: [true, true, true],
    reveal: 0,
    introT: 0,
    snapT: 0,
    celeT: 0,
    inputLock: 0,
    advisor: '',
    advisorT: 0,
    toast: '',
    toastT: 0,
    shake: 0,
    flash: 0,
    mood: 'idle',
    moodT: 0,
    paused: false,
    wrong: [false, false, false, false],
    winner: -1,
    pilots: [
      { stars: 0, lives: 3, points: 0, stun: 0 },
      { stars: 0, lives: 3, points: 0, stun: 0 },
      { stars: 0, lives: 3, points: 0, stun: 0 }
    ]
  };

  const sound = {
    ctx: null,
    master: null,
    muted: false,
    ready: false,
    next: 0,
    step: 0,
    noise: null
  };

  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }
  function gcd(a, b) {
    let x = Math.abs(a | 0);
    let y = Math.abs(b | 0);
    while (y) {
      const t = x % y;
      x = y;
      y = t;
    }
    return x || 1;
  }
  function lcm(a, b) {
    if (!a || !b) return 0;
    return Math.abs(a / gcd(a, b) * b);
  }
  function comma(n) {
    const v = Math.round(n);
    const s = String(Math.abs(v));
    let out = '';
    for (let i = 0; i < s.length; i++) {
      if (i > 0 && (s.length - i) % 3 === 0) out += ',';
      out += s[i];
    }
    return (v < 0 ? '-' : '') + out;
  }
  function storageGet(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw == null) return fallback;
      return JSON.parse(raw);
    } catch (err) {
      return fallback;
    }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* ignore quota */ }
  }
  function announce(text) {
    if (live) live.textContent = text;
  }
  function fmtMoney(n) { return '$' + comma(n) + 'M'; }
  function fmtArea(n) { return comma(n) + ' m²'; }
  function fmtCount(n, one, many) {
    const v = Math.round(n);
    return comma(v) + ' ' + (v === 1 ? one : many);
  }
  function up(name) { return String(name).toUpperCase(); }

  function pickNames(n) {
    return shuffle(NAMES).slice(0, n);
  }
  function modelOf(n1, d1, n2, d2) {
    if (n1 < 1 || n2 < 1 || n1 >= d1 || n2 >= d2) return null;
    const L = lcm(n1, n2);
    if (L % n1 !== 0 || L % n2 !== 0) return null;
    const uA = d1 * (L / n1);
    const uB = d2 * (L / n2);
    if (uA < 1 || uB < 1 || uA > 12 || uB > 12 || uA === uB) return null;
    return { n1: n1, d1: d1, n2: n2, d2: d2, L: L, uA: uA, uB: uB };
  }
  function sameRatio(parts, correct) {
    if (!parts || parts.length !== correct.length) return false;
    if (parts[0].units <= 0 || correct[0].units <= 0) return false;
    const r = parts[0].units / correct[0].units;
    for (let i = 1; i < parts.length; i++) {
      if (parts[i].units <= 0) return false;
      if (Math.abs(parts[i].units / correct[i].units - r) > 1e-6) return false;
    }
    return true;
  }
  function packLines(parts, trap, correct) {
    const lines = parts.map((p) => p.label + ' = ' + p.units + 'u');
    return {
      lines: lines,
      text: lines.join(' | '),
      correct: !!correct,
      trap: correct ? null : trap,
      value: null
    };
  }
  function unitOptions(correctParts, traps) {
    const correct = packLines(correctParts, null, true);
    const used = new Set([correct.text]);
    const opts = [correct];
    for (let i = 0; i < traps.length; i++) {
      const t = traps[i];
      if (!t || !t.parts || t.parts.length !== correctParts.length) continue;
      if (t.parts.some((p) => p.units < 1 || p.units > 24)) continue;
      if (sameRatio(t.parts, correctParts)) continue;
      const packed = packLines(t.parts, t.trap, false);
      if (used.has(packed.text)) continue;
      used.add(packed.text);
      opts.push(packed);
      if (opts.length === 4) break;
    }
    let salt = 1;
    while (opts.length < 4 && salt < 24) {
      const parts = correctParts.map((p) => ({ label: p.label, units: p.units }));
      const idx = salt % parts.length;
      const delta = 1 + Math.floor(salt / parts.length);
      const sign = salt % 2 === 0 ? 1 : -1;
      const next = parts[idx].units + sign * delta;
      salt += 1;
      if (next < 1 || next > 24) continue;
      parts[idx] = { label: parts[idx].label, units: next };
      if (sameRatio(parts, correctParts)) continue;
      const packed = packLines(parts, 'scale', false);
      if (used.has(packed.text)) continue;
      used.add(packed.text);
      opts.push(packed);
    }
    if (opts.length < 4) return null;
    return shuffle(opts);
  }
  function bumpUnitLine(line, salt) {
    const matches = [];
    const re = /(\d+)u/g;
    let found;
    while ((found = re.exec(line))) matches.push(found);
    if (!matches.length) return line + ' +' + salt;
    const last = matches[matches.length - 1];
    const next = Number(last[1]) + salt;
    return line.slice(0, last.index) + next + 'u' + line.slice(last.index + last[0].length);
  }
  function parseShift(lines) {
    const rows = [];
    for (let i = 0; i < lines.length; i++) {
      const stay = String(lines[i]).match(/stays (\d+)u/);
      if (stay) {
        rows.push({ before: Number(stay[1]), after: Number(stay[1]) });
        continue;
      }
      const arrow = String(lines[i]).match(/(\d+)u → (-?\d+)u/);
      if (!arrow) return null;
      rows.push({ before: Number(arrow[1]), after: Number(arrow[2]) });
    }
    return rows;
  }
  function sameShift(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i].before !== b[i].before || a[i].after !== b[i].after) return false;
    }
    return true;
  }
  function lineOptions(correctLines, traps) {
    function pack(lines, trap, correct) {
      return {
        lines: lines.slice(),
        text: lines.join(' | '),
        correct: !!correct,
        trap: correct ? null : trap,
        value: null
      };
    }
    const correct = pack(correctLines, null, true);
    const used = new Set([correct.text]);
    const opts = [correct];
    for (let i = 0; i < traps.length; i++) {
      const t = traps[i];
      if (!t || !t.lines || !t.lines.length) continue;
      const packed = pack(t.lines, t.trap, false);
      if (used.has(packed.text)) continue;
      used.add(packed.text);
      opts.push(packed);
      if (opts.length === 4) break;
    }
    let salt = 1;
    while (opts.length < 4 && salt < 12) {
      const lines = correctLines.slice();
      const idx = (salt - 1) % lines.length;
      lines[idx] = bumpUnitLine(lines[idx], salt);
      salt += 1;
      const parsed = parseShift(lines);
      if (parsed && sameShift(parsed, parseShift(correctLines))) continue;
      const packed = pack(lines, 'scale', false);
      if (used.has(packed.text)) continue;
      used.add(packed.text);
      opts.push(packed);
    }
    if (opts.length < 4) return null;
    return shuffle(opts);
  }
  function valueOptions(correctValue, format, pool) {
    const correctText = format(correctValue);
    const correct = {
      lines: [correctText],
      text: correctText,
      correct: true,
      trap: null,
      value: correctValue
    };
    const used = new Set([correctValue]);
    const texts = new Set([correctText]);
    const opts = [correct];
    for (let i = 0; i < pool.length; i++) {
      const v = Math.round(pool[i].value);
      if (v <= 0 || used.has(v)) continue;
      const text = format(v);
      if (texts.has(text)) continue;
      used.add(v);
      texts.add(text);
      opts.push({ lines: [text], text: text, correct: false, trap: pool[i].trap || 'scale', value: v });
      if (opts.length === 4) break;
    }
    let salt = 1;
    while (opts.length < 4 && salt < 24) {
      const bump = Math.max(1, Math.round(Math.abs(correctValue) * 0.12) || 1) * salt;
      const v = salt % 2 ? correctValue + bump : correctValue - bump;
      salt += 1;
      if (v <= 0 || used.has(v)) continue;
      const text = format(v);
      if (texts.has(text)) continue;
      used.add(v);
      texts.add(text);
      opts.push({ lines: [text], text: text, correct: false, trap: 'scale', value: v });
    }
    if (opts.length < 4) return null;
    return shuffle(opts);
  }

  function advisorDenom(nameA, n1, d1, nameB, n2, d2, uA, uB, L) {
    let msg = 'Equal FRACTIONS mean the shaded parts are equal! Make the NUMERATORS the same: ';
    msg += n1 + '/' + d1 + ' = ' + L + '/' + uA;
    if (n2 !== L) msg += ' and ' + n2 + '/' + d2 + ' = ' + L + '/' + uB;
    msg += ', so ' + nameA + ' = ' + uA + ' units and ' + nameB + ' = ' + uB + ' units!';
    return msg;
  }
  function baseTips(extra) {
    return Object.assign({
      swap: 'Those units are on the wrong tycoon. Read each bar’s own fraction again.',
      diff: 'That number is the DIFFERENCE in the clue, not the amount the FIND badge asks for.',
      all: 'That number is already in the clue. The FIND badge asks for a different amount.',
      one: 'That is only one share. Read the FIND badge before you multiply.',
      unit: 'That is a single unit. Multiply by every unit in the bar you need.',
      scale: 'Find the value of 1 unit from the clue, then multiply by the units you need.',
      numer: 'The numerators already match, so the units are the denominators.',
      denom: 'Equal fractions mean the shaded parts are equal. Make the numerators the same.'
    }, extra || {});
  }

  function themePack(roll) {
    if (roll === 'money') {
      return {
        id: 'money',
        icon: 'vault',
        units: [10, 12, 15, 20, 24, 25, 30, 40, 50],
        max: 2000,
        format: fmtMoney,
        diff: (n) => fmtMoney(n),
        totalFind: 'TOTAL $M',
        noun: '$M'
      };
    }
    if (roll === 'cars') {
      return {
        id: 'cars',
        icon: 'car',
        units: [4, 5, 6, 8, 10, 12],
        max: 96,
        format: (n) => fmtCount(n, 'car', 'cars'),
        diff: (n) => comma(n) + (n === 1 ? ' CAR' : ' CARS'),
        totalFind: 'TOTAL CARS',
        noun: 'CARS'
      };
    }
    return {
      id: 'flasks',
      icon: 'flask',
      units: [4, 6, 8, 10, 12],
      max: 96,
      format: (n) => fmtCount(n, 'flask', 'flasks'),
      diff: (n) => comma(n) + (n === 1 ? ' FLASK' : ' FLASKS'),
      totalFind: 'TOTAL FLASKS',
      noun: 'FLASKS'
    };
  }
  function pickUnit(theme, totalUnits) {
    const ok = theme.units.filter((u) => totalUnits * u <= theme.max);
    return ok.length ? pick(ok) : theme.units[0];
  }

  function pairAsk(nameA, nameB, uA, uB, unit, theme) {
    const valA = uA * unit;
    const valB = uB * unit;
    const total = valA + valB;
    const diffUnits = Math.abs(uA - uB);
    const diff = diffUnits * unit;
    const bigIsA = uA > uB;
    const bigName = bigIsA ? nameA : nameB;
    const smallName = bigIsA ? nameB : nameA;
    const bigVal = bigIsA ? valA : valB;
    const smallVal = bigIsA ? valB : valA;
    const choices = [
      { id: 'total', find: theme.totalFind, value: total },
      { id: 'big', find: up(bigName), value: bigVal },
      { id: 'small', find: up(smallName), value: smallVal }
    ].filter((choice) => choice.value !== diff && choice.value !== unit);
    if (!choices.length) return null;
    const ask = pick(choices);
    const pool = [
      { value: diff, trap: 'diff' },
      { value: valA, trap: 'one' },
      { value: valB, trap: 'one' },
      { value: unit, trap: 'unit' },
      { value: total, trap: 'one' },
      { value: Math.max(1, (uA + uB - 1) * unit), trap: 'scale' },
      { value: (uA + uB + 1) * unit, trap: 'scale' },
      { value: Math.max(1, bigVal - unit), trap: 'scale' }
    ];
    return {
      valA: valA,
      valB: valB,
      total: total,
      diff: diff,
      diffUnits: diffUnits,
      unit: unit,
      bigName: bigName,
      smallName: smallName,
      ask: ask,
      pool: pool
    };
  }

  function barsFrom(labelA, uA, hiA, tagA, colorA, labelB, uB, hiB, tagB, colorB) {
    return [
      { label: labelA, units: uA, highlight: hiA, tag: tagA, color: colorA, hot: '#ffe38a' },
      { label: labelB, units: uB, highlight: hiB, tag: tagB, color: colorB, hot: '#ffe38a' }
    ];
  }

  function finishPair(o) {
    const step1 = unitOptions(
      [
        { label: o.labelA, units: o.uA },
        { label: o.labelB, units: o.uB }
      ],
      o.traps
    );
    const step2 = valueOptions(o.solved.ask.value, o.theme.format, o.solved.pool);
    if (!step1 || !step2) return null;
    return {
      id: o.id,
      tier: o.tier,
      kind: o.kind,
      model: 'bars',
      cast: o.cast,
      icons: o.icons,
      badges: o.badges,
      find: o.solved.ask.find,
      step1Title: 'LOCK THE UNIT SPLIT',
      bars: o.bars,
      step1: step1,
      step2: step2,
      advisors: o.advisors,
      because: o.because,
      unitCaption: '1 unit = ' + o.theme.format(o.solved.unit),
      audit: o.audit
    };
  }

  function genEasyEqual() {
    for (let attempt = 0; attempt < 40; attempt++) {
      const d1 = randInt(2, 6);
      const n1 = randInt(1, Math.min(3, d1 - 1));
      const d2 = randInt(d1 === 2 ? 3 : 2, 8);
      const n2 = randInt(1, Math.min(3, d2 - 1));
      const g1 = gcd(n1, d1);
      const g2 = gcd(n2, d2);
      const a = n1 / g1;
      const b = d1 / g1;
      const c = n2 / g2;
      const d = d2 / g2;
      if (a !== c) continue;
      if (b === d) continue;
      const m = modelOf(a, b, c, d);
      if (!m || m.uA > 8 || m.uB > 8) continue;
      const names = pickNames(2);
      const theme = themePack(Math.random() < 0.7 ? 'money' : (Math.random() < 0.5 ? 'flasks' : 'cars'));
      const unit = pickUnit(theme, m.uA + m.uB);
      const solved = pairAsk(names[0], names[1], m.uA, m.uB, unit, theme);
      if (!solved) continue;
      const rich = m.uA > m.uB ? names[0] : names[1];
      const poor = rich === names[0] ? names[1] : names[0];
      const traps = [
        { trap: 'swap', parts: [{ label: names[0], units: m.uB }, { label: names[1], units: m.uA }] },
        { trap: 'numer', parts: [{ label: names[0], units: a }, { label: names[1], units: c }] },
        { trap: 'scale', parts: [{ label: names[0], units: Math.abs(m.uA - m.uB) }, { label: names[1], units: m.uB }] },
        { trap: 'scale', parts: [{ label: names[0], units: m.uA + a }, { label: names[1], units: m.uB }] }
      ];
      const because = a + '/' + b + ' of ' + names[0] + ' equals ' + c + '/' + d + ' of ' + names[1] + '. Numerators match, so ' + names[0] + ' = ' + m.uA + ' units and ' + names[1] + ' = ' + m.uB + ' units. Difference = ' + solved.diffUnits + ' unit' + (solved.diffUnits === 1 ? '' : 's') + ' = ' + theme.format(solved.diff) + '. ' + solved.ask.find + ' = ' + theme.format(solved.ask.value) + '.';
      return finishPair({

  function genMedGive() {
    for (let attempt = 0; attempt < 60; attempt++) {

      const leftM = qM - pM;
      const N = randInt(2, 4);
      let cNum = N * leftM;
      let cDen = qM;
      const g = gcd(cNum, cDen);
      cNum /= g;
      cDen /= g;
      const L = lcm(leftC, cNum);
      if (L % leftC !== 0 || L % cNum !== 0) continue;
      const uC = qC * (L / leftC);
      const uM = cDen * (L / cNum);
      if (uC < 1 || uM < 1 || uC > 12 || uM > 12 || uC + uM > 16) continue;
      const step = N / gcd(L, N);
      let k = step;
      let guard = 0;
      while (k * (uC + uM) < 12 && guard < 8) {
        k += step;
        guard += 1;
      }
      const total = k * (uC + uM);
      if (total < 12 || total > 72) continue;
      const cars = k * uC;
      const bikes = k * uM;
      if (cars % qC !== 0 || bikes % qM !== 0) continue;
      const carsLeft = cars * leftC / qC;
      const bikesLeft = bikes * leftM / qM;
      const carsGiven = cars - carsLeft;
      const bikesGiven = bikes - bikesLeft;
      if (carsLeft !== N * bikesLeft) continue;
      if (L % N !== 0) continue;
      if (carsLeft % k !== 0 || bikesLeft % k !== 0) continue;
      if (carsGiven <= 0 || bikesGiven <= 0 || carsLeft <= 0 || bikesLeft <= 0) continue;
      if ([cars, bikes, carsLeft, bikesLeft, carsGiven, bikesGiven].some((v) => v !== Math.round(v))) continue;

        { trap: 'swap', parts: [{ label: 'Cars', units: uM }, { label: 'Bikes', units: uC }] },
        { trap: 'numer', parts: [{ label: 'Cars', units: leftC }, { label: 'Bikes', units: leftM * N }] }

      return {

        badges: [

          'LEFT CARS = ' + N + '× LEFT BIKES',
          'HAD ' + total,
          'FIND: ' + ask.find
        ],

          { label: 'Bikes', units: uM, highlight: hiM, tag: 'left ' + leftM + '/' + qM, color: '#c2410c', hot: '#fdba74' }
        ],

          times: 'Left cars are ' + N + ' times the left bikes. Multiply the bikes’ leftover fraction by ' + N + ' before you match units.',

  function genIdentity() {

        ],

      const because = 'Rings appear in both clues. Multiply (' + a + ' : ' + b + ') by ' + (L / a) + ' so rings match: ' + uR + ' : ' + uN + ' : ' + uB + '. ' + totalU + ' units = ' + total + ', so 1 unit = ' + k + '. ' + ask.find + ' = ' + fmtJewel(ask.value, ask.id) + '.';

        icons: ['ring', 'necklace', 'bracelet'],
        badges: [
          'RINGS = ' + a + '/' + b + ' OF NECKLACES',
          second,
          total + ' JEWELS',
          'FIND: ' + ask.find
        ],
        find: ask.find,
        step1Title: 'LOCK THE UNIT SPLIT',
        bars: [
          { label: 'Rings', units: uR, highlight: uR, tag: a + ' : ' + b, color: '#0284c7', hot: '#7dd3fc' },
          { label: 'Necks', units: uN, highlight: uN, tag: 'necklaces', color: '#be185d', hot: '#f9a8d4' },
          { label: 'Bands', units: uB, highlight: uB, tag: 'bracelets', color: '#b45309', hot: '#fcd34d' }
        ],
        step1: step1,
        step2: step2,
        advisors: baseTips({
          identity: 'Diamond Rings appear in BOTH clues! Multiply (' + a + ' : ' + b + ') by ' + (L / a) + ' so Rings = ' + uR + ' units in both: ' + uR + ' : ' + uN + ' : ' + uB + '!',
          swap: 'Necklaces and bracelets swapped. Rings are the item that appears in both clues.',
          one: 'That is a different jewel. Read the FIND badge.'
        }),
        because: because,
        unitCaption: '1 unit = ' + k + (k === 1 ? ' jewel' : ' jewels'),
        audit: {
          type: 'identity',
          a: a, b: b, c: c, d: d,
          uR: uR, uN: uN, uB: uB, k: k,
          rings: rings, necks: necks, braces: braces, total: total,
          ask: ask.id, answer: ask.value
        }
      };
    }
    return null;
  }

  function genOverlap() {
    for (let attempt = 0; attempt < 50; attempt++) {
      let p = randInt(1, 4);
      let q = randInt(p + 1, 6);
      const g0 = gcd(p, q);
      p /= g0;
      q /= g0;
      let a = randInt(1, 3);
      let b = randInt(a + 1, 4);
      const g1 = gcd(a, b);
      a /= g1;
      b /= g1;
      const scale = b / gcd(p, b);
      const uB = p * scale;
      const uL = q * scale;
      if (uB < 2 || uL <= uB || uB > 10 || uL > 12) continue;
      if ((a * uB) % b !== 0) continue;
      const uO = a * uB / b;
      if (uO < 1 || uO >= uB || uO >= uL) continue;
      const uFreeB = uB - uO;
      const uFreeL = uL - uO;
      const uFree = uFreeB + uFreeL;
      if (uFreeB < 1 || uFreeL < 1 || uFree > 14) continue;
      const unitChoices = [6, 7, 8, 9, 10, 12, 14, 15, 16, 18, 20, 24, 28];
      const unit = pick(unitChoices);
      const unshaded = uFree * unit;
      const bung = uB * unit;
      const land = uL * unit;
      const overlap = uO * unit;
      if (land > 360) continue;
      const asks = [
        { id: 'bung', find: 'BUNGALOW', value: bung },
        { id: 'land', find: 'LAND', value: land },
        { id: 'overlap', find: 'OVERLAP', value: overlap }
      ];
      const ask = pick(asks.filter((choice) => choice.value !== unshaded && choice.value !== unit));
      if (!ask) continue;
      const pool = [
        { value: bung, trap: 'one' },
        { value: land, trap: 'one' },
        { value: overlap, trap: 'one' },
        { value: unshaded, trap: 'diff' },
        { value: unit, trap: 'unit' },
        { value: uFreeB * unit, trap: 'scale' },
        { value: uFreeL * unit, trap: 'scale' }
      ];
      const traps = [
        { trap: 'swap', parts: [{ label: 'Bungalow', units: uL }, { label: 'Land', units: uB }] },
        { trap: 'overlap', parts: [{ label: 'Bungalow', units: p }, { label: 'Land', units: q }] },
        { trap: 'overlap', parts: [{ label: 'Bungalow', units: a }, { label: 'Land', units: b }] },
        { trap: 'scale', parts: [{ label: 'Bungalow', units: uFreeB }, { label: 'Land', units: uFreeL }] }
      ];
      const step1 = unitOptions(
        [{ label: 'Bungalow', units: uB }, { label: 'Land', units: uL }],
        traps
      );
      const step2 = valueOptions(ask.value, fmtArea, pool);
      if (!step1 || !step2) continue;
      const because = 'Bungalow is ' + p + '/' + q + ' of the land, drawn as ' + uB + ' units to ' + uL + ' units. Overlap = ' + a + '/' + b + ' of the bungalow = ' + uO + ' units. Unshaded = ' + uFreeB + ' + ' + uFreeL + ' = ' + uFree + ' units = ' + fmtArea(unshaded) + '. 1 unit = ' + fmtArea(unit) + '. ' + ask.find + ' = ' + fmtArea(ask.value) + '.';
      return {
        id: 'hard-over|' + p + '/' + q + '|' + a + '/' + b + '|' + unshaded + '|' + ask.id,
        tier: 'HARD',
        kind: 'overlap',
        model: 'overlap',
        cast: [pick(NAMES)],
        icons: ['house', 'plot'],
        badges: [
          'BUNGALOW = ' + p + '/' + q + ' OF LAND',
          a + '/' + b + ' OF BUNGALOW OVERLAPS',
          'UNSHADED = ' + fmtArea(unshaded),
          'FIND: ' + ask.find
        ],
        find: ask.find,
        step1Title: 'LOCK THE UNIT SPLIT',
        bars: [
          { label: 'Bungalow', units: uB, highlight: uO, tag: p + '/' + q, color: '#d97706', hot: '#fde68a' },
          { label: 'Land', units: uL, highlight: uO, tag: 'land', color: '#15803d', hot: '#86efac' }
        ],
        overlap: { uB: uB, uL: uL, uO: uO, uFreeB: uFreeB, uFreeL: uFreeL, uFree: uFree },
        step1: step1,
        step2: step2,
        advisors: baseTips({
          overlap: 'Bungalow is ' + p + '/' + q + ' of the land, so use ' + uB + ' units against ' + uL + '. ' + a + '/' + b + ' of the bungalow overlaps = ' + uO + ' units. Unshaded = ' + uFreeB + ' + ' + uFreeL + ' = ' + uFree + ' units!',
          swap: 'The bungalow is the smaller region. Land has more units.',
          diff: 'That area is the UNSHADED total from the clue, not the region the FIND badge names.'
        }),
        because: because,
        unitCaption: '1 unit = ' + fmtArea(unit),
        audit: {
          type: 'overlap',
          p: p, q: q, a: a, b: b,
          uB: uB, uL: uL, uO: uO, uFree: uFree, unit: unit,
          bung: bung, land: land, overlap: overlap, unshaded: unshaded,
          ask: ask.id, answer: ask.value
        }
      };
    }
    return null;
  }

  function genUnchanged() {
    for (let attempt = 0; attempt < 70; attempt++) {
      let p = randInt(1, 4);
      let q = randInt(p + 1, 7);
      const g0 = gcd(p, q);
      p /= g0;
      q /= g0;
      const ofTotal = Math.random() < 0.5;
      let r;
      let s;
      let afterAparts;
      let afterBparts;
      if (ofTotal) {
        r = randInt(1, 3);
        s = randInt(r + 2, 8);
        afterAparts = r;
        afterBparts = s - r;
      } else {
        r = randInt(1, 5);
        s = randInt(2, 8);
        if (r === s) continue;
        const g1 = gcd(r, s);
        r /= g1;
        s /= g1;
        afterAparts = r;
        afterBparts = s;
      }
      if (afterBparts < 1) continue;
      const L = lcm(p, afterAparts);
      if (L % p !== 0 || L % afterAparts !== 0) continue;
      const beforeA = L;
      const beforeB = q * (L / p);
      const afterA = L;
      const afterB = afterBparts * (L / afterAparts);
      if ([beforeA, beforeB, afterA, afterB].some((v) => v < 1 || v > 12)) continue;
      const delta = afterB - beforeB;
      if (delta === 0 || Math.abs(delta) > 4) continue;
      const yacht = Math.random() < 0.45;
      const unitList = yacht
        ? [8, 10, 12, 15, 16, 20, 24, 30, 40, 50]
        : [20, 30, 40, 50, 60, 80, 90, 100, 120, 150, 180];
      const unit = pick(unitList);
      const change = Math.abs(delta) * unit;
      const valueA = beforeA * unit;
      const valueBb = beforeB * unit;
      const valueBa = afterB * unit;
      const totalBefore = (beforeA + beforeB) * unit;
      const totalAfter = (afterA + afterB) * unit;
      const cap = yacht ? 500 : 2400;
      if (totalAfter > cap || valueA <= 0 || change <= 0) continue;
      const names = pickNames(2);
      const asks = [
        { id: 'A', find: up(names[0]), value: valueA },
        { id: 'Bbefore', find: up(names[1]) + ' BEFORE', value: valueBb },
        { id: 'Bafter', find: up(names[1]) + ' AFTER', value: valueBa },
        { id: 'totalAfter', find: yacht ? 'VIPS AFTER' : 'TOTAL AFTER', value: totalAfter }
      ];
      const ask = pick(asks.filter((choice) => choice.value !== change && choice.value !== unit));
      if (!ask) continue;
      const format = yacht
        ? (n) => fmtCount(n, 'VIP', 'VIPs')
        : fmtMoney;
      const pool = [
        { value: change, trap: 'diff' },
        { value: valueA, trap: 'one' },
        { value: valueBb, trap: 'one' },
        { value: valueBa, trap: 'one' },
        { value: totalAfter, trap: 'one' },
        { value: totalBefore, trap: 'scale' },
        { value: p * unit, trap: 'unchanged' },
        { value: unit, trap: 'unit' }
      ];
      const added = delta > 0;
      const changeBadge = yacht
        ? (added ? '+' + change + ' VIPS ON ' + up(names[1]) : change + ' VIPS LEAVE ' + up(names[1]))
        : (added ? '+' + fmtMoney(change) + ' INTO ' + up(names[1]) : '−' + fmtMoney(change) + ' FROM ' + up(names[1]));
      const afterBadge = ofTotal
        ? up(names[0]) + ' = ' + r + '/' + s + ' OF ALL'
        : up(names[0]) + ' = ' + r + '/' + s + ' OF ' + up(names[1]);
      const correctLines = [
        names[0] + ' stays ' + beforeA + 'u',
        names[1] + '  ' + beforeB + 'u → ' + afterB + 'u'
      ];
      const traps = [
        {
          trap: 'unchanged',
          lines: [
            names[0] + '  ' + beforeA + 'u → ' + (beforeA + delta) + 'u',
            names[1] + ' stays ' + beforeB + 'u'
          ]
        },
        {
          trap: 'unchanged',
          lines: [
            names[0] + '  ' + p + 'u → ' + afterAparts + 'u',
            names[1] + '  ' + q + 'u → ' + afterBparts + 'u'
          ]
        },
        {
          trap: 'scale',
          lines: [
            names[0] + ' stays ' + p + 'u',
            names[1] + '  ' + q + 'u → ' + afterBparts + 'u'
          ]
        },
        {
          trap: 'swap',
          lines: [
            names[0] + '  ' + beforeA + 'u → ' + beforeB + 'u',
            names[1] + ' stays ' + afterB + 'u'
          ]
        }
      ];
      const correctShift = parseShift(correctLines);
      const freshTraps = [];
      for (let t = 0; t < traps.length; t++) {
        const parsed = parseShift(traps[t].lines);
        if (!parsed || parsed.some((row) => !row || row.before < 1 || row.after < 1)) continue;
        if (sameShift(parsed, correctShift)) continue;
        freshTraps.push(traps[t]);
      }
      const step1 = lineOptions(correctLines, freshTraps);
      const step2 = valueOptions(ask.value, format, pool);
      if (!step1 || !step2) continue;
      const assetWord = yacht ? 'VIPs' : 'gold';
      const because = names[0] + ' stays the same: ' + beforeA + ' units before and after. ' + names[1] + ' goes from ' + beforeB + ' to ' + afterB + '. That change is ' + Math.abs(delta) + ' unit' + (Math.abs(delta) === 1 ? '' : 's') + ' = ' + format(change) + ', so 1 unit = ' + format(unit) + '. ' + ask.find + ' = ' + format(ask.value) + '.';
      return {
        id: 'ext|' + (yacht ? 'yacht' : 'vault') + '|' + names.join(',') + '|' + p + '/' + q + '|' + (ofTotal ? 'T' : 'B') + r + '/' + s + '|' + (added ? '+' : '-') + change + '|' + ask.id,
        tier: 'EXTREME',
        kind: 'unchanged',
        model: 'shift',
        cast: names,
        icons: yacht ? ['yacht', 'yacht'] : ['vault', 'vault'],
        yacht: yacht,
        added: added,
        shift: {
          beforeA: beforeA,
          beforeB: beforeB,
          afterA: afterA,
          afterB: afterB,
          delta: delta
        },
        badges: [
          up(names[0]) + ' = ' + p + '/' + q + ' OF ' + up(names[1]),
          changeBadge,
          afterBadge,
          'FIND: ' + ask.find
        ],
        find: ask.find,
        step1Title: 'LOCK THE UNCHANGED UNITS',
        bars: [],
        step1: step1,
        step2: step2,
        advisors: baseTips({
          unchanged: yacht
            ? 'No VIPs joined or left ' + names[0] + '! Keep ' + names[0] + "'s units the SAME before and after!"
            : 'No gold was added or removed from ' + names[0] + '! Keep ' + names[0] + "'s units the SAME before and after!",
          diff: 'That number is what changed on ' + names[1] + ' only. ' + names[0] + ' did not change.',
          scale: 'Match ' + names[0] + '’s units in both pictures before you read the change on ' + names[1] + '.'
        }),
        because: because,
        unitCaption: '1 unit = ' + format(unit),
        audit: {
          type: 'unchanged',
          yacht: yacht,
          ofTotal: ofTotal,
          p: p, q: q, r: r, s: s,
          beforeA: beforeA, beforeB: beforeB, afterA: afterA, afterB: afterB,
          delta: delta, unit: unit, change: change,
          valueA: valueA, valueBb: valueBb, valueBa: valueBa,
          totalBefore: totalBefore, totalAfter: totalAfter,
          ask: ask.id, answer: ask.value,
          assetWord: assetWord
        }
      };
    }
    return null;
  }

  function forceEasy() {
    const names = pickNames(2);
    const unit = pick([10, 20, 30, 40]);
    const theme = themePack('money');
    const solved = pairAsk(names[0], names[1], 2, 3, unit, theme);
    solved.ask = { id: 'total', find: 'TOTAL $M', value: 5 * unit };
    const traps = [
      { trap: 'swap', parts: [{ label: names[0], units: 3 }, { label: names[1], units: 2 }] },
      { trap: 'numer', parts: [{ label: names[0], units: 1 }, { label: names[1], units: 1 }] },
      { trap: 'scale', parts: [{ label: names[0], units: 4 }, { label: names[1], units: 3 }] }
    ];
    const q = finishPair({
      id: 'force|' + names.join(',') + '|' + unit + '|' + Math.random().toString(36).slice(2, 6),
      tier: 'EASY',
      kind: 'equal',
      cast: names,
      icons: ['vault', 'vault'],
      theme: theme,
      labelA: names[0],
      labelB: names[1],
      uA: 2,
      uB: 3,
      traps: traps,
      solved: solved,
      bars: barsFrom(names[0], 2, 1, '1/2', '#7c3aed', names[1], 3, 1, '1/3', '#0284c7'),
      badges: [
        '1/2 ' + up(names[0]) + ' = 1/3 ' + up(names[1]),
        up(names[1]) + ' = ' + up(names[0]) + ' + ' + fmtMoney(unit),
        'FIND: TOTAL $M'
      ],
      advisors: baseTips({
        numer: 'The numerators already match, so ' + names[0] + ' = 2 units and ' + names[1] + ' = 3 units!'
      }),
      because: '1/2 of ' + names[0] + ' equals 1/3 of ' + names[1] + '. ' + names[0] + ' = 2 units and ' + names[1] + ' = 3 units. 1 unit = ' + fmtMoney(unit) + '. Total = ' + fmtMoney(5 * unit) + '.',
      audit: {
        type: 'equal',
        n1: 1, d1: 2, n2: 1, d2: 3,
        uA: 2, uB: 3, unit: unit,
        ask: 'total', answer: 5 * unit,
        valA: 2 * unit, valB: 3 * unit
      }
    });
    return q;
  }

  function questionValid(q) {
    if (!q || !q.step1 || !q.step2 || !q.audit || !q.badges || q.badges.length < 3) return false;
    if (q.step1.length !== 4 || q.step2.length !== 4) return false;
    if (q.step1.filter((o) => o.correct).length !== 1) return false;
    if (q.step2.filter((o) => o.correct).length !== 1) return false;
    const t1 = new Set(q.step1.map((o) => o.text));
    const t2 = new Set(q.step2.map((o) => o.text));
    if (t1.size !== 4 || t2.size !== 4) return false;
    const ans = q.step2.filter((o) => o.correct)[0];
    if (!ans || ans.value !== q.audit.answer || ans.value <= 0 || ans.value !== Math.round(ans.value)) return false;
    const a = q.audit;
    if (a.type === 'equal' || a.type === 'remain') {
      const L = lcm(a.n1, a.n2);
      if (a.uA !== a.d1 * (L / a.n1) || a.uB !== a.d2 * (L / a.n2)) return false;
      if (a.n1 * a.valA * a.d2 !== a.n2 * a.valB * a.d1) return false;
      if (a.valA !== a.uA * a.unit || a.valB !== a.uB * a.unit) return false;
      let expect = 0;
      if (a.ask === 'total') expect = a.valA + a.valB;
      else if (a.ask === 'A') expect = a.valA;
      else if (a.ask === 'B') expect = a.valB;
      else if (a.ask === 'big') expect = Math.max(a.valA, a.valB);
      else if (a.ask === 'small') expect = Math.min(a.valA, a.valB);
      else if (a.ask === 'spentA') expect = a.spentA;
      else if (a.ask === 'spentB') expect = a.spentB;
      else return false;
      if (a.type === 'remain') {
        if (a.n1 !== a.d1 - a.s1) return false;
        if (a.spentA * a.d1 !== a.s1 * a.valA) return false;
        if (a.spentB * a.d2 !== a.s2 * a.valB) return false;
        if (a.leftMoney !== a.L * a.unit) return false;
      }
      if (expect !== a.answer) return false;
    } else if (a.type === 'ratio') {
      if (a.n * a.valB !== a.d * a.valA) return false;
      if (a.uA !== a.n || a.uB !== a.d) return false;
      if (a.ask === 'total' && a.answer !== a.valA + a.valB) return false;
      if (a.ask === 'big' && a.answer !== Math.max(a.valA, a.valB)) return false;
      if (a.ask === 'small' && a.answer !== Math.min(a.valA, a.valB)) return false;
    } else if (a.type === 'give') {
      if (a.cars + a.bikes !== a.total) return false;
      if (a.carsLeft !== a.N * a.bikesLeft) return false;
      if (a.carsLeft * a.qC !== a.cars * a.leftC) return false;
      if (a.bikesLeft * a.qM !== a.bikes * a.leftM) return false;
      if (a.carsGiven !== a.cars - a.carsLeft) return false;
      const map = { carsGiven: a.carsGiven, bikesGiven: a.bikesGiven, cars: a.cars, bikesLeft: a.bikesLeft };
      if (map[a.ask] !== a.answer) return false;
    } else if (a.type === 'identity') {
      if (a.rings * a.b !== a.necks * a.a) return false;
      if (a.rings * a.d !== a.braces * a.c) return false;
      if (a.rings + a.necks + a.braces !== a.total) return false;
      const map = { rings: a.rings, necks: a.necks, braces: a.braces };
      if (map[a.ask] !== a.answer) return false;
    } else if (a.type === 'overlap') {
      if (a.bung * a.q !== a.land * a.p) return false;
      if (a.overlap * a.b !== a.bung * a.a) return false;
      if (a.unshaded !== a.bung + a.land - 2 * a.overlap) return false;
      if (a.bung !== a.uB * a.unit || a.land !== a.uL * a.unit) return false;
      const map = { bung: a.bung, land: a.land, overlap: a.overlap };
      if (map[a.ask] !== a.answer) return false;
    } else if (a.type === 'unchanged') {
      if (a.beforeA !== a.afterA) return false;
      if (a.valueA * a.q !== a.valueBb * a.p) return false;
      if (a.valueBa - a.valueBb !== a.delta * a.unit) return false;
      if (a.change !== Math.abs(a.delta) * a.unit) return false;
      if (a.ofTotal) {
        if (a.valueA * a.s !== a.totalAfter * a.r) return false;
      } else if (a.valueA * a.s !== a.valueBa * a.r) return false;
      const map = { A: a.valueA, Bbefore: a.valueBb, Bafter: a.valueBa, totalAfter: a.totalAfter };
      if (map[a.ask] !== a.answer) return false;
      const correctShift = parseShift(q.step1.filter((o) => o.correct)[0].lines);
      for (let s = 0; s < q.step1.length; s++) {
        if (q.step1[s].correct) continue;
        const parsed = parseShift(q.step1[s].lines);
        if (parsed && sameShift(parsed, correctShift)) return false;
      }
    } else return false;
    if (q.bars && q.bars.length) {
      if (q.bars.some((b) => b.units < 1 || b.units > 12 || b.highlight !== Math.round(b.highlight) || b.highlight < 0 || b.highlight > b.units)) return false;
    } else if (q.model === 'bars') return false;
    return true;
  }

  function makeQuestion(tier) {
    if (tier === 'EASY') return Math.random() < 0.5 ? genEasyEqual() : genEasyCompare();
    if (tier === 'MEDIUM') {
      const r = Math.random();
      if (r < 0.34) return genMedEqual();
      if (r < 0.67) return genMedRemain();
      return genMedGive();
    }
    if (tier === 'HARD') return Math.random() < 0.52 ? genIdentity() : genOverlap();
    return genUnchanged();
  }

  function generateQuestion(tier) {
    for (let i = 0; i < 80; i++) {
      const q = makeQuestion(tier);
      if (!q || !questionValid(q)) continue;
      if (history.indexOf(q.id) >= 0) continue;
      history.push(q.id);
      if (history.length > 8) history.shift();
      q.tier = tier;
      return q;
    }
    if (history.length) history.shift();
    for (let i = 0; i < 40; i++) {
      const q = makeQuestion(tier);
      if (q && questionValid(q)) {
        history.push(q.id);
        if (history.length > 8) history.shift();
        q.tier = tier;
        return q;
      }
    }
    const q = forceEasy();
    if (q) {
      q.tier = tier;
      history.push(q.id);
      if (history.length > 8) history.shift();
    }
    return q;
  }

  function layout() {
    const cards = [];
    const gap = 12;
    const x0 = 16;
    const w = (VW - 32 - gap * 3) / 4;
    for (let i = 0; i < 4; i++) cards.push({ x: x0 + i * (w + gap), y: 458, w: w, h: 248 });
    return {
      hud: { x: 0, y: 0, w: VW, h: 52 },
      banner: { x: 16, y: 58, w: 1248, h: 150 },
      stage: { x: 16, y: 214, w: 1248, h: 200 },
      prompt: { x: 16, y: 422, w: 1248, h: 30 },
      cards: cards
    };
  }

  function activePlayer() {
    if (game.mode !== 'COOP') return 0;
    const base = game.round % game.players;
    if (game.step === 1 || game.phase === 'snap') return base;
    return (base + 1) % game.players;
  }
  function mousePlayer() {
    if (game.mode === 'COOP') return activePlayer();
    return 0;
  }

  function burst(x, y, kind, n) {

    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    while (sound.next < sound.ctx.currentTime + 0.28 && guard < 6) {
      const s = sound.step % 16;
      const delay = Math.max(0, sound.next - sound.ctx.currentTime);
      tone(BASS[Math.floor(s / 2) % BASS.length], 0.16, 'triangle', 0.035, delay);

  function sfxClick() { tone(660, 0.05, 'square', 0.04, 0); }

  }

    tone(1568, 0.06, 'square', 0.03, 0);

  }
  function sfxChing() {

    tone(1046, 0.18, 'square', 0.06, 0.21);

    tone(784, 0.1, 'square', 0.05, 0.2);
    tone(1046, 0.22, 'square', 0.06, 0.3);
    tone(784, 0.08, 'triangle', 0.03, 0.42);
    tone(1046, 0.28, 'square', 0.06, 0.5);
  }

    game.advisorT = 0;

  function onCorrectStep2(player) {
    game.mood = 'cheer';
    game.moodT = 1.2;
    game.flash = 0.7;
    game.solved += 1;
    const speed = clamp(game.timeLeft / game.timeMax, 0, 1);
    const speedBonus = Math.round(200 * speed);
    if (game.mode === 'DUEL') {
      if (game.winner >= 0) return;
      game.winner = player;
      game.pilots[player].stars += 1;
      game.pilots[player].points += 400 + speedBonus;

    if (game.combo > game.bestCombo) game.bestCombo = game.combo;
    const mult = comboMult();
    const pts = (400 + speedBonus) * mult;
    game.score += pts;
    const label = '+' + comma(pts) + (mult > 1 ? '  x' + mult : '') + (speedBonus ? '  SPEED' : '');
    floater(label, GOLD, 640, 240);
    sfxChing();
    sfxCoin();
    sfxFanfare();
    burst(420, 300, 'coin', 28);
    burst(860, 280, 'gem', 16);
    burst(640, 220, 'confetti', 22);
    game.phase = 'celebrate';
    game.celeT = 2.4;
    game.inputLock = 0.4;

  function onWrong(player, opt) {

    game.moodT = 0.7;
    game.combo = 0;
    const tip = advisorFor(game.question, opt.trap);
    game.advisor = tip;
    game.advisorT = 6.5;
    announce(tip);

      pilot.lives = Math.max(0, pilot.lives - 1);

  function timeoutRound() {

  function choose(player, index) {

  function update(dt) {

    if (game.moodT > 0) {
      game.moodT -= dt;
      if (game.moodT <= 0) game.mood = 'idle';
    }
    if (game.advisorT > 0 && game.phase === 'ask') game.advisorT -= dt;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.life <= 0) particles.splice(i, 1);

    for (let i = floaters.length - 1; i >= 0; i--) {

  function roundRect(x, y, w, h, r) {

    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);

      if (ctx.measureText(next).width > maxW && cur) {

      ctx.lineWidth = 2;

  function drawIcon(type, x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    if (type === 'vault') {
      roundRect(-s * 0.42, -s * 0.38, s * 0.84, s * 0.8, s * 0.12);

      ctx.fillStyle = '#7c4a12';
      ctx.arc(0, 0, s * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff6d8';
      ctx.font = '700 ' + Math.max(8, s * 0.22) + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, s * 0.28);
    } else if (type === 'car') {
      roundRect(-s * 0.46, -s * 0.08, s * 0.92, s * 0.32, s * 0.1);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
      roundRect(-s * 0.22, -s * 0.32, s * 0.46, s * 0.26, s * 0.08);
      ctx.fillStyle = '#fb7185';
      ctx.fill();

      ctx.beginPath(); ctx.arc(s * 0.24, s * 0.12, s * 0.16, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();

      ctx.lineTo(0, -s * 0.18);
      ctx.lineTo(s * 0.24, s * 0.12);
      ctx.lineTo(-s * 0.05, s * 0.12);
      ctx.stroke();
      ctx.fillStyle = '#f6c445';
      ctx.fillRect(-s * 0.04, -s * 0.34, s * 0.08, s * 0.16);
