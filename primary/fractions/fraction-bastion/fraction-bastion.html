    text('FRACTION BASTION', VW / 2, 78, 54, '#fff7ed', 'center', 800);
    text('Zombie Turret Defense', VW / 2, 118, 22, '#fde68a', 'center', 800);

    fillRound(36, 146, 790, 548, 22, 'rgba(255, 253, 248, 0.94)');
    text('GUNNERS', 58, 174, 13, '#0f766e', 'left', 800);
    for (let i = 0; i < 3; i++) {
      drawChoice('players', 58 + i * 246, 190, 232, 48, (i + 1) + ' PLAYER' + (i ? 'S' : ''), '', game.players === i + 1, true, { n: i + 1 });
    }
    text('GRADE', 58, 262, 13, '#0f766e', 'left', 800);
    GRADE_ORDER.forEach((id, i) => {
      const g = GRADES[id];
      drawChoice('tier', 58 + (i % 4) * 190, 278, 180, 62, g.name, g.badge + ' · ' + g.role, game.tier === id, true, { tier: id });
    });
    fitText(GRADES[game.tier].blurb, 58, 360, 14, '#334155', 'left', 700, 740);
    text('MODE', 58, 392, 13, '#0f766e', 'left', 800);
    drawChoice('mode', 58, 408, 240, 52, 'SOLO', 'One gunner', game.mode === 'SOLO', game.players === 1, { mode: 'SOLO' });
    drawChoice('mode', 310, 408, 240, 52, 'TEAM CO-OP', 'One shared score', game.mode === 'COOP', game.players > 1, { mode: 'COOP' });
    drawChoice('mode', 562, 408, 240, 52, 'BASTION DUEL', 'Own lane, own score', game.mode === 'DUEL', game.players > 1, { mode: 'DUEL' });
    if (game.mode === 'COOP') {
      text('CO-OP FIRE', 58, 484, 13, '#0f766e', 'left', 800);
      drawChoice('style', 58, 500, 360, 46, 'TAKE TURNS', '', game.coopStyle === 'TURNS', true, { style: 'TURNS' });
      drawChoice('style', 430, 500, 372, 46, 'SYNC FIRE', '', game.coopStyle === 'SYNC', true, { style: 'SYNC' });
    } else {
      text(game.players === 1 ? 'Add gunners to unlock co-op and duel.' : 'Each gunner keeps a lane, a turret, and a score.', 58, 490, 15, '#334155', 'left', 700);
    }
    const startHot = inside(pointer.x, pointer.y, { x: 58, y: 566, w: 744, h: 64 });
    spots.push({ id: 'start', x: 58, y: 566, w: 744, h: 64 });
    fillRound(58, 570, 744, 64, 16, 'rgba(0,0,0,0.15)');
    fillRound(58, startHot ? 568 : 566, 744, 64, 16, '#e11d48');
    text('DEFEND THE BASTION', 430, (startHot ? 568 : 566) + 32, 24, '#fff', 'center', 800);

    fillRound(846, 146, 400, 420, 22, 'rgba(255,253,248,0.94)');
    text('HOW TO HOLD THE WALL', 1046, 176, 14, '#0f766e', 'center', 800);
    const lines = [
      'A horde marches from the right.',
      'Pick the simplest fraction to fire.',
      'Fast correct answers upgrade the turret',
      'from a single bolt to Hyper-Nova.',
      'A wrong shell jams the turret and',
      'the engineer shows the exact fix.',
      'Keep the crystal wall above zero.'
    ];
    lines.forEach((line, i) => text(line, 870, 210 + i * 26, 14, '#142033', 'left', 700));
    text('CONTROLS', 1046, 430, 13, '#0f766e', 'center', 800);
    text('P1  Mouse · 1 2 3 4 · Pad 0', 870, 458, 14, '#9f1239', 'left', 800);
    text('P2  Q W E R · Pad 1', 870, 482, 14, '#1d4ed8', 'left', 800);
    text('P3  U I O P · Pad 2', 870, 506, 14, '#047857', 'left', 800);
    text('Arrows + Space also fire for P1.  M mutes.', 870, 534, 12, '#475569', 'left', 700);
    text('BEST TEAM SCORE  ' + fmt(game.best), 1046, 600, 16, '#fff7ed', 'center', 800);
    drawMute(1214, 12);
    ctx.fillStyle = '#fff7ed';
  }

  function drawOver() {
    drawBackdrop(0, 0, VW, VH);
    ctx.fillStyle = 'rgba(8, 30, 44, 0.45)';
    ctx.fillRect(0, 0, VW, VH);
    fillRound(240, 70, 800, 580, 24, '#fffdf8');
    const duel = game.mode === 'DUEL';
    let title = 'THE WALL HAS FALLEN';
    if (duel && game.winner >= 0) title = GUNNERS[game.winner].name + ' HOLDS THE BASTION';
    if (duel && game.winner < 0) title = 'DUEL DRAW';
    text(title, VW / 2, 130, 32, '#9f1239', 'center', 800);
    text(GRADES[game.tier].role + '  ·  ' + (duel ? 'BASTION DUEL' : game.mode === 'COOP' ? 'TEAM CO-OP' : 'SOLO'), VW / 2, 174, 16, '#334155', 'center', 700);
    text('WAVES HELD  ' + game.clearedWaves, VW / 2, 220, 22, '#0f766e', 'center', 800);
    if (!duel) {
      text('TEAM SCORE', VW / 2, 280, 14, '#64748b', 'center', 800);
      text(fmt(game.lanes[0] ? game.lanes[0].score : 0), VW / 2, 330, 48, '#142033', 'center', 800);
      text('BEST  ' + fmt(game.best), VW / 2, 380, 16, '#b45309', 'center', 800);
    } else {
      game.lanes.forEach((lane, i) => {
        const g = GUNNERS[lane.index];
        const y = 270 + i * 64;
        fillRound(340, y, 600, 52, 12, lane.index === game.winner ? '#dcfce7' : '#f8fafc');
        text(g.name, 370, y + 26, 18, g.color, 'left', 800);
        text(fmt(lane.score), 900, y + 26, 22, '#142033', 'right', 800);
      });
    }
    drawChoice('again', 340, 500, 280, 64, 'PLAY AGAIN', '', false, true, {});
    drawChoice('title', 660, 500, 280, 64, 'TITLE', '', false, true, {});
    text('Enter plays again.  Esc returns to the title.', VW / 2, 600, 14, '#64748b', 'center', 700);
    drawMute(1214, 12);
  }

  function drawPause() {
    ctx.fillStyle = 'rgba(8, 30, 44, 0.45)';
    ctx.fillRect(0, 0, VW, VH);
    fillRound(390, 220, 500, 260, 20, '#fffdf8');
    text('PAUSED', VW / 2, 280, 36, '#0f766e', 'center', 800);
    text('The horde waits. The fraction stays.', VW / 2, 324, 16, '#334155', 'center', 700);
    drawChoice('resume', 430, 360, 420, 48, 'RESUME', '', false, true, {});
    drawChoice('quit', 430, 420, 420, 48, 'RETURN TO TITLE', '', false, true, {});
    drawMute(1214, 12);
  }

  function drawPlay() {
    ctx.fillStyle = '#163246';
    ctx.fillRect(0, 0, VW, VH);
    const rects = laneRects();
    game.lanes.forEach((lane, i) => drawLane(lane, rects[i]));
    if (game.waveIntro > 0.05) {
      const boss = game.lanes.some(lane => lane.queue.indexOf('ogre') >= 0);
      fillRound(VW / 2 - 220, VH / 2 - 168, 440, game.tier === 'EXTREME' ? 86 : 64, 16, 'rgba(15,23,42,0.88)');
      text(boss ? 'MEGA-OGRE WAVE  ' + game.wave : 'WAVE  ' + game.wave, VW / 2, VH / 2 - 148, 28, '#fef3c7', 'center', 800);
      if (game.tier === 'EXTREME') text('HORDE BLITZ', VW / 2, VH / 2 - 112, 14, '#fb7185', 'center', 800);
    }
    drawHud();
    if (game.paused) drawPause();
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastNow) / 1000);
    lastNow = now;
    animT += dt;
    if (game.screen === 'play' && !game.paused) update(dt);
    pollPads();
    pumpMusic();
    spots.length = 0;
    applyTransform();
    ctx.clearRect(0, 0, VW, VH);
    if (game.screen === 'title') drawTitle();
    else if (game.screen === 'play') drawPlay();
    else drawOver();
    requestAnimationFrame(frame);
  }

  function setPlayers(n) {
    game.players = n;
    if (n === 1) game.mode = 'SOLO';
    else if (game.mode === 'SOLO') game.mode = 'COOP';
    sound.tick();
  }

  function cycleTier(dir) {
    let i = GRADE_ORDER.indexOf(game.tier);
    i = (i + dir + GRADE_ORDER.length) % GRADE_ORDER.length;
    game.tier = GRADE_ORDER[i];
    sound.tick();
  }

  function cycleMode(dir) {
    if (game.players === 1) return;
    const opts = ['COOP', 'DUEL'];
    let i = opts.indexOf(game.mode);
    if (i < 0) i = 0;
    game.mode = opts[(i + dir + opts.length) % opts.length];
    sound.tick();
  }

  function onSpot(s) {
    if (!s) return;
    if (s.id === 'mute') { sound.toggle(); return; }
    if (game.screen === 'title') {
      if (s.id === 'players') setPlayers(s.n);
      else if (s.id === 'tier') { game.tier = s.tier; sound.tick(); }
      else if (s.id === 'mode') { game.mode = s.mode; sound.tick(); }
      else if (s.id === 'style') { game.coopStyle = s.style; sound.tick(); }
      else if (s.id === 'start') startGame();
      return;
    }
    if (s.id === 'card') choose(s.lane, 0, s.n);
    else if (s.id === 'again') startGame();
    else if (s.id === 'title' || s.id === 'quit') { game.screen = 'title'; game.paused = false; }
    else if (s.id === 'resume') game.paused = false;
  }

  function unlockAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!sound.ctx) {
      sound.ctx = new AC();
      sound.master = sound.ctx.createGain();
      sound.master.gain.value = sound.muted ? 0 : 0.9;
      sound.master.connect(sound.ctx.destination);
    }
    if (sound.ctx.state === 'suspended') sound.ctx.resume();
    if (!sound.ready) {
      sound.ready = true;
      sound.next = sound.ctx.currentTime + 0.05;
    }
  }

  function tone(freq, type, dur, vol, delay, slide) {
    if (!sound.ctx || !sound.master) return;
    const t0 = sound.ctx.currentTime + (delay || 0);
    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(40, freq), t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(sound.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol, freq) {
    if (!sound.ctx || !sound.master) return;
    const rate = sound.ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * dur));
    const buffer = sound.ctx.createBuffer(1, len, rate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = sound.ctx.createBufferSource();
    src.buffer = buffer;
    const filter = sound.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq || 900;
    const gain = sound.ctx.createGain();
    gain.gain.setValueAtTime(vol, sound.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, sound.ctx.currentTime + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(sound.master);
    src.start();
  }

  sound.unlock = unlockAudio;
  sound.toggle = function () {
    unlockAudio();
    sound.muted = !sound.muted;
    if (sound.master && sound.ctx) sound.master.gain.setTargetAtTime(sound.muted ? 0 : 0.9, sound.ctx.currentTime, 0.03);
    if (!sound.muted && sound.ctx) sound.next = sound.ctx.currentTime + 0.05;
    try { localStorage.setItem('fb-bastion-mute', sound.muted ? '1' : '0'); } catch (err) { /* ignore */ }
  };
  sound.tick = function () { tone(740, 'square', 0.05, 0.04); };
  sound.shot = function () { tone(660, 'square', 0.09, 0.05, 0, 240); noise(0.05, 0.04, 1400); };
  sound.twin = function () { tone(720, 'square', 0.07, 0.045, 0, 360); tone(880, 'square', 0.07, 0.04, 0.05, 420); };
  sound.laser = function () { tone(420, 'sawtooth', 0.16, 0.04, 0, 1400); };
  sound.mortar = function () { tone(180, 'square', 0.14, 0.06, 0, 70); noise(0.1, 0.05, 400); };
  sound.nova = function () { tone(523, 'square', 0.12, 0.04); tone(659, 'square', 0.12, 0.035, 0.04); tone(784, 'square', 0.14, 0.035, 0.08); };
  sound.hit = function () { noise(0.06, 0.05, 1200); tone(320, 'square', 0.05, 0.03); };
  sound.wall = function () { tone(110, 'sawtooth', 0.18, 0.06, 0, 60); noise(0.12, 0.05, 300); };
  sound.jam = function () { tone(90, 'sawtooth', 0.28, 0.06, 0, 50); tone(70, 'square', 0.22, 0.04, 0.05); };
  sound.tierUp = function () { tone(523, 'square', 0.12, 0.05); tone(659, 'square', 0.14, 0.05, 0.08); tone(784, 'square', 0.18, 0.05, 0.16); };
  sound.fanfare = function () { [523, 659, 784, 1046].forEach((f, i) => tone(f, 'square', 0.16, 0.045, i * 0.09)); };
  sound.breach = function () { tone(196, 'sawtooth', 0.3, 0.06, 0, 55); tone(98, 'square', 0.4, 0.05, 0.1); };

  function pumpMusic() {
    if (!sound.ready || !sound.ctx || sound.muted) return;
    const now = sound.ctx.currentTime;
    if (sound.next < now - 0.02) sound.next = now + 0.02;
    const fast = game.screen === 'play' && game.lanes.some(lane => lane.fireTier >= 4);
    const step = fast ? 0.135 : 0.17;
    let guard = 0;
    while (sound.next < now + 0.24 && guard < 6) {
      const i = sound.step;
      tone(LEAD[i % LEAD.length], 'square', 0.13, 0.03, sound.next - now);
      if (i % 2 === 0) tone(BASS[(i / 2) % BASS.length], 'triangle', 0.24, 0.04, sound.next - now);
      if (i % 2 === 0) {
        const when = sound.next - now;
        if (when < 0.3) noise(0.03, 0.015, 2200);
      }
      sound.next += step;
      sound.step += 1;
      guard += 1;
    }
  }

  function onKey(code) {
    unlockAudio();
    if (code === 'KeyM') { sound.toggle(); return; }
    if (game.screen === 'title') {
      if (code === 'Digit1') setPlayers(1);
      else if (code === 'Digit2') setPlayers(2);
      else if (code === 'Digit3') setPlayers(3);
      else if (code === 'ArrowLeft') cycleTier(-1);
      else if (code === 'ArrowRight') cycleTier(1);
      else if (code === 'ArrowUp') cycleMode(-1);
      else if (code === 'ArrowDown') cycleMode(1);
      else if (code === 'KeyT' && game.mode === 'COOP') {
        game.coopStyle = game.coopStyle === 'TURNS' ? 'SYNC' : 'TURNS';
        sound.tick();
      } else if (code === 'Enter' || code === 'Space') startGame();
      return;
    }
    if (game.screen === 'over') {
      if (code === 'Enter' || code === 'Space') startGame();
      else if (code === 'Escape') game.screen = 'title';
      return;
    }
    if (code === 'Escape') {
      if (game.paused) { game.paused = false; return; }
      game.paused = true;
      return;
    }
    if (game.paused) return;
    if (code === 'ArrowLeft') moveCursor(0, -1);
    else if (code === 'ArrowRight') moveCursor(0, 1);
    else if (code === 'Space' || code === 'Enter') confirmCursor(0);
    else if (keyMap[code]) choose(laneForPlayer(keyMap[code].player) ? laneForPlayer(keyMap[code].player).index : 0, keyMap[code].player, keyMap[code].slot);
  }

  function pollPads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < 3; i++) {
      const pad = pads && pads[i];
      const mem = padMem[i];
      if (!pad) { mem.a = false; mem.start = false; continue; }
      const pressed = (n) => !!(pad.buttons[n] && pad.buttons[n].pressed);
      const ax = pad.axes && pad.axes.length ? pad.axes[0] : 0;
      const ay = pad.axes && pad.axes.length > 1 ? pad.axes[1] : 0;
      const left = pressed(14) || ax < -0.55;
      const right = pressed(15) || ax > 0.55;
      const up = pressed(12) || ay < -0.55;
      const down = pressed(13) || ay > 0.55;
      const a = pressed(0);
      const start = pressed(9);
      const lb = pressed(4);
      const rb = pressed(5);
      if (a || start || left || right || up || down) unlockAudio();
      if (start && !mem.start) {
        if (game.screen === 'title') startGame();
        else if (game.screen === 'over') startGame();
        else game.paused = !game.paused;
      }
      if (a && !mem.a) {
        if (game.screen === 'title') startGame();
        else if (game.screen === 'over') startGame();
        else if (!game.paused) confirmCursor(i);
      }
      const dir = left ? -1 : right ? 1 : 0;
      if (dir && !mem.held) {
        if (game.screen === 'title') cycleTier(dir);
        else if (!game.paused) moveCursor(i, dir);
      }
      mem.held = !!dir;
      if (up && !mem.up) {
        if (game.screen === 'title') cycleMode(-1);
        else if (!game.paused) moveCursor(i, -1);
      }
      if (down && !mem.down) {
        if (game.screen === 'title') cycleMode(1);
        else if (!game.paused) moveCursor(i, 1);
      }
      if (game.screen === 'title') {
        if (lb && !mem.lb) setPlayers(Math.max(1, game.players - 1));
        if (rb && !mem.rb) setPlayers(Math.min(3, game.players + 1));
      }
      mem.a = a;
      mem.start = start;
      mem.up = up;
      mem.down = down;
      mem.lb = lb;
      mem.rb = rb;
    }
  }

  window.addEventListener('resize', resize);
  window.addEventListener('keydown', (e) => {
    const block = e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight';
    if (block) e.preventDefault();
    if (e.repeat) return;
    onKey(e.code);
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = screenToVirtual(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
  });
  canvas.addEventListener('pointerdown', (e) => {
    canvas.focus();
    const p = screenToVirtual(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
    unlockAudio();
    onSpot(hitSpot(p.x, p.y));
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  resize();
  canvas.focus();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
