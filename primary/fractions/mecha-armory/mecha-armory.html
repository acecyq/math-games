<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mecha Armory: Remainder &amp; Firepower Command</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #070b12;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  noscript p { color: #e8f4ff; font-family: "Trebuchet MS", sans-serif; padding: 24px; }
</style>
</head>
<body>
<canvas id="gameCanvas" tabindex="0" role="application" aria-label="Mecha Armory. Remainder and firepower command for Primary 5 fractions. Each wave breaks down one bay at a time, then you compare the three racks and pick the fullest. Player 1 uses the mouse, keys 1 to 4, arrows and space, or gamepad A. Player 2 uses Q W E R or the second gamepad. Player 3 uses U I O P or the third gamepad."></canvas>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p>Mecha Armory needs JavaScript turned on.</p></noscript>
<script>
(() => {
  'use strict';

  const VW = 1280;
  const VH = 720;
  const FONT = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
  const HUD_H = 52;
  const CMD_Y = 56;
  const CMD_H = 72;
  const BAY_Y = 136;
  const BAY_H = 376;
  const BAY_W = 400;
  const BAY_X = [24, 440, 856];
  const DECK_Y = 524;
  const SOLO_TIME = { EASY: 110, MEDIUM: 120, HARD: 100, EXTREME: 80 };
  const DUEL_TIME = { EASY: 48, MEDIUM: 40, HARD: 34, EXTREME: 28 };
  const DUEL_WAVES = 6;
  const TIERS = ['EASY', 'MEDIUM', 'HARD', 'EXTREME'];
  const MODES = ['SOLO', 'COOP', 'DUEL'];
  const TIER_META = {
    EASY: { name: 'EASY', role: 'Cadet Recon', tint: '#34d399', blurb: 'Two weapon types on each vehicle. Last wave fired a fraction of each type.' },
    MEDIUM: { name: 'MEDIUM', role: 'Strike Sergeant', tint: '#38bdf8', blurb: 'Three weapon types. The next type is a fraction of what remains, not of the whole rack.' },
    HARD: { name: 'HARD', role: 'Mech Commander', tint: '#fbbf24', blurb: 'One weapon type loses a fixed salvo, then a fraction of what is left of that type.' },
    EXTREME: { name: 'EXTREME', role: 'Supreme Vanguard', tint: '#fb7185', blurb: 'Work backwards from one weapon type, then add what is left of the other.' }
  };
  const MODE_META = {
    SOLO: { name: 'SOLO', blurb: 'Break down one bay at a time, then pick the fullest rack.' },
    COOP: { name: 'TEAM CO-OP', blurb: 'One shared arsenal and shared shields. Pilots take turns on each bay.' },
    DUEL: { name: 'ARSENAL DUEL', blurb: 'Race each breakdown. The first correct lock claims that rack.' }
  };
  const PILOTS = [
    { id: 'P1', name: 'P1 RED', short: 'P1', color: '#ff3355', deep: '#9f1239', keys: ['1', '2', '3', '4'], codes: ['Digit1', 'Digit2', 'Digit3', 'Digit4'] },
    { id: 'P2', name: 'P2 BLUE', short: 'P2', color: '#3d8bff', deep: '#1d4ed8', keys: ['Q', 'W', 'E', 'R'], codes: ['KeyQ', 'KeyW', 'KeyE', 'KeyR'] },
    { id: 'P3', name: 'P3 GREEN', short: 'P3', color: '#2ee59a', deep: '#047857', keys: ['U', 'I', 'O', 'P'], codes: ['KeyU', 'KeyI', 'KeyO', 'KeyP'] }
  ];
  const VEHICLES = [
    { id: 'tank', accent: '#ffb020', names: ['TITAN TANK', 'RHINO TANK', 'BASTION TANK', 'IRONHIDE TANK', 'COLOSSUS TANK'] },
    { id: 'jet', accent: '#3ee0ff', names: ['VIPER JET', 'SPECTRE JET', 'LANCER JET', 'PHANTOM JET', 'RAZOR JET'] },
    { id: 'mech', accent: '#e879f9', names: ['AEGIS MECH', 'ASSAULT MECH', 'RONIN MECH', 'PALADIN MECH', 'WARDEN MECH'] },
    { id: 'heli', accent: '#a3e635', names: ['APACHE HELI', 'HORNET HELI', 'RAPTOR HELI', 'CYCLONE HELI', 'FALCON HELI'] }
  ];
  const WEAPONS = [
    { id: 'gun', name: 'machine-gun rounds', short: 'bullets', unit: 'rounds' },
    { id: 'missile', name: 'homing missiles', short: 'missiles', unit: 'missiles' },
    { id: 'laser', name: 'ion laser cells', short: 'cells', unit: 'cells' },
    { id: 'shell', name: 'plasma shells', short: 'shells', unit: 'shells' },
    { id: 'slug', name: 'rail slugs', short: 'slugs', unit: 'slugs' },
    { id: 'rocket', name: 'micro-rockets', short: 'rockets', unit: 'rockets' }
  ];
  const LEAD = [293.66, 349.23, 392, 440, 392, 349.23, 329.63, 293.66, 220, 261.63, 293.66, 329.63, 349.23, 293.66, 261.63, 220];
  const BASS = [73.42, 73.42, 98, 98, 87.31, 82.41, 73.42, 55];

  const history = [];
  const spots = [];
  const particles = [];
  const floaters = [];
  const held = {};
  const keyMap = {};
  PILOTS.forEach((p, pi) => {
    p.codes.forEach((code, slot) => { keyMap[code] = { player: pi, slot: slot }; });
  });
  const padMem = [0, 1, 2].map(() => ({ a: false, left: false, right: false }));
  let padPrimed = false;
  const pointer = { x: -2000, y: -2000, down: false };

  let canvas = null;
  let ctx = null;
  let live = null;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;
  let dpr = 1;
  let animT = 0;
  let lastNow = 0;
  let reduceMotion = false;
  let soloBest = 0;
  let teamBest = 0;
  let lastWinnerSlot = -1;

  const game = {
    screen: 'title',
    players: 1,
    tier: 'EASY',
    mode: 'SOLO',
    score: 0,
    best: 0,
    shields: 4,
    wave: 1,
    wavesCleared: 0,
    machines: [],
    pilots: [],
    phase: 'select',
    focus: 0,
    picked: -1,
    clock: 0,
    intro: 0,
    hold: 0,
    holdNext: '',
    celeb: 0,
    between: 0,
    note: '',
    noteTone: '',
    toast: '',
    toastT: 0,
    alarm: 0,
    shake: 0,
    paused: false,
    record: false,
    badBay: -1,
    bayStep: 0,
    guideWait: 0
  };

  const sound = {
    ctx: null,
    master: null,
    muted: false,
    ready: false,
    next: 0,
    step: 0
  };

  function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function choice(arr) { return arr[rand(0, arr.length - 1)]; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function gcd(a, b) {
    let x = Math.abs(a | 0);
    let y = Math.abs(b | 0);
    while (y) { const t = x % y; x = y; y = t; }
    return x || 1;
  }
  function fs(n, d) {
    const g = gcd(n, d);
    n = Math.round(n / g);
    d = Math.round(d / g);
    if (d < 0) { n = -n; d = -d; }
    if (d === 1) return String(n);
    return n + '/' + d;
  }
  function isPosInt(n) {
    return typeof n === 'number' && isFinite(n) && n > 0 && n < 5000 && n === Math.floor(n);
  }
  function announce(s) { if (live) live.textContent = s; }
  function winnerIndex(list) {
    let w = 0;
    for (let i = 1; i < list.length; i++) if (list[i].rem > list[w].rem) w = i;
    return w;
  }
  function startLeader(list) {
    let w = 0;
    for (let i = 1; i < list.length; i++) if (list[i].start > list[w].start) w = i;
    return w;
  }

  function loadStore() {
    try { soloBest = Number(localStorage.getItem('ma-armory-solo-best')) || 0; } catch (err) { soloBest = 0; }
    try { teamBest = Number(localStorage.getItem('ma-armory-team-best')) || 0; } catch (err) { teamBest = 0; }
    try { sound.muted = localStorage.getItem('ma-armory-mute') === '1'; } catch (err) { sound.muted = false; }
  }
  function storeBest(kind, value) {
    try { localStorage.setItem(kind === 'COOP' ? 'ma-armory-team-best' : 'ma-armory-solo-best', String(value)); } catch (err) { /* ignore */ }
  }

  function pushTrap(list, value, id, tip) {
    if (!isPosInt(value)) return;
    if (list.some(t => t.value === value)) return;
    list.push({ value: value, id: id, tip: tip });
  }
  function makeOptions(rem, traps) {
    const opts = [{ value: rem, correct: true, id: 'ok', tip: '' }];
    const used = { [rem]: true };
    for (let i = 0; i < traps.length && opts.length < 4; i++) {
      const t = traps[i];
      if (!t || used[t.value]) continue;
      used[t.value] = true;
      opts.push({ value: t.value, correct: false, id: t.id, tip: t.tip });
    }
    let salt = 1;
    while (opts.length < 4 && salt < 50) {
      const v = rem + salt * 5;
      if (!used[v]) {
        used[v] = true;
        opts.push({
          value: v,
          correct: false,
          id: 'near',
          tip: 'That count is off the model. Take each fraction of THAT weapon type, then add what is still aboard.'
        });
      }
      salt += 1;
    }
    return shuffle(opts);
  }

  function lcm(a, b) { return (a / gcd(a, b)) * b; }
  function pickShort(n) { return shuffle(WEAPONS.slice()).slice(0, n); }
  function tipStart(start, rem, unit) {
    return 'Check what the bay asks for! ' + start + ' ' + unit + ' was the STARTING loadout; only ' + rem + ' ' + unit + ' remain!';
  }
  function armOf(w, n, d, count, fireN, fireD, fired, left, extra, fixed, burst) {
    return {
      id: w.id,
      short: w.short,
      n: n,
      d: d,
      count: count,
      fireN: fireN,
      fireD: fireD,
      fired: fired,
      left: left,
      extra: extra || 0,
      fixed: fixed || 0,
      burst: burst || 0
    };
  }

  function genPair() {
    for (let attempt = 0; attempt < 120; attempt++) {
      const d = rand(2, 6);
      const n = rand(1, d - 1);
      if (gcd(n, d) !== 1) continue;
      const f1d = rand(2, 5);
      const f1n = rand(1, f1d - 1);
      if (gcd(f1n, f1d) !== 1) continue;
      const f2d = rand(2, 5);
      const f2n = rand(1, f2d - 1);
      if (gcd(f2n, f2d) !== 1) continue;
      const tStep = lcm(f1d / gcd(n, f1d), f2d / gcd(d - n, f2d));
      const startUnit = d * tStep;
      const countA = n * tStep;
      const countB = startUnit - countA;
      if (countA % f1d !== 0 || countB % f2d !== 0 || countA <= 0 || countB <= 0) continue;
      const firedA = (f1n * countA) / f1d;
      const firedB = (f2n * countB) / f2d;
      const leftA = countA - firedA;
      const leftB = countB - firedB;
      if (firedA <= 0 || firedB <= 0 || leftA <= 0 || leftB <= 0) continue;
      const remUnit = leftA + leftB;
      if (remUnit >= startUnit) continue;
      const ks = [];
      for (let k = 1; k <= 18; k++) {
        const start = startUnit * k;
        const rem = remUnit * k;
        if (start > 280) break;
        if (rem >= 18 && rem <= 140 && start >= rem + 12) ks.push(k);
      }
      if (!ks.length) continue;
      const k = choice(ks);
      const w = pickShort(2);
      const start = startUnit * k;
      const rem = remUnit * k;
      let whole = null;
      if (start % f1d === 0) {
        const guess = (f1n * start) / f1d;
        if (guess !== rem && guess !== leftA * k && guess !== countA * k) whole = guess;
      }
      return {
        type: 'pair',
        start: start,
        rem: rem,
        whole: whole,
        arms: [
          armOf(w[0], n, d, countA * k, f1n, f1d, firedA * k, leftA * k),
          armOf(w[1], d - n, d, countB * k, f2n, f2d, firedB * k, leftB * k)
        ]
      };
    }
    return null;
  }

  function genTrio() {
    for (let attempt = 0; attempt < 180; attempt++) {
      const d1 = rand(2, 5);
      const n1 = rand(1, d1 - 1);
      if (gcd(n1, d1) !== 1) continue;
      const d2 = rand(2, 4);
      const n2 = rand(1, d2 - 1);
      if (gcd(n2, d2) !== 1) continue;
      const fires = [];
      let okF = true;
      for (let i = 0; i < 3; i++) {
        const fd = rand(2, 4);
        const fn = rand(1, fd - 1);
        if (gcd(fn, fd) !== 1) { okF = false; break; }
        fires.push([fn, fd]);
      }
      if (!okF) continue;
      const keep1 = d1 - n1;
      const tStep = lcm(fires[0][1] / gcd(n1, fires[0][1]), d2 / gcd(keep1, d2));
      let found = null;
      for (let m = 1; m <= 16 && !found; m++) {
        const t = tStep * m;
        const start = d1 * t;
        if (start > 96) break;
        const countA = n1 * t;
        const rem1 = start - countA;
        if (rem1 % d2 !== 0) continue;
        const countB = (n2 * rem1) / d2;
        const countC = rem1 - countB;
        if (countB <= 0 || countC <= 0) continue;
        if (countA % fires[0][1] !== 0 || countB % fires[1][1] !== 0 || countC % fires[2][1] !== 0) continue;
        const firedA = fires[0][0] * countA / fires[0][1];
        const firedB = fires[1][0] * countB / fires[1][1];
        const firedC = fires[2][0] * countC / fires[2][1];
        const leftA = countA - firedA;
        const leftB = countB - firedB;
        const leftC = countC - firedC;
        if (firedA <= 0 || firedB <= 0 || firedC <= 0 || leftA <= 0 || leftB <= 0 || leftC <= 0) continue;
        const rem = leftA + leftB + leftC;
        if (rem >= start) continue;
        found = { start: start, rem1: rem1, countA: countA, countB: countB, countC: countC, firedA: firedA, firedB: firedB, firedC: firedC, leftA: leftA, leftB: leftB, leftC: leftC, rem: rem };
      }
      if (!found) continue;
      const ks = [];
      for (let k = 1; k <= 8; k++) {
        const start = found.start * k;
        const rem = found.rem * k;
        if (start > 300) break;
        if (rem >= 20 && rem <= 150 && start >= rem + 16) ks.push(k);
      }
      if (!ks.length) continue;
      const k = choice(ks);
      const w = pickShort(3);
      const sc = function (v) { return v * k; };
      return {
        type: 'trio',
        start: sc(found.start),
        rem: sc(found.rem),
        rem1: sc(found.rem1),
        arms: [
          armOf(w[0], n1, d1, sc(found.countA), fires[0][0], fires[0][1], sc(found.firedA), sc(found.leftA)),
          armOf(w[1], n2, d2, sc(found.countB), fires[1][0], fires[1][1], sc(found.firedB), sc(found.leftB)),
          armOf(w[2], 0, 1, sc(found.countC), fires[2][0], fires[2][1], sc(found.firedC), sc(found.leftC))
        ]
      };
    }
    return null;
  }

  function genFixedArms() {
    for (let attempt = 0; attempt < 160; attempt++) {
      const d = rand(2, 5);
      const n = rand(1, d - 1);
      if (gcd(n, d) !== 1) continue;
      const fD = rand(2, 4);
      const fN = rand(1, fD - 1);
      if (gcd(fN, fD) !== 1) continue;
      const gD = rand(2, 4);
      const gN = rand(1, gD - 1);
      if (gcd(gN, gD) !== 1) continue;
      const hits = [];
      for (let k = 1; k <= 48 && hits.length < 20; k++) {
        const start = d * k;
        if (start > 240) break;
        const countA = n * k;
        const countB = start - countA;
        if (countB % gD !== 0 || countA < fD * 2 || countB <= 0) continue;
        const firedB = (gN * countB) / gD;
        const leftB = countB - firedB;
        if (firedB <= 0 || leftB <= 0) continue;
        for (let S = 4; S <= countA - fD && hits.length < 20; S++) {
          if ((countA - S) % fD !== 0) continue;
          const frac = (fN * (countA - S)) / fD;
          const leftA = countA - S - frac;
          if (frac <= 0 || leftA <= 0) continue;
          const rem = leftA + leftB;
          if (rem < 18 || rem > 150 || start < rem + 12) continue;
          hits.push({ start: start, countA: countA, countB: countB, S: S, frac: frac, leftA: leftA, firedB: firedB, leftB: leftB, rem: rem });
        }
      }
      if (!hits.length) continue;
      const hit = choice(hits);
      const w = pickShort(2);
      const forgot = hit.countA - hit.S + hit.leftB;
      return {
        type: 'fixedarm',
        start: hit.start,
        rem: hit.rem,
        forgot: forgot === hit.rem ? null : forgot,
        arms: [
          armOf(w[0], n, d, hit.countA, fN, fD, hit.S + hit.frac, hit.leftA, 0, hit.S, hit.frac),
          armOf(w[1], d - n, d, hit.countB, gN, gD, hit.firedB, hit.leftB)
        ]
      };
    }
    return null;
  }

  function genBackArms() {
    for (let attempt = 0; attempt < 240; attempt++) {
      const dA = rand(2, 5);
      const nA = rand(1, dA - 1);
      if (gcd(nA, dA) !== 1) continue;
      const fireD = rand(2, 5);
      const fireN = rand(1, fireD - 1);
      if (gcd(fireN, fireD) !== 1) continue;
      const keep = fireD - fireN;
      const shellD = rand(2, 5);
      const shellN = rand(1, shellD - 1);
      if (gcd(shellN, shellD) !== 1) continue;
      const extra = Math.random() < 0.55 ? choice([2, 3, 4, 5, 6, 8]) : 0;
      let picked = null;
      for (let L = 12; L <= 72 && !picked; L++) {
        const base = L + extra;
        if ((base * fireD) % keep !== 0) continue;
        const missiles = (base * fireD) / keep;
        if (missiles % fireD !== 0 || missiles <= L) continue;
        const firedFrac = (fireN * missiles) / fireD;
        if (firedFrac + extra >= missiles || missiles - firedFrac - extra !== L) continue;
        if ((missiles * dA) % nA !== 0) continue;
        const start = (missiles * dA) / nA;
        if (start > 320 || start <= missiles + 8) continue;
        const shells = start - missiles;
        if (shells % shellD !== 0 || shells <= 0) continue;
        const shellFired = (shellN * shells) / shellD;
        const shellLeft = shells - shellFired;
        if (shellFired <= 0 || shellLeft <= 0) continue;
        const rem = L + shellLeft;
        if (rem >= start || rem < 18 || rem > 150) continue;
        let bad = null;
        if (extra > 0 && L > extra && ((L - extra) * fireD) % keep === 0) {
          const wrongM = ((L - extra) * fireD) / keep;
          if (isPosInt(wrongM) && wrongM !== missiles && wrongM !== rem && wrongM !== start) bad = wrongM;
        }
        picked = { L: L, extra: extra, missiles: missiles, start: start, shells: shells, shellFired: shellFired, shellLeft: shellLeft, rem: rem, firedFrac: firedFrac, bad: bad };
      }
      if (!picked) continue;
      const w = pickShort(2);
      return {
        type: 'backarm',
        start: picked.start,
        rem: picked.rem,
        bad: picked.bad,
        arms: [
          armOf(w[0], nA, dA, picked.missiles, fireN, fireD, picked.firedFrac + picked.extra, picked.L, picked.extra, 0, picked.firedFrac),
          armOf(w[1], dA - nA, dA, picked.shells, shellN, shellD, picked.shellFired, picked.shellLeft)
        ]
      };
    }
    return null;
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function buildSteps(raw) {
    const a = raw.arms;
    if (raw.type === 'pair') {
      return [
        cap(a[0].short) + ' = ' + fs(a[0].n, a[0].d) + ' of ' + raw.start + ' = ' + a[0].count + '. ' + cap(a[1].short) + ' = ' + raw.start + ' − ' + a[0].count + ' = ' + a[1].count + '.',
        'Last wave fired ' + fs(a[0].fireN, a[0].fireD) + ' of the ' + a[0].count + ' ' + a[0].short + ' (' + a[0].fired + ') and ' + fs(a[1].fireN, a[1].fireD) + ' of the ' + a[1].count + ' ' + a[1].short + ' (' + a[1].fired + ').',
        'Still aboard = (' + a[0].count + ' − ' + a[0].fired + ') + (' + a[1].count + ' − ' + a[1].fired + ').'
      ];
    }
    if (raw.type === 'trio') {
      return [
        cap(a[0].short) + ' = ' + fs(a[0].n, a[0].d) + ' of ' + raw.start + ' = ' + a[0].count + '. The remainder is ' + raw.rem1 + '.',
        cap(a[1].short) + ' = ' + fs(a[1].n, a[1].d) + ' of those REMAINING ' + raw.rem1 + ' = ' + a[1].count + '. ' + cap(a[2].short) + ' = ' + a[2].count + '. Fired ' + a[0].fired + ' ' + a[0].short + ', ' + a[1].fired + ' ' + a[1].short + ', ' + a[2].fired + ' ' + a[2].short + '.',
        'Still aboard = (' + a[0].count + ' − ' + a[0].fired + ') + (' + a[1].count + ' − ' + a[1].fired + ') + (' + a[2].count + ' − ' + a[2].fired + ').'
      ];
    }
    if (raw.type === 'fixedarm') {
      const after = a[0].count - a[0].fixed;
      return [
        cap(a[0].short) + ' = ' + fs(a[0].n, a[0].d) + ' of ' + raw.start + ' = ' + a[0].count + '. ' + cap(a[1].short) + ' = ' + a[1].count + '.',
        'The fixed ' + a[0].fixed + ' ' + a[0].short + ' leave ' + after + ', then ' + fs(a[0].fireN, a[0].fireD) + ' of those is ' + a[0].burst + '. ' + cap(a[1].short) + ' fired = ' + a[1].fired + '.',
        'Still aboard = (' + a[0].count + ' − ' + a[0].fixed + ' − ' + a[0].burst + ') + (' + a[1].count + ' − ' + a[1].fired + ').'
      ];
    }
    const keep = fs(a[0].fireD - a[0].fireN, a[0].fireD);
    const first = a[0].extra
      ? 'Add the extra ' + a[0].extra + ' back first: ' + a[0].left + ' + ' + a[0].extra + ' = ' + (a[0].left + a[0].extra) + '. That is ' + keep + ' of the ' + a[0].short + ', so they started at ' + a[0].count + '.'
      : a[0].left + ' is ' + keep + ' of the ' + a[0].short + ', so the ' + a[0].short + ' started at ' + a[0].count + '.';
    return [
      first,
      cap(a[0].short) + ' were ' + fs(a[0].n, a[0].d) + ' of the rack, so the rack was ' + raw.start + '. ' + cap(a[1].short) + ' = ' + a[1].count + ', and ' + fs(a[1].fireN, a[1].fireD) + ' of them is ' + a[1].fired + '.',
      'Still aboard = ' + a[0].left + ' + (' + a[1].count + ' − ' + a[1].fired + ').'
    ];
  }

  function packageMachine(raw, flavor) {
    if (!raw || !flavor || !raw.arms || raw.arms.length < 2) return null;
    if (!isPosInt(raw.rem) || !isPosInt(raw.start) || raw.start <= raw.rem) return null;
    const name = flavor.name;
    const a = raw.arms;
    const u = 'rounds';
    let text = '';
    let worked = '';
    let unitCode = '2.1';
    const traps = [];
    const startTip = tipStart(raw.start, raw.rem, u);
    let mainTip = 'Take the fraction of each weapon type on its own, then add what is left of every type.';
    const firedTotal = raw.start - raw.rem;
    const countSum = a.reduce(function (s, arm) { return s + arm.count; }, 0);
    const leftSum = a.reduce(function (s, arm) { return s + arm.left; }, 0);
    if (countSum !== raw.start || leftSum !== raw.rem) return null;
    if (a.some(function (arm) { return arm.fired + arm.left !== arm.count; })) return null;

    if (raw.type === 'pair') {
      text = name + ' carries ' + raw.start + ' rounds. ' + fs(a[0].n, a[0].d) + ' are ' + a[0].short + ' and the rest are ' + a[1].short + '. Last wave fired ' + fs(a[0].fireN, a[0].fireD) + ' of the ' + a[0].short + ' and ' + fs(a[1].fireN, a[1].fireD) + ' of the ' + a[1].short + '. How many rounds are still aboard?';
      worked = cap(a[0].short) + ' left ' + a[0].left + ', ' + a[1].short + ' left ' + a[1].left + '. Still aboard = ' + raw.rem + '.';
      mainTip = fs(a[0].fireN, a[0].fireD) + ' of the ' + a[0].short + ' is not ' + fs(a[0].fireN, a[0].fireD) + ' of the whole rack. Take it of the ' + a[0].count + ' ' + a[0].short + ' only.';
      pushTrap(traps, raw.whole, 'whole', mainTip);
      pushTrap(traps, a[0].left, 'onetype', a[0].left + ' is only the ' + a[0].short + ' still aboard. Add what is left of the ' + a[1].short + ' too.');
      pushTrap(traps, a[0].count, 'stack', a[0].count + ' is only the ' + a[0].short + ' at the start. A fraction of each type was fired.');
    } else if (raw.type === 'trio') {
      text = name + ' carries ' + raw.start + ' rounds. ' + fs(a[0].n, a[0].d) + ' are ' + a[0].short + '. ' + fs(a[1].n, a[1].d) + ' of the REMAINING rounds are ' + a[1].short + ', and the rest are ' + a[2].short + '. Last wave fired ' + fs(a[0].fireN, a[0].fireD) + ' of the ' + a[0].short + ', ' + fs(a[1].fireN, a[1].fireD) + ' of the ' + a[1].short + ', and ' + fs(a[2].fireN, a[2].fireD) + ' of the ' + a[2].short + '. How many rounds are still aboard?';
      worked = cap(a[0].short) + ' ' + a[0].left + ', ' + a[1].short + ' ' + a[1].left + ', ' + a[2].short + ' ' + a[2].left + '. Still aboard = ' + raw.rem + '.';
      mainTip = fs(a[1].n, a[1].d) + ' of the ' + a[1].short + ' is a fraction of the REMAINING rounds, not of the whole rack.';
      pushTrap(traps, a[0].count, 'stack', a[0].count + ' is only the ' + a[0].short + '. Two other weapon types are still on the rack.');
      pushTrap(traps, a[0].left + a[1].left, 'skip', 'That leaves out the ' + a[2].short + '. Add every weapon type that is still aboard.');
    } else if (raw.type === 'fixedarm') {
      unitCode = '2.2';
      if (a[0].fixed + a[0].burst + a[0].left !== a[0].count) return null;
      text = name + ' carries ' + raw.start + ' rounds. ' + fs(a[0].n, a[0].d) + ' are ' + a[0].short + ' and the rest are ' + a[1].short + '. Last wave fired ' + a[0].fixed + ' ' + a[0].short + ', then ' + fs(a[0].fireN, a[0].fireD) + ' of the ' + a[0].short + ' still left, and ' + fs(a[1].fireN, a[1].fireD) + ' of the ' + a[1].short + '. How many rounds are still aboard?';
      worked = 'After the fixed ' + a[0].fixed + ', ' + (a[0].count - a[0].fixed) + ' ' + a[0].short + ' remain, then ' + a[0].burst + ' more are fired. ' + cap(a[1].short) + ' left ' + a[1].left + '. Still aboard = ' + raw.rem + '.';
      mainTip = 'The fixed ' + a[0].fixed + ' ' + a[0].short + ' fire first. Then ' + fs(a[0].fireN, a[0].fireD) + ' of the ' + a[0].short + ' STILL LEFT also fire.';
      pushTrap(traps, raw.forgot, 'forgot', mainTip);
    } else if (raw.type === 'backarm') {
      unitCode = '2.3';
      const extraWords = a[0].extra ? ' and ' + a[0].extra + ' extra ' + a[0].short : '';
      text = a[0].left + ' ' + a[0].short + ' are still on ' + name + '. They remained after ' + fs(a[0].fireN, a[0].fireD) + ' of the ' + a[0].short + extraWords + ' were fired. The ' + a[0].short + ' were ' + fs(a[0].n, a[0].d) + ' of the rack, and the rest were ' + a[1].short + '. ' + fs(a[1].fireN, a[1].fireD) + ' of the ' + a[1].short + ' were fired. How many rounds are still aboard?';
      worked = cap(a[0].short) + ' left ' + a[0].left + '. ' + cap(a[1].short) + ' left ' + a[1].left + '. Still aboard = ' + raw.rem + '.';
      mainTip = a[0].extra
        ? 'Add the extra ' + a[0].extra + ' back before you divide. ' + a[0].left + ' + ' + a[0].extra + ' = ' + (a[0].left + a[0].extra) + ', and that is the kept fraction of the ' + a[0].short + '.'
        : a[0].left + ' remained after ' + fs(a[0].fireN, a[0].fireD) + ' of the ' + a[0].short + ' were fired. Find the ' + a[1].short + ' too, then add both leftovers.';
      pushTrap(traps, raw.bad, 'back', mainTip);
      pushTrap(traps, a[0].left, 'onetype', a[0].left + ' is only the ' + a[0].short + ' still aboard. Add the ' + a[1].short + ' that remain.');
      pushTrap(traps, a[0].count, 'stack', a[0].count + ' is how the ' + a[0].short + ' STARTED, not the rounds still aboard.');
    } else {
      return null;
    }

    pushTrap(traps, raw.start, 'start', startTip);
    pushTrap(traps, firedTotal, 'fired', firedTotal + ' rounds were fired. The bay asks for the rounds still aboard.');
    const options = makeOptions(raw.rem, traps);
    if (options.length !== 4 || options.filter(function (o) { return o.correct; }).length !== 1) return null;
    if (!options.some(function (o) { return o.correct && o.value === raw.rem; })) return null;
    const fracKey = a.map(function (arm) {
      return [arm.n, arm.d, arm.fireN, arm.fireD, arm.extra || 0, arm.fixed || 0].join('.');
    }).join(';');
    return {
      type: raw.type,
      unitCode: unitCode,
      name: name,
      vehicle: flavor.vehicle,
      accent: flavor.accent,
      weapon: a.map(function (arm) { return arm.short; }).join(' · '),
      unit: u,
      weaponId: a[0].id,
      text: text,
      steps: buildSteps(raw),
      worked: worked,
      start: raw.start,
      rem: raw.rem,
      decoyId: raw.type,
      tipStart: startTip,
      tipMain: mainTip,
      options: options,
      math: raw,
      sig: raw.type + '|' + raw.start + '|' + raw.rem + '|' + fracKey,
      claimed: -1
    };
  }

  function assignFlavors() {
    return shuffle(VEHICLES.slice()).slice(0, 3).map(v => ({
      name: choice(v.names),
      vehicle: v.id,
      accent: v.accent
    }));
  }

  function rollSet(tier) {
    const maker = tier === 'EASY' ? genPair : tier === 'MEDIUM' ? genTrio : tier === 'HARD' ? genFixedArms : genBackArms;
    const flavors = assignFlavors();
    const machines = [];
    for (let i = 0; i < 3; i++) {
      const packed = packageMachine(maker(), flavors[i]);
      if (!packed) return null;
      machines.push(packed);
    }
    return machines;
  }

  function emergency(tier) {
    const flavors = assignFlavors();
    const W = {
      missiles: { id: 'missile', short: 'missiles' },
      shells: { id: 'shell', short: 'shells' },
      cells: { id: 'laser', short: 'cells' },
      bullets: { id: 'gun', short: 'bullets' },
      slugs: { id: 'slug', short: 'slugs' },
      rockets: { id: 'rocket', short: 'rockets' }
    };
    let raws;
    if (tier === 'HARD') {
      raws = [
        { type: 'fixedarm', start: 96, rem: 60, forgot: 72, arms: [
          armOf(W.missiles, 1, 2, 48, 1, 3, 24, 24, 0, 12, 12),
          armOf(W.shells, 1, 2, 48, 1, 4, 12, 36)
        ] },
        { type: 'fixedarm', start: 160, rem: 54, forgot: 62, arms: [
          armOf(W.rockets, 1, 4, 40, 1, 4, 16, 24, 0, 8, 8),
          armOf(W.slugs, 3, 4, 120, 3, 4, 90, 30)
        ] },
        { type: 'fixedarm', start: 120, rem: 82, forgot: 98, arms: [
          armOf(W.cells, 1, 2, 60, 1, 3, 28, 32, 0, 12, 16),
          armOf(W.bullets, 1, 2, 60, 1, 6, 10, 50)
        ] }
      ];
    } else if (tier === 'EXTREME') {
      raws = [
        { type: 'backarm', start: 60, rem: 42, bad: null, arms: [
          armOf(W.missiles, 2, 5, 24, 1, 4, 6, 18),
          armOf(W.shells, 3, 5, 36, 1, 3, 12, 24)
        ] },
        { type: 'backarm', start: 80, rem: 50, bad: null, arms: [
          armOf(W.cells, 1, 2, 40, 1, 4, 10, 30),
          armOf(W.rockets, 1, 2, 40, 1, 2, 20, 20)
        ] },
        { type: 'backarm', start: 72, rem: 54, bad: null, arms: [
          armOf(W.slugs, 2, 3, 48, 1, 4, 12, 36),
          armOf(W.bullets, 1, 3, 24, 1, 4, 6, 18)
        ] }
      ];
    } else if (tier === 'MEDIUM') {
      raws = [
        { type: 'trio', start: 120, rem: 85, rem1: 60, arms: [
          armOf(W.missiles, 1, 2, 60, 1, 4, 15, 45),
          armOf(W.shells, 1, 3, 20, 1, 2, 10, 10),
          armOf(W.cells, 0, 1, 40, 1, 4, 10, 30)
        ] },
        { type: 'trio', start: 180, rem: 80, rem1: 120, arms: [
          armOf(W.rockets, 1, 3, 60, 1, 2, 30, 30),
          armOf(W.slugs, 1, 2, 60, 1, 2, 30, 30),
          armOf(W.bullets, 0, 1, 60, 2, 3, 40, 20)
        ] },
        { type: 'trio', start: 150, rem: 100, rem1: 90, arms: [
          armOf(W.cells, 2, 5, 60, 1, 3, 20, 40),
          armOf(W.missiles, 1, 3, 30, 1, 2, 15, 15),
          armOf(W.shells, 0, 1, 60, 1, 4, 15, 45)
        ] }
      ];
    } else {
      raws = [
        { type: 'pair', start: 96, rem: 66, whole: 32, arms: [
          armOf(W.missiles, 3, 4, 72, 1, 3, 24, 48),
          armOf(W.shells, 1, 4, 24, 1, 4, 6, 18)
        ] },
        { type: 'pair', start: 60, rem: 45, whole: null, arms: [
          armOf(W.cells, 1, 2, 30, 1, 3, 10, 20),
          armOf(W.bullets, 1, 2, 30, 1, 6, 5, 25)
        ] },
        { type: 'pair', start: 120, rem: 65, whole: 40, arms: [
          armOf(W.rockets, 1, 4, 30, 1, 3, 10, 20),
          armOf(W.slugs, 3, 4, 90, 1, 2, 45, 45)
        ] }
      ];
    }
    return raws.map((raw, i) => packageMachine(raw, flavors[i]));
  }

  function acceptable(machines, strict, hist, useHist) {
    if (!machines || machines.length !== 3 || machines.some(m => !m)) return false;
    const rems = machines.map(m => m.rem);
    const starts = machines.map(m => m.start);
    if (rems.some(n => !isPosInt(n)) || starts.some(n => !isPosInt(n))) return false;
    if (new Set(rems).size !== 3 || new Set(starts).size !== 3) return false;
    if (new Set(machines.map(m => m.sig)).size !== 3) return false;
    if (machines.some(m => m.start <= m.rem)) return false;
    if (machines.some(m => !m.options || m.options.length !== 4)) return false;
    if (strict && winnerIndex(machines) === startLeader(machines)) return false;
    if (useHist) {
      const sig = machines.map(m => m.sig).sort().join('~');
      if (hist.indexOf(sig) !== -1) return false;
    }
    return true;
  }

  function commitWave(machines, hist) {
    const sig = machines.map(m => m.sig).sort().join('~');
    if (hist.indexOf(sig) === -1) {
      hist.push(sig);
      if (hist.length > 8) hist.shift();
    }
    let placed = shuffle(machines);
    let guard = 0;
    while (winnerIndex(placed) === lastWinnerSlot && guard < 6) {
      placed = shuffle(machines);
      guard += 1;
    }
    lastWinnerSlot = winnerIndex(placed);
    placed.forEach(m => { m.claimed = -1; m.solved = false; });
    return placed;
  }

  function buildWave(tier, hist) {
    const book = hist || history;
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < 70; i++) {
        const machines = rollSet(tier);
        if (!acceptable(machines, pass === 0, book, true)) continue;
        return commitWave(machines, book);
      }
    }
    for (let i = 0; i < 12; i++) {
      const machines = emergency(tier);
      if (acceptable(machines, true, book, false)) return commitWave(machines, book);
    }
    return commitWave(emergency(tier), book);
  }

  function explainWrong(m) {
    const machines = game.machines;
    if (m === machines[startLeader(machines)] && m !== machines[winnerIndex(machines)]) return m.tipStart;
    return m.tipMain;
  }

  function bayRect(i) { return { x: BAY_X[i], y: BAY_Y, w: BAY_W, h: BAY_H }; }
  function cardRect(i) {
    const w = 292;
    const gap = 16;
    const total = w * 4 + gap * 3;
    const x0 = (VW - total) / 2;
    return { x: x0 + i * (w + gap), y: 558, w: w, h: 112 };
  }
  function duelPanelRect(i, n) {
    const gap = 16;
    const w = (VW - 48 - gap * (n - 1)) / n;
    return { x: 24 + i * (w + gap), y: 536, w: w, h: 150 };
  }

  function activePilot() {
    if (game.mode !== 'COOP') return 0;
    const n = game.players;
    if (game.phase === 'guide') return (game.wave - 1 + game.bayStep) % n;
    if (game.phase === 'select') return (game.wave + 2) % n;
    return (game.wave - 1) % n;
  }
  function allowed(pi) {
    if (game.screen !== 'play' || game.paused) return false;
    if (game.mode === 'DUEL') return pi >= 0 && pi < game.players;
    return pi === activePilot();
  }
  function toast(msg) {
    game.toast = msg;
    game.toastT = 1.35;
  }
  function bestKey() { return game.mode === 'COOP' ? 'ma-armory-team-best' : 'ma-armory-solo-best'; }

  function makePilots(n) {
    const list = [];
    for (let i = 0; i < n; i++) {
      list.push({ index: i, bay: -1, locked: false, jam: 0, score: 0, focus: 0, card: 0, jamTip: '' });
    }
    return list;
  }

  function beginWave() {
    game.machines = buildWave(game.tier, history);
    game.phase = 'guide';
    game.bayStep = 0;
    game.guideWait = 0;
    game.clock = (game.mode === 'DUEL' ? DUEL_TIME : SOLO_TIME)[game.tier];
    game.focus = 0;
    game.picked = -1;
    game.hold = 0;
    game.holdNext = '';
    game.celeb = 0;
    game.between = 0;
    game.note = '';
    game.noteTone = '';
    game.badBay = -1;
    game.intro = 0.45;
    game.pilots.forEach(p => {
      p.bay = -1;
      p.locked = false;
      p.jam = 0;
      p.focus = 0;
      p.card = 0;
      p.jamTip = '';
    });
    const who = game.mode === 'COOP' ? PILOTS[activePilot()].name + '. ' : '';
    announce(who + 'Wave ' + game.wave + '. Break down Bay 1. A fraction of each weapon type was fired. Lock the rounds still aboard.');
    sound.scan();
  }

  function startGame() {
    if (game.mode === 'SOLO') game.players = 1;
    if ((game.mode === 'COOP' || game.mode === 'DUEL') && game.players < 2) game.players = 2;
    game.screen = 'play';
    game.score = 0;
    game.shields = 4;
    game.wave = 1;
    game.wavesCleared = 0;
    game.paused = false;
    game.record = false;
    game.alarm = 0;
    game.shake = 0;
    game.best = game.mode === 'DUEL' ? 0 : (game.mode === 'COOP' ? teamBest : soloBest);
    game.pilots = makePilots(game.players);
    particles.length = 0;
    floaters.length = 0;
    beginWave();
  }

  function bankScore(amount) {
    if (game.mode === 'DUEL') return;
    game.score += amount;
    if (game.score > game.best) {
      game.best = game.score;
      game.record = true;
      if (game.mode === 'COOP') teamBest = game.score;
      else soloBest = game.score;
      storeBest(game.mode, game.score);
      sound.fanfare();
    }
  }

  function punish(note) {
    game.shields -= 1;
    game.note = note;
    game.noteTone = 'bad';
    game.alarm = 0.7;
    game.shake = reduceMotion ? 0 : 0.28;
    game.hold = 2.55;
    sound.alarm();
    if (game.shields <= 0) game.holdNext = 'over';
  }

  function chooseBay(index) {
    if (game.phase !== 'select' || game.intro > 0 || game.hold > 0) return;
    const machines = game.machines;
    const winner = machines[winnerIndex(machines)];
    const picked = machines[index];
    game.focus = index;
    if (picked !== winner) {
      game.badBay = index;
      game.holdNext = 'select';
      punish(explainWrong(picked));
      announce(picked.name + ' is not the fullest rack. ' + game.note);
      return;
    }
    game.picked = index;
    game.badBay = -1;
    bankScore(picked.rem);
    game.phase = 'celebrate';
    game.celeb = 2.05;
    game.note = picked.worked;
    game.noteTone = 'good';
    game.wavesCleared += 1;
    sound.barrage(picked.weaponId);
    spawnBurst(index, picked.weaponId, picked.accent);
    floaters.push({ text: '+' + picked.rem + ' ' + picked.unit.toUpperCase(), x: bayRect(index).x + 200, y: BAY_Y + 150, life: 1.6, max: 1.6 });
    announce(picked.name + ' is the fullest rack. ' + picked.rem + ' ' + picked.unit + ' added to the arsenal.');
  }

  function chooseGuideCard(index, pi) {
    if (game.phase !== 'guide' || game.intro > 0 || game.hold > 0 || game.guideWait > 0) return;
    const m = game.machines[game.bayStep];
    if (!m || m.solved) return;
    const opt = m.options[index];
    if (!opt) return;
    if (game.mode === 'DUEL') {
      const p = game.pilots[pi];
      if (!p || p.jam > 0) return;
      p.card = index;
      if (!opt.correct) {
        jamPilot(pi, opt.tip || m.tipMain);
        return;
      }
      m.solved = true;
      m.claimed = pi;
      p.score += m.rem;
      sound.barrage(m.weaponId);
      spawnBurst(game.bayStep, m.weaponId, m.accent);
      floaters.push({ text: '+' + m.rem, x: bayRect(game.bayStep).x + 200, y: BAY_Y + 160, life: 1.3, max: 1.3, color: PILOTS[pi].color });
      game.guideWait = 0.7;
      announce(PILOTS[pi].name + ' locked Bay ' + (game.bayStep + 1) + '. ' + m.rem + ' ' + m.unit + ' still aboard.');
      return;
    }
    game.focus = index;
    if (!opt.correct) {
      game.holdNext = 'guide';
      punish(opt.tip || m.tipMain);
      announce(game.note);
      return;
    }
    m.solved = true;
    sound.lock();
    game.guideWait = 0.45;
    announce('Bay ' + (game.bayStep + 1) + ' locked. ' + m.rem + ' ' + m.unit + ' still aboard.');
  }

  function duelLockBay(pi, index) {
    const p = game.pilots[pi];
    if (!p || p.locked || p.jam > 0 || game.phase !== 'draft' || game.intro > 0) return;
    const m = game.machines[index];
    if (!m || m.claimed >= 0) {
      jamPilot(pi, 'Another soldier already locked that bay. Claim a different war machine.');
      return;
    }
    p.bay = index;
    p.focus = index;
    p.card = 0;
    sound.lock();
  }

  function duelPickCard(pi, cardIndex) {
    const p = game.pilots[pi];
    if (!p || p.locked || p.jam > 0 || game.phase !== 'draft' || p.bay < 0) return;
    const m = game.machines[p.bay];
    if (!m || m.claimed >= 0) {
      p.bay = -1;
      jamPilot(pi, 'Another soldier already locked that bay. Claim a different war machine.');
      return;
    }
    const opt = m.options[cardIndex];
    if (!opt) return;
    if (!opt.correct) {
      const tip = opt.tip || m.tipMain;
      p.bay = -1;
      jamPilot(pi, tip);
      return;
    }
    m.claimed = pi;
    p.locked = true;
    p.score += m.rem;
    sound.barrage(m.weaponId);
    spawnBurst(p.bay, m.weaponId, m.accent);
    floaters.push({ text: '+' + m.rem, x: bayRect(p.bay).x + 200, y: BAY_Y + 120, life: 1.3, max: 1.3, color: PILOTS[pi].color });
    if (duelShouldEnd()) finishDuelWave();
  }

  function jamPilot(pi, tip) {
    const p = game.pilots[pi];
    p.jam = 1.5;
    p.jamTip = tip;
    game.alarm = 0.35;
    sound.jam();
    toast(PILOTS[pi].name + ': ' + tip);
    game.toastT = 1.5;
  }

  function advanceFromGuide() {
    game.guideWait = 0;
    game.focus = 0;
    game.pilots.forEach(p => { p.card = 0; p.jam = 0; p.jamTip = ''; });
    if (game.bayStep < 2) {
      game.bayStep += 1;
      game.phase = 'guide';
      const who = game.mode === 'COOP' ? PILOTS[activePilot()].name + '. ' : '';
      announce(who + 'Bay ' + (game.bayStep + 1) + '. Follow the breakdown, then lock the rounds still aboard.');
      return;
    }
    if (game.mode === 'DUEL') {
      finishDuelWave();
      return;
    }
    game.phase = 'select';
    const who = game.mode === 'COOP' ? PILOTS[activePilot()].name + '. ' : '';
    announce(who + 'All three racks are solved. Choose the bay with the most still aboard.');
  }

  function duelShouldEnd() {
    if (game.pilots.every(p => p.locked)) return true;
    if (game.machines.every(m => m.claimed >= 0)) return true;
    return false;
  }

  function finishDuelWave() {
    if (game.phase === 'between') return;
    game.phase = 'between';
    game.between = 1.6;
    game.guideWait = 0;
    game.wavesCleared += 1;
    announce('Wave ' + game.wave + ' draft closed.');
  }

  function endDuel() {
    game.screen = 'result';
    game.resultKind = 'duel';
    sound.fanfare();
    const top = game.pilots.reduce((a, p) => Math.max(a, p.score), 0);
    const names = game.pilots.filter(p => p.score === top).map(p => PILOTS[p.index].name);
    announce(names.join(' and ') + ' finished with ' + top + ' rounds.');
  }

  function endRun() {
    game.screen = 'result';
    game.resultKind = 'run';
    if (game.record) sound.fanfare();
    else sound.down();
    announce('Mission down. Arsenal ' + game.score + '.');
  }

  function finishHold() {
    const next = game.holdNext;
    game.hold = 0;
    game.noteTone = '';
    game.badBay = -1;
    if (next === 'over') endRun();
    else if (next === 'wave') advanceWave();
    else if (next === 'guide-next') advanceFromGuide();
    else if (next === 'select') game.phase = 'select';
    else game.phase = 'guide';
  }

  function advanceWave() {
    game.wave += 1;
    game.record = false;
    beginWave();
  }

  function onTimeout() {
    if (game.mode === 'DUEL') {
      game.machines.forEach(m => { m.solved = true; });
      finishDuelWave();
      announce('Scan window closed. Unclaimed racks stay in the hangar.');
      return;
    }
    if (game.phase === 'guide') {
      const m = game.machines[game.bayStep];
      if (m) m.solved = true;
      const last = game.bayStep >= 2;
      const note = last
        ? 'Time is up on Bay ' + (game.bayStep + 1) + '. ' + m.rem + ' ' + m.unit + ' are still aboard. Compare the three racks. ' + m.worked
        : 'Time is up on Bay ' + (game.bayStep + 1) + '. ' + m.rem + ' ' + m.unit + ' are still aboard. ' + m.worked;
      punish(note);
      if (game.shields > 0) game.holdNext = last ? 'select' : 'guide-next';
      return;
    }
    if (game.phase !== 'select') return;
    const winner = game.machines[winnerIndex(game.machines)];
    game.picked = winnerIndex(game.machines);
    punish('Scan window closed. ' + winner.name + ' still had the fullest rack: ' + winner.rem + ' ' + winner.unit + '. ' + winner.worked);
    if (game.shields > 0) game.holdNext = 'wave';
  }

  function spawnBurst(bay, weaponId, accent) {
    const b = bayRect(bay);
    const cx = b.x + b.w * 0.62;
    const cy = b.y + 110;
    const count = reduceMotion ? 10 : 32;
    const color = weaponId === 'laser' ? '#7ef7ff' : (weaponId === 'missile' || weaponId === 'rocket' ? '#ffb020' : (accent || '#ffe27a'));
    for (let i = 0; i < count; i++) {
      const ang = -Math.PI * (0.15 + Math.random() * 0.7);
      const sp = 90 + Math.random() * 280;
      const dir = Math.random() < 0.5 ? -1 : 1;
      particles.push({
        x: cx + rand(-20, 20),
        y: cy + rand(-10, 16),
        vx: Math.cos(ang) * sp * dir,
        vy: -Math.abs(Math.sin(ang)) * sp - 30,
        life: 0.35 + Math.random() * 0.55,
        max: 0.9,
        color: color,
        w: weaponId === 'laser' ? 18 : (weaponId === 'missile' ? 8 : 3)
      });
    }
  }

  function update(dt) {
    animT += dt;
    if (game.alarm > 0) game.alarm = Math.max(0, game.alarm - dt);
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt);
    if (game.toastT > 0) game.toastT = Math.max(0, game.toastT - dt);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 280 * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      floaters[i].life -= dt;
      floaters[i].y -= 28 * dt;
      if (floaters[i].life <= 0) floaters.splice(i, 1);
    }
    if (game.screen !== 'play' || game.paused) {
      sound.pump();
      return;
    }
    if (game.intro > 0) game.intro = Math.max(0, game.intro - dt);
    game.pilots.forEach(p => { if (p.jam > 0) p.jam = Math.max(0, p.jam - dt); });
    if (game.hold > 0) {
      game.hold -= dt;
      if (game.hold <= 0) finishHold();
    } else if (game.phase === 'celebrate') {
      game.celeb -= dt;
      if (game.celeb <= 0) advanceWave();
    } else if (game.phase === 'between') {
      game.between -= dt;
      if (game.between <= 0) {
        if (game.wave >= DUEL_WAVES) endDuel();
        else advanceWave();
      }
    } else if (game.guideWait > 0) {
      game.guideWait -= dt;
      if (game.guideWait <= 0) advanceFromGuide();
    } else if (game.intro <= 0 && (game.phase === 'guide' || game.phase === 'select')) {
      game.clock -= dt;
      if (game.clock <= 0) {
        game.clock = 0;
        onTimeout();
      }
    }
    pollPads();
    sound.pump();
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }
  function fillRound(x, y, w, h, r, fill) {
    roundRect(x, y, w, h, r);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function strokeRound(x, y, w, h, r, stroke, lw) {
    roundRect(x, y, w, h, r);
    ctx.lineWidth = lw;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }
  function text(s, x, y, size, color, align, weight) {
    ctx.font = (weight || 700) + ' ' + size + 'px ' + FONT;
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
    ctx.textAlign = 'left';
  }
  function fitText(s, x, y, size, color, align, weight, maxW) {
    let sz = size;
    const min = 10;
    do {
      ctx.font = (weight || 700) + ' ' + sz + 'px ' + FONT;
      if (ctx.measureText(s).width <= maxW || sz <= min) break;
      sz -= 1;
    } while (sz > min);
    text(s, x, y, sz, color, align, weight);
  }
  function wrapText(s, maxW, size, weight) {
    ctx.font = (weight || 700) + ' ' + size + 'px ' + FONT;
    const words = String(s).split(' ');
    const lines = [];
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const trial = line ? line + ' ' + words[i] : words[i];
      if (line && ctx.measureText(trial).width > maxW) {
        lines.push(line);
        line = words[i];
      } else line = trial;
    }
    if (line) lines.push(line);
    return lines;
  }
  function wrapFit(s, maxW, maxLines, start, minSize) {
    let size = start;
    while (size > minSize) {
      const lines = wrapText(s, maxW, size, 700);
      if (lines.length <= maxLines) return { lines: lines, size: size };
      size -= 1;
    }
    return { lines: wrapText(s, maxW, minSize, 700).slice(0, maxLines), size: minSize };
  }
  function hitSpot(x, y) {
    for (let i = spots.length - 1; i >= 0; i--) {
      const s = spots[i];
      if (x >= s.x && y >= s.y && x <= s.x + s.w && y <= s.y + s.h) return s;
    }
    return null;
  }
  function addSpot(x, y, w, h, act, extra) {
    const spot = { x: x, y: y, w: w, h: h, act: act };
    if (extra) {
      Object.keys(extra).forEach(k => { spot[k] = extra[k]; });
    }
    spots.push(spot);
  }
  function clockText(t) {
    const s = Math.max(0, Math.ceil(t));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function drawHangar() {
    const sky = ctx.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, '#182445');
    sky.addColorStop(0.42, '#0d1528');
    sky.addColorStop(1, '#070b12');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VW, VH);
    ctx.strokeStyle = 'rgba(150, 190, 255, 0.09)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 8 + i * 14);
      ctx.lineTo(VW, 8 + i * 14);
      ctx.stroke();
      if (i % 2 === 0) {
        ctx.beginPath();
        ctx.moveTo(80 + i * 140, 0);
        ctx.lineTo(80 + i * 140, 130);
        ctx.stroke();
      }
    }
    for (let i = 0; i < 3; i++) {
      const x = BAY_X[i] + BAY_W / 2;
      const glow = ctx.createRadialGradient(x, 150, 10, x, 250, 210);
      glow.addColorStop(0, 'rgba(255, 206, 120, 0.16)');
      glow.addColorStop(1, 'rgba(255, 206, 120, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(x - 210, 120, 420, 280);
    }
    const floor = ctx.createLinearGradient(0, 500, 0, VH);
    floor.addColorStop(0, '#172033');
    floor.addColorStop(1, '#090d16');
    ctx.fillStyle = floor;
    ctx.fillRect(0, 500, VW, 220);
    ctx.strokeStyle = 'rgba(90, 210, 255, 0.14)';
    ctx.lineWidth = 2;
    for (let i = -4; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(640 + i * 70, 512);
      ctx.lineTo(640 + i * 280, 720);
      ctx.stroke();
    }
  }

  function plate(x, y, w, h, r, fill, stroke, lw) {

  function drawGuideCard(m, r, cardY) {
    let y = cardY + 18;
    const problem = wrapFit(m.text, r.w - 52, 5, 13, 11);
    const plh = problem.size + 3;
    for (let li = 0; li < problem.lines.length; li++) {
      text(problem.lines[li], r.x + 24, y, problem.size, '#102033', 'left', 700);
      y += plh;
    }
    y += 8;
    const steps = m.steps || [];
    for (let s = 0; s < steps.length; s++) {
      const wrapped = wrapFit((s + 1) + '  ' + steps[s], r.w - 52, 2, 12, 10);
      const lh = wrapped.size + 2;
      for (let li = 0; li < wrapped.lines.length; li++) {
        if (y > cardY + 210) return;
        text(wrapped.lines[li], r.x + 24, y, wrapped.size, s === steps.length - 1 ? '#9a3412' : '#1e3a5f', 'left', 700);
        y += lh;
      }
      y += 4;
    }
  }

  function drawBay(i) {

    const guideOn = game.phase === 'guide' && i === game.bayStep;
    const waiting = game.phase === 'guide' && i !== game.bayStep && !m.solved;
    const showAnswer = m.solved || game.phase === 'select' || game.phase === 'celebrate' || game.phase === 'between';
    const focused = game.mode !== 'DUEL' && game.phase === 'select' && game.focus === i;

    const border = guideOn ? '#7dd3fc' : 'rgba(226,232,240,0.16)';

    const cardY = r.y + 136;
    const cardH = 226;

    if (showAnswer) {
      text('STILL ABOARD', r.x + r.w / 2, cardY + 36, 13, '#9a3412', 'center', 800);
      text(String(m.rem), r.x + r.w / 2, cardY + 108, 56, '#102033', 'center', 800);
      text(m.unit.toUpperCase(), r.x + r.w / 2, cardY + 148, 14, '#334155', 'center', 700);
      if (game.mode === 'DUEL' && m.claimed >= 0) {
