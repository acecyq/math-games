    } else {
      drawGuideCard(m, r, cardY);
    }
    if (waiting) {
      ctx.fillStyle = 'rgba(7, 11, 18, 0.55)';
      ctx.fillRect(r.x + 8, r.y + 42, r.w - 16, r.h - 54);
      text('NEXT', r.x + r.w / 2, r.y + 188, 22, '#cbd5e1', 'center', 800);
    }
    if (game.mode !== 'DUEL') {
      if ((hovered && game.phase === 'select') || focused || picked || guideOn) {
        drawReticle(r.x + 4, r.y + 4, r.w - 8, r.h - 8, picked ? '#34d399' : '#7dd3fc');
      }
      if (game.badBay === i && game.hold > 0) drawReticle(r.x + 4, r.y + 4, r.w - 8, r.h - 8, '#fb7185');
    } else if (guideOn) {
      drawReticle(r.x + 4, r.y + 4, r.w - 8, r.h - 8, '#7dd3fc');
    }
    if (game.screen === 'play' && game.intro <= 0 && game.hold <= 0 && !game.paused && game.phase === 'select' && game.mode !== 'DUEL') {
      addSpot(r.x, r.y, r.w, r.h, 'bay', { i: i });
    }
  }

  function drawHUD() {
    plate(0, 0, VW, HUD_H, 0, '#0b1222', null, 0);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, HUD_H - 2, VW, 2);
    const modeLabel = game.mode === 'DUEL' ? 'DUEL' : game.mode === 'COOP' ? 'TEAM CO-OP' : 'SOLO';
    const modeColor = game.mode === 'DUEL' ? '#9f1239' : game.mode === 'COOP' ? '#5b21b6' : '#0f766e';
    fillRound(12, 10, 118, 32, 8, modeColor);
    text(modeLabel, 71, 26, 13, '#ffffff', 'center', 800);
    fillRound(138, 10, 230, 32, 8, '#111827');
    text(game.tier, 150, 26, 13, TIER_META[game.tier].tint, 'left', 800);
    fitText(TIER_META[game.tier].role.toUpperCase(), 230, 26, 11, '#e2e8f0', 'left', 700, 124);
    const waveLabel = game.mode === 'DUEL' ? 'WAVE ' + game.wave + '/' + DUEL_WAVES : 'WAVE ' + game.wave;
    text(waveLabel, 384, 26, 16, '#f8fafc', 'left', 800);
    if (game.mode === 'DUEL') {
      const n = game.players;
      for (let i = 0; i < n; i++) {
        const x = 508 + i * 156;
        text(PILOTS[i].short, x, 26, 13, PILOTS[i].color, 'left', 800);
        text(String(game.pilots[i] ? game.pilots[i].score : 0), x + 32, 26, 16, '#f8fafc', 'left', 800);
      }
    } else {
      const scoreName = game.mode === 'COOP' ? 'TEAM ARSENAL' : 'ARSENAL';
      const bestName = game.mode === 'COOP' ? 'TEAM BEST' : 'BEST RECORD';
      text(scoreName, 470, 18, 10, '#93c5fd', 'left', 700);
      text(String(game.score), 470, 34, 16, '#f8fafc', 'left', 800);
      text(bestName, 640, 18, 10, '#fcd34d', 'left', 700);
      text(String(game.best), 640, 34, 16, '#fef3c7', 'left', 800);
      if (game.record) text('NEW', 760, 26, 12, '#fb7185', 'left', 800);
      for (let i = 0; i < 4; i++) {
        const on = i < game.shields;
        fillRound(900 + i * 36, 12, 28, 28, 6, on ? '#38bdf8' : '#1e293b');
        text(on ? '▮' : '·', 914 + i * 36, 26, 14, on ? '#082f49' : '#475569', 'center', 800);
      }
    }
    drawMute(1198, 9);
  }

  function drawMute(x, y) {
    const on = !sound.muted;
    plate(x, y, 70, 34, 8, on ? '#134e4a' : '#3f1d2e', on ? '#5eead4' : '#fb7185', 2);
    text(on ? 'SOUND' : 'MUTED', x + 35, y + 17, 12, '#ffffff', 'center', 800);
    if (game.screen === 'title' || game.screen === 'play' || game.screen === 'result') addSpot(x, y, 70, 34, 'mute');
  }

  function drawCommand() {
    plate(12, CMD_Y, VW - 24, CMD_H, 12, 'rgba(10, 16, 32, 0.94)', 'rgba(125, 211, 252, 0.25)', 2);
    const color = game.mode === 'DUEL' ? '#e2e8f0' : PILOTS[game.mode === 'COOP' ? activePilot() : 0].color;
    drawSoldier(22, CMD_Y + 4, 64, game.mode === 'DUEL' ? '#ff3355' : color, animT);
    if (game.mode === 'DUEL' && game.players > 1) {
      drawSoldier(78, CMD_Y + 18, 42, '#3d8bff', animT + 1);
      if (game.players > 2) drawSoldier(112, CMD_Y + 26, 34, '#2ee59a', animT + 2);
    }
    const textX = game.mode === 'DUEL' ? (game.players > 2 ? 160 : 130) : 96;
    let title = 'BREAK DOWN BAY ' + (game.bayStep + 1);
    if (game.phase === 'select') title = 'PICK THE BAY WITH THE MOST STILL ABOARD';
    if (game.phase === 'celebrate') title = 'FIREPOWER LOADED INTO THE ARMORY';
    if (game.phase === 'between') title = 'WAVE DRAFT CLOSED';
    if (game.mode === 'DUEL' && game.phase === 'guide') title = 'RACE BAY ' + (game.bayStep + 1) + ' — FIRST CORRECT LOCK CLAIMS IT';
    fitText(title, textX, CMD_Y + 26, 18, '#f8fafc', 'left', 800, 760);
    let sub = 'Take each fraction of that weapon type, then choose the readout.';
    if (game.phase === 'select') sub = 'Compare the three numbers still aboard.';
    if (game.phase === 'celebrate') sub = 'The fullest rack is in the armory.';
    if (game.phase === 'between') sub = 'The next hangar is rolling in.';
    if (game.mode === 'COOP') {
      const who = PILOTS[activePilot()];
      if (game.phase === 'guide') sub = who.name + ' breaks down Bay ' + (game.bayStep + 1);
      else if (game.phase === 'select') sub = who.name + ' picks the fullest rack';
    }
    if (game.mode === 'DUEL' && game.toastT <= 0) {
      const jammed = game.pilots.filter(p => p.jam > 0);
      if (jammed.length) sub = jammed.map(p => PILOTS[p.index].short + ' jam ' + p.jam.toFixed(1) + 's').join('   ·   ');
    }
    if (game.toastT > 0) sub = game.toast;
    fitText(sub, textX, CMD_Y + 52, 14, game.toastT > 0 ? '#fcd34d' : '#93c5fd', 'left', 700, 760);
    const urgent = game.clock < 8;
    text(clockText(game.clock), VW - 118, CMD_Y + 28, 22, urgent ? '#fb7185' : '#e2e8f0', 'left', 800);
    const bw = 150;
    fillRound(VW - 186, CMD_Y + 48, bw, 8, 4, '#1e293b');
    const maxT = (game.mode === 'DUEL' ? DUEL_TIME : SOLO_TIME)[game.tier];
    const frac = clamp(game.clock / maxT, 0, 1);
    fillRound(VW - 186, CMD_Y + 48, Math.max(6, bw * frac), 8, 4, urgent ? '#fb7185' : TIER_META[game.tier].tint);
  }

  function drawCards() {
    const m = game.machines[game.bayStep];
    if (!m) return;
    text('BAY ' + (game.bayStep + 1) + '  —  HOW MANY ARE STILL ABOARD?', 40, 542, 14, '#fde68a', 'left', 800);
    for (let i = 0; i < 4; i++) {
      const r = cardRect(i);
      const opt = m.options[i];
      const hover = pointer.x >= r.x && pointer.y >= r.y && pointer.x <= r.x + r.w && pointer.y <= r.y + r.h;
      let hot = hover;
      let edge = 'rgba(226,232,240,0.2)';
      if (game.mode === 'DUEL') {
        game.pilots.forEach(p => {
          if (p.card === i) edge = PILOTS[p.index].color;
        });
        hot = edge !== 'rgba(226,232,240,0.2)' || hover;
      } else if (game.focus === i) {
        hot = true;
        edge = '#7dd3fc';
      }
      if (hover) edge = '#7dd3fc';
      plate(r.x, r.y, r.w, r.h, 12, hot ? '#16324a' : '#10192c', edge, hot ? 3 : 2);
      text('READOUT ' + (i + 1), r.x + r.w / 2, r.y + 24, 12, '#93c5fd', 'center', 800);
      text(String(opt.value), r.x + r.w / 2, r.y + 62, 36, '#f8fafc', 'center', 800);
      text(m.unit.toUpperCase(), r.x + r.w / 2, r.y + 92, 12, m.accent, 'center', 700);
      if (game.mode === 'DUEL') {
        let tick = 0;
        game.pilots.forEach(p => {
          if (p.card !== i) return;
          fillRound(r.x + 10 + tick * 18, r.y + 8, 12, 12, 3, PILOTS[p.index].color);
          tick += 1;
        });
      }
      if (game.hold <= 0 && game.intro <= 0 && game.guideWait <= 0 && !game.paused && !m.solved) {
        addSpot(r.x, r.y, r.w, r.h, 'card', { i: i });
      }
    }
  }

  function drawDuelDeck() {
    const n = game.players;
    for (let pi = 0; pi < n; pi++) {
      const p = game.pilots[pi];
      const r = duelPanelRect(pi, n);
      plate(r.x, r.y, r.w, r.h, 12, '#10182b', PILOTS[pi].color, 2);
      text(PILOTS[pi].name, r.x + 12, r.y + 18, 14, PILOTS[pi].color, 'left', 800);
      text(PILOTS[pi].keys.join(' '), r.x + r.w - 12, r.y + 18, 12, '#94a3b8', 'right', 700);
      if (p.jam > 0) {
        const tip = wrapFit(p.jamTip || 'Scanner jam.', r.w - 24, 4, 13, 11);
        for (let i = 0; i < tip.lines.length; i++) text(tip.lines[i], r.x + 12, r.y + 48 + i * (tip.size + 3), tip.size, '#fecdd3', 'left', 700);
        text('JAM ' + p.jam.toFixed(1) + 's', r.x + 12, r.y + r.h - 16, 12, '#fb7185', 'left', 800);
      } else if (p.locked) {
        const m = game.machines[p.bay];
        text('+' + (m ? m.rem : p.score) + ' LOCKED', r.x + 12, r.y + 52, 20, '#86efac', 'left', 800);
        if (m) {
          const worked = wrapFit(m.worked, r.w - 24, 3, 13, 11);
          for (let i = 0; i < worked.lines.length; i++) text(worked.lines[i], r.x + 12, r.y + 80 + i * (worked.size + 2), worked.size, '#d1fae5', 'left', 700);
        }
      } else if (p.bay < 0) {
        text('Choose Bay 1, 2, or 3', r.x + 12, r.y + 58, 16, '#e2e8f0', 'left', 700);
        text('Focus bay ' + (p.focus + 1), r.x + 12, r.y + 86, 13, '#93c5fd', 'left', 700);
      } else {
        const m = game.machines[p.bay];
        text(m.name + ' readout', r.x + 12, r.y + 40, 12, '#fde68a', 'left', 800);
        const gap = 8;
        const bw = (r.w - 24 - gap * 3) / 4;
        for (let c = 0; c < 4; c++) {
          const x = r.x + 12 + c * (bw + gap);
          const y = r.y + 54;
          const hot = p.card === c;
          plate(x, y, bw, 78, 8, hot ? '#16324a' : '#0b1220', hot ? PILOTS[pi].color : 'rgba(226,232,240,0.18)', 2);
          text(String(c + 1), x + bw / 2, y + 16, 11, '#94a3b8', 'center', 700);
          fitText(String(m.options[c].value), x + bw / 2, y + 44, 22, '#f8fafc', 'center', 800, bw - 8);
          if (pi === 0 && game.hold <= 0 && game.intro <= 0 && !game.paused && game.phase === 'draft') {
            addSpot(x, y, bw, 78, 'dcard', { i: c });
          }
        }
      }
    }
  }

  function drawDeck() {
    plate(12, DECK_Y, VW - 24, VH - DECK_Y - 8, 12, 'rgba(8, 12, 24, 0.94)', 'rgba(148, 163, 184, 0.18)', 2);
    if (game.mode !== 'DUEL' && game.hold > 0 && game.note) {
      const bad = game.noteTone === 'bad';
      plate(28, 544, VW - 56, 132, 12, bad ? '#3f121c' : '#052e2b', bad ? '#fb7185' : '#5eead4', 2);
      text(bad ? 'TACTICAL AI DIAGNOSTIC' : 'MODEL CHECK', 44, 566, 13, bad ? '#fecdd3' : '#99f6e4', 'left', 800);
      const wrapped = wrapFit(game.note, VW - 100, 4, 16, 13);
      for (let i = 0; i < wrapped.lines.length; i++) {
        text(wrapped.lines[i], 44, 594 + i * (wrapped.size + 6), wrapped.size, '#fff7ed', 'left', 700);
      }
    } else if (game.phase === 'guide' && game.guideWait > 0) {
      const m = game.machines[game.bayStep];
      text('BAY ' + (game.bayStep + 1) + ' LOCKED', 40, 568, 16, '#86efac', 'left', 800);
      if (m) text(m.rem + '  ' + m.unit.toUpperCase() + ' STILL ABOARD', 40, 620, 28, '#f8fafc', 'left', 800);
      if (game.mode === 'DUEL' && m && m.claimed >= 0) {
        text(PILOTS[m.claimed].name + ' claims this rack', 40, 656, 16, PILOTS[m.claimed].color, 'left', 800);
      }
    } else if (game.phase === 'guide') {
      drawCards();
    } else if (game.phase === 'celebrate') {
      const m = game.machines[game.picked];
      const gain = '+' + (m ? m.rem : 0) + ' ' + (m ? m.unit.toUpperCase() : '') + ' TRANSFERRED';
      text(gain, 40, 550, 20, '#86efac', 'left', 800);
      if (game.record) text('NEW RECORD', 40, 574, 14, '#fcd34d', 'left', 800);
      if (m) {
        const wrapped = wrapFit(m.worked, VW - 90, 3, 15, 12);
        const top = game.record ? 598 : 580;
        for (let i = 0; i < wrapped.lines.length; i++) text(wrapped.lines[i], 40, top + i * (wrapped.size + 5), wrapped.size, '#d1fae5', 'left', 700);
      }
    } else if (game.phase === 'between') {
      text('Draft closed. The next hangar is rolling in.', 40, 600, 20, '#f8fafc', 'left', 800);
    } else {
      const who = game.mode === 'COOP' ? PILOTS[activePilot()].name + ': ' : '';
      text(who + 'Compare the three numbers. Lock the bay with the MOST still aboard.', 40, 590, 18, '#f8fafc', 'left', 800);
      text('Add what is left of every weapon type. The fullest start can finish with the least.', 40, 626, 15, '#cbd5e1', 'left', 700);
    }
    const legend = game.mode === 'DUEL'
      ? 'P1 mouse / 1 2 3 4 / pad    ·    P2 Q W E R / pad    ·    P3 U I O P / pad    ·    M mute'
      : (game.mode === 'COOP'
        ? 'Turns rotate. P1: mouse, 1 2 3 4, pad.   P2: Q W E R, pad.   P3: U I O P, pad.   M mute'
        : 'Mouse  ·  1 2 3 4  ·  Arrows + Space  ·  Gamepad A  ·  M mute  ·  Esc pause');
    fitText(legend, VW / 2, 700, 13, '#94a3b8', 'center', 700, VW - 40);
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.w, 3);
      ctx.globalAlpha = 1;
    });
    floaters.forEach(f => {
      ctx.globalAlpha = clamp(f.life / (f.max || 1), 0, 1);
      text(f.text, f.x, f.y, 22, f.color || '#fef08a', 'center', 800);
      ctx.globalAlpha = 1;
    });
  }

  function drawPlay() {
    const sx = game.shake > 0 && !reduceMotion ? (Math.random() - 0.5) * 8 * game.shake : 0;
    ctx.save();
    ctx.translate(sx, 0);
    drawHangar();
    if (game.machines.length === 3) {
      for (let i = 0; i < 3; i++) drawBay(i);
    }
    drawParticles();
    ctx.restore();
    drawHUD();
    drawCommand();
    drawDeck();
    if (game.alarm > 0) {
      ctx.fillStyle = 'rgba(255, 30, 70, ' + (0.22 * Math.min(1, game.alarm)) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }
    if (game.paused) {
      ctx.fillStyle = 'rgba(2, 6, 16, 0.62)';
      ctx.fillRect(0, 0, VW, VH);
      plate(390, 250, 500, 180, 16, '#0f172a', '#7dd3fc', 2);
      text('HANGAR PAUSED', 640, 310, 28, '#f8fafc', 'center', 800);
      text('Esc returns to the scan', 640, 352, 16, '#cbd5e1', 'center', 700);
    }
  }

  function drawButton(act, x, y, w, h, label, sub, on, extra, subColor) {
    const hot = pointer.x >= x && pointer.y >= y && pointer.x <= x + w && pointer.y <= y + h;
    plate(x, y, w, h, 10, on ? '#123048' : (hot ? '#162033' : '#10182a'), on ? '#7dd3fc' : 'rgba(226,232,240,0.2)', on ? 3 : 2);
    if (sub) {
      text(label, x + w / 2, y + 18, 16, on ? '#e0f2fe' : '#f8fafc', 'center', 800);
      fitText(sub, x + w / 2, y + h - 16, 12, subColor || '#94a3b8', 'center', 700, w - 20);
    } else {
      text(label, x + w / 2, y + h / 2, 16, on ? '#e0f2fe' : '#f8fafc', 'center', 800);
    }
    addSpot(x, y, w, h, act, extra || {});
  }

  function drawTitle() {
    drawHangar();
    drawVehicle('tank', 28, 250, 230, 150, '#ffb020');
    drawVehicle('jet', 20, 430, 240, 140, '#3ee0ff');
    drawVehicle('mech', 1020, 240, 220, 140, '#e879f9');
    drawVehicle('heli', 1010, 420, 240, 150, '#a3e635');
    plate(250, 24, 780, 672, 18, 'rgba(8, 12, 24, 0.94)', 'rgba(125, 211, 252, 0.35)', 2);
    text('PRIMARY 5  ·  UNITS 2.1 – 2.3', 640, 52, 13, '#67e8f9', 'center', 800);
    text('MECHA ARMORY', 640, 96, 46, '#f8fafc', 'center', 800);
    text('REMAINDER & FIREPOWER COMMAND', 640, 136, 16, '#fcd34d', 'center', 800);
    text('PILOTS', 280, 184, 12, '#94a3b8', 'left', 800);
    for (let i = 0; i < 3; i++) {
      drawButton('players', 400 + i * 150, 154, 136, 60, (i + 1) + 'P', PILOTS[i].name, game.players === i + 1, { n: i + 1 }, PILOTS[i].color);
    }
    text('DIFFICULTY', 280, 230, 12, '#94a3b8', 'left', 800);
    TIERS.forEach((id, i) => {
      const meta = TIER_META[id];
      drawButton('tier', 280 + (i % 4) * 180, 248, 170, 78, meta.name, meta.role, game.tier === id, { id: id });
    });
    text('MODE', 280, 348, 12, '#94a3b8', 'left', 800);
    MODES.forEach((id, i) => {
      drawButton('mode', 280 + i * 240, 366, 228, 64, MODE_META[id].name, '', game.mode === id, { id: id });
    });
    plate(280, 448, 720, 78, 10, '#0c1424', null, 0);
    const blurb = TIER_META[game.tier].blurb + '  ' + MODE_META[game.mode].blurb;
    const lines = wrapFit(blurb, 690, 3, 14, 12);
    for (let i = 0; i < lines.lines.length; i++) text(lines.lines[i], 296, 470 + i * 20, lines.size, '#e2e8f0', 'left', 700);
    text('SOLO BEST  ' + soloBest, 300, 556, 15, '#fcd34d', 'left', 800);
    text('TEAM BEST  ' + teamBest, 560, 556, 15, '#c4b5fd', 'left', 800);
    drawButton('launch', 430, 586, 420, 56, 'LAUNCH ARMORY', '', true, {});
    fitText('Keys 1 2 3 set pilots   ·   Left/Right tier   ·   Up/Down mode   ·   Enter launches   ·   M mute', 640, 666, 12, '#94a3b8', 'center', 700, 720);
    drawMute(930, 36);
  }

  function drawCrown(x, y) {
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.moveTo(x - 16, y + 10);
    ctx.lineTo(x - 12, y - 8);
    ctx.lineTo(x - 4, y + 2);
    ctx.lineTo(x, y - 14);
    ctx.lineTo(x + 4, y + 2);
    ctx.lineTo(x + 12, y - 8);
    ctx.lineTo(x + 16, y + 10);
    ctx.closePath();
    ctx.fill();
  }

  function drawResult() {
    drawHangar();
    plate(180, 48, 920, 624, 18, 'rgba(8, 12, 24, 0.94)', 'rgba(250, 204, 21, 0.4)', 2);
    if (game.resultKind === 'duel') {
      const top = game.pilots.reduce((a, p) => Math.max(a, p.score), 0);
      const tied = game.pilots.filter(p => p.score === top).length > 1;
      text(tied ? 'SHARED COMMAND' : 'SUPREME ARMORY CHAMPION', 640, 100, 28, '#fef3c7', 'center', 800);
      text('Most total weaponry after ' + DUEL_WAVES + ' waves', 640, 136, 16, '#cbd5e1', 'center', 700);
      const n = game.pilots.length;
      for (let i = 0; i < n; i++) {
        const p = game.pilots[i];
        const x = 640 + (i - (n - 1) / 2) * 240;
        const champ = p.score === top;
        if (champ) drawCrown(x, 180);
        drawSoldier(x - 36, 210, 110, PILOTS[i].color, animT + i);
        text(PILOTS[i].name, x, 360, 16, PILOTS[i].color, 'center', 800);
        text(String(p.score), x, 396, 32, '#f8fafc', 'center', 800);
        text('ROUNDS', x, 426, 12, '#94a3b8', 'center', 700);
      }
    } else {
      text(game.shields <= 0 ? 'SHIELDS DEPLETED' : 'MISSION DOWN', 640, 120, 32, '#fecdd3', 'center', 800);
      text('Rounds secured in the armory', 640, 168, 16, '#cbd5e1', 'center', 700);
      text(String(game.score), 640, 240, 64, '#f8fafc', 'center', 800);
      const bestName = game.mode === 'COOP' ? 'TEAM BEST' : 'BEST RECORD';
      text(bestName + '  ' + game.best, 640, 300, 20, '#fcd34d', 'center', 800);
      if (game.record) text('NEW RECORD', 640, 336, 18, '#fb7185', 'center', 800);
      text('Waves cleared  ' + game.wavesCleared, 640, 378, 16, '#93c5fd', 'center', 700);
      drawSoldier(600, 410, 90, game.mode === 'COOP' ? '#c4b5fd' : '#ff3355', animT);
    }
    drawButton('retry', 300, 560, 300, 56, 'REDEPLOY', '', true, {});
    drawButton('title', 680, 560, 300, 56, 'HANGAR', '', false, {});
    drawMute(990, 64);
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#070b12';
    ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offsetX, dpr * offsetY);
    if (game.screen === 'title') drawTitle();
    else if (game.screen === 'result') drawResult();
    else drawPlay();
    const hover = hitSpot(pointer.x, pointer.y);
    canvas.style.cursor = hover ? 'pointer' : 'default';
  }

  function resize() {
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(winW * dpr));
    canvas.height = Math.max(1, Math.floor(winH * dpr));
    scale = Math.min(winW / VW, winH / VH);
    offsetX = (winW - VW * scale) / 2;
    offsetY = (winH - VH * scale) / 2;
  }

  function screenToVirtual(clientX, clientY) {
    return { x: (clientX - offsetX) / scale, y: (clientY - offsetY) / scale };
  }

  function setPlayers(n) {
    game.players = n;
    if (n === 1) game.mode = 'SOLO';
    else if (game.mode === 'SOLO') game.mode = 'COOP';
    sound.click();
  }
  function setTier(id) {
    game.tier = id;
    sound.click();
  }
  function setMode(id) {
    game.mode = id;
    if (id === 'SOLO') game.players = 1;
    if ((id === 'COOP' || id === 'DUEL') && game.players < 2) game.players = 2;
    sound.click();
  }
  function cycleTier(dir) {
    const i = TIERS.indexOf(game.tier);
    setTier(TIERS[(i + dir + TIERS.length) % TIERS.length]);
  }
  function cycleMode(dir) {
    const i = MODES.indexOf(game.mode);
    setMode(MODES[(i + dir + MODES.length) % MODES.length]);
  }

  function pressSlot(pi, slot) {
    if (game.screen !== 'play' || game.paused || game.intro > 0) return;
    if (!allowed(pi)) {
      if (game.mode !== 'DUEL') toast(PILOTS[activePilot()].name + ' has the controls for this step.');
      return;
    }
    if (game.hold > 0) {
      game.hold = Math.min(game.hold, 0.05);
      return;
    }
    if (game.phase === 'guide') {
      if (game.guideWait > 0) return;
      if (game.mode === 'DUEL') {
        const p = game.pilots[pi];
        if (!p || p.jam > 0) return;
      }
      chooseGuideCard(slot, pi);
      return;
    }
    if (game.phase === 'select' && game.mode !== 'DUEL') chooseBay(slot <= 2 ? slot : game.focus);
  }

  function nudge(pi, dir) {
    if (game.screen === 'title' && pi === 0) {
      cycleTier(dir);
      return;
    }
    if (game.screen !== 'play' || game.paused || game.intro > 0 || game.hold > 0) return;
    if (!allowed(pi)) return;
    if (game.phase === 'guide') {
      if (game.mode === 'DUEL') {
        const p = game.pilots[pi];
        if (!p || p.jam > 0) return;
        p.card = (p.card + dir + 4) % 4;
      } else game.focus = (game.focus + dir + 4) % 4;
      sound.click();
      return;
    }
    if (game.phase === 'select') game.focus = (game.focus + dir + 3) % 3;
    sound.click();
  }

  function confirmFocus(pi) {
    if (game.screen === 'title' && pi === 0) { startGame(); return; }
    if (game.screen === 'result' && pi === 0) { startGame(); return; }
    if (game.screen !== 'play' || !allowed(pi) || game.paused || game.intro > 0) return;
    if (game.hold > 0) { game.hold = Math.min(game.hold, 0.05); return; }
    if (game.phase === 'guide') {
      if (game.guideWait > 0) return;
      if (game.mode === 'DUEL') {
        const p = game.pilots[pi];
        if (!p || p.jam > 0) return;
        chooseGuideCard(p.card, pi);
      } else chooseGuideCard(game.focus, pi);
      return;
    }
    if (game.phase === 'select' && game.mode !== 'DUEL') chooseBay(game.focus);
  }

  function onPad(i, kind) {
    sound.unlock();
    if (kind === 'left') nudge(i, -1);
    else if (kind === 'right') nudge(i, 1);
    else if (kind === 'a') confirmFocus(i);
  }

  function pollPads() {
    if (!navigator.getGamepads) return;
    let pads;
    try { pads = navigator.getGamepads(); } catch (err) { return; }
    if (!pads) return;
    for (let i = 0; i < 3; i++) {
      const gp = pads[i];
      if (!gp) continue;
      const mem = padMem[i];
      const ax = gp.axes && gp.axes.length ? gp.axes[0] : 0;
      const left = ax < -0.55 || !!(gp.buttons[14] && gp.buttons[14].pressed);
      const right = ax > 0.55 || !!(gp.buttons[15] && gp.buttons[15].pressed);
      const a = !!(gp.buttons[0] && gp.buttons[0].pressed);
      if (padPrimed) {
        if (left && !mem.left) onPad(i, 'left');
        if (right && !mem.right) onPad(i, 'right');
        if (a && !mem.a) onPad(i, 'a');
      }
      mem.left = left;
      mem.right = right;
      mem.a = a;
    }
    padPrimed = true;
  }

  function activate(spot) {
    if (!spot) return;
    if (spot.act === 'mute') { sound.toggle(); return; }
    if (game.screen === 'title') {
      if (spot.act === 'players') setPlayers(spot.n);
      else if (spot.act === 'tier') setTier(spot.id);
      else if (spot.act === 'mode') setMode(spot.id);
      else if (spot.act === 'launch') startGame();
      return;
    }
    if (game.screen === 'result') {
      if (spot.act === 'retry') startGame();
      else if (spot.act === 'title') game.screen = 'title';
      return;
    }
    if (game.paused || game.intro > 0) return;
    if (game.hold > 0) { game.hold = Math.min(game.hold, 0.05); return; }
    if (!allowed(0)) {
      toast(PILOTS[activePilot()].name + ' has the controls for this step.');
      return;
    }
    if (spot.act === 'bay') {
      if (game.phase === 'select') chooseBay(spot.i);
      else toast('Finish this bay on the readout cards.');
    } else if (spot.act === 'card') {
      if (game.mode === 'DUEL') chooseGuideCard(spot.i, 0);
      else chooseGuideCard(spot.i, activePilot());
    }
  }

  function onKeyDown(e) {
    if (held[e.code]) return;
    held[e.code] = true;
    sound.unlock();
    const block = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter'];
    if (block.indexOf(e.code) !== -1) e.preventDefault();
    if (e.code === 'KeyM') { sound.toggle(); return; }
    if (game.screen === 'title') {
      if (e.code === 'Digit1') setPlayers(1);
      else if (e.code === 'Digit2') setPlayers(2);
      else if (e.code === 'Digit3') setPlayers(3);
      else if (e.code === 'ArrowLeft') cycleTier(-1);
      else if (e.code === 'ArrowRight') cycleTier(1);
      else if (e.code === 'ArrowUp') cycleMode(-1);
      else if (e.code === 'ArrowDown') cycleMode(1);
      else if (e.code === 'Enter' || e.code === 'Space') startGame();
      return;
    }
    if (game.screen === 'result') {
      if (e.code === 'Enter' || e.code === 'Space') startGame();
      else if (e.code === 'Escape') game.screen = 'title';
      return;
    }
    if (e.code === 'Escape') {
      game.paused = !game.paused;
      return;
    }
    if (e.code === 'ArrowLeft') { nudge(0, -1); return; }
    if (e.code === 'ArrowRight') { nudge(0, 1); return; }
    if (e.code === 'Enter' || e.code === 'Space') { confirmFocus(0); return; }
    const mapped = keyMap[e.code];
    if (mapped) pressSlot(mapped.player, mapped.slot);
  }
  function onKeyUp(e) { held[e.code] = false; }

  function onPointer(e) {
    sound.unlock();
    const p = screenToVirtual(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
    if (canvas) canvas.focus();
    activate(hitSpot(p.x, p.y));
  }
  function onMove(e) {
    const p = screenToVirtual(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
  }

  function frame(now) {
    if (!lastNow) lastNow = now;
    const dt = Math.min(0.05, (now - lastNow) / 1000);
    lastNow = now;
    spots.length = 0;
    try {
      update(dt);
      render();
    } catch (err) {
      console.error(err);
    }
    requestAnimationFrame(frame);
  }

  sound.unlock = function () {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!sound.ctx) {
      sound.ctx = new AC();
      sound.master = sound.ctx.createGain();
      sound.master.gain.value = sound.muted ? 0 : 0.8;
      sound.master.connect(sound.ctx.destination);
    }
    if (sound.ctx.state === 'suspended') sound.ctx.resume();
    if (!sound.ready) {
      sound.ready = true;
      sound.next = sound.ctx.currentTime + 0.05;
    }
  };
  function tone(freq, type, dur, vol, delay, slide) {
    if (!sound.ctx || !sound.master) return;
    const t0 = sound.ctx.currentTime + (delay || 0);
    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(40, freq), t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(sound.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!sound.ctx || !sound.master) return;
    const rate = sound.ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * dur));
    const buffer = sound.ctx.createBuffer(1, len, rate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = sound.ctx.createBufferSource();
    src.buffer = buffer;
    const filter = sound.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq || 900;
    const gain = sound.ctx.createGain();
    gain.gain.setValueAtTime(vol, sound.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, sound.ctx.currentTime + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(sound.master);
    src.start();
  }
  sound.toggle = function () {
    sound.unlock();
    sound.muted = !sound.muted;
    if (sound.master && sound.ctx) sound.master.gain.setTargetAtTime(sound.muted ? 0 : 0.8, sound.ctx.currentTime, 0.03);
    if (!sound.muted && sound.ctx) sound.next = sound.ctx.currentTime + 0.05;
    try { localStorage.setItem('ma-armory-mute', sound.muted ? '1' : '0'); } catch (err) { /* ignore */ }
  };
  sound.click = function () { tone(740, 'square', 0.04, 0.03); };
  sound.scan = function () { tone(880, 'square', 0.06, 0.04); tone(1180, 'square', 0.08, 0.035, 0.07); };
  sound.lock = function () { tone(180, 'sawtooth', 0.12, 0.05, 0, 90); tone(420, 'square', 0.08, 0.04, 0.08); };
  sound.alarm = function () { tone(140, 'sawtooth', 0.22, 0.06, 0, 70); tone(90, 'square', 0.26, 0.04, 0.06); };
  sound.jam = function () { tone(80, 'sawtooth', 0.28, 0.06, 0, 48); noise(0.12, 0.04, 240); };
  sound.fanfare = function () { [523, 659, 784, 1046].forEach((f, i) => tone(f, 'square', 0.18, 0.05, i * 0.09)); };
  sound.down = function () { tone(196, 'sawtooth', 0.28, 0.05, 0, 70); tone(98, 'square', 0.36, 0.04, 0.08); };
  sound.barrage = function (id) {
    if (id === 'laser') { tone(480, 'sawtooth', 0.16, 0.045, 0, 1400); tone(860, 'square', 0.1, 0.03, 0.05); }
    else if (id === 'missile' || id === 'rocket') { tone(240, 'square', 0.18, 0.05, 0, 80); noise(0.16, 0.05, 480); }
    else if (id === 'shell' || id === 'slug') { noise(0.12, 0.06, 280); tone(130, 'square', 0.14, 0.05, 0, 60); }
    else { noise(0.07, 0.045, 1700); tone(640, 'square', 0.05, 0.04, 0, 220); tone(760, 'square', 0.05, 0.03, 0.06, 260); }
  };
  sound.pump = function () {
    if (!sound.ready || !sound.ctx || sound.muted || !sound.master) return;
    const now = sound.ctx.currentTime;
    if (sound.next < now - 0.02) sound.next = now + 0.02;
    const step = game.screen === 'play' && game.tier === 'EXTREME' ? 0.13 : 0.16;
    let guard = 0;
    while (sound.next < now + 0.25 && guard < 6) {
      const i = sound.step;
      tone(LEAD[i % LEAD.length], 'square', 0.12, 0.028, sound.next - now);
      if (i % 2 === 0) tone(BASS[(i / 2) % BASS.length], 'triangle', 0.22, 0.04, sound.next - now);
      if (i % 4 === 0) noise(0.03, 0.012, 2000);
      sound.next += step;
      sound.step += 1;
      guard += 1;
    }
  };

  function boot() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    live = document.getElementById('live');
    loadStore();
    try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (err) { reduceMotion = false; }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', () => { Object.keys(held).forEach(k => { held[k] = false; }); });
    canvas.addEventListener('pointerdown', onPointer);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    requestAnimationFrame(frame);
    canvas.focus();
    announce('Mecha Armory. Choose pilots, difficulty, and mode, then launch.');
  }

  if (typeof globalThis !== 'undefined' && globalThis.__MECHA_TEST__) {
    globalThis.__MECHA_API__ = { buildWave: buildWave, history: history };
  } else {
    boot();
  }
})();
</script>
</body>
