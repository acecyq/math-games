/* ---------- Utils ---------- */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function irand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function moveTo(a, b, maxStep) {
  if (Math.abs(b - a) <= maxStep) return b;
  return a + Math.sign(b - a) * maxStep;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function gcd(a, b) {
  a = Math.abs(Math.round(a));
  b = Math.abs(Math.round(b));
  while (b) {
    const t = b;
    b = a % b;
    a = t;
  }
  return a || 1;
}
function speak(msg) {
  if (live) live.textContent = msg;
}
function pulse(t, speed, min, max) {
  return min + (max - min) * (0.5 + 0.5 * Math.sin(t * speed));
}
function mixedLabel(w, n, d) { return w + ' ' + n + '/' + d; }
function expansionPhrase(base, eW, eN, eD) {
  if (eW === 1 && eN === 1 && eD === 2) return base + ' + half of ' + base;
  if (eW === 1) return base + ' + ' + eN + '/' + eD + ' of ' + base;
  return (eW + ' × ' + base) + ' + ' + eN + '/' + eD + ' of ' + base;
}

/* ---------- Audio ---------- */
const audio = (() => {
  let actx = null, muted = false, bgmOn = false, step = 0, timer = null, master = null;
  function ensure() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) {
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.5;
      master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    if (!bgmOn) startBgm();
  }
  function toggle() {
    ensure();
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.5;
    return muted;
  }
  function tone(freq, dur, type, vol, delay) {
    if (!actx || muted) return;
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.08), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, freq) {
    if (!actx || muted) return;
    const n = Math.max(1, Math.floor(actx.sampleRate * dur));
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = actx.createBufferSource();
    const g = actx.createGain();
    const f = actx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq || 900;
    src.buffer = buf;
    g.gain.value = vol || 0.08;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }
  function startBgm() {
    if (!actx || bgmOn) return;
    bgmOn = true;
    const beat = 60 / 128;
    const bass = [130.81, 130.81, 98, 130.81, 110, 110, 146.83, 164.81];
    const lead = [523.25, 0, 659.25, 783.99, 659.25, 523.25, 440, 0, 392, 523.25, 659.25, 783.99, 880, 783.99, 659.25, 0];
    function tick() {
      if (!actx) return;
      if (!muted) {
        const t = actx.currentTime;
        const bi = step % 8;
        const li = step % 16;
        if (step % 2 === 0) {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(150, t);
          o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
          g.gain.setValueAtTime(0.16, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
          o.connect(g); g.connect(master);
          o.start(t); o.stop(t + 0.16);
        }
        noise(0.03, step % 2 ? 0.035 : 0.018, 2400);
        tone(bass[bi], beat * 0.72, 'sawtooth', 0.055);
        if (lead[li]) tone(lead[li], beat * 0.42, 'square', 0.04);
        if (step % 8 === 4) tone(lead[li] ? lead[li] / 2 : 196, beat * 0.5, 'triangle', 0.03);
      }
      step++;
      timer = setTimeout(tick, beat * 1000);
    }
    tick();
  }
  return {
    ensure, toggle, isMuted: () => muted,
    select() { tone(520, 0.04, 'square', 0.045); },
    slice() {
      tone(220, 0.09, 'sawtooth', 0.05);
      tone(660, 0.12, 'sine', 0.06, 0.04);
      tone(990, 0.14, 'triangle', 0.045, 0.1);
    },
    lock() { tone(680, 0.05, 'square', 0.06); tone(1020, 0.08, 'square', 0.05, 0.05); },
    roar() {
      noise(0.45, 0.11, 420);
      for (let i = 0; i < 7; i++) tone(120 + i * 46, 0.16, 'sawtooth', 0.045, i * 0.045);
    },
    fanfare() {
      tone(523, 0.14, 'square', 0.07, 0.12);
      tone(659, 0.14, 'square', 0.07, 0.24);
      tone(784, 0.16, 'square', 0.07, 0.36);
      tone(1046, 0.32, 'triangle', 0.08, 0.5);
    },
    buzz() { tone(92, 0.2, 'sawtooth', 0.11); tone(70, 0.24, 'square', 0.08, 0.04); },
    ok() { tone(660, 0.06, 'square', 0.06); tone(880, 0.09, 'triangle', 0.05, 0.05); }
  };
})();

function takeChoices(correct, candidates) {
  const choices = [{
    label: String(correct.label),
    caption: correct.caption || '',
    tag: 'ok',
    alert: false,
    msg: ''
  }];
  const seen = new Set([choices[0].label]);
  for (let i = 0; i < candidates.length; i++) {
    const c = candidates[i];
    if (!c || c.label == null) continue;
    const label = String(c.label);
    if (!label || seen.has(label)) continue;
    seen.add(label);
    choices.push({
      label,
      caption: c.caption || '',
      tag: c.tag || 'pad',
      alert: !!c.alert,
      msg: c.msg || 'That is not the split this order needs.'
    });
    if (choices.length === 4) break;
  }
  let padN = 2;
  while (choices.length < 4 && padN < 14) {
    const label = 'no ' + padN;
    padN++;
    if (seen.has(label)) continue;
    seen.add(label);
    choices.push({
      label,
      caption: 'not this split',
      tag: 'pad',
      alert: false,
      msg: 'That is not a step in this fleet order. Use the fraction the briefing names.'
    });
  }
  return shuffle(choices);
}

function buildT1(spec) {

  const unit = n / den;
  const ans = unit * num;

  const shortOf = (Math.max(1, num - 1) * unit);
  const longOf = (num + 1) * unit;

    tier: 1,

function buildT2(spec) {
  const names = spec.names, counts = spec.counts, kinds = spec.kinds, ask = spec.ask;
  const total = counts[0] + counts[1] + counts[2];
  const part = counts[ask];
  const g = gcd(part, total);
  const sn = part / g, sd = total / g;
  const raw = part + '/' + total;
  const simple = sn + '/' + sd;
  const askName = names[ask];
  const others = [0, 1, 2].filter(i => i !== ask);
  const partial = counts[others[0]] + counts[ask];
  const otherSimpleN = counts[others[0]] / gcd(counts[others[0]], total);
  const otherSimpleD = total / gcd(counts[others[0]], total);
  const otherLabel = otherSimpleN + '/' + otherSimpleD;
  const invert = sd + '/' + sn;
  let low = 0;
  for (let k = g - 1; k >= 2; k--) {
    if (part % k === 0 && total % k === 0) { low = k; break; }
  }
  const step2 = [];
  if (low) {
    step2.push({ label: String(low), caption: 'a smaller factor', tag: 'low',
      msg: low + ' divides both ' + part + ' and ' + total + ', but the Simplifier Laser uses the highest common factor, ' + g + '.' });
  }
  if (part !== g) {
    step2.push({ label: String(part), caption: 'the numerator', tag: 'num',
      msg: part + ' is the numerator. Find the biggest number that divides BOTH ' + part + ' and ' + total + '.' });
  }
  if (total !== g) {
    step2.push({ label: String(total), caption: 'the fleet total', tag: 'den',
      msg: total + ' is the whole fleet. It is the denominator, not the factor you divide by.' });
  }
  const diff = Math.abs(total - part);
  step2.push({ label: String(diff), caption: 'the difference', tag: 'diff',
    msg: 'Subtracting does not simplify a fraction. The highest common factor of ' + part + ' and ' + total + ' is ' + g + '.' });
  for (let k = 2; k < Math.min(total, 40); k++) {
    const dividesPart = part % k === 0;
    const dividesTotal = total % k === 0;
    if (dividesPart !== dividesTotal && k !== g && k !== part && k !== diff) {
      step2.push({ label: String(k), caption: 'not a common factor', tag: 'one',

  return {

    kind: 'portion',

    ],

function buildT4(spec) {
  if (!spec) return null;
  const gN = spec.gN, gD = spec.gD, ships = spec.ships;
  const eW = spec.eW, eN = spec.eN, eD = spec.eD;
  if (gN <= 0 || ships % gN !== 0) return null;
  const unit = ships / gN;
  const base = unit * gD;
  if (eD <= 0 || base % eD !== 0) return null;
  const fracExtra = base / eD * eN;
  const extra = fracExtra + (eW - 1) * base;
  const total = base * eW + fracExtra;
  if (![unit, base, extra, total, fracExtra].every(Number.isInteger)) return null;
  const given = gN + '/' + gD;
  const mixed = mixedLabel(eW, eN, eD);
  const phrase = expansionPhrase(base, eW, eN, eD);
  const halfTrap = (eN === 1 && eD === 2) ? base + unit : base + fracExtra / 2;
  return {
    tier: 4,
    tierName: 'OVERDRIVE MIXED',
    kind: 'overdrive',
    brief: given + ' of the base fleet is ' + ships + ' ships. Command orders an expansion to ' + mixed + ' of the base fleet! How many ships total?',
    chips: [
      ships + ' ÷ ' + gN + ' = ' + unit,
      gD + ' × ' + unit + ' = ' + base,

              msg: 'The ' + ships + ' ships cover ' + gN + ' units, not ' + gD + '. Divide by the numerator ' + gN + '.' } : null),
            { label: String(unit * gD), caption: 'the whole base', tag: 'early',

            { label: String(unit), caption: 'one unit', tag: 'unit',
              msg: unit + ' is only 1 unit. The base fleet is ' + gD + ' units: ' + gD + ' × ' + unit + ' = ' + base + '.' },
            { label: String(ships), caption: 'the given fraction', tag: 'ships',
              msg: ships + ' is only ' + given + ' of the base, not the whole base.' },
            { label: String(fracExtra), caption: 'the extra piece', tag: 'extra',
              msg: fracExtra + ' is part of the later expansion. First build 1 whole: ' + gD + ' × ' + unit + ' = ' + base + '.' },
            { label: String(unit * (gD - 1)), caption: 'one unit short', tag: 'off',
              msg: 'A whole base is ' + gD + ' units, not ' + (gD - 1) + '. ' + gD + ' × ' + unit + ' = ' + base + '.' }
          ]
        )
      },

function randomT1() {
  const dens = [4, 5, 6, 7, 8, 9];
  const den = dens[irand(0, dens.length - 1)];
  const opts = [];
  for (let n = 2; n < den; n++) if (gcd(n, den) === 1) opts.push(n);
  if (!opts.length) return null;
  const num = opts[irand(0, opts.length - 1)];
  const unit = irand(4, 9);
  return { n: unit * den, num, den };
}
function randomT4() {
  const givens = [[2, 3], [3, 4], [3, 5], [2, 5], [4, 5], [5, 6], [3, 8], [5, 8], [2, 7], [4, 7], [5, 9], [2, 9]];
  const exps = [[1, 1, 2], [1, 1, 3], [1, 2, 3], [1, 1, 4], [1, 3, 4], [1, 2, 5], [1, 3, 5], [1, 1, 6], [2, 1, 2], [2, 1, 3], [2, 1, 4], [1, 3, 8]];
  const g = givens[irand(0, givens.length - 1)];
  const e = exps[irand(0, exps.length - 1)];
  const unit = irand(4, 12);
  const base = unit * g[1];
  if (base % e[2] !== 0 || base < 24 || base > 120) return null;
  return { gN: g[0], gD: g[1], ships: unit * g[0], eW: e[0], eN: e[1], eD: e[2] };
}

function assertMission(m) {
  const errs = [];
  if (!m || !m.steps || m.steps.length !== 3) {
    errs.push((m && m.kind) + ' step count');
    return errs;
  }
  for (let i = 0; i < 3; i++) {
    const s = m.steps[i];
    if (!s.choices || s.choices.length !== 4) errs.push(m.kind + ' s' + i + ' choices ' + (s.choices && s.choices.length));
    const oks = (s.choices || []).filter(c => c.tag === 'ok');
    if (oks.length !== 1) errs.push(m.kind + ' s' + i + ' oks ' + oks.length);
    const labels = (s.choices || []).map(c => c.label);
    if (new Set(labels).size !== labels.length) errs.push(m.kind + ' s' + i + ' dup ' + labels.join(' | '));
    (s.choices || []).forEach(c => {
      if (c.tag !== 'ok' && !c.msg) errs.push(m.kind + ' s' + i + ' silent ' + c.label);
    });
    if (!s.success || !s.prompt) errs.push(m.kind + ' s' + i + ' copy');
  }
  if (m.steps[2] && !m.steps[2].launch) errs.push(m.kind + ' missing launch');
  return errs;
}

function validateBanks() {
  const errs = [];
  BANK.t1.forEach(s => {
    if (s.n % s.den !== 0) errs.push('t1 div ' + s.n);
    const unit = s.n / s.den;
    if (gcd(s.num, s.den) !== 1) errs.push('t1 gcd ' + s.num + '/' + s.den);
    errs.push(...assertMission(buildT1(s)));
    if (unit * s.num <= 0) errs.push('t1 ans');
  });
  BANK.t2.forEach(s => {
    const total = s.counts[0] + s.counts[1] + s.counts[2];
    if (gcd(s.counts[s.ask], total) <= 1) errs.push('t2 hcf ' + total);
    errs.push(...assertMission(buildT2(s)));
  });
  BANK.ink.forEach(s => {
    const vis = s.counts[0] + s.counts[1] + s.counts[2];
    const visN = s.hidden[1] - s.hidden[0];
    if (vis % visN !== 0) errs.push('ink ' + vis + '/' + visN);
    errs.push(...assertMission(buildInk(s)));
  });
  BANK.rem.forEach(s => {
    if (s.total % s.a[1] !== 0) errs.push('rem a ' + s.total);
    const alpha = s.total / s.a[1] * s.a[0];
    const rem = s.total - alpha;
    if (rem % s.b[1] !== 0) errs.push('rem b ' + rem);
    errs.push(...assertMission(buildRem(s)));
  });
  BANK.t4.forEach(s => {
    if (s.ships % s.gN !== 0) errs.push('t4 unit');
    const base = (s.ships / s.gN) * s.gD;
    if (base % s.eD !== 0) errs.push('t4 extra ' + base);
    const m = buildT4(s);
    errs.push(...assertMission(m));
    if (!m || m.visual.total !== m.visual.base * s.eW + m.visual.fracExtra) errs.push('t4 total');
  });
  let genOk = 0;
  for (let i = 0; i < 24; i++) {
    const a = buildT1(randomT1());
    const b = buildT4(randomT4());
    if (a && assertMission(a).length === 0) genOk++;
    if (b && assertMission(b).length === 0) genOk++;
  }
  if (genOk < 20) errs.push('generator thin ' + genOk);
  return errs;
}

function makeFromScript(pair) {
  const kind = pair[0], idx = pair[1];
  if (kind === 't1') return buildT1(BANK.t1[idx]);
  if (kind === 't2') return buildT2(BANK.t2[idx]);
  if (kind === 'ink') return buildInk(BANK.ink[idx]);
  if (kind === 'rem') return buildRem(BANK.rem[idx]);
  return buildT4(BANK.t4[idx]);
}

function safeGenerated(kind) {
  for (let i = 0; i < 30; i++) {
    const m = kind === 't1' ? buildT1(randomT1()) : buildT4(randomT4());
    if (m && assertMission(m).length === 0) return m;
  }
  return null;
}

function activateSpot(pi, spot) {

    return;

  if (G.mode === 'victory' || G.mode === 'gameover') {
    if (spot.id === 'again') {
      G.run += 1;
      beginGame(G.playMode);

      saveBest(topScore());
      G.mode = 'title';
      G.paused = false;
    }
    return;
  }
  if (G.paused) {
    if (spot.id === 'resume') G.paused = false;
    if (spot.id === 'quit') {
      saveBest(topScore());
      G.paused = false;
      G.mode = 'title';
    }
    return;
  }
  if (G.mode !== 'play') return;
  if (p.stun > 0 || p.shields <= 0) return;
  if (spot.id === 'launch') {
    const step = G.mission.steps[G.step];
    if (!step.launch) {
      audio.buzz();
      setFeedback('THRUSTERS COLD', 'Lock this step on a tactic card. LAUNCH SQUADRON arms on the final step.', false);
      G.feedbackT = 1.6;

function focusLaunch(p) {

function spotUnder(x, y) {

function nearestSpot(x, y, maxDist) {
  let best = null, bestD = maxDist;

    if (d < bestD) { bestD = d; best = { spot: s, index: i }; }

function nudgeFocus(p, dx, dy) {
  const cur = G.spots[p.focus] || G.spots[0];
  if (!cur) return;
  const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
  let best = -1, bestScore = 1e9;
  for (let i = 0; i < G.spots.length; i++) {
    if (i === p.focus) continue;
    const s = G.spots[i];
    const sx = s.x + s.w / 2 - cx;
    const sy = s.y + s.h / 2 - cy;
    if (dx && Math.sign(sx) !== dx) continue;
    if (dy && Math.sign(sy) !== dy) continue;
    const primary = dx ? Math.abs(sx) : Math.abs(sy);
    const secondary = dx ? Math.abs(sy) : Math.abs(sx);
    if (primary < 6) continue;
    const score = primary + secondary * 1.8;
    if (score < bestScore) { bestScore = score; best = i; }

  if (best >= 0) {
    p.focus = best;

function resize() {

  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cssW = Math.max(1, Math.floor(W * scale));
  const cssH = Math.max(1, Math.floor(H * scale));

  canvas.style.height = cssH + 'px';

}
function syncPointer(e) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * W;
  pointer.y = ((e.clientY - rect.top) / rect.height) * H;
  pointer.using = true;
}
canvas.addEventListener('pointerdown', (e) => {
  audio.ensure();
  canvas.focus();
  syncPointer(e);
  pointer.down = true;

  players[0].y = pointer.y;
  const under = spotUnder(pointer.x, pointer.y);

function padPressed(gp, i) {
  return !!(gp.buttons && gp.buttons[i] && gp.buttons[i].pressed);
}
function readPad(gp) {
  const axes = gp.axes || [];
  const ax = axes[0] || 0;
  const ay = axes[1] || 0;
  let hatL = false, hatR = false, hatU = false, hatD = false;
  if (axes.length > 9) {
    const hat = axes[9];
    if (hatIdle[gp.index] == null) hatIdle[gp.index] = hat;
    if (hat != null && Math.abs(hat - hatIdle[gp.index]) > 0.22) {
      if (hat < -0.7 || hat > 0.9) hatU = true;
      else if (hat < -0.3) { hatU = true; hatR = true; }
      else if (hat < 0.1) hatR = true;
      else if (hat < 0.4) { hatR = true; hatD = true; }
      else if (hat < 0.7) hatD = true;
      else { hatL = true; hatD = true; }
    }
  }
  return {
    left: padPressed(gp, PAD.LEFT) || hatL,
    right: padPressed(gp, PAD.RIGHT) || hatR,
    up: padPressed(gp, PAD.UP) || hatU,
    down: padPressed(gp, PAD.DOWN) || hatD,
    ax: Math.abs(ax) > AXIS_DEAD ? ax : 0,
    ay: Math.abs(ay) > AXIS_DEAD ? ay : 0,
    a: padPressed(gp, PAD.A),
    b: padPressed(gp, PAD.B),
    start: padPressed(gp, PAD.START) || padPressed(gp, PAD.START_ALT)
  };
}
function listPads() {
  try { return navigator.getGamepads ? navigator.getGamepads() : []; }
  catch (err) { return []; }
}
function pollGamepads(dt) {
  const pads = listPads();
  const liveIdx = [];
  for (let i = 0; i < pads.length; i++) if (pads[i]) liveIdx.push(i);
  if (G.mode === 'title') {
    const gp = liveIdx.length ? pads[liveIdx[0]] : null;
    if (!gp) return;
    const d = readPad(gp);
    const prev = players[0].gpPrev;
    if ((d.left && !prev.l) || (d.up && !prev.u)) {
      G.titleFocus = (G.titleFocus + 1) % 2;
      audio.select();
    } else if ((d.right && !prev.r) || (d.down && !prev.d)) {
      G.titleFocus = (G.titleFocus + 1) % 2;
      audio.select();
    }
    if ((d.a && !prev.a) || (d.start && !prev.start)) {
      beginGame(G.titleFocus === 0 ? 'solo' : 'versus');
    }
    players[0].gpPrev = { l: d.left, r: d.right, u: d.up, d: d.down, a: d.a, b: d.b, start: d.start };
    return;
  }
  const count = activeCount();
  for (let i = 0; i < count; i++) {
    if (liveIdx[i] == null) continue;
    const gp = pads[liveIdx[i]];
    const p = players[i];
    const d = readPad(gp);
    const prev = p.gpPrev;
    if (d.ax || d.ay) {
      pointer.using = false;
      p.x = clamp(p.x + d.ax * 720 * dt, 16, W - 16);
      p.y = clamp(p.y + d.ay * 720 * dt, 16, H - 16);
      const under = spotUnder(p.x, p.y);
      if (under) p.focus = under.index;
    }
    if (d.left && !prev.l) nudgeFocus(p, -1, 0);
    else if (d.right && !prev.r) nudgeFocus(p, 1, 0);
    else if (d.up && !prev.u) nudgeFocus(p, 0, -1);
    else if (d.down && !prev.d) nudgeFocus(p, 0, 1);
    if (d.a && !prev.a) confirmPlayer(i);
    if ((d.start && !prev.start) || (d.b && !prev.b && (G.mode === 'victory' || G.mode === 'gameover'))) {
      if (G.mode === 'play' || G.mode === 'launch') {
        if (G.paused) G.paused = false;
        else openPause();
      }
    }
    p.gpPrev = { l: d.left, r: d.right, u: d.up, d: d.down, a: d.a, b: d.b, start: d.start };
  }
}
function pollKeys() {
  if (G.mode === 'title') {
    if (pressed.has('a') || pressed.has('arrowleft')) {
      G.titleFocus = (G.titleFocus + 1) % 2;
      audio.select();
    } else if (pressed.has('d') || pressed.has('arrowright')) {
      G.titleFocus = (G.titleFocus + 1) % 2;
      audio.select();
    }
    if (pressed.has('enter') || pressed.has(' ') || pressed.has('f')) {
      beginGame(G.titleFocus === 0 ? 'solo' : 'versus');
    }
    return;
  }
  const schemes = G.playMode === 'versus'
    ? [
        { left: 'a', right: 'd', up: 'w', down: 's', fire: ['f', ' '] },
        { left: 'arrowleft', right: 'arrowright', up: 'arrowup', down: 'arrowdown', fire: ['enter'] }
      ]
    : [
        { left: null, right: null, up: null, down: null,
          anyLeft: ['a', 'arrowleft'], anyRight: ['d', 'arrowright'],
          anyUp: ['w', 'arrowup'], anyDown: ['s', 'arrowdown'],
          fire: ['f', ' ', 'enter'] }
      ];
  const count = G.playMode === 'versus' ? 2 : 1;
  for (let i = 0; i < count; i++) {
    const map = schemes[i];
    const p = players[i];
    const hit = (k) => k && pressed.has(k);
    const hitAny = (list) => list && list.some(k => pressed.has(k));
    if (map.anyLeft) {
      if (hitAny(map.anyLeft)) nudgeFocus(p, -1, 0);
      else if (hitAny(map.anyRight)) nudgeFocus(p, 1, 0);
      else if (hitAny(map.anyUp)) nudgeFocus(p, 0, -1);
      else if (hitAny(map.anyDown)) nudgeFocus(p, 0, 1);
    } else {
      if (hit(map.left)) nudgeFocus(p, -1, 0);
      else if (hit(map.right)) nudgeFocus(p, 1, 0);
      else if (hit(map.up)) nudgeFocus(p, 0, -1);
      else if (hit(map.down)) nudgeFocus(p, 0, 1);
    }
    if (hitAny(map.fire)) confirmPlayer(i);
  }
}

/* ---------- Update ---------- */
function update(dt) {
  G.t += dt;
  layoutSpots();
  for (let i = 0; i < activeCount(); i++) {
    if (players[i].focus >= G.spots.length) players[i].focus = 0;
  }
  pollKeys();
  pollGamepads(dt);
  pressed.clear();

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.y += (12 + s.z * 36) * dt;
    if (s.y > H) { s.y = -4; s.x = Math.random() * W; }
  }
  if (G.paused) return;

  G.feedbackT = Math.max(0, G.feedbackT - dt);
  G.lockT = Math.max(0, G.lockT - dt);
  G.strobe = Math.max(0, G.strobe - dt * 1.4);
  G.shake = Math.max(0, G.shake - dt * 28);
  for (let i = 0; i < activeCount(); i++) players[i].stun = Math.max(0, players[i].stun - dt);

  if (G.mission && (G.mode === 'play' || G.mode === 'launch')) {
    const ph = G.phase;
    G.slice = moveTo(G.slice, ph >= 1 ? 1 : 0, dt * 2.4);
    G.mark = moveTo(G.mark, ph >= 2 ? 1 : 0, dt * 2.4);
    G.finale = moveTo(G.finale, ph >= 3 ? 1 : 0, dt * 2.2);
  }
  if (G.mode === 'launch') {
    G.launchT -= dt;
    if (G.launchT <= 0 && G.ending !== 'gameover') {
      if (G.sortieDone || G.missionIndex + 1 >= G.sortie.length) {
        G.mode = 'victory';
        G.sortieDone = false;
        saveBest(topScore());
        speak('Sortie complete.');
      } else {
        loadMission(G.missionIndex + 1);
      }
    }
  }
  layoutSpots();
  if (G.ending) {
    G.endT -= dt;
    if (G.endT <= 0) {
      G.mode = G.ending;
      G.ending = '';
      if (G.mode === 'gameover') speak('Carrier shields are down.');
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }
  for (let i = 0; i < G.flyers.length; i++) {
    const f = G.flyers[i];
    f.x += f.v * dt;
    if (sparks.length < 160 && Math.random() < 0.7) {
      sparks.push({
        x: f.x - 18, y: f.y + 8,
        vx: -rand(80, 240), vy: rand(-36, 36),
        life: rand(0.18, 0.45),
        color: Math.random() < 0.5 ? '#ffb15a' : '#7ee7ff',
        size: rand(1.4, 2.6)
      });
    }
  }
  for (let i = G.floaters.length - 1; i >= 0; i--) {
    G.floaters[i].y -= 28 * dt;
    G.floaters[i].life -= dt;
    if (G.floaters[i].life <= 0) G.floaters.splice(i, 1);
  }
}

/* ---------- Draw helpers ---------- */
function roundRect(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function wrapText(text, maxW) {
  const words = String(text).split(' ');
  const lines = [];
  let cur = '';
  for (let i = 0; i < words.length; i++) {
    const next = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(next).width > maxW && cur) {
      lines.push(cur);
      cur = words[i];
    } else cur = next;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawShip(x, y, kind, scale, angle) {
  const color = COL[kind] || COL.fighter;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle || 0);
  ctx.scale(scale, scale);
  ctx.fillStyle = color;
  ctx.beginPath();
  if (kind === 'scout') {
    ctx.moveTo(0, -12);
    ctx.lineTo(7, 9);
    ctx.lineTo(0, 4);
    ctx.lineTo(-7, 9);
  } else if (kind === 'cruiser') {
    ctx.moveTo(0, -14);
    ctx.lineTo(5, -6);
    ctx.lineTo(5, 8);
    ctx.lineTo(0, 12);
    ctx.lineTo(-5, 8);
    ctx.lineTo(-5, -6);
  } else {
    ctx.moveTo(0, -13);
    ctx.lineTo(11, 5);
    ctx.lineTo(4, 3);
    ctx.lineTo(3, 11);
    ctx.lineTo(0, 6);
    ctx.lineTo(-3, 11);
    ctx.lineTo(-4, 3);
    ctx.lineTo(-11, 5);
  }
  ctx.closePath();
  ctx.fill();
  if (kind === 'cruiser') {
    ctx.fillRect(-12, -2, 6, 3);
    ctx.fillRect(6, -2, 6, 3);
  }
  ctx.fillStyle = '#ffb15a';
  ctx.fillRect(-1.6, 8, 3.2, 4);
  ctx.restore();
}
function drawBadge(x, y, text, color) {
  ctx.font = '700 13px Trebuchet MS, Segoe UI, sans-serif';
  const label = '[ ' + text + ' ]';
  const w = ctx.measureText(label).width + 12;
  roundRect(x - w / 2, y - 11, w, 22, 7);
  ctx.fillStyle = 'rgba(5, 10, 22, 0.88)';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y + 1);
}
function drawStars() {
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    ctx.globalAlpha = 0.25 + s.z * 0.7;
    ctx.fillStyle = s.z > 0.8 ? '#fff6d0' : '#d5e9ff';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}
function hangarChrome(label, accent) {
  const h = UI.hangar;
  roundRect(h.x, h.y, h.w, h.h, 16);
  ctx.fillStyle = 'rgba(8, 14, 28, 0.9)';
  ctx.fill();
  ctx.save();
  roundRect(h.x, h.y, h.w, h.h, 16);
  ctx.clip();
  ctx.strokeStyle = 'rgba(90, 150, 190, 0.08)';
  ctx.lineWidth = 1;
  for (let x = h.x - 20; x < h.x + h.w; x += 32) {
    ctx.beginPath();
    ctx.moveTo(x, h.y);
    ctx.lineTo(x - 50, h.y + h.h);
    ctx.stroke();
  }
  ctx.restore();
  ctx.lineWidth = 2;
  ctx.strokeStyle = accent || 'rgba(80, 190, 220, 0.45)';
  roundRect(h.x, h.y, h.w, h.h, 16);
  ctx.stroke();
  ctx.font = '700 12px Trebuchet MS, Segoe UI, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = accent || COL.cyan;
  ctx.fillText(label, h.x + 16, h.y + 16);
  if (G.strobe > 0) {
    ctx.fillStyle = 'rgba(255, 40, 70,' + (0.18 * G.strobe) + ')';
    roundRect(h.x, h.y, h.w, h.h, 16);
    ctx.fill();
    const blink = Math.sin(G.t * 28) > 0;
    ctx.fillStyle = blink ? '#ff3355' : '#5a1020';
    ctx.beginPath();
    ctx.arc(h.x + 18, h.y + h.h - 18, 5, 0, Math.PI * 2);
    ctx.arc(h.x + h.w - 18, h.y + h.h - 18, 5, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawTray() {
  const h = UI.hangar;
  const y = h.y + h.h - 36;
  const m = G.mission;
  if (!m) return;
  const shown = m.chips.slice(0, G.phase);
  ctx.font = '700 15px Trebuchet MS, Segoe UI, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = shown.length ? COL.gold : COL.muted;
  const text = shown.length ? shown.join('    →    ') : 'Working line locks in after each correct step';
  ctx.fillText(text, h.x + 16, y + 16);
}
function drawLooseGrid(count, rect, kind) {
  const cols = Math.max(4, Math.ceil(Math.sqrt(count * (rect.w / Math.max(1, rect.h)))));
  const rows = Math.ceil(count / cols);
  const cw = rect.w / cols;
  const rh = rect.h / rows;
  const scale = clamp(Math.min(cw, rh) / 34, 0.42, 1.15);
  for (let i = 0; i < count; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = rect.x + cw * col + cw / 2;
    const y = rect.y + rh * row + rh / 2;
    drawShip(x, y + Math.sin(G.t * 2 + i) * 1.2, kind, scale, 0);
  }
}
function groupedPoint(i, unit, den, rect) {
  const bay = Math.floor(i / unit);
  const k = i % unit;
  const bw = rect.w / den;
  const cols = unit > 6 ? 2 : 1;
  const rows = Math.ceil(unit / cols);
  const col = k % cols;
  const row = Math.floor(k / cols);
  return {
    bay,
    x: rect.x + bay * bw + bw * (col + 1) / (cols + 1),
    y: rect.y + 28 + (rect.h - 36) * (row + 1) / (rows + 1)
  };
}
function loosePoint(i, count, rect) {
  const cols = Math.max(4, Math.ceil(Math.sqrt(count * (rect.w / Math.max(1, rect.h)))));
  const rows = Math.ceil(count / cols);
  const cw = rect.w / cols;
  const rh = rect.h / rows;
  return {
    x: rect.x + cw * (i % cols) + cw / 2,
    y: rect.y + rh * Math.floor(i / cols) + rh / 2,
    scale: clamp(Math.min(cw, rh) / 34, 0.42, 1.15)
  };
}

function drawCollection(m) {
  const rect = shipRect();
  const v = m.visual;
  const slice = G.slice;
  hangarChrome(slice > 0.65 ? (v.den + ' EQUAL SQUADRONS  ·  ' + v.unit + ' SHIPS EACH') : 'FLIGHT DECK  ·  UNSLICED UNTIL THE DENOMINATOR DROPS', COL.cyan);
  if (slice < 0.98) {
    ctx.font = '700 14px Trebuchet MS, Segoe UI, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COL.dim;
    ctx.globalAlpha = 1 - slice;
    ctx.fillText(v.n + ' STARFIGHTERS IN ONE BERTH', UI.hangar.x + UI.hangar.w - 18, UI.hangar.y + 16);
    ctx.globalAlpha = 1;
  }
  const cols = Math.max(4, Math.ceil(Math.sqrt(v.n * (rect.w / rect.h))));
  const rows = Math.ceil(v.n / cols);
  const cell = Math.min(rect.w / cols, rect.h / rows);
  const looseScale = clamp(cell / 34, 0.4, 1.1);
  const bayW = rect.w / v.den;
  const gCols = v.unit > 6 ? 2 : 1;
  const gRows = Math.ceil(v.unit / gCols);
  const gScale = clamp(Math.min(bayW / (gCols + 0.4), (rect.h - 30) / (gRows + 0.6)) / 30, 0.4, 1.05);

  if (slice > 0.02) {
    for (let b = 0; b < v.den; b++) {
      const x = rect.x + b * bayW;
      const hot = G.mark > 0 && b < v.num;
      ctx.globalAlpha = 0.15 + slice * 0.85;
      roundRect(x + 4, rect.y, bayW - 8, rect.h, 8);
      ctx.fillStyle = hot ? 'rgba(255, 193, 74, 0.16)' : 'rgba(62, 224, 255, 0.05)';
      ctx.fill();
      ctx.lineWidth = hot ? 2 : 1;
      ctx.strokeStyle = hot ? COL.gold : 'rgba(62, 224, 255, 0.35)';
      ctx.stroke();
      if (b < v.den - 1) {
        const lx = x + bayW;
        ctx.strokeStyle = COL.cyan;
        ctx.globalAlpha = slice;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 12;
        ctx.shadowColor = COL.cyan;
        ctx.beginPath();
        ctx.moveTo(lx, rect.y + 8);
        ctx.lineTo(lx, rect.y + rect.h * slice);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = slice;
      drawBadge(x + bayW / 2, rect.y + 16, String(v.unit), hot ? COL.gold : COL.cyan);
      if (hot) {
        ctx.font = '700 11px Trebuchet MS, Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = COL.gold;
        ctx.fillText('LAUNCH', x + bayW / 2, rect.y + rect.h - 8);
      }
      ctx.globalAlpha = 1;
    }
  }
  for (let i = 0; i < v.n; i++) {
    const a = loosePoint(i, v.n, rect);
    const b = groupedPoint(i, v.unit, v.den, rect);
    const x = lerp(a.x, b.x, slice);
    const y = lerp(a.y, b.y, slice);
    const sc = lerp(looseScale, gScale, slice);
    const hot = slice > 0.6 && G.mark > 0 && b.bay < v.num;
    ctx.globalAlpha = hot ? 1 : (G.mark > 0 && slice > 0.6 ? 0.45 : 1);
    drawShip(x, y + Math.sin(G.t * 2.2 + i * 0.4) * (1 - slice * 0.5), 'fighter', sc, 0);
    ctx.globalAlpha = 1;
  }
}

function drawWingShips(x, y, w, h, kind, count) {
  const show = Math.min(count, 8);
  const cols = Math.min(4, show);
  const rows = Math.ceil(show / cols);
  for (let i = 0; i < show; i++) {
    const c = i % cols;
    const r = Math.floor(i / cols);
    drawShip(
      x + w * (c + 1) / (cols + 1),
      y + h * (r + 1) / (rows + 1),
      kind, 0.85, 0
    );
  }
}
function drawPortion(m) {

    ctx.fillStyle = COL.ink;
    ctx.fillText(G.mark > 0.4 ? raw : '? / ' + '?', rect.x + rect.w * 0.48, benchY + benchH / 2);
    if (G.mark > 0.4) {
      ctx.fillStyle = COL.gold;
      ctx.font = '700 20px Trebuchet MS, Segoe UI, sans-serif';
      ctx.fillText('÷ ' + v.g, rect.x + rect.w * 0.64, benchY + benchH / 2);
      ctx.font = '700 28px Trebuchet MS, Segoe UI, sans-serif';
      ctx.fillStyle = G.finale > 0.4 ? COL.green : COL.muted;
      ctx.fillText(G.finale > 0.4 ? (v.sn + '/' + v.sd) : '? / ?', rect.x + rect.w * 0.82, benchY + benchH / 2);

function drawInk(m) {
  hangarChrome('NEBULA CLOAK  ·  HIDDEN SQUADRONS', COL.nebula);
  const rect = shipRect();
  const v = m.visual;
  if (G.slice < 0.85) {
    ctx.globalAlpha = 1 - G.slice;
    const gap = 12;
    const dw = (rect.w * 0.72 - gap * 2) / 3;
    for (let i = 0; i < 3; i++) {
      const x = rect.x + i * (dw + gap);
      roundRect(x, rect.y, dw, rect.h, 10);
      ctx.fillStyle = 'rgba(62, 224, 255, 0.06)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(120, 200, 230, 0.45)';
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 15px Trebuchet MS, Segoe UI, sans-serif';
      ctx.fillStyle = COL.ink;
      ctx.fillText(v.names[i].toUpperCase(), x + dw / 2, rect.y + 20);
      ctx.font = '700 26px Trebuchet MS, Segoe UI, sans-serif';
      ctx.fillStyle = COL.cyan;
      ctx.fillText(String(v.counts[i]), x + dw / 2, rect.y + 50);
      drawWingShips(x, rect.y + 64, dw, rect.h - 76, v.kinds[i], Math.min(8, v.counts[i]));
    }
    const nx = rect.x + rect.w * 0.75;
    const nw = rect.w * 0.25;
    roundRect(nx, rect.y, nw, rect.h, 12);
    const g = ctx.createLinearGradient(nx, rect.y, nx + nw, rect.y + rect.h);
    g.addColorStop(0, 'rgba(120, 60, 220, 0.2)');
    g.addColorStop(1, 'rgba(176, 107, 255, 0.55)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = COL.nebula;
    ctx.stroke();
    ctx.fillStyle = COL.white;
    ctx.font = '700 18px Trebuchet MS, Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CLOAKED', nx + nw / 2, rect.y + rect.h * 0.38);
    ctx.font = '700 28px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillStyle = COL.gold;
    ctx.fillText(v.hN + '/' + v.den, nx + nw / 2, rect.y + rect.h * 0.52);
    ctx.font = '700 42px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillStyle = '#f3e8ff';
    ctx.globalAlpha = (1 - G.slice) * pulse(G.t, 3, 0.55, 1);
    ctx.fillText('?', nx + nw / 2, rect.y + rect.h * 0.72);
    ctx.globalAlpha = 1;
  }
  if (G.slice > 0.05) {
    ctx.globalAlpha = G.slice;
    const bw = rect.w / v.den;
    for (let b = 0; b < v.den; b++) {
      const x = rect.x + b * bw;
      const cloaked = b >= v.visN && G.finale < 0.65;
      roundRect(x + 3, rect.y, bw - 6, rect.h, 8);
      if (cloaked) {
        const ng = ctx.createLinearGradient(x, rect.y, x, rect.y + rect.h);
        ng.addColorStop(0, 'rgba(90, 40, 180, 0.35)');
        ng.addColorStop(1, 'rgba(176, 107, 255,' + pulse(G.t, 2.4, 0.35, 0.7) + ')');
        ctx.fillStyle = ng;
        ctx.fill();
        ctx.strokeStyle = COL.nebula;
        ctx.stroke();
        ctx.fillStyle = '#f6ecff';
        ctx.font = '700 28px Trebuchet MS, Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', x + bw / 2, rect.y + rect.h * 0.55);
      } else {
        const hot = G.finale > 0.65 || b < v.visN;
        ctx.fillStyle = hot ? 'rgba(62, 224, 255, 0.08)' : 'rgba(255,255,255,0.03)';
        ctx.fill();
        ctx.strokeStyle = G.finale > 0.65 ? COL.green : COL.cyan;
        ctx.stroke();
        const mini = Math.min(4, Math.max(2, Math.floor(bw / 28)));
        for (let k = 0; k < mini; k++) {
          drawShip(x + bw * (k + 1) / (mini + 1), rect.y + rect.h * 0.42, v.kinds[k % 3], clamp(bw / 90, 0.45, 0.9), 0);
        }
      }
      if (G.mark > 0.45 && !(cloaked)) {
        drawBadge(x + bw / 2, rect.y + 16, String(v.unit), COL.cyan);
      } else if (G.slice > 0.8 && b === 0) {
        /* bay count is the model, ship count waits for the unit step */
      }
    }
    ctx.globalAlpha = 1;
    if (G.finale > 0.65) {
      ctx.font = '700 16px Trebuchet MS, Segoe UI, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillStyle = COL.green;
      ctx.textBaseline = 'middle';
      ctx.fillText('FULL ARMADA  ' + v.total, UI.hangar.x + UI.hangar.w - 18, UI.hangar.y + 16);
    }
  }
}

function drawRemainder(m) {
  hangarChrome('PATROL SPLIT  ·  FRACTION OF THE REMAINDER', COL.amber);
  const rect = shipRect();
  const v = m.visual;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 16px Trebuchet MS, Segoe UI, sans-serif';

  const barY = rect.y + 28;

  const gap = 8;
  const segW = (rect.w - gap * (v.aD - 1)) / v.aD;
  for (let i = 0; i < v.aD; i++) {
    const alpha = i < v.aN;
    const slide = alpha ? -26 * G.slice : 18 * G.slice;
    const x = rect.x + i * (segW + gap) + slide;
    roundRect(x, barY, segW, barH, 8);

    if (G.slice > 0.45) {
      ctx.fillStyle = alpha ? COL.p1 : COL.cyan;
      ctx.fillText(String(alpha ? v.alpha / v.aN : v.rem / (v.aD - v.aN)), x + segW / 2, barY + 50);
    } else if (alpha) {
      ctx.fillStyle = COL.gold;
      ctx.fillText(v.aN + '/' + v.aD, x + segW / 2, barY + 50);
    }
  }
  ctx.font = '700 14px Trebuchet MS, Segoe UI, sans-serif';

function drawCards() {
  const m = G.mission;
  const launch = G.spots.find(s => s.id === 'launch');
  if (!m || !launch || G.paused || (G.mode !== 'play' && G.mode !== 'launch')) return;
  const step = m.steps[Math.min(G.step, 2)];
  for (let i = 0; i < 4; i++) {
    const s = G.spots[i];
    if (!s) continue;
    const choice = step.choices[i];
    if (!s || s.id !== 'card' || !choice) continue;
    let armed = -1;
    for (let p = 0; p < activeCount(); p++) if (players[p].armed === i) armed = p;
    const focused = players[0].focus === i || (G.playMode === 'versus' && players[1].focus === i);
    roundRect(s.x, s.y, s.w, s.h, 12);
    ctx.fillStyle = armed >= 0 ? 'rgba(255, 193, 74, 0.14)' : 'rgba(10, 18, 34, 0.94)';
    ctx.fill();
    ctx.lineWidth = focused || armed >= 0 ? 3 : 1.5;
    ctx.strokeStyle = armed >= 0 ? COL.gold : (focused ? COL.cyan : 'rgba(120, 160, 190, 0.4)');
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const size = choice.label.length > 12 ? 22 : (choice.label.length > 8 ? 26 : 32);
    ctx.font = '700 ' + size + 'px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillStyle = COL.ink;
    const lines = wrapText(choice.label, s.w - 24);
    const top = s.y + s.h * 0.38 - (lines.length - 1) * 12;
    for (let L = 0; L < lines.length; L++) ctx.fillText(lines[L], s.x + s.w / 2, top + L * 26);
    ctx.font = '700 13px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillStyle = COL.dim;
    ctx.fillText(choice.caption, s.x + s.w / 2, s.y + s.h - 28);
    if (armed >= 0) {
      ctx.fillStyle = players[armed].color;
      ctx.font = '700 11px Trebuchet MS, Segoe UI, sans-serif';
      ctx.fillText(players[armed].short + ' ARMED', s.x + s.w / 2, s.y + 16);
    }
  }
  const ready = step.launch;
  const launchIndex = G.spots.indexOf(launch);
  const launchFocus = players[0].focus === launchIndex || (G.playMode === 'versus' && players[1].focus === launchIndex);
  const armedAny = players[0].armed >= 0 || (G.playMode === 'versus' && players[1].armed >= 0);
  roundRect(launch.x, launch.y, launch.w, launch.h, 14);
  const glow = ready ? pulse(G.t, 4, 0.55, 1) : 0.35;
  ctx.fillStyle = ready ? 'rgba(255, 140, 40, 0.18)' : 'rgba(20, 28, 44, 0.9)';
  ctx.fill();
  ctx.lineWidth = launchFocus ? 4 : 3;
  ctx.strokeStyle = launchFocus ? COL.cyan : (ready ? 'rgba(255, 176, 60,' + glow + ')' : 'rgba(90, 110, 130, 0.4)');
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = ready ? COL.gold : COL.muted;
  ctx.font = '700 14px Trebuchet MS, Segoe UI, sans-serif';
  ctx.fillText(ready ? 'FINAL STEP' : 'STANDBY', launch.x + launch.w / 2, launch.y + 36);
  ctx.font = '700 20px Trebuchet MS, Segoe UI, sans-serif';
  ctx.fillStyle = ready ? COL.white : COL.muted;
  ctx.fillText('LAUNCH', launch.x + launch.w / 2, launch.y + 78);
  ctx.fillText('SQUADRON', launch.x + launch.w / 2, launch.y + 104);
  ctx.font = '700 12px Trebuchet MS, Segoe UI, sans-serif';
  ctx.fillStyle = armedAny && ready ? COL.green : COL.dim;
  ctx.fillText(armedAny && ready ? 'THRUSTERS HOT' : (ready ? 'ARM A CARD' : 'LOCK A CARD'), launch.x + launch.w / 2, launch.y + 146);
}

function drawReticle(p) {
  if (G.playMode !== 'versus' && p.id !== 0) return;
  if (G.mode !== 'play' && G.mode !== 'launch' && G.mode !== 'title') return;
  const r = 15 + Math.sin(G.t * 5 + p.id) * 1.5;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 2;
  ctx.globalAlpha = p.stun > 0 ? (0.35 + 0.4 * Math.abs(Math.sin(G.t * 18))) : 0.95;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-r - 7, 0); ctx.lineTo(-r + 3, 0);
  ctx.moveTo(r + 7, 0); ctx.lineTo(r - 3, 0);
  ctx.moveTo(0, -r - 7); ctx.lineTo(0, -r + 3);
  ctx.moveTo(0, r + 7); ctx.lineTo(0, r - 3);
  ctx.stroke();
  if (p.stun > 0) {
    ctx.font = '700 10px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillStyle = p.color;
    ctx.textAlign = 'center';
    ctx.fillText('STUN', 0, -r - 12);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

    ctx.fillStyle = on ? COL.gold : COL.muted;
    ctx.font = '700 13px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillText(on ? 'A  /  ENTER  /  CLICK TO LAUNCH' : 'SELECT', s.x + s.w / 2, s.y + s.h - 28);
  }

  ctx.textAlign = 'center';
  ctx.font = '700 14px Trebuchet MS, Segoe UI, sans-serif';
  ctx.fillStyle = COL.dim;
  ctx.fillText('SOLO   mouse hover + click    ·    WASD or arrows    ·    Space / Enter    ·    Pad 0  A', W / 2, 560);
  ctx.fillText('VERSUS   P1  WASD + F/Space or Pad 0     ·     P2  Arrows + Enter or Pad 1', W / 2, 586);
  ctx.fillStyle = COL.gold;
  ctx.fillText('BEST  ' + G.best + '  FLEET COMMAND POINTS', W / 2, 628);
  ctx.fillStyle = COL.muted;
  ctx.font = '700 13px Trebuchet MS, Segoe UI, sans-serif';
  ctx.fillText(G.padNote, W / 2, 660);
  if (G.bootErrors.length) {
    ctx.fillStyle = COL.red;
    ctx.fillText(G.bootErrors[0], W / 2, 692);
  }
  for (let i = 0; i < 5; i++) {
    drawShip(80 + ((G.t * 70 + i * 140) % (W + 120)) - 40, 34 + (i % 2) * 8, i % 2 ? 'fighter' : 'scout', 0.72, Math.PI / 2);
  }
}

function drawEnd() {
  const win = G.mode === 'victory';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 48px Trebuchet MS, Segoe UI, sans-serif';
  ctx.fillStyle = win ? COL.gold : COL.red;
  ctx.fillText(win ? 'SORTIE COMPLETE' : 'SHIELDS DOWN', W / 2, 150);
  ctx.font = '700 18px Trebuchet MS, Segoe UI, sans-serif';
  ctx.fillStyle = COL.ink;
  if (G.playMode === 'versus') {
    const lead = players[0].stars === players[1].stars
      ? (players[0].score === players[1].score ? 'Dead heat' : (players[0].score > players[1].score ? players[0].name : players[1].name) + ' takes the deck')
      : (players[0].stars > players[1].stars ? players[0].name : players[1].name) + ' wins the star tally';
    ctx.fillText(lead, W / 2, 220);
    ctx.fillStyle = COL.p1;
    ctx.fillText(players[0].name + '   ★ ' + players[0].stars + '    ' + players[0].score + ' FCP', W / 2, 268);
    ctx.fillStyle = COL.p2;
    ctx.fillText(players[1].name + '   ★ ' + players[1].stars + '    ' + players[1].score + ' FCP', W / 2, 304);
  } else {
    ctx.fillText(win ? 'The armada answered every order.' : 'The carrier took too many bad locks.', W / 2, 214);
    ctx.fillStyle = COL.gold;
    ctx.font = '700 28px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillText(players[0].score + ' FLEET COMMAND POINTS', W / 2, 270);
    ctx.font = '700 16px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillStyle = COL.dim;
    ctx.fillText('Stars ' + players[0].stars + '    ·    Best ' + G.best, W / 2, 312);
  }
  ctx.font = '700 15px Trebuchet MS, Segoe UI, sans-serif';
  ctx.fillStyle = COL.dim;
  const note = win
    ? 'You sliced squadrons, simplified wings, decloaked a nebula, and scaled past one whole.'
    : 'A fraction of a fleet is equal groups. Divide by the denominator before you multiply.';
  ctx.fillText(note, W / 2, 380);
  for (let i = 0; i < G.spots.length; i++) {
    const s = G.spots[i];
    const on = players[0].focus === i;
    roundRect(s.x, s.y, s.w, s.h, 12);
    ctx.fillStyle = on ? 'rgba(62,224,255,0.12)' : 'rgba(8,14,28,0.9)';
    ctx.fill();
    ctx.strokeStyle = on ? COL.cyan : 'rgba(140,170,200,0.4)';
    ctx.lineWidth = on ? 3 : 1.5;
    ctx.stroke();
    ctx.fillStyle = COL.white;
    ctx.font = '700 18px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillText(s.id === 'again' ? 'FLY AGAIN' : 'TITLE SCREEN', s.x + s.w / 2, s.y + s.h / 2);
  }
}

function drawPause() {
  ctx.fillStyle = 'rgba(4, 8, 16, 0.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 36px Trebuchet MS, Segoe UI, sans-serif';
  ctx.fillStyle = COL.white;
  ctx.fillText('HOLDING PATTERN', W / 2, 240);
  for (let i = 0; i < G.spots.length; i++) {
    const s = G.spots[i];
    roundRect(s.x, s.y, s.w, s.h, 12);
    ctx.fillStyle = 'rgba(10, 18, 32, 0.95)';
    ctx.fill();
    ctx.strokeStyle = i === 0 ? COL.cyan : COL.gold;
    ctx.stroke();
    ctx.fillStyle = COL.ink;
    ctx.font = '700 20px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillText(s.id === 'resume' ? 'RESUME SORTIE' : 'RETURN TO TITLE', s.x + s.w / 2, s.y + s.h / 2);
  }
}

function drawPlayfield() {
  drawHUD();
  drawBrief();
  const m = G.mission;
  if (!m) return;
  if (m.kind === 'collection') drawCollection(m);
  else if (m.kind === 'portion') drawPortion(m);
  else if (m.kind === 'ink') drawInk(m);
  else if (m.kind === 'remainder') drawRemainder(m);
  else if (m.kind === 'overdrive') drawOverdrive(m);
  drawTray();
  drawPrompt();
  drawCards();
  drawFeedback();
  drawFlyers();
  if (G.mode === 'launch') {
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '700 13px Trebuchet MS, Segoe UI, sans-serif';
    ctx.fillStyle = COL.gold;
    ctx.fillText('SQUADRON AWAY', UI.hangar.x + UI.hangar.w - 18, UI.hangar.y + 16);
  }
}

function draw() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (G.shake > 0.4) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake * 0.6, G.shake * 0.6));
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);
  drawStars();
  const neb = ctx.createRadialGradient(1100, 80, 20, 1100, 80, 280);
  neb.addColorStop(0, 'rgba(120, 70, 220, 0.28)');
  neb.addColorStop(1, 'rgba(120, 70, 220, 0)');
  ctx.fillStyle = neb;
  ctx.fillRect(800, 0, 480, 320);

  if (G.mode === 'title') drawTitle();
  else if (G.mode === 'victory' || G.mode === 'gameover') {
    drawStars();
    drawEnd();
  } else drawPlayfield();

  if (G.mode === 'play' || G.mode === 'launch' || G.mode === 'title' || G.mode === 'victory' || G.mode === 'gameover') {
    const n = (G.mode === 'play' || G.mode === 'launch') && G.playMode === 'versus' ? 2 : 1;
    if (G.mode === 'title') {
      /* title uses card focus, no free reticle */
    } else {
      for (let i = 0; i < n; i++) drawReticle(players[i]);
    }
  }
  if (G.paused) drawPause();
  if (G.strobe > 0 && G.mode === 'play') {
    ctx.fillStyle = 'rgba(255, 30, 60,' + (0.12 * G.strobe) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function frame(now) {
  const dt = Math.min(0.034, (now - (frame.last || now)) / 1000);
  frame.last = now;
  try {
    update(dt);
    draw();
    G.fatal = '';
  } catch (err) {
    G.fatal = err && err.message ? err.message : String(err);
    if (live) live.textContent = G.fatal;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#17060c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffd0d8';
    ctx.font = '16px sans-serif';
    ctx.fillText('Squadron Splitter hit a snag: ' + G.fatal, 24, 48);
    console.error(err);
  }
  requestAnimationFrame(frame);
}

resize();
canvas.focus();
if (globalThis.SQUADRON_TEST) {
  console.log(bootErrors.length ? bootErrors.join('\n') : 'OK');
}
requestAnimationFrame(frame);
</script>
