function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#07040c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(view.s, 0, 0, view.s, view.ox, view.oy);
  ctx.translate(G.shakeX, G.shakeY);
  drawBackground();
  if (G.mode === 'play' || G.mode === 'over') {
    if (G.problem) drawStage(phase());
    drawHud();
    if (G.problem) {
      drawTicket();
      drawStepBar();
      drawHint();
      drawCards();
    }
    drawParticles();
    drawFloats();
    if (G.mode === 'play') drawReticles();
  }
  if (G.mode === 'title') drawTitle();
  if (G.mode === 'over') drawOver();
  if (G.fatal) {
    ctx.fillStyle = COL.red;
    ctx.font = font(16, 700);
    ctx.textAlign = 'left';
    ctx.fillText(G.fatal, 24, VH - 24);
  }
}

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = window.innerWidth;
  var h = window.innerHeight;
  canvas.width = Math.max(1, Math.floor(w * dpr));
  canvas.height = Math.max(1, Math.floor(h * dpr));
  view.s = Math.min(canvas.width / VW, canvas.height / VH);
  view.ox = (canvas.width - VW * view.s) / 2;
  view.oy = (canvas.height - VH * view.s) / 2;
}

function frame(ts) {
  if (!frame.last) frame.last = ts;
  var dt = Math.min(0.034, (ts - frame.last) / 1000 || 0.016);
  frame.last = ts;
  try {
    update(dt);
    render();
  } catch (err) {
    console.error(err);
    G.fatal = err && err.message ? err.message : String(err);
    try { render(); } catch (e2) { /* keep looping */ }
  }
  requestAnimationFrame(frame);
}

function boot() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  muteBtn = document.getElementById('mute');
  sr = document.getElementById('sr');
  try {
    var saved = JSON.parse(localStorage.getItem(BEST_KEY) || '{}');
    G.best.solo = saved.solo || 0;
    G.best.coop = saved.coop || 0;
    G.best.versus = saved.versus || 0;
  } catch (e) { /* ignore */ }
  for (var i = 0; i < 28; i++) dust.push({ x: (i * 97) % VW, y: (i * 53) % VH, s: 0.2 + (i % 5) * 0.15 });
  auditErrors = runAudit();
  window.__cyberAudit = auditErrors;
  window.__bakery = G;
  if (auditErrors.length) console.warn('Cyber-Bakery audit', auditErrors);
  else console.log('Cyber-Bakery audit ok');
  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    toggleMute();
  });
  window.addEventListener('resize', resize);
  function tapKey(code) {
    var solo = G.playMode === 'solo' || G.mode !== 'play';
    function nudge(pid, dir, vert) {
      moveFocus(pid, dir, vert);
      players[pid].primed = true;
      players[pid].hold = 0.28;
    }
    function act(pid) {
      was[code] = true;
      players[pid].mouse = false;
      if (G.mode === 'title') beginGame(['solo', 'coop', 'versus'][G.titleFocus]);
      else if (G.mode === 'over') handleActivate(0, G.overFocus);
      else handleActivate(pid, players[pid].focus);
    }
    if (solo) {
      if (code === 'ArrowLeft' || code === 'KeyA') nudge(0, -1, 0);
      else if (code === 'ArrowRight' || code === 'KeyD') nudge(0, 1, 0);
      else if (code === 'ArrowUp' || code === 'KeyW') nudge(0, 0, -1);
      else if (code === 'ArrowDown' || code === 'KeyS') nudge(0, 0, 1);
      else if (code === 'Space' || code === 'Enter' || code === 'KeyF') act(0);
      return;
    }
    if (code === 'KeyA') nudge(0, -1, 0);
    else if (code === 'KeyD') nudge(0, 1, 0);
    else if (code === 'KeyW') nudge(0, 0, -1);
    else if (code === 'KeyS') nudge(0, 0, 1);
    else if (code === 'KeyF' || code === 'Space') act(0);
    else if (code === 'ArrowLeft') nudge(1, -1, 0);
    else if (code === 'ArrowRight') nudge(1, 1, 0);
    else if (code === 'ArrowUp') nudge(1, 0, -1);
    else if (code === 'ArrowDown') nudge(1, 0, 1);
    else if (code === 'Enter') act(1);
  }

  window.addEventListener('keydown', function (e) {
    if (e.target === muteBtn) return;
    if (e.code === 'KeyM' && !e.repeat) toggleMute();
    if (e.code === 'Escape' && G.mode !== 'title') { goTitle(); return; }
    var block = ['Space', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    if (block.indexOf(e.code) !== -1) e.preventDefault();
    ensureAudio();
    if (!e.repeat && !held[e.code]) tapKey(e.code);
    held[e.code] = true;
  });
  window.addEventListener('keyup', function (e) { held[e.code] = false; });
  window.addEventListener('blur', function () {
    for (var code in held) held[code] = false;
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = toWorld(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.on = true;
    pointer.moved = true;
  });
  canvas.addEventListener('pointerdown', function (e) {
    canvas.focus();
    var p = toWorld(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
    pointerDown(p.x, p.y);
  });
  document.addEventListener('visibilitychange', function () {
    if (!audio.master) return;
    if (document.hidden) audio.master.gain.value = 0;
    else if (!audio.muted) audio.master.gain.value = 0.9;
  });
  resize();
  canvas.focus();
  requestAnimationFrame(frame);
}

function toWorld(cx, cy) {
  var rect = canvas.getBoundingClientRect();
  var x = (cx - rect.left) * (canvas.width / rect.width);
  var y = (cy - rect.top) * (canvas.height / rect.height);
  return { x: (x - view.ox) / view.s, y: (y - view.oy) / view.s };
}

boot();
</script>
