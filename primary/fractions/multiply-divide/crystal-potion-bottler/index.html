function flaskPath(x, y, w, h, beaker) {
  const neck = beaker ? w * 0.72 : w * 0.4;
  const neckH = h * (beaker ? 0.08 : 0.14);
  const cx = x + w / 2;
  const top = y;
  const bot = y + h;
  ctx.beginPath();
  ctx.moveTo(cx - neck / 2, top);
  ctx.lineTo(cx + neck / 2, top);
  ctx.lineTo(cx + neck / 2, top + neckH);
  ctx.quadraticCurveTo(x + w + 2, top + neckH + 6, x + w - 1, top + neckH + h * 0.18);
  ctx.lineTo(x + w - w * 0.06, bot - 10);
  ctx.quadraticCurveTo(cx, bot + 12, x + w * 0.06, bot - 10);
  ctx.lineTo(x + 1, top + neckH + h * 0.18);
  ctx.quadraticCurveTo(x - 2, top + neckH + 6, cx - neck / 2, top + neckH);
  ctx.closePath();
}

function drawFlask(x, baseline, w, h, fillLitres, capacity, grad, linesAmt, potion, label, beaker) {
  const y = baseline - h;
  capacity = Math.max(1, capacity);
  const fill01 = Math.max(0, Math.min(1, fillLitres / capacity));
  ctx.save();
  flaskPath(x, y, w, h, beaker);
  ctx.clip();
  const glass = ctx.createLinearGradient(x, y, x + w, y);
  glass.addColorStop(0, 'rgba(190, 230, 255, 0.16)');
  glass.addColorStop(0.5, 'rgba(255, 255, 255, 0.04)');
  glass.addColorStop(1, 'rgba(120, 190, 220, 0.14)');
  ctx.fillStyle = glass;
  ctx.fillRect(x - 4, y - 4, w + 8, h + 16);
  const innerTop = y + h * 0.16;
  const innerBot = y + h - 8;
  const innerH = innerBot - innerTop;
  const fillH = innerH * fill01;
  if (fillH > 1) {
    const top = innerBot - fillH;
    const lg = ctx.createLinearGradient(x, top, x, innerBot);
    lg.addColorStop(0, potion.c);
    lg.addColorStop(0.35, potion.a);
    lg.addColorStop(1, potion.b);
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(x - 2, innerBot + 8);
    for (let px = 0; px <= w + 4; px += 4) {
      const wy = top + Math.sin(px * 0.18 + G.time * 4 + x) * 2.4 * Math.min(1, fillH / 20);
      ctx.lineTo(x - 2 + px, wy);
    }
    ctx.lineTo(x + w + 4, innerBot + 8);
    ctx.closePath();
    ctx.fill();
    for (let b = 0; b < 4; b++) {
      const by = top + ((G.time * 28 + b * 23 + x) % Math.max(8, fillH));
      const bx = x + 8 + ((b * 37 + x) % Math.max(8, w - 16));
      if (by > top + 4 && by < innerBot) {
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(bx, by, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }
  if (linesAmt > 0.02) {
    ctx.globalAlpha = 0.35 + 0.65 * linesAmt;
    const litres = capacity;
    const parts = Math.max(1, grad) * litres;
    function laser(y1, x0, x1, wide) {
      ctx.beginPath();
      ctx.moveTo(x0, y1);
      ctx.lineTo(x1, y1);
      ctx.strokeStyle = 'rgba(4, 10, 20, 0.8)';
      ctx.lineWidth = wide ? 4 : 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x0, y1);
      ctx.lineTo(x1, y1);
      ctx.strokeStyle = wide ? '#fff4c2' : '#b8fff4';
      ctx.lineWidth = wide ? 2 : 1.4;
      ctx.stroke();
    }
    for (let L = 1; L < litres; L++) laser(innerBot - innerH * (L / litres), x + 8, x + w - 8, true);
    for (let i = 1; i < parts; i++) {
      if (litres > 1 && i % grad === 0) continue;
      laser(innerBot - innerH * (i / parts), x + w * 0.2, x + w * 0.8, false);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  flaskPath(x, y, w, h, beaker);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(232, 247, 255, 0.9)';
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + w * 0.18, y + h * 0.28);
  ctx.quadraticCurveTo(x + w * 0.22, y + h * 0.7, x + w * 0.16, y + h * 0.82);
  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 2;
  ctx.stroke();
  if (label) text(label, x + w / 2, baseline + 14, 12, '#d5f6ff', 'center', 'middle');
}

function drawCork(x, baseline, w, h, amt) {
  if (amt <= 0) return;
  const y = baseline - h;
  ctx.globalAlpha = Math.min(1, amt * 1.4);
  roundRect(x + w * 0.34, y - 8 * amt, w * 0.32, 10, 3);
  ctx.fillStyle = '#e6b15a';
  ctx.fill();
  ctx.strokeStyle = '#fff1cc';
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function rowMetrics(n, zoneX, zoneW, maxW, minW) {
  n = Math.max(1, n | 0);
  let w = maxW;
  let g = n === 1 ? 0 : 10;
  while (n * w + (n - 1) * g > zoneW && w > minW) w -= 2;
  let total = n * w + (n - 1) * g;
  if (total > zoneW) {
    w = minW;
    g = n === 1 ? 0 : Math.max(3, (zoneW - n * w) / Math.max(1, n - 1));
    total = n * w + (n - 1) * g;
  }
  return { w: w, g: g, x: zoneX + Math.max(0, (zoneW - total) / 2), n: n };
}

function drawPipe(x1, y1, x2, y2, amt, color) {
  if (amt <= 0.02) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.35 + 0.5 * amt;
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const my = (y1 + y2) / 2 - 30;
  ctx.moveTo(x1, y1);
  ctx.bezierCurveTo(x1, my, x2, my, x2, y2);
  ctx.stroke();
  ctx.setLineDash([7, 9]);
  ctx.lineDashOffset = -G.time * 48;
  ctx.strokeStyle = '#f4fdff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawChute(amt) {
  if (amt <= 0) return;
  const x = 1080;
  const y = 214;
  ctx.save();
  ctx.globalAlpha = 0.35 + amt * 0.65;
  roundRect(x, y, 160, 36, 16);
  ctx.fillStyle = 'rgba(8, 20, 36, 0.8)';
  ctx.fill();
  ctx.strokeStyle = '#7af7ff';
  ctx.lineWidth = 2;
  ctx.stroke();
  text('DISPATCH', x + 80, y + 18, 13, '#d8fbff', 'center', 'middle');
  ctx.restore();
}

function drawLadle(x, y, w, h, fill01, potion, label) {
  roundRect(x, y, w, h, 10);
  ctx.fillStyle = 'rgba(210, 240, 255, 0.08)';
  ctx.fill();
  ctx.save();
  roundRect(x, y, w, h, 10);
  ctx.clip();
  const fh = h * Math.max(0, Math.min(1, fill01));
  if (fh > 0) {
    const lg = ctx.createLinearGradient(x, y + h - fh, x, y + h);
    lg.addColorStop(0, potion.c);
    lg.addColorStop(1, potion.b);
    ctx.fillStyle = lg;
    ctx.fillRect(x, y + h - fh, w, fh + 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.moveTo(x + 3, y + h - fh);
    ctx.bezierCurveTo(x + w * 0.3, y + h - fh - 3, x + w * 0.7, y + h - fh + 3, x + w - 3, y + h - fh);
    ctx.stroke();
  }
  ctx.restore();
  roundRect(x, y, w, h, 10);
  ctx.strokeStyle = '#e8f7ff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + w, y + h * 0.35);
  ctx.quadraticCurveTo(x + w + 28, y + h * 0.1, x + w + 34, y - 8);
  ctx.strokeStyle = '#ffc14a';
  ctx.lineWidth = 4;
  ctx.stroke();
  if (label) text(label, x + w / 2, y + h + 16, 12, '#d5f6ff', 'center', 'middle');
}

function drawScene() {
  const box = GEO.stage;
  panel(box.x, box.y, box.w, box.h, 16, 'rgba(6, 14, 30, 0.78)', 'rgba(125, 236, 255, 0.28)');
  const p = G.problem;
  if (!p) return;
  const vis = visNow();
  const potion = potionOf();
  const top = box.y + 28;
  const baseline = GEO.banner.y - 30;
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);

  ctx.fillStyle = 'rgba(80, 200, 220, 0.08)';
  roundRect(28, baseline - 6, 1224, 10, 5);
  ctx.fill();

  if (p.kind === 'pour') {
    const share = p.W / p.B;
    const cap = Math.max(1, Math.ceil(share - 1e-6));
    const left = rowMetrics(p.W, 36, 620, 78, 36);
    const right = rowMetrics(p.B, 700, 500, 74, 34);
    const hL = Math.min(186, Math.max(112, left.w * 2.05));
    const hR = Math.min(186, Math.max(104, right.w * (1.55 + 0.22 * cap)));
    for (let i = 0; i < p.W; i++) {
      const x = left.x + i * (left.w + left.g);
      drawFlask(x, baseline, left.w, hL, 1 - vis.pour * 0.15, 1, p.grad, vis.lines, potion, left.w >= 52 ? '1 L' : '', false);
    }
    for (let i = 0; i < p.B; i++) {
      const x = right.x + i * (right.w + right.g) + vis.ship * 180;
      ctx.globalAlpha = 1 - vis.ship * 0.85;
      drawFlask(x, baseline, right.w, hR, share * vis.pour, cap, p.grad, vis.lines, potion, right.w >= 58 ? 'bottle' : '', false);
      drawCork(x, baseline, right.w, hR, vis.ship);
      ctx.globalAlpha = 1;
    }
    if (p.W && p.B) {
      const destX = right.x + ((p.B - 1) * (right.w + right.g)) / 2 + right.w / 2;
      const srcX = left.x + (p.W - 1) * (left.w + left.g) + left.w / 2;
      drawPipe(srcX, baseline - hL + 14, destX, baseline - hR + 14, vis.pour, potion.a);
    }
  } else if (p.kind === 'merge') {
    const simp = toMixed(p.N * p.A, p.B);
    const outs = simp.w + (simp.exact ? 0 : 1);
    const left = rowMetrics(Math.min(p.N, 8), 36, 640, 70, 32);
    const right = rowMetrics(Math.max(1, outs), 740, 460, 78, 40);
    const hL = Math.min(156, left.w * 1.65);
    const hR = Math.min(186, right.w * 2);
    const shown = Math.min(p.N, 8);
    for (let i = 0; i < shown; i++) {
      const x = left.x + i * (left.w + left.g);
      const fill = (p.A / p.B) * (1 - vis.pour * 0.85);
      drawFlask(x, baseline, left.w, hL, fill, 1, p.grad, vis.lines, potion, '', true);
    }
    if (p.N > 8) text('\u00d7 ' + p.N + ' beakers', left.x + 20, top + 8, 14, '#d5f6ff', 'left', 'middle');
    else text(p.N + ' beakers', left.x, top + 4, 13, '#9ec9d6', 'left', 'middle');
    if (vis.pour < 0.2) {
      drawFlask(900, baseline, 86, hR, 0, 1, p.grad, vis.lines, potion, 'master', false);
    } else {
      for (let i = 0; i < outs; i++) {
        const x = right.x + i * (right.w + right.g) + vis.ship * 160;
        const litres = simp.exact || i < simp.w ? 1 : (simp.n / simp.d);
        ctx.globalAlpha = 1 - vis.ship * 0.85;
        drawFlask(x, baseline, right.w, hR, litres * vis.pour, 1, p.grad, vis.lines, potion, '1 L', false);
        drawCork(x, baseline, right.w, hR, vis.ship);
        ctx.globalAlpha = 1;
      }
    }
    const srcX = left.x + (shown - 1) * (left.w + left.g) + left.w / 2;
    const destX = vis.pour < 0.2 ? 943 : right.x + Math.max(0, outs - 1) * (right.w + right.g) / 2 + right.w / 2;
    drawPipe(srcX, baseline - hL + 12, destX, baseline - hR + 12, vis.pour, potion.a);
  } else {
    const cap = p.kind === 'frac' ? 1 : Math.max(1, p.W);
    const start = p.kind === 'frac' ? p.P / p.Q : p.W;
    const leftover = p.remParts / p.grad;
    const fill = start + (leftover - start) * vis.pour;
    drawFlask(70, baseline, 210, 188, fill, cap, p.grad, vis.lines, potion, p.kind === 'frac' ? 'vat' : (p.W + ' L vat'), false);
    const showPartial = p.remParts > 0;
    const ladleFill = showPartial ? p.scoopFrac * vis.pour : vis.pour;
    drawLadle(520, baseline - 132, 78, 70, ladleFill, potion, showPartial ? 'last scoop' : 'ladle');
    drawTokens([{ k: 'f', n: p.A, d: p.B }, { k: 'u', s: ' L' }], 559, baseline - 154, 18, '#ffc14a', 120);
    const nShow = Math.min(p.scoopFull, 8);
    for (let i = 0; i < nShow; i++) {
      const appear = vis.pour * p.scoopFull - i;
      if (appear <= 0) continue;
      drawLadle(700 + (i % 8) * 58, baseline - 70, 40, 44, Math.max(0, Math.min(1, appear)), potion, '');
    }
    if (vis.pour > 0.82) {
      text(p.scoopFull > 8 ? (p.scoopFull + ' full scoops, then read the last ladle') : 'Count the full scoops. Read the last ladle.', 700, top + 4, 14, '#d5f6ff', 'left', 'middle');
    } else {
      text('Vat marked. Ladle waits.', 700, top + 4, 15, '#9ec9d6', 'left', 'middle');
    }
  }

  drawChute(vis.ship);
  ctx.restore();

  const banner = GEO.banner;
  const hintOn = !!G.hint;
  panel(banner.x, banner.y, banner.w, banner.h, 12, hintOn ? 'rgba(48, 16, 72, 0.92)' : 'rgba(8, 20, 36, 0.92)', hintOn ? 'rgba(210, 140, 255, 0.8)' : 'rgba(125, 236, 255, 0.35)');
  const msg = hintOn ? G.hint : p.prompts[G.step];
  const lines = wrapLines(msg, banner.w - 280, hintOn ? 14 : 16);
  lines.forEach(function (line, i) {
    text(line, banner.x + 16, banner.y + (lines.length === 1 ? 21 : 14 + i * 16), hintOn ? 14 : 16, hintOn ? '#f0d4ff' : '#e8f7ff', 'left', 'middle');
  });
  text(roleLine(), banner.x + banner.w - 16, banner.y + 21, 13, '#ffc14a', 'right', 'middle');
}

function drawCards() {
  if (!G.problem) return;
  const rects = cardRects();
  const options = G.problem.steps[G.step].options;
  const owner = ownerOfStep();
  for (let i = 0; i < rects.length; i++) {
    const c = rects[i];
    const opt = options[i];
    const hot0 = G.players[0].sel === i && (G.mode !== 'coop' || owner === -1 || owner === 0 || G.step === 2);
    const hot1 = G.mode !== 'solo' && G.players[1].sel === i && (G.mode !== 'coop' || owner === -1 || owner === 1 || G.step === 2);
    let stroke = 'rgba(140, 190, 210, 0.35)';
    if (G.feedback === 'good' && opt && opt.correct) stroke = '#5dff9a';
    else if (G.feedback === 'bad' && opt && !opt.correct && (G.players[0].sel === i || (G.mode !== 'solo' && G.players[1].sel === i))) stroke = '#d28cff';
    else if (hot0 && hot1) stroke = '#f4fbff';
    else if (hot0) stroke = G.mode === 'solo' ? '#7af7ff' : '#ff5d6c';
    else if (hot1) stroke = '#6eb0ff';
    panel(c.x, c.y, c.w, c.h, 14, 'rgba(10, 16, 34, 0.94)', stroke);
    if (!opt) continue;
    const col = opt.correct && G.feedback === 'good' ? '#b9ffd6' : '#f4fbff';
    drawTokens(opt.hero, c.x + c.w / 2, c.y + (opt.caption ? 46 : 56), 30, col, c.w - 22);
    if (opt.caption) {
      const capLines = wrapLines(opt.caption, c.w - 20, 13);
      text(capLines[0], c.x + c.w / 2, c.y + c.h - 20, 13, '#9ec9d6', 'center', 'middle');
    }
    if (G.mode === 'coop' && G.step === 2 && opt.correct) {
      if (G.ready[0]) text('P1', c.x + 16, c.y + 16, 11, '#ff5d6c', 'left', 'middle');
      if (G.ready[1]) text('P2', c.x + c.w - 16, c.y + 16, 11, '#6eb0ff', 'right', 'middle');
    }
  }
}

function sealLabel() {
  if (!G.problem) return 'SEAL & SHIP POTIONS';
  if (G.step === 0) return 'SET GRADUATION';
  if (G.step === 1) return G.problem.kind === 'merge' ? 'MERGE THE BEAKERS' : (G.problem.kind === 'pour' ? 'OPEN THE MANIFOLD' : 'DIP THE LADLE');
  return 'SEAL & SHIP POTIONS';
}

function drawSeal() {
  const s = GEO.seal;
  const pulse = G.step === 2 ? 0.55 + 0.45 * Math.sin(G.time * 5) : 0.85;
  panel(s.x, s.y, s.w, s.h, 16, 'rgba(16, 40, 48, 0.95)', 'rgba(122, 247, 255, ' + pulse + ')');
  text(sealLabel(), s.x + s.w / 2, s.y + 22, 18, '#e8f7ff', 'center', 'middle');
  const sub = G.note && performance.now() < G.noteUntil ? G.note : 'SPACE  ·  ENTER  ·  CLICK  ·  8BITDO A';
  text(sub, s.x + s.w / 2, s.y + 42, 12, '#9ec9d6', 'center', 'middle');
}

function drawReticle(x, y, color, label) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-22, 0);
  ctx.lineTo(-8, 0);
  ctx.moveTo(8, 0);
  ctx.lineTo(22, 0);
  ctx.moveTo(0, -22);
  ctx.lineTo(0, -8);
  ctx.moveTo(0, 8);
  ctx.lineTo(0, 22);
  ctx.stroke();
  ctx.restore();
  if (label) text(label, x, y - 28, 12, color, 'center', 'middle');
}

function drawReticles() {
  if (G.phase !== 'play') return;
  const rects = cardRects();
  const count = G.mode === 'solo' ? 1 : 2;
  const colors = G.mode === 'solo' ? ['#7af7ff'] : ['#ff5d6c', '#6eb0ff'];
  const names = G.mode === 'solo' ? [''] : ['P1', 'P2'];
  for (let i = 0; i < count; i++) {
    const p = G.players[i];
    const hovered = (G.mode === 'solo' && mouse.on) ? rects.find(function (c) { return inside(mouse.x, mouse.y, c); }) : null;
    const c = hovered || rects[p.sel];
    let tx;
    let ty;
    if (c && (hovered || G.mode !== 'solo' || !mouse.on)) {
      tx = (i === 1 ? c.x + 26 : c.x + c.w - 26);
      ty = c.y + 18;
    } else {
      tx = mouse.x;
      ty = mouse.y;
    }
    p.x += (tx - p.x) * 0.35;
    p.y += (ty - p.y) * 0.35;
    const owner = ownerOfStep();
    const dim = G.mode === 'coop' && owner !== -1 && owner !== i;
    ctx.globalAlpha = dim ? 0.4 : 1;
    drawReticle(p.x, p.y, colors[i], names[i]);
    ctx.globalAlpha = 1;
  }
}

function drawFloaters() {
  for (let i = 0; i < G.floaters.length; i++) {
    const f = G.floaters[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    text(f.text, f.x, f.y, 28, f.color, 'center', 'middle');
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < G.sparks.length; i++) {
    const s = G.sparks[i];
    ctx.globalAlpha = Math.max(0, 1 - s.age / s.life);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTitle() {
  text('PRIMARY 5  ·  PRIMARY 6', 640, 118, 14, '#7af7ff', 'center', 'middle');
  text('CRYSTAL POTION BOTTLER', 640, 164, 46, '#f4fbff', 'center', 'middle');
  text('LIQUID MEASURE LAB', 640, 214, 22, '#ff7ae0', 'center', 'middle');
  text('Division   ·   Fraction   ·   Multiplication', 640, 268, 16, '#ffc14a', 'center', 'middle');

  const cards = [
    { t: 'SOLO ALCHEMIST', d: 'Mouse, keyboard, or one 8BitDo.\n3 lab shields. One score.', c: '#7af7ff' },
    { t: '2P CO-OP TEAM', d: 'Share the valves. One team score.\n4 shared shields. No solo stars.', c: '#c6ff4a' },
    { t: '2P VERSUS', d: 'Same order, first lock wins.\nShields and Master Alchemist stars.', c: '#ff7ae0' },
  ];
  const rects = titleRects();
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    const on = G.titleSel === i;
    panel(r.x, r.y, r.w, r.h, 18, 'rgba(8, 14, 30, 0.92)', on ? cards[i].c : 'rgba(140, 180, 200, 0.3)');
    text(cards[i].t, r.x + r.w / 2, r.y + 48, 20, cards[i].c, 'center', 'middle');
    const lines = cards[i].d.split('\n');
    lines.forEach(function (line, li) {
      text(line, r.x + r.w / 2, r.y + 100 + li * 26, 15, '#d5eaf2', 'center', 'middle');
    });
    text(on ? 'PRESS A  ·  ENTER' : 'SELECT', r.x + r.w / 2, r.y + 190, 14, on ? '#ffffff' : '#8fb4c4', 'center', 'middle');
  }
  text('SOLO    mouse hover + click    ·    WASD or arrows    ·    Space / Enter    ·    Pad 0  A', 640, 590, 14, '#c5e4ee', 'center', 'middle');
  text('CO-OP & VERSUS    P1  WASD + F / Space or Pad 0     ·     P2  Arrows + Enter or Pad 1', 640, 616, 14, '#c5e4ee', 'center', 'middle');
  text('M mute    ·    Esc pause    ·    best solo ' + comma(G.bestSolo) + '    ·    best team ' + comma(G.bestCoop), 640, 648, 14, '#8fb4c4', 'center', 'middle');
  if (G.padNote) text(G.padNote, 640, 678, 13, '#7af7ff', 'center', 'middle');
}

function drawOverlay(title, sub, buttons) {
  ctx.fillStyle = 'rgba(4, 6, 16, 0.62)';
  ctx.fillRect(0, 0, GEO.W, GEO.H);
  panel(300, 160, 680, 380, 20);
  text(title, 640, 230, 32, '#f4fbff', 'center', 'middle');
  const lines = wrapLines(sub, 600, 16);
  lines.forEach(function (line, i) {
    text(line, 640, 290 + i * 24, 16, '#d5eaf2', 'center', 'middle');
  });
  buttons.forEach(function (b) {
    panel(b.x, b.y, b.w, b.h, 14, 'rgba(10, 24, 40, 0.95)', '#7af7ff');
    text(b.label, b.x + b.w / 2, b.y + b.h / 2, 16, '#e8f7ff', 'center', 'middle');
  });
}

function drawOver() {
  const val = G.mode === 'versus' ? Math.max(G.scores[0], G.scores[1]) : G.score;
  let sub = G.overReason + '  Score ' + comma(val) + '.';
  if (G.mode === 'versus') sub += '  Stars ' + G.stars[0] + ' – ' + G.stars[1] + '.';
  drawOverlay('LAB PRESSURE LOST', sub, [
    { x: 360, y: 430, w: 250, h: 64, label: 'BREW AGAIN' },
    { x: 670, y: 430, w: 250, h: 64, label: 'TITLE' },
  ]);
}

function drawPause() {
  drawOverlay('VALVES PAUSED', 'The batch is waiting on the bench.', [
    { x: 440, y: 300, w: 400, h: 64, label: 'RESUME' },
    { x: 440, y: 384, w: 400, h: 64, label: 'RETURN TO TITLE' },
  ]);
}

function draw() {
  applyView();
  drawBackground();
  if (G.phase === 'title') {
    drawHUD();
    drawTitle();
    return;
  }
  drawHUD();
  drawTicket();
  drawScene();
  drawCards();
  drawSeal();
  drawReticles();
  drawFloaters();
  if (G.phase === 'over') drawOver();
  if (G.phase === 'pause') drawPause();
}

function update(dt) {
  G.time += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 28);
  for (let i = G.floaters.length - 1; i >= 0; i--) {
    const f = G.floaters[i];
    f.y += f.vy * dt;
    f.life -= dt;
    if (f.life <= 0) G.floaters.splice(i, 1);
  }
  for (let i = G.sparks.length - 1; i >= 0; i--) {
    const s = G.sparks[i];
    s.age += dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 40 * dt;
    if (s.age >= s.life) G.sparks.splice(i, 1);
  }
  if (G.phase === 'pause') return;
  if (G.feedbackLeft > 0) {
    G.feedbackLeft -= dt * 1000;
    if (G.feedbackLeft <= 0) finishFeedback();
  }
}

let last = 0;
function frame(now) {
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016);
  last = now;
  pollPads();
  repeatKeys();
  pumpMusic();
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

function boot() {
  G.bestSolo = Number(readStore(BEST_SOLO) || 0) || 0;
  G.bestCoop = Number(readStore(BEST_COOP) || 0) || 0;
  G.auditErrors = audit();
  if (G.auditErrors.length) console.error('Crystal Potion Bottler audit', G.auditErrors);
  resize();
  canvas.focus();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
document.addEventListener('keydown', onKeyDown);
document.addEventListener('keyup', onKeyUp);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('gamepadconnected', function (e) {
  G.padNote = '8BitDo ' + (e.gamepad.index + 1) + ' linked · D-pad moves · A confirms';
});
window.addEventListener('gamepaddisconnected', function (e) {
  G.padNote = '8BitDo ' + (e.gamepad.index + 1) + ' disconnected';
});

window.__CPB = { G: G, audit: audit, buildSpec: buildSpec, DOMAINS: DOMAINS, submit: submit, cardRects: cardRects, beginGame: beginGame };

boot();
</script>
