<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Croc River Crossing: Number Line Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1b3a2f;
      --panel: #fff8e7;
      --gold: #ffd54f;
      --mint: #26a69a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Fredoka', system-ui, sans-serif;
      background: linear-gradient(180deg, #7ec8e8, #c8e9f5 40%, #a5d6a7 100%);
      color: var(--ink);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 8px;
      gap: 8px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255,248,231,0.92);
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 8px 12px;
      box-shadow: 0 4px 0 rgba(27,58,47,0.15);
    }
    h1 {
      font-size: clamp(0.95rem, 3vw, 1.35rem);
      font-weight: 700;
      line-height: 1.15;
    }
    .hud-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .stat {
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 4px 12px;
      font-weight: 600;
      font-size: 0.9rem;
      min-width: 4.5rem;
      text-align: center;
    }
    .stat.timer { background: var(--gold); min-width: 5.5rem; }
    .stat.timer.warn { background: #ffab91; animation: pulse 0.6s ease infinite; }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    .icon-btn {
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: #fff;
      padding: 6px 10px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(27,58,47,0.2);
    }
    .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(27,58,47,0.2); }
    #stageWrap {
      position: relative;
      flex: 1;
      min-height: 220px;
      border: 3px solid var(--ink);
      border-radius: 18px;
      overflow: hidden;
      background: #5dade2;
      box-shadow: 0 6px 0 rgba(27,58,47,0.12);
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hintBubble {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      max-width: 92%;
      background: #fffde7;
      border: 3px solid var(--ink);
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 0 rgba(27,58,47,0.15);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 5;
      text-align: center;
    }
    #hintBubble.show { opacity: 1; }
    #controls {
      background: rgba(255,248,231,0.95);
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    #promptRow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #promptText { font-size: 0.95rem; font-weight: 600; }
    #answerDisplay {
      min-width: 8rem;
      background: #fff;
      border: 3px dashed var(--ink);
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.02em;
      min-height: 2.4rem;
    }
    #keypad {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .key {
      min-height: 44px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: #fff;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(27,58,47,0.18);
      user-select: none;
    }
    .key:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(27,58,47,0.18); }
    .key.wide { grid-column: span 2; }
    .key.action { background: var(--mint); color: #fff; }
    .key.danger { background: #ffcdd2; }
    .key.accent { background: var(--gold); }
    #overlay, #startOverlay {
      position: absolute;
      inset: 0;
      background: rgba(27,58,47,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 16px;
    }
    #overlay.hidden, #startOverlay.hidden { display: none; }
    .modal {
      background: var(--panel);
      border: 4px solid var(--ink);
      border-radius: 20px;
      padding: 22px 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 0 rgba(27,58,47,0.25);
    }
    .modal h2 { font-size: 1.6rem; margin-bottom: 8px; }
    .modal p { margin: 6px 0; font-weight: 500; }
    .modal .big { font-size: 1.25rem; font-weight: 700; color: var(--mint); }
    .modal button {
      margin-top: 14px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--gold);
      font: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 10px 22px;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(27,58,47,0.2);
    }
    .modal button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(27,58,47,0.2); }
    @media (max-height: 700px) {
      #keypad .key { min-height: 38px; font-size: 1rem; }
      h1 { font-size: 0.95rem; }
    }
    @media (max-width: 480px) {
      #keypad { grid-template-columns: repeat(5, 1fr); }
      .key.wide { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>🐊 Croc River Crossing</h1>
      <div class="hud-stats">
        <div class="stat timer" id="timerStat" aria-live="polite">⏱ 60</div>
        <div class="stat" id="scoreStat">⭐ 0</div>
        <div class="stat" id="clearedStat">🪵 0</div>
        <button type="button" class="icon-btn" id="muteBtn" aria-pressed="false">🔊 Sound</button>
      </div>
    </header>

    <div id="stageWrap">
      <canvas id="gameCanvas" width="900" height="420" aria-label="Number line river game"></canvas>
      <div id="hintBubble" role="status"></div>
      <div id="startOverlay">
        <div class="modal">
          <h2>Number Line Adventure!</h2>
          <p>Hop across the river by naming the glowing log.</p>
          <p>Fractions &amp; decimals · 60 seconds · Watch out for crocs!</p>
          <button type="button" id="startBtn">Start Crossing!</button>
        </div>
      </div>
      <div id="overlay" class="hidden">
        <div class="modal">
          <h2>Time&apos;s Up!</h2>
          <p class="big" id="finalLogs">Logs cleared: 0</p>
          <p id="finalScore">Score: 0</p>
          <p id="finalAcc">Accuracy: 0%</p>
          <button type="button" id="againBtn">Play Again</button>
        </div>
      </div>
    </div>

    <div id="controls">
      <div id="promptRow">
        <div id="promptText">Name the glowing log!</div>
        <div id="answerDisplay" aria-live="polite"></div>
      </div>
      <div id="keypad" role="group" aria-label="Answer keypad">
        <button type="button" class="key" data-k="1">1</button>
        <button type="button" class="key" data-k="2">2</button>
        <button type="button" class="key" data-k="3">3</button>
        <button type="button" class="key" data-k="4">4</button>
        <button type="button" class="key" data-k="5">5</button>
        <button type="button" class="key" data-k="6">6</button>
        <button type="button" class="key" data-k="7">7</button>
        <button type="button" class="key" data-k="8">8</button>
        <button type="button" class="key" data-k="9">9</button>
        <button type="button" class="key" data-k="0">0</button>
        <button type="button" class="key accent" data-k=".">.</button>
        <button type="button" class="key accent" data-k="/">/</button>
        <button type="button" class="key danger wide" data-k="clear">Clear</button>
        <button type="button" class="key" data-k="back">⌫</button>
        <button type="button" class="key action wide" data-k="submit">Hop! ✓</button>
      </div>
    </div>
  </div>

  <script>
(function () {
  'use strict';

  function gcd(a, b) {
    a = Math.abs(a | 0); b = Math.abs(b | 0);
    while (b) { const t = b; b = a % b; a = t; }
    return a || 1;
  }
  function simplifyFrac(n, d) {
    if (d === 0) return { n: 0, d: 1 };
    if (d < 0) { n = -n; d = -d; }
    if (n === 0) return { n: 0, d: 1 };
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  function randInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }
  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }
  function roundDec(x, places) {
    const f = Math.pow(10, places);
    return Math.round(x * f) / f;
  }
  function decStr(x, places) {
    return roundDec(x, places).toFixed(places);
  }

  function placesForStep(step) {
    const s = roundDec(step, 8).toFixed(8).replace(/0+$/, '');
    const dot = s.indexOf('.');
    return dot < 0 ? 0 : s.length - dot - 1;
  }
  function formatStep(step) {
    const p = Math.max(1, placesForStep(step));
    return parseFloat(step.toFixed(p)).toString();
  }
  function formatDecLabel(v, places) {
    const r = roundDec(v, Math.max(0, places));
    if (Number.isInteger(roundDec(r, 6))) return String(Math.round(r));
    let s = r.toFixed(Math.max(1, places));
    s = s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
    return s;
  }

  /* ========== NUMBER LINE GENERATORS ========== */
  function generateFractionLine() {
    const d = pick([4, 5, 6, 7, 8, 9, 10]);
    const units = Math.random() < 0.55 ? 2 : (Math.random() < 0.5 ? 1 : 3);
    const startUnit = Math.random() < 0.25 && units >= 2 ? 1 : 0;
    const startTick = startUnit * d;
    const endTick = startTick + units * d;
    const ticks = [];
    for (let i = startTick; i <= endTick; i++) {
      ticks.push({ index: i, n: i, d: d });
    }
    const anchors = new Set();
    anchors.add(startTick);
    if (startTick === 0 && d >= 4) anchors.add(1);
    for (let u = Math.ceil(startTick / d); u <= Math.floor(endTick / d); u++) {
      anchors.add(u * d);
    }
    anchors.add(endTick);

    const candidates = ticks.map((t) => t.index).filter((i) => !anchors.has(i));
    let targetIndex = pick(candidates.length ? candidates : ticks.map((t) => t.index));
    if (candidates.length > 3 && Math.random() < 0.5) {
      targetIndex = candidates[Math.floor(candidates.length * (0.3 + Math.random() * 0.4))];
    }

    const raw = { n: targetIndex, d: d };
    const simplest = simplifyFrac(targetIndex, d);
    const requireSimplest = simplest.d !== d && Math.random() < 0.65;

    const labels = {};
    anchors.forEach((i) => {
      labels[i] = i === 0 ? '0' : i + '/' + d;
    });

    let hint = 'Count the equal ticks. Each tick is 1/' + d + '.';
    if (startTick > 0) {
      hint = 'This line starts at ' + startTick + '/' + d + '. Count ticks of 1/' + d + '!';
    }
    if (requireSimplest) hint += ' Write your answer in simplest form.';

    return {
      type: 'fraction',
      denom: d,
      startTick,
      endTick,
      ticks,
      anchors,
      labels,
      targetIndex,
      answer: requireSimplest ? simplest : raw,
      requireSimplest,
      stepLabel: '1/' + d,
      hint,
      prompt: requireSimplest
        ? 'What fraction is on the glowing log? (simplest form)'
        : 'What fraction is on the glowing log?',
    };
  }

  function buildDecimalLine(start, majorGap, subdivs, majors, subtype) {
    const minorStep = majorGap / subdivs;
    const places = Math.max(1, placesForStep(minorStep));
    const spans = majors - 1;
    const totalMinors = spans * subdivs;
    const ticks = [];
    for (let i = 0; i <= totalMinors; i++) {
      ticks.push({ index: i, value: roundDec(start + i * minorStep, places) });
    }
    const anchors = new Set();
    const labels = {};
    const labelPlaces = Math.min(places, Math.max(1, placesForStep(majorGap)));
    for (let m = 0; m < majors; m++) {
      const idx = m * subdivs;
      anchors.add(idx);
      labels[idx] = formatDecLabel(ticks[idx].value, labelPlaces);
    }

    const candidates = [];
    for (let i = 1; i < ticks.length - 1; i++) {
      if (!anchors.has(i)) candidates.push(i);
    }
    const targetIndex = pick(candidates);
    const stepStr = formatStep(minorStep);
    const a0 = labels[0];
    const a1 = labels[subdivs];

    return {
      type: 'decimal',
      subtype,
      ticks,
      anchors,
      labels,
      targetIndex,
      answer: ticks[targetIndex].value,
      places,
      step: minorStep,
      subdivs,
      majorGap,
      stepLabel: stepStr,
      hint:
        'Count the equal ticks between ' + a0 + ' and ' + a1 +
        ' — there are ' + subdivs + ' steps. Each tick is ' + stepStr + '!',
      prompt: 'What decimal is on the glowing log?',
    };
  }

  function generateDecimalHundredths() {
    // 2→0.05, 5→0.02, 10→0.01 — not always 10
    const subdivs = pick([2, 2, 5, 5, 5, 10, 10, 10]);
    const majorGap = 0.1;
    const majors = pick([2, 3, 3]);
    const startTenths = randInt(10, 90 - (majors - 1));
    const start = startTenths / 10;
    return buildDecimalLine(start, majorGap, subdivs, majors, 'hundredths');
  }

  function generateDecimalThousandths() {
    // 2→0.005, 5→0.002, 10→0.001
    const subdivs = pick([2, 2, 5, 5, 5, 10, 10, 10]);
    const majorGap = 0.01;
    const majors = pick([2, 3, 3]);
    let start;
    if (Math.random() < 0.35) {
      start = roundDec(randInt(2, 12) + 0.99, 2);
    } else {
      const style = Math.random();
      if (style < 0.35) start = randInt(2, 9);
      else if (style < 0.65) start = roundDec(randInt(20, 90) / 10, 1);
      else start = roundDec(randInt(200, 950) / 100, 2);
    }
    const puzzle = buildDecimalLine(start, majorGap, subdivs, majors, 'thousandths');
    puzzle.prompt = 'What decimal is on the glowing log? (look carefully!)';
    return puzzle;
  }

  function generatePuzzle() {
    const r = Math.random();
    if (r < 0.4) return generateFractionLine();
    if (r < 0.7) return generateDecimalHundredths();
    return generateDecimalThousandths();
  }

  /* ========== ANSWER CHECKING ========== */
  function parseStudentAnswer(raw, puzzle) {
    const s = String(raw).trim().replace(/\s+/g, '');
    if (!s) return { ok: false };

    if (puzzle.type === 'fraction') {
      const m = s.match(/^(-?\d+)\/(-?\d+)$/);
      if (m) {
        const n = parseInt(m[1], 10);
        const d = parseInt(m[2], 10);
        if (d === 0) return { ok: false };
        return { ok: true, n, d, simplest: simplifyFrac(n, d) };
      }
      if (/^-?\d+$/.test(s)) {
        const n = parseInt(s, 10);
        return { ok: true, n, d: 1, simplest: { n, d: 1 } };
      }
      return { ok: false };
    }

    if (!/^-?\d*\.?\d+$/.test(s) || s === '.' || s === '-.') return { ok: false };
    const v = parseFloat(s);
    if (!Number.isFinite(v)) return { ok: false };
    return { ok: true, value: v };
  }

  function checkAnswer(raw, puzzle) {
    const parsed = parseStudentAnswer(raw, puzzle);
    if (!parsed.ok) return { correct: false, reason: 'format' };

    if (puzzle.type === 'fraction') {
      const ans = puzzle.answer;
      const eq = parsed.n * ans.d === ans.n * parsed.d;
      if (!eq) return { correct: false, reason: 'wrong' };
      if (puzzle.requireSimplest) {
        const s = parsed.simplest;
        if (s.n !== ans.n || s.d !== ans.d) {
          return { correct: false, reason: 'simplify' };
        }
      }
      return { correct: true };
    }

    const tol = puzzle.places >= 3 ? 0.0005 : 0.005;
    const a = roundDec(parsed.value, puzzle.places);
    const b = roundDec(puzzle.answer, puzzle.places);
    if (a === b || Math.abs(parsed.value - puzzle.answer) < tol) return { correct: true };
    return { correct: false, reason: 'wrong' };
  }

  /* ========== AUDIO ========== */
  const AudioFX = {
    ctx: null,
    muted: false,
    musicTimer: null,
    musicStep: 0,
    ensure() {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },
    tone(freq, dur, type, gain, when) {
      if (this.muted) return;
      const ctx = this.ensure();
      const t0 = when != null ? when : ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.08, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    },
    hop() {
      if (this.muted) return;
      const ctx = this.ensure();
      const t0 = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(280, t0);
      o.frequency.exponentialRampToValueAtTime(720, t0 + 0.14);
      g.gain.setValueAtTime(0.12, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.18);
    },
    splash() {
      if (this.muted) return;
      const ctx = this.ensure();
      const t0 = ctx.currentTime;
      const n = Math.floor(ctx.sampleRate * 0.18);
      const buffer = ctx.createBuffer(1, n, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 900;
      bp.Q.value = 0.8;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.18, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      src.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start(t0); src.stop(t0 + 0.22);
    },
    correct() {
      const t = this.ensure().currentTime;
      this.tone(523, 0.1, 'triangle', 0.1, t);
      this.tone(659, 0.12, 'triangle', 0.09, t + 0.09);
      this.tone(784, 0.16, 'triangle', 0.08, t + 0.18);
    },
    wrong() {
      const t = this.ensure().currentTime;
      this.tone(180, 0.18, 'sawtooth', 0.06, t);
      this.tone(140, 0.2, 'square', 0.05, t + 0.1);
    },
    startMusic() {
      this.stopMusic();
      if (this.muted) return;
      this.ensure();
      const scale = [262, 294, 330, 392, 440, 392, 330, 294];
      const bass = [131, 147, 165, 196];
      this.musicStep = 0;
      this.musicTimer = setInterval(() => {
        if (this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        this.tone(scale[this.musicStep % scale.length], 0.16, 'square', 0.035, t);
        if (this.musicStep % 2 === 0) {
          this.tone(bass[(this.musicStep / 2) % bass.length], 0.28, 'triangle', 0.03, t);
        }
        this.musicStep++;
      }, 280);
    },
    stopMusic() {
      if (this.musicTimer) {
        clearInterval(this.musicTimer);
        this.musicTimer = null;
      }
    },
  };

  /* ========== DOM / STATE ========== */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const els = {
    timer: document.getElementById('timerStat'),
    score: document.getElementById('scoreStat'),
    cleared: document.getElementById('clearedStat'),
    mute: document.getElementById('muteBtn'),
    hint: document.getElementById('hintBubble'),
    prompt: document.getElementById('promptText'),
    answer: document.getElementById('answerDisplay'),
    overlay: document.getElementById('overlay'),
    start: document.getElementById('startOverlay'),
    startBtn: document.getElementById('startBtn'),
    againBtn: document.getElementById('againBtn'),
    finalLogs: document.getElementById('finalLogs'),
    finalScore: document.getElementById('finalScore'),
    finalAcc: document.getElementById('finalAcc'),
    keypad: document.getElementById('keypad'),
  };

  const state = {
    running: false,
    timeLeft: 60,
    score: 0,
    cleared: 0,
    attempts: 0,
    correctCount: 0,
    input: '',
    puzzle: null,
    phase: 'idle',
    anim: 0,
    playerX: 0,
    playerY: 0,
    wobble: 0,
    crocs: [],
    lastTs: 0,
    timerAcc: 0,
    hintTimer: 0,
  };

  function resizeCanvas() {
    const wrap = document.getElementById('stageWrap');
    const rect = wrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = Math.max(1, rect.width);
    const cssH = Math.max(1, rect.height);
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
  }

  function layoutMetrics() {
    const w = canvas.clientWidth || 900;
    const h = canvas.clientHeight || 420;
    return {
      w, h,
      bankW: Math.max(70, w * 0.11),
      riverY: h * 0.42,
      riverH: h * 0.38,
      logY: h * 0.48,
    };
  }

  function spawnCrocs(L) {
    const crocs = [];
    const n = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < n; i++) {
      crocs.push({
        x: L.bankW + 40 + Math.random() * (L.w - 2 * L.bankW - 80),
        y: L.riverY + L.riverH * (0.55 + Math.random() * 0.3),
        dir: Math.random() < 0.5 ? 1 : -1,
        speed: 12 + Math.random() * 22,
        blink: Math.random() * 4,
        snout: Math.random() * Math.PI * 2,
        happy: false,
      });
    }
    return crocs;
  }

  function newRound() {
    state.puzzle = generatePuzzle();
    state.input = '';
    state.phase = 'playing';
    state.anim = 0;
    state.wobble = 0;
    const L = layoutMetrics();
    state.playerX = L.bankW * 0.45;
    state.playerY = L.logY - 8;
    state.crocs = spawnCrocs(L);
    els.prompt.textContent = state.puzzle.prompt;
    updateAnswerDisplay();
    hideHint();
  }

  function updateHUD() {
    els.timer.textContent = '⏱ ' + Math.ceil(Math.max(0, state.timeLeft));
    els.timer.classList.toggle('warn', state.running && state.timeLeft <= 10);
    els.score.textContent = '⭐ ' + state.score;
    els.cleared.textContent = '🪵 ' + state.cleared;
  }

  function updateAnswerDisplay() {
    els.answer.textContent = state.input || '…';
  }

  function showHint(msg, ms) {
    els.hint.textContent = msg;
    els.hint.classList.add('show');
    state.hintTimer = ms || 2800;
  }
  function hideHint() {
    els.hint.classList.remove('show');
    state.hintTimer = 0;
  }

  function submitAnswer() {
    if (!state.running || state.phase !== 'playing') return;
    state.attempts++;
    const result = checkAnswer(state.input, state.puzzle);
    if (result.correct) {
      state.correctCount++;
      state.cleared++;
      state.score += 100;
      state.phase = 'success';
      state.anim = 0;
      AudioFX.hop();
      setTimeout(function () { AudioFX.correct(); }, 120);
      setTimeout(function () { AudioFX.splash(); }, 400);
      updateHUD();
    } else {
      state.phase = 'fail';
      state.anim = 0;
      state.wobble = 1;
      state.timeLeft = Math.max(0, state.timeLeft - 3);
      AudioFX.wrong();
      AudioFX.splash();
      let msg = state.puzzle.hint;
      if (result.reason === 'simplify') {
        msg = 'Almost! Simplify your fraction (divide top and bottom by the same number).';
      } else if (result.reason === 'format') {
        msg = state.puzzle.type === 'fraction'
          ? 'Type a fraction like 5/7 or 10/7'
          : 'Type a decimal like 2.51 or 3.013';
      }
      showHint(msg, 3200);
      updateHUD();
    }
  }

  function endGame() {
    state.running = false;
    state.phase = 'idle';
    AudioFX.stopMusic();
    const acc = state.attempts ? Math.round((state.correctCount / state.attempts) * 100) : 0;
    els.finalLogs.textContent = 'Logs cleared: ' + state.cleared;
    els.finalScore.textContent = 'Score: ' + state.score;
    els.finalAcc.textContent = 'Accuracy: ' + acc + '%';
    els.overlay.classList.remove('hidden');
  }

  function startGame() {
    state.timeLeft = 60;
    state.score = 0;
    state.cleared = 0;
    state.attempts = 0;
    state.correctCount = 0;
    state.running = true;
    els.overlay.classList.add('hidden');
    els.start.classList.add('hidden');
    AudioFX.ensure();
    AudioFX.startMusic();
    newRound();
    updateHUD();
  }

  /* ========== DRAWING ========== */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(x, y, 16 * s, 0, Math.PI * 2);
    ctx.arc(x + 18 * s, y - 6 * s, 20 * s, 0, Math.PI * 2);
    ctx.arc(x + 38 * s, y, 14 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSky(L, t) {
    const g = ctx.createLinearGradient(0, 0, 0, L.h);
    g.addColorStop(0, '#7ec8e8');
    g.addColorStop(0.55, '#b3e5fc');
    g.addColorStop(1, '#81c784');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, L.w, L.h);
    ctx.beginPath();
    ctx.fillStyle = '#ffe082';
    ctx.arc(L.w - 50, 36, 22, 0, Math.PI * 2);
    ctx.fill();
    drawCloud(80 + Math.sin(t * 0.15) * 10, 40, 1);
    drawCloud(L.w * 0.4, 28 + Math.cos(t * 0.2) * 4, 0.85);
  }

  function drawBanks(L) {
    ctx.fillStyle = '#66bb6a';
    ctx.beginPath();
    ctx.moveTo(0, L.riverY - 20);
    ctx.quadraticCurveTo(L.bankW * 0.6, L.riverY - 40, L.bankW, L.riverY);
    ctx.lineTo(L.bankW, L.h);
    ctx.lineTo(0, L.h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#43a047';
    for (let i = 0; i < 8; i++) {
      const gx = 10 + i * (L.bankW / 8);
      const gy = L.riverY - 10 + (i % 3) * 8;
      ctx.beginPath();
      ctx.moveTo(gx, gy + 18);
      ctx.lineTo(gx + 4, gy);
      ctx.lineTo(gx + 8, gy + 18);
      ctx.fill();
    }

    ctx.fillStyle = '#66bb6a';
    ctx.beginPath();
    ctx.moveTo(L.w - L.bankW, L.riverY);
    ctx.quadraticCurveTo(L.w - L.bankW * 0.4, L.riverY - 45, L.w, L.riverY - 25);
    ctx.lineTo(L.w, L.h);
    ctx.lineTo(L.w - L.bankW, L.h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ef5350';
    ctx.fillRect(L.w - L.bankW * 0.55, L.riverY - 70, 4, 55);
    ctx.beginPath();
    ctx.moveTo(L.w - L.bankW * 0.55 + 4, L.riverY - 70);
    ctx.lineTo(L.w - L.bankW * 0.55 + 28, L.riverY - 58);
    ctx.lineTo(L.w - L.bankW * 0.55 + 4, L.riverY - 46);
    ctx.fill();
    ctx.fillStyle = '#1b3a2f';
    ctx.font = 'bold 11px Fredoka, sans-serif';
    ctx.fillText('GOAL', L.w - L.bankW * 0.7, L.riverY - 78);
  }

  function drawRiver(L, t) {
    const g = ctx.createLinearGradient(0, L.riverY, 0, L.riverY + L.riverH);
    g.addColorStop(0, '#4fc3f7');
    g.addColorStop(0.5, '#0288d1');
    g.addColorStop(1, '#01579b');
    ctx.fillStyle = g;
    ctx.fillRect(L.bankW - 8, L.riverY, L.w - 2 * L.bankW + 16, L.riverH + 40);

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const y = L.riverY + 20 + i * 18;
      ctx.beginPath();
      for (let x = L.bankW; x < L.w - L.bankW; x += 8) {
        const yy = y + Math.sin(x * 0.04 + t * 2.2 + i) * 3;
        if (x === L.bankW) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
  }

  function logPositions(puzzle, L) {
    const n = puzzle.ticks.length;
    const innerW = L.w - 2 * L.bankW - 20;
    const spacing = innerW / Math.max(n - 1, 1);
    const positions = [];
    for (let i = 0; i < n; i++) {
      positions.push({ x: L.bankW + 10 + i * spacing, y: L.logY, i: i });
    }
    return positions;
  }

  function drawNumberLineGuide(puzzle, positions, L) {
    if (!positions.length) return;
    const x0 = positions[0].x - 14;
    const x1 = positions[positions.length - 1].x + 14;
    const railY = L.logY + 20;

    // Sand ruler — high contrast vs blue water
    ctx.fillStyle = 'rgba(255, 236, 179, 0.95)';
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 3;
    roundRect(x0, railY - 6, x1 - x0, 38, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    roundRect(x0 + 4, railY - 2, x1 - x0 - 8, 8, 4);
    ctx.fill();

    ctx.lineCap = 'round';
    ctx.strokeStyle = '#fff8e1';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(positions[0].x, railY + 10);
    ctx.lineTo(positions[positions.length - 1].x, railY + 10);
    ctx.stroke();
    ctx.strokeStyle = '#bf360c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(positions[0].x, railY + 10);
    ctx.lineTo(positions[positions.length - 1].x, railY + 10);
    ctx.stroke();

    positions.forEach(function (p, i) {
      const tick = puzzle.ticks[i];
      const isAnchor = puzzle.type === 'fraction'
        ? puzzle.anchors.has(tick.index)
        : puzzle.anchors.has(i);
      const tall = isAnchor;
      ctx.strokeStyle = '#fffde7';
      ctx.lineWidth = tall ? 5 : 4;
      ctx.beginPath();
      ctx.moveTo(p.x, railY + 10);
      ctx.lineTo(p.x, railY + (tall ? 26 : 20));
      ctx.stroke();
      ctx.strokeStyle = tall ? '#f9a825' : '#4e342e';
      ctx.lineWidth = tall ? 3 : 2;
      ctx.beginPath();
      ctx.moveTo(p.x, railY + 10);
      ctx.lineTo(p.x, railY + (tall ? 26 : 20));
      ctx.stroke();
    });
  }

  function drawLog(x, y, label, isTarget, sink, wobble, t) {
    const sinkY = sink * 40;
    const wob = wobble ? Math.sin(t * 25) * 4 : 0;
    ctx.save();
    ctx.translate(x + wob, y + sinkY);
    if (sink > 0) ctx.globalAlpha = Math.max(0, 1 - sink);

    if (isTarget && sink < 0.2) {
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255, 213, 79, ' + (0.35 + 0.2 * Math.sin(t * 6)) + ')';
      ctx.ellipse(0, 8, 28, 16, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = isTarget ? '#8d6e63' : '#a1887f';
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 6, 18, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#6d4c41';
    ctx.beginPath();
    ctx.ellipse(-6, 4, 3, 2, 0, 0, Math.PI * 2);
    ctx.ellipse(5, 7, 2.5, 1.8, 0, 0, Math.PI * 2);
    ctx.fill();

    if (isTarget) {
      ctx.fillStyle = '#fffde7';
      ctx.strokeStyle = '#f9a825';
      ctx.lineWidth = 3;
      roundRect(-22, -48, 44, 28, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#f9a825';
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.lineTo(-8, -10);
      ctx.lineTo(8, -10);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#5d4037';
      ctx.font = 'bold 16px Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', 0, -34);
    } else if (label != null) {
      ctx.fillStyle = '#fff8e1';
      ctx.strokeStyle = '#5d4037';
      ctx.lineWidth = 2;
      const tw = Math.max(30, String(label).length * 9);
      roundRect(-tw / 2, -34, tw, 22, 5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#3e2723';
      ctx.font = 'bold 12px Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 0, -23);
    }

    ctx.restore();
  }

  function drawCroc(c, t) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.dir, 1);
    ctx.translate(0, Math.sin(t * 3 + c.snout) * 2);

    ctx.fillStyle = c.happy ? '#81c784' : '#43a047';
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2e7d32';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.arc(i * 8, -8, 4, Math.PI, 0);
      ctx.fill();
    }
    const snoutWiggle = Math.sin(t * 4 + c.snout) * 2;
    ctx.fillStyle = '#66bb6a';
    ctx.beginPath();
    ctx.ellipse(26 + snoutWiggle, 2, 16, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    c.blink += 0.016;
    const lid = (c.blink % 4) > 3.7 ? 0.15 : 1;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(10, -8, 5, 5 * lid, 0, 0, Math.PI * 2);
    ctx.fill();
    if (lid > 0.5) {
      ctx.fillStyle = '#1b3a2f';
      ctx.beginPath();
      ctx.arc(11, -8, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = '#1b3a2f';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (c.happy) ctx.arc(28, 4, 6, 0.1, Math.PI - 0.1);
    else ctx.arc(28, 6, 6, Math.PI + 0.2, -0.2);
    ctx.stroke();
    ctx.restore();
  }

  function drawFrog(x, y, hop, celebrating) {
    ctx.save();
    const hopY = -Math.sin(Math.min(hop, 1) * Math.PI) * 55;
    const squash = hop > 0 && hop < 1 ? 1 - Math.sin(hop * Math.PI) * 0.15 : 1;
    ctx.translate(x, y + hopY);
    ctx.scale(1, squash);

    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-8, 8);
    ctx.quadraticCurveTo(-16, 16, -12, 20);
    ctx.moveTo(8, 8);
    ctx.quadraticCurveTo(16, 16, 12, 20);
    ctx.stroke();

    ctx.fillStyle = '#66bb6a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a5d6a7';
    ctx.beginPath();
    ctx.ellipse(0, 3, 9, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-7, -10, 6, 0, Math.PI * 2);
    ctx.arc(7, -10, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1b3a2f';
    ctx.beginPath();
    ctx.arc(-6, -10, 2.5, 0, Math.PI * 2);
    ctx.arc(8, -10, 2.5, 0, Math.PI * 2);
    ctx.fill();

    if (celebrating) {
      ctx.fillStyle = '#ffd54f';
      ctx.font = '14px serif';
      ctx.fillText('✦', -22, -18);
      ctx.fillText('✦', 14, -22);
    }
    ctx.restore();
  }

  function targetArrIndex(puzzle) {
    if (puzzle.type === 'fraction') {
      return puzzle.ticks.findIndex(function (tk) { return tk.index === puzzle.targetIndex; });
    }
    return puzzle.targetIndex;
  }

  function render(t) {
    const L = layoutMetrics();
    ctx.clearRect(0, 0, L.w, L.h);
    drawSky(L, t);
    drawRiver(L, t);
    drawBanks(L);
    state.crocs.forEach(function (c) { drawCroc(c, t); });

    if (state.puzzle) {
      const positions = logPositions(state.puzzle, L);
      drawNumberLineGuide(state.puzzle, positions, L);
      const ti = targetArrIndex(state.puzzle);

      positions.forEach(function (p, i) {
        const tick = state.puzzle.ticks[i];
        const isTarget = i === ti;
        const isAnchor = state.puzzle.type === 'fraction'
          ? state.puzzle.anchors.has(tick.index)
          : state.puzzle.anchors.has(i);
        let label = null;
        if (isAnchor) {
          label = state.puzzle.type === 'fraction'
            ? state.puzzle.labels[tick.index]
            : state.puzzle.labels[i];
        }
        let sink = 0;
        if (state.phase === 'success' && !isTarget) {
          sink = Math.min(1, Math.max(0, state.anim - 0.35 - i * 0.03));
        }
        const wobble = state.phase === 'fail' && isTarget && state.anim < 0.8;
        drawLog(p.x, p.y, label, isTarget, sink, wobble, t);
      });

      let px = state.playerX;
      let py = state.playerY;
      let hop = 0;
      if (state.phase === 'success') {
        const targetPos = positions[ti];
        if (state.anim < 0.45) {
          hop = state.anim / 0.45;
          px = state.playerX + (targetPos.x - state.playerX) * hop;
        } else if (state.anim < 0.85) {
          hop = (state.anim - 0.45) / 0.4;
          px = targetPos.x + (L.w - L.bankW * 0.45 - targetPos.x) * hop;
        } else {
          px = L.w - L.bankW * 0.45;
          hop = 0;
        }
        py = L.logY - 8;
      } else if (state.phase === 'fail') {
        px = state.playerX + Math.sin(state.anim * 30) * 2;
      }
      drawFrog(px, py, hop, state.phase === 'success' && state.anim > 0.5);
    } else {
      drawFrog(L.bankW * 0.45, L.logY - 8, 0, false);
    }

    if (state.puzzle && state.running) {
      let badge;
      if (state.puzzle.type === 'fraction') {
        badge = 'Fractions · each tick ' + state.puzzle.stepLabel;
      } else {
        badge = 'Decimals · ' + state.puzzle.subdivs + ' steps · each tick ' + state.puzzle.stepLabel;
      }
      const badgeW = Math.min(L.w - 24, Math.max(200, badge.length * 7.5 + 24));
      ctx.fillStyle = 'rgba(255,248,231,0.95)';
      ctx.strokeStyle = '#1b3a2f';
      ctx.lineWidth = 2;
      roundRect(12, 12, badgeW, 28, 10);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#1b3a2f';
      ctx.font = 'bold 13px Fredoka, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(badge, 22, 26);
    }
  }

  function update(dt) {
    if (state.hintTimer > 0) {
      state.hintTimer -= dt * 1000;
      if (state.hintTimer <= 0) hideHint();
    }

    state.crocs.forEach(function (c) {
      const L = layoutMetrics();
      c.x += c.dir * c.speed * dt;
      if (c.x < L.bankW + 30) { c.x = L.bankW + 30; c.dir = 1; }
      if (c.x > L.w - L.bankW - 30) { c.x = L.w - L.bankW - 30; c.dir = -1; }
      if (state.phase === 'success') c.happy = true;
    });

    if (!state.running) return;

    state.timerAcc += dt;
    if (state.timerAcc >= 0.25) {
      state.timeLeft -= state.timerAcc;
      state.timerAcc = 0;
      updateHUD();
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        endGame();
        return;
      }
    }

    if (state.phase === 'success') {
      state.anim += dt / 1.35;
      if (state.anim >= 1) newRound();
    } else if (state.phase === 'fail') {
      state.anim += dt / 0.9;
      if (state.anim >= 1) {
        state.phase = 'playing';
        state.wobble = 0;
        state.input = '';
        updateAnswerDisplay();
      }
    }
  }

  function loop(ts) {
    if (!state.lastTs) state.lastTs = ts;
    const dt = Math.min(0.05, (ts - state.lastTs) / 1000);
    state.lastTs = ts;
    update(dt);
    render(ts / 1000);
    requestAnimationFrame(loop);
  }

  /* ========== INPUT ========== */
  function pushKey(k) {
    if (state.phase !== 'playing' && state.running) return;

    if (k === 'clear') state.input = '';
    else if (k === 'back') state.input = state.input.slice(0, -1);
    else if (k === 'submit') {
      if (state.running && state.phase === 'playing') submitAnswer();
      return;
    } else if (k === '.' || k === '/') {
      if (state.input.indexOf(k) >= 0 || state.input.length >= 12) return;
      state.input += k;
    } else if (/^\d$/.test(k)) {
      if (state.input.length >= 12) return;
      state.input += k;
    }
    updateAnswerDisplay();
  }

  els.keypad.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-k]');
    if (!btn) return;
    pushKey(btn.getAttribute('data-k'));
  });

  window.addEventListener('keydown', function (e) {
    if (!els.start.classList.contains('hidden')) {
      if (e.key === 'Enter') { e.preventDefault(); startGame(); }
      return;
    }
    if (!els.overlay.classList.contains('hidden')) {
      if (e.key === 'Enter') { e.preventDefault(); startGame(); }
      return;
    }
    if (e.key >= '0' && e.key <= '9') pushKey(e.key);
    else if (e.key === '.' || e.key === '/') pushKey(e.key);
    else if (e.key === 'Backspace') { e.preventDefault(); pushKey('back'); }
    else if (e.key === 'Enter') { e.preventDefault(); pushKey('submit'); }
    else if (e.key === 'Escape') pushKey('clear');
  });

  els.mute.addEventListener('click', function () {
    AudioFX.muted = !AudioFX.muted;
    els.mute.setAttribute('aria-pressed', String(AudioFX.muted));
    els.mute.textContent = AudioFX.muted ? '🔇 Muted' : '🔊 Sound';
    if (AudioFX.muted) AudioFX.stopMusic();
    else if (state.running) AudioFX.startMusic();
  });

  els.startBtn.addEventListener('click', startGame);
  els.againBtn.addEventListener('click', startGame);
  window.addEventListener('resize', resizeCanvas);

  resizeCanvas();
  updateHUD();
  updateAnswerDisplay();
  requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
