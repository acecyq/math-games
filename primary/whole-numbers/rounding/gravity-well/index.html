<script>
'use strict';

/* Gravity Well: The Rounding Roller
   Singapore Primary 3–4 rounding & estimation.
   Number-line hill / gravity well: lower benchmark, upper benchmark,
   midpoint crest. Exact midpoint boosts UP to the higher multiple. */

const LW = 1280;
const LH = 720;
const FONT = 'Nunito, Trebuchet MS, sans-serif';
const DISP = 'Orbitron, Nunito, sans-serif';
const COL = {
  bg: '#050814',
  ink: '#eaf6ff',
  dim: '#8eb4cc',
  cyan: '#3ef0ff',
  amber: '#ffc857',
  good: '#5dffb0',
  bad: '#ff5d6c',
  purple: '#c77dff',
  green: '#4dff9a',
  panel: 'rgba(6, 12, 28, 0.9)',
  players: ['#ff3b5c', '#3aa0ff', '#ffe14a']
};

const KEYS = [
  { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', fire: ['Space'] },
  { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', fire: ['KeyF'] },
  { up: 'KeyI', down: 'KeyK', left: 'KeyJ', right: 'KeyL', fire: ['KeyH'] }
];

const PLACE = {
  10: { name: '10', crestEnds: '5', label: 'NEAREST 10' },
  100: { name: '100', crestEnds: '50', label: 'NEAREST 100' },
  1000: { name: '1 000', crestEnds: '500', label: 'NEAREST 1 000' }
};

const UNIT_POOL = {
  10: [
    { kind: 'distance', prefix: '', suffix: ' m', weight: 1 },
    { kind: 'volume', prefix: '', suffix: ' ml', weight: 1 },
    { kind: 'plain', prefix: '', suffix: '', weight: 3 }
  ],
  100: [
    { kind: 'mass', prefix: '', suffix: ' g', weight: 1 },
    { kind: 'plain', prefix: '', suffix: '', weight: 3 }
  ],
  1000: [
    { kind: 'money', prefix: '$', suffix: '', weight: 1 },
    { kind: 'plain', prefix: '', suffix: '', weight: 3 }
  ]
};

const FIXTURES = {
  10: [48, 62, 174, 535, 2483, 3056, 4002, 796],
  100: [340, 785, 903, 2468, 3814, 4525, 5702, 8096, 3982],
  1000: [2184, 6702, 15642, 34180, 48550, 72318, 91499, 69999]
};

const CASCADE = { 10: [796], 100: [3982], 1000: [69999] };

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const live = document.getElementById('live');
const held = new Set();
const hotspots = [];
const fx = [];
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const view = { cssW: LW, cssH: LH, dpr: 1, scale: 1, ox: 0, oy: 0 };
const players = [0, 1, 2].map(makePlayer);
const pointer = { x: 640, y: 560, down: false, over: false };

const G = {
  mode: 'title',
  t: 0,
  run: [],
  runName: '',
  pi: 0,
  problem: null,
  phase: 'idle',
  phaseT: 0,
  score: 0,
  corrects: 0,
  wrongs: 0,
  shake: 0,
  lesson: { kind: 'info', title: '', detail: '', spoken: '' },
  paused: false,
  menuPulse: 0,
  calStep: 0,
  calLocked: [false, false, false],
  calChoices: [[], [], []],
  calSelected: [null, null, null],
  ball: null,
  catchSide: null,
  catchWindow: false,
  catchResolved: false,
  catchWinner: null,
  odo: null,
  speedBonus: 0,
  roundPts: 0,
  diagnostic: null,
  flash: 0,
  crestBoost: false,
  testErrors: []
};

const audio = createAudio();
const TRACK = { x0: 140, x1: 1140, yPeak: 210, yValley: 470, amp: 130 };

function makePlayer(i) {
  const homes = [[220, 560], [640, 560], [1060, 560]];
  return {
    i,
    name: ['Red Grav-Catcher', 'Blue Grav-Catcher', 'Yellow Grav-Catcher'][i],
    short: 'P' + (i + 1),
    color: COL.players[i],
    x: homes[i][0],
    y: homes[i][1],
    home: homes[i],
    shields: 3,
    stars: 0,
    score: 0,
    lock: 0,
    fireDown: false,
    fireEdge: false,
    startDown: false,
    startEdge: false,
    pad: false,
    valley: 0,
    clampOpen: false
  };
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function pulse(speed, min, max) {
  const s = (Math.sin(G.t * speed) + 1) / 2;
  return min + (max - min) * s;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}
function fmt(n) {
  const s = String(Math.abs(Math.round(n)));
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');
}
function speak(msg) {
  live.textContent = msg;
}

/* ---------- Curriculum engine ---------- */

function benchmarks(n, place) {
  const lower = Math.floor(n / place) * place;
  const upper = lower + place;
  const mid = lower + place / 2;
  const rounded = n >= mid ? upper : lower;
  const exactMid = n === mid;
  const cascade = isCascade9(n, place, rounded);
  return { lower, upper, mid, rounded, exactMid, cascade, place, side: n >= mid ? 'right' : 'left' };
}

function isCascade9(n, place, rounded) {
  if (rounded <= n) return false;
  const digits = String(n);
  const placeDigits = String(place).length - 1;
  if (placeDigits <= 0) return false;
  const tail = digits.slice(-placeDigits);
  return /^9+$/.test(tail) || (place === 10 && n % 10 >= 5 && Math.floor(n / 10) % 10 === 9) ||
    (place === 100 && n % 100 >= 50 && Math.floor(n / 100) % 10 === 9) ||
    (place === 1000 && n % 1000 >= 500 && Math.floor(n / 1000) % 10 === 9);
}

function pickUnit(place) {
  const pool = UNIT_POOL[place];
  const total = pool.reduce((s, u) => s + u.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= pool[i].weight;
    if (r <= 0) return pool[i];
  }
  return pool[0];
}

function labelNumber(n, unit) {
  return (unit.prefix || '') + fmt(n) + (unit.suffix || '');
}

function rollNumber(place, forceCascade) {
  if (forceCascade) {
    const list = CASCADE[place];
    return list[Math.floor(Math.random() * list.length)];
  }
  if (Math.random() < 0.45) {
    const list = FIXTURES[place];
    return list[Math.floor(Math.random() * list.length)];
  }
  let min = place === 10 ? 20 : place === 100 ? 150 : 1500;
  let max = place === 10 ? 9999 : place === 100 ? 9999 : 99999;
  let n = min + Math.floor(Math.random() * (max - min + 1));
  if (Math.random() < 0.18) {
    const lower = Math.floor(n / place) * place;
    n = lower + place / 2;
  }
  return n;
}

function distractors(correct, place, role) {
  const step = place;
  const wrong = [];
  const seen = new Set([correct]);
  const cands = [
    correct + step,
    correct - step,
    correct + step * 2,
    correct - step * 2,
    correct + step * 3,
    correct - step * 3,
    Math.floor(correct / (step * 10)) * (step * 10),
    Math.ceil(correct / (step * 10)) * (step * 10)
  ];
  if (role === 'mid') {
    cands.push(correct + step / 2, correct - step / 2, correct + step / 4, correct - step / 4);
  } else {
    cands.push(correct + step / 2, correct - step / 2);
  }
  shuffle(cands).forEach((v) => {
    if (!Number.isFinite(v) || v < 0 || seen.has(v)) return;
    if (role === 'mid' && v % (step / 2) !== 0) return;
    if (role !== 'mid' && v % step !== 0) return;
    seen.add(v);
    wrong.push(v);
  });
  let k = 1;
  while (wrong.length < 3) {
    const v = correct + step * k;
    k = k > 0 ? -k : -k + 1;
    if (v < 0 || seen.has(v)) continue;
    if (role === 'mid' ? v % (step / 2) !== 0 : v % step !== 0) continue;
    seen.add(v);
    wrong.push(v);
  }
  return shuffle([correct].concat(wrong.slice(0, 3)));
}

function buildProblem(n, place, unit) {
  const b = benchmarks(n, place);
  const u = unit || pickUnit(place);
  const label = labelNumber(n, u);
  const answerLabel = labelNumber(b.rounded, u);
  return {
    n,
    place,
    unit: u,
    label,
    answerLabel,
    lower: b.lower,
    upper: b.upper,
    mid: b.mid,
    rounded: b.rounded,
    exactMid: b.exactMid,
    cascade: b.cascade || isCascade9(n, place, b.rounded),
    side: b.side,
    prompt: 'ROUND ' + label + ' TO THE ' + PLACE[place].label + '!',
    tip: tipFor(n, b, u)
  };
}

function tipFor(n, b, u) {
  const mid = labelNumber(b.mid, u);
  const num = labelNumber(n, u);
  const up = labelNumber(b.upper, u);
  const low = labelNumber(b.lower, u);
  if (b.exactMid) {
    return 'Remember: The midpoint is ' + mid + '. Exact midpoint numbers get a boost UP to ' + up + '!';
  }
  if (b.side === 'right') {
    return 'Remember: The midpoint is ' + mid + '. Since ' + num + ' is equal to or greater than the midpoint, it rolls UP to ' + up + '!';
  }
  return 'Remember: The midpoint is ' + mid + '. Since ' + num + ' is less than the midpoint, it rolls DOWN to ' + low + '!';
}

function freshRun(tier) {
  const places = tier === 1 ? [10] : tier === 2 ? [100] : tier === 3 ? [1000] : [10, 100, 1000];
  const run = [];
  places.forEach((place) => {
    const count = places.length === 1 ? 8 : 3;
    const used = new Set();
    for (let i = 0; i < count; i++) {
      const forceCascade = i === count - 1 || (i === 3 && Math.random() < 0.5);
      let n = rollNumber(place, forceCascade && i === count - 1);
      let guard = 0;
      while (used.has(n) && guard++ < 40) n = rollNumber(place, false);
      used.add(n);
      run.push(buildProblem(n, place));
    }
  });
  return shuffle(run);
}

/* ---------- Track geometry ---------- */

function trackY(t) {
  const tt = clamp(t, 0, 1);
  const hill = Math.sin(tt * Math.PI);
  return TRACK.yValley - hill * TRACK.amp;
}

function trackPoint(t) {
  const x = lerp(TRACK.x0, TRACK.x1, clamp(t, 0, 1));
  return { x, y: trackY(t) };
}

function trackTangent(t) {
  const dt = 0.002;
  const a = trackPoint(t - dt);
  const b = trackPoint(t + dt);
  return { x: b.x - a.x, y: b.y - a.y };
}

function numberToT(n, lower, upper) {
  if (upper === lower) return 0.5;
  return clamp((n - lower) / (upper - lower), 0, 1);
}

/* ---------- Audio ---------- */

function createAudio() {
  let actx = null;
  let master = null;
  let sfxBus = null;
  let noiseBuf = null;
  let timer = null;
  let step = 0;
  let next = 0;
  let muted = false;
  let rumble = null;
  try { muted = sessionStorage.getItem('rounding-gravity-well-mute') === '1'; } catch (err) { muted = false; }

  function ensure() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) {
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.22;
      master.connect(actx.destination);
      const filter = actx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2400;
      const music = actx.createGain();
      music.gain.value = 0.78;
      music.connect(filter);
      filter.connect(master);
      sfxBus = actx.createGain();
      sfxBus.gain.value = 0.95;
      sfxBus.connect(master);
      const len = actx.sampleRate;
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      actx._music = music;
      next = actx.currentTime + 0.05;
      timer = setInterval(schedule, 25);
    }
    if (actx.state === 'suspended') actx.resume();
    if (next < actx.currentTime) next = actx.currentTime + 0.05;
  }

  function env(bus, time, dur, vol, freq, type, slide) {
    if (!actx) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(36, freq), time);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(36, slide), time + dur);
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + Math.max(0.04, dur));
    o.connect(g);
    g.connect(bus);
    o.start(time);
    o.stop(time + dur + 0.03);
  }

  function noiseHit(time, dur, vol, freq) {
    if (!noiseBuf || !actx) return;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(freq, time);
    bp.Q.value = 0.7;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    src.connect(bp);
    bp.connect(g);
    g.connect(sfxBus);
    src.start(time);
    src.stop(time + dur + 0.02);
  }

  function hat(time, vol) {
    if (!noiseBuf) return;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 6800;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
    src.connect(hp);
    hp.connect(g);
    g.connect(actx._music);
    src.start(time);
    src.stop(time + 0.05);
  }

  function schedule() {
    if (!actx || G.mode === 'pause') return;
    const beat = 60 / 142 / 4;
    while (next < actx.currentTime + 0.16) {
      playStep(step % 32, next);
      next += beat;
      step++;
    }
  }

  function playStep(i, time) {
    const bass = [55, 0, 55, 0, 82, 0, 55, 0, 73, 0, 82, 110, 55, 0, 98, 0, 65, 0, 65, 0, 82, 0, 55, 0, 73, 0, 98, 110, 55, 0, 82, 0];
    const arp = [220, 277, 330, 370, 440, 370, 330, 277, 247, 330, 370, 494, 554, 494, 370, 330, 196, 247, 294, 370, 440, 370, 294, 247, 220, 277, 330, 440, 370, 330, 277, 220];
    if (i % 8 === 0) env(actx._music, time, 0.16, 0.48, 140, 'sine', 42);
    if (i % 2 === 0) hat(time, i % 8 === 4 ? 0.05 : 0.026);
    if (bass[i]) env(actx._music, time, 0.13, 0.11, bass[i], 'square');
    if (i % 2 === 0) env(actx._music, time, 0.08, 0.032, arp[i], 'square');
    if (i % 8 === 4) env(actx._music, time, 0.11, 0.038, arp[i] * 2, 'triangle');
  }

  function now() { return actx ? actx.currentTime : 0; }

  return {
    ensure,
    get muted() { return muted; },
    toggle() {
      ensure();
      muted = !muted;
      try { sessionStorage.setItem('rounding-gravity-well-mute', muted ? '1' : '0'); } catch (err) { /* ignore */ }
      if (master && actx) master.gain.setTargetAtTime(muted ? 0 : 0.22, actx.currentTime, 0.04);
      return muted;
    },
    lock() {
      if (!actx) return;
      env(sfxBus, now(), 0.12, 0.06, 520, 'square', 880);
      env(sfxBus, now() + 0.05, 0.16, 0.04, 660, 'triangle');
    },
    drop() {
      if (!actx) return;
      env(sfxBus, now(), 0.22, 0.07, 420, 'sine', 120);
      noiseHit(now(), 0.12, 0.05, 500);
    },
    rollStart() {
      if (!actx) return;
      if (rumble) return;
      rumble = {
        o: actx.createOscillator(),
        g: actx.createGain(),
        n: actx.createBufferSource(),
        ng: actx.createGain()
      };
      rumble.o.type = 'sawtooth';
      rumble.o.frequency.value = 70;
      rumble.g.gain.value = 0.028;
      rumble.o.connect(rumble.g);
      rumble.g.connect(sfxBus);
      rumble.o.start();
      rumble.n.buffer = noiseBuf;
      rumble.n.loop = true;
      rumble.ng.gain.value = 0.018;
      const bp = actx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 380;
      rumble.n.connect(bp);
      bp.connect(rumble.ng);
      rumble.ng.connect(sfxBus);
      rumble.n.start();
    },
    rollStop() {
      if (!rumble || !actx) return;
      try {
        rumble.g.gain.exponentialRampToValueAtTime(0.0001, now() + 0.08);
        rumble.ng.gain.exponentialRampToValueAtTime(0.0001, now() + 0.08);
        rumble.o.stop(now() + 0.1);
        rumble.n.stop(now() + 0.1);
      } catch (err) { /* ignore */ }
      rumble = null;
    },
    click() {
      if (!actx) return;
      env(sfxBus, now(), 0.04, 0.04, 1400, 'square', 900);
    },
    clamp() {
      if (!actx) return;
      env(sfxBus, now(), 0.18, 0.08, 90, 'sine', 40);
      noiseHit(now(), 0.1, 0.07, 280);
      env(sfxBus, now() + 0.05, 0.2, 0.05, 220, 'triangle');
    },
    win() {
      if (!actx) return;
      [523, 659, 784, 1047].forEach((freq, i) => {
        env(sfxBus, now() + i * 0.05, 0.45, 0.05, freq, 'triangle');
      });
    },
    fail() {
      if (!actx) return;
      env(sfxBus, now(), 0.18, 0.06, 180, 'sawtooth', 70);
      noiseHit(now(), 0.22, 0.08, 620);
      env(sfxBus, now() + 0.12, 0.2, 0.05, 96, 'square');
    },
    tick() {
      if (!actx) return;
      env(sfxBus, now(), 0.05, 0.05, 880, 'square');
      noiseHit(now(), 0.03, 0.03, 1600);
    },
    boost() {
      if (!actx) return;
      env(sfxBus, now(), 0.28, 0.07, 220, 'sawtooth', 880);
      env(sfxBus, now(), 0.22, 0.05, 440, 'triangle', 1200);
    },
    spark() {
      if (!actx) return;
      noiseHit(now(), 0.08, 0.06, 2200);
      env(sfxBus, now(), 0.07, 0.04, 1200, 'square', 600);
    }
  };
}

/* ---------- Input ---------- */

function readPad(gp) {
  if (!gp) return { x: 0, y: 0, fire: false, start: false };
  let x = gp.axes && gp.axes.length ? gp.axes[0] || 0 : 0;
  let y = gp.axes && gp.axes.length > 1 ? gp.axes[1] || 0 : 0;
  if (Math.abs(x) < 0.28) x = 0;
  if (Math.abs(y) < 0.28) y = 0;
  const btn = (i) => {
    const b = gp.buttons && gp.buttons[i];
    if (!b) return false;
    return typeof b === 'object' ? !!b.pressed : !!b;
  };
  if (btn(12)) y = -1;
  if (btn(13)) y = 1;
  if (btn(14)) x = -1;
  if (btn(15)) x = 1;
  return { x, y, fire: btn(0) || btn(1), start: btn(9) };
}

function pollPads() {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  const out = [null, null, null];
  for (let i = 0; i < list.length; i++) {
    const gp = list[i];
    if (!gp || gp.index > 2) continue;
    out[gp.index] = gp;
  }
  return out;
}

function movePlayers(dt) {
  const pads = pollPads();
  const leftPocket = TRACK.x0 + 70;
  const rightPocket = TRACK.x1 - 70;
  const midX = (TRACK.x0 + TRACK.x1) / 2;

  players.forEach((p) => {
    const keys = KEYS[p.i];
    let mx = 0;
    let my = 0;
    if (held.has(keys.left)) mx -= 1;
    if (held.has(keys.right)) mx += 1;
    if (held.has(keys.up)) my -= 1;
    if (held.has(keys.down)) my += 1;
    const gp = pads[p.i];
    p.pad = !!gp;
    const pad = readPad(gp);
    if (pad.x || pad.y) {
      mx += pad.x;
      my += pad.y;
    }
    const mag = Math.hypot(mx, my);
    if (mag > 1) {
      mx /= mag;
      my /= mag;
    }

    if (G.mode === 'play' && (G.phase === 'predict' || G.phase === 'roll' || G.phase === 'catch')) {
      if (mx < -0.35) p.valley = -1;
      if (mx > 0.35) p.valley = 1;
      const targetX = p.valley < 0 ? leftPocket : p.valley > 0 ? rightPocket : midX;
      p.x = lerp(p.x, targetX, clamp(8 * dt, 0, 1));
      p.y = lerp(p.y, TRACK.yValley + 55, clamp(8 * dt, 0, 1));
    } else if (mag > 0.04) {
      p.x += mx * 720 * dt;
      p.y += my * 720 * dt;
    }

    p.x = clamp(p.x, 24, LW - 24);
    p.y = clamp(p.y, 78, LH - 24);

    const fireDown = keys.fire.some((code) => held.has(code)) || pad.fire;
    if (fireDown && !p.fireDown) p.fireEdge = true;
    p.fireDown = fireDown;
    p.clampOpen = fireDown && (G.phase === 'roll' || G.phase === 'catch');
    if (pad.start && !p.startDown) p.startEdge = true;
    p.startDown = pad.start;
    if (p.lock > 0 && p.lock < 100) p.lock = Math.max(0, p.lock - dt);
  });
}

function consumeEdges() {
  const edges = players.map((p) => p.fireEdge);
  players.forEach((p) => { p.fireEdge = false; });
  return edges;
}

function hitRect(px, py, r, pad) {
  const m = pad || 0;
  return px >= r.x - m && px <= r.x + r.w + m && py >= r.y - m && py <= r.y + r.h + m;
}

function targetUnder(px, py, rects) {
  for (let i = rects.length - 1; i >= 0; i--) {
    if (hitRect(px, py, rects[i], 8)) return rects[i];
  }
  return null;
}

/* ---------- Game flow ---------- */

function setLesson(kind, title, detail) {
  G.lesson = { kind, title, detail, spoken: title + '. ' + detail };
  speak(G.lesson.spoken);
}

function spawnFx(kind, x, y, color, life) {
  fx.push({ kind, x, y, color: color || COL.cyan, life: life || 0.6, t: 0, vx: (Math.random() - 0.5) * 80, vy: -40 - Math.random() * 80 });
}

function burst(x, y, color, n) {
  for (let i = 0; i < (n || 12); i++) spawnFx('spark', x, y, color, 0.45 + Math.random() * 0.4);
}

function menuCards() {
  const cards = [
    { id: 't1', kicker: 'TIER 1', title: 'NEAREST 10', sub: 'Benchmarks of 10 · Cascade-9 traps' },
    { id: 't2', kicker: 'TIER 2', title: 'NEAREST 100', sub: 'Hundreds valleys · mass units' },
    { id: 't3', kicker: 'TIER 3', title: 'NEAREST 1 000', sub: 'Thousands crest · $ currency' },
    { id: 'all', kicker: 'FULL TRACK', title: 'CAMPAIGN', sub: 'All three rounding tiers' }
  ];
  const w = 250;
  const h = 96;
  const gap = 18;
  const total = cards.length * w + (cards.length - 1) * gap;
  const x0 = (LW - total) / 2;
  return cards.map((card, i) => Object.assign({ x: x0 + i * (w + gap), y: 430, w, h }, card));
}

function pauseButtons() {
  return [
    { id: 'resume', x: 430, y: 390, w: 180, h: 52, label: 'RESUME' },
    { id: 'quit', x: 670, y: 390, w: 180, h: 52, label: 'QUIT' }
  ];
}

function openCard(id) {
  audio.ensure();
  if (id === 't1') startRun(freshRun(1), 'Tier 1 · Nearest 10');
  if (id === 't2') startRun(freshRun(2), 'Tier 2 · Nearest 100');
  if (id === 't3') startRun(freshRun(3), 'Tier 3 · Nearest 1 000');
  if (id === 'all') startRun(freshRun(), 'Full track campaign');
}

function startRun(run, name) {
  G.run = run;
  G.runName = name;
  G.pi = 0;
  G.score = 0;
  G.corrects = 0;
  G.wrongs = 0;
  players.forEach((p) => {
    p.shields = 3;
    p.stars = 0;
    p.score = 0;
    p.lock = 0;
    p.valley = 0;
  });
  G.mode = 'play';
  loadProblem(0);
}

function leaveToTitle() {
  audio.rollStop();
  G.mode = 'title';
  G.phase = 'idle';
  G.problem = null;
  G.ball = null;
  G.odo = null;
  G.diagnostic = null;
  setLesson('info', 'Gravity Well', 'Aim a reticle at a tier card, then lock in.');
}

function loadProblem(index) {
  audio.rollStop();
  G.pi = index;
  G.problem = G.run[index];
  G.phase = 'calibrate';
  G.phaseT = 0;
  G.calStep = 0;
  G.calLocked = [false, false, false];
  G.calSelected = [null, null, null];
  G.calChoices = [
    distractors(G.problem.lower, G.problem.place, 'lower'),
    distractors(G.problem.upper, G.problem.place, 'upper'),
    distractors(G.problem.mid, G.problem.place, 'mid')
  ];
  G.ball = null;
  G.catchSide = null;
  G.catchWindow = false;
  G.catchResolved = false;
  G.catchWinner = null;
  G.odo = null;
  G.speedBonus = 0;
  G.roundPts = 0;
  G.diagnostic = null;
  G.crestBoost = false;
  G.flash = 0;
  players.forEach((p) => {
    p.valley = 0;
    p.lock = 0;
    p.x = p.home[0];
    p.y = p.home[1];
  });
  setLesson('info', 'Stage 1 · Calibrate', G.problem.prompt + ' Lock lower, upper, then midpoint.');
  speak(G.problem.prompt);
}

function calChipRects() {
  const labels = ['LOWER MULTIPLE', 'UPPER MULTIPLE', 'MIDPOINT CREST'];
  const choices = G.calChoices[G.calStep] || [];
  const w = 200;
  const h = 70;
  const gap = 16;
  const total = choices.length * w + (choices.length - 1) * gap;
  const x0 = (LW - total) / 2;
  const y = 560;
  return choices.map((value, i) => ({
    x: x0 + i * (w + gap),
    y: y + Math.sin(G.t * 2.2 + i) * (reduceMotion ? 0 : 3),
    w,
    h,
    i,
    value,
    label: labelNumber(value, G.problem.unit),
    role: labels[G.calStep],
    correct: value === [G.problem.lower, G.problem.upper, G.problem.mid][G.calStep]
  }));
}

function chooseCalibration(player, chip) {
  if (!chip || player.lock > 0 || player.shields <= 0) return;
  const need = [G.problem.lower, G.problem.upper, G.problem.mid][G.calStep];
  if (chip.value === need) {
    G.calLocked[G.calStep] = true;
    G.calSelected[G.calStep] = chip.value;
    audio.lock();
    burst(chip.x + chip.w / 2, chip.y + chip.h / 2, COL.good, 10);
    player.stars += 1;
    player.score += 40;
    G.score += 40;
    G.flash = 0.35;
    if (G.calStep < 2) {
      G.calStep += 1;
      setLesson('good', ['Lower locked!', 'Upper locked!', 'Crest locked!'][G.calStep - 1],
        G.calStep === 1 ? 'Now lock the upper multiple.' : 'Now lock the midpoint crest.');
    } else {
      beginPredict();
    }
  } else {
    wrongHit(player, 'That is not the ' + chip.role.toLowerCase() + '. Check the place value.');
  }
  player.lock = 0.35;
}

function beginPredict() {
  G.phase = 'predict';
  G.phaseT = 0;
  players.forEach((p) => { p.valley = 0; });
  setLesson('info', 'Stage 2 · Gravity prediction', 'Will the marble roll LEFT (down) or RIGHT (up)? Aim your catcher, then fire to drop!');
}

function dropBall() {
  const p = G.problem;
  const tLand = numberToT(p.n, p.lower, p.upper);
  G.ball = {
    state: 'chute',
    t: tLand,
    x: trackPoint(tLand).x,
    y: 40,
    vy: 0,
    vt: 0,
    spin: 0,
    trail: [],
    landed: false,
    catchT: 0
  };
  G.phase = 'roll';
  G.phaseT = 0;
  G.catchResolved = false;
  G.catchWindow = false;
  audio.drop();
  setLesson('info', 'Marble deployed', 'Position your Grav-Catcher over the winning valley, then clamp!');
}

function beginRollPhysics() {
  const p = G.problem;
  const ball = G.ball;
  ball.state = 'roll';
  ball.landed = true;
  audio.rollStart();
  if (p.exactMid) {
    G.crestBoost = true;
    audio.boost();
    burst(trackPoint(0.5).x, trackPoint(0.5).y - 20, COL.amber, 18);
    ball.vt = 0.55;
  } else if (p.side === 'right') {
    ball.vt = 0.12 + Math.min(0.45, (p.n - p.mid) / p.place * 0.5);
  } else {
    ball.vt = -(0.12 + Math.min(0.45, (p.mid - p.n) / p.place * 0.5));
  }
  G.catchWindow = true;
  G.phase = 'catch';
  G.phaseT = 0;
}

function attemptCatch(player) {
  if (!G.ball || G.catchResolved || player.lock > 0 || player.shields <= 0) return;
  if (G.phase !== 'catch' && G.phase !== 'roll') return;
  if (player.valley === 0) return;

  const want = G.problem.side === 'left' ? -1 : 1;
  const pastCrest = G.ball.t < 0.45 || G.ball.t > 0.55 || G.ball.state === 'pocket' || G.problem.exactMid;
  if (!pastCrest && G.ball.state === 'roll') return;

  player.lock = 0.4;
  audio.clamp();
  resolveCatch(player, player.valley === want);
}

function resolveCatch(player, correct) {
  if (G.catchResolved) return;
  G.catchResolved = true;
  G.catchWindow = false;
  audio.rollStop();
  const p = G.problem;
  const pocket = p.side === 'left' ? trackPoint(0.02) : trackPoint(0.98);

  if (correct) {
    G.catchWinner = player;
    G.ball.state = 'caught';
    G.ball.x = pocket.x;
    G.ball.y = pocket.y;
    G.ball.vt = 0;
    const speedBonus = Math.max(0, Math.round(180 - G.phaseT * 60));
    G.speedBonus = speedBonus;
    let pts = 100 + speedBonus;
    if (p.cascade) pts += 250;
    G.roundPts = pts;
    G.score += pts;
    player.score += pts;
    player.stars += 1;
    G.corrects += 1;
    burst(pocket.x, pocket.y, player.color, 20);
    audio.win();
    if (p.cascade) {
      startOdometer();
    } else {
      G.phase = 'success';
      G.phaseT = 0;
      setLesson('good', 'Caught ' + p.answerLabel + '!', '+' + pts + ' Gravity Points' + (speedBonus ? ' (incl. +' + speedBonus + ' speed)' : ''));
    }
  } else {
    G.ball.state = 'smash';
    G.shake = 0.7;
    audio.fail();
    burst(G.ball.x, G.ball.y, COL.bad, 16);
    wrongHit(player, p.tip);
    G.phase = 'fail';
    G.phaseT = 0;
    G.diagnostic = p.tip;
    G.wrongs += 1;
  }
}

function wrongHit(player, detail) {
  player.shields = Math.max(0, player.shields - 1);
  player.lock = 0.55;
  audio.spark();
  G.shake = 0.45;
  setLesson('bad', 'Shield drop!', detail);
  if (players.every((p) => p.shields <= 0)) {
    G.mode = 'meltdown';
    setLesson('bad', 'Gravity collapse', 'All shields depleted. Fire to retry this round.');
  }
}

function startOdometer() {
  const p = G.problem;
  G.phase = 'odometer';
  G.phaseT = 0;
  G.odo = {
    from: String(p.n),
    to: String(p.rounded),
    digits: String(Math.max(p.n, p.rounded)).length,
    progress: 0,
    ticks: 0,
    done: false
  };
  // pad
  while (G.odo.from.length < G.odo.digits) G.odo.from = '0' + G.odo.from;
  while (G.odo.to.length < G.odo.digits) G.odo.to = '0' + G.odo.to;
  setLesson('good', 'Cascade-9 surge!', 'Odometer rolling… +250 Gravity Points!');
}

function advanceOverlay() {
  if (G.mode === 'celebrate' || G.phase === 'success' || (G.phase === 'odometer' && G.odo && G.odo.done)) {
    if (G.pi + 1 >= G.run.length) {
      G.mode = 'victory';
      G.phase = 'idle';
      setLesson('good', 'Track cleared!', G.runName + ' · ' + fmt(G.score) + ' Gravity Points');
    } else {
      loadProblem(G.pi + 1);
    }
    return;
  }
  if (G.mode === 'meltdown' || G.phase === 'fail') {
    if (G.mode === 'meltdown') {
      players.forEach((p) => { p.shields = 3; });
      G.mode = 'play';
    }
    loadProblem(G.pi);
    return;
  }
  if (G.mode === 'victory') leaveToTitle();
}

function handleFire(edges) {
  if (G.mode === 'title') {
    const cards = menuCards();
    players.forEach((p, i) => {
      if (!edges[i]) return;
      const card = targetUnder(p.x, p.y, cards);
      if (card) openCard(card.id);
    });
    return;
  }
  if (G.mode === 'pause') {
    players.forEach((p, i) => {
      if (!edges[i]) return;
      const hit = targetUnder(p.x, p.y, pauseButtons());
      if (hit && hit.id === 'resume') G.mode = 'play';
      if (hit && hit.id === 'quit') leaveToTitle();
    });
    return;
  }
  if (G.mode === 'victory' || G.mode === 'meltdown') {
    if (edges.some(Boolean)) advanceOverlay();
    return;
  }
  if (G.mode !== 'play') return;

  if (G.phase === 'success' || G.phase === 'fail' || (G.phase === 'odometer' && G.odo && G.odo.done)) {
    if (edges.some(Boolean)) advanceOverlay();
    return;
  }

  if (G.phase === 'calibrate') {
    const chips = calChipRects();
    players.forEach((p, i) => {
      if (!edges[i] || p.lock > 0 || p.shields <= 0) return;
      const hit = targetUnder(p.x, p.y, chips);
      if (hit) chooseCalibration(p, hit);
    });
    return;
  }

  if (G.phase === 'predict') {
    players.forEach((p, i) => {
      if (!edges[i] || p.shields <= 0) return;
      if (p.valley === 0) {
        setLesson('info', 'Pick a valley', 'Move left or right onto a catch pocket, then fire to drop the marble.');
        return;
      }
      dropBall();
    });
    return;
  }

  if (G.phase === 'roll' || G.phase === 'catch') {
    players.forEach((p, i) => {
      if (!edges[i]) return;
      attemptCatch(p);
    });
  }
}

/* ---------- Update ---------- */

function update(dt) {
  G.t += dt;
  G.menuPulse += dt;
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt);
  if (G.mode !== 'play' || G.paused) {
    updateFx(dt);
    return;
  }
  G.phaseT += dt;

  if (G.ball) updateBall(dt);
  if (G.phase === 'odometer' && G.odo) updateOdometer(dt);
  if (G.phase === 'success' && G.phaseT > 2.4) advanceOverlay();
  if (G.phase === 'fail' && G.phaseT > 3.2) advanceOverlay();
  if (G.phase === 'odometer' && G.odo && G.odo.done && G.phaseT > 2.8) advanceOverlay();

  // auto-resolve miss if ball settles without catch
  if (G.phase === 'catch' && G.ball && G.ball.state === 'pocket' && !G.catchResolved && G.phaseT > 0.35) {
    const any = players.find((p) => p.valley !== 0 && p.shields > 0);
    if (any) attemptCatch(any);
    else {
      G.catchResolved = true;
      audio.rollStop();
      G.phase = 'fail';
      G.phaseT = 0;
      G.diagnostic = G.problem.tip;
      setLesson('bad', 'No catcher locked', G.problem.tip);
    }
  }

  updateFx(dt);
}

function updateBall(dt) {
  const ball = G.ball;
  const p = G.problem;
  if (ball.state === 'chute') {
    const land = trackPoint(ball.t);
    ball.vy += 1400 * dt;
    ball.y += ball.vy * dt;
    ball.x = lerp(ball.x, land.x, 0.08);
    if (ball.y >= land.y - 8) {
      ball.y = land.y;
      ball.vy = 0;
      beginRollPhysics();
    }
    return;
  }

  if (ball.state === 'roll' || ball.state === 'catch') {
    // gravity along hill: force proportional to slope (cos-like)
    const slope = Math.cos(ball.t * Math.PI); // >0 left of crest means downhill to left when t decreases...
    // Potential peaks at t=0.5. Gravity pulls away from crest if past it, toward valleys.
    let accel = 0;
    if (p.exactMid && G.crestBoost && ball.t > 0.48 && ball.t < 0.52 && ball.vt >= 0) {
      accel = 1.8;
    } else {
      // natural: accelerate away from crest based on which side
      accel = (ball.t - 0.5) * 3.2;
      // strengthen with remaining distance
      accel += Math.sign(ball.vt || (p.side === 'right' ? 1 : -1)) * 0.35;
    }
    ball.vt += accel * dt;
    ball.vt = clamp(ball.vt, -1.6, 1.6);
    ball.t += ball.vt * dt * 0.55;
    ball.spin += ball.vt * 8 * dt;

    if (ball.t <= 0.02) {
      ball.t = 0.02;
      ball.vt = 0;
      ball.state = 'pocket';
      audio.rollStop();
      audio.click();
    } else if (ball.t >= 0.98) {
      ball.t = 0.98;
      ball.vt = 0;
      ball.state = 'pocket';
      audio.rollStop();
      audio.click();
    }

    const pt = trackPoint(ball.t);
    ball.x = pt.x;
    ball.y = pt.y;
    ball.trail.push({ x: ball.x, y: ball.y, a: 1 });
    if (ball.trail.length > 18) ball.trail.shift();
    if (Math.random() < 0.08) audio.click();

    // held clamp auto-snaps once the marble enters the aimed valley zone
    if (!G.catchResolved && G.catchWindow) {
      players.forEach((pl) => {
        if (!pl.clampOpen || pl.valley === 0 || pl.lock > 0) return;
        const inLeft = ball.t < 0.22;
        const inRight = ball.t > 0.78;
        if ((inLeft && pl.valley < 0) || (inRight && pl.valley > 0)) attemptCatch(pl);
      });
    }
  }

  if (ball.state === 'smash') {
    ball.y += 40 * dt;
    ball.spin += 10 * dt;
  }
}

function updateOdometer(dt) {
  const o = G.odo;
  if (o.done) return;
  o.progress += dt * 1.15;
  const nextTick = Math.floor(o.progress * o.digits);
  if (nextTick > o.ticks) {
    o.ticks = nextTick;
    audio.tick();
  }
  if (o.progress >= 1.15) {
    o.done = true;
    o.progress = 1;
    audio.win();
    setLesson('good', fmt(G.problem.n) + ' → ' + G.problem.answerLabel + '!', '+' + G.roundPts + ' Gravity Points banked');
  }
}

function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i];
    f.t += dt;
    f.x += (f.vx || 0) * dt;
    f.y += (f.vy || 0) * dt;
    if (f.t >= f.life) fx.splice(i, 1);
  }
}

/* ---------- Drawing ---------- */

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.cssW = window.innerWidth;
  view.cssH = window.innerHeight;
  view.dpr = dpr;
  canvas.width = Math.max(1, Math.round(view.cssW * dpr));
  canvas.height = Math.max(1, Math.round(view.cssH * dpr));
  view.scale = Math.min(view.cssW / LW, view.cssH / LH);
  view.ox = (view.cssW - LW * view.scale) / 2;
  view.oy = (view.cssH - LH * view.scale) / 2;
}

function toLogical(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (view.cssW / rect.width);
  const y = (clientY - rect.top) * (view.cssH / rect.height);
  return { x: (x - view.ox) / view.scale, y: (y - view.oy) / view.scale };
}

function fitFont(text, weight, maxPx, family, maxW) {
  let size = maxPx;
  let font = weight + ' ' + size + 'px ' + family;
  ctx.font = font;
  while (size > 10 && ctx.measureText(text).width > maxW) {
    size -= 1;
    font = weight + ' ' + size + 'px ' + family;
    ctx.font = font;
  }
  return font;
}

function drawShield(x, y, s, on) {
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.lineTo(x + s * 0.85, y - s * 0.45);
  ctx.lineTo(x + s * 0.7, y + s * 0.55);
  ctx.lineTo(x, y + s);
  ctx.lineTo(x - s * 0.7, y + s * 0.55);
  ctx.lineTo(x - s * 0.85, y - s * 0.45);
  ctx.closePath();
  ctx.fillStyle = on ? '#7dfff0' : 'rgba(125,255,240,0.16)';
  ctx.fill();
  ctx.strokeStyle = on ? '#d8fff8' : 'rgba(125,255,240,0.28)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawBackdrop() {
  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, '#07101f');
  g.addColorStop(0.55, '#0a1630');
  g.addColorStop(1, '#050814');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, LW, LH);

  // neon grid floor
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = '#2a6dff';
  ctx.lineWidth = 1;
  for (let i = 0; i < 18; i++) {
    const y = 520 + i * 14;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(LW, y);
    ctx.stroke();
  }
  for (let i = 0; i < 24; i++) {
    const x = i * 60 - ((G.t * 30) % 60);
    ctx.beginPath();
    ctx.moveTo(x, 520);
    ctx.lineTo(x - 80, LH);
    ctx.stroke();
  }
  ctx.restore();

  // ambient orbs
  for (let i = 0; i < 6; i++) {
    const x = 100 + i * 200 + Math.sin(G.t * 0.7 + i) * 20;
    const y = 80 + (i % 3) * 40;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, 60);
    rg.addColorStop(0, 'rgba(62,240,255,0.12)');
    rg.addColorStop(1, 'rgba(62,240,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, 60, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawTrack() {
  const lit = G.calLocked;
  // glow under track
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const t = i / 60;
    const p = trackPoint(t);
    if (i === 0) ctx.moveTo(p.x, p.y + 18);
    else ctx.lineTo(p.x, p.y + 18);
  }
  ctx.strokeStyle = 'rgba(62,240,255,0.15)';
  ctx.lineWidth = 28;
  ctx.stroke();
  ctx.restore();

  // main rail
  ctx.beginPath();
  for (let i = 0; i <= 80; i++) {
    const t = i / 80;
    const p = trackPoint(t);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  const rail = ctx.createLinearGradient(TRACK.x0, 0, TRACK.x1, 0);
  rail.addColorStop(0, lit[0] ? COL.green : '#1c3a55');
  rail.addColorStop(0.5, lit[2] ? COL.cyan : '#2a4d6e');
  rail.addColorStop(1, lit[1] ? COL.purple : '#1c3a55');
  ctx.strokeStyle = rail;
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.stroke();

  // inner neon edge
  ctx.beginPath();
  for (let i = 0; i <= 80; i++) {
    const t = i / 80;
    const p = trackPoint(t);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(234,246,255,0.35)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // tick marks
  if (G.problem) {
    const marks = [0, 0.25, 0.5, 0.75, 1];
    const vals = [G.problem.lower, lerp(G.problem.lower, G.problem.upper, 0.25), G.problem.mid, lerp(G.problem.lower, G.problem.upper, 0.75), G.problem.upper];
    marks.forEach((t, i) => {
      const p = trackPoint(t);
      const tan = trackTangent(t);
      const len = Math.hypot(tan.x, tan.y) || 1;
      const nx = -tan.y / len;
      const ny = tan.x / len;
      ctx.beginPath();
      ctx.moveTo(p.x + nx * 8, p.y + ny * 8);
      ctx.lineTo(p.x + nx * 18, p.y + ny * 18);
      ctx.strokeStyle = i === 2 ? COL.amber : COL.dim;
      ctx.lineWidth = i === 2 ? 3 : 1.5;
      ctx.stroke();
      // Reveal tick labels only after that benchmark is locked in
      const reveal = (i === 0 && lit[0]) || (i === 2 && lit[2]) || (i === 4 && lit[1]);
      if (reveal) {
        ctx.font = '800 13px ' + FONT;
        ctx.fillStyle = i === 2 ? COL.amber : COL.ink;
        ctx.textAlign = 'center';
        ctx.fillText(labelNumber(Math.round(vals[i]), G.problem.unit), p.x, p.y - 28);
      }
    });
  }

  drawPocket(
    TRACK.x0 + 40,
    TRACK.yValley + 8,
    COL.green,
    lit[0],
    lit[0] && G.problem ? labelNumber(G.problem.lower, G.problem.unit) : 'LOWER ?'
  );
  drawPocket(
    TRACK.x1 - 40,
    TRACK.yValley + 8,
    COL.purple,
    lit[1],
    lit[1] && G.problem ? labelNumber(G.problem.upper, G.problem.unit) : 'UPPER ?'
  );
  drawCrest(lit[2]);

  // chute
  ctx.fillStyle = 'rgba(62,240,255,0.15)';
  ctx.fillRect(LW / 2 - 28, 18, 56, 50);
  ctx.strokeStyle = COL.cyan;
  ctx.lineWidth = 2;
  ctx.strokeRect(LW / 2 - 28, 18, 56, 50);
  ctx.font = '800 11px ' + FONT;
  ctx.fillStyle = COL.cyan;
  ctx.textAlign = 'center';
  ctx.fillText('DEPLOY', LW / 2, 36);
}

function drawPocket(x, y, color, lit, label) {
  ctx.save();
  const rg = ctx.createRadialGradient(x, y, 4, x, y, lit ? 70 : 42);
  rg.addColorStop(0, lit ? color : 'rgba(80,120,160,0.35)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.arc(x, y, lit ? 70 : 42, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(x, y + 6, 46, 18, 0, 0, Math.PI * 2);
  ctx.strokeStyle = lit ? color : '#3a5570';
  ctx.lineWidth = lit ? 4 : 2;
  ctx.stroke();
  if (lit) {
    ctx.globalAlpha = 0.35 + pulse(4, 0, 0.25);
    ctx.strokeStyle = color;
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.font = '800 14px ' + FONT;
  ctx.fillStyle = lit ? color : COL.dim;
  ctx.textAlign = 'center';
  ctx.fillText(label, x, y + 44);
  ctx.restore();
}

function drawCrest(lit) {
  const p = trackPoint(0.5);
  ctx.save();
  ctx.strokeStyle = lit ? COL.amber : 'rgba(255,200,87,0.35)';
  ctx.lineWidth = lit ? 3 : 1.5;
  ctx.setLineDash(lit ? [] : [4, 4]);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - 90);
  ctx.lineTo(p.x, p.y + 20);
  ctx.stroke();
  ctx.setLineDash([]);

  // beacon
  ctx.beginPath();
  ctx.arc(p.x, p.y - 96, lit ? 10 : 6, 0, Math.PI * 2);
  ctx.fillStyle = lit ? COL.amber : '#6a5a30';
  ctx.fill();
  if (lit) {
    const rg = ctx.createRadialGradient(p.x, p.y - 96, 0, p.x, p.y - 96, 40);
    rg.addColorStop(0, 'rgba(255,200,87,0.55)');
    rg.addColorStop(1, 'rgba(255,200,87,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(p.x, p.y - 96, 40, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.font = lit ? '800 14px ' + DISP : '800 13px ' + FONT;
  ctx.fillStyle = lit ? COL.amber : COL.dim;
  ctx.textAlign = 'center';
  ctx.fillText(
    lit && G.problem ? labelNumber(G.problem.mid, G.problem.unit) : 'CREST ?',
    p.x,
    p.y - 114
  );
  if (G.crestBoost) {
    ctx.font = '900 16px ' + FONT;
    ctx.fillStyle = COL.amber;
    ctx.fillText('BOOST ↑', p.x, p.y - 134);
  }
  ctx.restore();
}

function drawBall() {
  const ball = G.ball;
  if (!ball) return;

  // trail
  ball.trail.forEach((pt, i) => {
    ctx.globalAlpha = (i / ball.trail.length) * 0.35;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = COL.cyan;
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  const r = 26;
  const grd = ctx.createRadialGradient(ball.x - 8, ball.y - 10, 4, ball.x, ball.y, r);
  grd.addColorStop(0, '#f2fbff');
  grd.addColorStop(0.35, '#9ad7ff');
  grd.addColorStop(1, '#1a3a55');
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.fill();
  ctx.strokeStyle = 'rgba(234,246,255,0.7)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // stamped number
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.spin * 0.2);
  const label = G.problem ? G.problem.label : '';
  ctx.font = fitFont(label, '900', 13, DISP, 44);
  ctx.fillStyle = '#061018';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, 0, 1);
  ctx.restore();

  if (ball.state === 'smash') {
    ctx.strokeStyle = COL.bad;
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = G.t * 8 + i;
      ctx.beginPath();
      ctx.moveTo(ball.x, ball.y);
      ctx.lineTo(ball.x + Math.cos(a) * 40, ball.y + Math.sin(a) * 30);
      ctx.stroke();
    }
  }
}

function drawCatchers() {
  if (!(G.phase === 'predict' || G.phase === 'roll' || G.phase === 'catch')) return;
  players.forEach((p) => {
    if (p.shields <= 0) return;
    const x = p.x;
    const y = TRACK.yValley + 18;
    ctx.save();
    ctx.globalAlpha = p.valley === 0 ? 0.45 : 0.95;
    // reticle jaws
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, 34, -Math.PI * 0.75, -Math.PI * 0.25);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, 34, Math.PI * 0.25, Math.PI * 0.75);
    ctx.stroke();
    const open = p.clampOpen ? 10 : 0;
    ctx.beginPath();
    ctx.moveTo(x - 28 - open, y - 8);
    ctx.lineTo(x - 10, y + 16);
    ctx.lineTo(x + 10, y + 16);
    ctx.lineTo(x + 28 + open, y - 8);
    ctx.stroke();
    ctx.font = '900 12px ' + FONT;
    ctx.fillStyle = p.color;
    ctx.textAlign = 'center';
    ctx.fillText(p.short, x, y - 42);
    if (p.valley < 0) ctx.fillText('◀ LEFT', x, y + 40);
    else if (p.valley > 0) ctx.fillText('RIGHT ▶', x, y + 40);
    else ctx.fillText('AIM', x, y + 40);
    ctx.restore();
  });
}

function drawOdometer() {
  if (G.phase !== 'odometer' || !G.odo) return;
  const o = G.odo;
  const boxW = 72 * o.digits + 24;
  const boxH = 110;
  const x0 = (LW - boxW) / 2;
  const y0 = 250;
  roundRect(x0, y0, boxW, boxH, 14);
  ctx.fillStyle = 'rgba(4,8,16,0.94)';
  ctx.fill();
  ctx.strokeStyle = COL.amber;
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.font = '800 14px ' + FONT;
  ctx.fillStyle = COL.amber;
  ctx.textAlign = 'center';
  ctx.fillText('CASCADE-9 ODOMETER SURGE', LW / 2, y0 - 14);

  for (let i = 0; i < o.digits; i++) {
    const x = x0 + 12 + i * 72;
    roundRect(x, y0 + 16, 64, 78, 8);
    ctx.fillStyle = '#101820';
    ctx.fill();
    ctx.strokeStyle = '#3a5068';
    ctx.stroke();
    const fromD = Number(o.from[i]);
    const toD = Number(o.to[i]);
    const local = clamp((o.progress * o.digits) - i, 0, 1);
    const shown = o.done ? toD : (local <= 0 ? fromD : local >= 1 ? toD : Math.floor((fromD + (toD - fromD + 10) * local) % 10));
    // spinning illusion
    const spinDigit = o.done ? toD : Math.floor((fromD + local * 12) % 10);
    ctx.font = '900 42px ' + DISP;
    ctx.fillStyle = COL.good;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(o.done ? toD : spinDigit), x + 32, y0 + 55);
  }
}

  wrapText(G.diagnostic, LW / 2, 270, 860, 20, COL.ink);

function wrapText(text, x, y, maxW, lineH, color) {
  ctx.font = '800 16px ' + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  const words = text.split(' ');
  let line = '';
  let yy = y;
  words.forEach((w) => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW) {
      ctx.fillText(line, x, yy);
      line = w;
      yy += lineH;
    } else line = test;
  });
  if (line) ctx.fillText(line, x, yy);
}

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawReticle(p) {
  if (G.mode === 'play' && (G.phase === 'predict' || G.phase === 'roll' || G.phase === 'catch')) return;
  ctx.save();
  ctx.strokeStyle = p.color;
  ctx.fillStyle = p.color;
  ctx.lineWidth = 2;
  ctx.globalAlpha = p.shields > 0 ? 0.95 : 0.3;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(p.x - 24, p.y);
  ctx.lineTo(p.x - 10, p.y);
  ctx.moveTo(p.x + 10, p.y);
  ctx.lineTo(p.x + 24, p.y);
  ctx.moveTo(p.x, p.y - 24);
  ctx.lineTo(p.x, p.y - 10);
  ctx.moveTo(p.x, p.y + 10);
  ctx.lineTo(p.x, p.y + 24);
  ctx.stroke();
  ctx.font = '900 11px ' + FONT;
  ctx.textAlign = 'center';
  ctx.fillText(p.short, p.x, p.y - 28);
  ctx.restore();
}

function drawTitle() {
  ctx.textAlign = 'center';
  ctx.font = '900 54px ' + DISP;
  ctx.fillStyle = COL.cyan;
  ctx.fillText('GRAVITY WELL', LW / 2, 160);
  ctx.font = '800 22px ' + FONT;
  ctx.fillStyle = COL.amber;
  ctx.fillText('The Rounding Roller', LW / 2, 200);
  ctx.font = '800 16px ' + FONT;
  ctx.fillStyle = COL.ink;
  ctx.fillText('Primary 3–4 · Round to the nearest 10, 100, or 1 000 on a neon number-line hill', LW / 2, 240);
  ctx.fillStyle = COL.dim;
  ctx.fillText('Lock lower · upper · midpoint, predict the roll, catch the marble. Cascade-9 triggers the odometer!', LW / 2, 268);
  ctx.font = '800 14px ' + FONT;
  ctx.fillText('P1: Arrows + Space · P2: WASD + F · P3: IJKL + H · 8BitDo / Gamepad A to lock · M mute · P pause', LW / 2, 300);

  // mini preview hill
  ctx.save();
  ctx.translate(0, -30);
  ctx.globalAlpha = 0.55;
  ctx.beginPath();

    ctx.strokeStyle = hover ? COL.cyan : 'rgba(62,240,255,0.35)';

    ctx.fillStyle = COL.amber;
    ctx.fillText(card.kicker, card.x + card.w / 2, card.y + 28);

    ctx.fillStyle = COL.ink;
    ctx.fillText(card.title, card.x + card.w / 2, card.y + 56);

    ctx.fillStyle = COL.dim;

    ctx.font = '800 16px ' + FONT;
    ctx.fillStyle = COL.ink;
    ctx.fillText('+' + G.roundPts + ' GP' + (G.speedBonus ? ' · speed +' + G.speedBonus : ''), LW / 2, 280);
    ctx.fillStyle = COL.dim;
    ctx.fillText('Fire to continue', LW / 2, 310);
  }
}

function drawFxLayer() {
  fx.forEach((f) => {
    const a = 1 - f.t / f.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.arc(f.x, f.y, 3 + (1 - a) * 4, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(93,255,176,' + (G.flash * 0.25) + ')';
    ctx.fillRect(0, 0, LW, LH);
  }
}

function draw() {
  hotspots.length = 0;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = '#050814';
  ctx.fillRect(0, 0, view.cssW, view.cssH);
  ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale, view.dpr * view.ox, view.dpr * view.oy);
  ctx.clearRect(-40, -40, LW + 80, LH + 80);

  const shake = G.shake > 0 ? G.shake * 7 : 0;
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawBackdrop();
  if (G.mode !== 'title') {
    drawTrack();
    drawBall();
    drawCatchers();
    drawCalibrationUI();
    drawPredictBanner();
    drawOdometer();
    drawDiagnostic();
  }
  drawFxLayer();
  ctx.restore();

  players.forEach(drawReticle);
  if (G.mode === 'title') drawTitle();
  drawHUD();
  drawOverlay();
  G.shake = Math.max(0, G.shake - 0.05);
}

function frame(ts) {
  if (!frame.prev) frame.prev = ts;
  let dt = (ts - frame.prev) / 1000;
  frame.prev = ts;
  dt = clamp(dt, 0, 0.05);
  movePlayers(dt);
  const edges = consumeEdges();
  if (players.some((p) => p.startEdge)) {
    players.forEach((p) => { p.startEdge = false; });
    if (G.mode === 'play') G.mode = 'pause';
    else if (G.mode === 'pause') G.mode = 'play';
  }
  handleFire(edges);
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ---------- Events ---------- */

function onKeyDown(e) {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  held.add(e.code);
  audio.ensure();
  if (e.code === 'KeyM' && !e.repeat) audio.toggle();
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) {
    if (G.mode === 'play') G.mode = 'pause';
    else if (G.mode === 'pause') G.mode = 'play';
  }
  if (!e.repeat && G.mode === 'title') {
    if (e.code === 'Digit1') openCard('t1');
    if (e.code === 'Digit2') openCard('t2');
    if (e.code === 'Digit3') openCard('t3');
    if (e.code === 'Digit4') openCard('all');
  }
  if (!e.repeat && e.code === 'Enter' && (G.mode === 'victory' || G.mode === 'meltdown' || G.phase === 'success' || G.phase === 'fail' || (G.phase === 'odometer' && G.odo && G.odo.done))) {
    advanceOverlay();
  }
}

function onKeyUp(e) { held.delete(e.code); }

function onPointer(e) {
  const pt = toLogical(e.clientX, e.clientY);
  pointer.x = pt.x;
  pointer.y = pt.y;
  pointer.over = true;
  players[0].x = clamp(pt.x, 24, LW - 24);
  players[0].y = clamp(pt.y, 78, LH - 24);
  if (G.mode === 'play' && (G.phase === 'predict' || G.phase === 'roll' || G.phase === 'catch')) {
    const mid = (TRACK.x0 + TRACK.x1) / 2;
    players[0].valley = pt.x < mid - 40 ? -1 : pt.x > mid + 40 ? 1 : players[0].valley;
  }
}

function onPointerDown(e) {
  audio.ensure();
  onPointer(e);
  const spot = hotspots.slice().reverse().find((h) => hitRect(pointer.x, pointer.y, h, 0));
  if (spot && spot.id === 'mute') {
    audio.toggle();
    return;
  }
  if (G.mode === 'title') {
    const card = menuCards().find((item) => hitRect(pointer.x, pointer.y, item, 0));
    if (card) openCard(card.id);
    return;
  }
  if (G.mode === 'pause') {
    const hit = pauseButtons().find((item) => hitRect(pointer.x, pointer.y, item, 0));
    if (hit && hit.id === 'resume') G.mode = 'play';
    if (hit && hit.id === 'quit') leaveToTitle();
    return;
  }
  if (G.mode === 'victory' || G.mode === 'meltdown') {
    advanceOverlay();
    return;
  }
  players[0].fireEdge = true;
}

/* ---------- Self-test ---------- */

function runSelfTest() {
  const errors = [];
  const cases = [
    { n: 48, place: 10, lower: 40, upper: 50, mid: 45, rounded: 50 },
    { n: 62, place: 10, lower: 60, upper: 70, mid: 65, rounded: 60 },
    { n: 535, place: 10, lower: 530, upper: 540, mid: 535, rounded: 540 },
    { n: 796, place: 10, lower: 790, upper: 800, mid: 795, rounded: 800 },
    { n: 2483, place: 10, lower: 2480, upper: 2490, mid: 2485, rounded: 2480 },
    { n: 340, place: 100, lower: 300, upper: 400, mid: 350, rounded: 300 },
    { n: 785, place: 100, lower: 700, upper: 800, mid: 750, rounded: 800 },
    { n: 4525, place: 100, lower: 4500, upper: 4600, mid: 4550, rounded: 4500 },
    { n: 3982, place: 100, lower: 3900, upper: 4000, mid: 3950, rounded: 4000 },
    { n: 2184, place: 1000, lower: 2000, upper: 3000, mid: 2500, rounded: 2000 },
    { n: 48550, place: 1000, lower: 48000, upper: 49000, mid: 48500, rounded: 49000 },
    { n: 69999, place: 1000, lower: 69000, upper: 70000, mid: 69500, rounded: 70000 },
    { n: 24650, place: 1000, lower: 24000, upper: 25000, mid: 24500, rounded: 25000 }
  ];
  cases.forEach((c) => {
    const b = benchmarks(c.n, c.place);
    if (b.lower !== c.lower) errors.push('lower ' + c.n);
    if (b.upper !== c.upper) errors.push('upper ' + c.n);
    if (b.mid !== c.mid) errors.push('mid ' + c.n);
    if (b.rounded !== c.rounded) errors.push('round ' + c.n + ' got ' + b.rounded);
  });
  const p796 = buildProblem(796, 10, { prefix: '', suffix: '' });
  if (!p796.cascade) errors.push('cascade 796');
  const p69999 = buildProblem(69999, 1000, { prefix: '', suffix: '' });
  if (!p69999.cascade) errors.push('cascade 69999');
  const p535 = buildProblem(535, 10);
  if (!p535.exactMid || p535.side !== 'right') errors.push('midpoint boost 535');
  for (let i = 0; i < 10; i++) {
    [10, 100, 1000].forEach((place) => {
      const n = rollNumber(place, false);
      const b = benchmarks(n, place);
      if (b.rounded !== (n >= b.mid ? b.upper : b.lower)) errors.push('engine ' + n);
    });
  }
  for (let i = 0; i < 40; i++) {
    [10, 100, 1000].forEach((place) => {
      const n = i === 0 && place === 1000 ? 79109 : rollNumber(place, false);
      const b = benchmarks(n, place);
      [['lower', b.lower], ['upper', b.upper], ['mid', b.mid]].forEach((pair) => {
        const opts = distractors(pair[1], place, pair[0]);
        if (opts.length !== 4) errors.push('opt count ' + n + ' ' + pair[0]);
        if (!opts.includes(pair[1])) errors.push('missing correct ' + pair[0] + ' ' + pair[1]);
        if (new Set(opts).size !== opts.length) errors.push('dup opts ' + n + ' ' + pair[0]);
      });
    });
  }
  return errors;
}

G.testErrors = runSelfTest();
setLesson('info', 'Gravity Well', 'Choose a tier. Calibrate benchmarks, predict the roll, catch the marble.');
resize();
window.addEventListener('resize', resize);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
canvas.addEventListener('pointermove', onPointer);
canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', () => { pointer.down = false; });
window.addEventListener('gamepadconnected', () => audio.ensure());
requestAnimationFrame(frame);
</script>
