/* ---------------- rendering helpers ---------------- */

function roundRect(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function panel(x, y, w, h, radius) {
  const r = radius == null ? 12 : radius;
  roundRect(x, y, w, h, r);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, 'rgba(18, 40, 68, 0.96)');
  g.addColorStop(1, 'rgba(5, 10, 22, 0.96)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(140, 210, 245, 0.38)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(62, 224, 255, 0.92)';
  ctx.lineWidth = 2;
  const len = Math.min(12, Math.max(6, h * 0.22));
  const inset = 6;
  const corners = [
    [x + inset, y + inset, 1, 1],
    [x + w - inset, y + inset, -1, 1],
    [x + inset, y + h - inset, 1, -1],
    [x + w - inset, y + h - inset, -1, -1]
  ];
  corners.forEach(function (c) {
    ctx.beginPath();
    ctx.moveTo(c[0], c[1] + c[3] * len);
    ctx.lineTo(c[0], c[1]);
    ctx.lineTo(c[0] + c[2] * len, c[1]);
    ctx.stroke();
  });
}
function plate(x, y, w, h, r, fill) {
  roundRect(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.34)';
  ctx.lineWidth = 1.15;
  ctx.stroke();
}
function rivet(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 1.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fill();
}
function wrap(text, maxW) {
  const words = String(text || '').split(' ');
  const lines = [];
  let cur = '';
  for (let i = 0; i < words.length; i++) {
    const next = cur ? cur + ' ' + words[i] : words[i];
    if (cur && ctx.measureText(next).width > maxW) {
      lines.push(cur);
      cur = words[i];
    } else cur = next;
  }
  if (cur) lines.push(cur);
  return lines;
}
function fillLines(lines, x, y, lineH, align) {
  ctx.textAlign = align || 'left';
  lines.forEach(function (ln, i) { ctx.fillText(ln, x, y + i * lineH); });
}
function cardRects(step) {
  const duel = G.mode === 'duel';
  const h = duel ? UI.duelH : UI.soloH;
  const y = duel ? (step === 1 ? UI.duelY1 : UI.duelY2) : UI.soloY;
  const gap = 14;
  const inset = 18;
  const w = (VW - inset * 2 - gap * 3) / 4;
  const rects = [];
  for (let i = 0; i < 4; i++) rects.push({ x: inset + i * (w + gap), y: y, w: w, h: h });
  return rects;
}
function machineSlots(puzzle) {
  const n = puzzle.machines.length;
  const gap = n === 2 ? 180 : 70;
  const span = n === 2 ? 560 : 860;
  const x0 = (VW - span) / 2;
  const slots = [];
  for (let i = 0; i < n; i++) {
    slots.push({
      x: x0 + (n === 1 ? span / 2 : (span / (n - 1)) * i),
      y: UI.mechY + 58,
      s: n === 2 ? 0.78 : 0.68,
      machine: puzzle.machines[i],
      index: i
    });
  }
  if (n === 2) {
    slots[0].x = 420;
    slots[1].x = 860;
  }
  return slots;
}

function drawHex(x, y, r, fill, stroke) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;
    const px = x + Math.cos(a) * r;
    const py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
}

function measureSegments(row) {
  let units = 0;
  let more = 0;
  let less = 0;
  row.segments.forEach(function (s) {
    if (s.t === 'unit') units += s.n;
    if (s.t === 'more') more += s.v;
    if (s.t === 'less') less += s.v;
  });
  return { units: units, more: more, less: less };
}
function planRows(rows, unitValue, trackW) {
  const measured = rows.map(measureSegments);
  const safeUnit = unitValue > 0 ? unitValue : 1;
  const weights = measured.map(function (m) {
    return m.units + (m.more > 0 ? m.more / safeUnit : 0);
  });
  const longest = Math.max.apply(null, weights.concat([1]));
  let unitW = Math.min(52, trackW / longest);
  if (unitW < 24) unitW = 24;
  return measured.map(function (m) {
    let moreW = m.more > 0 ? (m.more / safeUnit) * unitW : 0;
    const used = m.units * unitW + moreW;
    if (used > trackW && moreW > 0) moreW = Math.max(10, trackW - m.units * unitW);
    const lessW = m.less > 0 ? Math.min(unitW * 0.82, Math.max(12, (m.less / safeUnit) * unitW)) : 0;
    return { units: m.units, unitW: unitW, moreW: moreW, lessW: lessW, more: m.more, less: m.less };
  });
}
function paintBarTag(x, y, w, h, text, ink, outside) {
  ctx.font = '700 12px ' + FONT;
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(text).width;
  if (w >= tw + 8) {
    ctx.fillStyle = ink;
    ctx.textAlign = 'center';
    ctx.fillText(text, x + w / 2, y + h / 2);
  } else {
    ctx.fillStyle = outside;
    ctx.textAlign = 'left';
    ctx.fillText(text, x + Math.max(w, 8) + 4, y + h / 2);
  }
}

function drawUnitBlocks(x, y, h, plan, accent, known) {
  let cursor = x;
  for (let i = 0; i < plan.units; i++) {
    roundRect(cursor, y, Math.max(8, plan.unitW - 4), h, 5);
    ctx.fillStyle = hexAlpha(accent, known ? 0.95 : 0.78);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.stroke();
    if (plan.unitW > 28) {
      ctx.fillStyle = '#07111f';
      ctx.font = '700 12px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('1u', cursor + (plan.unitW - 4) / 2, y + h / 2);
    }
    cursor += plan.unitW;
  }
  return cursor;
}

function drawRowTitle(row, x, midY) {

function drawTransfer(area, bars) {

  bars.now.forEach(function (row, i) {

  ctx.font = '700 13px ' + FONT;
  ctx.fillStyle = known ? COL.gold : COL.dim;
  ctx.textAlign = 'left';
  const footY = area.y + area.h - 14;
  ctx.fillText(known ? ('Total stays ' + fmt(bars.total)) : 'Total stays  ?', area.x + 16, footY);
  ctx.fillStyle = COL.dim;
  const goalLines = wrap(bars.goal, solved ? area.w - 460 : area.w - 290);
  ctx.fillText(goalLines[0] || '', area.x + 250, footY);
  if (solved) {
    ctx.fillStyle = COL.green;
    ctx.textAlign = 'right';
    ctx.fillText('END locked', area.x + area.w - 16, footY);
    ctx.textAlign = 'left';
  }
}

function drawGroup(area, bars) {
  const known = step1Done();
  bars.groups.forEach(function (group, i) {
    const y = area.y + 20 + i * 72;
    drawRowTitle(group, area.x + 16, y + 16);
    const unitW = 36;
    const maxShow = Math.min(group.count, 8);
    for (let n = 0; n < maxShow; n++) {
      const x = area.x + 230 + n * (unitW + 6);
      roundRect(x, y, unitW, 32, 5);
      ctx.fillStyle = hexAlpha(group.accent, 0.9);
      ctx.fill();
      ctx.fillStyle = '#07111f';
      ctx.font = '700 11px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillText('1u', x + unitW / 2, y + 16);
      if (group.extra && !group.fewer) {
        ctx.fillStyle = COL.gold;
        ctx.fillRect(x + unitW - 8, y - 6, 10, 8);
      }
      if (group.extra && group.fewer) hatch(x + unitW - 12, y, 12, 32);
    }
    if (group.count > maxShow) {
      ctx.fillStyle = COL.dim;
      ctx.textAlign = 'left';
      ctx.font = '700 12px ' + FONT;
      ctx.fillText('+' + (group.count - maxShow), area.x + 230 + maxShow * (unitW + 6), y + 16);
    }
  });
  ctx.textBaseline = 'alphabetic';
  drawBracket(area.x + 230, area.y + area.h - 56, 36, known ? ('1u = ' + fmt(bars.unitValue)) : '1u = ?');
  ctx.fillStyle = COL.dim;
  ctx.font = '600 13px ' + FONT;
  ctx.textAlign = 'left';
  const lines = wrap(bars.footnote, area.w - 40);
  ctx.fillText(lines[0] || '', area.x + 16, area.y + area.h - 16);
}

function drawBars() {
  panel(UI.barX, UI.barY, UI.barW, UI.barH, 12);
  if (!G.puzzle) return;
  const bars = G.puzzle.bars;
  if (bars.mode === 'compare') drawCompareRows({ x: UI.barX, y: UI.barY, w: UI.barW, h: UI.barH }, bars);
  else if (bars.mode === 'equalize') drawEqualize({ x: UI.barX, y: UI.barY, w: UI.barW, h: UI.barH }, bars);
  else if (bars.mode === 'transfer') drawTransfer({ x: UI.barX, y: UI.barY, w: UI.barW, h: UI.barH }, bars);
  else if (bars.mode === 'group') drawGroup({ x: UI.barX, y: UI.barY, w: UI.barW, h: UI.barH }, bars);
  if (bars.mode === 'compare') {
    const known = step1Done();
    const prefix = known ? ('1u = ' + fmt(bars.unitValue) + ' ' + (G.puzzle.flavor.unit) + '. ') : '1u = ?. ';
    ctx.font = '600 13px ' + FONT;
    ctx.fillStyle = known ? COL.gold : COL.dim;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(prefix + bars.footnote, UI.barX + 16, UI.barY + UI.barH - 14);
  }
}

function drawTip() {
  panel(UI.tipX, UI.tipY, UI.tipW, UI.tipH, 10);
  ctx.save();
  ctx.beginPath();
  ctx.rect(UI.tipX + 8, UI.tipY + 4, UI.tipW - 16, UI.tipH - 8);
  ctx.clip();
  let size = 15;
  ctx.font = '600 ' + size + 'px ' + FONT;
  let lines = wrap(G.tip || '', UI.tipW - 36);
  if (lines.length > 2) {
    size = 13;
    ctx.font = '600 13px ' + FONT;
    lines = wrap(G.tip || '', UI.tipW - 36);
  }
  const shown = lines.slice(0, 3);
  const lineH = size + 2;
  const block = shown.length * lineH;
  let y = UI.tipY + (UI.tipH - block) / 2 + size - 1;
  ctx.fillStyle = G.tipColor || COL.dim;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  shown.forEach(function (ln, i) { ctx.fillText(ln, UI.tipX + 16, y + i * lineH); });
  ctx.restore();
}

function keyLegend(index) {
  if (G.mode === 'duel') {
    const bits = [];
    for (let p = 0; p < G.playersN; p++) bits.push(PILOT[p].keys[index]);
    return bits.join(' ');
  }
  if (G.mode === 'coop') return PILOT[activePilot()].keys[index];
  return PILOT[0].keys[index];
}

function drawCards() {
  const steps = G.mode === 'duel' ? [1, 2] : [G.step];
  steps.forEach(function (step) {
    const rects = cardRects(step);
    const options = step === 1 ? G.options1 : G.options2;
    const revealCorrect = (G.mode !== 'duel' && ((step === 1 && G.after === 'step2') || (step === 2 && G.surge > 0)))
      || (G.mode === 'duel' && G.winner >= 0 && step === 2);
    rects.forEach(function (r, i) {
      const opt = options[i];
      if (!opt) return;
      const hovered = G.hover === i && G.hoverStep === step;
      const selectedSolo = G.mode !== 'duel' && G.cursor === i && step === G.step;
      const miss = G.badFlash && G.badFlash.step === step && G.badFlash.index === i && G.time < G.badFlash.until;
      roundRect(r.x, r.y, r.w, r.h, 14);
      const cardFill = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      if (miss) {
        cardFill.addColorStop(0, 'rgba(128, 28, 46, 0.98)');
        cardFill.addColorStop(1, 'rgba(42, 8, 18, 0.98)');
      } else if (opt.correct && revealCorrect) {
        cardFill.addColorStop(0, 'rgba(32, 118, 74, 0.98)');
        cardFill.addColorStop(1, 'rgba(8, 42, 30, 0.98)');
      } else {
        cardFill.addColorStop(0, 'rgba(32, 64, 104, 0.98)');
        cardFill.addColorStop(1, 'rgba(7, 14, 28, 0.98)');
      }
      ctx.fillStyle = cardFill;
      ctx.fill();
      ctx.lineWidth = hovered || selectedSolo ? 3 : 1.5;
      ctx.strokeStyle = miss ? COL.red : (opt.correct && revealCorrect ? COL.green : (hovered || selectedSolo ? COL.cyan : 'rgba(150,200,230,0.4)'));
      ctx.stroke();
      const tick = 8;
      ctx.strokeStyle = hexAlpha(miss ? COL.red : (opt.correct && revealCorrect ? COL.green : COL.cyan), 0.8);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(r.x + 8, r.y + 8 + tick);
      ctx.lineTo(r.x + 8, r.y + 8);
      ctx.lineTo(r.x + 8 + tick, r.y + 8);
      ctx.moveTo(r.x + r.w - 8, r.y + 8 + tick);
      ctx.lineTo(r.x + r.w - 8, r.y + 8);
      ctx.lineTo(r.x + r.w - 8 - tick, r.y + 8);
      ctx.stroke();
      if (G.mode === 'duel') {
        G.duelists.forEach(function (d, p) {
          if (d.out || d.done || d.stun > 0) return;
          if (d.step === step && d.cursor === i) {
            ctx.strokeStyle = PILOT[p].color;
            ctx.lineWidth = 3;
            ctx.strokeRect(r.x + 3 + p, r.y + 3 + p, r.w - 6 - p * 2, r.h - 6 - p * 2);
          }
        });
        ctx.font = '700 11px ' + FONT;
        ctx.fillStyle = COL.dim;
        ctx.textAlign = 'left';
        ctx.fillText(step === 1 ? 'STEP 1' : 'STEP 2', r.x + 12, r.y + 16);
      }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const num = fmt(opt.value);
      const cx = r.x + r.w / 2;
      const cy = r.y + r.h * (G.mode === 'duel' ? 0.48 : 0.46);
      ctx.beginPath();
      ctx.arc(cx, cy, G.mode === 'duel' ? 20 : 34, 0, Math.PI * 2);
      ctx.strokeStyle = hexAlpha(COL.gold, hovered || selectedSolo ? 0.85 : 0.4);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.font = '700 ' + (num.length > 5 ? 28 : (G.mode === 'duel' ? 32 : 46)) + 'px ' + FONT;
      ctx.fillStyle = COL.ink;
      ctx.fillText(num, cx, cy);
      ctx.font = '700 13px ' + FONT;
      ctx.fillStyle = COL.gold;
      ctx.fillText(G.puzzle ? G.puzzle.flavor.unit : '', r.x + r.w / 2, r.y + r.h * (G.mode === 'duel' ? 0.72 : 0.66));
      ctx.font = '700 13px ' + FONT;
      ctx.fillStyle = COL.dim;
      ctx.fillText(keyLegend(i), r.x + r.w / 2, r.y + r.h - (G.mode === 'duel' ? 14 : 22));
    });
  });
  ctx.textBaseline = 'alphabetic';
}

function drawFX() {
  G.particles.forEach(function (p) {
    const t = 1 - p.age / p.life;
    ctx.globalAlpha = Math.max(0, t);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  G.floaters.forEach(function (f) {
    ctx.globalAlpha = Math.max(0, 1 - f.age / f.life);
    ctx.fillStyle = f.color;
    ctx.font = '700 28px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  });
  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(255, 236, 180, ' + (G.flash * 0.35) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
}

function drawTitle() {
  drawBackground();
  drawHUD();
  ctx.textAlign = 'center';
  ctx.fillStyle = COL.cyan;
  ctx.font = '700 13px ' + FONT;
  ctx.fillText('SINGAPORE PRIMARY 3–4  ·  COMPARISON BAR MODELS', VW / 2, 70);
  ctx.fillStyle = COL.ink;
  ctx.font = '700 46px ' + FONT;
  ctx.fillText('POWER-CORE FORGE', VW / 2, 112);
  ctx.fillStyle = COL.gold;
  ctx.font = '700 16px ' + FONT;
  ctx.fillText('Solve the bar. Charge the core.', VW / 2, 138);
  const showcase = [
    { kind: 'jet', accent: '#d7b4ff', name: 'Valkyrie' },
    { kind: 'tank', accent: '#ffb020', name: 'Titan' },
    { kind: 'mech', accent: '#7ee0ff', name: 'Vanguard' },
    { kind: 'drone', accent: '#3dff9a', name: 'Scout' }
  ];
  showcase.forEach(function (m, i) {
    const x = 250 + i * 220;
    drawMachine(m.kind, x, 172, 0.48, m.accent, false);
  });

  ctx.font = '700 12px ' + FONT;
  ctx.fillStyle = COL.dim;
  ctx.textAlign = 'left';
  ctx.fillText('PILOTS', 78, 238);
  ctx.fillText('MODE', 78, 322);
  ctx.fillText('DIFFICULTY', 78, 408);

  const rows = titleRows();
  rows.forEach(function (row, r) {
    row.forEach(function (cell, c) {
      const item = cell.item;
      const focused = G.focus.row === r && G.focus.col === c;
      let selected = false;
      let label = '';
      let sub = '';
      if (item.type === 'players') {
        selected = G.playersN === item.n;
        label = item.n + (item.n === 1 ? ' PILOT' : ' PILOTS');
      } else if (item.type === 'mode') {
        selected = G.mode === item.mode;
        label = item.mode === 'solo' ? 'SOLO' : (item.mode === 'coop' ? 'TEAM CO-OP' : 'MECHA DUEL');
      } else if (item.type === 'diff') {
        selected = G.difficulty === item.d;
        const info = DIFFS.filter(function (d) { return d.id === item.d; })[0];
        label = info.label;
        sub = info.rank;
      } else {
        label = 'START FORGE';
        selected = true;
      }
      const enabled = item.enabled !== false;
      roundRect(cell.rect.x, cell.rect.y, cell.rect.w, cell.rect.h, 12);
      ctx.globalAlpha = enabled ? 1 : 0.35;
      ctx.fillStyle = selected ? 'rgba(62,224,255,0.16)' : 'rgba(8,18,36,0.88)';
      ctx.fill();
      ctx.lineWidth = focused ? 3 : 1.5;
      ctx.strokeStyle = focused ? COL.gold : (selected ? COL.cyan : COL.line);
      ctx.stroke();
      ctx.fillStyle = COL.ink;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 ' + (item.type === 'start' ? 22 : 16) + 'px ' + FONT;
      ctx.fillText(label, cell.rect.x + cell.rect.w / 2, cell.rect.y + (sub ? 22 : cell.rect.h / 2));
      if (sub) {
        ctx.font = '600 12px ' + FONT;
        ctx.fillStyle = COL.gold;
        ctx.fillText(sub, cell.rect.x + cell.rect.w / 2, cell.rect.y + 44);
      }
      ctx.globalAlpha = 1;
    });
  });

  const info = DIFFS.filter(function (d) { return d.id === G.difficulty; })[0];
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  ctx.font = '600 15px ' + FONT;
  ctx.fillStyle = '#d5e4f4';
  ctx.fillText(info.blurb, VW / 2, 470);
  ctx.font = '600 14px ' + FONT;
  ctx.fillStyle = COL.gold;
  const noteLines = wrap(G.note, 900);
  ctx.fillText(noteLines[0] || '', VW / 2, 574);

  ctx.textAlign = 'left';
  ctx.font = '600 14px ' + FONT;
  ctx.fillStyle = COL.dim;
  const colX = [80, 500, 900];
  const blocks = [
    ['P1 CRIMSON', 'Mouse, 1 2 3 4, arrows + Space', 'Gamepad 0 · D-pad + A'],
    ['P2 AZURE', 'Q W E R', 'Gamepad 1 · D-pad + A'],
    ['P3 EMERALD', 'U I O P', 'Gamepad 2 · D-pad + A']
  ];
  blocks.forEach(function (lines, i) {
    ctx.fillStyle = PILOT[i].color;
    ctx.font = '700 14px ' + FONT;
    ctx.fillText(lines[0], colX[i], 630);
    ctx.fillStyle = COL.dim;
    ctx.font = '600 13px ' + FONT;
    ctx.fillText(lines[1], colX[i], 652);
    ctx.fillText(lines[2], colX[i], 672);
  });
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c5d7ea';
  ctx.font = '600 14px ' + FONT;
  ctx.fillText('Co-op shows one team score. Pilots rotate Step 1 and Step 2. Duel: first to lock both steps wins the star. M mutes.', VW / 2, 720);
  ctx.fillStyle = COL.gold;
  ctx.fillText('Best solo ' + fmt(G.bestSolo) + '    ·    Best team ' + fmt(G.bestCoop), VW / 2, 752);
  ctx.fillStyle = COL.dim;
  ctx.font = '600 12px ' + FONT;
  ctx.fillText('8BitDo pads: set XInput so the bottom button is A. Wrong cards cost a Core Shield, or 1 Lane Life in a duel.', VW / 2, 778);
}

function drawPlay() {
  drawBackground();
  ctx.save();
  if (G.shake > 0.2) {
    const s = G.shake;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }
  drawHUD();
  drawBanner();
  drawMachines();
  drawBars();
  drawTip();
  drawCards();
  drawFX();
  if (G.mode === 'duel') {
    G.duelists.forEach(function (d, i) {
      if (d.stun > 0 && !d.out) {
        ctx.fillStyle = hexAlpha(PILOT[i].color, 0.12);
        ctx.fillRect(0, 0, VW, VH);
      }
    });
  }
  ctx.restore();
}

function drawResults() {
  drawBackground();
  drawHUD();
  const stats = G.stats || { score: 0, correct: 0, wrong: 0, round: 1, reason: '', combo: 0, shields: 0, shieldsMax: 0, duel: [] };
  const attempts = stats.correct + stats.wrong;
  const accuracy = attempts ? Math.round(100 * stats.correct / attempts) : 0;
  ctx.textAlign = 'center';
  ctx.fillStyle = COL.cyan;
  ctx.font = '700 14px ' + FONT;
  ctx.fillText(stats.reason ? stats.reason.toUpperCase() : 'FORGE STABLE', VW / 2, 120);
  ctx.fillStyle = COL.ink;
  ctx.font = '700 48px ' + FONT;
  if (G.mode === 'duel') {
    const ranked = stats.duel.map(function (d, i) { return { i: i, stars: d.stars, score: d.score }; });
    ranked.sort(function (a, b) { return b.stars - a.stars || b.score - a.score; });
    const top = ranked[0];
    const tied = ranked.filter(function (r) { return r.stars === top.stars && r.score === top.score; });
    const title = tied.length > 1 ? 'PILOTS TIE THE BAY' : (PILOT[top.i].call + ' TAKES THE BAY');
    ctx.fillText(title, VW / 2, 180);
    ranked.forEach(function (r, idx) {
      const y = 250 + idx * 70;
      ctx.fillStyle = PILOT[r.i].color;
      ctx.font = '700 24px ' + FONT;
      ctx.fillText(PILOT[r.i].name + '  ' + PILOT[r.i].call + '    ★ ' + r.stars + '    ♥ ' + stats.duel[r.i].lives + '    speed ' + fmt(r.score), VW / 2, y);
    });
  } else {
    ctx.fillText(G.mode === 'coop' ? 'TEAM SCORE  ' + fmt(stats.score) : fmt(stats.score), VW / 2, 190);
    ctx.font = '600 20px ' + FONT;
    ctx.fillStyle = COL.dim;
    ctx.fillText(G.mode === 'coop' ? 'One squadron. Shared shields.' : 'Forge points', VW / 2, 230);
    if (G.mode === 'coop') {
      const names = [];
      for (let i = 0; i < G.playersN; i++) names.push(PILOT[i].call);
      ctx.fillStyle = COL.ink;
      ctx.fillText('Squadron  ' + names.join('   '), VW / 2, 280);
    }
  }
  ctx.font = '600 18px ' + FONT;
  ctx.fillStyle = '#d5e4f4';
  ctx.fillText('Accuracy ' + accuracy + '%    ·    ' + stats.correct + ' locks    ·    ' + stats.wrong + ' overloads', VW / 2, G.mode === 'duel' ? 480 : 340);
  ctx.fillText('Reached round ' + stats.round + ' of ' + ROUNDS + (G.difficulty === 'extreme' ? '    ·    best combo ×' + (stats.combo >= 2 ? 3 : stats.combo === 1 ? 2 : 1) : ''), VW / 2, G.mode === 'duel' ? 514 : 374);
  if (G.mode !== 'duel') {
    ctx.fillText('Shields left  ' + stats.shields + ' / ' + stats.shieldsMax, VW / 2, 414);
    ctx.fillStyle = COL.gold;
    ctx.fillText(G.mode === 'solo' ? ('Best solo  ' + fmt(G.bestSolo)) : ('Best team  ' + fmt(G.bestCoop)), VW / 2, 460);
  }
  resultButtons().forEach(function (b) {
    roundRect(b.rect.x, b.rect.y, b.rect.w, b.rect.h, 14);
    ctx.fillStyle = b.id === 'again' ? 'rgba(62,224,255,0.16)' : 'rgba(8,18,36,0.9)';
    ctx.fill();
    ctx.strokeStyle = b.id === 'again' ? COL.cyan : COL.line;
    ctx.stroke();
    ctx.fillStyle = COL.ink;
    ctx.font = '700 18px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.id === 'again' ? 'FORGE AGAIN' : 'TITLE SCREEN', b.rect.x + b.rect.w / 2, b.rect.y + b.rect.h / 2);
  });
  ctx.textBaseline = 'alphabetic';
  ctx.font = '600 14px ' + FONT;
  ctx.fillStyle = COL.dim;
  ctx.fillText('Enter forges again. Escape returns to the title.', VW / 2, 700);
}

function updateHover() {
  G.hover = -1;
  G.hoverStep = 0;
  if (!pointer.inside || G.scene !== 'play') return;
  if (G.mode === 'duel') {
    if (!G.duelists[0] || G.duelists[0].out) return;
    const step = G.duelists[0].step;
    const rects = cardRects(step);
    for (let i = 0; i < 4; i++) if (hit(rects[i], pointer)) { G.hover = i; G.hoverStep = step; }
    return;
  }
  const rects = cardRects(G.step);
  for (let i = 0; i < 4; i++) if (hit(rects[i], pointer)) { G.hover = i; G.hoverStep = G.step; }
}

function update(dt) {
  G.time += dt;
  if (G.scene === 'play') {
    if (G.gate > 0) {
      G.gate -= dt;
      if (G.gate <= 0) {
        G.gate = 0;
        resolveGate();
      }
    } else if (G.timerOn && !G.hidden) {
      G.timer -= dt;
      if (G.timer <= 0) timeoutRound();
    }
    if (G.mode === 'duel') {
      G.duelists.forEach(function (d) { if (d.stun > 0) d.stun = Math.max(0, d.stun - dt); });
    }
    const goal = step1Done() ? 1 : 0;
    G.charge = lerp(G.charge, goal, REDUCE ? 1 : 0.08);
    G.shake *= 0.86;
    G.flash = Math.max(0, G.flash - dt);
    for (let i = G.particles.length - 1; i >= 0; i--) {
      const p = G.particles[i];
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 40 * dt;
      if (p.age >= p.life) G.particles.splice(i, 1);
    }
    if (G.particles.length > 260) G.particles.splice(0, G.particles.length - 260);
    for (let i = G.floaters.length - 1; i >= 0; i--) {
      const f = G.floaters[i];
      f.age += dt;
      f.y -= 26 * dt;
      if (f.age >= f.life) G.floaters.splice(i, 1);
    }
  }
}

function frame(ts) {
  try {
    if (!frame.prev) frame.prev = ts;
    const dt = clamp((ts - frame.prev) / 1000, 0, 0.05);
    frame.prev = ts;
    pollPads();
    audio.tickMusic();
    const clicked = clickEdge;
    clickEdge = null;
    if (G.scene === 'title') consumeTitle(clicked);
    else if (G.scene === 'results') consumeResults(clicked);
    else consumePlay(clicked);
    update(dt);
    updateHover();
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = '#050914';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);
    if (fatal) {
      ctx.fillStyle = '#fff';
      ctx.font = '16px ' + FONT;
      ctx.fillText(fatal, 40, 40);
    } else if (G.scene === 'title') drawTitle();
    else if (G.scene === 'results') drawResults();
    else drawPlay();
    keyEdge.clear();
  } catch (err) {
    fatal = String(err && err.stack || err);
  }
  if (!window.__PCF_TEST) requestAnimationFrame(frame);
}

window.addEventListener('error', function (e) { fatal = String(e.message || e); });

window.__PCF = {
  G: G,
  createPuzzle: createPuzzle,
  invariantError: invariantError,
  buildOptions: buildOptions,
  compose: compose,
  rollRaw: rollRaw
};

if (!window.__PCF_TEST) {
  resize();
  requestAnimationFrame(frame);
}
</script>
