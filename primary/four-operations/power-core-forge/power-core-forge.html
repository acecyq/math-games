function readBest(key) {
  try { return Number(window.localStorage.getItem(key)) || 0; }
  catch (e) { return 0; }
}
function writeBest(key, value) {
  try { window.localStorage.setItem(key, String(value)); }

}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) {
  if (b < a) { const t = a; a = b; b = t; }
  return a + Math.floor(Math.random() * (b - a + 1));
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { const t = a % b; a = b; b = t; }
  return a || 1;
}
function fmt(n) {
  const v = Math.round(n);
  const s = String(Math.abs(v));
  const withCommas = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (v < 0 ? '-' : '') + withCommas;
}
function isInt(n) { return typeof n === 'number' && Number.isInteger(n); }
function hexAlpha(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function modeOk(mode) {
  if (mode === 'solo') return G.playersN === 1;
  return G.playersN >= 2;
}
function fixMode() {
  if (G.playersN === 1) G.mode = 'solo';
  else if (G.mode === 'solo') G.mode = 'coop';
}

function announce(text) {

}

const audio = {
  ctx: null,
  master: null,
  nextAt: 0,
  step: 0,
  noise: null,
  ensure() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = G.muted ? 0 : 0.22;
    this.master.connect(this.ctx.destination);
    const seconds = 1;
    const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * seconds, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    this.noise = buffer;
    G.audioReady = true;
  },
  resume() {
    this.ensure();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  setMuted(m) {
    G.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.22;
  },
  tone(freq, dur, type, vol, delay) {
    if (!this.ctx || G.muted || !freq) return;
    const t = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.02);
  },
  sweep(a, b, dur, vol) {
    if (!this.ctx || G.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(a, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, b), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.02);
  },
  burst(dur, vol, freq) {
    if (!this.ctx || G.muted || !this.noise) return;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noise;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq || 1400;
    const g = this.ctx.createGain();
    const t = this.ctx.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter);
    filter.connect(g);
    g.connect(this.master);
    src.start(t);
    src.stop(t + dur);
  },
  tickMusic() {
    if (!this.ctx || G.muted) return;
    const pattern = [
      [110, 'square', 0.04, 0.15],
      null,
      [220, 'square', 0.028, 0.08],
      [277.18, 'triangle', 0.03, 0.09],
      [164.81, 'square', 0.035, 0.14],
      null,
      [329.63, 'square', 0.024, 0.08],
      [220, 'triangle', 0.028, 0.1],
      [98, 'square', 0.042, 0.16],
      null,
      [246.94, 'square', 0.026, 0.08],
      [311.13, 'triangle', 0.028, 0.09],
      [196, 'square', 0.034, 0.14],
      null,
      [392, 'square', 0.02, 0.07],
      [164.81, 'triangle', 0.026, 0.1]
    ];
    const horizon = this.ctx.currentTime + 0.28;
    if (!this.nextAt || this.nextAt < this.ctx.currentTime - 0.05) this.nextAt = this.ctx.currentTime + 0.05;
    while (this.nextAt < horizon) {
      const note = pattern[this.step % pattern.length];
      if (note && G.scene !== 'title') this.tone(note[0], note[3], note[1], note[2], this.nextAt - this.ctx.currentTime);
      else if (note && G.scene === 'title' && this.step % 4 === 0) this.tone(note[0] * 0.5, 0.18, 'triangle', 0.02, this.nextAt - this.ctx.currentTime);
      this.nextAt += 0.18;
      this.step = (this.step + 1) % pattern.length;
    }
  }
};

const sfx = {
  unlock() { audio.resume(); },
  tick() { audio.tone(740, 0.04, 'square', 0.03); },
  snap() {
    audio.tone(520, 0.07, 'square', 0.06);
    audio.tone(780, 0.09, 'triangle', 0.05, 0.05);
  },
  charge() { audio.sweep(180, 620, 0.28, 0.05); },
  blast() {
    audio.burst(0.18, 0.08, 900);
    audio.tone(196, 0.2, 'sawtooth', 0.05);
    audio.tone(784, 0.16, 'square', 0.04, 0.02);
  },
  buzz() {
    audio.tone(92, 0.16, 'sawtooth', 0.06);
    audio.tone(70, 0.18, 'square', 0.04, 0.01);
    audio.burst(0.12, 0.05, 220);
  },
  fanfare() {
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      audio.tone(f, 0.22, 'square', 0.05, i * 0.09);
      audio.tone(f * 0.5, 0.22, 'triangle', 0.03, i * 0.09);
    });
  }
};

function toggleMute() {
  sfx.unlock();

}

/* ---------------- input ---------------- */

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.dpr = dpr;
  view.scale = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  view.ox = (window.innerWidth - VW * view.scale) / 2;
  view.oy = (window.innerHeight - VH * view.scale) / 2;
  canvas.width = Math.max(1, Math.round(window.innerWidth * dpr));
  canvas.height = Math.max(1, Math.round(window.innerHeight * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function toWorld(cx, cy) {
  return {
    x: (cx - view.ox) / view.scale,
    y: (cy - view.oy) / view.scale
  };
}
function hit(r, p) {
  return !!r && !!p && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}
function muteRect() { return { x: 1186, y: 10, w: 78, h: 32 }; }

window.addEventListener('resize', resize);
window.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  keysDown.add(e.code);
  keyEdge.add(e.code);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].indexOf(e.code) >= 0) e.preventDefault();
  sfx.unlock();
  if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', function (e) { keysDown.delete(e.code); });
canvas.addEventListener('pointerdown', function (e) {
  const p = toWorld(e.clientX, e.clientY);
  pointer.x = p.x; pointer.y = p.y; pointer.inside = true;
  clickEdge = { x: p.x, y: p.y };
  sfx.unlock();
});
canvas.addEventListener('pointermove', function (e) {
  const p = toWorld(e.clientX, e.clientY);
  pointer.x = p.x; pointer.y = p.y;
  pointer.inside = p.x >= 0 && p.y >= 0 && p.x <= VW && p.y <= VH;
});
canvas.addEventListener('pointerleave', function () { pointer.inside = false; });
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('visibilitychange', function () { G.hidden = document.hidden; });

function pollPads() {
  const list = (navigator.getGamepads && navigator.getGamepads()) || [];
  for (let i = 0; i < 3; i++) {
    const p = list[i];
    padEdge[i] = null;
    if (!p) { padPrev[i] = {}; continue; }
    const b = p.buttons || [];
    const ax = p.axes || [];
    const pressed = function (idx) { return !!(b[idx] && (b[idx].pressed || b[idx].value > 0.5)); };
    const now = {
      left: pressed(14) || (ax[0] || 0) < -0.55,
      right: pressed(15) || (ax[0] || 0) > 0.55,
      up: pressed(12) || (ax[1] || 0) < -0.55,
      down: pressed(13) || (ax[1] || 0) > 0.55,
      A: pressed(0)
    };
    const prev = padPrev[i] || {};
    padEdge[i] = {
      left: now.left && !prev.left,
      right: now.right && !prev.right,
      up: now.up && !prev.up,
      down: now.down && !prev.down,
      A: now.A && !prev.A
    };
    if (now.A || now.left || now.right || now.up || now.down) sfx.unlock();
    padPrev[i] = now;
  }
}

/* ---------------- language ---------------- */

function compareClause(flavor, name, amount, other, dir) {
  const n = fmt(amount);
  if (flavor.id === 'cm') {
    return name + ' is ' + n + ' cm ' + (dir === 'more' ? 'longer' : 'shorter') + ' than ' + other;
  }
  if (flavor.id === 'marks') {
    return name + ' scores ' + n + ' ' + (dir === 'more' ? 'more' : 'fewer') + ' marks than ' + other;
  }
  if (flavor.id === 'cells') {
    return name + ' has ' + n + ' ' + (dir === 'more' ? 'more' : 'fewer') + ' power cells than ' + other;
  }
  return name + ' has ' + n + ' MW ' + (dir === 'more' ? 'more' : 'less') + ' power than ' + other;
}
function totalClause(flavor, total, subject) {
  const n = fmt(total);
  const who = subject || 'They';
  if (flavor.id === 'cm') return who + ' have a total length of ' + n + ' cm';
  if (flavor.id === 'marks') return who + ' have ' + n + ' marks altogether';
  if (flavor.id === 'cells') return who + ' have ' + n + ' power cells altogether';
  return who + ' have ' + n + ' MW of power altogether';
}
function holds(flavor, name, amount) {
  const n = fmt(amount);
  if (flavor.id === 'cm') return name + ' is ' + n + ' cm long';
  if (flavor.id === 'marks') return name + ' has ' + n + ' marks';
  if (flavor.id === 'cells') return name + ' has ' + n + ' power cells';
  return name + ' has ' + n + ' MW';
}
function findMachine(flavor, name) {
  const named = String(name || '');
  const asOf = named.indexOf('the ') === 0;
  if (flavor.id === 'cm') return asOf ? ('Find the length of ' + named) : ('Find ' + named + "'s length");
  if (flavor.id === 'marks') return asOf ? ('Find the marks of ' + named) : ('Find ' + named + "'s marks");
  if (flavor.id === 'cells') return 'Find how many power cells ' + named + ' has';
  return asOf ? ('Find the power of ' + named) : ('Find ' + named + "'s power");
}
function enterMachine(flavor, machine) {
  const who = machineLabel(machine);
  if (flavor.id === 'cm') return 'Enter ' + who + "'s length.";
  if (flavor.id === 'marks') return 'Enter ' + who + "'s marks.";
  if (flavor.id === 'cells') return 'Enter ' + who + "'s cells.";
  return 'Enter ' + who + "'s power.";
}
function machineLabel(machine) {
  if (!machine) return '';
  if (typeof machine === 'string') return machine;
  return machine.name || '';
}
function gapBits(flavor, amount, dir) {
  const n = fmt(amount);
  const more = dir === 'more';
  if (flavor.id === 'cm') return n + ' cm ' + (more ? 'longer' : 'shorter');
  if (flavor.id === 'marks') return n + (more ? ' more' : ' fewer') + ' marks';
  if (flavor.id === 'cells') return n + (more ? ' more' : ' fewer') + ' cells';
  return n + ' MW ' + (more ? 'more' : 'less');
}
function vsLine(flavor, who, amount, other, dir) {
  return machineLabel(who) + ' — ' + gapBits(flavor, amount, dir) + ' than ' + machineLabel(other);
}
function amountLine(flavor, machine, amount) {
  return machineLabel(machine) + ': ' + fmt(amount) + ' ' + flavor.unit;
}
function totalLine(flavor, total) {
  return 'Total: ' + fmt(total) + ' ' + flavor.unit;
}
function timesBits(flavor, mult) {
  const word = mult === 2 ? 'twice' : (mult + ' times');
  if (flavor.id === 'cm') return word + ' as long as';
  if (flavor.id === 'mw') return word + ' as much power as';
  if (flavor.id === 'marks') return word + ' as many marks as';
  return word + ' as many cells as';
}
function timesLine(flavor, big, small, mult) {
  return machineLabel(big) + ' — ' + timesBits(flavor, mult) + ' ' + machineLabel(small);
}
function adjustTail(flavor, amount, fewer) {
  const n = fmt(amount);
  if (fewer) {
    if (flavor.id === 'cm') return 'but ' + n + ' cm shorter';
    if (flavor.id === 'marks') return 'but ' + n + ' fewer marks';
    if (flavor.id === 'cells') return 'but ' + n + ' fewer cells';
    return 'but ' + n + ' MW less';
  }
  if (flavor.id === 'cm') return 'plus ' + n + ' cm longer';
  if (flavor.id === 'marks') return 'plus ' + n + ' more marks';
  if (flavor.id === 'cells') return 'plus ' + n + ' more cells';
  return 'plus ' + n + ' MW more';
}
function findLine(flavor, name) {
  if (flavor.id === 'cm') return 'Find ' + name + "'s length";
  if (flavor.id === 'marks') return 'Find ' + name + "'s marks";
  if (flavor.id === 'cells') return 'Find ' + name + "'s cells";
  return 'Find ' + name + "'s power";
}
function findTotalLine(flavor, who) {
  const what = flavor.id === 'cm' ? 'length' : (flavor.id === 'marks' ? 'marks' : (flavor.id === 'cells' ? 'cells' : 'power'));
  return who ? ('Find total ' + what + ' of ' + who) : ('Find the total ' + what);
}
function factLine(text) { return { text: text, ask: false }; }
function askLine(text) { return { text: text, ask: true }; }
function joinPoints(points) {
  return points.map(function (p) { return p.text; }).join('. ') + '.';
}
function copyLabel(n, machine) {
  const name = machineLabel(machine);
  if (n === 1) return name;
  return n + ' ' + (/s$/i.test(name) ? name : name + 's');
}
function endMultipleClause(big, small, flavor, mult) {

  if (flavor.id === 'cm') return big + ' is ' + word + ' as long as ' + small;
  if (flavor.id === 'mw') return big + ' has ' + word + ' as much power as ' + small;
  if (flavor.id === 'marks') return big + ' has ' + word + ' as many marks as ' + small;

}
function endGapClause(large, small, flavor, gap) {
  const n = fmt(gap);
  if (flavor.id === 'cm') return large + ' is ' + n + ' cm longer than ' + small;
  if (flavor.id === 'mw') return large + ' has ' + n + ' MW more power than ' + small;
  if (flavor.id === 'marks') return large + ' scores ' + n + ' more marks than ' + small;
  return large + ' has ' + n + ' more power cells than ' + small;
}
function unitWord(flavor, n) {
  if (flavor.id === 'cells') return n === 1 ? 'power cell' : 'power cells';
  if (flavor.id === 'marks') return n === 1 ? 'mark' : 'marks';
  if (flavor.id === 'plates') return n === 1 ? 'plate' : 'plates';

}
function article(word) {
  return /^[aeiou]/i.test(word || '') ? 'an' : 'a';
}

}
function phrase(machine) {
  if (!machine) return '';
  if (!machine.base) return machine.name;
  if (!machine.addon) return 'the ' + machine.base;
  return 'the ' + machine.base + ' with ' + article(machine.addonName) + ' ' + machine.addonName;
}
function plainPhrase(machine) {
  if (!machine || !machine.base) return machine ? machine.name : '';
  return article(machine.base) + ' ' + machine.base;
}
function copiesOf(n, machine) {
  const base = machine.base;
  const many = n === 1 ? base : base + 's';
  const tail = machine.addon ? (' with ' + article(machine.addonName) + ' ' + machine.addonName) : '';
  if (n === 1) return article(base) + ' ' + base + tail;
  return n + ' ' + many + tail;
}
function rowTitle(machine, extra) {
  const row = {
    label: machine.tag || machine.name,
    base: machine.base || '',
    tag: machine.tag || machine.name,
    addon: machine.addon || ''

  if (extra) {
    Object.keys(extra).forEach(function (key) { row[key] = extra[key]; });
  }

}
function presentMachine(machine, extra) {
  const out = {
    name: machine.name,
    tag: machine.tag || machine.name,
    base: machine.base || '',

    accent: machine.accent,
    addon: machine.addon || '',

function pickMachines(n) {

  return [null].concat(addons).slice(0, n).map(function (addon) {
    return {

/* ---------------- generators ---------------- */

function rollAdd3() {
  const flavor = pick(FLAVORS);
  const machines = pickMachines(3);
  let e1 = 0;
  let e2 = 0;
  for (let i = 0; i < 40; i++) {
    if (flavor.id === 'mw') {
      e1 = rand(3, 18) * 10;
      e2 = rand(3, 18) * 10;
    } else if (flavor.id === 'marks') {
      e1 = rand(4, 18);
      e2 = rand(4, 18);
    } else {
      e1 = rand(2, 12) * (Math.random() < 0.5 ? 2 : 5);
      e2 = rand(2, 12) * (Math.random() < 0.5 ? 2 : 5);
    }
    if (e1 !== e2 && e1 >= 4 && e2 >= 4 && (e1 + e2) % 3 === 0) break;
  }
  if ((e1 + e2) % 3 !== 0 || e1 === e2) { e1 = 30; e2 = 60; }
  let unit = flavor.id === 'mw' ? rand(8, 36) * 5 : rand(flavor.minU, flavor.maxU);
  const template = rand(0, 2);
  if (template === 2 && e2 < e1) { const s = e1; e1 = e2; e2 = s; }
  const ask = rand(1, 2);
  return {
    kind: 'add3', flavor: flavor, machines: machines, unit: unit,
    extras: [0, e1, e2], ask: ask, template: template
  };
}

function rollEqualize() {
  const timesMode = Math.random() < 0.42;
  const flavor = timesMode ? pick([FLAVORS[0], FLAVORS[2]]) : pick(FLAVORS);
  const machines = pickMachines(2);
  if (!timesMode) {
    let half;
    let low;
    if (flavor.id === 'mw' && Math.random() < 0.55) {
      half = rand(12, 160) * 10;
      low = rand(20, 220) * 10;
    } else if (flavor.id === 'cm') {
      half = rand(6, 36);
      low = rand(18, 90);
    } else if (flavor.id === 'marks') {
      half = rand(4, 16);
      low = rand(8, 40);
    } else {
      half = rand(4, 40) * 2;
      low = rand(6, 50) * 2;
    }
    return { kind: 'equalize', flavor: flavor, machines: machines, high: low + half * 2, low: low, times: 0 };
  }
  const mult = Math.random() < 0.7 ? 2 : 3;
  let low;
  if (flavor.id === 'mw') low = rand(12, 90) * 10;
  else if (flavor.id === 'cells') low = rand(8, 40) * 2;
  else low = rand(8, 30) * 2;
  if (mult === 2 && low % 2 !== 0) low += 1;
  return { kind: 'equalize', flavor: flavor, machines: machines, high: low * mult, low: low, times: mult };
}

function rollRatio() {
  for (let attempt = 0; attempt < 30; attempt++) {
    const flavor = pick([FLAVORS[0], FLAVORS[2], FLAVORS[3]]);
    const machines = pickMachines(2);
    const mult = pick([2, 3, 4]);
    let u;
    if (flavor.id === 'mw') u = rand(4, 24) * pick([5, 10, 20]);
    else if (flavor.id === 'marks') u = rand(6, 24);
    else u = rand(5, 22) * pick([1, 2, 5]);
    const bigIsA = Math.random() < 0.5;
    const a1 = bigIsA ? mult * u : u;
    const b1 = bigIsA ? u : mult * u;
    let receiver = Math.random() < 0.5 ? 0 : 1;
    let recvEnd = receiver === 0 ? a1 : b1;
    if (recvEnd < 4) receiver = 1 - receiver;
    recvEnd = receiver === 0 ? a1 : b1;
    if (recvEnd < 4) continue;
    const tMax = recvEnd - 1;
    const tMin = Math.min(tMax, Math.max(2, Math.floor(recvEnd * 0.18)));
    let t = rand(tMin, tMax);
    if (t > 12) t = Math.round(t / 2) * 2;
    t = clamp(t, 1, tMax);
    const a0 = receiver === 0 ? a1 - t : a1 + t;
    const b0 = receiver === 1 ? b1 - t : b1 + t;
    if (a0 <= 0 || b0 <= 0 || t <= 0) continue;
    const smaller = a1 < b1 ? 'A' : 'B';
    const larger = a1 > b1 ? 'A' : 'B';
    const ask = pick(['transfer', 'transfer', smaller, larger]);
    const total = a0 + b0;
    const step2 = ask === 'transfer' ? t : (ask === 'A' ? a1 : b1);
    if (step2 === total || step2 <= 0) continue;
    return {
      kind: 'ratio', flavor: flavor, machines: machines,
      a0: a0, b0: b0, a1: a1, b1: b1, mult: mult, ask: ask,
      donor: receiver === 0 ? 1 : 0, t: t, u: u
    };
  }
  return null;
}

function rollDiff() {
  for (let attempt = 0; attempt < 30; attempt++) {
    const flavor = pick([FLAVORS[0], FLAVORS[2], FLAVORS[3], FLAVORS[1]]);
    const machines = pickMachines(2);
    let gap;
    let small;
    if (flavor.id === 'mw') {
      gap = rand(3, 18) * pick([5, 10]);
      small = rand(4, 24) * pick([2, 5, 10]);
    } else if (flavor.id === 'cm') {
      gap = rand(6, 30);
      small = rand(8, 40);
    } else if (flavor.id === 'marks') {
      gap = rand(4, 20);
      small = rand(6, 24);
    } else {
      gap = rand(3, 14) * 2;
      small = rand(4, 20) * 2;
    }
    const large = small + gap;
    const bigIsA = Math.random() < 0.5;
    const a1 = bigIsA ? large : small;
    const b1 = bigIsA ? small : large;
    let receiver = Math.random() < 0.5 ? 0 : 1;
    let recvEnd = receiver === 0 ? a1 : b1;
    if (recvEnd < 3) receiver = 1 - receiver;
    recvEnd = receiver === 0 ? a1 : b1;
    if (recvEnd < 3) continue;
    const t = rand(1, recvEnd - 1);
    const a0 = receiver === 0 ? a1 - t : a1 + t;
    const b0 = receiver === 1 ? b1 - t : b1 + t;
    if (a0 <= 0 || b0 <= 0) continue;
    const smaller = a1 < b1 ? 'A' : 'B';
    const larger = a1 > b1 ? 'A' : 'B';
    const ask = pick([smaller, smaller, 'transfer', larger]);
    const total = a0 + b0;
    const step2 = ask === 'transfer' ? t : (ask === 'A' ? a1 : b1);
    if (step2 === total || step2 <= 0) continue;
    return {
      kind: 'diffend', flavor: flavor, machines: machines,
      a0: a0, b0: b0, a1: a1, b1: b1, gap: gap, ask: ask,
      donor: receiver === 0 ? 1 : 0, t: t, small: small, large: large
    };
  }
  return null;
}

function rollGroup() {
  for (let attempt = 0; attempt < 30; attempt++) {
    const machines = pickMachines(2);
    const flavor = pick([FLAVORS[0], FLAVORS[2], FLAVORS[3]]);
    let nA = rand(2, 5);
    let nB = rand(2, 6);
    if (nA === nB) nB = Math.min(6, nB + 1);
    const fewer = Math.random() < 0.5;
    const N = nA + nB;
    let diff;
    if (Math.random() < 0.6) {
      const step = N / gcd(nB, N);
      diff = step * rand(1, 2);
    } else {
      diff = pick([3, 4, 5, 6, 8, 10, 12]);
    }
    if (flavor.id === 'mw') diff *= 5;
    const unitAmt = flavor.id === 'mw' ? rand(4, 16) * 10 : rand(8, 34);
    const A = fewer ? unitAmt + diff : unitAmt;
    const B = fewer ? unitAmt : unitAmt + diff;
    const total = nA * A + nB * B;
    if (total < 40 || total > 1600) continue;
    if (A <= 0 || B <= 0 || A === B) continue;
    let ask = pick(['B', 'B', 'sumB', 'sumA']);
    let step2 = ask === 'B' ? B : (ask === 'sumB' ? nB * B : nA * A);
    if (step2 === A) ask = 'sumB';
    step2 = ask === 'B' ? B : (ask === 'sumB' ? nB * B : nA * A);
    if (step2 === A || step2 <= 0) continue;
    return {
      kind: 'group', flavor: flavor, machines: machines, nA: nA, nB: nB,
      A: A, B: B, diff: diff, fewer: fewer, ask: ask
    };
  }
  return null;
}

function rollTimes() {
  for (let attempt = 0; attempt < 40; attempt++) {
    const flavor = pick(FLAVORS);
    const three = Math.random() < 0.64;
    const fewer = Math.random() < 0.46;
    const k = pick([2, 3, 4, 5]);
    const machines = pickMachines(three ? 3 : 2);
    const mults = three ? [1, k, k] : [1, k];
    const extraIndex = three ? 2 : 1;
    const givenLast = !three && Math.random() < 0.48;
    const sumMult = mults.reduce(function (a, b) { return a + b; }, 0);
    const divisor = givenLast ? k : sumMult;
    const scale = flavor.id === 'mw' ? pick([5, 10]) : (flavor.id === 'cells' ? pick([1, 2]) : 1);
    const blocks = rand(1, flavor.id === 'mw' ? 3 : 2);
    const M = blocks * scale;
    const extraAmt = divisor * M;
    const signed = fewer ? -extraAmt : extraAmt;
    const host = mults[extraIndex];
    let unit = Math.max(
      fewer ? (2 * M + rand(3, 12)) : (flavor.id === 'mw' ? rand(6, 18) * 5 : rand(8, 36)),
      Math.ceil((extraAmt + 1) / host)
    );
    if (flavor.id === 'mw') unit = Math.max(unit, Math.ceil(unit / 5) * 5);
    if (!fewer && flavor.id === 'mw') unit = rand(6, 22) * 5;
    if (!fewer && flavor.id !== 'mw') unit = rand(8, 40);
    const extras = mults.map(function (_, i) { return i === extraIndex ? signed : 0; });
    const values = mults.map(function (m, i) { return m * unit + extras[i]; });
    if (values.some(function (v) { return !isInt(v) || v <= 0; })) continue;
    if (values[extraIndex] < Math.max(8, Math.round(host * unit * 0.2))) continue;
    const sum = values.reduce(function (a, b) { return a + b; }, 0);
    if (sum > 9000 || sum < 20) continue;
    const trapDelta = 2 * M;
    if (fewer && unit - trapDelta <= 0) continue;
    let ask = 'machine';
    let askIndex = extraIndex;
    if (givenLast) ask = 'total';
    else if (three && Math.random() < 0.5) askIndex = 1;
    if (ask === 'machine' && values[askIndex] === unit) askIndex = extraIndex;
    if (ask === 'machine' && values[askIndex] === unit) continue;
    if (!givenLast && three && Math.random() < 0.2) {
      ask = 'pair';
      if (values[0] + values[1] === unit) continue;
    }
    return {
      kind: 'times', flavor: flavor, machines: machines, mults: mults, extras: extras,
      extraAmt: extraAmt, fewer: fewer, extraIndex: extraIndex, unit: unit,
      given: givenLast ? 'last' : 'total', ask: ask, askIndex: askIndex, k: k, M: M
    };
  }
  return null;
}

function rollRaw(diff) {
  if (diff === 'easy') return Math.random() < 0.58 ? rollAdd3() : rollEqualize();
  if (diff === 'medium') return rollTimes();
  if (diff === 'hard') return Math.random() < 0.52 ? rollRatio() : rollDiff();
  const r = Math.random();
  if (r < 0.36) return rollGroup();
  if (r < 0.58) return rollRatio();
  if (r < 0.74) return rollDiff();
  if (r < 0.9) return rollTimes();
  return rollAdd3();
}

function trap(value, tip) { return { value: value, tip: tip }; }

function unitTrap(unit, unitName, flavor, missionLine) {
  return trap(unit, fmt(unit) + ' ' + flavor.unit + ' is 1 unit (' + unitName + ')! Check the mission prompt — ' + missionLine);
}

function equationError(text) {
  if (!text) return '';
  let src = String(text).replace(/,/g, '');
  const times = /(\d+)\s×\s(\d+)(?:\s([+−-])\s(\d+))?\s=\s(\d+)/g;
  let match;
  while ((match = times.exec(src))) {
    let value = Number(match[1]) * Number(match[2]);
    if (match[3]) value = match[3] === '+' ? value + Number(match[4]) : value - Number(match[4]);
    if (value !== Number(match[5])) return match[0];
  }
  src = src.replace(/(\d+)\s×\s(\d+)(?:\s([+−-])\s(\d+))?\s=\s(\d+)/g, ' ');
  const rest = [
    [/(\d+)\s\+\s(\d+)\s=\s(\d+)/g, function (a, b, c) { return a + b === c; }],
    [/(\d+)\s[−-]\s(\d+)\s=\s(\d+)/g, function (a, b, c) { return a - b === c; }],
    [/(\d+)\s÷\s(\d+)\s=\s(\d+)/g, function (a, b, c) { return b !== 0 && a / b === c; }]
  ];
  for (let i = 0; i < rest.length; i++) {
    const re = rest[i][0];
    const ok = rest[i][1];
    re.lastIndex = 0;
    while ((match = re.exec(src))) {
      if (!ok(Number(match[1]), Number(match[2]), Number(match[3]))) return match[0];
    }
  }
  return '';
}

function compose(raw) {
  if (!raw) return null;
  if (raw.kind === 'add3') return composeAdd3(raw);
  if (raw.kind === 'times') return composeTimes(raw);
  if (raw.kind === 'equalize') return composeEqualize(raw);
  if (raw.kind === 'ratio') return composeRatio(raw);
  if (raw.kind === 'diffend') return composeDiff(raw);
  if (raw.kind === 'group') return composeGroup(raw);
  return null;
}

function basePuzzle(raw, extra) {
  const puzzle = {
    raw: raw,
    construct: { add3: 1, times: 2, equalize: 3, ratio: 4, diffend: 4, group: 5 }[raw.kind],
    flavor: raw.flavor,
    machines: extra.machines,
    glow: extra.glow,
    points: extra.points || [],
    directive: extra.directive,
    missionBadge: extra.missionBadge,
    step1: extra.step1,
    step2: extra.step2,
    bars: extra.bars,
    strategy: extra.strategy,
    sig: extra.sig
  };
  return puzzle;
}

function composeAdd3(raw) {
  const f = raw.flavor;
  const names = raw.machines.map(function (m) { return m.name; });
  const values = raw.extras.map(function (e) { return raw.unit + e; });
  const total = values[0] + values[1] + values[2];
  const e1 = raw.extras[1];
  const e2 = raw.extras[2];
  const ask = raw.ask;
  let points;
  if (raw.template === 1) {
    points = [
      factLine(vsLine(f, names[0], e1, names[1], 'less')),
      factLine(vsLine(f, names[0], e2, names[2], 'less'))
    ];
  } else if (raw.template === 2) {
    points = [
      factLine(vsLine(f, names[1], e1, names[0], 'more')),
      factLine(vsLine(f, names[2], e2 - e1, names[1], 'more'))
    ];
  } else {
    points = [
      factLine(vsLine(f, names[1], e1, names[0], 'more')),
      factLine(vsLine(f, names[2], e2, names[0], 'more'))
    ];
  }
  points.push(factLine(totalLine(f, total)));
  points.push(askLine(findLine(f, names[ask])));
  const directive = joinPoints(points);
  const excess = e1 + e2;
  const coach1 = 'Extra blocks ' + fmt(e1) + ' + ' + fmt(e2) + ' = ' + fmt(excess) + '. ' + fmt(total) + ' − ' + fmt(excess) + ' = ' + fmt(3 * raw.unit) + '. ' + fmt(3 * raw.unit) + ' ÷ 3 = ' + fmt(raw.unit) + '.';
  const coach2 = names[ask] + ' = 1 unit + ' + fmt(raw.extras[ask]) + ' = ' + fmt(raw.unit) + ' + ' + fmt(raw.extras[ask]) + ' = ' + fmt(values[ask]) + ' ' + f.unit + '.';
  const avg = total / 3;
  const traps1 = [
    trap(excess, fmt(excess) + ' is only the extra blocks (' + fmt(e1) + ' + ' + fmt(e2) + '). Subtract them from the total, then divide by 3.'),
    trap(3 * raw.unit, fmt(3 * raw.unit) + ' is the 3 equal units together. Divide by 3 to get 1 unit.'),
    trap(avg, 'Dividing the whole total by 3 leaves the extras inside. Remove ' + fmt(e1) + ' + ' + fmt(e2) + ' first.')
  ];
  const other = ask === 1 ? 2 : 1;
  const traps2 = [
    unitTrap(raw.unit, names[0], f, names[ask] + ' has 1 unit + ' + fmt(raw.extras[ask]) + ' (' + fmt(raw.unit) + ' + ' + fmt(raw.extras[ask]) + ' = ' + fmt(values[ask]) + ' ' + f.unit + ').'),
    trap(values[other], 'That is ' + names[other] + '. The mission asks for ' + names[ask] + '.'),
    trap(raw.unit + e1 + e2, 'Both extras were stacked on one bar. ' + names[ask] + ' only has its own extra of ' + fmt(raw.extras[ask]) + '.')
  ];
  return basePuzzle(raw, {
    machines: raw.machines.map(function (m, i) { return presentMachine(m, { value: values[i] }); }),
    glow: [ask],
    points: points,
    directive: directive,
    missionBadge: 'FIND MACHINE POWER',
    strategy: 'Same machine. Subtract every add-on from the total, then divide by 3 equal bars.',
    step1: {
      badge: 'FIND 1 UNIT',
      subtitle: 'Enter 1 unit. That is ' + names[0] + '.',
      answer: raw.unit,
      coach: coach1,
      traps: traps1,
      fallbackTip: 'Recount the equal bars. 1 unit is the total after the add-ons are removed, divided by 3.'
    },
    step2: {
      badge: 'FIND MACHINE POWER',
      subtitle: enterMachine(f, raw.machines[ask]),
      answer: values[ask],
      coach: coach2,
      traps: traps2,
      fallbackTip: 'Use the 1-unit value, then add only the add-on that belongs to ' + names[ask] + '.'
    },
    bars: {
      mode: 'compare',
      unitValue: raw.unit,
      rows: raw.machines.map(function (m, i) {
        return rowTitle(m, {
          accent: m.accent,
          segments: raw.extras[i] > 0 ? [{ t: 'unit', n: 1 }, { t: 'more', v: raw.extras[i] }] : [{ t: 'unit', n: 1 }]
        });
      }),
      footnote: 'Same machine. Each gold block is an add-on. Every equal block is 1 unit.'
    },
    sig: ['add3', names.join('+'), raw.unit, e1, e2, ask, raw.template].join(':')
  });
}

function composeTimes(raw) {
  const f = raw.flavor;
  const names = raw.machines.map(function (m) { return m.name; });
  const values = raw.mults.map(function (m, i) { return m * raw.unit + raw.extras[i]; });
  const sum = values.reduce(function (a, b) { return a + b; }, 0);
  const sumMult = raw.mults.reduce(function (a, b) { return a + b; }, 0);
  const host = names[raw.extraIndex];
  const baseName = names[0];
  const points = [];
  if (names.length === 3) {
    points.push(factLine(timesLine(f, raw.machines[1], raw.machines[0], raw.k)));
    points.push(factLine(vsLine(f, names[2], raw.extraAmt, names[1], raw.fewer ? 'less' : 'more')));
  } else {
    points.push(factLine(timesLine(f, raw.machines[raw.extraIndex], raw.machines[0], raw.k) + ', ' + adjustTail(f, raw.extraAmt, raw.fewer)));
  }
  let coach1;
  if (raw.given === 'last') {
    if (raw.fewer) {
      const filled = values[raw.extraIndex] + raw.extraAmt;
      coach1 = host + ' is ' + fmt(raw.extraAmt) + ' fewer than ' + raw.k + ' units. ' + fmt(values[raw.extraIndex]) + ' + ' + fmt(raw.extraAmt) + ' = ' + fmt(filled) + '. ' + fmt(filled) + ' ÷ ' + raw.k + ' = ' + fmt(raw.unit) + '.';
    } else {
      const bare = values[raw.extraIndex] - raw.extraAmt;
      coach1 = fmt(values[raw.extraIndex]) + ' − ' + fmt(raw.extraAmt) + ' = ' + fmt(bare) + '. ' + fmt(bare) + ' ÷ ' + raw.k + ' = ' + fmt(raw.unit) + '.';
    }
  } else {
    if (raw.fewer) {
      const filled = sum + raw.extraAmt;
      coach1 = 'The short block is ' + fmt(raw.extraAmt) + '. Add it back: ' + fmt(sum) + ' + ' + fmt(raw.extraAmt) + ' = ' + fmt(filled) + '. ' + fmt(filled) + ' ÷ ' + sumMult + ' = ' + fmt(raw.unit) + '.';
    } else {
      const bare = sum - raw.extraAmt;
      coach1 = 'Count ' + sumMult + ' equal units. Subtract the extra ' + fmt(raw.extraAmt) + ': ' + fmt(sum) + ' − ' + fmt(raw.extraAmt) + ' = ' + fmt(bare) + '. ' + fmt(bare) + ' ÷ ' + sumMult + ' = ' + fmt(raw.unit) + '.';
    }
  }
  let answer2;
  let badge = 'FIND MACHINE POWER';
  let subtitle2;
  let coach2;
  let glow = [raw.askIndex || raw.extraIndex];
  if (raw.ask === 'total') {
    answer2 = sum;
    badge = 'FIND TOTAL POWER';
    subtitle2 = 'Enter the total of every machine.';
    coach2 = 'Add every machine: ' + values.map(fmt).join(' + ') + ' = ' + fmt(sum) + ' ' + f.unit + '.';
    glow = names.map(function (_, i) { return i; });
  } else if (raw.ask === 'pair') {
    answer2 = values[0] + values[1];
    badge = 'FIND TOTAL POWER';
    subtitle2 = 'Enter ' + names[0] + ' + ' + names[1] + '.';
    coach2 = names[0] + ' + ' + names[1] + ' = ' + fmt(values[0]) + ' + ' + fmt(values[1]) + ' = ' + fmt(answer2) + ' ' + f.unit + '.';
    glow = [0, 1];
  } else {
    const i = raw.askIndex;
    answer2 = values[i];
    subtitle2 = enterMachine(f, raw.machines[i]);
    const extra = raw.extras[i];
    if (extra > 0) coach2 = names[i] + ' = ' + raw.mults[i] + ' × ' + fmt(raw.unit) + ' + ' + fmt(extra) + ' = ' + fmt(answer2) + ' ' + f.unit + '.';
    else if (extra < 0) coach2 = names[i] + ' = ' + raw.mults[i] + ' × ' + fmt(raw.unit) + ' − ' + fmt(-extra) + ' = ' + fmt(answer2) + ' ' + f.unit + '.';
    else coach2 = names[i] + ' = ' + raw.mults[i] + ' × ' + fmt(raw.unit) + ' = ' + fmt(answer2) + ' ' + f.unit + '.';
    glow = [i];
  }
  if (raw.given === 'last') points.push(factLine(amountLine(f, raw.machines[raw.extraIndex], values[raw.extraIndex])));
  else points.push(factLine(totalLine(f, sum)));
  if (raw.ask === 'total') points.push(askLine(findTotalLine(f)));
  else if (raw.ask === 'pair') points.push(askLine(findTotalLine(f, names[0] + ' and ' + names[1])));
  else points.push(askLine(findLine(f, names[raw.askIndex])));
  const directive = joinPoints(points);
  const wrongFewer = raw.unit - 2 * raw.M;
  const wrongMore = raw.unit + 2 * raw.M;
  const traps1 = [];
  if (raw.fewer) {
    traps1.push(trap(wrongFewer, host + ' has ' + fmt(raw.extraAmt) + ' FEWER than a full set of equal units! Add ' + fmt(raw.extraAmt) + ' to the given amount (' + fmt(raw.given === 'last' ? values[raw.extraIndex] : sum) + ' + ' + fmt(raw.extraAmt) + ' = ' + fmt((raw.given === 'last' ? values[raw.extraIndex] : sum) + raw.extraAmt) + ') to complete the equal units before dividing.'));
  } else {
    traps1.push(trap(wrongMore, 'The extra block is already inside the given amount. Subtract ' + fmt(raw.extraAmt) + ' before you divide, instead of adding it again.'));
  }
  traps1.push(trap(raw.extraAmt, fmt(raw.extraAmt) + ' is the more / fewer block, not 1 unit.'));
  traps1.push(trap(values[raw.extraIndex], 'That is the whole of ' + host + '. Step 1 asks for 1 equal unit only.'));
  let missionLine = coach2;
  if (raw.ask === 'machine' && raw.extras[raw.askIndex] === 0) {
    const mult = raw.mults[raw.askIndex];
    missionLine = names[raw.askIndex] + ' has ' + mult + ' unit' + (mult === 1 ? '' : 's') + ' (' + mult + ' × ' + fmt(raw.unit) + ' = ' + fmt(answer2) + ' ' + f.unit + ').';
  }
  const traps2 = [
    unitTrap(raw.unit, baseName, f, missionLine)
  ];
  if (raw.ask === 'pair') traps2.push(trap(sum, fmt(sum) + ' is the total of all the machines. The mission asks only for ' + names[0] + ' and ' + names[1] + '.'));
  if (raw.ask === 'total') traps2.push(trap(values[raw.extraIndex], 'That is only ' + host + '. Add every machine to get the total.'));
  if (raw.ask === 'machine') {
    const other = raw.askIndex === 0 ? 1 : 0;
    traps2.push(trap(values[other], 'That is ' + names[other] + '. Read the mission name again.'));
  }
  const rows = names.map(function (name, i) {
    const segs = [{ t: 'unit', n: raw.mults[i] }];
    if (raw.extras[i] > 0) segs.push({ t: 'more', v: raw.extras[i] });
    if (raw.extras[i] < 0) segs.push({ t: 'less', v: -raw.extras[i] });
    return rowTitle(raw.machines[i], { accent: raw.machines[i].accent, segments: segs });
  });
  return basePuzzle(raw, {
    machines: raw.machines.map(function (m, i) { return presentMachine(m, { value: values[i] }); }),
    glow: glow,
    points: points,
    directive: directive,
    missionBadge: badge,
    strategy: raw.fewer
      ? 'A “fewer” block is missing from the units. Add it back, then divide.'
      : 'Count every 1-unit block. Subtract the gold “more” block, then divide.',
    step1: {
      badge: 'FIND 1 UNIT',
      subtitle: 'Enter 1 unit (' + baseName + ').',
      answer: raw.unit,
      coach: coach1,
      traps: traps1,
      fallbackTip: 'Match the mission badge. Step 1 is 1 equal unit, after the more or fewer block is put in its place.'
    },
    step2: {
      badge: badge,
      subtitle: subtitle2,
      answer: answer2,
      coach: coach2,
      traps: traps2,
      fallbackTip: 'Scale the 1-unit value up to the machine, pair, or total named in the mission.'
    },
    bars: {
      mode: 'compare',
      unitValue: raw.unit,
      rows: rows,
      footnote: raw.fewer ? 'Same machine. The hatched block is a missing add-on. Add it back before you divide.' : 'Same machine. Gold is the add-on sitting outside the equal units.'
    },
    sig: ['times', names.join('+'), raw.unit, raw.mults.join(','), raw.extras.join(','), raw.ask, raw.askIndex, raw.given].join(':')
  });
}

function composeEqualize(raw) {
  const f = raw.flavor;
  const high = raw.machines[0];
  const low = raw.machines[1];
  const diff = raw.high - raw.low;
  const half = diff / 2;
  const points = [];
  if (raw.times) {
    points.push(factLine(timesLine(f, high, low, raw.times)));
    points.push(factLine(amountLine(f, low, raw.low)));
  } else {
    points.push(factLine(amountLine(f, high, raw.high)));
    points.push(factLine(amountLine(f, low, raw.low)));
  }
  points.push(askLine('How much does ' + high.name + ' transfer so both match?'));
  const directive = joinPoints(points);
  const coach1 = (raw.times ? (raw.times + ' × ' + fmt(raw.low) + ' = ' + fmt(raw.high) + '. ') : '') + 'Gap = ' + fmt(raw.high) + ' − ' + fmt(raw.low) + ' = ' + fmt(diff) + '.';
  const coach2 = 'Transfer half the gap: ' + fmt(diff) + ' ÷ 2 = ' + fmt(half) + ' ' + f.unit + '.';
  const ending = (raw.high + raw.low) / 2;
  return basePuzzle(raw, {
    machines: [
      presentMachine(high, { value: raw.high }),
      presentMachine(low, { value: raw.low })
    ],
    glow: [0, 1],
    points: points,
    directive: directive,
    missionBadge: 'FIND POWER TRANSFERRED',
    strategy: 'Find the gap first. The transfer is half the gap — the whole gap would swap who has more.',
    step1: {
      badge: 'FIND THE DIFFERENCE',
      subtitle: 'Enter the gap between ' + high.name + ' and ' + low.name + '.',
      answer: diff,
      coach: coach1,
      traps: [
        trap(half, fmt(half) + ' is already half the gap. Step 1 asks for the full difference.'),
        trap(raw.high, 'That is ' + high.name + "'s whole amount, not the gap."),
        trap(raw.low, 'That is ' + low.name + "'s whole amount, not the gap.")
      ],
      fallbackTip: 'The gap is the greater amount minus the smaller amount.'
    },
    step2: {
      badge: 'FIND POWER TRANSFERRED',
      subtitle: 'Enter the amount transferred so both machines match.',
      answer: half,
      coach: coach2,
      traps: [
        trap(diff, 'If ' + high.name + ' gives away ALL ' + fmt(diff) + ' ' + f.unit + ', ' + high.name + ' loses ' + fmt(diff) + ' and ' + low.name + ' gains ' + fmt(diff) + ' — reversing their difference! Always transfer HALF the difference (' + fmt(diff) + ' ÷ 2 = ' + fmt(half) + ' ' + f.unit + ').'),
        trap(ending, fmt(ending) + ' is what each machine has at the end. The mission asks how much is transferred.'),
        trap(raw.low, 'That is the starting amount of ' + low.name + ', not the transfer.')
      ],
      fallbackTip: 'Close the gap from both sides. Transfer half of the difference you found in Step 1.'
    },
    bars: {
      mode: 'equalize',
      high: rowTitle(high, { value: raw.high, accent: high.accent }),
      low: rowTitle(low, { value: raw.low, accent: low.accent }),
      diff: diff,
      half: half,
      footnote: 'The gold stretch is the gap. Half of it moves across.'
    },
    sig: ['equalize', high.name, low.name, raw.high, raw.low, raw.times].join(':')
  });
}

function transferMachines(raw) {
  return [
    presentMachine(raw.machines[0], { value: raw.a1 }),
    presentMachine(raw.machines[1], { value: raw.b1 })
  ];
}

function composeRatio(raw) {
  const f = raw.flavor;
  const A = raw.machines[0].name;
  const B = raw.machines[1].name;
  const donor = raw.donor === 0 ? A : B;
  const recv = raw.donor === 0 ? B : A;
  const big = raw.a1 > raw.b1 ? A : B;
  const small = raw.a1 > raw.b1 ? B : A;
  const total = raw.a0 + raw.b0;
  const askName = raw.ask === 'A' ? A : B;
  const askValue = raw.ask === 'A' ? raw.a1 : raw.b1;
  const endNoun = f.id === 'cm' ? 'length' : f.noun;
  let question;
  let badge;
  let subtitle2;
  let answer2;
  let coach2;
  let glow;
  const endUnit = Math.round(total / (raw.mult + 1));
  if (raw.ask === 'transfer') {
    question = 'Find how much ' + donor + ' transfers';
    badge = 'FIND POWER TRANSFERRED';
    subtitle2 = 'Enter how much ' + donor + ' transfers.';
    answer2 = raw.t;
    coach2 = 'End total stays ' + fmt(total) + '. 1 end unit = ' + fmt(total) + ' ÷ ' + (raw.mult + 1) + ' = ' + fmt(endUnit) + '. Transferred = ' + fmt(raw.t) + ' ' + f.unit + '.';
    glow = [raw.donor === 0 ? 1 : 0];
  } else {
    question = 'Find ' + askName + "'s ending " + endNoun;
    badge = 'FIND MACHINE POWER';
    subtitle2 = 'Enter ' + askName + "'s ending " + endNoun + '.';
    answer2 = askValue;
    const parts = Math.max(1, Math.round(askValue / endUnit));
    coach2 = askName + ' ends with ' + parts + ' × ' + fmt(endUnit) + ' = ' + fmt(askValue) + ' ' + f.unit + '.';
    glow = [raw.ask === 'A' ? 0 : 1];
  }
  const verb = f.id === 'cm' ? 'is' : 'has';
  const points = [
    factLine('Start — ' + A + ': ' + fmt(raw.a0) + ' ' + f.unit + '   ·   ' + B + ': ' + fmt(raw.b0) + ' ' + f.unit),
    factLine(donor + ' transfers to ' + recv),
    factLine('End — ' + big + ' ' + verb + ' ' + timesBits(f, raw.mult) + ' ' + small),
    askLine(question)
  ];
  const directive = joinPoints(points);
  const endSegs = [
    rowTitle(raw.machines[0], { accent: raw.machines[0].accent, segments: [{ t: 'unit', n: Math.round(raw.a1 / endUnit) }] }),
    rowTitle(raw.machines[1], { accent: raw.machines[1].accent, segments: [{ t: 'unit', n: Math.round(raw.b1 / endUnit) }] })
  ];
  const traps2 = [
    trap(total, fmt(total) + ' is the fixed total. The mission asks for the transfer or one ending bar.'),
    unitTrap(endUnit, small, f, coach2)
  ];
  if (raw.ask === 'transfer') traps2.push(trap(Math.abs(raw.a0 - raw.b0), 'That is the starting gap, not the amount that moves.'));
  else traps2.push(trap(raw.ask === 'A' ? raw.a0 : raw.b0, 'That is the starting amount. Draw the END bar before you answer.'));
  return basePuzzle(raw, {
    machines: transferMachines(raw),
    glow: glow,
    points: points,
    directive: directive,
    missionBadge: badge,
    strategy: 'No power leaves the hangar. Add both starts, then split that fixed total into the END bars.',
    step1: {
      badge: 'FIND THE TOTAL',
      subtitle: 'Enter ' + A + ' + ' + B + '. The total stays the same.',
      answer: total,
      coach: fmt(raw.a0) + ' + ' + fmt(raw.b0) + ' = ' + fmt(total) + '. A transfer inside the hangar does not change this total.',
      traps: [
        trap(Math.abs(raw.a0 - raw.b0), 'No power leaves the hangar during a transfer between ' + A + ' and ' + B + '! Add ' + fmt(raw.a0) + ' + ' + fmt(raw.b0) + ' first to get the fixed Total (' + fmt(total) + '), then split into the END bar model.'),
        trap(raw.a0, fmt(raw.a0) + ' is only ' + A + '. Add both machines. Nothing leaves the hangar.'),
        trap(raw.b0, fmt(raw.b0) + ' is only ' + B + '. Add both machines. Nothing leaves the hangar.')
      ],
      fallbackTip: 'Add the two starting amounts. The total is the same at the end.'
    },
    step2: {
      badge: badge,
      subtitle: subtitle2,
      answer: answer2,
      coach: coach2,
      traps: traps2,
      fallbackTip: 'Split the fixed total into the END units, then read the value the mission names.'
    },
    bars: {
      mode: 'transfer',
      unitValue: endUnit,
      total: total,
      goal: endMultipleClause(big, small, f, raw.mult),
      now: [
        rowTitle(raw.machines[0], { value: raw.a0, accent: raw.machines[0].accent }),
        rowTitle(raw.machines[1], { value: raw.b0, accent: raw.machines[1].accent })
      ],
      end: endSegs,
      footnote: 'END bars first. The total bracket never changes.'
    },
    sig: ['ratio', A, B, raw.a0, raw.b0, raw.a1, raw.b1, raw.ask].join(':')
  });
}

function composeDiff(raw) {
  const f = raw.flavor;
  const A = raw.machines[0].name;
  const B = raw.machines[1].name;
  const donor = raw.donor === 0 ? A : B;
  const recv = raw.donor === 0 ? B : A;
  const largeName = raw.a1 > raw.b1 ? A : B;
  const smallName = raw.a1 > raw.b1 ? B : A;
  const total = raw.a0 + raw.b0;
  const smallEnd = Math.min(raw.a1, raw.b1);
  const largeEnd = Math.max(raw.a1, raw.b1);
  const endNoun = f.id === 'cm' ? 'length' : f.noun;
  let question;
  let badge;
  let subtitle2;
  let answer2;
  let coach2;
  let glow;
  if (raw.ask === 'transfer') {
    question = 'Find how much ' + donor + ' transfers';
    badge = 'FIND POWER TRANSFERRED';
    subtitle2 = 'Enter how much ' + donor + ' transfers.';
    answer2 = raw.t;
    coach2 = fmt(total) + ' − ' + fmt(raw.gap) + ' = ' + fmt(total - raw.gap) + '. ' + fmt(total - raw.gap) + ' ÷ 2 = ' + fmt(smallEnd) + '. Transferred = ' + fmt(raw.t) + ' ' + f.unit + '.';
    glow = [raw.donor === 0 ? 1 : 0];
  } else {
    const askName = raw.ask === 'A' ? A : B;
    const askValue = raw.ask === 'A' ? raw.a1 : raw.b1;
    question = 'Find ' + askName + "'s ending " + endNoun;
    badge = 'FIND MACHINE POWER';
    subtitle2 = 'Enter ' + askName + "'s ending " + endNoun + '.';
    answer2 = askValue;
    if (askValue === smallEnd) coach2 = fmt(total) + ' − ' + fmt(raw.gap) + ' = ' + fmt(total - raw.gap) + '. ' + fmt(total - raw.gap) + ' ÷ 2 = ' + fmt(smallEnd) + ' ' + f.unit + '.';
    else coach2 = fmt(total) + ' + ' + fmt(raw.gap) + ' = ' + fmt(total + raw.gap) + '. ' + fmt(total + raw.gap) + ' ÷ 2 = ' + fmt(largeEnd) + ' ' + f.unit + '.';
    glow = [raw.ask === 'A' ? 0 : 1];
  }
  const points = [
    factLine('Start — ' + A + ': ' + fmt(raw.a0) + ' ' + f.unit + '   ·   ' + B + ': ' + fmt(raw.b0) + ' ' + f.unit),
    factLine(donor + ' transfers to ' + recv),
    factLine('End — ' + largeName + ' — ' + gapBits(f, raw.gap, 'more') + ' than ' + smallName),
    askLine(question)
  ];
  const directive = joinPoints(points);
  const traps2 = [
    trap(total - raw.gap, 'You removed the ' + fmt(raw.gap) + ' ' + f.unit + ' gap but forgot to split the rest into 2 equal bars. ' + fmt(total) + ' − ' + fmt(raw.gap) + ' = ' + fmt(total - raw.gap) + '. ' + fmt(total - raw.gap) + ' ÷ 2 = ' + fmt(smallEnd) + '.'),
    trap(raw.ask === 'A' ? raw.b1 : (raw.ask === 'B' ? raw.a1 : largeEnd), 'Check which END bar the mission names. One bar is the equal part, the other is the equal part plus ' + fmt(raw.gap) + '.'),
    trap(raw.gap, fmt(raw.gap) + ' is the ending gap, which was already given. It is not the transfer and not an ending bar.')
  ];
  return basePuzzle(raw, {
    machines: transferMachines(raw),
    glow: glow,
    points: points,
    directive: directive,
    missionBadge: badge,
    strategy: 'The total stays fixed. Draw the END bars with one gap block, then split what remains into two equal parts.',
    step1: {
      badge: 'FIND THE TOTAL',
      subtitle: 'Enter the unchanged total.',
      answer: total,
      coach: fmt(raw.a0) + ' + ' + fmt(raw.b0) + ' = ' + fmt(total) + '. No power leaves the hangar.',
      traps: [
        trap(Math.abs(raw.a0 - raw.b0), 'No power leaves the hangar during a transfer between ' + A + ' and ' + B + '! Add ' + fmt(raw.a0) + ' + ' + fmt(raw.b0) + ' first to get the fixed Total (' + fmt(total) + '), then split into the END bar model.'),
        trap(raw.a0, 'That is only ' + A + "'s start. Add both amounts."),
        trap(total + raw.t, 'A transfer does not bring in outside power. The total stays ' + fmt(total) + '.')
      ],
      fallbackTip: 'Add both starting amounts. That total is the END total too.'
    },
    step2: {
      badge: badge,
      subtitle: subtitle2,
      answer: answer2,
      coach: coach2,
      traps: traps2,
      fallbackTip: 'Use the fixed total and the ending gap. Split the rest equally if you need an ending bar.'
    },
    bars: {
      mode: 'transfer',
      unitValue: smallEnd,
      total: total,
      goal: endGapClause(largeName, smallName, f, raw.gap),
      now: [
        rowTitle(raw.machines[0], { value: raw.a0, accent: raw.machines[0].accent }),
        rowTitle(raw.machines[1], { value: raw.b0, accent: raw.machines[1].accent })
      ],
      end: [
        rowTitle(raw.a1 < raw.b1 ? raw.machines[0] : raw.machines[1], { accent: raw.a1 < raw.b1 ? raw.machines[0].accent : raw.machines[1].accent, segments: [{ t: 'unit', n: 1 }] }),
        rowTitle(raw.a1 > raw.b1 ? raw.machines[0] : raw.machines[1], { accent: raw.a1 > raw.b1 ? raw.machines[0].accent : raw.machines[1].accent, segments: [{ t: 'unit', n: 1 }, { t: 'more', v: raw.gap }] })
      ],
      footnote: 'The gold block is the ending gap, already given in the mission.'
    },
    sig: ['diff', A, B, raw.a0, raw.b0, raw.a1, raw.b1, raw.ask].join(':')
  });
}

function composeGroup(raw) {
  const plain = raw.machines[0];
  const fitted = raw.machines[1];
  const f = raw.flavor;
  const N = raw.nA + raw.nB;
  const total = raw.nA * raw.A + raw.nB * raw.B;
  const removed = raw.nB * raw.diff;
  const fittedOne = fitted.base + ' with ' + article(fitted.addonName) + ' ' + fitted.addonName;
  let answer2;
  let badge;
  let subtitle2;
  let coach2;
  let glow;
  if (raw.ask === 'B') {
    answer2 = raw.B;
    badge = 'FIND MACHINE POWER';
    subtitle2 = enterMachine(f, fitted);
    coach2 = cap(phrase(fitted)) + ' = ' + fmt(raw.A) + (raw.fewer ? ' − ' : ' + ') + fmt(raw.diff) + ' = ' + fmt(raw.B) + ' ' + f.unit + '.';
    glow = [1];
  } else if (raw.ask === 'sumB') {
    answer2 = raw.nB * raw.B;
    badge = 'FIND TOTAL POWER';
    subtitle2 = 'Enter the total of the ' + copyLabel(raw.nB, fitted) + '.';
    coach2 = raw.nB + ' × ' + fmt(raw.B) + ' = ' + fmt(answer2) + ' ' + f.unit + '.';
    glow = [1];
  } else {
    answer2 = raw.nA * raw.A;
    badge = 'FIND TOTAL POWER';
    subtitle2 = 'Enter the total of the ' + copyLabel(raw.nA, plain) + '.';
    coach2 = raw.nA + ' × ' + fmt(raw.A) + ' = ' + fmt(answer2) + ' ' + f.unit + '.';
    glow = [0];
  }
  const eachLine = 'Each ' + fitted.name + ' — ' + gapBits(f, raw.diff, raw.fewer ? 'less' : 'more') + ' than ' + plain.name;
  const askText = raw.ask === 'B'
    ? findLine(f, fitted.name)
    : findTotalLine(f, copyLabel(raw.ask === 'sumB' ? raw.nB : raw.nA, raw.ask === 'sumB' ? fitted : plain));
  const points = [
    factLine(copyLabel(raw.nA, plain) + '   ·   ' + copyLabel(raw.nB, fitted)),
    factLine(totalLine(f, total)),
    factLine(eachLine),
    askLine(askText)
  ];
  const directive = joinPoints(points);
  const coach1 = raw.fewer
    ? 'Add the missing add-ons: ' + raw.nB + ' × ' + fmt(raw.diff) + ' = ' + fmt(removed) + '. ' + fmt(total) + ' + ' + fmt(removed) + ' = ' + fmt(N * raw.A) + '. ' + fmt(N * raw.A) + ' ÷ ' + N + ' = ' + fmt(raw.A) + '.'
    : 'Remove the add-ons: ' + raw.nB + ' × ' + fmt(raw.diff) + ' = ' + fmt(removed) + '. ' + fmt(total) + ' − ' + fmt(removed) + ' = ' + fmt(N * raw.A) + '. ' + fmt(N * raw.A) + ' ÷ ' + N + ' = ' + fmt(raw.A) + '.';
  const wrongDir = raw.fewer ? (total - removed) / N : (total + removed) / N;
  const traps1 = [
    trap(wrongDir, raw.fewer
      ? 'Each ' + fittedOne + ' is ' + fmt(raw.diff) + ' LESS than ' + plainPhrase(plain) + '. Add the missing add-ons (' + raw.nB + ' × ' + fmt(raw.diff) + ' = ' + fmt(removed) + ') before you divide.'
      : 'Each ' + fittedOne + ' is ' + fmt(raw.diff) + ' MORE than ' + plainPhrase(plain) + '. Subtract ' + raw.nB + ' × ' + fmt(raw.diff) + ' = ' + fmt(removed) + ' before you divide.'),
    trap(removed, fmt(removed) + ' is only the pile of add-on blocks. It still has to come off the total, and then you divide by ' + N + '.'),
    trap(N * raw.A, fmt(N * raw.A) + ' is ' + N + ' plain units together. Divide by ' + N + ' to get 1 ' + plain.base + '.')
  ];
  const traps2 = [
    unitTrap(raw.A, plain.base, f, coach2),
    trap(raw.diff, fmt(raw.diff) + ' is the add-on on one ' + fittedOne + ', not the mission target.'),
    trap(raw.ask === 'B' ? raw.A : raw.B, 'Read the badge. Step 2 is not the same row you found for 1 unit.')
  ];
  return basePuzzle(raw, {
    machines: [
      presentMachine(plain, { count: raw.nA, value: raw.A }),
      presentMachine(fitted, { count: raw.nB, value: raw.B })
    ],
    glow: glow,
    points: points,
    directive: directive,
    missionBadge: badge,
    strategy: raw.fewer
      ? 'Same machine. Add back the missing add-ons so every row matches the plain one, then divide.'
      : 'Same machine. Remove the add-ons so every row matches the plain one, then divide.',
    step1: {
      badge: 'FIND 1 UNIT',
      subtitle: enterMachine(f, plain),
      answer: raw.A,
      coach: coach1,
      traps: traps1,
      fallbackTip: 'Turn every add-on copy back into the plain machine, then divide.'
    },
    step2: {
      badge: badge,
      subtitle: subtitle2,
      answer: answer2,
      coach: coach2,
      traps: traps2,
      fallbackTip: 'Start from 1 plain machine, then build the add-on or the group the mission names.'
    },
    bars: {
      mode: 'group',
      total: total,
      unitValue: raw.A,
      fewer: raw.fewer,
      diff: raw.diff,
      groups: [
        rowTitle(plain, { count: raw.nA, accent: plain.accent, extra: 0 }),
        rowTitle(fitted, { count: raw.nB, accent: fitted.accent, extra: raw.diff, fewer: raw.fewer })
      ],
      footnote: eachLine + '.'
    },
    sig: ['group', plain.base, fitted.name, raw.nA, raw.nB, raw.A, raw.B, raw.ask, raw.fewer ? 1 : 0].join(':')
  });
}

function valuesOf(raw) {
  if (!raw) return null;
  if (raw.kind === 'add3') {
    const values = raw.extras.map(function (e) { return raw.unit + e; });
    return { step1: raw.unit, step2: values[raw.ask], total: values.reduce(function (a, b) { return a + b; }, 0), values: values };
  }
  if (raw.kind === 'times') {
    const values = raw.mults.map(function (m, i) { return m * raw.unit + raw.extras[i]; });
    const sum = values.reduce(function (a, b) { return a + b; }, 0);
    let step2 = sum;
    if (raw.ask === 'machine') step2 = values[raw.askIndex];
    if (raw.ask === 'pair') step2 = values[0] + values[1];
    return { step1: raw.unit, step2: step2, total: sum, values: values };
  }
  if (raw.kind === 'equalize') {
    return { step1: raw.high - raw.low, step2: (raw.high - raw.low) / 2 };
  }
  if (raw.kind === 'ratio' || raw.kind === 'diffend') {
    const total = raw.a0 + raw.b0;
    const step2 = raw.ask === 'transfer' ? Math.abs(raw.a0 - raw.a1) : (raw.ask === 'A' ? raw.a1 : raw.b1);
    return { step1: total, step2: step2 };
  }
  if (raw.kind === 'group') {
    const step2 = raw.ask === 'B' ? raw.B : (raw.ask === 'sumB' ? raw.nB * raw.B : raw.nA * raw.A);
    return { step1: raw.A, step2: step2, total: raw.nA * raw.A + raw.nB * raw.B };
  }
  return null;
}

function invariantError(puzzle) {
  if (!puzzle || !puzzle.raw) return 'missing puzzle';
  const raw = puzzle.raw;
  const got = valuesOf(raw);
  if (!got) return 'no values';
  if (!isInt(got.step1) || !isInt(got.step2) || got.step1 <= 0 || got.step2 <= 0) return 'non integer answer';
  if (got.step1 === got.step2) return 'steps match';
  if (puzzle.step1.answer !== got.step1 || puzzle.step2.answer !== got.step2) return 'answer drift';
  if (!puzzle.directive || puzzle.directive.length < 20) return 'directive';
  if (!puzzle.points || puzzle.points.length < 2 || puzzle.points.length > 4) return 'points';
  if (puzzle.points.some(function (p) { return !p || !p.text || p.text.indexOf('undefined') >= 0 || p.text.indexOf('NaN') >= 0; })) return 'bad point';
  if (!puzzle.points[puzzle.points.length - 1].ask) return 'ask point';
  if (puzzle.directive.indexOf('undefined') >= 0 || puzzle.directive.indexOf('NaN') >= 0) return 'bad text';
  if (raw.machines && raw.machines.length) {
    const base = raw.machines[0].base;
    const kind = raw.machines[0].kind;
    if (!base) return 'no base machine';
    for (let i = 0; i < raw.machines.length; i++) {
      const machine = raw.machines[i];
      if (machine.base !== base || machine.kind !== kind) return 'mixed machines';
    }
    if (raw.machines[0].addon) return 'plain machine missing';
    if (raw.machines.slice(1).some(function (machine) { return !machine.addon; })) return 'add-on missing';
    if (puzzle.directive.indexOf(base) < 0) return 'base not in story';
  }
  if (puzzle.step1.coach.indexOf('NaN') >= 0 || puzzle.step2.coach.indexOf('NaN') >= 0) return 'bad coach';
  if (raw.kind === 'add3') {
    const excess = raw.extras[1] + raw.extras[2];
    if ((got.total - excess) / 3 !== raw.unit) return 'add3 algebra';
    if (excess % 3 !== 0) return 'add3 trap not integer';
  }
  if (raw.kind === 'times') {
    const values = got.values;
    if (values.some(function (v) { return v <= 0 || !isInt(v); })) return 'times value';
    const sumMult = raw.mults.reduce(function (a, b) { return a + b; }, 0);
    const extraSum = raw.extras.reduce(function (a, b) { return a + b; }, 0);
    if ((got.total - extraSum) / sumMult !== raw.unit) return 'times algebra';
    if (raw.given === 'last') {
      const last = values[raw.extraIndex];
      if ((last - raw.extras[raw.extraIndex]) / raw.mults[raw.extraIndex] !== raw.unit) return 'times last';
    }
  }
  if (raw.kind === 'equalize') {
    if ((raw.high - raw.low) % 2 !== 0) return 'odd gap';
    if (raw.times && raw.high !== raw.low * raw.times) return 'times equalize';
    if (!puzzle.step2.traps.some(function (t) { return t && t.value === raw.high - raw.low && t.tip.indexOf('HALF') >= 0; })) return 'missing half trap';
  }
  if (raw.kind === 'ratio') {
    if (raw.a0 + raw.b0 !== raw.a1 + raw.b1) return 'ratio total';
    if (!(raw.a1 === raw.mult * raw.b1 || raw.b1 === raw.mult * raw.a1)) return 'ratio end';
    if (Math.abs(raw.a0 - raw.a1) !== raw.t) return 'ratio transfer';
    if (!puzzle.step1.traps.some(function (t) { return t && t.tip.indexOf('hangar') >= 0; })) return 'missing hangar tip';
  }
  if (raw.kind === 'diffend') {
    if (raw.a0 + raw.b0 !== raw.a1 + raw.b1) return 'diff total';
    if (Math.abs(raw.a1 - raw.b1) !== raw.gap) return 'diff gap';
    if ((raw.a0 + raw.b0 - raw.gap) % 2 !== 0) return 'diff split';
    if (!puzzle.step1.traps.some(function (t) { return t && t.tip.indexOf('hangar') >= 0; })) return 'missing hangar tip';
  }
  if (raw.kind === 'group') {
    const N = raw.nA + raw.nB;
    const total = got.total;
    if (!raw.fewer && (total - raw.nB * raw.diff) / N !== raw.A) return 'group more';
    if (raw.fewer && (total + raw.nB * raw.diff) / N !== raw.A) return 'group fewer';
    if (!raw.fewer && raw.B !== raw.A + raw.diff) return 'group link';
    if (raw.fewer && raw.A !== raw.B + raw.diff) return 'group link fewer';
    const wrong = raw.fewer ? (total - raw.nB * raw.diff) / N : (total + raw.nB * raw.diff) / N;
    if (!isInt(wrong)) return 'group trap fraction';
  }
  if (!puzzle.bars || !puzzle.bars.mode) return 'bars';
  const texts = [puzzle.directive, puzzle.step1.coach, puzzle.step2.coach]
    .concat((puzzle.step1.traps || []).map(function (t) { return t && t.tip; }))
    .concat((puzzle.step2.traps || []).map(function (t) { return t && t.tip; }));
  for (let i = 0; i < texts.length; i++) {
    const bad = equationError(texts[i]);
    if (bad) return 'bad equation ' + bad;
  }
  return '';
}

function buildOptions(step) {
  const chosen = [{ value: step.answer, correct: true, tip: '' }];
  const used = new Set([step.answer]);
  const traps = (step.traps || []).filter(Boolean);
  for (let i = 0; i < traps.length && chosen.length < 4; i++) {
    const t = traps[i];
    if (!t || !isInt(t.value) || t.value <= 0 || t.value > 200000) continue;
    if (used.has(t.value)) continue;
    used.add(t.value);
    chosen.push({ value: t.value, correct: false, tip: t.tip });
  }
  let salt = 1;
  while (chosen.length < 4 && salt < 50) {
    const mag = Math.max(2, Math.round(Math.abs(step.answer) * 0.12) || 2);
    const v = step.answer + (salt % 2 === 0 ? 1 : -1) * mag * Math.ceil(salt / 2);
    if (isInt(v) && v > 0 && !used.has(v)) {
      used.add(v);
      chosen.push({
        value: v,
        correct: false,
        tip: step.fallbackTip || 'That amount does not match the equal units. Recount the 1-unit blocks, then build the value the mission names.'
      });
    }
    salt++;
  }
  return shuffle(chosen);
}

function createPuzzle(diff) {
  for (let i = 0; i < 24; i++) {
    const raw = rollRaw(diff);
    const puzzle = compose(raw);
    if (!puzzle) continue;
    const err = invariantError(puzzle);
    if (err) continue;
    if (G.history.indexOf(puzzle.sig) >= 0) continue;
    G.history.push(puzzle.sig);
    if (G.history.length > 8) G.history.shift();
    return puzzle;
  }
  for (let i = 0; i < 24; i++) {
    const raw = rollRaw(diff);
    const puzzle = compose(raw);
    if (puzzle && !invariantError(puzzle)) {
      G.history.push(puzzle.sig);
      if (G.history.length > 8) G.history.shift();
      return puzzle;
    }
  }
  const fallback = compose(rollAdd3());
  G.history.push(fallback.sig);
  if (G.history.length > 8) G.history.shift();
  return fallback;
}

/* ---------------- flow ---------------- */

function shieldsFor(diff) {
  if (diff === 'hard' || diff === 'extreme') return 4;
  return 5;
}
function nextMult() {
  if (G.difficulty !== 'extreme') return 1;
  if (G.combo >= 2) return 3;
  if (G.combo >= 1) return 2;
  return 1;
}
function activePilot() {
  if (G.mode !== 'coop') return 0;
  return G.step === 1 ? G.pilots[0] : G.pilots[1];
}
function makeDuelists(n) {
  const list = [];
  for (let i = 0; i < n; i++) list.push({ step: 1, lives: 3, stars: 0, score: 0, stun: 0, cursor: 0, locked1: false, done: false, out: false });
  return list;
}

function startRun() {
  fixMode();
  G.scene = 'play';
  G.round = 1;
  G.score = 0;
  G.shieldsMax = shieldsFor(G.difficulty);
  G.shields = G.shieldsMax;
  G.combo = 0;
  G.bestCombo = 0;
  G.correctSteps = 0;
  G.wrongSteps = 0;
  G.particles = [];
  G.floaters = [];
  G.duelists = makeDuelists(G.mode === 'duel' ? G.playersN : 0);
  G.overReason = '';
  G.stats = null;
  beginRound();
}

function beginRound() {
  G.puzzle = createPuzzle(G.difficulty);
  G.step = 1;
  G.options1 = buildOptions(G.puzzle.step1);
  G.options2 = buildOptions(G.puzzle.step2);
  G.cursor = 0;
  G.winner = -1;
  G.clean = true;
  G.charge = 0;
  G.surge = 0;
  G.badFlash = null;
  G.timerMax = TIMER[G.difficulty];
  G.timer = G.timerMax;
  G.timerOn = false;
  G.tip = G.puzzle.strategy;
  G.tipColor = COL.dim;
  G.after = 'arm';
  G.gate = 0.4;
  if (G.mode === 'coop') {
    const n = G.playersN;
    const i = G.round - 1;
    G.pilots = [i % n, (i + 1) % n];
  }
  if (G.mode === 'duel') {
    G.duelists.forEach(function (d) {
      d.step = 1;
      d.locked1 = false;
      d.done = false;
      d.cursor = 0;
      d.stun = 0;
      d.out = d.lives <= 0;
    });
    if (G.duelists.every(function (d) { return d.out; })) {
      G.overReason = 'All lane lives lost';
      finish();
      return;
    }
  }
  announce('Round ' + G.round + '. ' + G.puzzle.missionBadge + '. ' + G.puzzle.directive + ' ' + G.puzzle.step1.subtitle);
}

function spawnBurst(x, y, color, n) {
  const count = REDUCE ? Math.min(6, n) : n;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 50 + Math.random() * 220;
    G.particles.push({
      x: x, y: y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 30,
      life: 0.45 + Math.random() * 0.45,
      age: 0,
      color: color,
      r: 1.5 + Math.random() * 2.8
    });
  }
}
function floatText(text, x, y, color) {
  G.floaters.push({ text: text, x: x, y: y, color: color, age: 0, life: 1.25 });
}

function step1Done() {
  if (!G.puzzle) return false;
  if (G.mode === 'duel') {
    if (G.winner >= 0) return true;
    const live = G.duelists.filter(function (d) { return !d.out; });
    return live.length > 0 && live.every(function (d) { return d.locked1 || d.done; });
  }
  return G.step >= 2 || G.after === 'step2' || G.surge > 0;
}

function choose(playerIndex, cardIndex) {
  if (G.scene !== 'play' || G.gate > 0 || !G.puzzle) return;
  if (cardIndex < 0 || cardIndex > 3) return;
  if (G.mode === 'duel') {
    const d = G.duelists[playerIndex];
    if (!d || d.out || d.done || d.stun > 0 || G.winner >= 0) return;
    const options = d.step === 1 ? G.options1 : G.options2;
    const opt = options[cardIndex];
    if (!opt) return;
    if (opt.correct) {
      G.correctSteps++;
      sfx.snap();
      if (d.step === 1) {
        d.step = 2;
        d.locked1 = true;
        d.cursor = 0;
        sfx.charge();
        G.charge = Math.max(G.charge, 0.45);
        spawnBurst(640, 400, PILOT[playerIndex].color, 16);
        G.tip = PILOT[playerIndex].call + ' locked Step 1. Race the mission target.';
        G.tipColor = PILOT[playerIndex].color;
      } else {
        d.done = true;
        d.stars += 1;
        const bonus = Math.ceil(G.timer * 6);
        const mult = nextMult();
        const gain = Math.round((400 + bonus) * mult);
        d.score += gain;
        if (G.clean) {
          G.combo += 1;
          G.bestCombo = Math.max(G.bestCombo, G.combo);
        }
        G.winner = playerIndex;
        G.surge = 1;
        G.flash = 0.45;
        sfx.blast();
        sfx.fanfare();
        G.timerOn = false;
        G.tip = PILOT[playerIndex].call + ' overcharges the core. +1 star. +' + fmt(gain) + ' speed points.';
        G.tipColor = COL.gold;
        floatText('+' + fmt(gain), 640, 430, COL.gold);
        spawnBurst(640, 360, COL.gold, 36);
        G.after = (G.round >= ROUNDS) ? 'results' : 'next';
        G.gate = 1.55;
        if (G.duelists.every(function (x) { return x.out; })) G.after = 'results';
      }
    } else {
      d.lives -= 1;
      d.stun = 1.5;
      G.wrongSteps++;
      G.clean = false;
      G.combo = 0;
      sfx.buzz();
      G.shake = REDUCE ? 0 : 7;
      G.flash = 0.18;
      G.badFlash = { step: d.step, index: cardIndex, until: G.time + 0.45, player: playerIndex };
      G.tip = 'Chief Engineer — ' + PILOT[playerIndex].call + ' overload. ' + opt.tip;
      G.tipColor = '#ff8aa0';
      if (d.lives <= 0) {
        d.out = true;
        d.stun = 0;
      }
      if (G.duelists.every(function (x) { return x.out; })) {
        G.overReason = 'All lane lives lost';
        G.timerOn = false;
        G.after = 'results';
        G.gate = 1.7;
      }
    }
    return;
  }

  if (G.mode === 'coop' && playerIndex !== activePilot()) return;
  const options = G.step === 1 ? G.options1 : G.options2;
  const opt = options[cardIndex];
  if (!opt) return;
  if (opt.correct) {
    G.correctSteps++;
    if (G.step === 1) {
      sfx.snap();
      sfx.charge();
      G.charge = 1;
      G.tip = G.puzzle.step1.coach;
      G.tipColor = COL.green;
      G.after = 'step2';
      G.gate = 1.05;
      G.timerOn = false;
      spawnBurst(640, 390, COL.cyan, 22);
      G.badFlash = null;
    } else {
      const bonus = Math.ceil(Math.max(0, G.timer) * (G.difficulty === 'extreme' ? 8 : 5));
      const mult = nextMult();
      const gain = Math.round((400 + bonus) * mult);
      if (G.clean) {
        G.combo += 1;
        G.bestCombo = Math.max(G.bestCombo, G.combo);
      } else {
        G.combo = 0;
      }
      G.score += gain;
      G.surge = 1;
      G.flash = 0.4;
      sfx.blast();
      sfx.fanfare();
      G.timerOn = false;
      const multLabel = mult > 1 ? '  ×' + mult : '';
      G.tip = '+' + fmt(gain) + ' forge points' + multLabel + '. ' + G.puzzle.step2.coach;
      G.tipColor = COL.gold;
      floatText('+' + fmt(gain) + (mult > 1 ? '  ×' + mult : ''), 640, 420, COL.gold);
      spawnBurst(640, 360, COL.gold, 40);
      G.after = (G.round >= ROUNDS || G.shields <= 0) ? 'results' : 'next';
      G.gate = 1.5;
    }
  } else {
    G.wrongSteps++;
    G.clean = false;
    G.combo = 0;
    G.shields -= 1;
    G.shake = REDUCE ? 0 : 8;
    G.flash = 0.2;
    sfx.buzz();
    G.badFlash = { step: G.step, index: cardIndex, until: G.time + 1.4 };
    G.tip = 'Chief Engineer — ' + opt.tip;
    G.tipColor = '#ff8aa0';
    G.timerOn = false;
    if (G.shields <= 0) {
      G.overReason = 'Core shields depleted';
      G.after = 'results';
      G.gate = 2.05;
    } else {
      G.after = 'reshuffle';
      G.gate = 2.05;
    }
  }
}

function timeoutRound() {
  G.timer = 0;
  G.timerOn = false;
  G.clean = false;
  G.combo = 0;
  sfx.buzz();
  if (G.mode === 'duel') {
    G.duelists.forEach(function (d) {
      if (!d.out && !d.done) {
        d.lives -= 1;
        if (d.lives <= 0) d.out = true;
      }
    });
    G.tip = 'Reactor timeout. Every pilot still racing loses 1 lane life. Target was ' + fmt(G.puzzle.step2.answer) + ' ' + G.puzzle.flavor.unit + '.';
    G.tipColor = '#ff8aa0';
    if (G.duelists.every(function (d) { return d.out; })) {
      G.overReason = 'Reactor timeout';
      G.after = 'results';
    } else {
      G.after = G.round >= ROUNDS ? 'results' : 'next';
    }
    G.gate = 1.7;
    return;
  }
  G.shields -= 1;
  G.tip = "Time's up. " + G.puzzle.step2.coach;
  G.tipColor = '#ff8aa0';
  if (G.shields <= 0) {
    G.overReason = 'Core shields depleted';
    G.after = 'results';
  } else {
    G.after = G.round >= ROUNDS ? 'results' : 'next';
  }
  G.gate = 1.8;
}

function finish() {
  G.scene = 'results';
  G.timerOn = false;
  G.gate = 0;
  G.after = '';
  if (G.mode === 'solo' && G.score > G.bestSolo) {
    G.bestSolo = G.score;
    writeBest(BEST_SOLO, G.score);
  }
  if (G.mode === 'coop' && G.score > G.bestCoop) {
    G.bestCoop = G.score;
    writeBest(BEST_COOP, G.score);
  }
  G.stats = {
    score: G.score,
    correct: G.correctSteps,
    wrong: G.wrongSteps,
    round: G.round,
    reason: G.overReason,
    combo: G.bestCombo,
    shields: G.shields,
    shieldsMax: G.shieldsMax,
    duel: G.duelists.map(function (d) { return { stars: d.stars, lives: d.lives, score: d.score }; })
  };
  if (G.surge <= 0) sfx.fanfare();
  announce('Run complete. ' + (G.mode === 'duel' ? 'Duel results.' : 'Score ' + G.score + '.'));
}

function resolveGate() {
  const action = G.after;
  G.after = '';
  if (action === 'arm') {
    G.timerOn = true;
    return;
  }
  if (action === 'step2') {
    G.step = 2;
    G.cursor = 0;
    G.timerOn = true;
    G.tip = 'Step 2 is live. ' + (G.puzzle ? G.puzzle.step2.subtitle : '');
    G.tipColor = '#d7e8ff';
    if (G.puzzle) announce(G.puzzle.step2.subtitle);
    return;
  }
  if (action === 'reshuffle') {
    if (G.step === 1) G.options1 = buildOptions(G.puzzle.step1);
    else G.options2 = buildOptions(G.puzzle.step2);
    G.cursor = 0;
    G.badFlash = null;
    G.timerOn = true;
    return;
  }
  if (action === 'next') {
    if (G.round >= ROUNDS) finish();
    else {
      G.round += 1;
      beginRound();
    }
    return;
  }
  if (action === 'results') finish();
}

function foreignCoopPress() {
  if (G.mode !== 'coop' || G.gate > 0) return;
  const active = activePilot();
  for (let p = 0; p < G.playersN; p++) {
    if (p === active) continue;
    for (let k = 0; k < PILOT[p].codes.length; k++) {
      if (keyEdge.has(PILOT[p].codes[k])) {
        G.tip = PILOT[p].call + ' is on standby. ' + PILOT[active].call + ' locks this step.';
        G.tipColor = PILOT[active].color;
        return;
      }
    }
  }
}

function moveCursor(delta, owner) {
  if (G.mode === 'duel') {
    const d = G.duelists[owner];
    if (!d || d.out || d.done || d.stun > 0) return;
    d.cursor = (d.cursor + delta + 4) % 4;
  } else {
    G.cursor = (G.cursor + delta + 4) % 4;
  }
  sfx.tick();
}

function consumePlay(clicked) {
  if (clicked && hit(muteRect(), clicked)) {
    toggleMute();
    return;
  }
  if (G.gate > 0) return;
  foreignCoopPress();
  if (G.mode !== 'duel') {
    const pilot = activePilot();
    if (clicked) {
      const rects = cardRects(G.step);
      for (let i = 0; i < 4; i++) if (hit(rects[i], clicked)) choose(pilot, i);
    }
    const codes = PILOT[pilot].codes;
    for (let i = 0; i < 4; i++) {
      if (keyEdge.has(codes[i])) choose(pilot, i);
      if (pilot === 0 && keyEdge.has('Numpad' + (i + 1))) choose(0, i);
    }
    if (keyEdge.has('ArrowLeft')) moveCursor(-1, pilot);
    if (keyEdge.has('ArrowRight')) moveCursor(1, pilot);
    if (keyEdge.has('Space') || keyEdge.has('Enter') || keyEdge.has('NumpadEnter')) choose(pilot, G.cursor);
    const pad = padEdge[pilot];
    if (pad) {
      if (pad.left) moveCursor(-1, pilot);
      if (pad.right) moveCursor(1, pilot);
      if (pad.A) choose(pilot, G.cursor);
    }
    return;
  }
  if (clicked && G.duelists[0] && !G.duelists[0].out) {
    const rects = cardRects(G.duelists[0].step);
    for (let i = 0; i < 4; i++) if (hit(rects[i], clicked)) choose(0, i);
  }
  for (let p = 0; p < G.playersN; p++) {
    const d = G.duelists[p];
    if (!d || d.out || d.done || d.stun > 0 || G.winner >= 0) continue;
    const codes = PILOT[p].codes;
    for (let i = 0; i < 4; i++) {
      if (keyEdge.has(codes[i])) choose(p, i);
      if (p === 0 && keyEdge.has('Numpad' + (i + 1))) choose(p, i);
    }
    if (p === 0) {
      if (keyEdge.has('ArrowLeft')) moveCursor(-1, 0);
      if (keyEdge.has('ArrowRight')) moveCursor(1, 0);
      if (keyEdge.has('Space') || keyEdge.has('Enter') || keyEdge.has('NumpadEnter')) choose(0, d.cursor);
    }
    const pad = padEdge[p];
    if (pad) {
      if (pad.left) moveCursor(-1, p);
      if (pad.right) moveCursor(1, p);
      if (pad.A) choose(p, d.cursor);
    }
  }
}

/* ---------------- title / results input ---------------- */

function titleRows() {
  const rows = [];

  ['solo', 'coop', 'duel'].forEach(function (mode) {
    r2.push({ rect: { x: x, y: 292, w: mw, h: 50 }, item: { type: 'mode', mode: mode, enabled: modeOk(mode) } });
    x += mw + 16;
  });
  rows.push(r2);
  const dw = 196;
  x = (VW - (dw * 4 + 42)) / 2;
  const r3 = [];
  DIFFS.forEach(function (d) {

    x += dw + 14;
  });
  rows.push(r3);
  rows.push([{ rect: { x: 390, y: 496, w: 500, h: 58 }, item: { type: 'start' } }]);
  return rows;
}

function activateTitle(item) {
  if (!item) return;
  if (item.type === 'players') {
    G.playersN = item.n;
    fixMode();
    G.note = item.n === 1 ? 'Solo flight. One pilot, one forge score.' : (item.n + ' pilots. Choose Team Co-op or Mecha Duel.');
    sfx.tick();
  } else if (item.type === 'mode') {
    if (!item.enabled) {
      G.note = item.mode === 'solo' ? 'Solo is the 1-pilot bay.' : 'Co-op and Duel need 2 or 3 pilots.';
      sfx.buzz();
      return;
    }
    G.mode = item.mode;
    G.note = item.mode === 'coop' ? 'One team score. Pilots rotate Step 1 and Step 2.' : (item.mode === 'duel' ? 'Fastest pilot to lock both steps wins the star.' : 'Solo forge. Chase the high score.');
    sfx.tick();
  } else if (item.type === 'diff') {
    G.difficulty = item.d;
    const info = DIFFS.filter(function (d) { return d.id === item.d; })[0];
    G.note = info.rank + ' — ' + info.blurb;
    sfx.tick();
  } else if (item.type === 'start') {
    sfx.snap();
    startRun();
  }
}

function consumeTitle(clicked) {
  const rows = titleRows();
  if (clicked && hit(muteRect(), clicked)) toggleMute();
  if (clicked) {
    for (let r = 0; r < rows.length; r++) {
      for (let c = 0; c < rows[r].length; c++) {
        if (hit(rows[r][c].rect, clicked)) {
          G.focus = { row: r, col: c };
          activateTitle(rows[r][c].item);
        }
      }
    }
  }
  const row = rows[G.focus.row] || rows[0];
  if (keyEdge.has('ArrowRight') || (padEdge[0] && padEdge[0].right)) {
    G.focus.col = (G.focus.col + 1) % row.length;
    sfx.tick();
  }
  if (keyEdge.has('ArrowLeft') || (padEdge[0] && padEdge[0].left)) {
    G.focus.col = (G.focus.col + row.length - 1) % row.length;
    sfx.tick();
  }
  if (keyEdge.has('ArrowDown') || (padEdge[0] && padEdge[0].down)) {
    G.focus.row = Math.min(rows.length - 1, G.focus.row + 1);
    G.focus.col = Math.min(G.focus.col, rows[G.focus.row].length - 1);
    sfx.tick();
  }
  if (keyEdge.has('ArrowUp') || (padEdge[0] && padEdge[0].up)) {
    G.focus.row = Math.max(0, G.focus.row - 1);
    G.focus.col = Math.min(G.focus.col, rows[G.focus.row].length - 1);
    sfx.tick();
  }
  if (keyEdge.has('Enter') || keyEdge.has('Space') || keyEdge.has('NumpadEnter') || (padEdge[0] && padEdge[0].A)) {
    const item = rows[G.focus.row][G.focus.col];
    if (item) activateTitle(item.item);
  }
}

function resultButtons() {
  return [
