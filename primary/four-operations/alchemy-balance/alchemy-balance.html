    ctx.textBaseline = 'alphabetic';
  }

  function drawScale(box, solvedAmt) {
    const cx = box.x + box.w * 0.5;
    const beamY = box.y + 62;
    const wobble = (1 - solvedAmt) * Math.sin(state.time * 1.7) * 0.12;
    const angle = wobble;
    ctx.strokeStyle = '#16324a';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, beamY + 8);
    ctx.lineTo(cx, box.y + box.h - 28);
    ctx.stroke();
    ctx.fillStyle = '#16324a';
    ctx.beginPath();
    ctx.moveTo(cx - 46, box.y + box.h - 22);
    ctx.lineTo(cx + 46, box.y + box.h - 22);
    ctx.lineTo(cx + 32, box.y + box.h - 12);
    ctx.lineTo(cx - 32, box.y + box.h - 12);
    ctx.closePath();
    ctx.fill();
    const reach = Math.min(150, box.w * 0.36);
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const lx = cx + (-reach) * cos;
    const ly = beamY + (-reach) * sin;
    const rx = cx + reach * cos;
    const ry = beamY + reach * sin;
    ctx.strokeStyle = solvedAmt > 0.65 ? COL.emerald : COL.cyan;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(rx, ry);
    ctx.stroke();
    ctx.fillStyle = solvedAmt > 0.65 ? COL.emerald : COL.gold;
    ctx.beginPath();
    ctx.arc(cx, beamY, 7, 0, Math.PI * 2);
    ctx.fill();
    function hanger(hx, hy) {
      ctx.strokeStyle = COL.dim;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx, hy + 26);
      ctx.stroke();
      roundRect(hx - 58, hy + 26, 116, 36, 8, 'rgba(10,20,36,0.9)', solvedAmt > 0.65 ? COL.emerald : COL.line, 1.5);
    }
    hanger(lx, ly);
    hanger(rx, ry);
    drawPansContent(state.problem, lx, ly + 44, rx, ry + 44, solvedAmt);
    ctx.fillStyle = solvedAmt > 0.65 ? COL.emerald : COL.dim;
    ctx.font = '700 12px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(solvedAmt > 0.65 ? 'LEVEL · RUNE STAMPED' : (state.problem.clue1Type === 'twin' ? 'TWIN FACTOR PRESS' : (state.problem.clue1Type === 'inverse' ? 'INVERSE FLASKS' : 'EQUAL-PAN SCALE')), cx, box.y + box.h - 2);
    ctx.textAlign = 'left';
  }

  function drawCauldron(box, solvedAmt) {
    const cx = box.x + box.w * 0.5;
    const top = box.y + 58;
    const bowlH = 120;
    ctx.fillStyle = '#1a120c';
    ctx.fillRect(cx - 70, top + bowlH - 6, 16, 28);
    ctx.fillRect(cx + 54, top + bowlH - 6, 16, 28);
    ctx.beginPath();
    ctx.moveTo(cx - 96, top + 10);
    ctx.bezierCurveTo(cx - 120, top + bowlH, cx + 120, top + bowlH, cx + 96, top + 10);
    ctx.closePath();
    ctx.fillStyle = '#121820';
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - 90, top + 24);
    ctx.bezierCurveTo(cx - 108, top + bowlH - 8, cx + 108, top + bowlH - 8, cx + 90, top + 24);
    ctx.closePath();
    ctx.clip();
    const fillTop = top + bowlH - 18 - (70 + solvedAmt * 20);
    const lg = ctx.createLinearGradient(cx, fillTop, cx, top + bowlH);
    lg.addColorStop(0, solvedAmt > 0.5 ? '#ffd56a' : '#39f3ff');
    lg.addColorStop(1, solvedAmt > 0.5 ? '#ff4ad8' : '#1a6cff');
    ctx.fillStyle = lg;
    ctx.fillRect(cx - 120, fillTop + Math.sin(state.time * 3) * 3, 240, bowlH);
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];
      const bx = cx - 70 + b.u * 140;
      const by = fillTop + 10 + b.v * (top + bowlH - fillTop - 16);
      ctx.globalAlpha = 0.35 + 0.4 * (1 - b.v);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(bx, by, b.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(cx - 96, top + 10);
    ctx.bezierCurveTo(cx - 120, top + bowlH, cx + 120, top + bowlH, cx + 96, top + 10);
    ctx.strokeStyle = solvedAmt > 0.5 ? COL.gold : COL.magenta;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx, top + 10, 96, 14, 0, 0, Math.PI * 2);
    ctx.strokeStyle = solvedAmt > 0.5 ? COL.gold : COL.cyan;
    ctx.stroke();
    if (state.problem && state.step >= 1 && solvedAmt < 0.85) {
      drawRune(state.problem.sym1.id, cx, top + 2, 13, RUNE_COLOR[state.problem.sym1.id]);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = solvedAmt > 0.55 ? COL.gold : COL.ink;
    ctx.font = '700 18px "Segoe UI", system-ui, sans-serif';
    if (solvedAmt > 0.55) ctx.fillText(fmt(state.problem.sym2Value) + ' mL', cx, top + 78);
    else ctx.fillText(state.step >= 1 ? 'POUR THE RUNE' : 'WAITING', cx, top + 78);
    ctx.fillStyle = solvedAmt > 0.55 ? COL.gold : COL.dim;
    ctx.font = '700 12px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(solvedAmt > 0.55 ? 'BREW LOCKED' : 'PLASMA CAULDRON', cx, box.y + box.h - 2);
    ctx.textAlign = 'left';
  }

  function drawBeaker(box, solvedAmt) {
    const p = state.problem;
    const cx = box.x + box.w * 0.52;
    const top = box.y + 36;
    const bottom = box.y + box.h - 28;
    ctx.beginPath();
    ctx.moveTo(cx - 42, top);
    ctx.lineTo(cx - 58, bottom);
    ctx.lineTo(cx + 58, bottom);
    ctx.lineTo(cx + 42, top);
    ctx.closePath();
    ctx.fillStyle = 'rgba(180, 230, 255, 0.05)';
    ctx.fill();
    ctx.save();
    ctx.clip();
    const level = bottom - (bottom - top - 16) * (0.12 + solvedAmt * 0.72);
    ctx.fillStyle = solvedAmt > 0.6 ? 'rgba(255, 213, 106, 0.85)' : 'rgba(57, 243, 255, 0.28)';
    ctx.fillRect(cx - 70, level, 140, bottom - level + 4);
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(cx - 42, top);
    ctx.lineTo(cx - 58, bottom);
    ctx.lineTo(cx + 58, bottom);
    ctx.lineTo(cx + 42, top);
    ctx.strokeStyle = solvedAmt > 0.6 ? COL.gold : COL.cyan;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.strokeStyle = COL.dim;
    ctx.lineWidth = 1.5;
    for (let i = 1; i <= 8; i++) {
      const y = bottom - ((bottom - top - 8) * i) / 9;
      const major = i % 2 === 0;
      ctx.beginPath();
      ctx.moveTo(cx + 36, y);
      ctx.lineTo(cx + (major ? 52 : 46), y);
      ctx.stroke();
    }
    ctx.textAlign = 'center';
    if (solvedAmt > 0.6) {
      ctx.fillStyle = COL.gold;
      ctx.font = '700 20px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(fmt(p.finalVolume) + ' mL', cx, (top + bottom) / 2);
      for (let i = 0; i < 5; i++) {
        const a = state.time * 2 + i;
        drawRune('diamond', cx - 40 + i * 20, top - 8 + Math.sin(a) * 3, 6, COL.gold);
      }
    } else if (state.step === 2 && state.cauldronSolved) {
      ctx.strokeStyle = COL.gold;
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(box.x - 30, top + 40);
      ctx.lineTo(cx - 48, top + 50);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = solvedAmt > 0.6 ? COL.gold : COL.dim;
    ctx.font = '700 12px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(solvedAmt > 0.6 ? 'ELIXIR SEALED' : 'GRADUATED BEAKER', cx, box.y + box.h - 2);
    ctx.textAlign = 'left';
  }

  function drawStage() {
    const s = GEO.stage;
    const shakeX = state.shake > 0.4 ? (Math.random() - 0.5) * state.shake : 0;
    const shakeY = state.shake > 0.4 ? (Math.random() - 0.5) * state.shake : 0;
    ctx.save();
    ctx.translate(shakeX, shakeY);
    roundRect(s.x, s.y, s.w, s.h, 16, 'rgba(6,10,20,0.9)', COL.line, 1.5);
    const names = ['LASER BALANCE', 'PLASMA CAULDRON', 'GRADUATED BEAKER'];
    const marks = ['done', 'done', 'done'];
    marks[0] = state.scaleSolved ? 'done' : (state.step === 0 ? 'active' : 'idle');
    marks[1] = state.cauldronSolved ? 'done' : (state.step === 1 ? 'active' : 'idle');
    marks[2] = state.beakerSolved ? 'done' : (state.step === 2 ? 'active' : 'idle');
    for (let i = 0; i < 3; i++) {
      const box = stationBox(i);
      const accent = marks[i] === 'done' ? COL.emerald : (marks[i] === 'active' ? (i === 1 ? COL.magenta : COL.cyan) : COL.line);
      roundRect(box.x, box.y, box.w, box.h, 12, 'rgba(8,16,30,0.65)', accent, marks[i] === 'idle' ? 1 : 2);
      ctx.globalAlpha = marks[i] === 'idle' ? 0.72 : 1;
      ctx.fillStyle = accent;
      ctx.font = '700 12px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(names[i], box.x + box.w / 2, box.y + 16);
      ctx.textAlign = 'left';
      if (i === 0) drawScale(box, state.vis.scale);
      else if (i === 1) drawCauldron(box, state.vis.cauldron);
      else drawBeaker(box, state.vis.beaker);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawStatus() {
    const s = GEO.status;
    const alertOn = !!state.alert && state.phase !== 'celebrate';
    roundRect(s.x, s.y, s.w, s.h, 12, alertOn ? 'rgba(42, 10, 18, 0.96)' : 'rgba(8,14,28,0.92)', alertOn ? COL.danger : COL.line, 1.5);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    if (state.phase === 'celebrate') {
      ctx.fillStyle = COL.emerald;
      ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(state.celebrate, s.x + 18, s.y + 42);
      ctx.fillStyle = COL.dim;
      ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(roleLine(), s.x + 18, s.y + 70);
      return;
    }
    if (alertOn) {
      ctx.fillStyle = COL.danger;
      ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
      const title = state.phase === 'down' ? 'DIAGNOSTIC ALERT  ·  SHIELDS DOWN' : 'DIAGNOSTIC ALERT  ·  SHIELD −1';
      ctx.fillText(title, s.x + 16, s.y + 20);
      const lines = wrapText(state.alert, s.w - 36, '600 15px "Segoe UI", system-ui, sans-serif');
      ctx.fillStyle = COL.ink;
      ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
      const show = lines.slice(0, 4);
      for (let i = 0; i < show.length; i++) ctx.fillText(show[i], s.x + 16, s.y + 42 + i * 16);
      return;
    }
    if (state.phase === 'down') {
      ctx.fillStyle = COL.danger;
      ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(state.celebrate || 'SHIELDS SHATTERED', s.x + 18, s.y + 42);
      ctx.fillStyle = COL.dim;
      ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('Foundry locks in a moment.', s.x + 18, s.y + 70);
      return;
    }
    ctx.fillStyle = COL.gold;
    ctx.font = '700 12px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(roleLine(), s.x + 16, s.y + 20);
    let promptTop = s.y + 44;
    if (state.note) {
      ctx.fillStyle = COL.cyan;
      ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
      const noteLines = wrapText(state.note, s.w - 36, '600 13px "Segoe UI", system-ui, sans-serif');
      ctx.fillText(noteLines[0] || '', s.x + 16, s.y + 40);
      promptTop = s.y + 62;
    }
    const lines = wrapText(state.problem.steps[state.step].prompt, s.w - 36, '600 16px "Segoe UI", system-ui, sans-serif');
    ctx.fillStyle = COL.ink;
    ctx.font = '600 16px "Segoe UI", system-ui, sans-serif';
    const maxLines = state.note ? 2 : 3;
    for (let i = 0; i < Math.min(maxLines, lines.length); i++) ctx.fillText(lines[i], s.x + 16, promptTop + i * 18);
  }

  function drawCards() {
    const step = state.problem.steps[state.step];
    for (let i = 0; i < 4; i++) {
      const r = UI.cards[i];
      const card = step.choices[i];
      let border = COL.line;
      let width = 1.5;
      let fill = COL.card;
      const p1Here = pads[0].focus === i;
      const p2Here = state.mode !== 'solo' && pads[1].focus === i;
      const bad = state.badCard === i && (state.badT > 0 || (!!state.alert && state.phase === 'input'));
      const good = state.goodCard === i && state.phase === 'celebrate';
      if (good) {
        border = COL.emerald;
        width = 3;
        fill = '#10261c';
      } else if (bad) {
        border = COL.danger;
        width = 3;
        fill = '#2a1018';
      } else if (p1Here && p2Here) {
        border = COL.gold;
        width = 3;
      } else if (p1Here) {
        border = state.mode === 'solo' ? COL.cyan : COL.p1;
        width = 3;
      } else if (p2Here) {
        border = COL.p2;
        width = 2.5;
      }
      roundRect(r.x, r.y, r.w, r.h, 12, fill, border, width);
      ctx.fillStyle = COL.muted;
      ctx.font = '700 12px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(String(i + 1), r.x + 12, r.y + 20);
      if (state.mode === 'coop' && state.step === 2) {
        ctx.textAlign = 'right';
        ctx.fillStyle = COL.p1;
        if (state.ready[0] === i) ctx.fillText('P1 READY', r.x + r.w - 10, r.y + 20);
        ctx.fillStyle = COL.p2;
        if (state.ready[1] === i) ctx.fillText('P2 READY', r.x + r.w - 10, r.y + 36);
      }
      const label = fmt(card.value);
      ctx.textAlign = 'center';
      ctx.fillStyle = COL.ink;
      let size = 36;
      ctx.font = '700 ' + size + 'px "Segoe UI", system-ui, sans-serif';
      while (size > 20 && ctx.measureText(label).width > r.w - 24) {
        size -= 2;
        ctx.font = '700 ' + size + 'px "Segoe UI", system-ui, sans-serif';
      }
      ctx.fillText(label, r.x + r.w / 2, r.y + 68);
      ctx.fillStyle = COL.dim;
      ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(step.unit || 'value', r.x + r.w / 2, r.y + 92);
    }
    const lock = UI.lock;
    const pulse = 0.5 + 0.5 * Math.sin(state.time * 4);
    const labels = ['LEVEL SCALE', 'BREW CAULDRON', state.problem.rounding === 'exact' ? 'CORK ELIXIR' : 'DECANT BEAKER'];
    roundRect(lock.x, lock.y, lock.w, lock.h, 12, '#1a1608', COL.gold, 2 + pulse);
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.gold;
    ctx.font = '700 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(labels[state.step], lock.x + lock.w / 2, lock.y + 48);
    ctx.fillStyle = COL.dim;
    ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('LOCK IN', lock.x + lock.w / 2, lock.y + 74);
    ctx.textAlign = 'left';
    ctx.fillStyle = COL.muted;
    ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
    let help = 'Mouse or WASD / arrows · Space locks · M mutes · ' + state.padNote;
    if (state.mode === 'coop') help = 'P1 WASD + F/Space · P2 arrows + Enter · dual 8BitDo A · step 3 needs both · ' + state.padNote;
    else if (state.mode === 'duel') help = 'P1 WASD + F/Space · P2 arrows + Enter · first correct lock takes the star · ' + state.padNote;
    ctx.fillText(help, 20, 692);
  }

  function drawReticle(x, y, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.moveTo(x - 16, y);
    ctx.lineTo(x - 5, y);
    ctx.moveTo(x + 5, y);
    ctx.lineTo(x + 16, y);
    ctx.moveTo(x, y - 16);
    ctx.lineTo(x, y - 5);
    ctx.moveTo(x, y + 5);
    ctx.lineTo(x, y + 16);
    ctx.stroke();
    ctx.restore();
  }

  function drawReticles() {
    if (pointer.inside) drawReticle(pointer.x, pointer.y, state.mode === 'duel' || state.mode === 'coop' ? COL.p1 : COL.cyan);
    if (state.screen === 'play' && state.mode !== 'solo') {
      const card = UI.cards[pads[1].focus];
      if (card) drawReticle(card.x + card.w - 18, card.y + 18, COL.p2);
    }
  }

  function drawTitle() {
    drawLab();
    drawMute(UI.mute.x, UI.mute.y);
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.gold;
    ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('SINGAPORE PRIMARY 4–5  ·  PICTORIAL ALGEBRA & MULTI-STEP WHOLE NUMBERS', VW / 2, 118);
    ctx.fillStyle = COL.cyan;
    ctx.font = '700 54px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('ALCHEMY BALANCE', VW / 2, 180);
    ctx.fillStyle = COL.magenta;
    ctx.font = '700 26px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('POTION SYMBOL FOUNDRY', VW / 2, 218);
    roundRect(170, 248, 940, 180, 16, 'rgba(8,14,28,0.9)', COL.line, 1.5);
    ctx.fillStyle = COL.ink;
    ctx.font = '600 16px "Segoe UI", system-ui, sans-serif';
    const lines = [
      'Level the laser scale: identical runes share one mass. Twin crystals multiply, they do not halve.',
      'Reverse a flask split by multiplying back, then pour that rune into the plasma cauldron.',
      'Decant the brew: nearest ten, nearest hundred, or the exact volume — read the beaker mission.',
      'Three steps each round. A wrong card costs a shield and opens a diagnostic alert.'
    ];
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], VW / 2, 286 + i * 32);
    const modes = [
      { t: 'SOLO ALCHEMIST', a: 'Mouse, WASD or arrows, Space', b: '8BitDo pad 0 · D-pad + A', c: COL.cyan },
      { t: 'TEAM CO-OP', a: 'Shared team score and shields', b: 'P1 then P2, both seal step 3', c: COL.emerald },
      { t: 'COMPETITIVE DUEL', a: 'Same recipe, fastest lock-in', b: 'Step 3 awards a winner star', c: COL.magenta }
    ];
    for (let i = 0; i < 3; i++) {
      const r = UI.titleBtns[i];
      const on = state.titleIndex === i;
      roundRect(r.x, r.y, r.w, r.h, 14, on ? '#14243f' : COL.card, on ? modes[i].c : COL.line, on ? 3 : 1.5);
      ctx.fillStyle = modes[i].c;
      ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(modes[i].t, r.x + r.w / 2, r.y + 42);
      ctx.fillStyle = COL.ink;
      ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(modes[i].a, r.x + r.w / 2, r.y + 74);
      ctx.fillStyle = COL.dim;
      ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(modes[i].b, r.x + r.w / 2, r.y + 98);
    }
    ctx.fillStyle = COL.muted;
    ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('LEFT / RIGHT to choose  ·  ENTER, SPACE, or A to begin  ·  M mutes  ·  ' + state.padNote, VW / 2, 650);
    ctx.textAlign = 'left';
  }

  function drawOver() {
    drawLab();
    drawHUD();
    roundRect(300, 150, 680, 450, 18, 'rgba(8,14,28,0.94)', COL.danger, 2.5);
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.danger;
    ctx.font = '700 36px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('FOUNDRY SHIELDS DOWN', VW / 2, 220);
    ctx.fillStyle = COL.ink;
    ctx.font = '600 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Reached round ' + state.round + ' · ' + (state.problem ? state.problem.tierLabel : ''), VW / 2, 268);
    if (state.mode === 'coop') {
      ctx.fillStyle = COL.gold;
      ctx.font = '700 32px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('FINAL TEAM SCORE  ' + fmt(state.score), VW / 2, 340);
      ctx.fillStyle = COL.dim;
      ctx.font = '600 16px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('One shared score. No individual stars.', VW / 2, 380);
    } else if (state.mode === 'duel') {
      ctx.fillStyle = COL.gold;
      ctx.font = '700 28px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(winnerLine(), VW / 2, 330);
      ctx.fillStyle = COL.p1;
      ctx.font = '700 24px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('P1  ★ ' + state.duel[0].stars + '    ' + fmt(state.duel[0].score), VW / 2, 380);
      ctx.fillStyle = COL.p2;
      ctx.fillText('P2  ★ ' + state.duel[1].stars + '    ' + fmt(state.duel[1].score), VW / 2, 416);
    } else {
      ctx.fillStyle = COL.gold;
      ctx.font = '700 32px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('FINAL SCORE  ' + fmt(state.score), VW / 2, 350);
    }
    const b = UI.overBtn;
    roundRect(b.x, b.y, b.w, b.h, 12, '#102033', COL.cyan, 2);
    ctx.fillStyle = COL.cyan;
    ctx.font = '700 20px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('RETURN TO THE FOUNDRY', VW / 2, b.y + 38);
    ctx.textAlign = 'left';
  }

  function drawPlay() {
    drawLab();
    if (!state.problem) return;
    drawHUD();
    drawBriefing();
    drawStage();
    drawStatus();
    drawCards();
  }

  function frame(ts) {
    if (!frame.last) frame.last = ts;
    const dt = clamp((ts - frame.last) / 1000, 0, 0.05);
    frame.last = ts;
    update(dt);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale, view.dpr * view.ox, view.dpr * view.oy);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    if (state.screen === 'title') drawTitle();
    else if (state.screen === 'over') drawOver();
    else drawPlay();
    drawReticles();
    requestAnimationFrame(frame);
  }

  resize();
  announce('Alchemy Balance: Potion Symbol Foundry. Choose a mode to begin.');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
