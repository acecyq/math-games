  ctx.fillText(text, x + w / 2, y + 13);
}

function buttonLabel() {
  if (!G.problem) return 'LOCK IN CHOICE';
  if (G.phase === 'push') return 'WALLS SHIFTING';
  if (G.phase === 'laser' || G.phase === 'celebrate') {
    return G.problem.lockMode === 'area' ? 'AREA LOCKED' : 'LASER FENCE LIVE';
  }
  if (G.step === 2 && G.problem.lockMode !== 'area') return 'ACTIVATE LASER FENCE';
  if (G.step === 2) return 'LOCK UNCOVERED AREA';
  if (G.mode === 'coop') {
    const owner = stepOwner();
    if (owner === 0) return 'RED SURVEYOR LOCKS IN';
    if (owner === 1) return 'BLUE SURVEYOR LOCKS IN';
    return 'EITHER SURVEYOR LOCKS THE FENCE';
  }
  return 'LOCK IN CHOICE';
}

function drawConsole() {
  const box = UI.console;
  roundRect(ctx, box.x, box.y, box.w, box.h, 18);
  ctx.fillStyle = 'rgba(5, 16, 13, 0.94)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120, 255, 210, 0.18)';
  ctx.stroke();
  const step = G.problem.steps[Math.min(G.step, 2)];
  let kicker = step.kicker;
  let kickerColor = '#8dffe0';
  if (G.mode === 'coop') {
    const owner = stepOwner();
    if (owner === 0) { kicker += '  ·  RED'; kickerColor = P[0].color; }
    else if (owner === 1) { kicker += '  ·  BLUE'; kickerColor = P[1].color; }
    else kicker += '  ·  BOTH';
  } else if (G.mode === 'versus' && G.step === 2) {
    kicker += '  ·  FIRST LOCK CLAIMS THE STAR';
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = font(13, 800);
  ctx.fillStyle = kickerColor;
  ctx.fillText(kicker, box.x + 18, box.y + 16);
  ctx.fillStyle = '#f4fff9';
  const promptSize = step.prompt.length > 92 ? 15 : 17;
  ctx.font = font(promptSize, 800);
  const promptLines = wrap(ctx, step.prompt, box.w - 36, promptSize).slice(0, 2);
  promptLines.forEach(function (line, i) {
    ctx.fillText(line, box.x + 18, box.y + 40 + i * 18);
  });
  const message = G.hint || step.coach;
  const msgColor = G.hint ? '#ffd78a' : '#9be7ff';
  ctx.font = font(14, 700);
  const msgLines = wrap(ctx, message, box.w - 36, 14).slice(0, 2);
  msgLines.forEach(function (line, i) {
    ctx.fillStyle = msgColor;
    ctx.fillText(line, box.x + 18, box.y + 82 + i * 16);
  });

  step.options.forEach(function (opt, i) {
    const card = UI.cards[i];
    const focused = (G.mode === 'solo' && P[0].focus === i) ||
      (G.mode !== 'solo' && (P[0].focus === i || P[1].focus === i)) ||
      G.hoverCard === i;
    const flashing = G.flash && G.flash.index === i && G.flash.until > G.time;
    roundRect(ctx, card.x, card.y, card.w, card.h, 14);
    ctx.fillStyle = opt.dead ? '#1a1214' : (flashing ? '#4a1820' : '#10241c');
    ctx.fill();
    ctx.lineWidth = focused ? 3 : 1.5;
    ctx.strokeStyle = flashing ? '#ff5a6a' : (opt.dead ? '#5a3038' : (focused ? '#d9fff2' : 'rgba(140, 255, 210, 0.35)'));
    ctx.stroke();
    if (G.mode !== 'solo') {
      if (P[0].focus === i) cornerBracket(card, P[0].color, 0);
      if (P[1].focus === i) cornerBracket(card, P[1].color, 1);
    }
    ctx.globalAlpha = opt.dead ? 0.45 : 1;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f6fff9';
    const size = opt.text.length > 16 ? 22 : 28;
    ctx.font = font(size, 800);
    ctx.fillText(opt.text, card.x + card.w / 2, card.y + 34);
    ctx.font = font(13, 700);
    ctx.fillStyle = '#b7ffe4';
    ctx.fillText(opt.sub, card.x + card.w / 2, card.y + 62);
    if (opt.dead) {
      ctx.strokeStyle = '#ff8d9a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(card.x + 16, card.y + card.h / 2);
      ctx.lineTo(card.x + card.w - 16, card.y + card.h / 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  const btn = UI.button;
  const hot = G.step === 2 && G.phase === 'choose';
  roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 12);
  ctx.fillStyle = hot ? '#123f34' : '#0d221b';
  ctx.fill();
  ctx.strokeStyle = hot ? '#b8ffe8' : 'rgba(140, 255, 210, 0.3)';
  ctx.lineWidth = hot ? 2.5 : 1.5;
  ctx.stroke();
  ctx.fillStyle = hot ? '#f3fff9' : '#c9ffe8';
  ctx.font = font(16, 800);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(buttonLabel(), btn.x + btn.w / 2, btn.y + btn.h / 2);
}

function cornerBracket(card, color, which) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.moveTo(card.x + inset, card.y + 18);
  ctx.lineTo(card.x + inset, card.y + inset);
  ctx.lineTo(card.x + 18, card.y + inset);
  ctx.stroke();
}

function drawReticle(x, y, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, 11, 0, Math.PI * 2);
  ctx.moveTo(x - 18, y);
  ctx.lineTo(x - 5, y);
  ctx.moveTo(x + 5, y);
  ctx.lineTo(x + 18, y);
  ctx.moveTo(x, y - 18);
  ctx.lineTo(x, y - 5);
  ctx.moveTo(x, y + 5);
  ctx.lineTo(x, y + 18);
  ctx.stroke();
  ctx.restore();
}

function drawFloaters() {
  G.particles.forEach(function (p) {
    const k = 1 - p.age / p.life;
    ctx.globalAlpha = Math.max(0, k);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  G.floaters.forEach(function (f) {
    ctx.globalAlpha = Math.max(0, 1 - f.age / f.life);
    ctx.fillStyle = f.color;
    ctx.font = font(18, 800);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}

    ctx.fillStyle = '#07140f';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 255, 210, 0.2)';
    ctx.stroke();
    const cyc = G.time % 6.2;
    let push = 0;
    if (cyc < 1.3) push = ease(cyc / 1.3);
    else if (cyc < 3.4) push = 1;
    else if (cyc < 4.6) push = 1 - ease((cyc - 3.4) / 1.2);
    const scale = Math.min(150 / demo.W, 150 / demo.H);
    const lay = {
      scale: scale,
      ox: stage.x + 70,
      oy: stage.y + (stage.h - demo.H * scale) / 2
    };
    drawShape(ctx, demo, push, lay, 0.9);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e7fff6';
    ctx.font = font(16, 800);
    const lines = [
      'Worked example · 9 cm square garden',
      'Flower bed 5 × 5 = 25 cm², uncovered 56 cm².',
      '25 + 56 = 81, so the outer side is 9 cm.',
      'Push the 5 cm wall out. It completes the side.',
      'Two 5 cm walls stay: 36 + 5 + 5 = 46 cm.'
    ];
    lines.forEach(function (line, i) {
      ctx.fillStyle = i === 4 ? '#ffd78a' : '#e7fff6';
      ctx.fillText(line, stage.x + 250, stage.y + 36 + i * 32);
    });
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9adac8';
  ctx.font = font(13, 700);
  const best = 'Best solo ' + fmt(G.bestSolo) + '    ·    Best team ' + fmt(G.bestTeam) + '    ·    Pads ' + G.pads;
  ctx.fillText(best, VIEW_W / 2, 708);
  ctx.fillText('M mutes  ·  Esc pauses  ·  8BitDo A is the bottom button', VIEW_W / 2, 734);
}

function drawOverlay(title, body, a, b, labelA, labelB) {
  ctx.fillStyle = 'rgba(2, 8, 6, 0.72)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f4fff9';
  ctx.font = font(42, 800);
  ctx.fillText(title, VIEW_W / 2, 250);
  ctx.font = font(18, 700);
  ctx.fillStyle = '#d5fff0';
  wrap(ctx, body, 760, 18).slice(0, 3).forEach(function (line, i) {
    ctx.fillText(line, VIEW_W / 2, 310 + i * 26);
  });
  [a, b].forEach(function (rect, i) {
    roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 14);
    ctx.fillStyle = '#12382c';
    ctx.fill();
    ctx.strokeStyle = '#d8fff3';
    ctx.stroke();
    ctx.fillStyle = '#f4fff9';
    ctx.font = font(16, 800);
    ctx.fillText(i === 0 ? labelA : labelB, rect.x + rect.w / 2, rect.y + rect.h / 2);
  });
}

function drawPlay() {
  drawHud();
  drawSpec();
  drawArena();
  drawConsole();
  if (G.screen === 'play') {
    const color = G.mode === 'versus' || G.mode === 'coop' ? P[0].color : '#9bfff6';
    drawReticle(reticle[0].x, reticle[0].y, color);
    if (G.mode !== 'solo') drawReticle(reticle[1].x, reticle[1].y, P[1].color);
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#040a08';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const shakeX = G.shake ? (Math.random() - 0.5) * 8 * G.shake : 0;
  const shakeY = G.shake ? (Math.random() - 0.5) * 6 * G.shake : 0;
  ctx.setTransform(fit.scale, 0, 0, fit.scale, fit.ox + shakeX, fit.oy + shakeY);
  drawBackground();
  if (BOOT_ERROR) {
    ctx.fillStyle = '#ffe1e6';
    ctx.font = font(22, 800);
    ctx.textAlign = 'left';
    ctx.fillText(BOOT_ERROR.slice(0, 180), 40, 80);
    return;
  }
  if (G.screen === 'title') drawTitle();
  else if (G.screen === 'play' || G.screen === 'pause') {
    drawPlay();
    if (G.screen === 'pause') {
      drawOverlay('PAUSED', 'The garden holds still. Resume the survey or return to the title.', PAUSE_RESUME, PAUSE_QUIT, 'RESUME', 'QUIT');
    }
  } else if (G.screen === 'over') {
    drawPlay();
    let body = G.overBody;
    if (G.mode === 'solo') body += ' Score ' + fmt(G.score) + '. Best ' + fmt(G.bestSolo) + '.';
    if (G.mode === 'coop') body += ' Team score ' + fmt(G.score) + '. Best ' + fmt(G.bestTeam) + '.';
    if (G.mode === 'versus') body += '  Red ' + fmt(P[0].score) + '   Blue ' + fmt(P[1].score) + '.';
    if (G.hint && G.mode !== 'versus') body += ' ' + G.hint;
    drawOverlay(G.overTitle || 'SURVEY OVER', body, OVER_RETRY, OVER_TITLE, 'SURVEY AGAIN', 'TITLE');
  }
  drawSound();
  drawFloaters();
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
  fit.dpr = dpr;
  fit.scale = Math.min(canvas.width / VIEW_W, canvas.height / VIEW_H);
  fit.ox = (canvas.width - VIEW_W * fit.scale) / 2;
  fit.oy = (canvas.height - VIEW_H * fit.scale) / 2;
}

function loop(ts) {
  const now = ts || performance.now();
  const dt = Math.min(0.05, (now - (loop.prev || now)) / 1000);
  loop.prev = now;
  update(dt || 0);
  render();
  requestAnimationFrame(loop);
}

function boot() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  muteBtn = document.getElementById('mute');
  sr = document.getElementById('sr');
  reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  loadStore();
  if (muteBtn) {
    muteBtn.textContent = audio.muted ? 'Sound off' : 'Sound on';
    muteBtn.setAttribute('aria-pressed', audio.muted ? 'true' : 'false');
    muteBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMute();
    });
  }
  for (let i = 0; i < 28; i++) {
    G.pollen.push({
      x: Math.random() * VIEW_W,
      y: Math.random() * VIEW_H,
      r: 1 + Math.random() * 2,
      s: 12 + Math.random() * 20,
      ph: Math.random() * 6,
      color: Math.random() < 0.5 ? '#9dffd2' : '#ffd0ea'
    });
  }
  try {
    demo = (function () {
      const notches = [{ side: 'right', offset: 2, mouth: 5, depth: 5, index: 0 }];
      const walked = walkNotches(9, 9, notches);
      const beds = walked.beds;
      beds[0].caption = '5 × 5 cm';
      beds[0].sub = '25 cm²';
      plantBeds(beds, 41);
      return {
        W: 9, H: 9,
        edges: walked.edges,
        beds: beds,
        speckles: makeSpeckles(walked.edges, 9, 9),
        showOuter: true,
        labelExtras: true,
        labelSlides: true
      };
    })();
  } catch (err) {
    demo = null;
  }
  window.addEventListener('resize', resize);
  resize();
  canvas.addEventListener('pointermove', function (e) {
    const p = pointerToView(e);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.inside = true;
    G.lastDevice = 'mouse';
    hoverPointer(p);
  });
  canvas.addEventListener('pointerdown', function (e) {
    canvas.focus();
    unlock();
    G.lastDevice = 'mouse';
    clicks.push(pointerToView(e));
  });
  canvas.addEventListener('pointerleave', function () { pointer.inside = false; });
  window.addEventListener('keydown', function (e) {
    const k = normKey(e);
    if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'space', 'enter'].indexOf(k) !== -1) e.preventDefault();
    if (e.target === muteBtn) return;
    if (k === 'm') { toggleMute(); return; }
    if (k === 'escape') { togglePause(); return; }
    if (e.repeat) return;
    heldKeys.add(k);
    justKeys.add(k);
    G.lastDevice = 'key';
    unlock();
  });
  window.addEventListener('keyup', function (e) { heldKeys.delete(normKey(e)); });
  canvas.focus();
  if (BOOT_ERROR) announce();
  requestAnimationFrame(loop);
}

try {
  selfTest();
} catch (err) {
  if (typeof document === 'undefined') throw err;
  BOOT_ERROR = err && err.stack ? err.stack : String(err);
}

if (typeof document !== 'undefined') {
  document.addEventListener('DOMContentLoaded', boot);
}
</script>
</body>
</html>
