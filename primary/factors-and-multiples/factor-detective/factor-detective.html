<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Factor Detective: Suspect Lineup</title>
<style>
  :root {
    --navy: #10162c;
    --ink: #f7f1e6;
    --muted: #c9bfb0;
    --amber: #f0b429;
    --amber-2: #ffe3a3;
    --rose: #fb7185;
    --mint: #34d399;
    --card: #1a2144;
    --line: #3c4b73;
    --p1: #e11d48;
    --p2: #0284c7;
    --p3: #059669;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(240, 180, 41, 0.16), transparent 55%),
      var(--navy);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", "Gill Sans", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  button:focus-visible, .choice:focus-visible {
    outline: 3px solid var(--amber-2);
    outline-offset: 2px;
  }
  #app {
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 6px;
    padding: 8px;
  }
  #hud {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 6px;
    min-height: 48px;
    padding: 6px 8px;
    background: linear-gradient(180deg, #23284a, #171c36);
    border: 2px solid #5c4a2a;
    border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255, 227, 163, 0.35);
  }
  .hud-title {
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--amber-2);
    padding-right: 2px;
    font-size: 0.92rem;
    flex: 0 0 auto;
  }
  .pill {
    background: #10162c;
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
    min-width: 0;
  }
  .pill.timer { min-width: 64px; text-align: center; background: #2a2416; border-color: var(--amber); color: var(--amber-2); }
  .pill.timer.urgent { background: #4c1520; border-color: var(--rose); color: #ffe4e6; animation: pulse 0.7s ease infinite; }
  .hearts { display: flex; gap: 2px; align-items: center; padding: 0 4px; }
  .heart { font-size: 1.15rem; line-height: 1; }
  .heart.full { color: var(--rose); }
  .heart.empty { color: #3f4666; }
  .star-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .star-pill { border-width: 2px; }
  .hud-actions {
    margin-left: auto;
    display: flex;
    gap: 6px;
    flex: 0 0 auto;
  }
  #btnMute, #btnExit {
    border: 2px solid var(--line);
    background: #10162c;
    color: var(--ink);
    border-radius: 10px;
    padding: 6px 10px;
    font-weight: 800;
    min-height: 36px;
  }
  #btnMute:hover, #btnExit:hover { border-color: var(--amber); }
  #playcol {
    position: relative;
    min-height: 0;
    display: grid;
    grid-template-rows: auto 64px minmax(150px, 1fr) auto;
    gap: 6px;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }
  .clue-card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 6px 8px 8px;
    min-height: 72px;
  }
  .clue-card .tag {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--amber);
    margin-bottom: 2px;
  }
  .clue-card p { font-size: clamp(0.78rem, 1.35vw, 0.95rem); line-height: 1.3; font-weight: 650; }
  .clue-card.active {
    border-color: var(--amber);
    box-shadow: 0 0 0 1px rgba(240, 180, 41, 0.35), 0 0 18px rgba(240, 180, 41, 0.18);
    background: #2a2416;
  }
  .clue-card.done { border-color: var(--mint); }
  .clue-card.done p { color: #d7fff1; }
  .clue-card.locked { opacity: 0.55; }
  .clue-card.locked p { color: var(--muted); font-weight: 600; }
  #note {
    height: 64px;
    overflow: auto;
    border-radius: 12px;
    border: 2px solid #2e3658;
    background: #14182e;
    padding: 8px 12px;
    font-weight: 700;
    line-height: 1.35;
    font-size: clamp(0.8rem, 1.4vw, 0.95rem);
  }
  #note.bad { border-color: var(--rose); background: #2a1520; color: #ffe4e6; }
  #note.good { border-color: var(--mint); background: #10241c; color: #d1fae5; }
  #note.info { border-color: var(--amber); background: #2a2312; color: #fde68a; }
  #stage {
    position: relative;
    min-height: 0;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid #5c4a2a;
    background: #0c1228;
  }
  #game {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #console {
    background: #171c36;
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 8px;
    display: grid;
    gap: 6px;
  }
  #stepText { font-weight: 800; font-size: clamp(0.85rem, 1.5vw, 1rem); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button {
    flex: 1 1 160px;
    min-height: 46px;
    border-radius: 12px;
    border: 2px solid #1b1408;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
  }
  #btnClear { background: var(--mint); color: #04281c; }
  #btnArrest { background: var(--amber); color: #2a1c04; }
  #btnClear:disabled, #btnArrest:disabled { opacity: 0.45; cursor: default; }
  #legend { color: var(--muted); font-size: 0.75rem; line-height: 1.35; font-weight: 650; }
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 12px;
    background: rgba(7, 9, 20, 0.97);
  }
  #overlay[hidden] { display: none !important; }
  .dossier {
    width: min(820px, 100%);
    background: linear-gradient(180deg, #1c1a32, #101222);
    border: 2px solid var(--amber);
    border-radius: 18px;
    padding: 16px 16px 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .kicker { color: var(--amber); font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: 0.03em; line-height: 1; margin: 4px 0; }
  .sub { color: var(--amber-2); font-weight: 800; margin-bottom: 8px; }
  .blurb { color: var(--muted); font-weight: 650; margin-bottom: 12px; line-height: 1.35; }
  .menu-label { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.07em; color: var(--amber-2); margin: 8px 0 6px; }
  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice {
    min-height: 44px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 2px solid #4a567c;
    background: #14182e;
    color: var(--ink);
    font-weight: 800;
    text-align: left;
  }
  .choice small { display: block; font-weight: 650; color: var(--muted); }
  .choice[aria-pressed="true"] {
    border-color: var(--amber);
    background: #3a2e14;
    color: var(--amber-2);
  }
  .choice:disabled { opacity: 0.4; cursor: default; }
  .go {
    margin-top: 12px;
    width: 100%;
    min-height: 52px;
    border-radius: 14px;
    border: 2px solid #2a1c04;
    background: var(--amber);
    color: #2a1c04;
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: 0.04em;
  }
  .why { margin: 8px 0 0; padding-left: 18px; }
  .why li { margin: 4px 0; font-weight: 700; line-height: 1.35; }
  .insight { margin-top: 8px; color: var(--amber-2); font-weight: 800; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  @media (max-width: 720px) {
    #board { grid-template-columns: 1fr; }
    .clue-card { min-height: 0; }
    #playcol { grid-template-rows: auto 64px minmax(180px, 1fr) auto; }
    #app { overflow: auto; }
    html, body { overflow: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-title">FACTOR DETECTIVE</div>
    <div class="pill" id="hudMode">SOLO</div>
    <div class="pill" id="hudDiff">EASY</div>
    <div class="pill score" id="hudScore">SCORE 0</div>
    <div class="hearts" id="hudHearts" aria-label="Detective badges"></div>
    <div class="pill timer" id="hudTimer">90s</div>
    <div class="pill" id="hudCase">CASE 1/5</div>
    <div class="hud-actions">
      <button type="button" id="btnMute">SOUND</button>
      <button type="button" id="btnExit">EXIT</button>
    </div>
  </header>
  <div id="playcol">
    <section id="board" aria-label="Case board">
      <article class="clue-card locked" id="card0"></article>
      <article class="clue-card locked" id="card1"></article>
      <article class="clue-card locked" id="card2"></article>
    </section>
    <div id="note" aria-live="polite">Read the glowing clue. Clear suspects who break it.</div>
    <div id="stage">
      <canvas id="game" aria-label="Suspect lineup"></canvas>
    </div>
    <section id="console">
      <div id="stepText">Open a case file to begin.</div>
      <div class="actions">
        <button type="button" id="btnClear">CLEAR INNOCENT</button>
        <button type="button" id="btnArrest">ARREST CULPRIT</button>
      </div>
      <div id="legend"></div>
    </section>
    <div id="overlay"></div>
  </div>
</div>
<script>
(() => {
  'use strict';

  const CASES_PER_SHIFT = 5;
  const MAX_BADGES = 3;
  const NAMES = ['Miso', 'Bram', 'Peck', 'Bolt', 'Nib', 'Finn'];
  const PLAYERS = [
    { badge: 'P1 RED', color: '#e11d48', glass: '#fb7185' },
    { badge: 'P2 BLUE', color: '#0284c7', glass: '#38bdf8' },
    { badge: 'P3 GREEN', color: '#059669', glass: '#34d399' }
  ];
  const DIFFS = {
    easy: { label: 'EASY', rank: 'Rookie Investigator', time: 90, blurb: '4 suspects · 2 clues · range, odd/even, one factor or multiple' },
    medium: { label: 'MEDIUM', rank: 'Senior Detective', time: 60, blurb: '5 suspects · 3 clues · common multiples and digit comparisons' },
    hard: { label: 'HARD', rank: 'Chief Inspector', time: 45, blurb: '6 suspects · reverse common factors and largest/smallest traps' },
    extreme: { label: 'EXTREME', rank: 'Mastermind Profiler', time: 25, blurb: '6 suspects · remainder riddles · 25-second timer' }
  };
  const PAIRS = [];
  for (let a = 2; a <= 9; a++) {
    for (let b = a + 1; b <= 9; b++) {
      if (b % a !== 0) PAIRS.push([a, b]);
    }
  }

  const recentSigs = [];
  const view = { w: 800, h: 450 };
  const menu = { players: 1, mode: 'solo', diff: 'easy' };
  const state = {
    screen: 'title',
    players: 1,
    mode: 'solo',
    difficulty: 'easy',
    score: 0,
    stars: [0, 0, 0],
    badges: MAX_BADGES,
    solvedCount: 0,
    caseNumber: 0,
    mistakes: 0,
    correctClears: 0,
    correctArrests: 0,
    timer: 90,
    case: null,
    phase: 0,
    focus: [0, 0, 0],
    stun: [0, 0, 0],
    note: null,
    collapse: false,
    locked: false,
    cold: false,
    coldReason: '',
    finale: 0,
    arm: 0,
    lastAward: null,
    shake: 0,
    bits: [],
    floaters: [],
    layout: [],
    padPrev: [{}, {}, {}],
    dpr: 1,
    turnBuzz: 0
  };

  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { const t = a % b; a = b; b = t; }
    return a || 1;
  }
  function lcm(a, b) { return Math.abs(a / gcd(a, b) * b); }
  function factorsOf(n) {
    const out = [];
    for (let i = 1; i <= n; i++) if (n % i === 0) out.push(i);
    return out;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }
  function makeClue(text, test, fail, pass) { return { text, test, fail, pass }; }

  class DetectiveAudio {
    constructor() {
      this.ctx = null;
      this.master = null;
      this.music = null;
      this.sfx = null;
      this.muted = false;
      this.unlocked = false;
      this.timer = null;
      this.nextTime = 0;
      this.step = 0;
      this.noise = null;
    }
    unlock() {
      if (this.unlocked) {
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        if (!this.muted) this.startLoop();
        return;
      }
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.9;
        this.master.connect(this.ctx.destination);
        this.music = this.ctx.createGain();
        this.music.gain.value = this.muted ? 0 : 0.08;
        this.music.connect(this.master);
        this.sfx = this.ctx.createGain();
        this.sfx.gain.value = 0.9;
        this.sfx.connect(this.master);
        const len = Math.floor(this.ctx.sampleRate * 0.4);
        this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = this.noise.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        this.unlocked = true;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (!this.muted) this.startLoop();
      } catch (err) { /* audio optional */ }
    }
    toggle() {
      this.muted = !this.muted;
      if (this.music) this.music.gain.value = this.muted ? 0 : 0.08;
      if (this.muted) this.stopLoop();
      else if (this.unlocked) this.startLoop();
      return this.muted;
    }
    tone(freq, type, dur, vol, when, bus) {
      if (this.muted || !this.ctx || !freq) return;
      try {
        const t = when == null ? this.ctx.currentTime : when;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain);
        gain.connect(bus || this.sfx);
        osc.start(t);
        osc.stop(t + dur + 0.02);
      } catch (err) { /* ignore */ }
    }
    hat(when, vol) {
      if (this.muted || !this.ctx || !this.noise) return;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1800;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, when);
      gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(this.music);
      src.start(when);
      src.stop(when + 0.06);
    }
    thud() {
      if (this.muted || !this.ctx || !this.noise) return;
      const now = this.ctx.currentTime;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noise;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 240;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(this.sfx);
      src.start(now);
      src.stop(now + 0.14);
      this.tone(110, 'sine', 0.14, 0.12, now);
    }
    tick() { this.tone(880, 'triangle', 0.04, 0.04); }
    chime() {
      this.tone(523.25, 'triangle', 0.12, 0.07, null);
      this.tone(659.25, 'triangle', 0.16, 0.07, this.ctx ? this.ctx.currentTime + 0.07 : null);
    }
    error() {
      this.tone(196, 'sawtooth', 0.16, 0.07);
      this.tone(140, 'sawtooth', 0.22, 0.06, this.ctx ? this.ctx.currentTime + 0.1 : null);
    }
    arrest() {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      for (let i = 0; i < 6; i++) this.tone(i % 2 ? 740 : 620, 'square', 0.08, 0.04, now + i * 0.08);
      this.tone(180, 'triangle', 0.12, 0.1, now + 0.52);
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        this.tone(f, 'triangle', 0.22, 0.08, now + 0.62 + i * 0.09);
      });
    }
    cold() {
      [392, 349.23, 311.13, 261.63].forEach((f, i) => this.tone(f, 'sawtooth', 0.2, 0.05, this.ctx ? this.ctx.currentTime + i * 0.12 : null));
    }
    startLoop() {
      if (!this.ctx || this.muted || this.timer) return;
      this.nextTime = this.ctx.currentTime + 0.05;
      this.timer = setInterval(() => this.pump(), 90);
    }
    stopLoop() {
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
    }
    pump() {
      if (!this.ctx || this.muted) return;
      const melody = [
        311.13, 0, 392, 466.16, 392, 0, 349.23, 311.13,
        261.63, 0, 293.66, 311.13, 392, 349.23, 311.13, 0,
        233.08, 0, 311.13, 392, 349.23, 0, 293.66, 261.63,
        311.13, 349.23, 392, 0, 466.16, 392, 349.23, 0
      ];
      const bass = [
        65.41, 0, 0, 65.41, 0, 98, 0, 0,
        77.78, 0, 0, 77.78, 0, 116.54, 0, 0,
        58.27, 0, 0, 87.31, 0, 77.78, 0, 0,
        65.41, 0, 98, 0, 77.78, 0, 65.41, 0
      ];
      const now = this.ctx.currentTime;
      if (this.nextTime < now) this.nextTime = now + 0.02;
      const beat = 60 / 94;
      while (this.nextTime < now + 0.28) {
        const i = this.step % 32;
        const dur = (this.step % 2 === 0) ? beat * 0.66 : beat * 0.34;
        if (bass[i]) this.tone(bass[i], 'triangle', dur * 0.95, 0.05, this.nextTime, this.music);
        if (melody[i]) this.tone(melody[i], 'square', Math.min(0.22, dur * 0.85), 0.02, this.nextTime, this.music);
        this.hat(this.nextTime, this.step % 2 === 0 ? 0.03 : 0.012);
        this.nextTime += dur;
        this.step++;
      }
    }
  }
  const audio = new DetectiveAudio();

  function clueMultiple(k) {
    return makeClue(
      `The culprit is a multiple of ${k}.`,
      (n) => n % k === 0,
      (n) => `${n} is not a multiple of ${k}. ${n} ÷ ${k} = ${Math.floor(n / k)} remainder ${n % k}.`,
      (n) => `${n} ÷ ${k} = ${n / k} with no remainder, so ${n} is a multiple of ${k}.`
    );
  }
  function clueTwoDigitMultiple(k) {
    return makeClue(
      `The culprit is a 2-digit multiple of ${k}.`,
      (n) => n >= 10 && n <= 99 && n % k === 0,
      (n) => (n < 10 || n > 99)
        ? `${n} is not a 2-digit number.`
        : `${n} is not a multiple of ${k}. ${n} ÷ ${k} = ${Math.floor(n / k)} remainder ${n % k}.`,
      (n) => `${n} is a 2-digit multiple of ${k}, because ${n} ÷ ${k} = ${n / k}.`
    );
  }
  function clueFactor(N) {
    return makeClue(
      `The culprit is a factor of ${N}.`,
      (n) => n > 0 && N % n === 0,
      (n) => `${n} is not a factor of ${N}. ${N} ÷ ${n} = ${Math.floor(N / n)} remainder ${N % n}.`,
      (n) => `${N} ÷ ${n} = ${N / n} with no remainder, so ${n} is a factor of ${N}.`
    );
  }
  function clueCommonMultiple(a, b) {
    return makeClue(
      `The culprit is a common multiple of ${a} and ${b}.`,
      (n) => n % a === 0 && n % b === 0,
      (n) => {
        const bits = [];
        if (n % a !== 0) bits.push(`${n} ÷ ${a} leaves remainder ${n % a}`);
        if (n % b !== 0) bits.push(`${n} ÷ ${b} leaves remainder ${n % b}`);

          [12, 20, 30, 40].forEach((a) => bounds.push({ kind: 'gt', a }));
        } else {
          [1, 2, 3, 4, 5].forEach((a) => bounds.push({ kind: 'gt', a }));
        }
        for (const bound of shuffle(bounds)) {
          for (const wantLarge of shuffle([true, false])) {
            const c2 = clueDigitAndBound(digit, bound);
            const fitting = multiples.filter((n) => c2.test(n));
            if (fitting.length < 2) continue;
            const culprit = wantLarge ? fitting[fitting.length - 1] : fitting[0];
            const pool = multiples.filter((n) => n !== culprit && n !== K && n >= 10);
            const M = pool[0] || multiples.find((n) => n !== culprit && n !== K) || multiples.find((n) => n !== culprit);
            const built = assemble('hard-bound', culprit, [
              clueCommonFactor(K, M),
              c2,
              clueExtreme(wantLarge, culprit)
            ], 6, `${K} is a common factor of ${M} and ${culprit} because ${K} divides both.`, allowRepeat);
            if (built) return built;
          }
        }
      }
    }
    return null;
  }

  function buildExtremeRemainder(allowRepeat) {
    const divs = shuffle([3, 4, 5, 6, 7, 8, 9]);
    for (const a of divs) {
      for (const b of shuffle([3, 4, 5, 6, 7, 8, 9])) {
        if (a === b) continue;
        for (let r = 1; r < b; r++) {
          const shapes = shuffle(['one', 'two']);
          for (const shape of shapes) {
            const windows = shape === 'one' ? [[1, 9]] : shuffle([[10, 40], [20, 60], [30, 70], [40, 90], [15, 55], [50, 99]]);
            for (const [lo, hi] of windows) {
              const matches = [];
              for (let n = lo; n <= hi; n++) if (n % a === 0 && n % b === r) matches.push(n);
              if (matches.length !== 1) continue;
              let divCount = 0;
              for (let n = lo; n <= hi; n++) if (n % a === 0) divCount++;
              if (divCount < 2) continue;
              const clues = shape === 'one'
                ? [clueOneDigit(), clueDivisible(a), clueRemainder(a, b, r)]
                : [clueFromTo(lo, hi), clueDivisible(a), clueRemainder(a, b, r)];
              const built = assemble('ext-rem', matches[0], clues, 6, '', allowRepeat);

  }

  function buildExtremeOffset(allowRepeat) {
    for (const a of shuffle([3, 4, 5, 6, 7, 8, 9])) {

        for (const add of shuffle([1, 2, 3, 4, 5])) {

              for (let n = lo; n <= hi; n++) {

              }
              if (matches.length !== 1 || divCount < 3) continue;
              const built = assemble('ext-off', matches[0], [
                clueFromTo(lo, hi),
                clueDivisible(a),
                clueOffset(add, b, a)
              ], 6, '', allowRepeat);
              if (built) return built;
            }
          }
        }
      }

    return null;
  }

  function generateCase(difficulty) {

        if (recentSigs.length > 8) recentSigs.shift();
        return built;
      }
    }
    for (const build of builders) {
      const built = build(true);
      if (built) {
        recentSigs.push(built.sig);
        if (recentSigs.length > 8) recentSigs.shift();

    return null;

    state.phase = 0;
    state.locked = false;
    state.cold = false;
    state.coldReason = '';
    state.collapse = false;

    state.note = null;
    state.finale = 0;

  function classifyKey(e) {
    const k = e.key;
    if (k === 'a' || k === 'A') return { p: 0, action: 'left' };
    if (k === 'd' || k === 'D') return { p: 0, action: 'right' };
    if (k === 'w' || k === 'W' || k === ' ') return { p: 0, action: 'invest' };
    if (k === 'r' || k === 'R') return { p: 0, action: 'arrest' };
    if (state.players < 3 && k === 'ArrowLeft') return { p: 0, action: 'left' };
    if (state.players < 3 && k === 'ArrowRight') return { p: 0, action: 'right' };
    if (state.players === 1 && k === 'Enter') return { p: 0, action: 'arrest' };
    if (state.players >= 2) {
      if (k === 'j' || k === 'J') return { p: 1, action: 'left' };
      if (k === 'l' || k === 'L') return { p: 1, action: 'right' };
      if (k === 'i' || k === 'I' || k === 'Enter') return { p: 1, action: 'invest' };
      if (k === 'u' || k === 'U') return { p: 1, action: 'arrest' };

      const ax = gp.axes && gp.axes.length ? gp.axes[0] : 0;

    ctx2.fillStyle = '#24325f';
    ctx2.fillRect(0, h * 0.62, w, 10);
    const floor = ctx2.createLinearGradient(0, h * 0.72, 0, h);
    floor.addColorStop(0, '#4a3424');
    floor.addColorStop(1, '#2a1c12');
    ctx2.fillStyle = floor;
    ctx2.beginPath();
    ctx2.moveTo(0, h * 0.78);
    ctx2.lineTo(w, h * 0.72);
    ctx2.lineTo(w, h);
    ctx2.lineTo(0, h);
    ctx2.fill();
    ctx2.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx2.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const y = h * 0.8 + i * (h * 0.025);
      ctx2.beginPath();
      ctx2.moveTo(0, y);
      ctx2.lineTo(w, y - 10);
      ctx2.stroke();
    }
    const winX = w * 0.08;
    const winY = h * 0.1;
    roundRect(ctx2, winX, winY, Math.min(150, w * 0.18), Math.min(110, h * 0.28), 8);
    ctx2.fillStyle = '#0b1c33';
    ctx2.fill();
    ctx2.strokeStyle = '#d6b37a';
    ctx2.lineWidth = 6;
    ctx2.stroke();
    ctx2.fillStyle = '#f3e6c0';
    ctx2.beginPath();
    ctx2.arc(winX + 36, winY + 32, 14, 0, Math.PI * 2);
    ctx2.fill();
    ctx2.fillStyle = '#5b4632';
    roundRect(ctx2, w - 128, 8, 116, 28, 6);
    ctx2.fill();
    ctx2.fillStyle = '#f0e2c4';
    ctx2.font = '700 13px Trebuchet MS, Segoe UI, sans-serif';
    ctx2.textAlign = 'center';
    ctx2.fillText('LINEUP', w - 70, 27);
  }
  function activeWatchers() {
    if (!state.case || (state.screen !== 'play' && state.screen !== 'finale' && state.screen !== 'solved')) return [];
    if (state.mode === 'vs') {
      const list = [];
      for (let p = 0; p < state.players; p++) list.push(p);
      return list;
    }
    if (state.mode === 'coop') return [dutyPlayer()];
    return [0];
  }
  function drawLineup(list, t, interactive) {
    state.layout = computeLayout(list);
    const watchers = interactive ? activeWatchers() : [0];
    state.layout.forEach((box) => {
      const s = list[box.i];
      const focused = interactive && watchers.some((p) => state.focus && state.focus[p] === box.i);
      let alpha = s && s.guilty ? 0.55 : focused ? 0.34 : 0.14;
      if (s && s.cleared) alpha = 0.07;
      const top = Math.max(8, box.headY - 70);
      const grd = ctx.createLinearGradient(box.x, top, box.x, box.floorY);
      const col = s && s.guilty ? '255, 214, 102' : '240, 180, 41';
      grd.addColorStop(0, `rgba(${col}, ${alpha})`);
      grd.addColorStop(1, `rgba(${col}, 0)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(box.x - 16, top);
      ctx.lineTo(box.x + 16, top);
      ctx.lineTo(box.x + Math.min(70, box.slot * 0.45), box.floorY);
      ctx.lineTo(box.x - Math.min(70, box.slot * 0.45), box.floorY);
      ctx.fill();
    });
    state.layout.forEach((box) => {
      const s = list[box.i];
      ctx.save();
      ctx.translate(box.x, box.feetY);
      const bob = Math.sin(t * 2.2 + (s.bob || box.i)) * (s.cleared ? 1 : 3);
      ctx.translate(0, bob);
      ctx.scale(box.scale, box.scale);
      if (s.cleared) ctx.globalAlpha = 0.7;
      const mood = s.guilty ? 'guilty' : s.cleared ? 'clear' : 'ok';
      drawActor(ctx, s.style, t + (s.bob || 0), mood);
      ctx.restore();
      const numFont = Math.max(26, Math.floor(box.placardH * 0.58));
      ctx.font = `800 ${numFont}px Trebuchet MS, Segoe UI, sans-serif`;
      const tw = ctx.measureText(String(s.n)).width;
      const placardW = Math.max(numFont + 30, tw + 30);
      drawPlacard(ctx, box.x, box.placardY, placardW, box.placardH, s.n, !!(s.guilty || (interactive && watchers.some((p) => state.focus[p] === box.i))));
      ctx.font = '700 12px Trebuchet MS, Segoe UI, sans-serif';
      ctx.fillStyle = '#f8f1e3';
      ctx.textAlign = 'center';
      ctx.fillText(s.name || '', box.x, box.placardTop - 8);
      const stampY = box.headY + (box.placardTop - box.headY) * 0.62;
      if (s.cleared) drawStamp(ctx, box.x, stampY, 'CLEARED', '#34d399', s.clearAge || 1);
      if (s.guilty) {
        drawStamp(ctx, box.x, stampY, 'GUILTY', '#f0b429', s.guiltAge || 1);
        const drop = Math.min(1, (s.guiltAge || 0) / 0.45);
        const ease = 1 - Math.pow(1 - drop, 3);
        drawCuffs(ctx, box.x, box.feetY - 70 * box.scale - (1 - ease) * 50);
      }
    });
    if (!interactive) {
      const box = state.layout[3] || state.layout[state.layout.length - 1];
      drawGlass(ctx, box.x - box.slot * 0.28, box.headY + 8, PLAYERS[0].glass, 'P1', false);
      return;
    }
    const offsets = [[-0.28, 6], [0.28, 18], [0, -16]];
    watchers.forEach((p) => {
      const box = state.layout[state.focus[p]];
      if (!box) return;
      const off = offsets[p] || offsets[0];
      drawGlass(ctx, box.x + off[0] * box.slot, box.headY + off[1], PLAYERS[p].glass, 'P' + (p + 1), state.stun[p] > 0);
    });
  }
  function drawBits() {
    state.bits.forEach((b) => {
      ctx.globalAlpha = Math.max(0, 1 - b.age / b.life);
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.r, b.r);
    });
    ctx.globalAlpha = 1;
    state.floaters.forEach((f) => {
      ctx.globalAlpha = Math.max(0, 1 - f.age / 0.9);
      ctx.fillStyle = f.color;
      ctx.font = '800 18px Trebuchet MS, Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;
  }
  function draw(t) {
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    ctx.clearRect(0, 0, view.w, view.h);
    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * 8 * state.shake, (Math.random() - 0.5) * 6 * state.shake);
    }
    drawRoom(ctx, t);
    if (state.case && state.screen !== 'title') {
      drawLineup(state.case.suspects, t, true);
    } else {
      drawLineup([
        { n: 36, style: 0, name: 'Miso', bob: 0.2, cleared: true, clearAge: 2, guilty: false },
        { n: 72, style: 1, name: 'Bram', bob: 1.1, cleared: false, guilty: false },
        { n: 45, style: 4, name: 'Nib', bob: 2.2, cleared: false, guilty: false },
        { n: 90, style: 5, name: 'Finn', bob: 3.3, cleared: false, guilty: false }
      ], t, false);
    }
    drawBits();
    ctx.restore();
  }

  function update(dt, now) {
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt);
    if (state.turnBuzz > 0) state.turnBuzz = Math.max(0, state.turnBuzz - dt);
    for (let p = 0; p < 3; p++) if (state.stun[p] > 0) state.stun[p] = Math.max(0, state.stun[p] - dt);
    if (state.case) {
      state.case.suspects.forEach((s) => {
        if (s.cleared) s.clearAge += dt;
        if (s.guilty) s.guiltAge += dt;
      });
    }
    state.bits.forEach((b) => {
      b.age += dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.vy += 280 * dt;
    });
    state.bits = state.bits.filter((b) => b.age < b.life);
    state.floaters.forEach((f) => { f.age += dt; f.y -= 28 * dt; });
    state.floaters = state.floaters.filter((f) => f.age < 0.9);
    if (state.screen === 'play') {
      const freeze = state.note && state.note.pauses && now < state.note.until;
      if (!freeze) state.timer -= dt;
      if (state.timer <= 0) timeUp();
    }
    if (state.note && now >= state.note.until) {
      state.note = null;
      renderNote();
      if (state.collapse) revealCollapse();
    }
    if (state.screen === 'finale') {
      state.finale -= dt;
      if (state.finale <= 0) {
        state.screen = 'solved';
        if (!state.cold) state.solvedCount++;
        renderAll();
        renderOverlay();
      }
    }
    if (state.screen === 'play') pollPads();
    if (state.screen === 'play' || state.screen === 'finale') {
      const sec = Math.max(0, Math.ceil(state.timer));
      const label = sec + 's';
      if (hudTimer.textContent !== label) {
        hudTimer.textContent = label;
        hudTimer.classList.toggle('urgent', state.screen === 'play' && sec <= 10);
      }
    }
    if (state.mode === 'vs' && state.screen === 'play') {
      const sig = state.stars.join(',') + '|' + state.stun.map((s) => (s > 0 ? '1' : '0')).join('');
      if (sig !== state._vsSig) {
        state._vsSig = sig;
        renderHud();
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt, now);
    if (view.w > 2) draw(now / 1000);
    requestAnimationFrame(frame);
  }

  function boot() {
    resize();
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(stageEl);
    window.addEventListener('keydown', onKey);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerdown', onPointerDown);
    btnMute.addEventListener('click', () => { audio.unlock(); audio.toggle(); renderHud(); });
    btnExit.addEventListener('click', () => { audio.unlock(); goTitle(); });
    btnClear.addEventListener('click', () => {
      audio.unlock();
      btnClear.blur();
      if (state.screen !== 'play' || !armed()) return;
      const p = pointerPlayer();
      clearFocused(p);
    });
    btnArrest.addEventListener('click', () => {
      audio.unlock();
      btnArrest.blur();
      if (state.screen !== 'play' || !armed()) return;
      const p = pointerPlayer();
      attemptArrest(p, state.case.suspects[state.focus[p]]);
    });
    overlay.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      audio.unlock();
      const act = btn.dataset.act;
      if (act.indexOf('players-') === 0) {
        menu.players = Number(act.slice(8));
        if (menu.players === 1) menu.mode = 'solo';
        else if (menu.mode === 'solo') menu.mode = 'coop';
        renderOverlay();
      } else if (act.indexOf('mode-') === 0) {
        menu.mode = act.slice(5);
        renderOverlay();
      } else if (act.indexOf('diff-') === 0) {
        menu.diff = act.slice(5);
        renderOverlay();
      } else if (act === 'start' || act === 'again') startShift();
      else if (act === 'next') continueAfterCase();
      else if (act === 'title') goTitle();
    });
    renderAll();
    renderOverlay();
    requestAnimationFrame(frame);
  }

  if (typeof globalThis !== 'undefined' && globalThis.__FD_TEST__) {
    globalThis.__FD_API__ = { generateCase, recentSigs, DIFFS };
  } else {
    boot();
  }
})();
</script>
</body>
</html>
