<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zodiac Vanguard: Factor Power Clash</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #07091a;
    font-family: system-ui, "Segoe UI", "Trebuchet MS", sans-serif;
    touch-action: none;
  }
  canvas { display: block; touch-action: none; outline: none; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;

  noscript p { color: #f7f3e8; padding: 24px; font-family: system-ui, sans-serif; }

</head>
<body>
<canvas id="gameCanvas" tabindex="0" role="application" aria-label="Zodiac Vanguard. Factor Power Clash for Primary 4 and 5. List every factor of a Zodiac Number using pairs from 1 times N up to the square root, then find the sum or the product, or pick the hero with the greater factor power. Player 1 uses the mouse, keys 1 to 4, arrows and space, or gamepad A. Player 2 uses Q W E R or the second gamepad. Player 3 uses U I O P or the third gamepad."></canvas>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p>Zodiac Vanguard needs JavaScript turned on.</p></noscript>
<script>
(() => {
  'use strict';

  const VW = 1280;
  const VH = 720;
  const FONT = 'system-ui, "Segoe UI", "Trebuchet MS", sans-serif';
  const HUD_H = 50;
  const DIR_Y = 54;
  const DIR_H = 56;
  const ARENA_Y = 114;
  const ARENA_H = 292;
  const INFO_Y = 410;
  const INFO_H = 84;
  const DECK_Y = 500;
  const CARD_Y = 514;
  const CARD_H = 132;
  const LEGEND_Y = 688;
  const DUEL_ROUNDS = 6;
  const TIERS = ['EASY', 'MEDIUM', 'HARD', 'EXTREME'];
  const MODES = ['SOLO', 'COOP', 'DUEL'];
  const TIME = {
    SOLO: { EASY: 50, MEDIUM: 44, HARD: 38, EXTREME: 28 },
    COOP: { EASY: 54, MEDIUM: 48, HARD: 42, EXTREME: 32 },
    DUEL: { EASY: 36, MEDIUM: 32, HARD: 28, EXTREME: 22 }
  };
  const TIER_META = {
    EASY: { name: 'EASY', role: 'Bronze Zodiac', tint: '#e0a15a', blurb: 'Heroes #1 to #12. List every factor, then add them for Aura Power.' },
    MEDIUM: { name: 'MEDIUM', role: 'Silver Zodiac', tint: '#9fd7ff', blurb: 'Heroes #1 to #12. Multiply every factor, and duel two heroes.' },

    EXTREME: { name: 'EXTREME', role: 'Cosmic Sovereign', tint: '#ff8ab8', blurb: 'Clashes to #36. Reverse clues, a brisk timer, and 2× / 3× combo.' }
  };
  const MODE_META = {
    SOLO: { name: 'SOLO', blurb: 'One vanguard. High score and constellation streak.' },
    COOP: { name: 'TEAM CO-OP', blurb: 'One shared team score and shared shields. Pilots rotate the two clash steps.' },
    DUEL: { name: 'ZODIAC DUEL', blurb: 'Same clash, separate lives. First pilot to finish both steps takes the star.' }
  };
  const OP_MIX = 'Check the battle directive! SUM means ADD all factors together (+), while PRODUCT means MULTIPLY all factors together (×)!';
  const PILOTS = [
    { id: 'P1', name: 'P1 CRIMSON', short: 'P1', color: '#ff3355', keys: ['1', '2', '3', '4'], codes: ['Digit1', 'Digit2', 'Digit3', 'Digit4'] },
    { id: 'P2', name: 'P2 AZURE', short: 'P2', color: '#3d8bff', keys: ['Q', 'W', 'E', 'R'], codes: ['KeyQ', 'KeyW', 'KeyE', 'KeyR'] },
    { id: 'P3', name: 'P3 EMERALD', short: 'P3', color: '#2ee59a', keys: ['U', 'I', 'O', 'P'], codes: ['KeyU', 'KeyI', 'KeyO', 'KeyP'] }
  ];
  const SIGNS = [
    { id: 'aries', name: 'Aries', element: 'Fire', color: '#ff4d4d', aura: '#ff2d55', accent: '#ffd2b8', hair: '#6e1828', deep: '#8e1b2c', style: 'horns' },
    { id: 'taurus', name: 'Taurus', element: 'Earth', color: '#e8a838', aura: '#c47b12', accent: '#ffe0b8', hair: '#6a4314', deep: '#8a5a16', style: 'bull' },
    { id: 'gemini', name: 'Gemini', element: 'Air', color: '#5ee7ff', aura: '#00b8d4', accent: '#e7fbff', hair: '#d7fbff', deep: '#127f96', style: 'twins' },
    { id: 'cancer', name: 'Cancer', element: 'Water', color: '#5ddec8', aura: '#1de9b6', accent: '#e7fff8', hair: '#1c6d62', deep: '#0e6b5c', style: 'claws' },
    { id: 'leo', name: 'Leo', element: 'Fire', color: '#ffc14d', aura: '#ff9100', accent: '#fff1cc', hair: '#c2410c', deep: '#b45309', style: 'mane' },
    { id: 'virgo', name: 'Virgo', element: 'Earth', color: '#b6f27a', aura: '#7cb342', accent: '#f4ffe4', hair: '#3f6212', deep: '#4d7c0f', style: 'braid' },
    { id: 'libra', name: 'Libra', element: 'Air', color: '#d7a6ff', aura: '#b388ff', accent: '#f6ecff', hair: '#6d28d9', deep: '#7c3aed', style: 'bob' },
    { id: 'scorpio', name: 'Scorpio', element: 'Water', color: '#ff5ca8', aura: '#f50057', accent: '#ffe0ef', hair: '#9d174d', deep: '#be185d', style: 'stinger' },
    { id: 'sagittarius', name: 'Sagittarius', element: 'Fire', color: '#ff8a3d', aura: '#ff6d00', accent: '#ffe8d6', hair: '#9a3412', deep: '#c2410c', style: 'hood' },
    { id: 'capricorn', name: 'Capricorn', element: 'Earth', color: '#d7c4a3', aura: '#a1887f', accent: '#fff6e8', hair: '#5d4a3a', deep: '#6d4c41', style: 'goat' },
    { id: 'aquarius', name: 'Aquarius', element: 'Air', color: '#8eb6ff', aura: '#2979ff', accent: '#e7f0ff', hair: '#1e3a8a', deep: '#1d4ed8', style: 'waves' },
    { id: 'pisces', name: 'Pisces', element: 'Water', color: '#9aa6ff', aura: '#536dfe', accent: '#e8eaff', hair: '#312e81', deep: '#3730a3', style: 'ribbons' }
  ];
  const ARC_COLORS = ['#ff5a7a', '#ff9f43', '#ffe066', '#3ddc97', '#5ad7ff', '#c084fc'];
  const LEAD = [392, 493.88, 587.33, 783.99, 698.46, 587.33, 523.25, 493.88, 392, 329.63, 349.23, 392, 493.88, 587.33, 493.88, 392];
  const BASS = [98, 98, 130.81, 146.83, 110, 98, 87.31, 98];

  const history = [];
  const spots = [];
  const particles = [];
  const floaters = [];
  const held = {};
  const keyMap = {};
  PILOTS.forEach((p, pi) => {
    p.codes.forEach((code, slot) => { keyMap[code] = { player: pi, slot: slot }; });
  });
  const stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * VW,
      y: Math.random() * VH,
      r: Math.random() * 1.5 + 0.3,
      p: Math.random() * Math.PI * 2,
      s: 0.6 + Math.random() * 1.8,
      gold: Math.random() < 0.14
    });
  }
  const padMem = [0, 1, 2].map(() => ({ a: false, left: false, right: false, up: false, down: false }));
  let padPrimed = false;
  const pointer = { x: -2000, y: -2000 };

  let canvas = null;
  let ctx = null;
  let live = null;
  let dpr = 1;
  let animT = 0;
  let lastNow = 0;
  let reduceMotion = false;
  let soloBest = 0;
  let teamBest = 0;
  let crashed = null;

  const game = {
    screen: 'title',
    players: 1,
    tier: 'EASY',
    mode: 'SOLO',
    score: 0,
    best: 0,
    shields: 4,
    round: 1,
    streak: 0,
    bestStreak: 0,
    record: false,
    clash: null,
    step: 1,
    clock: 0,
    clockMax: 50,
    intro: 0,
    hold: 0,
    holdMax: 0,
    holdNext: '',
    noteTone: '',
    toast: '',
    toastT: 0,
    shake: 0,
    alarm: 0,
    paused: false,
    reveal: false,
    beam: 0,
    beamFrom: { x: 480, y: 280 },
    beamTo: { x: 800, y: 240 },
    arm: 0,
    warned: false,
    coopTurn: 0,
    alt: 0,
    pilots: [],
    lastGain: null,
    winnerPilot: -1
  };

  const sound = { ctx: null, master: null, muted: false, ready: false, next: 0, step: 0 };

  function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function choice(arr) { return arr[rand(0, arr.length - 1)]; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function announce(s) { if (live) live.textContent = s; }
  function seen(key) { return history.indexOf(key) !== -1; }
  function remember(key) {
    history.push(key);
    while (history.length > 8) history.shift();
  }
  function formatNum(n) {
    const s = String(Math.round(n));
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function formatSet(arr) { return '{' + arr.join(', ') + '}'; }
  function isPrime(n) {
    if (n < 2) return false;
    for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
    return true;
  }
  function squareRoot(n) {
    for (let s = 1; s * s <= n; s++) if (s * s === n) return s;
    return 0;
  }
  function getFactors(n) {
    const f = [];
    for (let i = 1; i * i <= n; i++) {
      if (n % i === 0) {
        f.push(i);
        if (i * i !== n) f.push(n / i);
      }
    }
    f.sort((a, b) => a - b);
    return f;
  }
  function getPairs(n) {
    const p = [];
    for (let i = 1; i * i <= n; i++) {
      if (n % i === 0) p.push([i, n / i]);
    }
    return p;
  }
  function sumFactors(n) {
    const f = getFactors(n);
    let s = 0;
    for (let i = 0; i < f.length; i++) s += f[i];
    return s;
  }
  function productFactors(n) {
    const f = getFactors(n);
    let p = 1;
    for (let i = 0; i < f.length; i++) p *= f[i];
    return p;
  }
  function powerOf(n, op) { return op === 'sum' ? sumFactors(n) : productFactors(n); }
  function chainPlain(n) {
    return getPairs(n).map(pair => pair[0] === pair[1] ? String(pair[0]) : '(' + pair[0] + ' × ' + pair[1] + ')').join(' × ');
  }
  function powerPhrase(n, op) {
    if (op === 'sum') return getFactors(n).join(' + ') + ' = ' + sumFactors(n);
    return chainPlain(n) + ' = ' + formatNum(productFactors(n));
  }
  function forgetTip(n) {
    return 'Every whole number is divisible by 1 and ITSELF! Always include 1 and ' + n + ' in your factor list before adding or multiplying!';
  }
  function doubleTip(n) {
    const s = squareRoot(n);
    return 'For square number ' + n + ' (' + s + ' × ' + s + '), list the factor ' + s + ' only ONCE: ' + formatSet(getFactors(n)) + ' -> Sum = ' + sumFactors(n) + ', Product = ' + formatNum(productFactors(n)) + '!';
  }
  function justNTip(n, op) {
    if (op === 'sum') return 'The Zodiac Number ' + n + ' is only ONE factor. Aura Power adds every factor: ' + getFactors(n).join(' + ') + ' = ' + sumFactors(n) + '.';
    return 'The badge ' + n + ' is not the product of all factors. ' + chainPlain(n) + ' = ' + formatNum(productFactors(n)) + '.';
  }
  function missingTip(n) {
    const pairs = getPairs(n).map(pair => pair[0] === pair[1] ? String(pair[0]) : (pair[0] + ' × ' + pair[1])).join(', ');
    return 'A factor is missing. Pairs of ' + n + ': ' + pairs + '. Full list ' + formatSet(getFactors(n)) + '.';
  }
  function comparisonTip(winner, loser, op) {
    const wf = getFactors(winner.n);
    const lf = getFactors(loser.n);
    const opName = op === 'sum' ? 'Sum' : 'Product';
    const wp = powerOf(winner.n, op);
    const lp = powerOf(loser.n, op);
    if (isPrime(loser.n) && !isPrime(winner.n)) {
      return 'Prime number ' + loser.n + ' only has two factors {1, ' + loser.n + '} (Sum = ' + sumFactors(loser.n) + ', Product = ' + formatNum(productFactors(loser.n)) + '), while composite ' + winner.n + ' has ' + wf.length + ' factors ' + formatSet(wf) + ' (Sum = ' + sumFactors(winner.n) + ', Product = ' + formatNum(productFactors(winner.n)) + ')!';
    }
    if (loser.n > winner.n) {
      return 'A bigger Zodiac Number is not always stronger. ' + loser.sign + ' #' + loser.n + ' has ' + lf.length + ' factors ' + formatSet(lf) + ' (' + opName + ' = ' + formatNum(lp) + '), while ' + winner.sign + ' #' + winner.n + ' has ' + wf.length + ' factors ' + formatSet(wf) + ' (' + opName + ' = ' + formatNum(wp) + ')!';
    }
    return winner.sign + ' #' + winner.n + ' has ' + opName + ' ' + formatNum(wp) + '. ' + loser.sign + ' #' + loser.n + ' has ' + opName + ' ' + formatNum(lp) + '. The higher factor ' + op + ' wins the clash!';
  }
  function forgetPower(n, op) {
    const f = getFactors(n).filter(x => x !== 1 && x !== n);
    if (!f.length) return 0;
    if (op === 'sum') {
      let s = 0;
      for (let i = 0; i < f.length; i++) s += f[i];
      return s;
    }
    let p = 1;
    for (let i = 0; i < f.length; i++) p *= f[i];
    return p;
  }
  function makeHero(n) {
    const sign = SIGNS[(n - 1) % 12];
    let form = '';
    if (n > 24) form = 'Sovereign';
    else if (n > 12) form = 'Ascendant';
    return {
      n: n,
      sign: sign.name,
      form: form,
      display: form ? sign.name + ' ' + form : sign.name,
      element: sign.element,
      color: sign.color,
      aura: sign.aura,
      accent: sign.accent,
      hair: sign.hair,
      deep: sign.deep,
      style: sign.style,
      id: sign.id
    };
  }
  function poolOf(tier) {
    const a = [];
    const max = (tier === 'EASY' || tier === 'MEDIUM') ? 12 : (tier === 'HARD' ? 24 : 36);
    for (let i = 1; i <= max; i++) {
      if (tier === 'HARD' && i > 12 && [21, 22].indexOf(i) !== -1) continue;
      a.push(i);
    }
    if (tier === 'HARD' && a.indexOf(23) === -1) a.push(23);
    return a;
  }
  function assertMath() {
    const cases = [
      [1, [1], 1, 1],
      [4, [1, 2, 4], 7, 8],
      [6, [1, 2, 3, 6], 12, 36],
      [8, [1, 2, 4, 8], 15, 64],
      [9, [1, 3, 9], 13, 27],
      [10, [1, 2, 5, 10], 18, 100],
      [12, [1, 2, 3, 4, 6, 12], 28, 1728],
      [16, [1, 2, 4, 8, 16], 31, 1024],
      [20, [1, 2, 4, 5, 10, 20], 42, 8000],
      [24, [1, 2, 3, 4, 6, 8, 12, 24], 60, 331776],
      [36, [1, 2, 3, 4, 6, 9, 12, 18, 36], 91, 10077696]
    ];
    for (let i = 0; i < cases.length; i++) {
      const n = cases[i][0];
      if (getFactors(n).join(',') !== cases[i][1].join(',')) throw new Error('factors ' + n);
      if (sumFactors(n) !== cases[i][2]) throw new Error('sum ' + n);
      if (productFactors(n) !== cases[i][3]) throw new Error('product ' + n);
    }
  }

  function factorOptions(n, prefer) {
    const factors = getFactors(n);
    const correct = formatSet(factors);
    const cards = [{ label: correct, sub: 'POSITIVE FACTORS', correct: true, trap: 'ok', tip: '' }];
    const used = {};
    used[correct] = true;
    function add(label, trap, tip) {
      if (!label || used[label] || cards.length >= 4) return;
      used[label] = true;
      cards.push({ label: label, sub: 'POSITIVE FACTORS', correct: false, trap: trap, tip: tip });
    }
    if (n === 1) {
      add('{1, 1}', 'doubleSquare', '1 is 1 × 1. List the factor 1 only ONCE: {1} -> Sum = 1, Product = 1!');
      add('{1, 2}', 'extra', '2 is not a factor of 1. The only positive factor of 1 is {1}.');
      add('{2}', 'nearby', '2 is a different Zodiac Number. #1 has only {1}.');
    } else {
      const s = squareRoot(n);
      if (s > 1) {
        const doubled = [];
        factors.forEach(f => { doubled.push(f); if (f === s) doubled.push(f); });
        add(formatSet(doubled), 'doubleSquare', doubleTip(n));
      }
      const dropped = factors.filter(f => f !== 1 && f !== n);
      add(dropped.length ? formatSet(dropped) : '{ }', 'forgetEnds', forgetTip(n));
      let extra = 0;
      for (let e = 2; e < n + 5; e++) {
        if (e !== n && n % e !== 0) { extra = e; break; }
      }
      const withExtra = factors.concat([extra]).sort((a, b) => a - b);
      add(formatSet(withExtra), 'extra', extra + ' does not divide ' + n + ' exactly. Factors of ' + n + ' are ' + correct + '.');
      if (factors.length > 3) {
        const mid = factors[1];
        add(formatSet(factors.filter(f => f !== mid)), 'missing', missingTip(n));
      }
      add('{1}', 'forgetSelf', forgetTip(n));
      add(formatSet([n]), 'onlyN', forgetTip(n));
      (prefer || []).forEach(m => {
        if (m !== n && m > 0) add(formatSet(getFactors(m)), 'nearby', 'Those are the factors of ' + m + ', not ' + n + '. Rebuild every pair of ' + n + '.');
      });
      for (let d = 1; cards.length < 4 && d <= 6; d++) {
        add(formatSet(getFactors(n + d)), 'nearby', 'Those are the factors of ' + (n + d) + ', not ' + n + '.');
      }
    }
    if (cards.length < 4 || cards.filter(c => c.correct).length !== 1) return null;
    return shuffle(cards.slice(0, 4));
  }

  function powerOptions(n, op) {
    const correct = powerOf(n, op);
    const neutral = op === 'sum' ? 'AURA POWER' : 'STRIKE POWER';
    const cards = [{ label: formatNum(correct), sub: neutral, correct: true, trap: 'ok', tip: '', value: correct }];
    const used = {};
    used[correct] = true;
    function add(value, trap, tip) {
      const v = Math.round(value);
      if (!isFinite(v) || v <= 0 || used[v] || cards.length >= 4) return;
      used[v] = true;
      cards.push({ label: formatNum(v), sub: neutral, correct: false, trap: trap, tip: tip, value: v });
    }
    const other = powerOf(n, op === 'sum' ? 'product' : 'sum');
    add(other, 'opMix', OP_MIX);
    const s = squareRoot(n);
    if (s > 1) {
      const doubled = getFactors(n).concat([s]);
      let val = op === 'sum' ? 0 : 1;
      for (let i = 0; i < doubled.length; i++) val = op === 'sum' ? val + doubled[i] : val * doubled[i];
      add(val, 'doubleSquare', doubleTip(n));
    }
    if (op === 'product') {
      const pairs = getPairs(n);
      const hasMiddle = pairs.length > 0 && pairs[pairs.length - 1][0] === pairs[pairs.length - 1][1];
      if (pairs.length > 2 || (pairs.length === 2 && hasMiddle)) {
        add(n * n, 'onePair', 'Keep going. Every rainbow pair is multiplied. ' + chainPlain(n) + ' = ' + formatNum(correct) + '.');
      }
      if (pairs.length >= 2) {
        const miss = pairs[pairs.length - 1];
        const unit = miss[0] === miss[1] ? miss[0] : miss[0] * miss[1];
        if (unit > 1 && correct % unit === 0) {
          add(correct / unit, 'missPair', 'Use every rainbow pair. ' + chainPlain(n) + ' = ' + formatNum(correct) + '.');
        }
      }
    }
    add(forgetPower(n, op), 'forgetEnds', forgetTip(n));
    add(n, 'justN', justNTip(n, op));
    if (op === 'sum') {
      let all = 0;
      for (let i = 1; i <= n; i++) all += i;
      add(all, 'allNums', n + ' is not added to every whole number below it. Add only its factors: ' + getFactors(n).join(' + ') + ' = ' + sumFactors(n) + '.');
      add(Math.max(1, correct - 1), 'forgetOne', forgetTip(n));
    } else {
      add(n * getFactors(n).length, 'countTimes', 'Multiply the factors together. Do not multiply the badge by how many factors it has. ' + chainPlain(n) + ' = ' + formatNum(correct) + '.');
    }
    let salt = 1;
    while (cards.length < 4 && salt < 16) {
      add(correct + salt, 'near', 'That value does not match the factors. ' + powerPhrase(n, op) + '.');
      if (correct - salt > 0) add(correct - salt, 'near', 'That value does not match the factors. ' + powerPhrase(n, op) + '.');
      salt += 1;
    }
    if (cards.length < 4 || cards.filter(c => c.correct).length !== 1) return null;
    return shuffle(cards.slice(0, 4));
  }

  function championOptions(heroA, heroB, op) {
    const pA = powerOf(heroA.n, op);
    const pB = powerOf(heroB.n, op);
    if (pA === pB) return null;
    const winner = pA > pB ? heroA : heroB;
    const loser = pA > pB ? heroB : heroA;
    const wp = Math.max(pA, pB);
    const lp = Math.min(pA, pB);
    const word = op === 'sum' ? 'Sum' : 'Product';
    const cards = [];
    const used = {};
    function add(label, sub, correct, trap, tip) {
      const id = label + '|' + sub;
      if (used[id] || cards.length >= 8) return;
      used[id] = true;
      cards.push({ label: label, sub: sub, correct: correct, trap: trap, tip: tip });
    }
    add(winner.sign + ' #' + winner.n, word + ' ' + formatNum(wp), true, 'ok', '');
    add(loser.sign + ' #' + loser.n, word + ' ' + formatNum(lp), false, 'weaker', comparisonTip(winner, loser, op));
    add('TIE', 'equal power', false, 'tie', 'Their factor powers are not equal. ' + comparisonTip(winner, loser, op));
    const other = op === 'sum' ? 'product' : 'sum';
    const otherWord = other === 'sum' ? 'Sum' : 'Product';
    add(winner.sign + ' #' + winner.n, otherWord + ' ' + formatNum(powerOf(winner.n, other)), false, 'opMix', OP_MIX);
    add(winner.sign + ' #' + winner.n, word + ' ' + formatNum(winner.n), false, 'justN', justNTip(winner.n, op));
    add(loser.sign + ' #' + loser.n, word + ' ' + formatNum(wp), false, 'swap', 'That power belongs to the other hero. ' + comparisonTip(winner, loser, op));
    const forgot = forgetPower(winner.n, op);
    if (forgot > 0) add(winner.sign + ' #' + winner.n, word + ' ' + formatNum(forgot), false, 'forgetEnds', forgetTip(winner.n));
    const good = cards.filter(c => c.correct);
    const bad = cards.filter(c => !c.correct);
    if (good.length !== 1 || bad.length < 3) return null;
    return shuffle(good.concat(bad.slice(0, 3)));
  }

  function heroCards(correctN, pool, op, clue) {
    const cards = [];
    const used = {};
    function add(n, correct, tip) {
      if (used[n] || cards.length >= 4) return;
      used[n] = true;
      const h = makeHero(n);
      cards.push({
        label: h.sign + ' #' + n,
        sub: h.form ? h.form.toUpperCase() : h.element.toUpperCase(),
        correct: correct,
        trap: correct ? 'ok' : 'wrongHero',
        tip: tip,
        n: n
      });
    }
    const hero = makeHero(correctN);
    add(correctN, true, '');
    const ranked = pool.filter(m => m !== correctN).map(m => ({ n: m, d: Math.abs(powerOf(m, op) - clue) }));
    ranked.sort((a, b) => a.d - b.d);
    ranked.forEach(r => {
      const h = makeHero(r.n);
      add(r.n, false, h.sign + ' #' + r.n + ' has factor ' + op + ' ' + formatNum(powerOf(r.n, op)) + ', not ' + formatNum(clue) + '. ' + hero.display + ' #' + correctN + ': ' + powerPhrase(correctN, op) + '.');
    });
    if (cards.length < 4 || cards.filter(c => c.correct).length !== 1) return null;
    return shuffle(cards.slice(0, 4));
  }

  function buildSingle(op, ignore) {
    const pool = poolOf(game.tier);
    const order = shuffle(pool);
    for (let i = 0; i < order.length; i++) {
      const n = order[i];
      const key = 'single|' + op + '|' + n;
      if (!ignore && seen(key)) continue;
      const options1 = factorOptions(n);
      const options2 = powerOptions(n, op);
      if (!options1 || !options2) continue;
      return {
        kind: 'single',
        op: op,
        heroes: [makeHero(n)],
        spotlight: 0,
        winner: 0,
        options1: options1,
        options2: options2,
        key: key,
        clueValue: 0
      };
    }
    return null;
  }

  function buildDuel(op, ignore) {
    const pool = poolOf(game.tier);
    const primes = pool.filter(isPrime);
    const rich = [6, 8, 12, 16, 18, 20, 24, 28, 30, 36].filter(n => pool.indexOf(n) !== -1);
    for (let t = 0; t < 40; t++) {
      let a;
      let b;
      if ((game.tier === 'HARD' || game.tier === 'EXTREME') && rich.length && primes.length && Math.random() < 0.62) {
        a = choice(rich);
        b = choice(primes);
      } else {
        a = choice(pool);
        b = choice(pool);
      }
      if (a === b) continue;
      if (powerOf(a, op) === powerOf(b, op)) continue;
      const key = 'duel|' + op + '|' + [a, b].sort((x, y) => x - y).join('-');
      if (!ignore && seen(key)) continue;
      const heroA = makeHero(a);
      const heroB = makeHero(b);
      const options2 = championOptions(heroA, heroB, op);
      if (!options2) continue;
      const spotlight = Math.random() < 0.5 ? 0 : 1;
      const focusN = spotlight === 0 ? a : b;
      const options1 = factorOptions(focusN);
      if (!options1) continue;
      const winner = powerOf(a, op) > powerOf(b, op) ? 0 : 1;
      return {
        kind: 'duel',
        op: op,
        heroes: [heroA, heroB],
        spotlight: spotlight,
        winner: winner,
        options1: options1,
        options2: options2,
        key: key,
        clueValue: 0
      };
    }
    return null;
  }

  function buildReverse(op, ignore) {
    const pool = [];
    for (let n = 1; n <= 36; n++) pool.push(n);
    const groups = {};
    pool.forEach(n => {
      const k = String(powerOf(n, op));
      if (!groups[k]) groups[k] = [];
      groups[k].push(n);
    });
    const uniques = [];
    Object.keys(groups).forEach(k => { if (groups[k].length === 1) uniques.push(groups[k][0]); });
    const order = shuffle(uniques);
    for (let i = 0; i < order.length && i < 18; i++) {
      const n = order[i];
      const key = 'reverse|' + op + '|' + n;
      if (!ignore && seen(key)) continue;
      const clue = powerOf(n, op);
      const prefer = pool.filter(m => m !== n).sort((a, b) => Math.abs(powerOf(a, op) - clue) - Math.abs(powerOf(b, op) - clue)).slice(0, 4);
      const options1 = factorOptions(n, prefer);
      const options2 = heroCards(n, pool, op, clue);
      if (!options1 || !options2) continue;
      return {
        kind: 'reverse',
        op: op,
        heroes: [makeHero(n)],
        spotlight: 0,
        winner: 0,
        options1: options1,
        options2: options2,
        key: key,
        clueValue: clue
      };
    }
    return null;
  }

  function pickKind() {
    const r = Math.random();
    if (game.tier === 'EASY') return 'sum';
    if (game.tier === 'MEDIUM') {
      if (r < 0.42) return 'product';
      if (r < 0.71) return 'duel-sum';
      return 'duel-product';
    }
    if (game.tier === 'HARD') {
      const op = game.alt % 2 === 0 ? 'sum' : 'product';
      game.alt += 1;
      return r < 0.4 ? op : 'duel-' + op;
    }
    if (r < 0.2) return 'reverse-sum';
    if (r < 0.4) return 'reverse-product';
    if (r < 0.55) return 'sum';
    if (r < 0.7) return 'product';
    if (r < 0.85) return 'duel-sum';
    return 'duel-product';
  }

  function buildClash(kind, attempt) {
    const ignore = attempt >= 40;
    if (kind === 'sum' || kind === 'product') return buildSingle(kind, ignore);
    if (kind.indexOf('duel-') === 0) return buildDuel(kind.slice(5), ignore);
    if (kind.indexOf('reverse-') === 0) return buildReverse(kind.slice(8), ignore);
    return null;
  }

  function workedLine(c) {
    if (c.kind === 'duel') {
      const w = c.heroes[c.winner];
      const l = c.heroes[1 - c.winner];
      return w.display + ' #' + w.n + ' wins. ' + powerPhrase(w.n, c.op) + '. ' + l.display + ' #' + l.n + ' has ' + formatNum(powerOf(l.n, c.op)) + '.';
    }
    const h = c.heroes[0];
    return h.display + ' #' + h.n + ' — ' + powerPhrase(h.n, c.op) + '.';
  }

  function chainLine() {
    const c = game.clash;
    if (!c || !game.reveal) return '';
    if (c.kind === 'duel') {
      return c.heroes.map(h => '#' + h.n + ': ' + (c.op === 'sum' ? getFactors(h.n).join(' + ') : chainPlain(h.n)) + ' = ?').join('     ');
    }
    const h = c.heroes[0];
    if (c.op === 'sum') return h.sign + ' #' + h.n + ': ' + getFactors(h.n).join(' + ') + ' = ?';
    return h.sign + ' #' + h.n + ': ' + chainPlain(h.n) + ' = ?';
  }

  function hintLine() {
    const c = game.clash;
    if (!c) return '';
    if (c.kind === 'reverse') {
      const name = c.op === 'sum' ? 'sum' : 'product';
      return 'Which factor list makes ' + name + ' ' + formatNum(c.clueValue) + '? Include 1 and the number once. On a square, the repeated factor is listed once.';
    }
    const h = c.heroes[c.spotlight];
    const root = Math.sqrt(h.n);
    const rootText = squareRoot(h.n) ? String(squareRoot(h.n)) : root.toFixed(2);
    return 'Test divisors from 1 up to sqrt(' + h.n + ') ≈ ' + rootText + '. Include 1 and ' + h.n + '. List a square root only once.';
  }

  function promptMain() {
    const c = game.clash;
    const h = c.heroes[c.spotlight];
    if (game.step === 1) {
      if (c.kind === 'reverse') {
        return 'STEP 1 — Which set lists EVERY factor of the hero whose factor ' + (c.op === 'sum' ? 'sum' : 'product') + ' is ' + formatNum(c.clueValue) + '?';
      }
      return 'STEP 1 — Unlock every factor of ' + h.display + ' #' + h.n + '. Pairs run from 1 × ' + h.n + ' up to sqrt(' + h.n + ').';
    }
    if (c.kind === 'duel') {
      return 'STEP 2 — Who wins the ' + (c.op === 'sum' ? 'SUM (+)' : 'PRODUCT (×)') + ' clash? Lock the champion with the true power. [ CLASH! ]';
    }
    if (c.kind === 'reverse') {
      return 'STEP 2 — Which Zodiac Hero has factor ' + (c.op === 'sum' ? 'sum ' : 'product ') + formatNum(c.clueValue) + '? [ CLASH! ]';
    }
    if (c.op === 'sum') return 'STEP 2 — Aura Power is the SUM of all factors. [ CLASH! ]';
    return 'STEP 2 — Ultimate Strike is the PRODUCT of all factors. Use every rainbow pair. [ CLASH! ]';
  }

  function directiveBadge() {
    const c = game.clash;
    if (!c) return 'ZODIAC CLASH';
    if (c.kind === 'reverse') return c.op === 'sum' ? 'REVERSE FACTOR SUM' : 'REVERSE FACTOR PRODUCT';
    if (c.kind === 'duel') return 'HERO POWER DUEL';
    if (c.op === 'sum') return 'SUM OF FACTORS (+)';
    return 'PRODUCT OF FACTORS (×)';
  }

  function makePilot(i) {
    return { index: i, stars: 0, lives: 3, swift: 0, focus: 0, stun: 0, ready: false, out: false };
  }
  function activePilot() {
    if (game.mode !== 'COOP') return 0;
    const shift = game.step === 1 ? 0 : 1;
    return (game.coopTurn + shift) % game.players;
  }
  function allowed(player) {
    if (player < 0 || player >= game.players) return false;
    if (game.mode === 'DUEL') {
      const p = game.pilots[player];
      if (!p || p.out || p.stun > 0 || p.lives <= 0) return false;
      return true;
    }
    if (game.mode === 'COOP') return player === activePilot();
    return player === 0;
  }
  function loadStore() {
    try { soloBest = Number(localStorage.getItem('zv-solo-best')) || 0; } catch (err) { soloBest = 0; }
    try { teamBest = Number(localStorage.getItem('zv-team-best')) || 0; } catch (err) { teamBest = 0; }
    try { sound.muted = localStorage.getItem('zv-mute') === '1'; } catch (err) { sound.muted = false; }
  }
  function saveBest() {
    try {
      if (game.mode === 'COOP') localStorage.setItem('zv-team-best', String(game.best));
      else if (game.mode === 'SOLO') localStorage.setItem('zv-solo-best', String(game.best));
    } catch (err) { /* ignore */ }
  }
  function rankName(score) {
    if (score >= 5000) return 'Cosmic Sovereign';
    if (score >= 2800) return 'Gold Ascendant';
    if (score >= 1400) return 'Silver Vanguard';
    if (score >= 400) return 'Bronze Vanguard';
    return 'Moon Cadet';
  }
  function clockText(t) {
    const s = Math.max(0, Math.ceil(t));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function launchBeam() {
    game.beam = 1;
    const count = game.clash.heroes.length;
    if (count === 2) {
      game.beamFrom = heroAnchor(game.clash.winner, 2);
      game.beamTo = heroAnchor(1 - game.clash.winner, 2);
    } else {
      const a = heroAnchor(0, 1);
      game.beamFrom = { x: a.x - 180, y: a.y + 30 };
      game.beamTo = { x: a.x + 200, y: a.y - 70 };
    }
    burst(game.beamFrom.x, game.beamFrom.y, '#ffe7a3', 18);
    burst(game.beamTo.x, game.beamTo.y, game.clash.heroes[game.clash.winner].aura, 22);
  }
  function burst(x, y, color, n) {
    const count = reduceMotion ? Math.min(6, n) : n;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 30 + Math.random() * 160;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.45 + Math.random() * 0.45,
        max: 0.9,
        color: color,
        w: 2 + Math.random() * 3
      });
    }
    while (particles.length > 140) particles.shift();
  }
  function floater(text, x, y, color) {
    floaters.push({ text: text, x: x, y: y, vy: -26, life: 1.25, max: 1.25, color: color });
  }
  function grantPoints() {
    game.streak += 1;
    if (game.streak > game.bestStreak) game.bestStreak = game.streak;
    const speed = Math.round(160 * Math.max(0, game.clock) / game.clockMax);
    let mult = 1;
    if (game.tier === 'EXTREME') mult = game.streak >= 3 ? 3 : (game.streak >= 2 ? 2 : 1);
    const gain = (400 + speed) * mult;
    game.score += gain;
    if (game.mode !== 'DUEL') {
      const stored = game.mode === 'COOP' ? teamBest : soloBest;
      if (game.score > game.best) {
        game.best = game.score;
        game.record = true;
        if (game.mode === 'COOP') teamBest = game.best;
        else soloBest = game.best;
        saveBest();
      } else if (game.score > stored) {
        game.best = Math.max(game.best, stored);
      }
    }
    game.lastGain = { gain: gain, speed: speed, mult: mult };
    return game.lastGain;
  }

  function beginClash() {
    const kind = pickKind();
    let clash = null;
    for (let i = 0; i < 70 && !clash; i++) clash = buildClash(kind, i);
    if (!clash) clash = buildClash('sum', 80);
    game.clash = clash;
    remember(clash.key);
    game.step = 1;
    game.reveal = false;
    game.beam = 0;
    game.warned = false;
    game.noteTone = '';
    game.toast = '';
    game.toastT = 0;
    game.lastGain = null;
    game.winnerPilot = -1;
    game.intro = 0.32;
    game.arm = 0;
    game.hold = 0;
    game.holdNext = '';
    game.clockMax = TIME[game.mode][game.tier];
    game.clock = game.clockMax;
    game.pilots.forEach(p => { p.ready = false; p.focus = 0; p.stun = 0; });
    const h = clash.heroes[clash.spotlight];
    const spoken = clash.kind === 'reverse'
      ? 'Reverse clue. Factor ' + clash.op + ' ' + clash.clueValue + '.'
      : h.display + ' number ' + h.n + '. ' + (game.step === 1 ? 'List every factor.' : '');
    announce('Clash ' + game.round + '. ' + spoken);
  }

  function startGame() {
    sound.unlock();
    sound.click();
    if (game.mode === 'SOLO') game.players = 1;
    if ((game.mode === 'COOP' || game.mode === 'DUEL') && game.players < 2) game.players = 2;
    history.length = 0;
    game.screen = 'play';
    game.score = 0;
    game.best = game.mode === 'COOP' ? teamBest : soloBest;
    game.shields = 4;
    game.round = 1;
    game.streak = 0;
    game.bestStreak = 0;
    game.record = false;
    game.paused = false;
    game.coopTurn = 0;
    game.alt = 0;
    game.pilots = [];
    const n = game.mode === 'SOLO' ? 1 : game.players;
    game.players = n;
    for (let i = 0; i < n; i++) game.pilots.push(makePilot(i));
    beginClash();
  }

  function finishHold() {
    const next = game.holdNext;
    game.hold = 0;
    game.holdNext = '';
    game.toast = '';
    game.toastT = 0;
    if (next === 'next') {
      if (game.mode === 'DUEL' && game.round >= DUEL_ROUNDS) {
        game.screen = 'result';
        sound.fanfare();
        announce('Duel complete.');
        return;
      }
      game.round += 1;
      if (game.mode === 'COOP') game.coopTurn = (game.coopTurn + 1) % game.players;
      beginClash();
    } else if (next === 'result') {
      game.screen = 'result';
      if (game.mode !== 'DUEL') sound.down();
      announce(game.mode === 'DUEL' ? 'Duel complete.' : 'Vanguard shields are gone. Score ' + game.score + '.');
    }
  }

  function openHold(seconds, next, tone, message) {
    game.hold = seconds;
    game.holdMax = seconds;
    game.holdNext = next;
    game.noteTone = tone;
    game.toast = message;
    game.toastT = seconds;
  }

  function resolveWrong(tip) {
    game.streak = 0;
    game.shields -= 1;
    game.shake = 1;
    game.alarm = 0.4;
    sound.buzz();
    const shieldLine = game.shields > 0
      ? 'Vanguard Shield cracked. ' + game.shields + ' left. '
      : 'Last Vanguard Shield cracked. ';
    openHold(game.shields > 0 ? 3.3 : 3.6, game.shields > 0 ? 'retry' : 'result', 'bad', shieldLine + tip);
    announce(tip);
  }

  function resolveCorrect() {
    const gained = grantPoints();
    launchBeam();
    sound.clash();
    sound.fanfare();
    if (gained.mult > 1) sound.combo(gained.mult);
    const who = game.mode === 'COOP' ? PILOTS[activePilot()].short + ' locked the clash. ' : '';
    const combo = gained.mult > 1 ? '  ' + gained.mult + '× COMBO.' : '';
    const line = who + '+' + gained.gain + '  (400 + ' + gained.speed + ' speed)' + combo + '  ' + workedLine(game.clash);
    openHold(1.55, 'next', 'good', line);
    floater('+' + gained.gain, 640, 156, '#ffe7a3');
    if (gained.mult > 1) floater(gained.mult + '× COMBO', 800, 156, '#ff8ab8');
    announce(line);
  }

  function resolveDuelWrong(player, tip) {
    const p = game.pilots[player];
    p.stun = 1.5;
    p.lives -= 1;
    p.ready = false;
    if (p.lives <= 0) p.out = true;
    game.shake = 1;
    game.alarm = 0.25;
    sound.buzz();
    game.toast = PILOTS[player].name + ' — ' + tip;
    game.toastT = 2.5;
    game.noteTone = 'bad';
    announce(game.toast);
    if (game.pilots.every(q => q.lives <= 0)) {
      openHold(1.6, 'result', 'bad', 'Every lane life is gone. ' + tip);
    }
  }

  function resolveDuelRight(player) {
    const p = game.pilots[player];
    if (game.step === 1) {
      p.ready = true;
      game.reveal = true;
      game.step = 2;
      game.arm = 0.28;
      sound.chime();
      sound.sparkle();
      const spot = game.clash.heroes[game.clash.spotlight];
      burst(heroAnchor(game.clash.spotlight, game.clash.heroes.length).x, heroAnchor(game.clash.spotlight, game.clash.heroes.length).y, spot.aura, 16);
      game.toast = PILOTS[player].name + ' unlocked the factor pairs. Race the power lock!';
      game.toastT = 1.6;
      game.noteTone = 'good';
      announce(game.toast);
      return;
    }
    p.stars += 1;
    const swift = game.clock > game.clockMax * 0.45;
    if (swift) p.swift += 1;
    game.winnerPilot = player;
    game.reveal = true;
    launchBeam();
    sound.clash();
    sound.fanfare();
    const line = PILOTS[player].name + ' claims the star' + (swift ? ' with a speed bonus' : '') + '. ' + workedLine(game.clash);
    const next = (game.round >= DUEL_ROUNDS) ? 'result' : 'next';
    openHold(1.6, next, 'good', line);
    floater(PILOTS[player].short + ' +STAR', 640, 156, PILOTS[player].color);
    announce(line);
  }

  function answer(player, slot) {
      if (game.screen !== 'play' || game.paused || game.intro > 0 || game.arm > 0) return;
      if (trySkipHold()) return;
    if (player >= game.players) return;
    const pilot = game.pilots[player];
    if (pilot) pilot.focus = slot;
    if (!allowed(player)) {
      if (game.mode === 'COOP') {
        game.toast = PILOTS[activePilot()].name + ' has this step.';
        game.toastT = 1.2;
      } else if (game.mode === 'DUEL') {
        if (pilot.stun > 0) game.toast = PILOTS[player].short + ' is stunned for ' + pilot.stun.toFixed(1) + 's.';
        else if (pilot.lives <= 0) game.toast = PILOTS[player].short + ' has no lane lives left.';
        game.toastT = 1.2;
      }
      return;
    }
    const options = game.step === 1 ? game.clash.options1 : game.clash.options2;
    const opt = options[slot];
    if (!opt) return;
    sound.lock();
    if (game.mode === 'DUEL') {
      if (opt.correct) resolveDuelRight(player);
      else resolveDuelWrong(player, opt.tip);
      return;
    }
    if (opt.correct) {
      if (game.step === 1) {
        game.reveal = true;
        game.step = 2;
        game.arm = 0.28;
        if (game.pilots[0]) game.pilots[0].focus = 0;
        sound.chime();
        sound.sparkle();
        const h = game.clash.heroes[game.clash.spotlight];
        const anchor = heroAnchor(game.clash.kind === 'duel' ? game.clash.spotlight : 0, game.clash.heroes.length);
        burst(anchor.x, anchor.y - 20, h.aura, 14);
        game.toast = 'Rainbow pairs unlocked. Now lock the power.';
        game.toastT = 1.4;
        game.noteTone = 'good';
        announce('Factors unlocked for ' + h.display + ' ' + h.n + '. ' + promptMain());
      } else {
        resolveCorrect();
      }
    } else {
      resolveWrong(opt.tip);
    }
  }

  function trySkipHold() {
    if (game.hold <= 0) return false;
    const minRead = game.holdNext === 'result' ? 1.15 : 0.48;
    if (game.holdMax - game.hold < minRead) return true;
    finishHold();
    return true;
  }

  function nudge(player, dir) {
    if (game.screen !== 'play' || game.paused || game.intro > 0 || game.hold > 0) return;
    if (player >= game.players) return;
    const p = game.pilots[player];
    if (game.mode === 'DUEL' && (p.stun > 0 || p.lives <= 0)) return;
    if (game.mode === 'COOP' && player !== activePilot()) return;
    if (game.mode === 'SOLO' && player !== 0) return;
    p.focus = (p.focus + dir + 4) % 4;
    sound.tick();
  }

  function onTimeout() {
    game.clock = 0;
    if (game.mode === 'DUEL') {
      const next = game.round >= DUEL_ROUNDS ? 'result' : 'next';
      openHold(1.15, next, 'bad', 'Time is up. No star this clash. List the pairs faster next time: from 1 × N up to sqrt(N).');
      sound.alarm();
      return;
    }
    game.streak = 0;
    game.shields -= 1;

    text(veiled ? 'VEILED SIGN' : hero.element.toUpperCase(), x + knock, y - 104 * sc, 11, veiled ? '#94a3b8' : hero.aura, 'center', 700);
    if (!veiled) drawEmblem(hero.id, x + knock, y + 46 * sc, 11 * sc, '#ffe7a3');
    const badge = veiled ? '?' : '#' + hero.n;
    const bw = veiled ? 54 : Math.max(64, badge.length * 12 + 22);
    plate(x + knock - bw / 2, y + 78 * sc, bw, 28, 14, '#1a1408', '#ffd56a', 2);
    text(badge, x + knock, y + 92 * sc, 16, '#ffe7a3', 'center', 800);
  }

  function drawBead(x, y, label, color) {
    ctx.beginPath();
    ctx.fillStyle = '#120e22';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.arc(x, y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    text(String(label), x, y, 11, '#fff8e8', 'center', 800);
  }
  function drawArcs(n, cx, cy, lit) {
    const pairs = getPairs(n);
    const spread = pairs.length > 4 ? 11 : 14;
    pairs.forEach((pair, i) => {
      const col = ARC_COLORS[i % ARC_COLORS.length];
      const hw = 36 + i * spread;
      const lift = Math.min(20, 8 + i * 4);
      ctx.strokeStyle = col;
      ctx.globalAlpha = lit ? 0.95 : 0.35;
      ctx.lineWidth = lit ? 3 : 2;
      ctx.lineCap = 'round';
      if (pair[0] === pair[1]) {
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.stroke();
        if (lit) {
          ctx.globalAlpha = 1;
          text(String(pair[0]), cx, cy, 12, '#fff8e8', 'center', 800);
        }
      } else {
        ctx.beginPath();
        ctx.moveTo(cx - hw, cy);
        ctx.quadraticCurveTo(cx, cy - lift, cx + hw, cy);
        ctx.stroke();
        if (lit) {
          ctx.globalAlpha = 1;
          drawBead(cx - hw, cy, pair[0], col);
          drawBead(cx + hw, cy, pair[1], col);
        }
      }
    });
    ctx.globalAlpha = 1;
  }
  function drawGhostArcs(cx, cy) {
    for (let i = 0; i < 3; i++) {
      const hw = 32 + i * 16;
      const lift = 8 + i * 5;
      ctx.strokeStyle = ARC_COLORS[i];
      ctx.globalAlpha = 0.28;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - hw, cy);
      ctx.quadraticCurveTo(cx, cy - lift, cx + hw, cy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawBeam() {
    if (game.beam <= 0) return;
    const t = 1 - game.beam;
    const x = game.beamFrom.x + (game.beamTo.x - game.beamFrom.x) * t;
    const y = game.beamFrom.y + (game.beamTo.y - game.beamFrom.y) * t;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 231, 163, 0.95)';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(game.beamFrom.x, game.beamFrom.y);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#ffe7a3';
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawArena() {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, ARENA_Y, VW, ARENA_H);
    ctx.clip();
    const floor = ctx.createRadialGradient(640, ARENA_Y + ARENA_H - 20, 20, 640, ARENA_Y + ARENA_H - 10, 420);
    floor.addColorStop(0, 'rgba(255, 213, 106, 0.16)');
    floor.addColorStop(1, 'rgba(255, 213, 106, 0)');
    ctx.fillStyle = floor;
    ctx.fillRect(0, ARENA_Y, VW, ARENA_H);
    ctx.strokeStyle = 'rgba(255, 213, 106, 0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(640, ARENA_Y + ARENA_H - 28, 430, 36, 0, 0, Math.PI * 2);
    ctx.stroke();
    const c = game.clash;
    const count = c.heroes.length;
    const veiled = c.kind === 'reverse' && !(game.hold > 0 && game.noteTone === 'good');
    for (let i = 0; i < count; i++) {
      const a = heroAnchor(i, count);
      let knock = 0;
      if (game.beam > 0 && count === 2 && i !== c.winner) {
        const dir = i === 0 ? -1 : 1;
        knock = dir * (1 - game.beam) * 48;
      }
      const face = count === 2 && i === 1 ? -1 : 1;
      drawHero(c.heroes[i], a.x, a.y, a.s, count === 1 ? 1 : face, veiled && i === 0, knock);
      const arcY = Math.min(ARENA_Y + ARENA_H - 16, a.y + 78 * a.s + 52);
      if (game.reveal && !veiled) drawArcs(c.heroes[i].n, a.x + knock, arcY, true);
      else drawGhostArcs(a.x, arcY);
    }
    if (count === 2) {
      plate(596, 214, 88, 88, 44, 'rgba(12, 10, 28, 0.88)', '#ffd56a', 2);
      text('VS', 640, 246, 22, '#ffe7a3', 'center', 800);
      text(c.op === 'sum' ? 'SUM +' : 'PRODUCT ×', 640, 274, 11, '#fff', 'center', 800);
    } else if (c.kind === 'reverse') {
      plate(545, 120, 190, 30, 10, 'rgba(20, 16, 8, 0.92)', '#ffd56a', 2);
      text((c.op === 'sum' ? 'SUM  ' : 'PRODUCT  ') + formatNum(c.clueValue), 640, 135, 15, '#ffe7a3', 'center', 800);
    }
    drawBeam();
    particles.forEach(p => {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.w, 2);
    });
    floaters.forEach(f => {
      ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
      text(f.text, f.x, f.y, 22, f.color, 'center', 800);
    });
    ctx.globalAlpha = 1;
    ctx.restore();
  }

    }

    if (game.screen === 'play') fillRound(1048, 32, Math.max(4, 100 * frac), 6, 3, urgent ? '#fb7185' : TIER_META[game.tier].tint);
    drawMute(1168, 8);

    if (game.mode === 'DUEL') {

  function drawCards() {
    const options = game.step === 1 ? game.clash.options1 : game.clash.options2;
    for (let i = 0; i < 4; i++) {
      const r = cardRect(i);
      const opt = options[i];
      const hover = pointer.x >= r.x && pointer.y >= r.y && pointer.x <= r.x + r.w && pointer.y <= r.y + r.h;
      let hot = hover;
      let edge = 'rgba(255, 231, 163, 0.22)';
      if (game.mode === 'DUEL') {
        game.pilots.forEach(p => {
          if (p.focus === i && p.lives > 0) edge = PILOTS[p.index].color;
        });
        if (edge !== 'rgba(255, 231, 163, 0.22)') hot = true;
      } else if (game.pilots[0] && game.pilots[game.mode === 'COOP' ? activePilot() : 0].focus === i) {
        hot = true;
        edge = PILOTS[game.mode === 'COOP' ? activePilot() : 0].color;
      }
      if (hover) edge = '#fff4c8';
      plate(r.x, r.y, r.w, r.h, 14, hot ? '#243156' : '#14182e', edge, hot ? 3 : 2);
      drawKeyChips(r.x + r.w / 2, r.y + 20, i);
      fitText(opt.label, r.x + r.w / 2, r.y + 62, opt.label.length > 18 ? 20 : 26, '#f8fafc', 'center', 800, r.w - 24);
      fitText(opt.sub || '', r.x + r.w / 2, r.y + 100, 14, '#ffd56a', 'center', 700, r.w - 24);
      if (game.mode === 'DUEL') {
        let tick = 0;
        game.pilots.forEach(p => {
          if (p.focus !== i || p.lives <= 0) return;
          fillRound(r.x + 10 + tick * 16, r.y + 8, 12, 12, 3, PILOTS[p.index].color);
          tick += 1;
        });
      }
      if (game.hold <= 0 && game.intro <= 0 && !game.paused) addSpot(r.x, r.y, r.w, r.h, 'card', { i: i });
    }
  }

    if (game.hold > 0 && game.noteTone === 'bad' && game.mode !== 'DUEL') {
      plate(28, DECK_Y + 14, VW - 56, 150, 12, '#3f121c', '#fb7185', 2);
      text('GRAND ASTROLOGER', 48, DECK_Y + 36, 13, '#fecdd3', 'left', 800);
      drawWrapped(game.toast, 48, DECK_Y + 64, VW - 110, 16, '#fff7ed', 'left', 4);
    } else if (game.hold > 0 && game.noteTone === 'good') {
      plate(28, DECK_Y + 14, VW - 56, 150, 12, '#052e2b', '#5eead4', 2);
      text(game.mode === 'DUEL' ? 'ZODIAC ULTIMATE' : 'CLASH WON', 48, DECK_Y + 36, 13, '#99f6e4', 'left', 800);
      if (game.lastGain && game.mode !== 'DUEL') {
        const g = game.lastGain;
        text('+' + g.gain + ' VANGUARD' + (g.mult > 1 ? '   ' + g.mult + '× COMBO' : '') + (game.record ? '   NEW BEST' : ''), 48, DECK_Y + 62, 20, '#fef3c7', 'left', 800);
        drawWrapped(workedLine(game.clash), 48, DECK_Y + 92, VW - 110, 15, '#d1fae5', 'left', 3);
      } else {
        drawWrapped(game.toast, 48, DECK_Y + 66, VW - 110, 16, '#d1fae5', 'left', 4);
      }
    } else {
      drawCards();
    }
    const legend = game.mode === 'DUEL'
      ? 'P1 mouse / 1 2 3 4 / pad    ·    P2 Q W E R / pad    ·    P3 U I O P / pad    ·    wrong lock stuns 1.5s    ·    M mute'
      : (game.mode === 'COOP'
        ? 'Shared team score only. P1 mouse / 1 2 3 4 / pad.   P2 Q W E R / pad.   P3 U I O P / pad.   M mute'
        : 'Mouse  ·  1 2 3 4  ·  Arrows + Space  ·  Gamepad A  ·  M mute  ·  Esc pause');
    fitText(legend, VW / 2, LEGEND_Y, 13, '#94a3b8', 'center', 700, VW - 48);
  }

  function duelStanding() {
    const order = game.pilots.map((p, i) => i);
    order.sort((a, b) => {
      const A = game.pilots[a];
      const B = game.pilots[b];
      if (B.stars !== A.stars) return B.stars - A.stars;
      if (B.lives !== A.lives) return B.lives - A.lives;
      return B.swift - A.swift;
    });
    return order;
  }

    drawSky();
    plate(300, 70, 680, 560, 18, 'rgba(8, 10, 24, 0.9)', '#ffd56a', 2);

      const order = duelStanding();

    ctx.fillStyle = 'rgba(2, 6, 16, 0.62)';

  function render() {
    spots.length = 0;
    ctx.clearRect(0, 0, VW, VH);
    if (game.screen === 'title') {
      drawTitle();
      drawMute(1168, 8);
      return;
    }
    if (game.screen === 'result') {
      drawResult();
      drawMute(1168, 8);
      return;
    }
    const sx = game.shake > 0 && !reduceMotion ? (Math.random() - 0.5) * 8 * game.shake : 0;
    ctx.save();
    ctx.translate(sx, 0);
    drawSky();
    if (game.clash) drawArena();
    ctx.restore();
    drawHUD();
    if (game.clash) {
      drawDirective();
      drawInfo();
      drawDeck();
    }
    if (game.alarm > 0) {
      ctx.fillStyle = 'rgba(255, 30, 70, ' + (0.18 * Math.min(1, game.alarm)) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }
    if (game.paused) drawPause();
  }

  function update(dt) {
    animT += dt;
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 1.6);
    if (game.alarm > 0) game.alarm = Math.max(0, game.alarm - dt);
    if (game.beam > 0) game.beam = Math.max(0, game.beam - dt * 0.75);
    if (game.arm > 0) game.arm = Math.max(0, game.arm - dt);
    if (game.toastT > 0 && game.hold <= 0) game.toastT = Math.max(0, game.toastT - dt);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      f.y += f.vy * dt;
      if (f.life <= 0) floaters.splice(i, 1);
    }
    pollPads();
    sound.pump();
    if (game.screen !== 'play' || game.paused) return;
    if (game.intro > 0) {
      game.intro -= dt;
      return;
    }
    if (game.hold > 0) {
      game.hold -= dt;
      if (game.hold <= 0) finishHold();
      return;
    }
    if (game.mode === 'DUEL') {
      game.pilots.forEach(p => { if (p.stun > 0) p.stun = Math.max(0, p.stun - dt); });
    }
    if (game.clock > 0) {
      game.clock -= dt;
      if (game.clock < 5 && !game.warned) {
        game.warned = true;
        sound.alarm();
      }
      if (game.clock <= 0) onTimeout();
    }
  }

  function setPlayers(n) {
    game.players = n;
    if (n < 2 && game.mode !== 'SOLO') game.mode = 'SOLO';
    sound.click();
  }
  function setTier(id) {
    game.tier = id;
    sound.click();
  }
  function setMode(id) {
    if (id === 'SOLO') game.players = 1;
    else if (game.players < 2) game.players = 2;
    game.mode = id;
    sound.click();
  }
  function cycleTier(dir) {
    const i = TIERS.indexOf(game.tier);
    game.tier = TIERS[(i + dir + TIERS.length) % TIERS.length];
    sound.tick();
  }
  function cycleMode(dir) {
    const i = MODES.indexOf(game.mode);
    setMode(MODES[(i + dir + MODES.length) % MODES.length]);
  }

  function activate(spot) {
    if (!spot) return;
    if (spot.act === 'mute') { sound.toggle(); return; }
    if (game.screen === 'title') {
      if (spot.act === 'players') setPlayers(spot.n);
      else if (spot.act === 'tier') setTier(spot.id);
      else if (spot.act === 'mode') setMode(spot.id);
      else if (spot.act === 'launch') startGame();
      return;
    }
    if (game.screen === 'result') {
      if (spot.act === 'retry') startGame();
      else if (spot.act === 'title') game.screen = 'title';
      return;
    }
    if (game.paused || game.intro > 0) return;
    if (spot.act === 'card') answer(0, spot.i);
  }

  function onPad(i, kind) {
    if (game.screen === 'title') {
      if (i !== 0) return;
      if (kind === 'left') cycleTier(-1);
      else if (kind === 'right') cycleTier(1);
      else if (kind === 'up') cycleMode(-1);
      else if (kind === 'down') cycleMode(1);
      else if (kind === 'a') startGame();
      return;
    }
    if (game.screen === 'result') {
      if (i === 0 && kind === 'a') startGame();
      return;
    }
    if (kind === 'left') nudge(i, -1);
    else if (kind === 'right') nudge(i, 1);
    else if (kind === 'a') {
      const p = game.pilots[i];
      if (p) answer(i, p.focus);
    }
  }

  function pollPads() {
    if (!navigator.getGamepads) return;
    let pads;
    try { pads = navigator.getGamepads(); } catch (err) { return; }
    if (!pads) return;
    for (let i = 0; i < 3; i++) {
      const gp = pads[i];
      if (!gp) continue;
      const mem = padMem[i];
      const ax = gp.axes && gp.axes.length ? gp.axes[0] : 0;
      const ay = gp.axes && gp.axes.length > 1 ? gp.axes[1] : 0;
      const left = ax < -0.55 || !!(gp.buttons[14] && gp.buttons[14].pressed);
      const right = ax > 0.55 || !!(gp.buttons[15] && gp.buttons[15].pressed);
      const up = ay < -0.55 || !!(gp.buttons[12] && gp.buttons[12].pressed);
      const down = ay > 0.55 || !!(gp.buttons[13] && gp.buttons[13].pressed);
      const a = !!(gp.buttons[0] && gp.buttons[0].pressed);
      if (padPrimed) {
        if (left && !mem.left) onPad(i, 'left');
        if (right && !mem.right) onPad(i, 'right');
        if (up && !mem.up) onPad(i, 'up');
        if (down && !mem.down) onPad(i, 'down');
        if (a && !mem.a) onPad(i, 'a');
      }
      mem.left = left;
      mem.right = right;
      mem.up = up;
      mem.down = down;
      mem.a = a;
    }
    padPrimed = true;
  }

  function onKeyDown(e) {
    if (held[e.code]) return;
    held[e.code] = true;
    sound.unlock();
    const block = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter'];
    if (block.indexOf(e.code) !== -1) e.preventDefault();
    if (e.code === 'KeyM') { sound.toggle(); return; }
    if (game.screen === 'title') {
      if (e.code === 'Digit1') setPlayers(1);
      else if (e.code === 'Digit2') setPlayers(2);
      else if (e.code === 'Digit3') setPlayers(3);
      else if (e.code === 'ArrowLeft') cycleTier(-1);
      else if (e.code === 'ArrowRight') cycleTier(1);
      else if (e.code === 'ArrowUp') cycleMode(-1);
      else if (e.code === 'ArrowDown') cycleMode(1);
      else if (e.code === 'Enter' || e.code === 'Space') startGame();
      return;
    }
    if (game.screen === 'result') {
      if (e.code === 'Enter' || e.code === 'Space') startGame();
      else if (e.code === 'Escape') game.screen = 'title';
      return;
    }
    if (e.code === 'Escape') {
      game.paused = !game.paused;
      return;
    }
    if (trySkipHold()) return;
    if (e.code === 'ArrowLeft') { nudge(0, -1); return; }
    if (e.code === 'ArrowRight') { nudge(0, 1); return; }
    if (e.code === 'Enter' || e.code === 'Space') {
      const p = game.pilots[0];
      if (p) answer(0, p.focus);
      return;
    }
    const mapped = keyMap[e.code];
    if (mapped) answer(mapped.player, mapped.slot);
  }
  function onKeyUp(e) { held[e.code] = false; }

  function screenToVirtual(cx, cy) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (cx - rect.left) / rect.width * VW,
      y: (cy - rect.top) / rect.height * VH
    };
  }
  function onPointer(e) {
    sound.unlock();
    const p = screenToVirtual(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
    if (canvas) canvas.focus();
    activate(hitSpot(p.x, p.y));
  }
  function onMove(e) {
    const p = screenToVirtual(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const ww = window.innerWidth;
    const wh = window.innerHeight;
    const scale = Math.min(ww / VW, wh / VH);
    const cw = Math.max(1, Math.floor(VW * scale));
    const ch = Math.max(1, Math.floor(VH * scale));
    canvas.width = Math.floor(VW * dpr);
    canvas.height = Math.floor(VH * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.style.position = 'absolute';
    canvas.style.left = Math.floor((ww - cw) / 2) + 'px';
    canvas.style.top = Math.floor((wh - ch) / 2) + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function frame(now) {
    if (!lastNow) lastNow = now;
    const dt = Math.min(0.05, (now - lastNow) / 1000);
    lastNow = now;
    try {
      update(dt);
      render();
      const hot = hitSpot(pointer.x, pointer.y);
      if (canvas) canvas.style.cursor = hot ? 'pointer' : 'default';
    } catch (err) {
      if (!crashed) {
        crashed = err;
        console.error(err);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#1a0a10';
      ctx.fillRect(0, 0, VW, VH);
      ctx.fillStyle = '#fff';
      ctx.font = '16px sans-serif';
      ctx.fillText(String(err && err.message ? err.message : err), 40, 80);
    }
    requestAnimationFrame(frame);
  }

  sound.unlock = function () {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!sound.ctx) {
      sound.ctx = new AC();
      sound.master = sound.ctx.createGain();
      sound.master.gain.value = sound.muted ? 0 : 0.7;
      sound.master.connect(sound.ctx.destination);
    }
    if (sound.ctx.state === 'suspended') sound.ctx.resume();
    if (!sound.ready) {
      sound.ready = true;
      sound.next = sound.ctx.currentTime + 0.05;
    }
  };
  function tone(freq, type, dur, vol, delay, slide) {
    if (!sound.ctx || !sound.master) return;
    const t0 = sound.ctx.currentTime + (delay || 0);
    const osc = sound.ctx.createOscillator();
    const gain = sound.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(40, freq), t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(sound.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!sound.ctx || !sound.master) return;
    const rate = sound.ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * dur));
    const buffer = sound.ctx.createBuffer(1, len, rate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = sound.ctx.createBufferSource();
    src.buffer = buffer;
    const filter = sound.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq || 900;
    const gain = sound.ctx.createGain();
    gain.gain.setValueAtTime(vol, sound.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, sound.ctx.currentTime + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(sound.master);
    src.start();
  }
  sound.toggle = function () {
    sound.unlock();
    sound.muted = !sound.muted;
    if (sound.master && sound.ctx) sound.master.gain.setTargetAtTime(sound.muted ? 0 : 0.7, sound.ctx.currentTime, 0.03);
    if (!sound.muted && sound.ctx) sound.next = sound.ctx.currentTime + 0.05;
    try { localStorage.setItem('zv-mute', sound.muted ? '1' : '0'); } catch (err) { /* ignore */ }
  };
  sound.click = function () { tone(740, 'square', 0.04, 0.04); };
  sound.tick = function () { tone(620, 'square', 0.03, 0.03); };
  sound.lock = function () { tone(220, 'square', 0.05, 0.03); };
  sound.chime = function () { [880, 1174, 1568].forEach((f, i) => tone(f, 'square', 0.09, 0.04, i * 0.05)); };
  sound.sparkle = function () { [1318, 1568, 2093].forEach((f, i) => tone(f, 'triangle', 0.08, 0.03, i * 0.04)); };
  sound.clash = function () {
    noise(0.2, 0.08, 480);
    tone(180, 'sawtooth', 0.24, 0.06, 0, 55);
    tone(520, 'square', 0.12, 0.04, 0.06, 880);
    tone(784, 'square', 0.16, 0.035, 0.12);
  };
  sound.buzz = function () {
    tone(110, 'sawtooth', 0.24, 0.06, 0, 48);
    noise(0.14, 0.05, 200);
  };
  sound.alarm = function () { tone(180, 'square', 0.12, 0.04); tone(140, 'square', 0.14, 0.04, 0.12); };
  sound.fanfare = function () { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 'square', 0.16, 0.045, i * 0.08)); };
  sound.combo = function (mult) {
    const base = mult >= 3 ? 880 : 660;
    [base, base * 1.25, base * 1.5].forEach((f, i) => tone(f, 'square', 0.1, 0.04, 0.28 + i * 0.06));
  };
  sound.down = function () { tone(196, 'sawtooth', 0.28, 0.05, 0, 70); };
  sound.pump = function () {
    if (!sound.ready || !sound.ctx || sound.muted || !sound.master) return;
    const now = sound.ctx.currentTime;
    if (sound.next < now - 0.02) sound.next = now + 0.02;
    const tempo = game.screen === 'play' && game.tier === 'EXTREME' ? 0.13 : 0.17;
    let guard = 0;
    while (sound.next < now + 0.28 && guard < 6) {
      const i = sound.step;
      tone(LEAD[i % LEAD.length], 'square', 0.11, 0.03, sound.next - now);
      if (i % 2 === 0) tone(BASS[(i >> 1) % BASS.length], 'triangle', 0.2, 0.04, sound.next - now);
      if (i % 4 === 0) noise(0.02, 0.012, 1800);
      sound.next += tempo;
      sound.step += 1;
      guard += 1;
    }
  };

  function boot() {
    assertMath();
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    live = document.getElementById('live');
    loadStore();
    try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (err) { reduceMotion = false; }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', () => { Object.keys(held).forEach(k => { held[k] = false; }); });
    canvas.addEventListener('pointerdown', onPointer);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    requestAnimationFrame(frame);
    canvas.focus();
    announce('Zodiac Vanguard. Choose pilots, difficulty, and mode, then launch the clash.');
  }

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      getFactors: getFactors,
      getPairs: getPairs,
      sumFactors: sumFactors,
      productFactors: productFactors,
      powerOf: powerOf,
      factorOptions: factorOptions,
      powerOptions: powerOptions,
      buildClash: buildClash,
      buildSingle: buildSingle,
      buildDuel: buildDuel,
      buildReverse: buildReverse,
      poolOf: poolOf,
      makeHero: makeHero,
      game: game,
      history: history,
      seen: seen,
      assertMath: assertMath,
      formatSet: formatSet
    };
  }
  if (typeof document !== 'undefined' && document.getElementById) boot();
})();
</script>
</body>
