/* ---------- Utils ---------- */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function irand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function speak(msg) { if (live) live.textContent = msg; }
function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { const t = a % b; a = b; b = t; }
  return a || 1;
}
function lcm(a, b) { return (a / gcd(a, b)) * b; }
function noun(n, theme) { return n === 1 ? theme.one : theme.item; }
function packName(problem) { return (problem.c3 && problem.c3.pack) || problem.theme.pack; }

function setDiag(text, kind) {
  G.diag = { text: text, kind: kind || 'info' };
  speak(text);
}
function floater(text, x, y, color) {
  floaters.push({ text, x, y, color: color || COL.lime, life: 1.25 });
}
function burst(x, y, n) {
  const count = n || 46;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 70 + Math.random() * 460;
    sparks.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 120,
      life: 0.7 + Math.random() * 0.7,
      color: Math.random() < 0.55 ? COL.gold : (Math.random() < 0.5 ? COL.cyan : '#fff'),
      w: 2 + Math.random() * 3
    });
  }
}
function beam(x1, y1, x2, y2, color) {
  beams.push({ x1, y1, x2, y2, color, life: 0.28 });
}

/* ---------- Audio ---------- */
const audio = (() => {
  let actx = null, muted = false, bgmOn = false, step = 0, timer = null, master = null;
  function ensure() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.42;
      master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    if (!bgmOn) startBgm();
  }
  function toggle() {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.42;
    return !muted;
  }
  function tone(freq, dur, type, vol, delay, slide) {
    if (!actx || muted) return;
    const t0 = actx.currentTime + (delay || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(Math.max(40, freq), t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.06, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!actx || muted) return;
    const len = Math.max(1, Math.floor(actx.sampleRate * dur));
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource();
    const g = actx.createGain();
    const f = actx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq || 900;
    src.buffer = buf;
    g.gain.value = vol || 0.05;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }
  function startBgm() {
    if (!actx || bgmOn) return;
    bgmOn = true;
    const beat = 60 / 112;
    const bass = [55, 55, 65.41, 55, 49, 49, 55, 73.42];
    const arp = [220, 277.18, 329.63, 440, 329.63, 277.18, 246.94, 220];
    function tick() {
      if (!actx) return;
      if (!muted) {
        const t = actx.currentTime;
        const bi = step % 8;
        const ai = step % 8;
        if (step % 2 === 0) {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(160, t);
          o.frequency.exponentialRampToValueAtTime(48, t + 0.11);
          g.gain.setValueAtTime(0.14, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
          o.connect(g); g.connect(master);
          o.start(t); o.stop(t + 0.14);
        }
        noise(step % 2 ? 0.02 : 0.028, step % 2 ? 0.02 : 0.03, step % 4 === 0 ? 2400 : 1600);
        tone(bass[bi], beat * 0.7, 'sawtooth', 0.04);
        tone(arp[ai], beat * 0.36, 'square', 0.028);
        if (step % 16 === 0) tone(880, 0.18, 'sine', 0.03, 0, 420);
      }
      step++;
      timer = setTimeout(tick, beat * 1000);
    }
    tick();
  }
  return {
    ensure, toggle, isMuted: () => muted,
    tick() { tone(740, 0.03, 'square', 0.025); },
    radar() {
      tone(280, 0.5, 'sine', 0.07, 0, 1480);
      tone(560, 0.4, 'triangle', 0.03, 0.04, 1760);
      noise(0.18, 0.04, 1800);
    },
    chord() {
      tone(523.25, 0.34, 'sine', 0.06);
      tone(659.25, 0.38, 'sine', 0.05, 0.04);
      tone(783.99, 0.46, 'triangle', 0.05, 0.08);
    },
    buzz() {
      tone(98, 0.2, 'sawtooth', 0.07);
      tone(74, 0.24, 'square', 0.04, 0.03);
      noise(0.16, 0.06, 400);
    },
    chime() {
      tone(660, 0.1, 'sine', 0.06);
      tone(880, 0.14, 'sine', 0.05, 0.06);
    },
    lockOn() {
      tone(520, 0.08, 'square', 0.05);
      tone(780, 0.1, 'square', 0.04, 0.07);
      tone(1040, 0.16, 'triangle', 0.05, 0.12);
    },
    zap() {
      tone(880, 0.12, 'sawtooth', 0.05, 0, 180);
      noise(0.08, 0.05, 2200);
    },
    fanfare() {
      noise(0.35, 0.08, 500);
      const notes = [523, 659, 784, 1046];
      notes.forEach((f, i) => tone(f, 0.22, 'square', 0.06, 0.08 + i * 0.09));
      tone(1046, 0.4, 'triangle', 0.05, 0.5);
    }
  };
})();

/* ---------- Math ---------- */
function matches(n, clue) {
  if (!clue || n <= 0) return false;
  const div = clue.div, off = clue.off;
  if (clue.sign > 0) return (n - off) % div === 0 && (n - off) / div >= 1;
  return (n + off) % div === 0 && (n + off) / div >= 1;
}
function passes(n, c3) {
  if (c3.type === 'range') return n > c3.lo && n < c3.hi;
  const v = n + c3.adjust;
  if (!(v > 0 && v % c3.mod === 0)) return false;
  if (c3.lo != null && n <= c3.lo) return false;
  if (c3.hi != null && n >= c3.hi) return false;
  return true;
}
function commonsOf(raw) {
  const out = [];
  const maxN = raw.maxN;
  for (let n = 1; n <= maxN; n++) {
    if (matches(n, raw.c1) && matches(n, raw.c2)) out.push(n);
  }
  return out;
}
function verifyRaw(raw) {
  const common = commonsOf(raw);
  if (raw.expect && common.join(',') !== raw.expect.join(',')) return 'overlap changed: ' + common.join(',');
  if (common.length < 2) return 'needs two overlaps';
  const winners = common.filter(n => passes(n, raw.c3));
  if (winners.length !== 1 || winners[0] !== raw.answer) return 'not unique (' + winners.join(',') + ')';
  return '';
}
function ruleLabel(div, off, sign) {
  return 'Multiple of ' + div + (sign < 0 ? ' − ' : ' + ') + off;
}
function rangeChip(lo, hi, maxN) {
  if (lo <= 0) return 'Fewer than ' + hi;
  if (hi == null || hi > maxN) return 'More than ' + lo;
  return 'More than ' + lo + ' and fewer than ' + hi;
}
function wrongRangeChip(c3) {
  if (c3.lo <= 0) return 'More than ' + (c3.hi - 1);
  if (c3.hi == null || c3.hi > 500) return 'Fewer than ' + (c3.lo + 1);
  return 'More than ' + (c3.hi - 1);
}
function makeSignOptions(clue) {
  return shuffle([
    { sign: -1, label: ruleLabel(clue.div, clue.off, -1), correct: clue.sign < 0 },
    { sign: 1, label: ruleLabel(clue.div, clue.off, 1), correct: clue.sign > 0 }
  ]);
}
function makeC3Options(c3, maxN) {
  if (c3.type === 'range') {
    return shuffle([
      { correct: true, sign: 0, label: rangeChip(c3.lo, c3.hi, maxN) },
      { correct: false, sign: 0, label: wrongRangeChip(c3) }
    ]);
  }
  const mag = Math.abs(c3.adjust);
  return shuffle([
    { correct: c3.adjust < 0, sign: -1, label: '(N − ' + mag + ') ÷ ' + c3.mod + ' has 0 remainder' },
    { correct: c3.adjust > 0, sign: 1, label: '(N + ' + mag + ') ÷ ' + c3.mod + ' has 0 remainder' }
  ]);
}
function buildClue(div, off, sign, theme, variant) {
  const word = noun(off, theme);
  if (sign < 0) {
    if (variant) return { div, off, sign, hook: 'short of ' + off, text: 'Groups of ' + div + ', short of ' + off + ' ' + word + '.' };
    return { div, off, sign, hook: 'needs ' + off + ' more', text: 'Packed in ' + theme.container + ' of ' + div + ', needs ' + off + ' more.' };
  }
  if (variant) return { div, off, sign, hook: off + ' left unpacked', text: off + ' ' + word + ' left unpacked from ' + theme.container + ' of ' + div + '.' };
  return { div, off, sign, hook: off + ' ' + word + ' left over', text: 'Packed in ' + theme.container + ' of ' + div + ', ' + off + ' ' + word + ' left over.' };
}
function buildClue3Text(c3, theme) {
  if (c3.type === 'range') {
    if (c3.lo <= 0) return 'Fewer than ' + c3.hi + ' ' + theme.item + '.';
    if (c3.hi == null || c3.hi > 500) return 'More than ' + c3.lo + ' ' + theme.item + '.';
    return 'More than ' + c3.lo + ' and fewer than ' + c3.hi + ' ' + theme.item + '.';
  }
  const mag = Math.abs(c3.adjust);
  const word = noun(mag, theme);
  let action = c3.adjust < 0
    ? 'Gives ' + mag + ' ' + word + ' away. The rest pack into ' + theme.pack + ' of ' + c3.mod + '.'
    : 'Buys ' + mag + ' more ' + (mag === 1 ? theme.one : theme.item) + '. They pack equally into ' + theme.pack + ' of ' + c3.mod + '.';
  if (c3.lo != null && c3.lo > 0) action = 'More than ' + c3.lo + ' ' + theme.item + '. ' + action;
  return action;
}
function tipFor(problem, which) {
  if (which < 2) {
    const c = which === 0 ? problem.c1 : problem.c2;
    if (c.sign < 0) return "'" + c.hook + "' is a SHORTAGE — the number is " + c.off + " LESS than a multiple of " + c.div + " (Multiple of " + c.div + " − " + c.off + ")!";
    return "'" + c.hook + "' is an EXCESS — the number is " + c.off + " MORE than a multiple of " + c.div + " (Multiple of " + c.div + " + " + c.off + ")!";
  }
  const c3 = problem.c3;
  if (c3.type === 'range') {
    if (c3.lo <= 0) return 'The clue says fewer than ' + c3.hi + '. Cross out every overlap that is ' + c3.hi + ' or bigger.';
    return 'Keep the overlap that is more than ' + c3.lo + ' and fewer than ' + c3.hi + '.';
  }
  const mag = Math.abs(c3.adjust);
  const range = (c3.lo != null && c3.lo > 0) ? ' Also keep numbers more than ' + c3.lo + '.' : '';
  if (c3.adjust < 0) return "'Gives " + mag + " away' means you SUBTRACT " + mag + " before packing. Choose (N − " + mag + ") ÷ " + c3.mod + "!" + range;
  return "'Buys " + mag + " more' means you ADD " + mag + " before packing. Choose (N + " + mag + ") ÷ " + c3.mod + "!" + range;
}
function explain(n, problem) {
  const c3 = problem.c3;
  const theme = problem.theme;
  if (c3.type === 'range') {
    const ok = n > c3.lo && n < c3.hi;
    const range = c3.lo <= 0 ? ('fewer than ' + c3.hi) : ('more than ' + c3.lo + ' and fewer than ' + c3.hi);
    return { n, ok, text: n + (ok ? ' is ' : ' is not ') + range + (ok ? ' YES' : ' NO') };
  }
  const mag = Math.abs(c3.adjust);
  const op = c3.adjust < 0 ? '−' : '+';
  const v = n + c3.adjust;
  const mod = c3.mod;
  const q = Math.trunc(v / mod);
  const r = v % mod;
  const divOk = v > 0 && r === 0;
  const rangeOk = (c3.lo == null || n > c3.lo) && (c3.hi == null || n < c3.hi);
  const ok = divOk && rangeOk;
  const divBit = v + ' ÷ ' + mod + ' = ' + q + (r ? (' r ' + r) : '');
  let text = n + ' → ' + n + ' ' + op + ' ' + mag + ' = ' + v + ' (' + divBit + ') ' + (divOk ? 'YES' : 'NO');
  if (divOk && !rangeOk) {
    const bound = c3.lo != null ? ('more than ' + c3.lo) : ('under the top of the range');
    text = n + ' → ' + n + ' ' + op + ' ' + mag + ' = ' + v + ' (' + divBit + ' YES) but ' + n + ' is not ' + bound + ' NO';
  }
  return { n, ok, text, v, op, mag, divOk, rangeOk, mod, theme };
}
function failSentence(n, problem, early) {
  const ex = explain(n, problem);
  const c3 = problem.c3;

  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, rad * i / 4, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(G.t * 0.55);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, rad, -0.16, 0.16);
  ctx.closePath();
  ctx.fillStyle = 'rgba(80, 230, 255, 0.05)';
  ctx.fill();
  ctx.restore();
  ctx.restore();
}
function drawSweep(g, reveal, color) {
  if (reveal <= 0.001 || reveal >= 0.995) return;
  const x = g.x0 + reveal * g.gridW;
  const grad = ctx.createLinearGradient(x - 36, 0, x + 6, 0);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, color);
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = grad;
  ctx.fillRect(x - 36, g.y0 - 4, 42, g.gridH + 8);
  ctx.restore();
}
function drawFilaments(g) {
  const nodes = [];
  for (let n = 1; n <= g.maxN; n++) {
    const st = cellVisual(n);
    if (st.both && !st.dead) nodes.push(n);
  }
  if (nodes.length < 2) return;
  ctx.save();
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = 'rgba(255, 210, 80, 0.55)';
  ctx.setLineDash([5, 7]);
  ctx.lineDashOffset = -G.t * 28;
  const link = (a, b) => {
    const ra = cellRect(a);
    const rb = cellRect(b);
    const ang = Math.atan2(rb.cy - ra.cy, rb.cx - ra.cx);
    const inset = g.cell * 0.46;
    ctx.beginPath();
    ctx.moveTo(ra.cx + Math.cos(ang) * inset, ra.cy + Math.sin(ang) * inset);
    ctx.lineTo(rb.cx - Math.cos(ang) * inset, rb.cy - Math.sin(ang) * inset);
    ctx.stroke();
  };
  for (let i = 0; i < nodes.length - 1; i++) link(nodes[i], nodes[i + 1]);
  if (nodes.length > 2) link(nodes[nodes.length - 1], nodes[0]);
  ctx.restore();
}
function drawBrackets(cx, cy, r, color, rot) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  const o = r;
  const s = r * 0.42;
  const corners = [[1, 1], [1, -1], [-1, -1], [-1, 1]];
  for (let i = 0; i < corners.length; i++) {
    const sx = corners[i][0];
    const sy = corners[i][1];
    ctx.beginPath();
    ctx.moveTo(sx * o, sy * (o - s));
    ctx.lineTo(sx * o, sy * o);
    ctx.lineTo(sx * (o - s), sy * o);
    ctx.stroke();
  }
  ctx.restore();
}
function drawCell(n, g) {
  const r = cellRect(n);
  const st = cellVisual(n);
  let fill = COL.cell;
  let stroke = 'rgba(90, 120, 145, 0.28)';
  let num = '#d5e6f2';
  if (st.dead) {
    fill = '#121820';
    stroke = 'rgba(90, 100, 112, 0.35)';
    num = '#6d7d8c';
  } else if (st.both) {
    fill = 'rgba(48, 34, 8, 0.96)';
    stroke = COL.gold;
    num = COL.goldHot;
  } else if (st.m1) {
    fill = 'rgba(6, 36, 48, 0.96)';
    stroke = COL.cyan;
    num = '#dffcff';
  } else if (st.m2) {
    fill = 'rgba(42, 8, 36, 0.96)';
    stroke = COL.magenta;
    num = '#ffd8f5';
  }
  panel(r.x, r.y, r.w, r.h, 6, fill, stroke);
  if (st.both && !st.dead) {
    const pulse = 0.55 + 0.45 * Math.sin(G.t * 5 + n);
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 220, 110,' + (0.55 + pulse * 0.4) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.cx, r.cy, g.cell * 0.40, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 246, 200,' + (0.75 + pulse * 0.25) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(r.cx, r.cy, g.cell * 0.47, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  } else if (st.m1 || st.m2) {
    ctx.save();
    ctx.strokeStyle = st.m1 ? 'rgba(61, 240, 255, 0.9)' : 'rgba(255, 74, 216, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.cx, r.cy, g.cell * 0.42, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (st.dead) {
    ctx.strokeStyle = 'rgba(255, 80, 100, 0.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(r.x + 7, r.y + 7);
    ctx.lineTo(r.x + r.w - 7, r.y + r.h - 7);
    ctx.stroke();
  }
  const fontPx = Math.max(12, Math.min(22, Math.floor(g.cell * 0.30)));
  text(String(n), r.cx + 0.5, r.cy + 1, 'bold ' + fontPx + 'px Trebuchet MS, sans-serif', 'rgba(0,0,0,0.45)', 'center');
  text(String(n), r.cx, r.cy, 'bold ' + fontPx + 'px Trebuchet MS, sans-serif', num, 'center');
  if (st.live || st.active) drawBrackets(r.cx, r.cy, g.cell * 0.46, st.live ? '#fff6cc' : COL.gold, G.t * (st.live ? 1.4 : 3));
  if (G.stage === 3 && n === G.survivor) {
    const marks = [];
    if (G.armed[0]) marks.push('P1');
    if (G.armed[1]) marks.push('P2');
    if (marks.length && G.playMode === 'coop') {
      text(marks.join(' '), r.cx, r.y + r.h - 7, 'bold 9px Trebuchet MS, sans-serif', '#fff', 'center');
    }
  }
}
function drawEquationTag(g) {
  if (!G.sieve || G.sieve.done || !G.sieve.live) return;
  const ex = G.sieve.live;
  const r = cellRect(ex.n);
  const font = 'bold 13px Trebuchet MS, sans-serif';
  ctx.font = font;
  const tw = Math.min(GEO.stageW - 24, ctx.measureText(ex.text).width + 22);
  let x = r.cx - tw / 2;
  let y = r.y - 30;
  if (y < GEO.stageY + 48) y = r.y + r.h + 8;
  x = clamp(x, GEO.stageX + 12, GEO.stageX + GEO.stageW - tw - 12);
  panel(x, y, tw, 24, 6, ex.ok ? 'rgba(12, 40, 24, 0.95)' : 'rgba(40, 12, 18, 0.95)', ex.ok ? COL.green : COL.bad);
  text(ex.text, x + tw / 2, y + 12, font, ex.ok ? COL.green : '#ffd0d8', 'center');
}
function drawStage() {
  panel(GEO.stageX, GEO.stageY, GEO.stageW, GEO.stageH, 14, 'rgba(4, 10, 18, 0.94)', 'rgba(80, 200, 230, 0.32)');
  const g = UI.grid;
  text('RADAR  1–' + g.maxN, GEO.stageX + 18, GEO.stageY + 22, 'bold 14px Trebuchet MS, sans-serif', COL.ink, 'left');
  const legend = [['CYAN', COL.cyan], ['MAGENTA', COL.magenta], ['GOLD', COL.gold]];
  let lx = GEO.stageX + GEO.stageW - 18;
  for (let i = legend.length - 1; i >= 0; i--) {
    const label = legend[i][0];
    ctx.font = 'bold 11px Trebuchet MS, sans-serif';
    const w = ctx.measureText(label).width;
    lx -= w;
    text(label, lx, GEO.stageY + 22, 'bold 11px Trebuchet MS, sans-serif', legend[i][1], 'left');
    lx -= 16;
    ctx.beginPath();
    ctx.arc(lx + 6, GEO.stageY + 22, 5, 0, Math.PI * 2);
    ctx.strokeStyle = legend[i][1];
    ctx.lineWidth = 1.6;
    ctx.stroke();
    lx -= 18;
  }
  drawRadarField(g);
  drawSweep(g, G.reveal[0], COL.cyan);
  drawSweep(g, G.reveal[1], COL.magenta);
  for (let n = 1; n <= g.maxN; n++) drawCell(n, g);
  drawFilaments(g);
  drawEquationTag(g);
  if (G.staticT > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.45, G.staticT);
    ctx.strokeStyle = COL.bad;
    ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
      const y = g.y0 + Math.random() * g.gridH;
      ctx.beginPath();
      ctx.moveTo(g.x0, y);
      ctx.lineTo(g.x0 + g.gridW, y);
      ctx.stroke();
    }
    ctx.restore();
  }
}
function drawReticle(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(G.t * (p.i === 0 ? 1.1 : -1.1));
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 2;
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 8;
  ctx.strokeRect(-10, -10, 20, 20);
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(p.x - 18, p.y); ctx.lineTo(p.x - 6, p.y);
  ctx.moveTo(p.x + 6, p.y); ctx.lineTo(p.x + 18, p.y);
  ctx.moveTo(p.x, p.y - 18); ctx.lineTo(p.x, p.y - 6);
  ctx.moveTo(p.x, p.y + 6); ctx.lineTo(p.x, p.y + 18);
  ctx.stroke();
  ctx.restore();
  text(p.name, p.x + 14, p.y - 16, 'bold 11px Trebuchet MS, sans-serif', p.color, 'left');
}
function drawVault() {
  if (G.vaultT <= 0 || !G.problem) return;
  const open = clamp(G.vaultT / 0.55, 0, 1);
  ctx.fillStyle = 'rgba(2, 6, 12, ' + (0.55 * Math.min(1, G.vaultT * 2)) + ')';
  ctx.fillRect(GEO.stageX, GEO.stageY, GEO.stageW, GEO.stageH);
  const cx = GEO.stageX + GEO.stageW / 2;
  const cy = GEO.stageY + GEO.stageH / 2 - 10;
  const slide = open * 150;
  function door(x) {
    panel(x, cy - 86, 168, 172, 8, '#102838', COL.gold);
    ctx.fillStyle = 'rgba(255, 210, 74, 0.25)';
    ctx.fillRect(x + 76, cy - 70, 8, 140);
  }
  door(cx - 188 - slide);
  door(cx + 20 + slide);
  text(String(G.problem.answer), cx, cy - 16, 'bold 68px Trebuchet MS, sans-serif', COL.goldHot, 'center');
  text(G.combo ? 'VAULT OPEN  ·  SYNC ×2' : 'VAULT OPEN', cx, cy + 36, 'bold 18px Trebuchet MS, sans-serif', '#fff', 'center');
  text('+' + (G.combo ? PTS.vault * 2 : PTS.vault) + ' CODEBREAKER POINTS', cx, cy + 62, 'bold 14px Trebuchet MS, sans-serif', COL.lime, 'center');
  const c1 = G.problem.c1;
  const c2 = G.problem.c2;
  text(ruleLabel(c1.div, c1.off, c1.sign) + '   ·   ' + ruleLabel(c2.div, c2.off, c2.sign), cx, cy + 92, '13px Trebuchet MS, sans-serif', COL.dim, 'center');
  if (G.vaultT > 1.1) text('Confirm to open the next vault', cx, cy + 116, '12px Trebuchet MS, sans-serif', COL.muted, 'center');
}
function updateFX(dt) {
  for (let i = beams.length - 1; i >= 0; i--) {
    beams[i].life -= dt;
    if (beams[i].life <= 0) beams.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 280 * dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    f.y -= 26 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
}
function drawFX() {
  for (let i = 0; i < beams.length; i++) {
    const b = beams[i];
    ctx.save();
    ctx.globalAlpha = clamp(b.life * 3, 0, 1);
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 2;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.lineTo(b.x2, b.y2);
    ctx.stroke();
    ctx.restore();
  }
  for (let i = 0; i < sparks.length; i++) {
    const s = sparks[i];
    ctx.globalAlpha = clamp(s.life, 0, 1);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.w, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i];
    ctx.globalAlpha = clamp(f.life, 0, 1);
    text(f.text, f.x, f.y, 'bold 16px Trebuchet MS, sans-serif', f.color, 'center');
    ctx.globalAlpha = 1;
  }
}
function drawTitle() {
  layoutTitle();
  drawBackground();
  drawHUD();
  text('SINGAPORE PRIMARY 4  ·  5', W / 2, 78, 'bold 13px Trebuchet MS, sans-serif', COL.cyan, 'center');
  text('LASER VENN SIEVE', W / 2, 124, 'bold 54px Trebuchet MS, sans-serif', '#f4fbff', 'center');
  text('THE NUMBER HUNTER', W / 2, 168, 'bold 18px Trebuchet MS, sans-serif', COL.gold, 'center');

  ctx.save();
  ctx.translate(W / 2, 214);
  ctx.strokeStyle = COL.cyan;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.arc(-26 + Math.sin(G.t) * 4, 0, 28, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = COL.magenta;
  ctx.beginPath();
  ctx.arc(26 - Math.sin(G.t) * 4, 0, 28, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = COL.gold;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 12 + Math.sin(G.t * 3) * 1.5, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  const blurb = wrap('Shortage (“needs more” or “short of”) is Multiple of N − X. Excess (“left over”) is Multiple of N + X. The gold overlap still has impostors. Clue 3 knocks them out.', 760, '15px Trebuchet MS, sans-serif');
  blurb.forEach((ln, i) => text(ln, W / 2, 248 + i * 18, '15px Trebuchet MS, sans-serif', COL.dim, 'center'));

  for (let i = 0; i < UI.cards.length; i++) {
    const card = UI.cards[i];
    const mode = MODES[i];
    const on = G.focus === i;
    panel(card.x, card.y, card.w, card.h, 14, on ? 'rgba(12, 28, 44, 0.96)' : 'rgba(8, 14, 24, 0.92)', on ? COL.gold : 'rgba(100,140,160,0.35)');
    text(mode.title, card.x + 24, card.y + 36, 'bold 20px Trebuchet MS, sans-serif', on ? COL.gold : COL.ink, 'left');
    mode.lines.forEach((ln, li) => text(ln, card.x + 22, card.y + 72 + li * 24, '16px Trebuchet MS, sans-serif', COL.dim, 'left'));
  }
  text('Solo: mouse  ·  WASD + F / Enter  ·  8BitDo D-pad + A', W / 2, 520, '15px Trebuchet MS, sans-serif', COL.gold, 'center');
  text('Co-op / Duel:  P1 WASD + F    ·    P2 arrows + Enter    ·    two gamepads', W / 2, 546, '15px Trebuchet MS, sans-serif', COL.dim, 'center');
  text(G.note, W / 2, 582, '13px Trebuchet MS, sans-serif', COL.muted, 'center');
  text('M mutes  ·  1 solo  ·  2 co-op  ·  3 duel  ·  Esc returns here', W / 2, 612, '13px Trebuchet MS, sans-serif', COL.muted, 'center');
  if (G.bootErrors.length) {
    text(G.bootErrors[0], W / 2, 690, '12px Trebuchet MS, sans-serif', COL.bad, 'center');
  }
}
function drawPlay() {
  layoutPlay();
  drawBackground();
  drawHUD();
  drawLeft();
  drawStage();
  drawVault();
  drawFX();
  const hunters = G.playMode === 'solo' ? 1 : 2;
  for (let i = 0; i < hunters; i++) drawReticle(players[i]);
  if (G.bootErrors.length) text(G.bootErrors[0], W / 2, H - 8, '12px Trebuchet MS, sans-serif', COL.bad, 'center');
}

/* ---------- Loop ---------- */
function update(dt) {
  if (G.chipFlash && G.chipFlash.t > 0) G.chipFlash.t -= dt;
  if (G.staticT > 0) G.staticT -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 18);
  if (G.mode !== 'play' || !G.problem) return;
  for (let i = 0; i < 2; i++) {
    if (G.locked[i] && G.reveal[i] < 1) G.reveal[i] = Math.min(1, G.reveal[i] + dt * 1.65);
  }
  if (G.stage === 1 && G.locked[0] && G.locked[1] && G.reveal[0] >= 1 && G.reveal[1] >= 1 && !G.goldAnnounced) {
    G.goldAnnounced = true;
    G.stage = 2;
    audio.chord();
    const nodes = goldNodes();
    setDiag('Gold overlap: ' + nodes.join(', ') + '. Choose the Clue 3 test and fire the sieve.', 'good');
  }
  updateSieve(dt);
  if (G.vaultT > 0) {
    G.vaultT += dt;
    if (G.vaultT > 4.4) finishVault();
  }
  for (let i = 0; i < players.length; i++) {
    if (players[i].mouseLock > 0) players[i].mouseLock -= dt;
    if (players[i].snapLock > 0) players[i].snapLock -= dt;
  }
}

let last = performance.now();
let lastPaint = performance.now();
let rafQueued = false;
function kick() {
  if (rafQueued) return;
  rafQueued = true;
  requestAnimationFrame(frame);
}
function frame(now) {
  rafQueued = false;
  const dt = Math.min(0.034, (now - last) / 1000);
  last = now;
  lastPaint = now;
  G.t += dt;
  pollGamepads(dt);
  pollKeys(dt);
  updateFX(dt);
  update(dt);
  if (G.mode === 'play') {
    const hunters = G.playMode === 'solo' ? 1 : 2;
    for (let i = 0; i < hunters; i++) {
      const p = players[i];
      const keys = i === 0
        ? (held.has('KeyW') || held.has('KeyA') || held.has('KeyS') || held.has('KeyD'))
        : (held.has('ArrowUp') || held.has('ArrowDown') || held.has('ArrowLeft') || held.has('ArrowRight'));
      if (!keys && !p.stickLive && p.mouseLock <= 0 && p.snapLock <= 0) magnet(p, i);
    }
  }
  ctx.save();
  if (G.shake > 0.2) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  if (G.mode === 'title') drawTitle();
  else drawPlay();
  ctx.restore();
  kick();
}
/* Some embedded and unfocused webviews stop delivering animation frames.
   If a paint is late, step from a timer so the radar does not freeze. */
setInterval(() => {
  if (performance.now() - lastPaint > 40) frame(performance.now());
}, 32);

selfTest();
kick();
</script>
