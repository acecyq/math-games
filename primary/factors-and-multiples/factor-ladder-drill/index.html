<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ladder Drill: The Core Extractor</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #07090e;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      color: #00ffcc;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #121c2b 0%, #05080f 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 18px;
    }
    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      text-shadow: 0 2px 5px #000;
      font-weight: bold;
    }
    .hud-card {
      background: rgba(8, 18, 30, 0.88);
      border: 2px solid #00e5ff;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.8), inset 0 0 10px rgba(0, 229, 255, 0.3);
      pointer-events: auto;
    }
    .hud-p-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      border: 2px solid;
    }
    .p1-badge {
      color: #ff5555;
      border-color: #ff4444;
      background: rgba(50, 10, 10, 0.7);
    }
    .p2-badge {
      color: #44bbff;
      border-color: #0099ff;
      background: rgba(10, 30, 60, 0.7);
    }
    .btn {
      background: linear-gradient(180deg, #00b4d8 0%, #0077b6 100%);
      color: #ffffff;
      border: 2px solid #90e0ef;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.7);
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .btn:hover {
      filter: brightness(1.25);
    }
    .btn:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
      <!-- TOP HUD: Organized cleanly to avoid overlapping game field -->
      <div class="hud-bar">
        <div style="display: flex; gap: 8px; align-items: center;">
          <div class="hud-card" id="hud-mode">MODE: CO-OP</div>
          <div class="hud-card" id="hud-tier">TIER 1: 2 VEINS</div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <div class="hud-p-badge p1-badge" id="hud-p1">P1 [RED]: 3 🛡️ | 0 ⭐</div>
          <div class="hud-p-badge p2-badge" id="hud-p2">P2 [BLUE]: 3 🛡️ | 0 ⭐</div>
          <button id="btn-audio" class="btn">AUDIO: ON</button>
          <button id="btn-mode-toggle" class="btn">SWITCH MODE</button>
        </div>
      </div>
      <!-- BOTTOM HUD: Score and Controls prompt -->
      <div class="hud-bar" style="margin-top: auto;">
        <div class="hud-card" id="hud-score">EXTRACTION BOUNTY: 0 pts</div>
        <div class="hud-card" style="font-size: 11px; color: #a0c4e2;">
          P1: WASD+F / D-Pad+A | P2: Arrows+Enter / D-Pad+A | Click / Tap Supported
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       LADDER DRILL: THE CORE EXTRACTOR
       2-Player Subterranean HCF Mining Arcade Game (Singapore P4/P5)
       Textbook Repeated Division (Ladder Method)
       ========================================================================== */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- PROCEDURAL WEB AUDIO ENGINE ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmTimer = null;
        this.step = 0;
        this.tempo = 132;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.startBGM();
        } else if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggleMute() {
        this.muted = !this.muted;
        document.getElementById('btn-audio').innerText = `AUDIO: ${this.muted ? 'OFF' : 'ON'}`;
      }
      playTone(freq, duration, type = 'square', gainVal = 0.08) {
        if (this.muted || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playNoise(duration = 0.15, gainVal = 0.08) {
        if (this.muted || !this.ctx) return;
        try {
          const bufferSize = this.ctx.sampleRate * duration;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          noise.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
        } catch(e) {}
      }
      sfxDrill() {
        this.playTone(180, 0.2, 'sawtooth', 0.12);
        this.playNoise(0.2, 0.09);
      }
      sfxLever() {
        this.playTone(320, 0.06, 'sine', 0.1);
        setTimeout(() => this.playTone(480, 0.08, 'triangle', 0.08), 50);
      }
      sfxRungLock() {
        this.playTone(520, 0.1, 'sine', 0.08);
      }
      sfxLaserCharge() {
        if (this.muted || !this.ctx) return;
        const notes = [220, 277, 330, 440, 554, 660, 880];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 0.2, 'sawtooth', 0.08), idx * 60);
        });
      }
      sfxExplosion() {
        this.playNoise(0.6, 0.25);
        this.playTone(70, 0.5, 'triangle', 0.2);
      }
      sfxError() {
        this.playTone(130, 0.35, 'sawtooth', 0.2);
        this.playNoise(0.3, 0.15);
      }
      startBGM() {
        if (this.bgmTimer) return;
        const bassLine = [73.42, 73.42, 87.31, 98.00, 73.42, 73.42, 110.00, 98.00];
        const arps = [293.66, 369.99, 440.00, 587.33, 440.00, 369.99, 329.63, 293.66];
        const stepTime = (60 / this.tempo) * 1000 / 2;

        this.bgmTimer = setInterval(() => {
          if (!this.muted && this.ctx && this.ctx.state === 'running') {
            const b = bassLine[this.step % bassLine.length];
            const a = arps[(this.step * 2) % arps.length];
            this.playTone(b, 0.14, 'triangle', 0.04);
            if (this.step % 2 === 0) {
              this.playTone(a, 0.07, 'square', 0.015);
            }
            if (this.step % 4 === 2) {
              this.playNoise(0.04, 0.02);
            }
          }
          this.step = (this.step + 1) % 64;
        }, stepTime);
      }
    }
    const audio = new SoundEngine();

    // --- CANVAS SIZING ---
    let width = 1200;
    let height = 750;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- GAME ENGINE STATE ---
    let gameMode = 'coop'; // 'coop' or 'versus'
    let currentTier = 1;   // 1 (2 numbers), 2 (3 numbers), 3 (4 numbers)
    let scoreTeam = 0;
    let sparks = [];
    let rockDebris = [];
    let fusionBeams = [];
    let popup = null;

    function showPopup(text, subtext = '', color = '#00ffff', duration = 180) {
      popup = { text, subtext, color, timer: duration, maxTimer: duration };
    }

    // --- CURRICULUM DATASETS ---
    const TIER1_PROBLEMS = [
      { numbers: [24, 36] },
      { numbers: [18, 30] },
      { numbers: [45, 60] },
      { numbers: [28, 42] },
      { numbers: [32, 48] }
    ];
    const TIER2_PROBLEMS = [
      { numbers: [24, 36, 60] },
      { numbers: [18, 27, 45] },
      { numbers: [32, 48, 80] },
      { numbers: [30, 45, 75] },
      { numbers: [16, 24, 40] }
    ];
    const TIER3_PROBLEMS = [
      { numbers: [24, 36, 60, 72] },
      { numbers: [20, 40, 60, 80] },
      { numbers: [16, 24, 40, 56] },
      { numbers: [18, 36, 54, 72] }
    ];

    // Helper: GCD of two numbers
    function gcd2(a, b) {
      while (b) { let t = b; b = a % b; a = t; }
      return a;
    }
    // Helper: GCD of array
    function gcdArr(arr) {
      return arr.reduce((acc, val) => gcd2(acc, val), arr[0]);
    }

    // --- PLAYERS (8BitDo & Keyboard) ---
    const players = [
      {
        id: 0,
        name: 'P1 [RED]',
        color: '#ff4444',
        glow: 'rgba(255, 68, 68, 0.7)',
        x: width * 0.3,
        y: height * 0.85,
        shields: 3,
        stars: 0,
        gamepadIndex: 0,
        keys: { up: false, down: false, left: false, right: false, action: false, lastAction: false }
      },
      {
        id: 1,
        name: 'P2 [BLUE]',
        color: '#33b5ff',
        glow: 'rgba(51, 181, 255, 0.7)',
        x: width * 0.7,
        y: height * 0.85,
        shields: 3,
        stars: 0,
        gamepadIndex: 1,
        keys: { up: false, down: false, left: false, right: false, action: false, lastAction: false }
      }
    ];

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      audio.init();
      const c = e.code;
      // P1: WASD + F / Space
      if (c === 'KeyW') players[0].keys.up = true;
      if (c === 'KeyS') players[0].keys.down = true;
      if (c === 'KeyA') players[0].keys.left = true;
      if (c === 'KeyD') players[0].keys.right = true;
      if (c === 'KeyF' || c === 'Space') players[0].keys.action = true;

      // P2: Arrows + Enter / Numpad0
      if (c === 'ArrowUp') players[1].keys.up = true;
      if (c === 'ArrowDown') players[1].keys.down = true;
      if (c === 'ArrowLeft') players[1].keys.left = true;
      if (c === 'ArrowRight') players[1].keys.right = true;
      if (c === 'Enter' || c === 'Numpad0') players[1].keys.action = true;
    });

    window.addEventListener('keyup', (e) => {
      const c = e.code;
      if (c === 'KeyW') players[0].keys.up = false;
      if (c === 'KeyS') players[0].keys.down = false;
      if (c === 'KeyA') players[0].keys.left = false;
      if (c === 'KeyD') players[0].keys.right = false;
      if (c === 'KeyF' || c === 'Space') players[0].keys.action = false;

      if (c === 'ArrowUp') players[1].keys.up = false;
      if (c === 'ArrowDown') players[1].keys.down = false;
      if (c === 'ArrowLeft') players[1].keys.left = false;
      if (c === 'ArrowRight') players[1].keys.right = false;
      if (c === 'Enter' || c === 'Numpad0') players[1].keys.action = false;
    });

    // Pointer click support
    canvas.addEventListener('pointerdown', (e) => {
      audio.init();
      const rect = canvas.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      players[0].x = px;
      players[0].y = py;
      handleInteract(players[0]);
    });

    // --- ROUND & LADDER SHAFT STATE ---
    let currentRound = {
      tier: 1,
      initialNumbers: [],
      rows: [], // each row: { numbers: [], divisor: null, rungAnim: 1 }
      extractedDivisors: [], // array of numbers extracted on left
      completed: false,
      fusionState: 0 // 0: mining, 1: multiplying divisors, 2: blast
    };

    let drillBits = []; // 4 selectable buttons at bottom
    let bedrockLever = null; // lever button

    function initRound() {
      sparks = [];
      rockDebris = [];
      fusionBeams = [];

      let dataset = TIER1_PROBLEMS;
      if (currentTier === 2) dataset = TIER2_PROBLEMS;
      if (currentTier === 3) dataset = TIER3_PROBLEMS;

      const prob = dataset[Math.floor(Math.random() * dataset.length)];
      const initialNums = [...prob.numbers];

      currentRound = {
        tier: currentTier,
        initialNumbers: [...initialNums],
        rows: [{
          numbers: [...initialNums],
          divisor: null
        }],
        extractedDivisors: [],
        completed: false,
        fusionState: 0
      };

      generateDrillOptions();
      showPopup(
        `DEPTH LEVEL: TIER ${currentTier}`,
        `Drill through mineral veins [${initialNums.join(', ')}] using repeated division!`,
        '#00ffff',
        180
      );
      updateHUD();
    }

    // Refresh candidate drill bits based on current bottom row
    function generateDrillOptions() {
      const bottomRow = currentRound.rows[currentRound.rows.length - 1];
      const nums = bottomRow.numbers;
      const trueGcd = gcdArr(nums);

      // Find valid common factors
      const validFactors = [];
      for (let f = 2; f <= Math.min(...nums); f++) {
        if (nums.every(n => n % f === 0)) {
          validFactors.push(f);
        }
      }

      // Candidate generator
      const candidates = new Set();
      if (validFactors.length > 0) {
        // pick at least 1 or 2 valid factors
        candidates.add(validFactors[0]);
        if (validFactors.length > 1) candidates.add(validFactors[validFactors.length - 1]);
      }

      // Add partial divisor traps (divides only some)
      const partials = [];
      for (let d = 2; d <= 12; d++) {
        const dividesSome = nums.some(n => n % d === 0);
        const dividesAll = nums.every(n => n % d === 0);
        if (dividesSome && !dividesAll) partials.push(d);
      }
      if (partials.length > 0) candidates.add(partials[Math.floor(Math.random() * partials.length)]);

      // Add non-divisor traps
      const nonDivs = [2, 3, 4, 5, 6, 7, 8, 9, 10].filter(d => !nums.some(n => n % d === 0));
      if (nonDivs.length > 0) candidates.add(nonDivs[Math.floor(Math.random() * nonDivs.length)]);

      // Fill remaining slots
      const pool = [2, 3, 4, 5, 6, 7, 8, 9];
      while (candidates.size < 4 && pool.length > 0) {
        candidates.add(pool.pop());
      }

      const bitList = Array.from(candidates).slice(0, 4);
      bitList.sort((a, b) => a - b);

      // Layout bottom buttons
      const btnW = 96;
      const btnH = 50;
      const totalW = bitList.length * (btnW + 20);
      const startX = (width - totalW) / 2 - 80;
      const bayY = height - 100;

      drillBits = bitList.map((val, idx) => ({
        value: val,
        x: startX + idx * (btnW + 20),
        y: bayY,
        w: btnW,
        h: btnH,
        active: true
      }));

      // Bedrock Lever placed to the right of drill bay
      bedrockLever = {
        x: startX + bitList.length * (btnW + 20) + 20,
        y: bayY,
        w: 180,
        h: btnH,
        title: 'CONFIRM BEDROCK'
      };
    }

    // --- GAMEPAD & KEYBOARD POLLING ---
    function updateControls() {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];

      players.forEach(p => {
        let dx = 0;
        let dy = 0;
        let action = false;

        // Gamepad inputs
        if (p.gamepadIndex !== null && gamepads[p.gamepadIndex]) {
          const gp = gamepads[p.gamepadIndex];
          const stickX = gp.axes[0] || 0;
          const stickY = gp.axes[1] || 0;
          if (Math.abs(stickX) > 0.2) dx += stickX;
          if (Math.abs(stickY) > 0.2) dy += stickY;

          if (gp.buttons[12]?.pressed) dy -= 1;
          if (gp.buttons[13]?.pressed) dy += 1;
          if (gp.buttons[14]?.pressed) dx -= 1;
          if (gp.buttons[15]?.pressed) dx += 1;

          if (gp.buttons[0]?.pressed) action = true; // Button A
        }

        // Keyboard inputs
        if (p.keys.up) dy -= 1;
        if (p.keys.down) dy += 1;
        if (p.keys.left) dx -= 1;
        if (p.keys.right) dx += 1;
        if (p.keys.action) action = true;

        p.x += dx * 8.5;
        p.y += dy * 8.5;

        // Boundaries
        p.x = Math.max(30, Math.min(width - 30, p.x));
        p.y = Math.max(60, Math.min(height - 40, p.y));

        // Action Trigger
        if (action && !p.keys.lastAction) {
          handleInteract(p);
        }
        p.keys.lastAction = action;
      });
    }

    // --- INTERACTION & HEURISTICS VALIDATION ---
    function handleInteract(player) {
      audio.init();
      if (currentRound.completed || currentRound.fusionState > 0) return;

      // 1. Check Drill Bit Selection
      for (const bit of drillBits) {
        if (player.x >= bit.x && player.x <= bit.x + bit.w &&
            player.y >= bit.y && player.y <= bit.y + bit.h) {
          applyDrillBit(bit.value, player);
          return;
        }
      }

      // 2. Check Bedrock Lever
      if (bedrockLever &&
          player.x >= bedrockLever.x && player.x <= bedrockLever.x + bedrockLever.w &&
          player.y >= bedrockLever.y && player.y <= bedrockLever.y + bedrockLever.h) {
        confirmBedrock(player);
        return;
      }
    }

    function applyDrillBit(divisor, player) {
      const bottomRow = currentRound.rows[currentRound.rows.length - 1];
      const nums = bottomRow.numbers;

      // Rule 1: Must divide EVERY single number in the row
      const failedNum = nums.find(n => n % divisor !== 0);

      if (failedNum) {
        audio.sfxError();
        createSparks(player.x, player.y, 40, '#ff3333');
        const dividesSome = nums.some(n => n % divisor === 0);

        if (dividesSome) {
          // Partial Divisor Trap!
          showPopup(
            'DRILL BIT JAMMED! (PARTIAL FACTOR)',
            `÷${divisor} divides some numbers, but NOT ${failedNum}! For HCF, your drill MUST divide EVERY number in the row!`,
            '#ff4444',
            200
          );
        } else {
          // Total Non-Divisor
          showPopup(
            'DRILL BIT SHATTERED!',
            `÷${divisor} leaves a remainder on ${failedNum}! (${failedNum} ÷ ${divisor} = ${Math.floor(failedNum / divisor)} R ${failedNum % divisor})`,
            '#ff5555',
            180
          );
        }

        player.shields = Math.max(0, player.shields - 1);
        updateHUD();
        return;
      }

      // Success! Perform repeated division on this row
      audio.sfxDrill();
      audio.sfxRungLock();
      createRockDebris(width * 0.5, 200 + currentRound.rows.length * 60, 25);

      bottomRow.divisor = divisor;
      currentRound.extractedDivisors.push(divisor);

      // Compute next row
      const nextNumbers = nums.map(n => n / divisor);
      currentRound.rows.push({
        numbers: nextNumbers,
        divisor: null
      });

      player.stars++;
      scoreTeam += 100;
      updateHUD();

      showPopup(
        `RUNG EXTRACTED: ÷${divisor}`,
        `[${nums.join(', ')}] ÷ ${divisor} = [${nextNumbers.join(', ')}]`,
        '#00ffaa',
        140
      );

      // Regenerate drill options for the new row
      generateDrillOptions();
    }

    function confirmBedrock(player) {
      const bottomRow = currentRound.rows[currentRound.rows.length - 1];
      const nums = bottomRow.numbers;
      const remainingGCD = gcdArr(nums);

      audio.sfxLever();

      if (remainingGCD > 1) {
        // Premature Bedrock warning!
        audio.sfxError();
        createSparks(player.x, player.y, 35, '#ffbb00');
        showPopup(
          'PREMATURE BEDROCK! DRILL DEEPER!',
          `[${nums.join(', ')}] still share a common factor of ${remainingGCD}! Keep drilling!`,
          '#ffaa00',
          180
        );
        player.shields = Math.max(0, player.shields - 1);
        updateHUD();
        return;
      }

      // Bedrock Reached! Numbers are coprime!
      currentRound.fusionState = 1;
      showPopup(
        'BEDROCK REACHED! (COPRIME)',
        `Bottom numbers [${nums.join(', ')}] share no further common factors! Engaging HCF Fusion Beam!`,
        '#00ffff',
        180
      );

      startHCFFusion(player);
    }

    // --- HCF FUSION SEQUENCE ---
    function startHCFFusion(player) {
      audio.sfxLaserCharge();
      const divs = currentRound.extractedDivisors;
      let finalHCF = divs.length > 0 ? divs.reduce((a, b) => a * b, 1) : 1;

      setTimeout(() => {
        currentRound.fusionState = 2;
        audio.sfxExplosion();
        createRockDebris(width * 0.8, height * 0.45, 80);
        createSparks(width * 0.8, height * 0.45, 90, '#00ffff');

        awardRoundSuccess(player, finalHCF);

        setTimeout(() => {
          advanceNextRound();
        }, 3200);
      }, 1600);
    }

    function awardRoundSuccess(player, hcf) {
      scoreTeam += 300;
      player.stars += 2;
      updateHUD();
      showPopup(
        `MINERAL CACHE BLASTED! HCF = ${hcf}!`,
        `${currentRound.extractedDivisors.join(' × ')} = ${hcf}! +300 Mining Bounty!`,
        '#ffe600',
        220
      );
    }

    function advanceNextRound() {
      if (currentTier === 1) currentTier = 2;
      else if (currentTier === 2) currentTier = 3;
      else currentTier = 1;

      initRound();
    }

    function updateHUD() {
      document.getElementById('hud-mode').innerText = `MODE: ${gameMode.toUpperCase()}`;
      document.getElementById('hud-tier').innerText = `TIER ${currentTier}: ${currentTier + 1} VEINS`;
      document.getElementById('hud-p1').innerText = `P1 [RED]: ${'🛡️'.repeat(players[0].shields)} | ${players[0].stars} ⭐`;
      document.getElementById('hud-p2').innerText = `P2 [BLUE]: ${'🛡️'.repeat(players[1].shields)} | ${players[1].stars} ⭐`;
      document.getElementById('hud-score').innerText = gameMode === 'coop'
        ? `EXTRACTION BOUNTY: ${scoreTeam} pts`
        : `DUEL: P1 (${players[0].stars}⭐) vs P2 (${players[1].stars}⭐)`;
    }

    // Mode Toggle
    document.getElementById('btn-mode-toggle').addEventListener('click', () => {
      audio.init();
      gameMode = gameMode === 'coop' ? 'versus' : 'coop';
      showPopup(
        `SWITCHED TO ${gameMode.toUpperCase()} MODE!`,
        gameMode === 'coop' ? 'Collaborate on the ladder drill to descend deeper!' : 'Buzzer duel! First operator to reach bedrock claims the bounty!',
        '#00ffcc',
        140
      );
      updateHUD();
    });

    document.getElementById('btn-audio').addEventListener('click', () => {
      audio.init();
      audio.toggleMute();
    });

    // --- PARTICLES (Sparks & Rocks) ---
    function createSparks(x, y, count = 25, color = '#ffaa00') {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 6;
        sparks.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 25 + Math.random() * 20,
          color
        });
      }
    }

    function createRockDebris(x, y, count = 30) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 5;
        rockDebris.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: 3 + Math.random() * 6,
          life: 40 + Math.random() * 30,
          rot: Math.random() * Math.PI,
          vrot: (Math.random() - 0.5) * 0.2
        });
      }
    }

    // --- RENDERING PIPELINE (Canvas 60 FPS) ---
    function drawSubterraneanBackdrop() {
      // Rock strata background
      ctx.fillStyle = '#0a101d';
      ctx.fillRect(0, 0, width, height);

      // Vein grid lines
      ctx.strokeStyle = '#112238';
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Cavern Wall (Target for laser blast on the right)
      ctx.fillStyle = '#182436';
      ctx.fillRect(width * 0.78, 140, width * 0.2, height * 0.5);
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(width * 0.78, 140, width * 0.2, height * 0.5);

      // Glowing alien ore inside cavern
      ctx.save();
      ctx.font = "bold 15px 'Courier New', monospace";
      ctx.fillStyle = '#00ffff';
      ctx.textAlign = 'center';
      ctx.fillText('ALIEN MINERAL CACHE', width * 0.88, 180);
      ctx.font = "bold 32px 'Courier New', monospace";
      ctx.fillStyle = '#ffd700';
      ctx.fillText('💎 💎 💎', width * 0.88, 240);
      ctx.restore();
    }

    function drawLadderShaft() {
      const shaftX = width * 0.28;
      const startY = 160;
      const rowH = 65;
      const colSpacing = Math.min(95, (width * 0.35) / Math.max(2, currentRound.initialNumbers.length));

      ctx.save();
      ctx.font = "bold 24px 'Courier New', monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Header Banner
      ctx.fillStyle = '#90e0ef';
      ctx.font = "bold 16px 'Courier New', monospace";
      ctx.fillText('SUBTERRANEAN REPEATED DIVISION SHAFT', shaftX + 110, startY - 35);

      currentRound.rows.forEach((row, rIdx) => {
        const y = startY + rIdx * rowH;

        // 1. Draw Extracted Divisor on Left of Ladder
        if (row.divisor !== null) {
          // Divisor Magazine Badge
          ctx.fillStyle = '#00e5ff';
          ctx.strokeStyle = '#0077b6';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(shaftX - 65, y - 20, 48, 40, [8]);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#021024';
          ctx.font = "bold 20px 'Courier New', monospace";
          ctx.fillText(`÷${row.divisor}`, shaftX - 41, y);
        } else if (rIdx === currentRound.rows.length - 1 && !currentRound.completed && currentRound.fusionState === 0) {
          // Active divisor slot placeholder
          ctx.strokeStyle = '#00ffaa';
          ctx.setLineDash([5, 5]);
          ctx.strokeRect(shaftX - 65, y - 20, 48, 40);
          ctx.setLineDash([]);
          ctx.fillStyle = '#00ffaa';
          ctx.font = "bold 20px 'Courier New', monospace";
          ctx.fillText('?', shaftX - 41, y);
        }

        // 2. The Repeated Division Ladder Bracket Lines
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 3;

        // Vertical bracket pipe
        ctx.beginPath();
        ctx.moveTo(shaftX, y - 24);
        ctx.lineTo(shaftX, y + 24);
        ctx.stroke();

        // Horizontal rung line (only if not bedrock/final or has divisor)
        if (rIdx < currentRound.rows.length - 1 || row.divisor !== null) {
          const rungWidth = row.numbers.length * colSpacing + 30;
          ctx.beginPath();
          ctx.moveTo(shaftX, y + 24);
          ctx.lineTo(shaftX + rungWidth, y + 24);
          ctx.stroke();
        }

        // 3. The Mineral Vein Numbers in the Row
        row.numbers.forEach((num, cIdx) => {
          const nx = shaftX + 45 + cIdx * colSpacing;
          // Number card background
          ctx.fillStyle = 'rgba(3, 24, 46, 0.85)';
          ctx.beginPath();
          ctx.roundRect(nx - 32, y - 18, 64, 36, [6]);
          ctx.fill();
          ctx.strokeStyle = rIdx === currentRound.rows.length - 1 ? '#00ffaa' : '#3a6073';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = rIdx === currentRound.rows.length - 1 ? '#ffffff' : '#90e0ef';
          ctx.font = "bold 22px 'Courier New', monospace";
          ctx.fillText(num.toString(), nx, y);
        });
      });

      // 4. Coprime Bedrock Marker when reached
      if (currentRound.fusionState > 0) {
        const lastY = startY + (currentRound.rows.length - 1) * rowH + 34;
        ctx.fillStyle = '#00ffaa';
        ctx.font = "bold 14px 'Courier New', monospace";
        ctx.fillText('▼ BEDROCK LEVEL CONFIRMED (COPRIME) ▼', shaftX + 110, lastY);
      }

      ctx.restore();
    }

    function drawControlsConsole() {
      // Bottom Bay Gantry Plate
      ctx.fillStyle = 'rgba(7, 18, 30, 0.9)';
      ctx.fillRect(40, height - 120, width - 80, 80);
      ctx.strokeStyle = '#0077b6';
      ctx.lineWidth = 2;
      ctx.strokeRect(40, height - 120, width - 80, 80);

      // Label
      ctx.font = "bold 13px 'Courier New', monospace";
      ctx.fillStyle = '#90e0ef';
      ctx.textAlign = 'left';
      ctx.fillText('INTERCHANGEABLE DRILL BIT SELECTOR BAY:', 55, height - 100);

      // Draw Drill Bit Buttons
      drillBits.forEach((bit, i) => {
        ctx.save();
        const grad = ctx.createLinearGradient(bit.x, bit.y, bit.x, bit.y + bit.h);
        grad.addColorStop(0, '#00b4d8');
        grad.addColorStop(1, '#005f73');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(bit.x, bit.y, bit.w, bit.h, [8]);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#caf0f8';
        ctx.stroke();

        // Icon + Value
        ctx.font = "bold 20px 'Courier New', monospace";
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`÷${bit.value}`, bit.x + bit.w / 2, bit.y + bit.h / 2);
        ctx.restore();
      });

      // Draw Bedrock Confirm Lever
      if (bedrockLever) {
        ctx.save();
        const lGrad = ctx.createLinearGradient(bedrockLever.x, bedrockLever.y, bedrockLever.x, bedrockLever.y + bedrockLever.h);
        lGrad.addColorStop(0, '#ff9e00');
        lGrad.addColorStop(1, '#9d0208');
        ctx.fillStyle = lGrad;
        ctx.beginPath();
        ctx.roundRect(bedrockLever.x, bedrockLever.y, bedrockLever.w, bedrockLever.h, [8]);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffd000';
        ctx.stroke();

        ctx.font = "bold 14px 'Courier New', monospace";
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('CONFIRM BEDROCK', bedrockLever.x + bedrockLever.w / 2, bedrockLever.y + bedrockLever.h / 2);
        ctx.restore();
      }
    }

    function drawHCFFusionAnimation() {
      if (currentRound.fusionState === 0) return;

      const shaftX = width * 0.28 - 41;
      const startY = 160;
      const divs = currentRound.extractedDivisors;

      ctx.save();
      // 1. Draw glowing multiplier conduit between extracted divisors
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      divs.forEach((d, idx) => {
        const y = startY + idx * 65;
        if (idx === 0) ctx.moveTo(shaftX, y);
        else ctx.lineTo(shaftX, y);
      });
      ctx.stroke();

      // 2. High-energy laser firing toward the alien mineral cache
      const finalY = startY + (divs.length - 1) * 65;
      const targetX = width * 0.78;
      const targetY = 240;

      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 8;
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(shaftX + 24, finalY);
      ctx.lineTo(targetX, targetY);
      ctx.stroke();

      // Calculation callout formula above laser
      const multFormula = divs.join(' × ');
      const hcfVal = divs.reduce((a, b) => a * b, 1);
      ctx.font = "bold 26px 'Courier New', monospace";
      ctx.fillStyle = '#ffd700';
      ctx.textAlign = 'center';
      ctx.fillText(`HCF = ${multFormula} = ${hcfVal}`, (shaftX + targetX) / 2, targetY - 40);

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      // 1. Background & Environment
      drawSubterraneanBackdrop();

      // 2. Ladder Shaft & Rungs
      drawLadderShaft();

      // 3. Drill Selector Console & Bedrock Lever
      drawControlsConsole();

      // 4. Laser Fusion Sequence (on Bedrock reached)
      drawHCFFusionAnimation();

      // 5. Particles (Sparks)
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life--;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.fill();
        if (s.life <= 0) sparks.splice(i, 1);
      }

      // 6. Particles (Rock Debris)
      for (let i = rockDebris.length - 1; i >= 0; i--) {
        const r = rockDebris[i];
        r.x += r.vx;
        r.y += r.vy;
        r.rot += r.vrot;
        r.life--;
        ctx.save();
        ctx.translate(r.x, r.y);
        ctx.rotate(r.rot);
        ctx.fillStyle = '#5c677d';
        ctx.fillRect(-r.size / 2, -r.size / 2, r.size, r.size);
        ctx.restore();
        if (r.life <= 0) rockDebris.splice(i, 1);
      }

      // 7. Player Reticles
      players.forEach(p => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = p.color;
        ctx.shadowColor = p.glow;
        ctx.shadowBlur = 10;
        ctx.stroke();

        // Crosshairs
        ctx.beginPath();
        ctx.moveTo(p.x - 28, p.y);
        ctx.lineTo(p.x - 12, p.y);
        ctx.moveTo(p.x + 12, p.y);
        ctx.lineTo(p.x + 28, p.y);
        ctx.moveTo(p.x, p.y - 28);
        ctx.lineTo(p.x, p.y - 12);
        ctx.moveTo(p.x, p.y + 12);
        ctx.lineTo(p.x, p.y + 28);
        ctx.stroke();

        ctx.font = "bold 11px 'Courier New', monospace";
        ctx.textAlign = 'center';
        ctx.fillStyle = p.color;
        ctx.fillText(p.name, p.x, p.y - 32);
        ctx.restore();
      });

      // 8. Diagnostic Notification Popup
      if (popup && popup.timer > 0) {
        popup.timer--;
        const alpha = Math.min(1, popup.timer / 20);
        ctx.save();
        ctx.globalAlpha = alpha;
        const boxW = Math.min(880, width - 40);
        const boxH = 75;
        const boxX = (width - boxW) / 2;
        const boxY = 70;

        ctx.fillStyle = 'rgba(4, 12, 22, 0.94)';
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.lineWidth = 2;
        ctx.strokeStyle = popup.color;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        ctx.font = "bold 18px 'Courier New', monospace";
        ctx.textAlign = 'center';
        ctx.fillStyle = popup.color;
        ctx.fillText(popup.text, width * 0.5, boxY + 28);

        if (popup.subtext) {
          ctx.font = "bold 13px 'Courier New', monospace";
          ctx.fillStyle = '#ffffff';
          ctx.fillText(popup.subtext, width * 0.5, boxY + 54);
        }
        ctx.restore();
      }

      updateControls();
      requestAnimationFrame(render);
    }

    // Initialize Game
    window.addEventListener('load', () => {
      initRound();
      requestAnimationFrame(render);
    });
  </script>
</body>
