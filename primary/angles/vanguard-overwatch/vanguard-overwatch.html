function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { mute: false, best: {} };
    const data = JSON.parse(raw);
    return { mute: !!data.mute, best: data.best || {} };
  } catch (err) {
    return { mute: false, best: {} };
  }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (err) { /* ignore quota */ }
}
function bestKey() { return game.mode + '|' + game.tier + '|' + game.players; }
function bestValue() { return store.best[bestKey()] || 0; }

function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function even(a, b) {
  let v = rnd(a, b);
  if (v % 2) v += v < b ? 1 : -1;
  return v;
}
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function fail(msg) { debugReject = msg; return null; }

function pt(x, y) { return { x: x, y: y }; }
function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
function mul(a, s) { return { x: a.x * s, y: a.y * s }; }
function len(a) { return Math.hypot(a.x, a.y); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function fromHeading(rad, r) { return { x: Math.cos(rad) * r, y: Math.sin(rad) * r }; }
function heading(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }
function signedTurn(from, to) {
  let d = to - from;
  while (d <= -Math.PI) d += Math.PI * 2;
  while (d > Math.PI) d -= Math.PI * 2;
  return d * 180 / Math.PI;
}
function angleAt(v, a, b) {
  const a1 = Math.atan2(a.y - v.y, a.x - v.x);
  const a2 = Math.atan2(b.y - v.y, b.x - v.x);
  let d = Math.abs(a2 - a1);
  if (d > Math.PI) d = Math.PI * 2 - d;
  return d * 180 / Math.PI;
}
function measure(pts, at, a, b) { return angleAt(pts[at], pts[a], pts[b]); }

function tipSquare(a, b, turn) {
  return 'Each corner of a square or rectangle is 90' + DEGS + ', not 180' + DEGS + '! Subtract from 90' + DEGS + ': 90' + DEGS + ' ' + MINUS + ' ' + a + DEGS + ' ' + MINUS + ' ' + b + DEGS + ' = ' + turn + DEGS + '!';
}
function tipRhomb(half) {
  return 'In a rhombus, all 4 sides are equal, so diagonals split the vertex angles into two equal halves (e.g., ' + half + DEGS + ' and ' + half + DEGS + ')!';
}
function pack(correct, traps) {
  const correctN = Math.round(correct);
  if (correctN < 12 || correctN > 165) return null;
  const seen = {};
  seen[correctN] = true;
  const bag = [];
  for (let i = 0; i < traps.length; i++) {
    const v = Math.round(traps[i].v);
    if (v < 12 || v > 165 || seen[v]) continue;
    seen[v] = true;
    bag.push({ v: v, tip: traps[i].tip });
    if (bag.length === 3) break;
  }
  const offsets = [8, -9, 12, -14, 17, -18, 21, -23, 26, -6, 15, -11, 29, -31];
  let k = 0;
  while (bag.length < 3 && k < offsets.length) {
    const v = correctN + offsets[k];
    k += 1;
    if (v < 12 || v > 165 || seen[v]) continue;
    seen[v] = true;
    bag.push({ v: v, tip: 'Read the intel again and rebuild the angle in one small step.' });
  }
  if (bag.length < 3) return null;
  return shuffle([{ v: correctN, tip: '' }].concat(bag));
}
function rayIntersect(p, h1, q, h2) {
  const d1x = Math.cos(h1);
  const d1y = Math.sin(h1);
  const d2x = Math.cos(h2);
  const d2y = Math.sin(h2);
  const cross = d1x * d2y - d1y * d2x;
  if (Math.abs(cross) < 1e-6) return null;
  const dx = q.x - p.x;
  const dy = q.y - p.y;
  const t = (dx * d2y - dy * d2x) / cross;
  const u = (dx * d1y - dy * d1x) / cross;
  if (t < 12 || u < 12) return null;
  return { x: p.x + d1x * t, y: p.y + d1y * t };
}
function travelToBox(origin, rad, minX, minY, maxX, maxY) {
  const dx = Math.cos(rad);
  const dy = Math.sin(rad);
  let best = Infinity;
  function consider(t) { if (t > 8 && t < best) best = t; }
  if (dx < -1e-8) consider((minX - origin.x) / dx);
  if (dx > 1e-8) consider((maxX - origin.x) / dx);
  if (dy < -1e-8) consider((minY - origin.y) / dy);
  if (dy > 1e-8) consider((maxY - origin.y) / dy);
  return best < 1e8 ? best : null;
}

function edge(a, b, tick, par) { return { a: a, b: b, tick: tick || 0, par: par || 0 }; }
function chk(at, a, b, expect) { return { at: at, a: a, b: b, expect: expect }; }

function trySplit(kind) {
  const a = rnd(15, 32);
  const b = rnd(15, 32);
  const used = a + b;
  const turn = 90 - used;
  if (used < 34 || used > 68 || turn < 18) return fail('range');
  const w = kind === 'square' ? rnd(210, 250) : rnd(230, 290);
  const h = kind === 'square' ? w : rnd(140, 180);
  if (kind === 'rect' && Math.abs(w - h) < 36) return fail('box');
  const A = pt(0, 0);
  const B = pt(w, 0);
  const C = pt(w, h);
  const D = pt(0, h);
  const hE = Math.PI - a * RAD;
  const hF = Math.PI - used * RAD;
  const tE = travelToBox(B, hE, 0, 0, w, h);
  const tF = travelToBox(B, hF, 0, 0, w, h);
  if (!tE || !tF) return fail('ray');
  const E = add(B, fromHeading(hE, tE * 0.56));
  const F = add(B, fromHeading(hF, tF * 0.78));
  if (dist(E, F) < 36 || dist(E, A) < 36 || dist(F, C) < 36 || dist(E, D) < 28 || dist(F, D) < 28) return fail('close');
  const shape = kind === 'square' ? 'square' : 'rectangle';
  const tickL = 1;
  const tickW = kind === 'square' ? 1 : 2;
  const opt1 = pack(used, [
    { v: a, tip: 'Add both given angles. Angle ABF = Angle ABE + Angle EBF = ' + a + DEGS + ' + ' + b + DEGS + ' = ' + used + DEGS + '.' },
    { v: b, tip: 'Add both given angles. Angle ABF = ' + a + DEGS + ' + ' + b + DEGS + ' = ' + used + DEGS + '.' },
    { v: 90 - a, tip: 'Keep the second given angle in the sum before you subtract from 90' + DEGS + '.' },
    { v: turn, tip: 'That remainder is the final turn. First lock the combined given angles: ' + a + DEGS + ' + ' + b + DEGS + ' = ' + used + DEGS + '.' }
  ]);
  const opt2 = pack(turn, [
    { v: 180 - used, tip: tipSquare(a, b, turn) },
    { v: 90 - a, tip: 'Subtract both given angles from 90' + DEGS + ': 90' + DEGS + ' ' + MINUS + ' ' + a + DEGS + ' ' + MINUS + ' ' + b + DEGS + ' = ' + turn + DEGS + '.' },
    { v: used, tip: 'That sum has already been used inside the corner. The turn is what remains: 90' + DEGS + ' ' + MINUS + ' ' + used + DEGS + ' = ' + turn + DEGS + '.' },
    { v: 90 - b, tip: 'Subtract both ' + a + DEGS + ' and ' + b + DEGS + ' from the 90' + DEGS + ' corner.' }
  ]);
  if (!opt1 || !opt2) return fail('pack');
  return {
    id: kind === 'square' ? 'sq' : 'rect',
    sig: (kind === 'square' ? 'sq' : 'rect') + '|' + a + '|' + b,
    lead: 'ABCD is a ' + shape + '. Angle ABE = ' + a + DEGS + ', Angle EBF = ' + b + DEGS + '.',
    pts: { A: A, B: B, C: C, D: D, E: E, F: F },
    edges: [
      edge('A', 'B', tickL, 1), edge('D', 'C', tickL, 1),
      edge('A', 'D', tickW, 2), edge('B', 'C', tickW, 2),
      edge('B', 'E', 0, 0), edge('B', 'F', 0, 0)
    ],
    rights: [ { at: 'A', a: 'B', b: 'D' }, { at: 'C', a: 'B', b: 'D' }, { at: 'D', a: 'A', b: 'C' } ],
    highlight: ['B', 'F'],
    guard: { at: 'B', face: 'C', target: 'F' },
    turn: turn,
    checks: [
      chk('B', 'A', 'E', a), chk('B', 'E', 'F', b), chk('B', 'F', 'C', turn),
      chk('B', 'A', 'F', used), chk('A', 'B', 'D', 90), chk('B', 'A', 'C', 90)
    ],
    equals: kind === 'square'
      ? [[['A', 'B'], ['B', 'C'], ['C', 'D'], ['D', 'A']]]
      : [[['A', 'B'], ['D', 'C']], [['A', 'D'], ['B', 'C']]],
    parallels: [[['A', 'B'], ['D', 'C']], [['A', 'D'], ['B', 'C']]],
    steps: [
      { name: 'Angle ABF', correct: used, options: opt1, lock: 'Intermediate locked: Angle ABF = ' + used + DEGS + '. The corner is 90' + DEGS + ', so the turn is 90' + DEGS + ' ' + MINUS + ' ' + used + DEGS + '.' },
      { name: 'Angle FBC', correct: turn, options: opt2, lock: '' }
    ]
  };
}

function tryLine() {
  const a = rnd(18, 42);
  const b = rnd(18, 42);
  const used = a + b;
  const turn = 180 - used;
  const trap90 = 90 - used;
  if (used < 40 || used > 78 || turn < 100 || turn > 150 || trap90 < 14) return fail('range');
  const B = pt(240, 0);
  const A = pt(0, 0);
  const C = pt(480, 0);
  const D = add(B, fromHeading(Math.PI - a * RAD, 190));
  const E = add(B, fromHeading(Math.PI - used * RAD, 240));
  const opt1 = pack(used, [
    { v: a, tip: 'Add both given angles. Angle ABE = ' + a + DEGS + ' + ' + b + DEGS + ' = ' + used + DEGS + '.' },
    { v: b, tip: 'Add both given angles on the straight line before you subtract from 180' + DEGS + '.' },
    { v: turn, tip: 'That is the remaining turn. First lock Angle ABE = ' + a + DEGS + ' + ' + b + DEGS + '.' },
    { v: trap90, tip: 'Angles on a straight line add to 180' + DEGS + ', not 90' + DEGS + '.' }
  ]);
  const opt2 = pack(turn, [
    { v: trap90, tip: 'Angles on a straight line add up to 180' + DEGS + ', not 90' + DEGS + '. 180' + DEGS + ' ' + MINUS + ' ' + a + DEGS + ' ' + MINUS + ' ' + b + DEGS + ' = ' + turn + DEGS + '.' },
    { v: used, tip: 'That is the other part of the straight line. The turn is 180' + DEGS + ' ' + MINUS + ' ' + used + DEGS + ' = ' + turn + DEGS + '.' },
    { v: 180 - a, tip: 'Subtract both given angles from 180' + DEGS + ', not only the first one.' },
    { v: a + 180 - used, tip: 'Use 180' + DEGS + ' ' + MINUS + ' ' + a + DEGS + ' ' + MINUS + ' ' + b + DEGS + '.' }
  ]);
  if (!opt1 || !opt2) return fail('pack');
  return {
    id: 'line',
    sig: 'line|' + a + '|' + b,
    lead: 'ABC is a straight line. Angle ABD = ' + a + DEGS + ', Angle DBE = ' + b + DEGS + '.',
    pts: { A: A, B: B, C: C, D: D, E: E },
    edges: [edge('A', 'B', 0, 0), edge('B', 'C', 0, 0), edge('B', 'D', 0, 0), edge('B', 'E', 0, 0)],
    rights: [],
    highlight: ['B', 'E'],
    guard: { at: 'B', face: 'C', target: 'E' },
    turn: turn,
    checks: [chk('B', 'A', 'D', a), chk('B', 'D', 'E', b), chk('B', 'E', 'C', turn), chk('B', 'A', 'E', used)],
    straights: [['A', 'B', 'C']],
    steps: [
      { name: 'Angle ABE', correct: used, options: opt1, lock: 'Intermediate locked: Angle ABE = ' + used + DEGS + '. A straight line is 180' + DEGS + ', so the turn is 180' + DEGS + ' ' + MINUS + ' ' + used + DEGS + '.' },
      { name: 'Angle EBC', correct: turn, options: opt2, lock: '' }
    ]
  };
}

function tryPoint() {
  const z = rnd(78, 138);
  const remain = 360 - z;
  const step1Min = Math.max(96, remain - 120);
  const step1Max = Math.min(165, remain - 40);
  if (step1Min > step1Max) return fail('range');
  const step1 = rnd(step1Min, step1Max);
  const y = remain - step1;
  const wMin = Math.max(32, step1 - 108);
  const wMax = Math.min(108, step1 - 32);
  if (wMin > wMax || y < 40 || y > 120) return fail('range');
  const w = rnd(wMin, wMax);
  const x = step1 - w;
  if (z === step1 || z === y || x < 32) return fail('range');
  const B = pt(0, 0);
  const A = fromHeading(0, 176);
  const D = fromHeading(w * RAD, 214);
  const E = fromHeading(step1 * RAD, 156);
  const C = fromHeading((step1 + y) * RAD, 198);
  const trap180 = 180 - z;
  const opt1 = pack(step1, [
    { v: w, tip: 'Add Angle ABD and Angle DBE. Angle ABE = ' + w + DEGS + ' + ' + x + DEGS + ' = ' + step1 + DEGS + '.' },
    { v: x, tip: 'Add both sectors between BA and BE: ' + w + DEGS + ' + ' + x + DEGS + ' = ' + step1 + DEGS + '.' },
    { v: y, tip: 'Angle EBC is only one sector. Angle ABE is ' + w + DEGS + ' + ' + x + DEGS + '.' },
    { v: z, tip: 'That is the final turn around the point. First add the two sectors that make Angle ABE.' }
  ]);
  const opt2 = pack(z, [
    { v: step1, tip: 'That is only part of the known angles. Angles at a point add to 360' + DEGS + '. 360' + DEGS + ' ' + MINUS + ' ' + w + DEGS + ' ' + MINUS + ' ' + x + DEGS + ' ' + MINUS + ' ' + y + DEGS + ' = ' + z + DEGS + '.' },
    { v: y, tip: 'One given sector is not the missing turn. Subtract every known angle from 360' + DEGS + '.' },
    { v: w, tip: 'Angles at a point add to 360' + DEGS + ', so subtract Angle ABD, Angle DBE and Angle EBC.' },
    { v: trap180, tip: 'A full turn around a point is 360' + DEGS + ', not 180' + DEGS + '.' }
  ]);
  if (!opt1 || !opt2) return fail('pack');
  return {
    id: 'point',
    sig: 'point|' + w + '|' + x + '|' + y,
    lead: 'Rays BA, BD, BE and BC meet at B. Angle ABD = ' + w + DEGS + ', Angle DBE = ' + x + DEGS + ', Angle EBC = ' + y + DEGS + '. Angles at a point add to 360' + DEGS + '.',
    pts: { A: A, B: B, C: C, D: D, E: E },
    edges: [edge('B', 'A', 0, 0), edge('B', 'D', 0, 0), edge('B', 'E', 0, 0), edge('B', 'C', 0, 0)],
    rights: [],
    highlight: ['B', 'E'],
    guard: { at: 'B', face: 'A', target: 'C' },
    turn: z,
    checks: [chk('B', 'A', 'D', w), chk('B', 'D', 'E', x), chk('B', 'E', 'C', y), chk('B', 'A', 'E', step1), chk('B', 'A', 'C', z)],
    steps: [
      { name: 'Angle ABE', correct: step1, options: opt1, lock: 'Intermediate locked: Angle ABE = ' + step1 + DEGS + '. Now subtract all three known angles from 360' + DEGS + '.' },
      { name: 'Angle ABC', correct: z, options: opt2, lock: '' }
    ]
  };
}

function tryEquil() {
  const abd = rnd(22, 46);
  const g = rnd(22, 40);
  const dbe = 120 - abd;
  const deb = 60 + abd - g;
  if (dbe < 70 || dbe > 100 || deb < 36 || deb > 92) return fail('range');
  const S = 220;

  }

}

  const den = len(u) * len(v);

    }

function choose(player, index) {

  if (game.mode === 'solo' && player !== 0) return;
  if (game.mode === 'duel' && game.livesP[player] <= 0) return;
  if (game.stun[player] > 0) return;
  const step = game.puzzle.steps[game.step];
  if (!step || index < 0 || index >= step.options.length) return;
  acted[player] = true;

function modeEnabled(id) {

}
function activateTitle(id) {

  if (id === 'p2') { game.players = 2; if (game.mode === 'solo') game.mode = 'coop'; }
  if (id === 'p3') { game.players = 3; if (game.mode === 'solo') game.mode = 'coop'; }
  if (id === 'P4' || id === 'P5' || id === 'P6' || id === 'EXTREME') game.tier = id;
  if (id === 'solo' && modeEnabled('solo')) game.mode = 'solo';
  if (id === 'coop' && modeEnabled('coop')) game.mode = 'coop';
  if (id === 'duel' && modeEnabled('duel')) game.mode = 'duel';

function moveFocus(dx, dy) {
  const rows = [
    ['p1', 'p2', 'p3'],
    ['P4', 'P5', 'P6', 'EXTREME'],
    ['solo', 'coop', 'duel'],
    ['go']
  ];
  let row = game.focusRow;
  let col = game.focusCol;
  row = clamp(row + dy, 0, rows.length - 1);
  const cols = rows[row];
  col = clamp(col, 0, cols.length - 1);
  col = (col + dx + cols.length) % cols.length;
  let guard = 0;
  while (!modeEnabled(cols[col]) && guard < cols.length) {
    col = (col + (dx || 1) + cols.length) % cols.length;
    guard += 1;
  }
  game.focusRow = row;
  game.focusCol = col;
}
function focusedId() {
  const rows = [
    ['p1', 'p2', 'p3'],
    ['P4', 'P5', 'P6', 'EXTREME'],
    ['solo', 'coop', 'duel'],
    ['go']

function handlePlayInput() {
  if (game.paused || game.phase !== 'ask' || !game.puzzle) return;
  if (clickEdge) {
    const mute = muteRect();
    if (hit(mute, clickEdge)) toggleMute();
    else {
      const idx = cardIndexAt(clickEdge.x, clickEdge.y);
      if (idx >= 0) {
        const who = game.mode === 'duel' ? 0 : (game.mode === 'coop' ? activeAgent() : 0);
        choose(who, idx);
      }
    }
  }
  const count = game.mode === 'solo' ? 1 : game.players;
  for (let p = 0; p < count; p++) {
    if (game.mode === 'coop' && p !== activeAgent()) continue;
    if (game.stun[p] > 0) continue;
    if (game.mode === 'duel' && game.livesP[p] <= 0) continue;
    for (let k = 0; k < 4; k++) {
      if (keyEdge.has(KEY_CODE[p][k])) choose(p, k);
    }
    const left = (p === 0 && keyEdge.has('ArrowLeft')) || (padEdge[p] && padEdge[p].left);
    const right = (p === 0 && keyEdge.has('ArrowRight')) || (padEdge[p] && padEdge[p].right);
    const fire = (p === 0 && (keyEdge.has('Space') || keyEdge.has('Enter'))) || (padEdge[p] && padEdge[p].A);
    if (left) { game.sel[p] = (game.sel[p] + 3) % 4; if (p === 0) sfx.tick(); }
    if (right) { game.sel[p] = (game.sel[p] + 1) % 4; if (p === 0) sfx.tick(); }
    if (fire) choose(p, game.sel[p]);
  }
}
function handleTitleInput() {
  if (clickEdge) {
    if (hit(muteRect(), clickEdge)) toggleMute();
    for (let i = 0; i < game.ui.length; i++) {
      const item = game.ui[i];
      if (item.enabled && hit(item, clickEdge)) {
        game.focusRow = item.row;
        game.focusCol = item.col;
        activateTitle(item.id);
        break;
      }
    }
  }
  if (keyEdge.has('ArrowLeft') || (padEdge[0] && padEdge[0].left)) moveFocus(-1, 0);
  if (keyEdge.has('ArrowRight') || (padEdge[0] && padEdge[0].right)) moveFocus(1, 0);
  if (keyEdge.has('ArrowUp') || (padEdge[0] && padEdge[0].up)) moveFocus(0, -1);
  if (keyEdge.has('ArrowDown') || (padEdge[0] && padEdge[0].down)) moveFocus(0, 1);
  if (keyEdge.has('Enter') || keyEdge.has('Space') || (padEdge[0] && padEdge[0].A)) activateTitle(focusedId());
}
function handleOverInput() {
  if (clickEdge) {
    if (hit(muteRect(), clickEdge)) toggleMute();
    for (let i = 0; i < game.ui.length; i++) {
      if (hit(game.ui[i], clickEdge)) {
        if (game.ui[i].id === 'again') startMission();
        if (game.ui[i].id === 'title') game.screen = 'title';
      }
    }
  }
  if (keyEdge.has('Enter') || (padEdge[0] && padEdge[0].A)) startMission();
  if (keyEdge.has('Escape')) game.screen = 'title';
}

function update(dt) {
  game.time += dt;
  audio.tickMusic();
  if (game.hidden) return;
  if (game.screen === 'title') {
    handleTitleInput();
    return;
  }
  if (game.screen === 'over') {
    handleOverInput();
    updateFx(dt);
    return;
  }
  for (let i = 0; i < 3; i++) game.stun[i] = Math.max(0, game.stun[i] - dt);
  if (keyEdge.has('Escape')) game.paused = !game.paused;
  if (game.paused) return;
  game.phaseAge += dt;
  if (game.phase === 'ask') game.roundTime += dt;
  game.shake = Math.max(0, game.shake - dt * 2.4);
  game.flash = Math.max(0, game.flash - dt);
  if (game.tier === 'EXTREME' && game.phase === 'ask' && game.puzzle && game.roundTime >= 22) onTimeout();
  if (game.endIn > 0) {
    game.endIn -= dt;
    if (game.endIn <= 0) endGame();
  }
  handlePlayInput();
  if (game.phase === 'celebrate1' && game.phaseAge > 0.48) {
    game.step = 1;
    game.mark = null;
    game.sel = [0, 0, 0];
    setPhase('ask');
  } else if (game.phase === 'sweep') {
    const u = clamp(game.phaseAge / 0.68, 0, 1);
    const e = u * u * (3 - 2 * u);
    game.aim = game.sweepFrom + game.sweepSigned * e;
    if (game.phaseAge > 0.68) { sfx.pew(); setPhase('shot'); }
  } else if (game.phase === 'shot') {
    game.aim = game.sweepFrom + game.sweepSigned;
    if (game.phaseAge > 0.52) finishShot();
  } else if (game.phase === 'miss') {
    const u = clamp(game.phaseAge / 0.48, 0, 1);
    const e = u * u * (3 - 2 * u);
    game.aim = game.sweepFrom + game.sweepSigned * e;
    game.dash = clamp((game.phaseAge - 0.32) / 0.4, 0, 1);
    if (game.phaseAge > 1.08) finishMiss();
  } else if (game.phase === 'escape') {
    game.dash = clamp(game.phaseAge / 0.45, 0, 1);
    if (game.phaseAge > 1.12) finishMiss();
  } else if (game.phase === 'ask' && game.puzzle) {
    game.aim = heading(guardPoint(), facePoint());
    game.dash = 0;
  }
  updateFx(dt);
}
function updateFx(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.98;
    p.vy *= 0.98;
    if (p.age >= p.life) game.particles.splice(i, 1);
  }
  for (let i = game.floats.length - 1; i >= 0; i--) {
    const f = game.floats[i];
    f.age += dt;
    f.y -= 28 * dt;
    if (f.age >= f.life) game.floats.splice(i, 1);
  }
}

function frame(now) {
  if (!frame.last) frame.last = now;
  const dt = Math.min(0.05, (now - frame.last) / 1000);
  frame.last = now;
  acted = [false, false, false];
  pollPads();
  update(game.hidden ? 0 : dt);
  draw();
  keyEdge.clear();
  clickEdge = null;
  requestAnimationFrame(frame);
}

function pollPads() {
  const list = (navigator.getGamepads && navigator.getGamepads()) || [];
  for (let i = 0; i < 3; i++) {
    const p = list[i];
    padEdge[i] = null;
    if (!p) { padPrev[i] = {}; continue; }
    const b = p.buttons || [];
    const ax = p.axes || [];
    const pressed = function (idx) { return !!(b[idx] && (b[idx].pressed || b[idx].value > 0.5)); };
    const now = {
      left: pressed(14) || (ax[0] || 0) < -0.55,
      right: pressed(15) || (ax[0] || 0) > 0.55,
      up: pressed(12) || (ax[1] || 0) < -0.55,
      down: pressed(13) || (ax[1] || 0) > 0.55,
      A: pressed(0)
    };
    const prev = padPrev[i] || {};
    padEdge[i] = {
      left: now.left && !prev.left,
      right: now.right && !prev.right,
      up: now.up && !prev.up,
      down: now.down && !prev.down,
      A: now.A && !prev.A
    };
    if (now.A || now.left || now.right || now.up || now.down) sfx.unlock();
    padPrev[i] = now;
  }
}

    if (note) {
      const vol = game.screen === 'play' && !game.paused ? note[2] : note[2] * 0.45;
      this.tone(note[0], note[3], note[1], vol, this.nextAt - this.ctx.currentTime);
    }
    this.nextAt += 0.17;
    this.step = (this.step + 1) % pattern.length;
  }
};

const sfx = {
  unlock: function () { audio.resume(); },
  tick: function () { audio.tone(720, 0.04, 'square', 0.03); },
  ping: function () { audio.tone(880, 0.07, 'sine', 0.04); audio.tone(1320, 0.06, 'triangle', 0.03, 0.05); },
  snap: function () { audio.tone(520, 0.07, 'square', 0.05); audio.tone(780, 0.09, 'triangle', 0.04, 0.05); },
  servo: function () { audio.sweep(180, 720, 0.42, 0.045); },
  pew: function () {
    audio.burst(0.12, 0.07, 1600);
    audio.tone(920, 0.07, 'square', 0.05);
    audio.tone(1380, 0.08, 'triangle', 0.04, 0.03);
  },
  confirm: function () { audio.tone(659, 0.08, 'square', 0.04); audio.tone(880, 0.1, 'triangle', 0.035, 0.07); },
  buzz: function () { audio.tone(90, 0.16, 'sawtooth', 0.05); audio.tone(70, 0.18, 'square', 0.035, 0.02); },
  crack: function () { audio.burst(0.16, 0.07, 280); audio.tone(140, 0.12, 'square', 0.04); },
  fanfare: function () {
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      audio.tone(f, 0.2, 'square', 0.045, i * 0.09);
      audio.tone(f * 0.5, 0.2, 'triangle', 0.03, i * 0.09);
    });
  }
};
function toggleMute() {
  sfx.unlock();
  audio.muted = !audio.muted;
  store.mute = audio.muted;
  if (audio.master) audio.master.gain.value = audio.muted ? 0 : 0.2;
  saveStore();
}
audio.ensure = function () {
  if (this.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  this.ctx = new AC();
  this.master = this.ctx.createGain();
  this.master.gain.value = this.muted ? 0 : 0.2;
  this.master.connect(this.ctx.destination);
  const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  this.noise = buffer;
};
audio.resume = function () {
  this.ensure();
  if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
};
audio.tone = function (freq, dur, type, vol, delay) {
  if (!this.ctx || this.muted || !freq) return;
  const t = this.ctx.currentTime + (delay || 0);
  const o = this.ctx.createOscillator();
  const g = this.ctx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(this.master);
  o.start(t);
  o.stop(t + dur + 0.02);
};
audio.sweep = function (a, b, dur, vol) {
  if (!this.ctx || this.muted) return;
  const t = this.ctx.currentTime;
  const o = this.ctx.createOscillator();
  const g = this.ctx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(a, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40, b), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(this.master);
  o.start(t);
  o.stop(t + dur + 0.02);
};
audio.burst = function (dur, vol, freq) {
  if (!this.ctx || this.muted || !this.noise) return;
  const src = this.ctx.createBufferSource();
  src.buffer = this.noise;
  const filter = this.ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = freq || 1200;
  const g = this.ctx.createGain();
  const t = this.ctx.currentTime;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter);
  filter.connect(g);
  g.connect(this.master);
  src.start(t);
  src.stop(t + dur);
};

window.addEventListener('resize', resize);
window.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  keysDown.add(e.code);
  keyEdge.add(e.code);
  const named = {
    '1': 'Digit1', '2': 'Digit2', '3': 'Digit3', '4': 'Digit4',
    q: 'KeyQ', w: 'KeyW', e: 'KeyE', r: 'KeyR',
    u: 'KeyU', i: 'KeyI', o: 'KeyO', p: 'KeyP',
    Q: 'KeyQ', W: 'KeyW', E: 'KeyE', R: 'KeyR',
    U: 'KeyU', I: 'KeyI', O: 'KeyO', P: 'KeyP'
  };
  if (named[e.key]) keyEdge.add(named[e.key]);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].indexOf(e.code) >= 0) e.preventDefault();
  sfx.unlock();
  if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', function (e) { keysDown.delete(e.code); });
canvas.addEventListener('pointerdown', function (e) {
  const p = toWorld(e.clientX, e.clientY);
  pointer.x = p.x;
  pointer.y = p.y;
  pointer.inside = true;
  clickEdge = { x: p.x, y: p.y };
  sfx.unlock();
});
canvas.addEventListener('pointermove', function (e) {
  const p = toWorld(e.clientX, e.clientY);
  pointer.x = p.x;
  pointer.y = p.y;
  pointer.inside = true;
});
canvas.addEventListener('pointerleave', function () { pointer.inside = false; });
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('visibilitychange', function () { game.hidden = document.hidden; });

function runAudit() {
  const lines = [];
  for (let f = 0; f < FAMILIES.length; f++) {
    const fam = FAMILIES[f];
    const reasons = {};
    let ok = 0;
    for (let i = 0; i < 30; i++) {
      debugReject = '';
      const raw = fam.make();
      if (!raw) {
        const key = debugReject || 'null';
        reasons[key] = (reasons[key] || 0) + 1;
        continue;
      }
      const done = realize(raw, true);
      if (done) ok += 1;
      else {
        const key = debugReject || 'realize';
        reasons[key] = (reasons[key] || 0) + 1;
      }
    }
    const bits = [];
    const keys = Object.keys(reasons);
    for (let k = 0; k < keys.length; k++) bits.push(keys[k] + ':' + reasons[keys[k]]);
    lines.push(fam.id + ' ok=' + ok + '/30  ' + bits.join(', '));
  }
  return lines.join('\n');
}

resize();
requestAnimationFrame(frame);
if (location.search.indexOf('audit=1') >= 0) {
  const report = runAudit();
  const box = document.getElementById('audit');
  box.className = '';
  box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:5;color:#b8ffe0;background:#071018;padding:8px;font:12px monospace;white-space:pre;max-width:90vw;';
  box.textContent = report;
  console.log(report);
}
