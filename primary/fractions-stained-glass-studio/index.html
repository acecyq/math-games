      const swap = bag.pop();
      bag.unshift(swap);

  return bag.pop();
}

  if (whole > 0 && rem > 0) return whole + " and " + rem + " over " + sd;
  if (whole > 0) return String(whole);

}
function lengthTokens(n, d) {
  const [sn, sd] = simplify(n, d);

}

  g.gain.exponentialRampToValueAtTime(gain, when + Math.min(0.02, dur * 0.3));

function glassChoices(g) {
  const correct = { n: g.simple[0], d: g.simple[1], correct: true, shake: 0, dead: false };
  const traps = [];
  const seen = new Set([correct.n + "/" + correct.d]);

    if (n <= 0 || d <= 0) return;
    const key = n + "/" + d;
    if (seen.has(key)) return;
    if (Math.abs(n / d - correct.n / correct.d) < 1e-8) return;
    seen.add(key);

  add(g.a[0] + g.b[0], g.a[1] + g.b[1]);
  add(g.prodD, g.prodN);
  add(g.simple[0] + 1, g.simple[1]);
  add(Math.max(1, g.simple[0] - 1), g.simple[1]);
  add(g.a[0], g.b[1]);
  add(g.b[0], g.a[1]);
  add(g.prodN + 1, g.prodD);
  let extra = 1;
  while (traps.length < 4 && extra < 12) {
    add(g.simple[0] + extra + 1, g.simple[1] + extra);
    extra++;
  }

}
function ribbonChoices(r) {

    if (items.some((o) => Math.abs(o.v - v) < 1e-8)) return;
    items.push(Object.assign({ v, shake: 0, dead: false, correct: Math.abs(v - r.q) < 1e-8 }, item));
  }
  add({ int: r.q });

  if (flippedMiss[1] === 1) add({ int: flippedMiss[0] }); else add({ n: flippedMiss[0], d: flippedMiss[1] });

  if (onlyDen[1] === 1) add({ int: onlyDen[0] }); else add({ n: onlyDen[0], d: onlyDen[1] });
  add({ int: r.divs[1] });
  add({ int: r.q + 1 });
  if (r.q > 1) add({ int: r.q - 1 });
  if (r.divd[0] % r.divd[1] === 0) add({ int: r.divd[0] / r.divd[1] });
  else add({ n: simplify(r.divd[0], r.divd[1])[0], d: simplify(r.divd[0], r.divd[1])[1] });

  while (items.filter((it) => !it.correct).length < 3 && k < 10) {

    k++;

  const correct = items.find((it) => it.correct);
  const traps = shuffle(items.filter((it) => !it.correct)).slice(0, 3);
  return shuffle([correct].concat(traps));
}

    if (anyAction()) { paused = false; syncMute(); }

function glassTokens() {

function ribbonTokens() {

function selfCheck() {
  const bad = [];
  GLASS_BANK.forEach((pair) => {
    const g = prepGlass(pair);
    if (g.a[0] >= g.a[1] || g.b[0] >= g.b[1] || g.prodN >= g.prodD) bad.push("glass");
    if (g.simple[0] * g.g !== g.prodN || g.simple[1] * g.g !== g.prodD) bad.push("simplify");
  });
  RIBBON_BANK.forEach((item) => {
    const r = prepRibbon(item);
    if (r.piece * r.q !== r.total || r.q < 2 || r.q > 12) bad.push("ribbon " + r.q);
  });
  if (bad.length) console.warn("Fraction Artisan checks:", bad);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
function boot() {
  syncMute();
  selfCheck();
  resize();
  for (let i = 0; i < 8; i++) {
    ambient.push({
      x: Math.random() * W, y: Math.random() * H, vy: 18 + Math.random() * 20,
      vx: 12, rot: Math.random() * 6, s: 3 + Math.random() * 3, color: GLASS_DUST[i % GLASS_DUST.length]
    });
  }
  setSR("Glass Studio Rush. Two players. Ninety seconds. Highest score wins. Player 1 uses arrows and space. Player 2 uses W A S D and F.");
  canvas.focus({ preventScroll: true });
  requestAnimationFrame(frame);
}
boot();
</script>
