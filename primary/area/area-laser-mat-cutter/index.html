<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laser Mat Cutter: Frame &amp; Garden Studio</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #12100e;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    outline: none;
  }
  #mute {
    position: fixed;
    right: 12px;
    bottom: 10px;
    z-index: 3;
    border: 2px solid #d7b15a;
    background: #241c14;
    color: #ffe7ad;
    font: 700 13px "Avenir Next", "Trebuchet MS", Helvetica, Arial, sans-serif;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
  }
  #mute:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }
  noscript p {
    color: #ffe7ad;
    font-family: "Trebuchet MS", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0" role="application" aria-label="Laser Mat Cutter, Frame and Garden Studio. Find the area of a border by subtracting the inner rectangle from the outer rectangle. Up to three players. Player 1 uses arrow keys and space. Player 2 uses W A S D and F. Player 3 uses I J K L and H. Gamepads use the stick or D-pad and the A button."></canvas>
<button id="mute" type="button" aria-pressed="false">Sound on</button>
<div id="sr" class="sr" aria-live="polite"></div>
<noscript><p>This workshop runs in JavaScript. Enable JavaScript to cut mats and find border areas.</p></noscript>
<script>
'use strict';

/**
 * Laser Mat Cutter — Frame & Garden Studio
 * Primary 4/5 border area.
 * Frame: outer length = inner + border + border (both sides).
 *        Border area = outer rectangle − inner rectangle.
 * Garden: total = flower area + uncovered area, side × side = total,
 *         edging = outer perimeter + inner perimeter.
 * Traps: border × border, and adding the border on only one side.
 */

var STORE = 'laser-mat-cutter-v1';
var STOP_MSG = 'Stop! You cannot multiply border widths directly. Calculate the Big Rectangle, then subtract the Small Rectangle!';

var CREW = [
  { name: 'Red Artisan', short: 'P1', color: '#ff4d4d', ink: '#3a1010', help: 'Arrows + Space' },
  { name: 'Blue Artisan', short: 'P2', color: '#3c8dff', ink: '#0d2244', help: 'W A S D + F' },
  { name: 'Yellow Artisan', short: 'P3', color: '#ffd23f', ink: '#332800', help: 'I J K L + H' }
];

var MOVE = [
  ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'],
  ['a', 'd', 'w', 's'],
  ['j', 'l', 'i', 'k']
];
var FIRE = ['Space', 'f', 'h'];

var canvas, ctx, muteBtn, sr;
var view = { w: 1280, h: 800 };
var keys = new Set();
var prevKeys = new Set();
var justDown = new Set();
var padState = [
  { x: 0, y: 0, a: false, start: false },
  { x: 0, y: 0, a: false, start: false },
  { x: 0, y: 0, a: false, start: false }
];
var padEdge = [
  { x: 0, y: 0, a: false, start: false },
  { x: 0, y: 0, a: false, start: false },
  { x: 0, y: 0, a: false, start: false }
];
var players = [0, 1, 2].map(function (id) {
  return {
    id: id,
    joined: false,
    x: 180 + id * 90,
    y: 220,
    batteries: 3,
    stars: 0,
    card: -1,
    beam: null
  };
});
var pointer = { x: 0, y: 0, moved: false, inside: false };
var geom = null;
var G = {
  mode: 'title',
  phase: 'choose',
  orders: [],
  orderIndex: 0,
  stepIndex: 0,
  revenue: 0,
  best: 0,
  solved: 0,
  result: '',
  anim: null,
  popup: null,
  particles: [],
  floaters: [],
  shake: 0,
  formulaPulse: 0,
  stepTime: 0,
  needsPlace: false,
  visuals: { cut: 0, lift: 0, march: 0, fuse: 0 },
  t: 0,
  live: '',
  paused: false,
  note: '',
  noteT: 0,
  sparkAcc: 0,
  revenuePop: 0,
  error: '',
  fatal: ''
};

var audio = {
  ac: null,
  master: null,
  music: null,
  sfx: null,
  noise: null,
  muted: false,
  next: 0,
  step: 0,
  timer: null
};

var MELODY = [74, 71, 69, 71, 66, 69, 62, 66, 74, 71, 74, 78, 74, 71, 69, 66];
var BASS = [38, 38, 45, 38, 43, 43, 38, 45];

function midi(n) {
  return 440 * Math.pow(2, (n - 69) / 12);
}

function font(px, weight) {
  return (weight || 700) + ' ' + Math.round(px) + 'px "Avenir Next", "Trebuchet MS", Helvetica, Arial, sans-serif';
}

function fmt(n) {
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function loadStore() {
  try {
    if (typeof localStorage === 'undefined') return;
    var raw = localStorage.getItem(STORE);
    if (!raw) return;
    var data = JSON.parse(raw);
    if (data && typeof data.best === 'number') G.best = data.best;
    if (data && data.mute) audio.muted = true;
  } catch (err) { /* private mode */ }
}

function saveStore() {
  try {
    if (typeof localStorage === 'undefined') return;
    localStorage.setItem(STORE, JSON.stringify({ best: G.best, mute: audio.muted }));
  } catch (err) { /* private mode */ }
}

function shuffle(list) {
  for (var i = list.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = list[i];
    list[i] = list[j];
    list[j] = tmp;
  }
  return list;
}

function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeBlooms(seed) {
  var rnd = mulberry32(seed);
  var colors = ['#ff5d8f', '#ffd23f', '#c084fc', '#fff6fb', '#ff8a3d', '#7af0c6'];
  var blooms = [];
  for (var i = 0; i < 7; i++) {
    blooms.push({
      nx: 0.16 + rnd() * 0.68,
      ny: 0.16 + rnd() * 0.55,
      s: 0.15 + rnd() * 0.07,
      color: colors[i % colors.length]
    });
  }
  return blooms;
}

function choice(line1, line2, correct, feedback, trap) {
  return { line1: line1, line2: line2, correct: !!correct, feedback: feedback || '', trap: trap || '', dead: false };
}

function assertStep(step, label) {
  var faces = step.options.map(function (o) { return o.line1 + '|' + o.line2; });
  if (new Set(faces).size !== faces.length) {
    throw new Error('Duplicate card in ' + label + ': ' + faces.join(' / '));
  }
  var correct = step.options.filter(function (o) { return o.correct; });
  if (correct.length !== 1) throw new Error('Need one correct card in ' + label);
}

function frameOrder(spec) {
  var L = spec.L;
  var B = spec.B;
  var w = spec.w;
  var oL = L + 2 * w;
  var oB = B + 2 * w;
  var onceL = L + w;
  var onceB = B + w;
  var inner = L * B;
  var outer = oL * oB;
  var once = onceL * onceB;
  var border = outer - inner;
  var forgot = 2 * w * (L + B);
  var ww = w * w;
  var peri = 2 * (L + B);
  var single = once - inner;
  var both = L + ' + ' + w + ' + ' + w + ' = ' + oL;
  var bothB = B + ' + ' + w + ' + ' + w + ' = ' + oB;

  var step0 = {
    prompt: 'What is the OUTER area of the whole frame?',
    hint: spec.hint0 || 'Add the border twice: left and right, top and bottom.',
    pending: 'Outer area',
    reveal: both + ' cm,  ' + bothB + ' cm.  Outer area ' + fmt(outer) + ' cm².',
    options: [
      choice(oL + ' × ' + oB, fmt(outer) + ' cm²', true),
      choice(onceL + ' × ' + onceB, fmt(once) + ' cm²', false,
        'The border sits on both sides. ' + L + ' + ' + w + ' is only one side. Add ' + w + ' again: ' + both + '.'),
      choice(L + ' × ' + B, fmt(inner) + ' cm²', false,
        'That is the picture, ' + L + ' cm by ' + B + ' cm. The outside of the frame is bigger.'),
      choice(w + ' × ' + w, fmt(ww) + ' cm²', false, STOP_MSG, 'width')
    ]
  };
  var step1 = {
    prompt: 'What is the area of the INNER picture?',
    hint: spec.hint1 || 'Use only the inside length and breadth. Length × breadth.',
    pending: 'Inner area',
    reveal: 'Inner area ' + L + ' × ' + B + ' = ' + fmt(inner) + ' cm².',
    options: [
      choice(L + ' × ' + B, fmt(inner) + ' cm²', true),
      choice(oL + ' × ' + oB, fmt(outer) + ' cm²', false,
        'That is the whole frame, border included. The picture is only ' + L + ' × ' + B + '.'),
      choice(onceL + ' × ' + onceB, fmt(once) + ' cm²', false,
        'Those sides still include a border. The picture measures ' + L + ' cm by ' + B + ' cm.'),
      choice('2 × (' + L + ' + ' + B + ')', peri + ' cm', false,
        peri + ' cm is the distance around the picture. Area is length × breadth, and the unit is cm².')
    ]
  };
  var step2 = {
    prompt: 'Border area = outer area − inner area. What is it?',
    hint: spec.hint2 || 'Big rectangle minus small rectangle. Do not multiply the border by itself.',
    pending: 'Border area',
    reveal: 'Border ' + fmt(outer) + ' − ' + fmt(inner) + ' = ' + fmt(border) + ' cm².',
    options: [
      choice(fmt(outer) + ' − ' + fmt(inner), fmt(border) + ' cm²', true),
      choice('2 × ' + w + ' × (' + L + ' + ' + B + ')', fmt(forgot) + ' cm²', false,
        'That misses the four corner squares. Do not build the border from strips. Subtract the inner area from the outer area.'),
      choice(fmt(once) + ' − ' + fmt(inner), fmt(single) + ' cm²', false,
        'That starts from the rectangle where the border was added only once. The real outer area is ' + fmt(outer) + ' cm².'),
      choice(w + ' × ' + w, fmt(ww) + ' cm²', false, STOP_MSG, 'width')
    ]
  };
  [step0, step1, step2].forEach(function (step, i) {
    assertStep(step, spec.id + ' step ' + (i + 1));
  });
  return {
    id: spec.id,
    kind: 'frame',
    client: spec.client,
    title: spec.title,
    coach: !!spec.coach,
    given: 'Picture ' + L + ' cm by ' + B + ' cm. Border ' + w + ' cm on every side.',
    L: L,
    B: B,
    w: w,
    oL: oL,
    oB: oB,
    innerArea: inner,
    outerArea: outer,
    borderArea: border,
    blooms: null,
    lift: true,
    art: 'photo',
    stamp: 'DELIVERED',
    bay: 'CUT-OUT BAY',
    bayDone: 'INNER CUT',
    pieceLabel: L + ' × ' + B,
    rail: ['Caliper', 'Inner area', 'Subtract'],
    steps: [step0, step1, step2]
  };
}

function gardenOrder(spec) {
  var s = spec.flower;
  var U = spec.uncovered;
  var inner = s * s;
  var total = inner + U;
  var S = Math.round(Math.sqrt(total));
  if (S * S !== total) throw new Error(spec.id + ' total is not a square');
  if ((S - s) % 2 !== 0 || S <= s) throw new Error(spec.id + ' needs an even border');
  var peri = 4 * (S + s);
  var outerP = 4 * S;
  var innerP = 4 * s;
  var diff = U - inner;
  var prod = inner * U;
  var lo = S - 1;
  var hi = S + 1;

  var step0 = {
    prompt: 'What is the TOTAL area of square garden PQRS?',
    hint: spec.hint0 || 'Add the flower-bed area and the uncovered path.',
    pending: 'Total area',
    reveal: 'Total area ' + inner + ' + ' + U + ' = ' + total + ' cm².',
    options: [
      choice(inner + ' + ' + U, total + ' cm²', true),
      choice(U + ' − ' + inner, diff + ' cm²', false,
        'The uncovered path is only part of the garden. Add the flower bed: ' + inner + ' + ' + U + '.'),
      choice(inner + ' × ' + U, fmt(prod) + ' cm²', false,
        'Stop! Do not multiply the two areas. Add them: flower bed + uncovered path.', 'multiply'),
      choice(U + ' only', U + ' cm²', false,
        U + ' cm² is only the path. The whole square also includes the ' + inner + ' cm² flower bed.')
    ]
  };
  var step1 = {
    prompt: 'PQRS is a square. What is the length of one side?',
    hint: spec.hint1 || 'Find the number that multiplies by itself to make ' + total + '.',
    pending: 'Side of PQRS',
    reveal: 'Side ' + S + ' cm, because ' + S + ' × ' + S + ' = ' + total + '.',
    options: [
      choice(S + ' × ' + S + ' = ' + total, S + ' cm', true),
      choice(lo + ' × ' + lo + ' = ' + (lo * lo), lo + ' cm', false,
        lo + ' × ' + lo + ' = ' + (lo * lo) + ', not ' + total + '. Which number × itself equals ' + total + '?'),
      choice(hi + ' × ' + hi + ' = ' + (hi * hi), hi + ' cm', false,
        hi + ' × ' + hi + ' = ' + (hi * hi) + ', not ' + total + '. Which number × itself equals ' + total + '?'),
      choice(total + ' cm²', 'an area, not a side', false,
        total + ' is the area in cm². The side is the number that multiplies by itself to make ' + total + '.')
    ]
  };
  var periHint = peri === U
    ? 'Careful: the path area is also ' + U + ' cm². Edging is a length. Add the outside and inside perimeters.'
    : 'Add the outside perimeter and the flower-bed perimeter.';
  var step2 = {
    prompt: 'How long is the edging around the outside AND the flower bed?',
    hint: spec.hint2 || periHint,
    pending: 'Edging length',
    reveal: 'Edging 4 × ' + S + ' + 4 × ' + s + ' = ' + peri + ' cm.' + (peri === U ? ' Same number as the path area, different unit.' : ''),
    options: [
      choice('4 × ' + S + ' + 4 × ' + s, peri + ' cm', true),
      choice('4 × ' + S, outerP + ' cm', false,
        'The flower bed needs edging too. Add the inner perimeter: 4 × ' + S + ' + 4 × ' + s + '.'),
      choice('4 × ' + s, innerP + ' cm', false,
        'The outside of PQRS needs edging too. Add both perimeters.'),
      choice(S + ' × ' + S, total + ' cm²', false,
        total + ' cm² is an area. Edging is a length in cm, around the outside and around the flower bed.')
    ]
  };
  [step0, step1, step2].forEach(function (step, i) {
    assertStep(step, spec.id + ' step ' + (i + 1));
  });
  return {
    id: spec.id,
    kind: 'garden',
    client: spec.client,
    title: spec.title,
    coach: !!spec.coach,
    given: 'Flower bed ' + s + ' cm × ' + s + ' cm = ' + inner + ' cm². Uncovered path ' + U + ' cm².',
    flower: s,
    uncovered: U,
    flowerArea: inner,
    total: total,
    S: S,
    peri: peri,
    blooms: makeBlooms(spec.seed || (s * 50 + U)),
    lift: false,
    art: 'flowers',
    stamp: 'EDGED',
    rail: ['Add areas', 'Find side', 'Edging'],
    steps: [step0, step1, step2]
  };
}

function offsetOrder(spec) {
  var L = spec.L;
  var B = spec.B;
  var cL = spec.cutL;
  var cB = spec.cutB;
  var gapL = spec.gapL;
  var gapT = spec.gapT;
  var gapR = L - gapL - cL;
  var gapB = B - gapT - cB;
  if (gapR <= 0 || gapB <= 0) throw new Error(spec.id + ' window does not fit');
  if (gapL === gapR && gapT === gapB) throw new Error(spec.id + ' window is centred');
  var whole = L * B;
  var win = cL * cB;
  var near = gapL * gapT;
  var wrong = (gapL + cL) * (gapT + cB);
  var left = whole - win;
  var step0 = {
    prompt: 'The window is not in the middle. What is the area of the WHOLE mat?',
    hint: spec.hint0 || 'Use the outside length and breadth. Where the window sits does not change the mat.',
    pending: 'Whole mat',
    reveal: 'Whole mat ' + L + ' × ' + B + ' = ' + whole + ' cm².',
    options: [
      choice(L + ' × ' + B, whole + ' cm²', true),
      choice(cL + ' × ' + cB, win + ' cm²', false,
        win + ' cm² is the window. The whole mat is ' + L + ' cm by ' + B + ' cm.'),
      choice(gapL + ' × ' + gapT, near + ' cm²', false,
        gapL + ' cm and ' + gapT + ' cm are gaps beside the window, not the sides of the mat.'),
      choice('(' + gapL + ' + ' + cL + ') × (' + gapT + ' + ' + cB + ')', wrong + ' cm²', false,
        'That rectangle only reaches across the window from the near corner. The mat is the full ' + L + ' cm by ' + B + ' cm.')
    ]
  };
  var step1 = {
    prompt: 'What is the area of the window itself?',
    hint: spec.hint1 || 'The window is ' + cL + ' cm by ' + cB + ' cm. The gaps are not its sides.',
    pending: 'Window area',
    reveal: 'Window ' + cL + ' × ' + cB + ' = ' + win + ' cm².',
    options: [
      choice(cL + ' × ' + cB, win + ' cm²', true),
      choice(L + ' × ' + B, whole + ' cm²', false,
        'That is the whole mat. The window itself is ' + cL + ' cm by ' + cB + ' cm.'),
      choice(gapL + ' × ' + gapT, near + ' cm²', false,
        'Those are the gaps. The window measures ' + cL + ' cm by ' + cB + ' cm.'),
      choice('(' + gapL + ' + ' + cL + ') × (' + gapT + ' + ' + cB + ')', wrong + ' cm²', false,
        'Do not build the window from the gaps. It is already ' + cL + ' cm by ' + cB + ' cm.')
    ]
  };
  var step2 = {
    prompt: 'Area of mat left behind = whole mat − window. What is it?',
    hint: spec.hint2 || 'Being off-centre does not change the subtraction. Whole mat minus window.',
    pending: 'Mat left',
    reveal: 'Mat left ' + whole + ' − ' + win + ' = ' + left + ' cm².',
    options: [
      choice(whole + ' − ' + win, left + ' cm²', true),
      choice(whole + ' − ' + near, (whole - near) + ' cm²', false,
        near + ' cm² is not the window. Subtract the window area, ' + win + ' cm².'),
      choice(whole + ' − ' + wrong, (whole - wrong) + ' cm²', false,
        wrong + ' cm² was the wrong rectangle. The window is ' + win + ' cm².'),
      choice(whole + ' + ' + win, (whole + win) + ' cm²', false,
        'The window is cut out, so subtract it. Do not add it.')
    ]
  };
  [step0, step1, step2].forEach(function (step, i) {
    assertStep(step, spec.id + ' step ' + (i + 1));
  });
  return {
    id: spec.id,
    kind: 'offset',
    client: spec.client,
    title: spec.title,
    coach: !!spec.coach,
    given: 'Mat ' + L + ' cm by ' + B + ' cm. Window ' + cL + ' cm by ' + cB + ' cm, ' + gapL + ' cm from the left and ' + gapT + ' cm from the top.',
    oL: L,
    oB: B,
    cutW: cL,
    cutH: cB,
    gapL: gapL,
    gapT: gapT,
    gapR: gapR,
    gapB: gapB,
    anchor: 'inset',
    lift: true,
    art: 'photo',
    stamp: 'DELIVERED',
    bay: 'WINDOW',
    bayDone: 'WINDOW OUT',
    pieceLabel: cL + ' × ' + cB,
    note: 'Off-centre. Area still uses the full outside.',
    formulas: [
      { k: 'WHOLE MAT', v: 'Length  ×  Breadth' },
      { k: 'WINDOW', v: 'Window length  ×  breadth' },
      { k: 'MAT LEFT', v: 'Whole mat  −  Window' }
    ],
    rail: ['Whole mat', 'Window', 'Subtract'],
    steps: [step0, step1, step2]
  };
}

function elbowOrder(spec) {
  var L = spec.L;
  var B = spec.B;
  var w = spec.w;
  var oL = L + w;
  var oB = B + w;
  var twiceL = L + 2 * w;
  var twiceB = B + 2 * w;
  var garden = L * B;
  var outer = oL * oB;
  var twice = twiceL * twiceB;
  var path = outer - garden;
  var forgot = w * (L + B);
  var ww = w * w;
  var peri = 2 * (L + B);
  var step0 = {
    prompt: 'The path is only on TWO sides. What is the outer area?',
    hint: spec.hint0 || 'Add ' + w + ' cm once to the length and once to the breadth. This is not a border all the way around.',
    pending: 'Outer area',
    reveal: 'Outer area (' + L + ' + ' + w + ') × (' + B + ' + ' + w + ') = ' + outer + ' cm².',
    options: [
      choice('(' + L + ' + ' + w + ') × (' + B + ' + ' + w + ')', outer + ' cm²', true),
      choice('(' + L + ' + ' + (2 * w) + ') × (' + B + ' + ' + (2 * w) + ')', twice + ' cm²', false,
        'The path is only on two sides. Add ' + w + ' cm once, not twice. ' + L + ' + ' + w + ' and ' + B + ' + ' + w + '.'),
      choice(L + ' × ' + B, garden + ' cm²', false,
        'That is the garden bed alone. The outside includes the path: ' + oL + ' cm by ' + oB + ' cm.'),
      choice(w + ' × ' + w, ww + ' cm²', false,
        'Stop! The path is an L, not a ' + w + ' cm square. Find the outer rectangle, then subtract the garden.', 'width')
    ]
  };
  var step1 = {
    prompt: 'What is the area of the garden bed?',
    hint: spec.hint1 || 'The bed itself is ' + L + ' cm by ' + B + ' cm. The path is outside it.',
    pending: 'Garden area',
    reveal: 'Garden ' + L + ' × ' + B + ' = ' + garden + ' cm².',
    options: [
      choice(L + ' × ' + B, garden + ' cm²', true),
      choice(oL + ' × ' + oB, outer + ' cm²', false,
        'That includes the path. The garden bed is ' + L + ' cm by ' + B + ' cm.'),
      choice(twiceL + ' × ' + twiceB, twice + ' cm²', false,
        twiceL + ' by ' + twiceB + ' would be a border all the way around. The garden is ' + L + ' cm by ' + B + ' cm.'),
      choice('2 × (' + L + ' + ' + B + ')', peri + ' cm', false,
        peri + ' cm is the distance around the garden. Area is length × breadth, in cm².')
    ]
  };
  var step2 = {
    prompt: 'Path area = outer area − garden area. What is it?',
    hint: spec.hint2 || 'The path is an L along two sides. Subtract. Do not use the all-around frame.',
    pending: 'Path area',
    reveal: 'Path ' + outer + ' − ' + garden + ' = ' + path + ' cm².',
    options: [
      choice(outer + ' − ' + garden, path + ' cm²', true),
      choice(w + ' × (' + L + ' + ' + B + ')', forgot + ' cm²', false,
        'That L misses the corner square where the two strips meet. Subtract: ' + outer + ' − ' + garden + '.'),
      choice(twice + ' − ' + garden, (twice - garden) + ' cm²', false,
        twice + ' cm² added the path twice, as if it went all the way around. The outer area is ' + outer + ' cm².'),

function makeNoise(ac) {
  var len = ac.sampleRate;
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}

function tone(time, freq, dur, type, vol) {
  if (!audio.ac) return;
  var o = audio.ac.createOscillator();
  var g = audio.ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(1, freq), time);
  g.gain.setValueAtTime(Math.max(0.0001, vol), time);
  g.gain.exponentialRampToValueAtTime(0.0001, time + Math.max(0.03, dur));
  o.connect(g);
  g.connect(audio.sfx);
  o.start(time);
  o.stop(time + dur + 0.03);
}

function noiseBurst(time, dur, vol, type, freq) {
  if (!audio.ac || !audio.noise) return;
  var src = audio.ac.createBufferSource();
  src.buffer = audio.noise;
  var filter = audio.ac.createBiquadFilter();
  filter.type = type;
  filter.frequency.setValueAtTime(Math.max(40, freq), time);
  var g = audio.ac.createGain();
  g.gain.setValueAtTime(Math.max(0.0001, vol), time);
  g.gain.exponentialRampToValueAtTime(0.0001, time + Math.max(0.03, dur));
  src.connect(filter);
  filter.connect(g);
  g.connect(audio.sfx);
  src.start(time);
  src.stop(time + dur + 0.03);
}

function scheduleMusic(step, time) {
  if (!audio.ac) return;
  var lead = audio.ac.createOscillator();
  var lg = audio.ac.createGain();
  lead.type = 'square';
  lead.frequency.setValueAtTime(midi(MELODY[step]), time);
  lg.gain.setValueAtTime(0.0001, time);
  lg.gain.exponentialRampToValueAtTime(0.045, time + 0.02);
  lg.gain.exponentialRampToValueAtTime(0.0001, time + 0.2);
  lead.connect(lg);
  lg.connect(audio.music);
  lead.start(time);
  lead.stop(time + 0.22);
  if (step % 2 === 0) {
    var bass = audio.ac.createOscillator();
    var bg = audio.ac.createGain();
    bass.type = 'triangle';
    bass.frequency.setValueAtTime(midi(BASS[(step / 2) % BASS.length]), time);
    bg.gain.setValueAtTime(0.0001, time);
    bg.gain.exponentialRampToValueAtTime(0.09, time + 0.02);
    bg.gain.exponentialRampToValueAtTime(0.0001, time + 0.28);
    bass.connect(bg);
    bg.connect(audio.music);
    bass.start(time);
    bass.stop(time + 0.3);
  }
  noiseBurst(time, 0.03, step % 4 === 0 ? 0.03 : 0.012, 'highpass', 5000);
}

audio.ensure = function () {
  if (audio.ac) {
    if (audio.ac.state === 'suspended') audio.ac.resume();
    return;
  }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  var ac = new AC();
  audio.ac = ac;
  audio.master = ac.createGain();
  audio.master.gain.value = audio.muted ? 0 : 0.85;
  audio.master.connect(ac.destination);
  audio.music = ac.createGain();
  audio.music.gain.value = 0.9;
  audio.sfx = ac.createGain();
  audio.sfx.gain.value = 0.95;
  var filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 2400;
  audio.music.connect(filter);
  filter.connect(audio.master);
  audio.sfx.connect(audio.master);
  audio.noise = makeNoise(ac);
  audio.next = ac.currentTime + 0.06;
  audio.step = 0;
  var tick = function () {
    if (!audio.ac) return;
    if (audio.next < ac.currentTime) audio.next = ac.currentTime + 0.05;
    while (audio.next < ac.currentTime + 0.28) {
      scheduleMusic(audio.step, audio.next);
      audio.step = (audio.step + 1) % MELODY.length;
      audio.next += 0.268;
    }
    audio.timer = setTimeout(tick, 60);
  };
  tick();
  if (ac.state === 'suspended') ac.resume();
};

function setMuteLabel() {
  if (!muteBtn) return;

function toggleMute() {
  audio.muted = !audio.muted;
  if (audio.ac && audio.master) {
    var t = audio.ac.currentTime;
    audio.master.gain.cancelScheduledValues(t);
    audio.master.gain.setTargetAtTime(audio.muted ? 0 : 0.85, t, 0.03);
  }
  setMuteLabel();
  saveStore();
  announce();
}
