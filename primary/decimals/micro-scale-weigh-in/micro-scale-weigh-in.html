<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

<body>
<canvas id="gameCanvas" tabindex="0" aria-label="Micro-Scale Weigh-In decimal rounding game"></canvas>
<div id="live" aria-live="polite"></div>
<noscript><p>Micro-Scale Weigh-In needs JavaScript to open the weighing post.</p></noscript>
<script>
(() => {
  "use strict";

  const VIEW_W = 1280;
  const VIEW_H = 720;
  const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';
  const FONT_NUM = 'Georgia, "Palatino Linotype", Palatino, serif';
  const FONT_LED = '"Courier New", Courier, monospace';

  const COL = {
    ink: "#4a2e1c",
    inkSoft: "#7a5340",
    wood: "#e39b4a",
    woodDeep: "#b86a28",
    woodDark: "#8a4b22",
    parchment: "#fff7e8",
    parchmentEdge: "#e6d0a4",
    mint: "#7ddec0",
    mintDeep: "#1f8f72",
    led: "#b8fff6",
    ledBg: "#062e33",
    brass: "#f0c15a",
    brassDeep: "#c48a22",
    crimson: "#e23d4a",
    azure: "#2f7de1",
    emerald: "#1f9d63",
    gold: "#ffcf4d",
    cream: "#fffaf2",
    blush: "#ff9aaf"
  };

  const PLAYERS = [
    { id: 0, tag: "P1 RED", name: "Crimson Post-Master", color: COL.crimson, dark: "#8d1c2a", keys: ["1", "2", "3", "4"], codes: ["Digit1", "Digit2", "Digit3", "Digit4", "Numpad1", "Numpad2", "Numpad3", "Numpad4"] },
    { id: 1, tag: "P2 BLUE", name: "Azure Post-Master", color: COL.azure, dark: "#164a8c", keys: ["Q", "W", "E", "R"], codes: ["KeyQ", "KeyW", "KeyE", "KeyR"] },
    { id: 2, tag: "P3 GREEN", name: "Emerald Post-Master", color: COL.emerald, dark: "#0d5a38", keys: ["U", "I", "O", "P"], codes: ["KeyU", "KeyI", "KeyO", "KeyP"] }
  ];

  const DIFFS = [
    { id: "easy", name: "EASY", title: "Junior Weigh-Master", shift: 180, critter: 28, blurb: "Nearest whole number and clean 1 decimal place. Recurring readouts, with no 9-carry traps." },
    { id: "medium", name: "MEDIUM", title: "Senior Clerk", shift: 180, critter: 24, blurb: "Whole numbers, 1 d.p. and 2 d.p., plus cascade traps. Look at one decider digit only." },
    { id: "hard", name: "HARD", title: "Chief Inspector", shift: 170, critter: 22, blurb: "Trailing zeros and ripple carry-overs. 10.0 is not 10, and 9s can roll all the way over." },
    { id: "extreme", name: "EXTREME", title: "Express Weighing Blitz", shift: 120, critter: 12, blurb: "A fast conveyor mixes every order. Golden Stamp combos pay ×2, then ×3." }
  ];

  const CARD = { y: 504, h: 200, w: 300, gap: 14, x0: 20 };
  const HUD_H = 56;
  const BANNER = { y: 64, h: 68 };

  //#region math
  const DP_META = [
    { phrase: "the nearest whole number", short: "NEAREST WHOLE", badge: "0 d.p.", deciderName: "tenths", targetName: "ones", keep: "no digits after the decimal point" },
    { phrase: "1 decimal place", short: "1 DECIMAL PLACE", badge: "1 d.p.", deciderName: "hundredths", targetName: "tenths", keep: "ONE digit after the decimal point" },
    { phrase: "2 decimal places", short: "2 DECIMAL PLACES", badge: "2 d.p.", deciderName: "thousandths", targetName: "hundredths", keep: "TWO digits after the decimal point" }
  ];
  const PLACE_NAMES = ["ones", "tenths", "hundredths", "thousandths", "ten-thousandths", "hundred-thousandths"];
  const CRITTERS = [
    { id: "acorn", name: "Acorn Sprite" },
    { id: "pebble", name: "Pebble Puff" },
    { id: "beetle", name: "Berry Beetle" },
    { id: "bunny", name: "Cloud Bunny" },
    { id: "bear", name: "Button Bear" },
    { id: "fox", name: "Mochi Fox" },
    { id: "mouse", name: "Thimble Mouse" },
    { id: "duck", name: "Dewdrop Duck" },
    { id: "mole", name: "Marshmallow Mole" },
    { id: "wren", name: "Walnut Wren" },
    { id: "kit", name: "Clover Kit" },
    { id: "pine", name: "Pinecone Pup" }
  ];

  function randInt(a, b) {
    return a + Math.floor(Math.random() * (b - a + 1));
  }
  function pick(arr) {
    return arr[randInt(0, arr.length - 1)];
  }
  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }
  function freshDigits() {
    const digits = [];
    for (let i = 0; i < 12; i++) digits.push(randInt(0, 9));
    digits[8] = randInt(1, 9);
    digits[9] = randInt(1, 9);
    digits[10] = randInt(2, 9);
    digits[11] = randInt(1, 9);
    return digits;
  }
  function formatParts(whole, kept) {
    if (!kept || kept.length === 0) return String(whole);
    return String(whole) + "." + kept.join("");
  }
  function applyRound(whole, digits, dp) {
    const decider = digits[dp] == null ? 0 : digits[dp];
    const kept = digits.slice(0, dp);
    let carry = decider >= 5 ? 1 : 0;
    for (let i = kept.length - 1; i >= 0; i--) {
      const sum = kept[i] + carry;
      kept[i] = sum % 10;
      carry = Math.floor(sum / 10);
    }
    return { whole: whole + carry, kept: kept };
  }
  function cascadeRound(whole, digits, dp) {
    const end = Math.min(digits.length - 1, dp + 2);
    const d = digits.slice(0, end + 1);
    let w = whole;
    function bump(idx) {
      if (idx < 0) {
        w += 1;
        return;
      }
      d[idx] += 1;
      if (d[idx] >= 10) {
        d[idx] = 0;
        bump(idx - 1);
      }
    }
    for (let i = d.length - 1; i >= dp; i--) {
      if (d[i] >= 5) bump(i - 1);
      d[i] = 0;
    }
    return { whole: w, kept: d.slice(0, dp) };
  }
  function forceAdjust(whole, digits, dp, up) {
    const kept = digits.slice(0, dp);
    let carry = up ? 1 : 0;
    for (let i = kept.length - 1; i >= 0; i--) {
      const sum = kept[i] + carry;
      kept[i] = sum % 10;
      carry = Math.floor(sum / 10);
    }
    return formatParts(whole + carry, kept);
  }
  function stripTrailingZeros(str) {
    if (str.indexOf(".") === -1) return str;
    let s = str.replace(/0+$/, "");
    if (s.charAt(s.length - 1) === ".") s = s.slice(0, -1);
    return s;
  }
  function showsTrailingZero(str, dp) {
    if (dp <= 0) return false;
    const parts = str.split(".");
    return parts.length === 2 && parts[1].length === dp && parts[1].charAt(parts[1].length - 1) === "0";
  }
  function rippled(whole, digits, dp) {
    const result = applyRound(whole, digits, dp);
    if (result.whole !== whole) return true;
    for (let i = 0; i < result.kept.length; i++) {
      if (digits[i] === 9 && result.kept[i] !== 9) return true;
    }
    return false;
  }
  function nudge(str, deltaSteps) {
    const dp = str.indexOf(".") === -1 ? 0 : str.split(".")[1].length;
    let n = parseInt(str.replace(".", ""), 10);
    if (!isFinite(n)) n = 0;
    n += deltaSteps;
    if (n < 0) n = Math.abs(deltaSteps) + 2;
    if (dp === 0) return String(n);
    const raw = String(n).padStart(dp + 1, "0");
    return raw.slice(0, raw.length - dp) + "." + raw.slice(raw.length - dp);
  }
  function makeNoCarry(whole, digits, dp) {
    const decider = digits[dp];
    if (decider < 5) return null;
    if (dp === 1 && digits[0] === 9) return String(whole) + ".10";
    if (dp === 2 && digits[1] === 9) {
      if (digits[0] === 9) return String(whole) + ".100";
      return String(whole) + "." + digits[0] + "10";
    }
    return null;
  }
  function rollEasy() {
    for (let attempt = 0; attempt < 40; attempt++) {
      const dp = Math.random() < 0.5 ? 0 : 1;
      let whole = randInt(3, 28);
      const digits = [];
      if (Math.random() < 0.52) {
        const d = randInt(1, 8);
        for (let i = 0; i < 12; i++) digits.push(d);
      } else {
        const a = randInt(1, 8);
        let b = randInt(1, 8);
        if (b === a) b = (a % 8) + 1;
        for (let i = 0; i < 12; i++) digits.push(i % 2 === 0 ? a : b);
      }
      if (dp === 0 && digits[0] >= 5 && whole % 10 === 9) whole += 1;
      if (rippled(whole, digits, dp)) continue;
      const rounded = applyRound(whole, digits, dp);
      const correct = formatParts(rounded.whole, rounded.kept);
      if (showsTrailingZero(correct, dp)) continue;
      return { whole: whole, digits: digits, dp: dp };
    }
    return { whole: 6, digits: [3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3], dp: 1 };
  }
  function rollMedium() {
    for (let attempt = 0; attempt < 48; attempt++) {
      const gate = Math.random();
      const dp = gate < 0.22 ? 0 : gate < 0.62 ? 1 : 2;
      let whole = randInt(5, 36);
      const digits = freshDigits();
      const cascadeMode = Math.random() < 0.58;
      if (cascadeMode) {
        digits[dp] = 4;
        digits[dp + 1] = randInt(6, 9);
        digits[dp + 2] = randInt(1, 9);
        if (dp > 0 && (digits[dp - 1] === 9 || digits[dp - 1] === 0)) digits[dp - 1] = randInt(2, 7);
        if (dp === 0 && whole % 10 === 9) whole = Math.floor(whole / 10) * 10 + randInt(0, 8);
      } else if (Math.random() < 0.55) {
        digits[dp] = randInt(5, 8);
        for (let i = dp + 1; i <= dp + 2 && i < digits.length; i++) digits[i] = randInt(0, 4);
        if (dp > 0) digits[dp - 1] = randInt(1, 8);
        if (dp === 0 && whole % 10 === 9) whole -= 1;
      } else {
        digits[dp] = randInt(0, 3);
        for (let i = dp + 1; i <= dp + 2 && i < digits.length; i++) digits[i] = randInt(0, 4);
        if (dp > 0) digits[dp - 1] = randInt(2, 8);
        if (dp === 0 && whole % 10 === 9) whole -= 1;
      }
      if (rippled(whole, digits, dp)) continue;
      const rounded = applyRound(whole, digits, dp);
      const correct = formatParts(rounded.whole, rounded.kept);
      if (showsTrailingZero(correct, dp)) continue;
      const casc = cascadeRound(whole, digits, dp);
      const cascadeText = formatParts(casc.whole, casc.kept);
      if (cascadeMode && cascadeText === correct) continue;
      return { whole: whole, digits: digits, dp: dp };
    }
    return { whole: 14, digits: [3, 4, 9, 6, 2, 5, 8, 1, 3, 7, 4, 2], dp: 1 };
  }
  function rollHard() {
    for (let attempt = 0; attempt < 48; attempt++) {
      let whole = randInt(4, 39);
      const digits = freshDigits();
      const roll = Math.random();
      let dp;
      if (roll < 0.36) {
        dp = 1;
        digits[0] = 9;
        digits[1] = randInt(5, 9);
        if (Math.random() < 0.75) whole = randInt(0, 3) * 10 + 9;
      } else if (roll < 0.7) {
        dp = 2;
        if (Math.random() < 0.55) {
          digits[0] = 9;
          digits[1] = 9;
          if (Math.random() < 0.7) whole = randInt(0, 3) * 10 + 9;
        } else {
          digits[0] = randInt(1, 8);
          digits[1] = 9;
        }
        digits[2] = randInt(5, 9);
      } else if (roll < 0.86) {
        dp = Math.random() < 0.5 ? 1 : 2;
        if (dp === 1) {
          digits[0] = 0;
          digits[1] = randInt(0, 4);
          digits[2] = randInt(1, 9);
        } else {
          digits[0] = randInt(1, 8);
          digits[1] = 0;
          digits[2] = randInt(0, 4);
          digits[3] = randInt(1, 9);
        }
      } else {
        dp = 0;
        whole = randInt(0, 3) * 10 + 9;
        digits[0] = randInt(5, 9);
      }
      digits[8] = randInt(1, 9);
      digits[11] = randInt(1, 9);
      const rounded = applyRound(whole, digits, dp);
      const correct = formatParts(rounded.whole, rounded.kept);
      const lesson = showsTrailingZero(correct, dp) || rounded.whole !== whole;
      if (!lesson) continue;
      return { whole: whole, digits: digits, dp: dp };
    }
    return { whole: 9, digits: [9, 7, 4, 2, 6, 1, 8, 3, 5, 2, 7, 4], dp: 1 };
  }
  function rollTier(tier) {
    if (tier === "easy") return rollEasy();
    if (tier === "medium") return rollMedium();
    if (tier === "hard") return rollHard();
    const r = Math.random();
    if (r < 0.2) return rollEasy();
    if (r < 0.52) return rollMedium();
    return rollHard();
  }
  function finalizeProblem(recipe) {
    const whole = recipe.whole;
    const digits = recipe.digits.slice();
    const dp = recipe.dp;
    const shownCount = Math.random() < 0.5 ? 7 : 8;
    const shown = digits.slice(0, shownCount);
    const rounded = applyRound(whole, digits, dp);
    const correct = formatParts(rounded.whole, rounded.kept);
    const casc = cascadeRound(whole, digits, dp);
    const others = [0, 1, 2].map((d) => {
      const r = applyRound(whole, digits, d);
      return formatParts(r.whole, r.kept);
    });
    const intLen = String(whole).length;
    return {
      whole: whole,
      digits: digits,
      dp: dp,
      shown: shown,
      readout: whole + "." + shown.join(""),
      correct: correct,
      cascade: formatParts(casc.whole, casc.kept),
      others: others,
      truncated: formatParts(whole, digits.slice(0, dp)),
      forcedUp: forceAdjust(whole, digits, dp, true),
      omit: stripTrailingZeros(correct),
      noCarry: makeNoCarry(whole, digits, dp),
      deciderDigit: digits[dp],
      intLen: intLen,
      targetChar: dp === 0 ? intLen - 1 : intLen + dp,
      unit: Math.random() < 0.5 ? "kg" : "g",
      critter: pick(CRITTERS),
      key: whole + "." + shown.join("")
    };
  }
  function generateProblem(tier, history) {
    let problem = null;
    for (let i = 0; i < 32; i++) {
      problem = finalizeProblem(rollTier(tier));
      if (history.indexOf(problem.key) === -1) break;
    }
    history.push(problem.key);
    while (history.length > 8) history.shift();
    return problem;
  }
  function digitAtPlace(problem, placeIndex) {
    if (placeIndex <= 0) return Math.abs(problem.whole) % 10;
    return problem.digits[placeIndex - 1];
  }
  function buildStep1(problem) {
    const deciderPlace = problem.dp + 1;
    const targetPlace = problem.dp;
    const decDigit = digitAtPlace(problem, deciderPlace);
    const action = decDigit >= 5 ? "Round Up" : "Round Down";
    const wrongAction = decDigit >= 5 ? "Round Down" : "Round Up";
    function card(placeIndex, label, trap) {
      const safePlace = Math.max(0, Math.min(PLACE_NAMES.length - 1, placeIndex));
      const d = digitAtPlace(problem, safePlace);
      return {
        trap: trap,
        big: String(d),
        sub: label,
        note: PLACE_NAMES[safePlace] + " digit",
        text: d + "|" + label + "|" + PLACE_NAMES[safePlace],
        flash: "",
        flashT: 0
      };
    }
    const seed = [
      card(deciderPlace, action, "correct"),
      card(targetPlace, "Target Place", "target-digit"),
      card(deciderPlace + 1, "Too Far", "too-far"),
      card(deciderPlace, wrongAction, "wrong-action")
    ];
    const fillers = [
      card(deciderPlace + 2, "Too Far", "too-far"),
      card(0, "Ones Digit", "target-digit"),
      card(targetPlace, "Ignore Rule", "target-digit"),
      card(deciderPlace + 1, "Ignore", "too-far")
    ];
    const uniq = [];
    const seen = {};
    function push(opt) {
      if (uniq.length >= 4) return;
      if (seen[opt.text]) return;
      seen[opt.text] = true;
      uniq.push(opt);
    }
    for (let i = 0; i < seed.length; i++) push(seed[i]);
    for (let i = 0; i < fillers.length; i++) push(fillers[i]);
    let guard = 0;
    while (uniq.length < 4 && guard < 8) {
      push({
        trap: "too-far",
        big: String(problem.digits[6 + guard] || guard),
        sub: "Not the decider",
        note: "far digit",
        text: "pad-" + guard + "-" + problem.readout,
        flash: "",
        flashT: 0
      });
      guard += 1;
    }
    return shuffle(uniq.slice(0, 4));
  }
  function numericDist(a, b) {
    const x = parseFloat(a);
    const y = parseFloat(b);
    if (!isFinite(x) || !isFinite(y)) return 9;
    return Math.abs(x - y);
  }
  function buildStep2(problem, tier) {
    const candidates = [];
    function add(text, trap) {
      if (text == null || text === "" || text === problem.correct) return;
      for (let i = 0; i < candidates.length; i++) {
        if (candidates[i].text === text) return;
      }
      candidates.push({ text: text, trap: trap, big: text, sub: problem.unit, note: "" });
    }
    if (problem.omit !== problem.correct) add(problem.omit, "omit-zero");
    add(problem.noCarry, "no-carry");
    add(problem.cascade, "cascade");
    if (problem.dp > 0) add(problem.others[problem.dp - 1], "wrong-place");
    if (problem.dp < 2) add(problem.others[problem.dp + 1], "wrong-place");
    if (problem.deciderDigit >= 5) {
      const trap = problem.dp === 0 && problem.whole % 10 === 9 ? "no-carry" : "wrong-direction";
      add(problem.truncated, trap);
    } else {
      add(problem.forcedUp, "wrong-direction");
    }
    const weights = tier === "medium"
      ? { cascade: 12, "wrong-place": 9, "wrong-direction": 8, "omit-zero": 7, "no-carry": 6 }
      : tier === "easy"
        ? { "wrong-direction": 10, "wrong-place": 8, cascade: 4, "omit-zero": 6, "no-carry": 3 }
        : tier === "extreme"
          ? { "omit-zero": 11, cascade: 10, "no-carry": 10, "wrong-place": 8, "wrong-direction": 7 }
          : { "omit-zero": 12, "no-carry": 11, "wrong-place": 8, "wrong-direction": 7, cascade: 5 };
    for (let i = 0; i < candidates.length; i++) {
      const dist = numericDist(candidates[i].text, problem.correct);
      const boost = dist < 0.001 ? 3 : dist <= 0.11 ? 2.5 : dist <= 0.51 ? 1 : 0;
      candidates[i].order = i;
      candidates[i].score = (weights[candidates[i].trap] || 1) + boost;
    }
    candidates.sort((a, b) => b.score - a.score || a.order - b.order);
    const picked = [];
    for (let i = 0; i < candidates.length && picked.length < 3; i++) {
      picked.push({
        text: candidates[i].text,
        trap: candidates[i].trap,
        big: candidates[i].text,
        sub: problem.unit,
        note: "",
        flash: "",
        flashT: 0
      });
    }
    let step = 1;
    while (picked.length < 3 && step < 16) {
      const n = nudge(problem.correct, step % 2 === 0 ? step : -step);
      step += 1;
      if (n === problem.correct) continue;
      let exists = false;
      for (let j = 0; j < picked.length; j++) if (picked[j].text === n) exists = true;
      if (exists) continue;
      picked.push({ text: n, trap: "wrong-direction", big: n, sub: problem.unit, note: "", flash: "", flashT: 0 });
    }
    const correctOpt = {
      text: problem.correct,
      trap: "correct",
      big: problem.correct,
      sub: problem.unit,
      note: "",
      flash: "",
      flashT: 0
    };
    return shuffle([correctOpt].concat(picked.slice(0, 3)));
  }
  function tipFor(problem, opt) {
    const meta = DP_META[problem.dp];
    const shown = problem.readout + "...";
    if (opt.trap === "omit-zero") {
      if (problem.dp === 1) {
        return "When rounding to 1 decimal place, ALWAYS keep 1 digit after the decimal point (" + problem.correct + ", not " + opt.text + ") to show your rounding accuracy!";
      }
      if (problem.dp === 2) {
        return "When rounding to 2 decimal places, ALWAYS keep 2 digits after the decimal point (" + problem.correct + ", not " + opt.text + ") to show your rounding accuracy!";
      }
      return "Nearest whole number is written with no decimal point. " + shown + " rounds to " + problem.correct + ".";
    }
    if (opt.trap === "cascade") {
      const cmp = problem.deciderDigit < 5 ? problem.deciderDigit + " < 5" : problem.deciderDigit + " ≥ 5";
      return "Look ONLY at the digit immediately to the right of your target place! For " + meta.badge + ", check the " + meta.deciderName + " digit (" + cmp + "), so " + shown + " rounds to " + problem.correct + "!";
    }
    if (opt.trap === "wrong-place") {
      if (problem.dp === 0) {
        return "Check the Logbook Stamp instruction! \"Nearest whole number\" means no digits after the decimal point. " + shown + " rounds to " + problem.correct + ".";
      }
      const words = problem.dp === 1 ? "ONE digit" : "TWO digits";
      return "Check the Logbook Stamp instruction! \"" + (problem.dp === 1 ? "1 decimal place" : "2 decimal places") + "\" means keeping " + words + " after the decimal point!";
    }
    if (opt.trap === "no-carry") {
      if (problem.dp === 1) return "Rounding 9 tenths up gives 10 tenths = 1 whole! Carry 1 over to the ones place → " + problem.correct + "!";
      if (problem.dp === 2 && problem.digits[0] === 9 && problem.digits[1] === 9) {
        return "Those 9s ripple! 10 hundredths become 1 tenth, then 10 tenths become 1 whole. Carry all the way → " + problem.correct + "!";
      }
      if (problem.dp === 2) return "Rounding 9 hundredths up gives 10 hundredths = 1 tenth! Carry 1 over to the tenths place → " + problem.correct + "!";
      return "The ones digit is 9 and the tenths digit is " + problem.deciderDigit + " (5 or more), so add 1 and carry → " + problem.correct + "!";
    }
    if (opt.trap === "wrong-direction") {
      if (problem.deciderDigit < 5) {
        return "The " + meta.deciderName + " digit is " + problem.deciderDigit + " (0, 1, 2, 3 or 4), so keep the " + meta.targetName + " digit. " + shown + " rounds to " + problem.correct + ".";
      }

  function duelRows() {
    const rows = [];
    for (let i = 0; i < G.playerCount; i++) rows.push({ i: i, stars: G.stars[i], points: G.points[i], lives: G.lives[i] });
    rows.sort((a, b) => b.stars - a.stars || b.points - a.points);
    return rows;
  }
  function drawResult() {
    drawPlay();
    ctx.fillStyle = "rgba(40, 24, 12, 0.45)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    fillRound(250, 70, 780, 560, 24, COL.parchment, "#e0c48a", 6);
    const diff = currentDiff();
    ctx.textAlign = "center";
    ctx.fillStyle = COL.woodDark;
    ctx.font = "700 18px " + FONT;
    ctx.fillText(diff.title.toUpperCase(), 640, 112);
    ctx.fillStyle = COL.ink;
    ctx.font = "700 42px " + FONT;
    ctx.fillText("Shift Complete", 640, 164);
    ctx.font = "700 16px " + FONT;
    ctx.fillStyle = COL.inkSoft;
    const reason = G.endReason === "hearts" ? "The stamp hearts ran out." : G.endReason === "wipe" ? "Every duel lane is inked out." : "The post clock chimed.";
    ctx.fillText(reason + (G.recordNote ? "  " + G.recordNote : ""), 640, 196);
    if (G.mode === "duel") {
      const rows = duelRows();
      const tie = rows.length > 1 && rows[0].stars === rows[1].stars && rows[0].points === rows[1].points;
      ctx.fillStyle = COL.ink;
      ctx.font = "700 24px " + FONT;
      ctx.fillText(tie ? "Shared ribbon" : PLAYERS[rows[0].i].tag + " wins the ribbon", 640, 246);
      rows.forEach((row, idx) => {
        const y = 300 + idx * 64;
        ctx.fillStyle = PLAYERS[row.i].color;
        ctx.fillText(PLAYERS[row.i].tag, 460, y);
        ctx.fillStyle = COL.ink;
        ctx.fillText(row.stars + " stars", 700, y);
        ctx.font = "700 16px " + FONT;
        ctx.fillStyle = COL.inkSoft;
        ctx.fillText(row.lives + " lives left  ·  " + comma(row.points) + " pts", 700, y + 22);
        ctx.font = "700 24px " + FONT;
      });
    } else if (G.mode === "coop") {
      ctx.fillStyle = COL.mintDeep;
      ctx.font = "700 20px " + FONT;
      ctx.fillText("ONE SHARED LOGBOOK", 640, 246);
      ctx.fillStyle = COL.ink;
      ctx.font = "700 36px " + FONT;
      ctx.fillText("TEAM SCORE  " + comma(G.score), 640, 310);
      ctx.font = "700 18px " + FONT;
      const names = PLAYERS.slice(0, G.playerCount).map((p) => p.tag).join("   ");
      ctx.fillText(names, 640, 352);
      ctx.fillStyle = COL.inkSoft;
      ctx.fillText("Critters logged " + G.logged + "    ·    Accuracy " + accuracy() + "%    ·    Hearts " + Math.max(0, G.hearts), 640, 392);
      if (currentDiff().id === "extreme") ctx.fillText("Best golden streak ×" + Math.min(3, G.bestCombo), 640, 422);
    } else {
      ctx.fillStyle = COL.ink;
      ctx.font = "700 36px " + FONT;
      ctx.fillText(comma(G.score), 640, 280);
      ctx.font = "700 16px " + FONT;
      ctx.fillStyle = COL.inkSoft;
      ctx.fillText("LOGBOOK POINTS", 640, 248);
      ctx.font = "700 18px " + FONT;
      ctx.fillStyle = COL.ink;
      ctx.fillText("Critters logged " + G.logged + "    ·    Accuracy " + accuracy() + "%", 640, 340);
      ctx.fillText("Hearts left " + Math.max(0, G.hearts) + (currentDiff().id === "extreme" ? "    ·    Best golden streak ×" + Math.min(3, G.bestCombo) : ""), 640, 372);
    }
    const b = resultButtons();
    fillRound(b.again.x, b.again.y, b.again.w, b.again.h, 14, "#ffcf4d", "#a87420", 3);
    fillRound(b.title.x, b.title.y, b.title.w, b.title.h, 14, "#fff", "#e0c48a", 3);
    ctx.fillStyle = COL.ink;
    ctx.font = "700 20px " + FONT;
    ctx.fillText("WEIGH AGAIN", b.again.x + b.again.w / 2, b.again.y + 36);
    ctx.fillText("TITLE POST", b.title.x + b.title.w / 2, b.title.y + 36);
    ctx.textAlign = "left";
    drawMute();
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#1c120c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, viewOffX * dpr, viewOffY * dpr);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.textBaseline = "alphabetic";
    if (G.screen === "title") drawTitle();
    else if (G.screen === "result") drawResult();
    else drawPlay();
  }
  function easeOut(t) {
    const x = clamp01(t);
    return 1 - Math.pow(1 - x, 3);
  }
  function clamp01(t) {
    return Math.max(0, Math.min(1, t));
  }

  function loop(now) {
    const dt = document.hidden ? 0 : Math.min(0.05, (now - loop.last) / 1000 || 0);
    loop.last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  loop.last = performance.now();

  window.addEventListener("resize", resize);
  window.addEventListener("keydown", (e) => {
    const block = e.code === "Space" || e.code === "Enter" || e.code.indexOf("Arrow") === 0 || CODE_MAP[e.code] || e.code === "KeyM";
    if (block) e.preventDefault();
    if (e.repeat) return;
    ensureAudio();
    onKey(e.code);
  });
  window.addEventListener("blur", () => {
    padMem.forEach((p) => { p.l = p.r = p.u = p.d = p.a = false; });
  });
  canvas.addEventListener("pointerdown", (e) => {
    if (e.cancelable) e.preventDefault();
    canvas.focus();
    ensureAudio();
    const p = eventPos(e);
    onPointer(p.x, p.y);
  }, { passive: false });
  canvas.addEventListener("pointermove", (e) => {
    const p = eventPos(e);
    onMove(p.x, p.y);
  });
  resize();
  canvas.focus();
  announce("Micro-Scale Weigh-In. Choose players, difficulty, and mode, then start the shift.");
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
