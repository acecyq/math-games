<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
<noscript>This lesson needs JavaScript and a canvas-capable browser.</noscript>
<canvas id="game" aria-label="Power Grid Reactor, a multiplication game"></canvas>
<div id="live" class="sr" aria-live="polite"></div>
<script>
'use strict';

/* Power Grid Reactor: Multi-Core Turbine
   Primary multi-digit multiplication.
   Every tier uses the standard written method: multiply one digit,
   write that digit, then carry. Shifted rows clamp placeholder zeros
   first. Two or more rows are added column by column. */

const LW = 1280;
const LH = 720;
const FONT = 'Nunito, Trebuchet MS, sans-serif';
const DISP = 'Orbitron, Nunito, sans-serif';
const PLACE = ['ones', 'tens', 'hundreds', 'thousands', 'ten-thousands', 'hundred-thousands', 'millions', 'ten-millions'];
const PLACE_SHORT = ['O', 'T', 'H', 'Th', 'TTh', 'HTh', 'M', 'TM'];
const COL = {
  bg: '#071018',
  ink: '#eaf6ff',
  dim: '#8eb4cc',
  cyan: '#3ef0ff',
  amber: '#ffc857',
  good: '#5dffb0',
  bad: '#ff5d6c',
  panel: 'rgba(6, 16, 28, 0.92)',
  players: ['#ff3b5c', '#3aa0ff', '#ffe14a']
};

const KEYS = [
  { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', fire: ['Space'] },
  { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', fire: ['KeyF'] },
  { up: 'KeyI', down: 'KeyK', left: 'KeyJ', right: 'KeyL', fire: ['KeyH'] }
];

const SHAPES = [
  { tier: 1, aLen: 1, bLen: 1, name: 'Single-digit core' },
  { tier: 1, aLen: 2, bLen: 1, name: 'Tens and ones' },
  { tier: 1, aLen: 3, bLen: 1, name: 'Three-digit top' },
  { tier: 2, aLen: 2, bLen: 2, name: 'Two-digit multiplier' },
  { tier: 2, aLen: 3, bLen: 2, name: 'Placeholder zero' },
  { tier: 2, aLen: 4, bLen: 2, name: 'Four-digit top' },
  { tier: 3, aLen: 3, bLen: 3, name: 'Three multiplier rows' },
  { tier: 3, aLen: 4, bLen: 3, zeroAt: 1, name: 'Middle-zero trap' },
  { tier: 3, aLen: 4, bLen: 4, name: 'Four-row turbine' }
];

function rollDigit() {
  return 2 + Math.floor(Math.random() * 8);
}

function rollFactor(length, zeroFromRight) {
  let n = 0;
  for (let place = length - 1; place >= 0; place--) {
    n = n * 10 + (place === zeroFromRight ? 0 : rollDigit());
  }
  return n;
}

function rollSpec(shape) {
  let a = rollFactor(shape.aLen);
  let b = rollFactor(shape.bLen, shape.zeroAt);
  if ((a % 10) * (b % 10) < 10) {
    a = a - (a % 10) + 8;
    b = b - (b % 10) + 7;
  }
  return { tier: shape.tier, a, b, name: shape.name };
}

function freshRun(tier) {
  return SHAPES.filter((shape) => tier == null || shape.tier === tier).map(rollSpec);
}

const TIER_NAME = ['', 'EASY', 'MEDIUM', 'HARD'];
const TIER_BLURB = [
  '',
  'One-digit multipliers. Write one digit, then carry.',
  'Two-digit multipliers. Clamp a zero before the tens row.',
  'Big multipliers, including a zero in the middle.'
];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const live = document.getElementById('live');
const held = new Set();
const hotspots = [];
const fx = [];
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const view = { cssW: LW, cssH: LH, dpr: 1, scale: 1, ox: 0, oy: 0 };
const players = [0, 1, 2].map(makePlayer);
const pointer = { x: 640, y: 560, down: false, over: false };

const G = {
  mode: 'title',
  t: 0,
  run: [],
  runName: '',
  pi: 0,
  problem: null,
  si: 0,
  phase: 'input',
  phaseT: 0,
  pods: 0,
  written: [],
  reveal: null,
  carryShow: null,
  score: 0,
  corrects: 0,
  wrongs: 0,
  charge: 0,
  chargeShown: 0,
  shake: 0,
  stepTime: 0,
  spin: 0,
  lesson: { kind: 'info', title: '', detail: '', spoken: '' },
  override: null,
  meltdownAt: 0,
  paused: false,
  celebrateBurst: false,
  menuPulse: 0,
  testErrors: []
};

const audio = createAudio();

function makePlayer(i) {
  const homes = [[238, 476], [506, 476], [774, 476]];
  return {
    i,
    name: ['Red engineer', 'Blue engineer', 'Gold engineer'][i],
    short: 'P' + (i + 1),
    color: COL.players[i],
    x: homes[i][0],
    y: homes[i][1],
    home: homes[i],
    shields: 3,
    stars: 0,
    lock: 0,
    fireDown: false,
    fireEdge: false,
    pad: false
  };
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function fmt(n) {
  const s = String(Math.abs(Math.round(n)));
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');
}
function digitsOf(n) {
  const s = String(Math.abs(Math.round(n)));
  return s.split('').map(Number);
}
function toPlaces(n) {
  const d = [];
  let x = Math.abs(Math.round(n));
  if (x === 0) return [0];
  while (x > 0) {
    d.push(x % 10);
    x = Math.floor(x / 10);
  }
  return d;
}
function fromPlaces(ds) {
  let n = 0;
  for (let i = 0; i < ds.length; i++) n += ds[i] * 10 ** i;
  return n;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}
function pulse(speed, min, max) {
  const s = (Math.sin(G.t * speed) + 1) / 2;
  return min + (max - min) * s;
}
function placeName(i) { return PLACE[i] || 'next place'; }

function multiplyTrace(a, digit) {
  const ds = digitsOf(a);
  let carry = 0;
  const steps = [];
  for (let i = ds.length - 1; i >= 0; i--) {
    const d = ds[i];
    const raw = d * digit + carry;
    const write = raw % 10;
    const carryOut = Math.floor(raw / 10);
    steps.push({
      digit: d,
      carryIn: carry,
      raw,
      write,
      carryOut,
      place: ds.length - 1 - i,
      leading: false
    });
    carry = carryOut;
  }
  if (carry) {
    steps.push({
      digit: null,
      carryIn: carry,
      raw: carry,
      write: carry % 10,
      carryOut: Math.floor(carry / 10),
      place: steps.length,
      leading: true
    });
    if (steps[steps.length - 1].carryOut) {
      const extra = steps[steps.length - 1].carryOut;
      steps[steps.length - 1].carryOut = 0;
      steps[steps.length - 1].write = carry % 10;
      steps.push({
        digit: null,
        carryIn: extra,
        raw: extra,
        write: extra,
        carryOut: 0,
        place: steps.length,
        leading: true
      });
    }
  }
  return steps;
}

function productWithShift(a, digit, shift) {
  const body = [];
  multiplyTrace(a, digit).forEach((step) => body.push(step.write));
  const digits = [];
  for (let i = 0; i < shift; i++) digits.push(0);
  body.forEach((d) => digits.push(d));
  return { product: a * digit, shifted: a * digit * 10 ** shift, digits };
}

function digitChoices(correct, cands) {
  const opts = [{ value: correct, label: String(correct), correct: true, reason: '' }];
  const seen = new Set([correct]);
  cands.forEach((c) => {
    if (!c || !Number.isFinite(c.value) || opts.length >= 4) return;
    const v = Math.round(c.value);
    if (v < 0 || v > 9 || seen.has(v)) return;
    seen.add(v);
    opts.push({ value: v, label: String(v), correct: false, reason: c.reason });
  });
  for (let n = 0; opts.length < 4 && n < 10; n++) {
    if (seen.has(n)) continue;
    seen.add(n);
    opts.push({
      value: n,
      label: String(n),
      correct: false,
      reason: 'That digit does not belong in this column. Work the step again.'
    });
  }
  return shuffle(opts);
}

function multiplyDigitOptions(aDigit, m, carryIn, raw, write) {
  const cands = [];
  const bare = (aDigit * m) % 10;
  if (carryIn && bare !== write) {
    cands.push({ value: bare, reason: 'Add the carry already on this column before you write.' });
  }
  const carried = Math.floor(raw / 10);
  if (carried !== write) cands.push({ value: carried, reason: 'Write the ones digit. The rest is the carry.' });
  const slipM = m === 9 ? m - 1 : m + 1;
  cands.push({ value: (aDigit * slipM) % 10, reason: 'Check the times-table fact, then write the ones digit.' });
  cands.push({ value: (write + 1) % 10, reason: 'That digit is off by one. Work the multiplication again.' });
  if (write > 0) cands.push({ value: write - 1, reason: 'That digit is off by one. Work the multiplication again.' });
  return digitChoices(write, cands);
}

function carryDigitOptions(carry, justWrote) {
  const cands = [
    { value: 0, reason: 'This column still has a carry. It has to move into the next place.' },
    { value: Math.min(9, carry + 1), reason: 'That carry does not match this column.' }
  ];
  if (carry > 1) cands.push({ value: carry - 1, reason: 'That carry does not match this column.' });
  if (justWrote != null && justWrote !== carry) {
    cands.push({ value: justWrote, reason: 'That is the digit you just wrote. The carry is the rest of the product.' });
  }
  return digitChoices(carry, cands);
}

function answerDigitOptions(step) {
  const write = step.write;
  const body = step.total - step.incoming;
  const cands = [];
  if (step.incoming && (body % 10) !== write) {
    cands.push({ value: body % 10, reason: 'Include the carry already on this column.' });
  }
  const tens = Math.floor(step.total / 10);
  if (tens !== write) cands.push({ value: tens, reason: 'Write the ones digit of the column. The rest is the carry.' });
  cands.push({ value: (write + 1) % 10, reason: 'The column sum is off by one. Add the digits again.' });
  if (write > 0) cands.push({ value: write - 1, reason: 'The column sum is off by one. Add the digits again.' });
  step.addends.forEach((d) => {
    if (d && d !== write) cands.push({ value: d, reason: 'A digit in this column was skipped.' });
  });
  return digitChoices(write, cands);
}

function zeroOptions() {
  return shuffle([
    { key: 'write', label: 'Write a zero row', correct: true, reason: '' },
    { key: 'skip', label: 'Skip this zero row', correct: true, reason: '' },
    {
      key: 'next',
      label: 'Use the next digit',
      correct: false,
      reason: 'A zero still holds its place. You cannot swap in the next digit early.'
    },
    {
      key: 'drop',
      label: 'Drop later shifts',
      correct: false,
      reason: 'Skipping a zero row is allowed, but later digits keep their own place values. Hundreds still need two zeros.'
    }
  ]);
}



function pushMultiplySteps(steps, row, rowIndex, m) {
  const trace = row.trace;
  const shift = row.shift;
  trace.forEach((bit, index) => {
    const place = shift + bit.place;
    const next = trace[index + 1];
    if (bit.leading) {
      const prev = trace[index - 1];
      steps.push({
        type: 'carry',
        rowIndex,
        place,
        shift,
        write: bit.write,
        writesDigit: true,
        options: carryDigitOptions(bit.write, prev ? prev.write : null),
        title: capitalize(placeName(place)) + ' digit · leftover carry',
        detail: 'The leftover carry is the next digit. Write it in the ' + placeName(place) + '.',
        success: 'The leftover ' + bit.write + ' is the ' + placeName(place) + ' digit.'
      });
      return;
    }
    const work = m + ' × ' + bit.digit;
    steps.push({
      type: 'digit',
      rowIndex,
      place,
      shift,
      aCol: bit.place,
      aDigit: bit.digit,
      m,
      carryIn: bit.carryIn,
      raw: bit.raw,
      write: bit.write,
      carryOut: bit.carryOut,
      options: multiplyDigitOptions(bit.digit, m, bit.carryIn, bit.raw, bit.write),
      title: capitalize(placeName(place)) + ' digit · ' + work + (bit.carryIn ? ' + carry' : ''),
      detail: (bit.carryIn
        ? 'Work out ' + work + ' and add the carry. Write one digit.'
        : 'Work out ' + work + '. Write one digit.'),
      success: work + (bit.carryIn ? ' + ' + bit.carryIn : '') + ' = ' + bit.raw + '. Write ' + bit.write + '.'
    });
    if (bit.carryOut && !(next && next.leading)) {
      steps.push({
        type: 'carry',
        rowIndex,
        place: place + 1,
        shift,
        write: bit.carryOut,
        writesDigit: false,
        options: carryDigitOptions(bit.carryOut, bit.write),
        title: 'Carry into the ' + placeName(place + 1),
        detail: 'Choose the carry that moves into the ' + placeName(place + 1) + '.',
        success: 'Carry ' + bit.carryOut + ' into the ' + placeName(place + 1) + '.'
      });
    }
  });
}

function pushAddSteps(steps, rows) {
  const width = rows.reduce((m, row) => Math.max(m, row.digits.length), 1);
  let carry = 0;
  let place = 0;
  let prevWrite = null;
  while (place < width || carry > 0) {
    const addends = rows.map((row) => row.digits[place] || 0);
    const total = addends.reduce((s, d) => s + d, 0) + carry;
    const write = total % 10;
    const carryOut = Math.floor(total / 10);
    const incoming = carry;
    steps.push({
      type: 'answer',
      place,
      addends,
      incoming,
      total,
      write,
      carryOut,
      options: null,
      title: '',
      detail: incoming
        ? 'Add the digits in this column, including the carry. Write one digit.'
        : 'Add the digits in this column. Write one digit.',
      success: carryOut
        ? 'Write ' + write + ' and carry ' + carryOut + '.'
        : 'Write ' + write + '. No carry.'
    });
    prevWrite = write;
    const nextHas = place + 1 < width;
    if (carryOut) {
      const writesDigit = !nextHas;
      steps.push({
        type: 'answer-carry',
        place: place + 1,
        write: carryOut,
        writesDigit,
        options: carryDigitOptions(carryOut, prevWrite),
        title: writesDigit
          ? capitalize(placeName(place + 1)) + ' digit · leftover carry'
          : 'Carry into the ' + placeName(place + 1),
        detail: writesDigit
          ? 'The leftover carry is the leading digit. Write it in the ' + placeName(place + 1) + '.'
          : 'Choose the carry that moves into the ' + placeName(place + 1) + '.',
        success: writesDigit
          ? 'The leftover ' + carryOut + ' is the ' + placeName(place + 1) + ' digit.'
          : 'Carry ' + carryOut + ' into the ' + placeName(place + 1) + '.'
      });
    }
    carry = carryOut && nextHas ? carryOut : 0;
    place += 1;
    if (place > 16) break;
  }
  steps.forEach((step) => {
    if (step.type !== 'answer') return;
    step.options = answerDigitOptions(step);
    step.title = capitalize(placeName(step.place)) + ' column · ' + columnExpr(step, rows);
  });
}

function buildStandard(a, b, tier) {
  const bDigits = digitsOf(b);
  const rows = [];
  const steps = [];
  for (let i = bDigits.length - 1; i >= 0; i--) {
    const shift = bDigits.length - 1 - i;
    const digit = bDigits[i];
    if (digit === 0) {
      const row = {
        shift,
        digit: 0,
        factor: 0,
        product: 0,
        shifted: 0,
        digits: zeroDigits(digitsOf(a).length, shift),
        hidden: false,
        optional: true,
        filled: false,
        clamped: false,
        revealed: 0,
        label: '× 0'
      };
      rows.push(row);
      const rowIndex = rows.length - 1;
      steps.push({
        type: 'zero',
        rowIndex,
        shift,
        digit: 0,
        options: zeroOptions(),
        title: capitalize(placeName(shift)) + ' digit is 0',
        detail: 'Zero times the top number is zero. Write a zero row, or skip it and keep later shifts.',
        success: ''
      });
      if (shift > 0) {
        steps.push({
          type: 'placeholder',
          rowIndex,
          count: shift,
          shift,
          digit: 0,
          zeroRow: true,
          skipIfHidden: true,
          title: 'Zero-row clamp · ' + shift + ' pod' + (shift > 1 ? 's' : ''),
          detail: 'A zero row still sits in the ' + placeName(shift) + '. Clamp ' + shift + ' placeholder zero' + (shift > 1 ? 's' : '') + ' so the columns stay lined up.'
        });
      }
    } else {
      const made = productWithShift(a, digit, shift);
      const row = {
        shift,
        digit,
        factor: digit * 10 ** shift,
        product: made.product,
        shifted: made.shifted,
        digits: made.digits,
        trace: multiplyTrace(a, digit),
        hidden: false,
        optional: false,
        filled: false,
        clamped: shift === 0,
        revealed: 0,
        label: '× ' + fmt(digit * 10 ** shift)
      };
      rows.push(row);
      const rowIndex = rows.length - 1;
      if (shift > 0) {
        steps.push({
          type: 'placeholder',
          rowIndex,
          count: shift,
          shift,
          digit,
          zeroRow: false,
          skipIfHidden: false,
          title: 'Placeholder clamp · ' + placeName(shift) + ' row',
          detail: 'The ' + digit + ' in ' + fmt(b) + ' means × ' + fmt(digit * 10 ** shift) + '. Clamp ' + shift + ' zero pod' + (shift > 1 ? 's' : '') + ' before that row can spin.'
        });
      }
      pushMultiplySteps(steps, row, rowIndex, digit);
    }
  }
  if (bDigits.length > 1) pushAddSteps(steps, rows);
  return finishProblem(a, b, tier, rows, steps, a * b);
}

function zeroDigits(length, shift) {
  const ds = [];
  for (let i = 0; i < length + shift; i++) ds.push(0);
  return ds;
}

function retitleColumns() {
  if (!G.problem) return;
  G.problem.steps.forEach((step) => {
    if (step.type !== 'answer') return;
    step.title = capitalize(placeName(step.place)) + ' column · ' + columnExpr(step, G.problem.rows);
  });
}

function columnExpr(step, rows) {
  const parts = [];
  rows.forEach((row) => {
    if (row.hidden) return;
    const d = row.digits[step.place] || 0;
    if (d) parts.push(String(d));
  });
  if (!parts.length && step.incoming) return 'carry ' + step.incoming;
  let expr = parts.join(' + ') || '0';
  if (step.incoming) expr += ' + carry ' + step.incoming;
  return expr;
}

function finishProblem(a, b, tier, rows, steps, answer) {
  return {
    a,
    b,
    tier,
    answer,
    answerDigits: toPlaces(answer),
    rows,
    steps,
    name: 'Reactor load'
  };
}

function buildProblem(a, b, tier, name) {
  const problem = buildStandard(a, b, tier);
  if (name) problem.name = name;
  return problem;
}

function skipped(step, problem) {
  return !!(step && step.skipIfHidden && problem.rows[step.rowIndex].hidden);
}

function nextIndex(problem, from) {
  for (let i = from; i < problem.steps.length; i++) {
    if (!skipped(problem.steps[i], problem)) return i;
  }
  return -1;
}

function visibleCount(problem) {
  return problem.steps.filter((step) => !skipped(step, problem)).length;
}

function visiblePos(problem, si) {
  let n = 0;
  for (let i = 0; i < si; i++) if (!skipped(problem.steps[i], problem)) n++;
  return n;
}

function currentStep() {
  if (!G.problem) return null;
  return G.problem.steps[G.si] || null;
}

function focusShift() {
  const step = currentStep();
  if (!step || !G.problem) return -1;
  if (step.type === 'answer' || step.type === 'answer-carry') return -1;
  if (step.rowIndex == null) return -1;
  return G.problem.rows[step.rowIndex].shift;
}

function setLesson(kind, title, detail) {
  G.lesson.kind = kind;
  G.lesson.title = title;
  G.lesson.detail = detail || '';
  const spoken = (title + ' ' + (detail || '')).trim();
  if (spoken !== G.lesson.spoken) {
    G.lesson.spoken = spoken;
    if (live) live.textContent = spoken;
  }
}

function applyStepLesson() {
  const step = currentStep();
  if (!step) return;
  setLesson('info', step.title, step.detail);
}

function startRun(list, name) {
  G.run = list;
  G.runName = name;
  G.pi = 0;
  G.score = 0;
  G.corrects = 0;
  G.wrongs = 0;
  G.paused = false;
  players.forEach((p) => {
    p.stars = 0;
    p.shields = 3;
    p.lock = 0;
    p.x = p.home[0];
    p.y = p.home[1];
  });
  loadProblem(0);
}

function loadProblem(index) {
  const spec = G.run[index];
  G.pi = index;
  G.problem = buildProblem(spec.a, spec.b, spec.tier, spec.name);
  players.forEach((p, i) => {
    p.x = 262 + i * 252;
    p.y = 652;
  });
  G.written = [];
  G.reveal = null;
  G.carryShow = null;
  G.charge = 0;
  G.override = null;
  G.meltdownAt = 0;
  G.celebrateBurst = false;
  G.paused = false;
  players.forEach((p) => {
    p.shields = 3;
    p.lock = 0;
  });
  G.mode = 'play';
  goTo(nextIndex(G.problem, 0));
}

function goTo(index) {
  G.si = index;
  G.phase = 'input';
  G.phaseT = 0;
  G.pods = 0;
  G.stepTime = 0;
  G.reveal = null;
  applyStepLesson();
  const done = visiblePos(G.problem, index);
  const total = Math.max(1, visibleCount(G.problem));
  G.charge = done / total;
}

function optionGain() {
  if (G.stepTime < 4) return 40;
  if (G.stepTime < 8) return 20;
  return 0;
}

function succeed(player, step, extra) {
  player.stars += 1;
  const gain = 100 * G.problem.tier + optionGain();
  G.score += gain;
  G.corrects += 1;
  audio.zap();
  burst(player.x, player.y, 16, player.color, 'spark');
  floatText(player.x, player.y - 28, '+' + gain, player.color);
  G.override = null;
  const title = player.short + ' locked the step';
  if (step.type === 'digit' || step.type === 'carry') {
    if (step.type === 'digit' || step.writesDigit) {
      writeWorkingDigit(step);
      G.carryShow = null;
    } else {
      G.carryShow = { place: step.place, value: step.write, rowIndex: step.rowIndex, onAnswer: false };
    }
    setLesson('good', title, step.success);
    G.phase = 'stamp';
    G.phaseT = 0;
  } else if (step.type === 'answer' || step.type === 'answer-carry') {
    if (step.type === 'answer' || step.writesDigit) {
      G.written[step.place] = step.write;
      G.carryShow = null;
    } else {
      G.carryShow = { place: step.place, value: step.write, onAnswer: true };
    }
    setLesson('good', title, step.success);
    G.phase = 'stamp';
    G.phaseT = 0;
  } else if (step.type === 'placeholder') {
    audio.latch(true);
    const row = G.problem.rows[step.rowIndex];
    row.clamped = true;
    row.revealed = Math.max(row.revealed || 0, step.count);
    if (step.zeroRow) row.filled = true;
    setLesson('good', 'Clamp sealed', step.zeroRow
      ? 'The zero row is locked in line. Columns stay in their place values.'
      : 'The ones side of this row is held by ' + step.count + ' zero pod' + (step.count > 1 ? 's' : '') + '.');
    G.phase = 'latch';
    G.phaseT = 0;
    burst(640, 420, 10, COL.cyan, 'steam');
  } else if (step.type === 'zero') {
    const row = G.problem.rows[step.rowIndex];
    if (extra === 'skip') {
      row.hidden = true;
      row.filled = true;
      retitleColumns();
      setLesson('good', player.short + ' skipped the zero row', 'A zero row can be skipped. The next digit still keeps its own placeholder zeros.');
    } else {
      row.hidden = false;
      setLesson('good', player.short + ' chose a zero row', 'Zero times the top number is zero. Clamp the placeholder pods so the row sits in the right columns.');
    }
    G.phase = 'stamp';
    G.phaseT = 0;
  }
}

function writeWorkingDigit(step) {
  const row = G.problem.rows[step.rowIndex];
  row.revealed = Math.max(row.revealed || 0, step.place + 1);
  if (digitsOf(G.problem.b).length === 1) G.written[step.place] = step.write;
}

function fail(player, reason) {
  if (player.lock > 0 || player.shields <= 0 || G.mode !== 'play' || G.phase !== 'input') return;
  player.shields -= 1;
  player.lock = player.shields <= 0 ? 999 : 2;
  G.wrongs += 1;
  G.shake = reduceMotion ? 0 : 1;
  audio.buzz();
  audio.klaxon();
  burst(player.x, player.y, 22, COL.bad, 'spark');
  spawnArc(player.x, player.y);
  burst(180, 300, 8, '#cfe8f4', 'steam');
  setLesson('bad', player.short + ' lost a shield', reason);
  G.override = { timer: 2.35 };
  if (players.every((p) => p.shields <= 0)) G.meltdownAt = 1.45;
}

function endStep() {
  const nxt = nextIndex(G.problem, G.si + 1);
  if (nxt < 0) celebrate();
  else goTo(nxt);
}

function celebrate() {
  G.mode = 'celebrate';
  G.phase = 'input';
  G.charge = 1;
  G.celebrateBurst = false;
  G.written = G.problem.answerDigits.slice();
  G.problem.rows.forEach((row) => {
    if (!row.hidden) row.filled = true;
  });
  setLesson('good', 'Turbine stable', fmt(G.problem.a) + ' × ' + fmt(G.problem.b) + ' = ' + fmt(G.problem.answer) + '. The city grid takes the load.');
  audio.turbine();
  audio.chord();
}

function chooseOption(player, option) {
  const step = currentStep();
  if (!step || G.phase !== 'input' || G.mode !== 'play') return;
  if (player.lock > 0 || player.shields <= 0) return;
  if (option.correct) {
    if (step.type === 'zero') succeed(player, step, option.key);
    else succeed(player, step);
  } else fail(player, option.reason);
}

function pressPlaceholder(player, which) {
  const step = currentStep();
  if (!step || step.type !== 'placeholder' || G.phase !== 'input') return;
  if (player.lock > 0 || player.shields <= 0) return;
  if (which === 'skip') {
    const row = G.problem.rows[step.rowIndex];
    const reason = step.zeroRow
      ? 'A zero row still needs its placeholder zeros so later columns stay lined up.'
      : (step.shift === 1
        ? 'Remember: Multiplying by the ' + step.digit + ' in ' + fmt(G.problem.b) + ' means multiplying by ' + fmt(step.digit * 10) + ', so insert a 0 first!'
        : 'Remember: Multiplying by the ' + step.digit + ' in ' + fmt(G.problem.b) + ' means multiplying by ' + fmt(step.digit * 10 ** step.shift) + ', so insert ' + step.shift + ' zeros first!');
    fail(player, reason);
    return;
  }
  if (G.pods >= step.count) return;
  G.pods += 1;
  audio.latch(false);
  burst(640, 400, 8, COL.amber, 'spark');
  if (G.pods >= step.count) succeed(player, step);
}

function updatePhase(dt) {
  if (G.mode !== 'play') return;
  G.phaseT += dt;
  if (G.phase === 'reveal') {
    const rev = G.reveal;
    const row = G.problem.rows[rev.rowIndex];
    if (!rev.trace) {
      if (G.phaseT > 0.85) {
        row.filled = true;
        endStep();
      }
      return;
    }
    rev.timer += dt;
    const slice = reduceMotion ? 0.12 : 0.42;
    if (rev.timer >= slice) {
      rev.timer = 0;
      rev.index += 1;
      audio.latch(false);
      if (rev.index >= rev.trace.length) {
        row.filled = true;
        endStep();
      }
    }
    return;
  }
  if (G.phase === 'stamp') {
    if (G.phaseT > 0.45) endStep();
    return;
  }
  if (G.phase === 'latch') {
    if (G.phaseT > 0.45) endStep();
  }
}

function createAudio() {
  let actx = null;
  let master = null;
  let sfxBus = null;
  let noiseBuf = null;
  let timer = null;
  let step = 0;
  let next = 0;
  let muted = false;
  try { muted = sessionStorage.getItem('power-grid-reactor-mute') === '1'; } catch (err) { muted = false; }

  function ensure() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) {
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.22;
      master.connect(actx.destination);
      const filter = actx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2200;
      const music = actx.createGain();
      music.gain.value = 0.8;
      music.connect(filter);
      filter.connect(master);
      sfxBus = actx.createGain();
      sfxBus.gain.value = 0.95;
      sfxBus.connect(master);
      const len = actx.sampleRate;
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      actx._music = music;
      next = actx.currentTime + 0.05;
      timer = setInterval(schedule, 25);
    }
    if (actx.state === 'suspended') actx.resume();
    if (next < actx.currentTime) next = actx.currentTime + 0.05;
  }

  function env(bus, time, dur, vol, freq, type, slide) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(36, freq), time);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(36, slide), time + dur);
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + Math.max(0.04, dur));
    o.connect(g);
    g.connect(bus);
    o.start(time);
    o.stop(time + dur + 0.03);
  }

  function noiseHit(time, dur, vol, freq) {
    if (!noiseBuf) return;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(freq, time);
    bp.Q.value = 0.6;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    src.connect(bp);
    bp.connect(g);
    g.connect(sfxBus);
    src.start(time);
    src.stop(time + dur + 0.02);
  }

  function hat(time, vol) {
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 7000;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.04);
    src.connect(hp);
    hp.connect(g);
    g.connect(actx._music);
    src.start(time);
    src.stop(time + 0.05);
  }

  function schedule() {
    if (!actx || G.paused) return;
    const beat = 60 / 136 / 4;
    while (next < actx.currentTime + 0.16) {
      playStep(step % 32, next);
      next += beat;
      step++;
    }
  }

  function playStep(i, time) {
    const bass = [55, 0, 55, 0, 110, 0, 82, 0, 82, 0, 82, 110, 55, 0, 73, 0, 65, 0, 65, 98, 49, 0, 65, 0, 73, 0, 82, 110, 55, 0, 82, 0];
    const arp = [220, 262, 330, 392, 440, 392, 330, 262, 220, 330, 392, 494, 523, 494, 392, 330, 196, 247, 294, 392, 440, 392, 330, 294, 220, 262, 330, 440, 392, 330, 262, 220];
    if (i % 8 === 0) env(actx._music, time, 0.18, 0.5, 150, 'sine', 46);
    if (i % 2 === 0) hat(time, i % 8 === 4 ? 0.05 : 0.028);
    if (bass[i]) env(actx._music, time, 0.14, 0.11, bass[i], 'square');
    if (i % 2 === 0) env(actx._music, time, 0.09, 0.035, arp[i], 'square');
    if (i % 8 === 4) env(actx._music, time, 0.12, 0.04, arp[i] * 2, 'triangle');
  }

  function now() { return actx ? actx.currentTime : 0; }

  return {
    ensure,
    get muted() { return muted; },
    toggle() {
      ensure();
      muted = !muted;
      try { sessionStorage.setItem('power-grid-reactor-mute', muted ? '1' : '0'); } catch (err) { /* ignore */ }
      if (master && actx) master.gain.setTargetAtTime(muted ? 0 : 0.22, actx.currentTime, 0.04);
      return muted;
    },
    zap() {
      if (!actx) return;
      noiseHit(now(), 0.07, 0.08, 1800);
      env(sfxBus, now(), 0.09, 0.06, 660, 'square', 990);
      env(sfxBus, now() + 0.04, 0.12, 0.04, 880, 'triangle');
    },
    latch(heavy) {
      if (!actx) return;
      env(sfxBus, now(), heavy ? 0.28 : 0.16, heavy ? 0.08 : 0.05, heavy ? 160 : 220, 'sine', 55);
      noiseHit(now(), 0.05, 0.05, 420);
    },
    buzz() {
      if (!actx) return;
      env(sfxBus, now(), 0.24, 0.05, 96, 'sawtooth', 54);
      noiseHit(now(), 0.2, 0.06, 700);
    },
    klaxon() {
      if (!actx) return;
      env(sfxBus, now(), 0.12, 0.04, 740, 'square');
      env(sfxBus, now() + 0.14, 0.16, 0.04, 520, 'square');
    },
    turbine() {
      if (!actx) return;
      env(sfxBus, now(), 0.9, 0.05, 80, 'sawtooth', 520);
      noiseHit(now(), 0.5, 0.04, 300);
    },
    chord() {
      if (!actx) return;
      [523, 659, 784, 1047].forEach((freq, i) => {
        env(sfxBus, now() + i * 0.045, 0.7, 0.05, freq, 'triangle');
        env(sfxBus, now() + i * 0.045, 0.5, 0.03, freq * 2, 'sine');
      });
    }
  };
}

function readPad(gp) {
  if (!gp) return { x: 0, y: 0, fire: false, start: false };
  let x = gp.axes && gp.axes.length ? gp.axes[0] || 0 : 0;
  let y = gp.axes && gp.axes.length > 1 ? gp.axes[1] || 0 : 0;
  if (Math.abs(x) < 0.28) x = 0;
  if (Math.abs(y) < 0.28) y = 0;
  const btn = (i) => {
    const b = gp.buttons && gp.buttons[i];
    if (!b) return false;
    return typeof b === 'object' ? !!b.pressed : !!b;
  };
  if (btn(12)) y = -1;
  if (btn(13)) y = 1;
  if (btn(14)) x = -1;
  if (btn(15)) x = 1;
  return { x, y, fire: btn(0) || btn(1), start: btn(9) };
}

function pollPads() {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  const out = [null, null, null];
  for (let i = 0; i < list.length; i++) {
    const gp = list[i];
    if (!gp || gp.index > 2) continue;
    out[gp.index] = gp;
  }
  return out;
}

function movePlayers(dt) {
  const pads = pollPads();
  players.forEach((p) => {
    const keys = KEYS[p.i];
    let mx = 0;
    let my = 0;
    if (held.has(keys.left)) mx -= 1;
    if (held.has(keys.right)) mx += 1;
    if (held.has(keys.up)) my -= 1;
    if (held.has(keys.down)) my += 1;
    const gp = pads[p.i];
    p.pad = !!gp;
    const pad = readPad(gp);
    if (pad.x || pad.y) {
      mx += pad.x;
      my += pad.y;
    }
    const mag = Math.hypot(mx, my);
    if (mag > 1) {
      mx /= mag;
      my /= mag;
    }
    if (mag > 0.04) {
      p.x += mx * 720 * dt;
      p.y += my * 720 * dt;
    }
    p.x = clamp(p.x, 24, LW - 24);
    p.y = clamp(p.y, 78, LH - 24);
    const fireDown = keys.fire.some((code) => held.has(code)) || pad.fire;
    if (fireDown && !p.fireDown) p.fireEdge = true;
    p.fireDown = fireDown;
    if (pad.start && !p.startDown) p.startEdge = true;
    p.startDown = pad.start;
    if (p.lock > 0 && p.lock < 100) p.lock = Math.max(0, p.lock - dt);
  });
}

function consumeEdges() {
  const edges = players.map((p) => p.fireEdge);
  players.forEach((p) => { p.fireEdge = false; });
  return edges;
}

function hitRect(px, py, r, pad) {
  const m = pad || 0;
  return px >= r.x - m && px <= r.x + r.w + m && py >= r.y - m && py <= r.y + r.h + m;
}

function nearestRect(px, py, rects, maxDist) {
  let best = null;
  let bestD = maxDist;
  rects.forEach((r) => {
    const cx = r.x + r.w / 2;
    const cy = r.y + r.h / 2;
    const d = Math.hypot(px - cx, py - cy);
    if (d < bestD) {
      bestD = d;
      best = r;
    }
  });
  return best;
}

function targetUnder(px, py, rects) {
  for (let i = rects.length - 1; i >= 0; i--) {
    if (hitRect(px, py, rects[i], 18)) return rects[i];
  }
  return nearestRect(px, py, rects, 68);
}

function burst(x, y, n, color, kind) {
  const count = reduceMotion ? Math.min(4, n) : n;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = kind === 'steam' ? 20 + Math.random() * 50 : 50 + Math.random() * 220;
    fx.push({
      kind,
      x,
      y,
      vx: Math.cos(a) * s * (kind === 'steam' ? 0.35 : 1),
      vy: kind === 'steam' ? -40 - Math.random() * 80 : Math.sin(a) * s,
      life: kind === 'steam' ? 0.8 + Math.random() * 0.6 : 0.35 + Math.random() * 0.4,
      age: 0,
      color,
      size: kind === 'steam' ? 8 + Math.random() * 10 : 2 + Math.random() * 3
    });
  }
  while (fx.length > 260) fx.shift();
}

function floatText(x, y, text, color) {
  fx.push({ kind: 'text', x, y, vx: 0, vy: -36, life: 0.8, age: 0, color, text, size: 18 });
}

function spawnArc(x, y) {
  fx.push({ kind: 'arc', x, y, life: 0.38, age: 0, seed: Math.random() * 100 });
}

function spawnFireworks() {
  for (let k = 0; k < 5; k++) {
    const x = 180 + Math.random() * 920;
    const y = 80 + Math.random() * 220;
    const color = [COL.cyan, COL.amber, COL.good, '#fff', COL.players[k % 3]][k];
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * Math.PI * 2;
      const s = 80 + Math.random() * 160;
      fx.push({
        kind: 'firework',
        x,
        y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.8 + Math.random() * 0.4,
        age: 0,
        color,
        size: 2 + Math.random() * 2
      });
    }
  }
}

function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    p.age += dt;
    if (p.age >= p.life) {
      fx.splice(i, 1);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.kind === 'spark' || p.kind === 'firework') p.vy += 280 * dt;
    if (p.kind === 'steam') p.vy -= 10 * dt;
  }
}

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function panel(x, y, w, h, r, fill, stroke) {
  roundRect(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function text(value, x, y, font, color, align) {
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(value, x, y);
}

function wrapLines(value, font, maxW) {
  ctx.font = font;
  const words = String(value).split(' ');
  const lines = [];
  let line = '';
  words.forEach((word) => {
    const trial = line ? line + ' ' + word : word;
    if (ctx.measureText(trial).width > maxW && line) {
      lines.push(line);
      line = word;
    } else line = trial;
  });
  if (line) lines.push(line);
  return lines;
}

function fitFont(value, maxW, base, min, weight, family) {
  let size = base;
  let font = weight + ' ' + size + 'px ' + family;
  ctx.font = font;
  while (size > min && ctx.measureText(value).width > maxW) {
    size -= 1;
    font = weight + ' ' + size + 'px ' + family;
    ctx.font = font;
  }
  return font;
}

function drawStar(x, y, r, color) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? r : r * 0.45;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const px = x + Math.cos(a) * rad;
    const py = y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawShield(x, y, s, on) {
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.lineTo(x + s * 0.85, y - s * 0.45);
  ctx.lineTo(x + s * 0.7, y + s * 0.55);
  ctx.lineTo(x, y + s);
  ctx.lineTo(x - s * 0.7, y + s * 0.55);
  ctx.lineTo(x - s * 0.85, y - s * 0.45);
  ctx.closePath();
  ctx.fillStyle = on ? '#7dfff0' : 'rgba(125,255,240,0.16)';
  ctx.fill();
  ctx.strokeStyle = on ? '#d8fff8' : 'rgba(125,255,240,0.28)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.cssW = window.innerWidth;
  view.cssH = window.innerHeight;
  view.dpr = dpr;
  canvas.width = Math.max(1, Math.round(view.cssW * dpr));
  canvas.height = Math.max(1, Math.round(view.cssH * dpr));
  view.scale = Math.min(view.cssW / LW, view.cssH / LH);
  view.ox = (view.cssW - LW * view.scale) / 2;
  view.oy = (view.cssH - LH * view.scale) / 2;
}

function toLogical(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (view.cssW / rect.width);
  const y = (clientY - rect.top) * (view.cssH / rect.height);
  return { x: (x - view.ox) / view.scale, y: (y - view.oy) / view.scale };
}

function neededCols(problem) {
  let cols = Math.max(digitsOf(problem.a).length, digitsOf(problem.b).length, problem.answerDigits.length);
  problem.rows.forEach((row) => { cols = Math.max(cols, row.digits.length); });
  if (G.carryShow) cols = Math.max(cols, G.carryShow.place + 1);
  return Math.max(1, cols);
}

function consoleBox() {
  return { x: 318, y: 122, w: 644, h: 408 };
}

function columnGeom() {
  const box = consoleBox();
  const cols = G.problem ? neededCols(G.problem) : 4;
  const colW = Math.min(52, Math.floor((box.w - 168) / cols));
  const onesX = box.x + box.w - 48 - colW / 2;
  return { box, cols, colW, onesX };
}

function colX(geom, place) {
  return geom.onesX - place * geom.colW;
}

function chipRects(n) {
  const w = n === 2 ? 320 : 236;
  const h = 76;
  const gap = 16;
  const total = n * w + (n - 1) * gap;
  const x0 = (LW - total) / 2;
  const y = 544;
  const rects = [];
  for (let i = 0; i < n; i++) {
    rects.push({
      x: x0 + i * (w + gap),
      y: y + Math.sin(G.t * 2.15 + i * 1.15) * (reduceMotion ? 0 : 4),
      w,
      h,
      i
    });
  }
  return rects;
}

function actionTargets() {
  if (G.mode !== 'play' || G.paused || G.phase !== 'input') return [];
  const step = currentStep();
  if (!step) return [];
  if (step.type === 'placeholder') {
    const rects = chipRects(2);
    rects[0].kind = 'clamp';
    rects[0].label = 'CLAMP A 0';
    rects[0].sub = G.pods + ' / ' + step.count + ' pods';
    rects[1].kind = 'skip';
    rects[1].label = 'START THE ROW';
    rects[1].sub = 'skip the zeros';
    return rects;
  }
  if (!step.options) return [];
  const rects = chipRects(step.options.length);
  step.options.forEach((opt, i) => {
    rects[i].kind = 'chip';
    rects[i].option = opt;
    rects[i].label = opt.label;
  });
  return rects;
}

function menuCards() {
  const cards = [
    { id: 't1', kicker: 'TIER 1', title: 'EASY', sub: 'Single-digit multiplier' },
    { id: 't2', kicker: 'TIER 2', title: 'MEDIUM', sub: 'Two-digit multiplier' },
    { id: 't3', kicker: 'TIER 3', title: 'HARD', sub: 'Zeros and 4-digit rows' },
    { id: 'all', kicker: 'FULL GRID', title: 'CAMPAIGN', sub: 'All nine reactor loads' }
  ];
  const w = 250;
  const h = 92;
  const gap = 18;
  const total = cards.length * w + (cards.length - 1) * gap;
  const x0 = (LW - total) / 2;
  return cards.map((card, i) => Object.assign({ x: x0 + i * (w + gap), y: 430, w, h }, card));
}

function handleFire(edges) {
  if (G.mode === 'title') {
    const cards = menuCards();
    players.forEach((p, i) => {
      if (!edges[i]) return;
      const card = targetUnder(p.x, p.y, cards);
      if (card) openCard(card.id);
    });
    return;
  }
  if (G.mode === 'celebrate' || G.mode === 'meltdown' || G.mode === 'victory') {
    if (edges.some(Boolean)) advanceOverlay();
    return;
  }
  if (G.mode === 'pause') {
    players.forEach((p, i) => {
      if (!edges[i]) return;
      const buttons = pauseButtons();
      const hit = targetUnder(p.x, p.y, buttons);
      if (hit && hit.id === 'resume') G.mode = 'play';
      if (hit && hit.id === 'quit') leaveToTitle();
    });
    return;
  }
  if (G.mode !== 'play' || G.phase !== 'input') return;
  const targets = actionTargets();
  players.forEach((p, i) => {
    if (!edges[i] || p.lock > 0 || p.shields <= 0) return;
    const hit = targetUnder(p.x, p.y, targets);
    if (!hit) return;
    if (hit.kind === 'clamp') pressPlaceholder(p, 'clamp');
    else if (hit.kind === 'skip') pressPlaceholder(p, 'skip');
    else if (hit.option) chooseOption(p, hit.option);
  });
}

function openCard(id) {
  audio.ensure();
  if (id === 't1') startRun(freshRun(1), 'Tier 1 · Easy');
  if (id === 't2') startRun(freshRun(2), 'Tier 2 · Medium');
  if (id === 't3') startRun(freshRun(3), 'Tier 3 · Hard');
  if (id === 'all') startRun(freshRun(), 'Full grid campaign');
}

function advanceOverlay() {
  if (G.mode === 'celebrate') {
    if (G.pi + 1 >= G.run.length) {
      G.mode = 'victory';
      setLesson('good', 'City grid online', 'Every reactor load in this run is stable.');
    } else loadProblem(G.pi + 1);
    return;
  }
  if (G.mode === 'meltdown') {
    loadProblem(G.pi);
    return;
  }
  if (G.mode === 'victory') leaveToTitle();
}

function leaveToTitle() {
  G.mode = 'title';
  G.paused = false;
  players.forEach((p) => {
    p.x = p.home[0];
    p.y = p.home[1];
    p.lock = 0;
  });
  setLesson('info', 'Power Grid Reactor', 'Choose a tier. Aim a reticle, then lock the correct power chip.');
}

function pauseButtons() {
  return [
    { id: 'resume', x: 470, y: 360, w: 160, h: 56, label: 'RESUME' },
    { id: 'quit', x: 650, y: 360, w: 160, h: 56, label: 'MENU' }
  ];
}

function update(dt) {
  G.t += dt;
  G.spin += dt * (0.35 + G.chargeShown * 2.8);
  G.chargeShown += (G.charge - G.chargeShown) * Math.min(1, dt * 3);
  if (G.mode === 'play' && !G.paused && G.phase === 'input') G.stepTime += dt;
  if (G.override && G.mode === 'play' && G.phase === 'input') {
    G.override.timer -= dt;
    if (G.override.timer <= 0) {
      G.override = null;
      applyStepLesson();
    }
  }
  if (G.meltdownAt > 0 && G.mode === 'play') {
    G.meltdownAt -= dt;
    if (G.meltdownAt <= 0) {
      G.mode = 'meltdown';
      G.meltdownAt = 0;
      setLesson('bad', 'Reactor tripped', fmt(G.problem.a) + ' × ' + fmt(G.problem.b) + ' = ' + fmt(G.problem.answer) + '. Shields are down. Review the product, then retry.');
    }
  }
  if ((G.mode === 'celebrate' || G.mode === 'victory') && !G.celebrateBurst) {
    G.celebrateBurst = true;
    spawnFireworks();
    burst(176, 250, 16, '#d5f4ff', 'steam');
    burst(176, 250, 16, '#d5f4ff', 'steam');
  }
  if (G.mode === 'play' && !G.paused) {
    if (Math.random() < dt * (0.8 + G.chargeShown * 2)) burst(176, 214, 1, '#d5f4ff', 'steam');
  }
  updatePhase(dt);
  updateFx(dt);
}

function drawBackdrop() {
  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, '#0c1c2e');
  g.addColorStop(0.45, '#07111c');
  g.addColorStop(1, '#04070d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, LW, LH);
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#123044';
  ctx.lineWidth = 1;
  for (let x = 40; x < LW; x += 48) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x - 80, LH);
    ctx.stroke();
  }
  ctx.restore();
  drawPipe(0, 108, LW, 0.55);
  drawPipe(0, 636, LW, 0.4);
  drawCity();
}

function drawPipe(x, y, w, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#1c4e66';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 10, y);
  ctx.lineTo(x + w - 10, y);
  ctx.stroke();
  ctx.strokeStyle = '#39d7ee';
  ctx.lineWidth = 3;
  ctx.stroke();
  const span = 90;
  for (let i = 0; i < 8; i++) {
    const px = ((G.t * 140 + i * span) % (w + span)) - span;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#e8fdff';
    ctx.beginPath();
    ctx.arc(px, y, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawCity() {
  const buildings = [
    [70, 28], [50, 40], [80, 24], [60, 48], [44, 32], [76, 52], [64, 36],
    [90, 30], [54, 44], [70, 26], [84, 50], [58, 34], [80, 28], [66, 42]
  ];
  let x = 16;
  const base = 716;
  buildings.forEach((b, i) => {
    const w = b[0];
    const h = b[1];
    ctx.fillStyle = '#050b12';
    ctx.fillRect(x, base - h, w, h);
    ctx.strokeStyle = '#16384c';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, base - h + 0.5, w - 1, h - 1);
    const lit = G.chargeShown > i / buildings.length;
    for (let wy = base - h + 8; wy < base - 8; wy += 12) {
      for (let wx = x + 6; wx < x + w - 8; wx += 12) {
        ctx.fillStyle = lit ? ((i + wx) % 5 === 0 ? '#ffe14a' : '#7fe7ff') : '#0c1824';
        ctx.fillRect(wx, wy, 5, 7);
      }
    }
    x += w + 8;
  });
}

function drawCore() {
  const x = 176;
  const y = 318;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(G.spin * 0.25);
  ctx.strokeStyle = 'rgba(62,240,255,0.35)';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.arc(0, 0, 108, 0.2, 1.6);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, 108, 2.4, 3.8);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,200,87,0.45)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(0, 0, 86, G.spin, G.spin + 2.2);
  ctx.stroke();
  ctx.restore();

  ctx.beginPath();
  ctx.arc(x, y, 70, 0, Math.PI * 2);
  const glow = ctx.createRadialGradient(x, y, 10, x, y, 70);
  glow.addColorStop(0, 'rgba(62,240,255,' + (0.25 + G.chargeShown * 0.55) + ')');
  glow.addColorStop(1, 'rgba(8,20,32,0.2)');
  ctx.fillStyle = glow;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = COL.cyan;
  ctx.stroke();

  for (let i = 0; i < 3; i++) {
    const a = G.spin * 0.6 + i * Math.PI * 2 / 3;
    const px = x + Math.cos(a) * 40;
    const py = y + Math.sin(a) * 40;
    ctx.beginPath();
    ctx.arc(px, py, 14, 0, Math.PI * 2);
    ctx.fillStyle = COL.players[i];
    ctx.globalAlpha = 0.35 + G.chargeShown * 0.6;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
  }
  text(Math.round(G.chargeShown * 100) + '%', x, y, '800 22px ' + DISP, COL.ink, 'center');
  text('CORE', x, y + 92, '800 12px ' + DISP, COL.dim, 'center');

  ctx.save();
  ctx.translate(176, 196);
  ctx.rotate(G.spin * (0.4 + G.chargeShown));
  ctx.strokeStyle = '#8fd0e4';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI * 1.4);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, 8, 1, Math.PI * 1.8);
  ctx.stroke();
  ctx.restore();
  text('STEAM', 176, 196, '800 9px ' + DISP, '#9fd7ea', 'center');
}

function drawGauge() {
  const x = 1104;
  const y = 318;
  ctx.beginPath();
  ctx.arc(x, y, 78, Math.PI * 0.75, Math.PI * 2.25);
  ctx.strokeStyle = '#143246';
  ctx.lineWidth = 12;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, 78, Math.PI * 0.75, Math.PI * 0.75 + Math.PI * 1.5 * G.chargeShown);

  text('CITY', x, y + 28, '800 12px ' + DISP, COL.dim, 'center');

function drawConsole() {
  if (!G.problem) return;
  const geom = columnGeom();
  const box = geom.box;
  panel(box.x, box.y, box.w, box.h, 18, 'rgba(7, 18, 30, 0.94)', 'rgba(62,240,255,0.45)');
  ctx.save();
  ctx.beginPath();
  roundRect(box.x + 8, box.y + 8, box.w - 16, box.h - 16, 12);
  ctx.clip();
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < geom.cols; i++) {
    const x = colX(geom, i);
    ctx.fillStyle = i % 2 ? '#7fe7ff' : '#ffffff';
    ctx.fillRect(x - geom.colW / 2, box.y, geom.colW, box.h);
  }
  ctx.restore();

  const tier = G.problem.tier;
  text(tier === 1 ? 'WORKING' : 'VERTICAL ALGORITHM', box.x + 22, box.y + 24, '800 12px ' + DISP, COL.cyan, 'left');
  text('STEP ' + (visiblePos(G.problem, G.si) + (G.mode === 'play' ? 1 : visibleCount(G.problem))) + ' / ' + visibleCount(G.problem), box.x + box.w - 22, box.y + 24, '800 12px ' + DISP, COL.dim, 'right');
  text(fmt(G.problem.a) + '  ×  ' + fmt(G.problem.b), box.x + box.w / 2, box.y + 52, '800 26px ' + DISP, COL.ink, 'center');

  const headY = box.y + 74;
  for (let i = 0; i < geom.cols; i++) {
    text(PLACE_SHORT[i] || '', colX(geom, i), headY, '800 11px ' + FONT, 'rgba(142,180,204,0.75)', 'center');
    ctx.strokeStyle = 'rgba(62,240,255,0.13)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(colX(geom, i), headY + 12);
    ctx.lineTo(colX(geom, i), box.y + box.h - 18);
    ctx.stroke();
  }

  drawNumberRow(geom, digitsOf(G.problem.a), box.y + 122, '#f4fbff');
  drawMultiplier(geom, box.y + 154);
  rule(geom, box.y + 176);

  let answerY = 0;
  if (G.problem.tier === 1) {
    answerY = box.y + 214;
    text('product', box.x + 24, answerY, '800 12px ' + FONT, COL.cyan, 'left');
    drawAnswer(geom, answerY);
  } else {
    const visible = G.problem.rows
      .map((row, index) => ({ row, index }))
      .filter((item) => !item.row.hidden);
    const row0 = box.y + 198;
    const stride = 30;
    visible.forEach((item, n) => {
      drawPartialRow(geom, item.row, item.index, row0 + n * stride);
    });
    const line2 = row0 + visible.length * stride + 4;
    rule(geom, line2);
    answerY = line2 + 22;
    text('sum', box.x + 24, answerY, '800 12px ' + FONT, COL.amber, 'left');
    drawAnswer(geom, answerY);
  }
  drawCarryOrbs(geom, answerY);

  if (G.phase === 'reveal' && G.reveal && G.reveal.trace && G.reveal.index >= 0 && G.reveal.index < G.reveal.trace.length) {
    const bit = G.reveal.trace[G.reveal.index];
    const caption = bit.leading
      ? 'The leftover carry ' + bit.carryIn + ' becomes the next digit.'
      : bit.digit + ' × ' + G.problem.rows[G.reveal.rowIndex].digit + (bit.carryIn ? ' + carry ' + bit.carryIn : '') + ' = ' + bit.raw + '  →  write ' + bit.write + (bit.carryOut ? ', carry ' + bit.carryOut : '');
    const captionY = box.y + box.h - 16;
    if (!answerY || captionY > answerY + 24) {
      text(caption, box.x + box.w / 2, captionY, '800 13px ' + FONT, COL.amber, 'center');
    }
  }
}

function rule(geom, y) {
  ctx.strokeStyle = 'rgba(234,246,255,0.75)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(geom.box.x + 120, y);
  ctx.lineTo(geom.box.x + geom.box.w - 28, y);
  ctx.stroke();
}

function drawCarryOrbs(geom, answerY) {
  const orb = G.carryShow;
  if (!orb || !orb.value) return;
  const x = colX(geom, orb.place);
  const y = (orb.onAnswer && answerY ? answerY - 30 : geom.box.y + 98) + Math.sin(G.t * 4 + orb.place) * 2;
  ctx.beginPath();
  ctx.arc(x, y, 11, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 200, 87, 0.9)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#fff6d2';
  ctx.stroke();
  text(String(orb.value), x, y + 0.5, '900 12px ' + FONT, '#3a2a08', 'center');
}

function drawNumberRow(geom, msdFirst, y, color) {
  const ds = msdFirst.slice().reverse();
  const hot = activeTopPlace();
  ds.forEach((d, place) => {
    const x = colX(geom, place);
    if (place === hot) {
      ctx.save();
      ctx.globalAlpha = pulse(5, 0.35, 0.85);
      roundRect(x - 16, y - 16, 32, 32, 8);
      ctx.fillStyle = 'rgba(62,240,255,0.2)';
      ctx.fill();
      ctx.restore();
    }
    text(String(d), x, y, '800 28px ' + DISP, place === hot ? COL.cyan : color, 'center');
  });
}

function activeTopPlace() {
  const step = currentStep();
  if (!step || step.type !== 'digit') return -1;
  return step.aCol;
}

function drawMultiplier(geom, y) {
  const ds = digitsOf(G.problem.b);
  const focus = focusShift();
  ds.slice().reverse().forEach((d, place) => {
    const x = colX(geom, place);
    if (place === focus) {
      ctx.save();
      ctx.globalAlpha = pulse(5, 0.35, 0.85);
      roundRect(x - 16, y - 16, 32, 32, 8);
      ctx.fillStyle = 'rgba(62,240,255,0.18)';
      ctx.fill();
      ctx.restore();
    }
    text(String(d), x, y, '800 28px ' + DISP, place === focus ? COL.cyan : '#f4fbff', 'center');
  });
  const left = colX(geom, ds.length - 1) - geom.colW * 0.85;
  text('×', left, y, '800 26px ' + DISP, COL.amber, 'center');
}

function drawPartialRow(geom, row, index, y) {
  const step = currentStep();
  const active = G.mode === 'play' && step && step.rowIndex === index && (step.type === 'digit' || step.type === 'carry' || step.type === 'placeholder' || step.type === 'zero');
  if (active) {
    ctx.save();
    ctx.globalAlpha = pulse(4, 0.12, 0.28);
    ctx.fillStyle = COL.cyan;
    ctx.fillRect(geom.box.x + 16, y - 14, geom.box.w - 32, 28);
    ctx.restore();
  }
  text(row.label, geom.box.x + 24, y, '800 12px ' + FONT, active ? COL.cyan : COL.dim, 'left');
  if (step && step.type === 'placeholder' && step.rowIndex === index && G.phase === 'input') {
    drawPods(geom, step.count, y);
    return;
  }
  const show = shownDigits(row);
  show.forEach((d, place) => {
    if (place < row.shift) drawPod(colX(geom, place), y, true);
    else text(String(d), colX(geom, place), y, '800 24px ' + DISP, '#d9fbff', 'center');
  });
  if (G.mode === 'play' && G.phase === 'input' && step && step.rowIndex === index) {
    const dropping = step.type === 'digit' || (step.type === 'carry' && step.writesDigit);
    if (dropping && (row.revealed || 0) <= step.place) {
      text('·', colX(geom, step.place), y, '800 24px ' + DISP, COL.amber, 'center');
    }
  }
}

function shownDigits(row) {
  if (row.hidden) return [];
  if (row.filled) return row.digits;
  const n = Math.max(row.revealed || 0, row.clamped && row.shift > 0 ? row.shift : 0);
  return row.digits.slice(0, n);
}

function drawPods(geom, count, y) {
  if (count > 0) {
    const left = colX(geom, count - 1) - 22;
    const right = colX(geom, 0) + 22;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,200,87,0.9)';
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(left, y - 22);
    ctx.lineTo(left, y + 18);
    ctx.lineTo(right, y + 18);
    ctx.lineTo(right, y - 22);
    ctx.stroke();
    ctx.restore();
  }
  for (let i = 0; i < count; i++) drawPod(colX(geom, i), y, i < G.pods);
}

function drawPod(x, y, filled) {
  ctx.beginPath();
  ctx.arc(x, y, 13, 0, Math.PI * 2);
  ctx.fillStyle = filled ? 'rgba(255,200,87,0.95)' : 'rgba(8, 20, 32, 0.8)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = filled ? '#fff1c2' : COL.amber;
  ctx.stroke();
  if (filled) text('0', x, y + 0.5, '800 14px ' + DISP, '#3a2a08', 'center');
}

function drawAnswer(geom, y) {
  const step = currentStep();
  const activePlace = step && G.mode === 'play' && (step.type === 'digit' || step.type === 'carry' || step.type === 'answer' || step.type === 'answer-carry')
    ? step.place
    : -1;
  if (activePlace >= 0) {
    ctx.save();
    ctx.globalAlpha = pulse(5, 0.1, 0.22);
    ctx.fillStyle = COL.amber;
    ctx.fillRect(colX(geom, activePlace) - geom.colW / 2, geom.box.y + 186, geom.colW, geom.box.h - 210);
    ctx.restore();
  }
  const digits = G.written;
  for (let i = 0; i < digits.length; i++) {
    if (digits[i] == null) continue;
    text(String(digits[i]), colX(geom, i), y, '800 28px ' + DISP, COL.good, 'center');
  }
  const onLine = step && G.mode === 'play' && G.phase === 'input' && (
    step.type === 'answer'
    || (step.type === 'answer-carry' && step.writesDigit)
    || (digitsOf(G.problem.b).length === 1 && (step.type === 'digit' || (step.type === 'carry' && step.writesDigit)))
  );
  if (onLine && digits[step.place] == null) {
    text('·', colX(geom, step.place), y, '800 28px ' + DISP, COL.amber, 'center');
  }
}

function drawTargets() {
  const targets = G.mode === 'play' ? actionTargets() : [];
  targets.forEach((target) => {
    let hover = null;
    players.forEach((p) => {
      if (hitRect(p.x, p.y, target, 8)) hover = p;
    });
    const border = hover ? hover.color : (target.kind === 'skip' ? 'rgba(255,200,87,0.7)' : 'rgba(62,240,255,0.75)');
    panel(target.x, target.y, target.w, target.h, 16, 'rgba(10, 28, 44, 0.95)', border);
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = border;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(target.x + 18, target.y + 10);
    ctx.lineTo(target.x + target.w - 18, target.y + 10);
    ctx.stroke();
    ctx.restore();
    const labelFont = fitFont(target.label, target.w - 24, target.kind === 'chip' && target.label.length < 14 ? 26 : 18, 13, '800', target.kind === 'chip' && /\d/.test(target.label) ? DISP : FONT);
    text(target.label, target.x + target.w / 2, target.y + (target.sub ? 30 : target.h / 2), labelFont, COL.ink, 'center');
    if (target.sub) text(target.sub, target.x + target.w / 2, target.y + 54, '800 13px ' + FONT, COL.dim, 'center');
  });
}

function drawFxLayer() {
  fx.forEach((p) => {
    const k = 1 - p.age / p.life;
    ctx.save();
    ctx.globalAlpha = Math.max(0, k);
    if (p.kind === 'text') {
      text(p.text, p.x, p.y, '900 18px ' + FONT, p.color, 'center');
    } else if (p.kind === 'arc') {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      let x = p.x;
      let y = p.y;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let i = 0; i < 6; i++) {
        x += Math.sin(p.seed * 12 + i * 3 + p.age * 40) * 18;
        y += 10 + (i % 2 ? 8 : -4);
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.strokeStyle = COL.bad;
      ctx.lineWidth = 4;
      ctx.globalAlpha *= 0.5;
      ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.kind === 'steam' ? (1 + p.age) : 1), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
}

function drawReticle(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  const offline = p.shields <= 0;
  ctx.globalAlpha = p.lock > 0 ? 0.4 : 1;
  ctx.strokeStyle = offline ? '#66788a' : p.color;
  ctx.fillStyle = offline ? '#66788a' : p.color;
  ctx.lineWidth = 2.5;
  if (p.i === 1) {
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(16, 0);
    ctx.lineTo(0, 18);
    ctx.lineTo(-16, 0);
    ctx.closePath();
    ctx.stroke();
  } else if (p.i === 2) {
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(16, 14);
    ctx.lineTo(-16, 14);
    ctx.closePath();
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(-28, 0); ctx.lineTo(-8, 0);
  ctx.moveTo(8, 0); ctx.lineTo(28, 0);
  ctx.moveTo(0, -28); ctx.lineTo(0, -8);
  ctx.moveTo(0, 8); ctx.lineTo(0, 28);
  ctx.stroke();
  text(p.short, 20, -20, '900 12px ' + FONT, p.color, 'left');
  if (p.lock > 0 && p.lock < 100) {
    text(p.lock.toFixed(1) + 's', 0, 36, '800 12px ' + FONT, COL.bad, 'center');
  } else if (offline) {
    text('OFFLINE', 0, 36, '800 11px ' + FONT, '#66788a', 'center');
  }
  ctx.restore();
}

function drawHUD() {
  players.forEach((p, i) => {
    const x = 16 + i * 168;
    panel(x, 10, 158, 46, 12, 'rgba(6,16,28,0.88)', p.color);
    text(p.short, x + 14, 26, '900 13px ' + FONT, p.color, 'left');
    text('★ ' + p.stars, x + 14, 42, '800 12px ' + FONT, COL.amber, 'left');
    for (let s = 0; s < 3; s++) drawShield(x + 92 + s * 20, 32, 8, s < p.shields);
  });
  const muteX = 1164;
  panel(muteX, 12, 100, 42, 12, 'rgba(6,16,28,0.88)', audio.muted ? COL.bad : COL.cyan);
  hotspots.push({ id: 'mute', x: muteX, y: 12, w: 100, h: 42 });
  text(audio.muted ? 'MUTED' : 'SOUND', muteX + 50, 33, '800 13px ' + DISP, audio.muted ? COL.bad : COL.cyan, 'center');

  const lessonY = 64;
  const kindColor = G.lesson.kind === 'bad' ? COL.bad : G.lesson.kind === 'good' ? COL.good : COL.cyan;
  panel(16, lessonY, LW - 32, 50, 12, 'rgba(8, 20, 32, 0.92)', kindColor);
  text(G.lesson.title || 'Power Grid Reactor', 32, lessonY + 16, '800 15px ' + FONT, kindColor, 'left');
  const detailFont = fitFont(G.lesson.detail || ' ', LW - 70, 14, 11, '800', FONT);
  text(G.lesson.detail || '', 32, lessonY + 36, detailFont, COL.ink, 'left');
}

function drawTitle() {
  text('POWER GRID REACTOR', LW / 2, 168, '800 42px ' + DISP, COL.cyan, 'center');
  text('MULTI-CORE TURBINE', LW / 2, 214, '800 20px ' + DISP, COL.amber, 'center');
  const lines = wrapLines('Stabilize the city grid. Multiply one digit at a time, write that digit, and carry the rest. Every run deals a new set of questions. Any engineer can lock a chip. The first correct lock earns a star. A wrong chip drops one shield.', '800 16px ' + FONT, 640);
  lines.forEach((line, i) => text(line, 690, 276 + i * 22, '800 16px ' + FONT, COL.ink, 'center'));

  menuCards().forEach((card) => {
    let hover = null;
    players.forEach((p) => { if (hitRect(p.x, p.y, card, 0)) hover = p; });
    panel(card.x, card.y, card.w, card.h, 16, 'rgba(8,22,36,0.94)', hover ? hover.color : 'rgba(62,240,255,0.55)');
    text(card.kicker, card.x + card.w / 2, card.y + 24, '800 12px ' + DISP, COL.cyan, 'center');
    text(card.title, card.x + card.w / 2, card.y + 50, '800 22px ' + DISP, COL.ink, 'center');
    text(card.sub, card.x + card.w / 2, card.y + 74, '800 12px ' + FONT, COL.dim, 'center');
  });

  const pads = players.map((p) => p.pad ? p.short + ' PAD' : p.short + ' KEYS').join('   ·   ');
  text(pads, LW / 2, 556, '800 13px ' + FONT, COL.dim, 'center');
  text('P1  arrows + space      P2  W A S D + F      P3  I J K L + H', LW / 2, 582, '800 14px ' + FONT, COL.ink, 'center');
  text('Gamepad stick or D-pad aims. A confirms. M mutes. P pauses. Keys 1–4 start a tier.', LW / 2, 608, '800 14px ' + FONT, COL.dim, 'center');
  if (G.testErrors.length) {
    text('Math check failed: ' + G.testErrors[0], LW / 2, 640, '800 14px ' + FONT, COL.bad, 'center');
  }
}

function drawCard(title, lines, buttons) {
  ctx.save();
  ctx.fillStyle = 'rgba(2, 6, 12, 0.55)';
  ctx.fillRect(0, 0, LW, LH);
  ctx.restore();
  panel(300, 180, 680, 340, 20, 'rgba(6,16,28,0.96)', COL.cyan);
  text(title, LW / 2, 230, '800 28px ' + DISP, COL.cyan, 'center');
  lines.forEach((line, i) => text(line.text, LW / 2, 280 + i * 28, line.font, line.color, 'center'));
  buttons.forEach((btn) => {
    panel(btn.x, btn.y, btn.w, btn.h, 12, '#102536', COL.amber);
    text(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2, '800 16px ' + DISP, COL.amber, 'center');
  });
}

function drawOverlay() {
  if (G.mode === 'celebrate' && G.problem) {
    drawCard('TURBINE STABLE', [
      { text: fmt(G.problem.a) + '  ×  ' + fmt(G.problem.b) + '  =  ' + fmt(G.problem.answer), font: '800 28px ' + DISP, color: COL.good },
      { text: G.problem.name, font: '800 16px ' + FONT, color: COL.ink },
      { text: 'City output ' + fmt(G.score) + ' MW', font: '800 16px ' + FONT, color: COL.amber },
      { text: 'A, space, F, or H continues', font: '800 14px ' + FONT, color: COL.dim }
    ], [{ x: 500, y: 430, w: 280, h: 52, label: G.pi + 1 >= G.run.length ? 'GRID REPORT' : 'NEXT LOAD' }]);
  } else if (G.mode === 'meltdown' && G.problem) {
    drawCard('REACTOR TRIPPED', [
      { text: fmt(G.problem.a) + '  ×  ' + fmt(G.problem.b) + '  =  ' + fmt(G.problem.answer), font: '800 26px ' + DISP, color: COL.amber },
      { text: 'All three shields are down.', font: '800 16px ' + FONT, color: COL.ink },
      { text: 'Study the product, then bring the turbine back.', font: '800 16px ' + FONT, color: COL.dim },
      { text: 'A, space, F, or H retries', font: '800 14px ' + FONT, color: COL.dim }
    ], [{ x: 500, y: 430, w: 280, h: 52, label: 'RETRY LOAD' }]);
  } else if (G.mode === 'victory') {
    const stars = players.map((p) => p.short + ' ★ ' + p.stars).join('     ');
    drawCard('CITY GRID ONLINE', [
      { text: G.runName, font: '800 16px ' + FONT, color: COL.ink },
      { text: G.run.length + ' loads stable', font: '800 18px ' + FONT, color: COL.good },
      { text: 'City output ' + fmt(G.score) + ' MW', font: '800 20px ' + DISP, color: COL.amber },
      { text: stars, font: '800 16px ' + FONT, color: COL.ink }
    ], [{ x: 500, y: 430, w: 280, h: 52, label: 'MAIN MENU' }]);
  } else if (G.mode === 'pause') {
    drawCard('GRID PAUSED', [
      { text: 'Reticles can resume or leave the turbine.', font: '800 16px ' + FONT, color: COL.ink },
      { text: 'P also resumes.', font: '800 14px ' + FONT, color: COL.dim }
    ], pauseButtons());
  }
}

function draw() {
  hotspots.length = 0;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = '#04070d';
  ctx.fillRect(0, 0, view.cssW, view.cssH);
  ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale, view.dpr * view.ox, view.dpr * view.oy);
  ctx.clearRect(-40, -40, LW + 80, LH + 80);

  const shake = G.shake > 0 ? G.shake * 7 : 0;
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackdrop();
  drawCore();
  drawGauge();
  if (G.mode !== 'title') drawConsole();
  if (G.mode === 'play') drawTargets();
  drawFxLayer();
  ctx.restore();

  players.forEach(drawReticle);
  if (G.mode === 'title') drawTitle();
  drawHUD();
  drawOverlay();
  G.shake = Math.max(0, G.shake - 0.05);
}

function frame(ts) {
  if (!frame.prev) frame.prev = ts;
  let dt = (ts - frame.prev) / 1000;
  frame.prev = ts;
  dt = clamp(dt, 0, 0.05);
  movePlayers(dt);
  const edges = consumeEdges();
  if (players.some((p) => p.startEdge)) {
    players.forEach((p) => { p.startEdge = false; });
    if (G.mode === 'play') G.mode = 'pause';
    else if (G.mode === 'pause') G.mode = 'play';
  }
  handleFire(edges);
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

function onKeyDown(e) {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  held.add(e.code);
  audio.ensure();
  if (e.code === 'KeyM' && !e.repeat) audio.toggle();
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) {
    if (G.mode === 'play') G.mode = 'pause';
    else if (G.mode === 'pause') G.mode = 'play';
  }
  if (!e.repeat && G.mode === 'title') {
    if (e.code === 'Digit1') openCard('t1');
    if (e.code === 'Digit2') openCard('t2');
    if (e.code === 'Digit3') openCard('t3');
    if (e.code === 'Digit4') openCard('all');
  }
  if (!e.repeat && e.code === 'Enter' && (G.mode === 'celebrate' || G.mode === 'meltdown' || G.mode === 'victory')) {
    advanceOverlay();
  }
}

function onKeyUp(e) { held.delete(e.code); }

function onPointer(e) {
  const pt = toLogical(e.clientX, e.clientY);
  pointer.x = pt.x;
  pointer.y = pt.y;
  pointer.over = true;
  players[0].x = clamp(pt.x, 24, LW - 24);
  players[0].y = clamp(pt.y, 78, LH - 24);
}

function onPointerDown(e) {
  audio.ensure();
  onPointer(e);
  const spot = hotspots.slice().reverse().find((h) => hitRect(pointer.x, pointer.y, h, 0));
  if (spot && spot.id === 'mute') {
    audio.toggle();
    return;
  }
  if (G.mode === 'title') {
    const card = menuCards().find((item) => hitRect(pointer.x, pointer.y, item, 0));
    if (card) openCard(card.id);
    return;
  }
  if (G.mode === 'pause') {
    const hit = pauseButtons().find((item) => hitRect(pointer.x, pointer.y, item, 0));
    if (hit && hit.id === 'resume') G.mode = 'play';
    if (hit && hit.id === 'quit') leaveToTitle();
    return;
  }
  if (G.mode === 'celebrate' || G.mode === 'meltdown' || G.mode === 'victory') {
    advanceOverlay();
    return;
  }
  players[0].fireEdge = true;
}

window.addEventListener('resize', resize);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
canvas.addEventListener('pointermove', onPointer);
canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', () => { pointer.down = false; });
window.addEventListener('gamepadconnected', () => audio.ensure());

const FIXTURES = [
  { tier: 1, a: 9, b: 5 },
  { tier: 1, a: 23, b: 8 },
  { tier: 1, a: 478, b: 6 },
  { tier: 2, a: 29, b: 35 },
  { tier: 2, a: 169, b: 83 },
  { tier: 2, a: 7639, b: 42 },
  { tier: 3, a: 478, b: 391 },
  { tier: 3, a: 8395, b: 601 },
  { tier: 3, a: 7492, b: 5738 }
];

function runSelfTest() {
  const errors = [];
  const samples = FIXTURES.slice();
  for (let n = 0; n < 8; n++) SHAPES.forEach((shape) => samples.push(rollSpec(shape)));
  samples.forEach((spec) => {
    const problem = buildProblem(spec.a, spec.b, spec.tier);
    if (problem.answer !== spec.a * spec.b) errors.push('product ' + spec.a + '×' + spec.b);
    const rowSum = problem.rows.reduce((s, row) => s + fromPlaces(row.digits), 0);
    if (rowSum !== problem.answer) errors.push('rows ' + spec.a + '×' + spec.b + '=' + rowSum);
    problem.rows.forEach((row) => {
      if (row.digit === 0) return;
      if (fromPlaces(row.digits) !== row.shifted) errors.push('shift ' + spec.a + '×' + row.factor);
      if (row.trace) {
        const writes = row.trace.map((bit) => bit.write);
        const body = fromPlaces(writes);
        if (body !== row.product) errors.push('trace ' + spec.a + '×' + row.digit + '=' + body);
      }
    });
    const written = [];
    let expectCarry = 0;
    let sawAnswer = false;
    problem.steps.forEach((step) => {
      if (step.type === 'digit' || step.type === 'carry' || step.type === 'answer' || step.type === 'answer-carry') {
        if (step.write < 0 || step.write > 9) errors.push('range ' + spec.a + ' ' + step.title);
      }
      if (step.type === 'digit' || (step.type === 'carry' && step.writesDigit)) {
        if (problem.rows[step.rowIndex].digits[step.place] !== step.write) errors.push('place ' + spec.a + '×' + spec.b + ' ' + step.title);
      }
      if (step.type === 'answer') {
        sawAnswer = true;
        if (step.incoming !== expectCarry) errors.push('carry in ' + spec.a + '×' + spec.b);
        if (step.total !== step.addends.reduce((s, d) => s + d, 0) + step.incoming) errors.push('total ' + spec.a);
        if (step.write !== step.total % 10) errors.push('ones ' + spec.a);
        written[step.place] = step.write;
        expectCarry = step.carryOut;
      }
      if (step.type === 'answer-carry' && step.writesDigit) written[step.place] = step.write;
    });
    if (digitsOf(spec.b).length > 1) {
      if (!sawAnswer) errors.push('no add ' + spec.a + '×' + spec.b);
      if (fromPlaces(written) !== problem.answer) errors.push('columns ' + spec.a + '×' + spec.b + '=' + fromPlaces(written));
    }
    problem.steps.forEach((step) => {
      if (!step.options) return;
      const labels = new Set(step.options.map((opt) => opt.label));
      if (step.options.length !== 4 || labels.size !== 4) errors.push('options ' + spec.a + ' ' + step.type + ' ' + step.title);
      const nCorrect = step.options.filter((opt) => opt.correct).length;
      if (step.type === 'zero') {
        if (nCorrect !== 2) errors.push('zero corrects ' + spec.a);
      } else if (nCorrect !== 1) errors.push('corrects ' + spec.a + ' ' + step.title);
      step.options.forEach((opt) => {
        if (!opt.correct && opt.reason && opt.reason.indexOf(fmt(step.options.find((item) => item.correct).value)) !== -1 && step.type !== 'zero') {
          errors.push('leak ' + spec.a + ' ' + step.title);
        }
      });
    });
    const zeros = digitsOf(spec.b).filter((d) => d === 0).length;
    const zeroSteps = problem.steps.filter((step) => step.type === 'zero').length;
    if (zeros !== zeroSteps) errors.push('zero steps ' + spec.a + '×' + spec.b);
  });
  for (let n = 0; n < 20; n++) {
    SHAPES.forEach((shape) => {
      const rolled = rollSpec(shape);
      if (String(rolled.a).length !== shape.aLen) errors.push('length a ' + rolled.a);
      if (String(rolled.b).length !== shape.bLen) errors.push('length b ' + rolled.b);
      if ((rolled.a % 10) * (rolled.b % 10) < 10) errors.push('no carry ' + rolled.a + '×' + rolled.b);
      String(rolled.a).split('').forEach((ch) => {
        if (Number(ch) < 2) errors.push('digit a ' + rolled.a);
      });
      String(rolled.b).split('').forEach((ch, index, all) => {
        const fromRight = all.length - 1 - index;
        if (fromRight === shape.zeroAt) {
          if (ch !== '0') errors.push('zero missing ' + rolled.b);
        } else if (Number(ch) < 2) errors.push('digit b ' + rolled.b);
      });
    });
  }
  const seen = new Set();
  for (let n = 0; n < 12; n++) seen.add(freshRun(1).map((item) => item.a + '×' + item.b).join(','));
  if (seen.size < 2) errors.push('runs identical');
  return errors;
}

G.testErrors = runSelfTest();
setLesson('info', 'Power Grid Reactor', 'Choose a tier. Aim a reticle, then lock the correct power chip.');
resize();
requestAnimationFrame(frame);
</script>
