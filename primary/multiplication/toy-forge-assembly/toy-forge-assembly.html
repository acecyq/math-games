  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%;
    height: 100%;

    background: #8fd4ff;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>

  };

  const TOYS = [
    { id: 'robot', title: 'TOY ROBOTS', plural: 'robots', one: 'robot', tens: 'Body Bolts', ones: 'Head Antennas', body: '#3b82f6', accent: '#fbbf24' },
    { id: 'car', title: 'RACE CARS', plural: 'race cars', one: 'race car', tens: 'Chassis Screws', ones: 'Spoiler Pins', body: '#ef4444', accent: '#67e8f9' },
    { id: 'rocket', title: 'SPACE ROCKETS', plural: 'space rockets', one: 'space rocket', tens: 'Hull Rivets', ones: 'Fin Pins', body: '#7c3aed', accent: '#fb7185' },
    { id: 'owl', title: 'CLOCKWORK OWLS', plural: 'clockwork owls', one: 'clockwork owl', tens: 'Gear Cogs', ones: 'Wing Springs', body: '#d97706', accent: '#38bdf8' },
    { id: 'dino', title: 'DINO BOTS', plural: 'dino bots', one: 'dino bot', tens: 'Spine Plates', ones: 'Tail Bolts', body: '#0f766e', accent: '#facc15' },
    { id: 'bear', title: 'TEDDY BEARS', plural: 'teddy bears', one: 'teddy bear', tens: 'Stuffing Puffs', ones: 'Button Eyes', body: '#b45309', accent: '#fb7185' }
  ];

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;
  let animT = 0;
  let lastNow = performance.now();

  function resize() {
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(winW * dpr));
    canvas.height = Math.max(1, Math.floor(winH * dpr));
    scale = Math.min(winW / VW, winH / VH);
    offsetX = (winW - VW * scale) / 2;
    offsetY = (winH - VH * scale) / 2;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offsetX, dpr * offsetY);
  }
  window.addEventListener('resize', resize);
  resize();

  function screenToVirtual(clientX, clientY) {
    return { x: (clientX - offsetX) / scale, y: (clientY - offsetY) / scale };
  }
  function pointIn(px, py, r) {
    return px >= r.x && py >= r.y && px <= r.x + r.w && py <= r.y + r.h;
  }
  function rand(a, b) {
    return a + Math.floor(Math.random() * (b - a + 1));
  }
  function choice(arr) {
    return arr[rand(0, arr.length - 1)];
  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }
  function fmt(n) {
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function formatTime(sec) {
    const s = Math.max(0, Math.ceil(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function signOf(op) {
    return op === '-' ? '−' : '+';
  }
  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  function roundRect(x, y, w, h, r, fill, stroke, lw) {
    const radius = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lw || 2;
      ctx.stroke();
    }
  }

  function text(str, x, y, font, color, align) {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  function wrapLines(str, maxWidth, maxLines) {
    const words = String(str).split(' ');
    const lines = [];
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = words[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    if (lines.length <= maxLines) return lines;
    const kept = lines.slice(0, maxLines);
    let last = kept[maxLines - 1];
    while (last.length > 1 && ctx.measureText(last + '…').width > maxWidth) last = last.slice(0, -1);
    kept[maxLines - 1] = last + '…';
    return kept;
  }

  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.unlocked = false;
      this.stepIdx = 0;
      this.timer = null;
      this.humGain = null;
    }

    unlock() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!this.ctx) this.ctx = new AudioCtx();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      if (!this.unlocked) {
        this.unlocked = true;
        this.startHum();
        this.startBGM();
      }
    }

    toggleMute() {
      this.unlock();
      this.muted = !this.muted;
      this.applyHum();
      if (!this.muted && this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }

    applyHum() {
      if (!this.humGain || !this.ctx) return;
      const target = this.muted ? 0 : (game.screen === 'PLAYING' ? 0.02 : 0.008);
      this.humGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.05);
    }

    playTone(freq, type, duration, vol, delay, slideTo) {
      if (this.muted || !this.ctx) return;
      const now = this.ctx.currentTime + (delay || 0);
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(Math.max(40, freq), now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), now + duration);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.03);
    }

    playNoise(duration, vol) {
      if (this.muted || !this.ctx) return;
      const length = Math.floor(this.ctx.sampleRate * duration);
      const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 900;
      const gain = this.ctx.createGain();
      const now = this.ctx.currentTime;
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      src.start(now);
      src.stop(now + duration + 0.02);
    }

    playClick() {
      this.playTone(880, 'square', 0.04, 0.03);
    }

    playTick() {
      this.playTone(660, 'sine', 0.035, 0.02);
    }

    playDrop() {
      this.playNoise(0.06, 0.04);
      this.playTone(740, 'triangle', 0.12, 0.07, 0);
      this.playTone(988, 'sine', 0.16, 0.06, 0.07);
      this.playTone(1318, 'sine', 0.14, 0.04, 0.14);
    }

    playBell() {
      this.playTone(1568, 'sine', 0.42, 0.09, 0);
      this.playTone(2093, 'sine', 0.32, 0.04, 0.02);
    }

    playBuzz() {
      this.playTone(150, 'sawtooth', 0.22, 0.07, 0, 78);
      this.playTone(98, 'square', 0.2, 0.04, 0.06);
    }

    playFanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      for (let i = 0; i < notes.length; i++) this.playTone(notes[i], 'triangle', 0.22, 0.07, i * 0.08);
    }

    playStart() {
      const notes = [392, 523.25, 659.25, 783.99];
      for (let i = 0; i < notes.length; i++) this.playTone(notes[i], 'square', 0.12, 0.04, i * 0.06);
    }

    startHum() {
      if (!this.ctx || this.humGain) return;
      const seconds = 1.2;
      const buffer = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * seconds), this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 240;
      this.humGain = this.ctx.createGain();
      this.humGain.gain.value = 0;
      src.connect(filter);
      filter.connect(this.humGain);
      this.humGain.connect(this.ctx.destination);
      src.start();
      this.applyHum();
    }

    startBGM() {
      if (this.timer) return;
      const bass = [130.81, 196.0, 174.61, 220.0];
      const lead = [523.25, 659.25, 783.99, 659.25, 698.46, 783.99, 659.25, 523.25];
      this.timer = setInterval(() => {
        if (this.muted || !this.ctx) return;
        const i = this.stepIdx % 8;
        this.playTone(bass[i % bass.length], 'triangle', 0.16, 0.03);
        this.playTone(lead[i], 'square', 0.11, 0.018);
        if (i % 2 === 0) this.playNoise(0.03, 0.012);
        this.stepIdx++;
      }, 188);
    }
  }

  const sfx = new SoundEngine();

  const game = {
    screen: 'TITLE',
    playerCount: 1,
    tier: 'EASY',
    mode: 'SOLO',
    titleRow: 0,
    orderIndex: 0,
    step: 1,
    phase: 'INPUT',
    phaseT: 0,
    timeLeft: TIME_LIMIT.EASY,
    timeMax: TIME_LIMIT.EASY,
    hearts: HEARTS,
    score: 0,
    combo: 0,
    bestCombo: 0,
    attempts: 0,
    solves: 0,
    shipped: 0,
    clean: 0,
    dirty: false,
    round: null,
    lastRound: null,
    history: [],
    tip: null,
    missLock: 0,
    hover: -1,
    lockedIndex: -1,
    cardFlash: null,
    shake: 0,
    flash: 0,
    flashColor: 'rgba(255,255,255,0)',
    arm: 0,
    belt: 0,
    hopper: { blue: 0, pink: 0 },
    hopperTarget: { blue: 0, pink: 0 },
    shown: { blue: null, pink: null },
    particles: [],
    floaters: [],
    players: [
      { id: 0, name: 'P1', full: 'CRIMSON', color: '#e11d48', keys: ['1', '2', '3', '4'], cursor: -1, stun: 0, stars: 0, score: 0, pad: { a: false, l: false, r: false, u: false, d: false } },
      { id: 1, name: 'P2', full: 'AZURE', color: '#2563eb', keys: ['Q', 'W', 'E', 'R'], cursor: -1, stun: 0, stars: 0, score: 0, pad: { a: false, l: false, r: false, u: false, d: false } },
      { id: 2, name: 'P3', full: 'EMERALD', color: '#059669', keys: ['U', 'I', 'O', 'P'], cursor: -1, stun: 0, stars: 0, score: 0, pad: { a: false, l: false, r: false, u: false, d: false } }
    ],
    mouse: { x: 640, y: 360 },
    result: null

  function muteRect() {
    return { x: 1190, y: 12, w: 74, h: 32 };
  }

  function cardsGeom() {
    const n = 4;
    const gap = UI.cardGap;
    const w = (UI.sheetW - gap * (n - 1)) / n;
    const rects = [];
    for (let i = 0; i < n; i++) {
      rects.push({ x: UI.sheetX + i * (w + gap), y: UI.cardY, w: w, h: UI.cardH });
    }
    return rects;
  }

  function rowSlots(n, w, h, y, gap) {
    const total = n * w + (n - 1) * gap;
    const x0 = (VW - total) / 2;
    const out = [];
    for (let i = 0; i < n; i++) out.push({ x: x0 + i * (w + gap), y: y, w: w, h: h });
    return out;
  }

  function titleLayout() {
    const counts = rowSlots(3, 180, 58, 236, 22);
    const tiers = rowSlots(4, 230, 66, 348, 16);
    const modes = rowSlots(3, 320, 64, 470, 18);
    return {
      counts: counts,
      tiers: tiers,
      modes: modes,
      start: { x: (VW - 420) / 2, y: 562, w: 420, h: 58 }
    };
  }

  function resultLayout() {
    return {
      again: { x: 390, y: 560, w: 230, h: 54 },
      title: { x: 660, y: 560, w: 230, h: 54 }
    };
  }

  function activePlayer() {
    const n = game.playerCount;
    const start = game.orderIndex % n;
    const offset = game.step === 1 ? 0 : 1;
    return (start + offset) % n;
  }

  function currentStep() {
    if (!game.round || !game.round.steps) return null;
    return game.round.steps[game.step - 1] || null;
  }

  function canControl(pi) {
    if (game.screen !== 'PLAYING' || game.phase !== 'INPUT') return false;
    if (pi < 0 || pi >= game.playerCount) return false;
    if (game.players[pi].stun > performance.now()) return false;
    if (game.mode !== 'DUEL' && game.missLock > performance.now()) return false;
    if (game.mode === 'COOP' && pi !== activePlayer()) return false;
    return true;
  }

  function comboMult() {
    if (game.tier !== 'EXTREME') return 1;
    return Math.min(4, 1 + game.combo);
  }

  function spawnFloater(str, x, y, color, size) {
    game.floaters.push({
      text: str,
      x: x,
      y: y,
      vy: -32,
      life: 1.15,
      decay: 0.55,
      color: color,
      size: size || 22
    });
    if (game.floaters.length > 16) game.floaters.shift();
  }

  function burst(x, y, color, n, upward) {
    for (let i = 0; i < n; i++) {
      game.particles.push({
        x: x + (Math.random() - 0.5) * 24,
        y: y,
        vx: (Math.random() - 0.5) * (upward ? 180 : 70),
        vy: upward ? (-160 - Math.random() * 180) : (60 + Math.random() * 140),
        g: upward ? 420 : 80,
        life: 0.7 + Math.random() * 0.3,
        decay: 0.85,
        color: color,
        size: 3 + Math.random() * 3
      });
    }
    if (game.particles.length > 120) game.particles.splice(0, game.particles.length - 120);
  }

  function hopperAnchor(side) {
    if (side === 'pink') return { x: UI.sheetX + 430, y: UI.stageY + 78 };
    return { x: UI.sheetX + 168, y: UI.stageY + 78 };
  }

  function identityLine(r) {
    const s = signOf(r.op);
    const comb = r.op === '-' ? (r.part1 + ' − ' + r.part2) : (r.part1 + ' + ' + r.part2);
    return r.A + ' × ' + r.B + ' = (' + r.A + ' × ' + r.b1 + ') ' + s + ' (' + r.A + ' × ' + r.b2 + ') = ' + comb + ' = ' + r.total;
  }

  function tipTens(r) {
    const d = Math.floor(r.b1 / 10);
    return 'The ' + d + ' in ' + r.B + ' is in the TENS place, so it stands for ' + r.b1 + ' ' + r.toy.tens + ', not ' + d + '! Break ' + r.B + ' into ' + r.b1 + ' + ' + r.b2 + '!';
  }
  function tipForgot(r) {
    return 'Every single one of the ' + r.A + ' ' + r.toy.plural + ' needs ' + r.b2 + ' ' + r.toy.ones + '! Multiply BOTH parts by ' + r.A + ': (' + r.A + ' × ' + r.b1 + ') ' + signOf(r.op) + ' (' + r.A + ' × ' + r.b2 + ')!';
  }
  function tipAdd(r, factor, name, product) {
    return 'Each of the ' + r.A + ' toys requires ' + factor + ' ' + name + ' — multiply ' + r.A + ' × ' + factor + ' = ' + product + ", don't add " + r.A + ' + ' + factor + '!';
  }
  function tipSign(r) {
    return 'Since ' + r.B + ' is ' + r.b2 + ' LESS than ' + r.b1 + ' (' + r.b1 + ' − ' + r.b2 + '), subtract the extra group of ' + r.A + ': (' + r.A + ' × ' + r.b1 + ') − (' + r.A + ' × ' + r.b2 + ')!';
  }
  function methodTip(r) {
    if (r.op === '-') {
      return r.B + ' is ' + r.b2 + ' less than ' + r.b1 + '. Multiply ' + r.A + ' by ' + r.b1 + ', then subtract ' + r.A + ' × ' + r.b2 + '.';
    }
    return 'Break ' + r.B + ' into ' + r.b1 + ' + ' + r.b2 + '. Multiply ' + r.A + ' by each part, then add the two hoppers.';
  }

  function exprText(A, b1, b2, op, bareSecond) {
    const s = signOf(op);
    if (bareSecond) return '(' + A + ' × ' + b1 + ') ' + s + ' ' + b2;
    return '(' + A + ' × ' + b1 + ') ' + s + ' (' + A + ' × ' + b2 + ')';
  }
  function addText(A, b1, b2, op) {
    const s = signOf(op);
    return '(' + A + ' + ' + b1 + ') ' + s + ' (' + A + ' + ' + b2 + ')';
  }

  function card(textValue, sub, correct, tip) {
    return { text: String(textValue), sub: sub, correct: !!correct, tip: correct ? '' : tip };
  }

  function finalize(correct, wrongs, fallback) {
    const cards = [correct];
    const seen = {};
    seen[correct.text] = true;
    for (let i = 0; i < wrongs.length; i++) {
      const w = wrongs[i];
      if (!w || !w.text || seen[w.text] || w.correct) continue;
      if (!w.tip) w.tip = fallback;
      cards.push(w);
      seen[w.text] = true;
      if (cards.length === 4) break;
    }
    let k = 1;
    const numeric = /^-?\d+$/.test(correct.text);
    const baseN = numeric ? parseInt(correct.text, 10) : 0;
    while (cards.length < 4 && k < 40) {
      let textValue;
      if (numeric) {
        const mag = 10 * Math.ceil(k / 2);
        const n = baseN + (k % 2 === 0 ? mag : -mag);
        k++;
        if (n <= 0 || seen[String(n)]) continue;
        textValue = String(n);
      } else {
        textValue = '0 × ' + k;
        k++;
        if (seen[textValue]) continue;
      }
      cards.push(card(textValue, 'try the split again', false, fallback));
      seen[textValue] = true;
    }
    if (cards.length !== 4) return null;
    return shuffle(cards);
  }

  function pushNum(list, seen, n, sub, tip) {
    if (!Number.isFinite(n) || n <= 0 || seen[n]) return;
    seen[n] = true;
    list.push(card(n, sub, false, tip));
  }

  function numberWrongs(correct, entries, r) {
    const list = [];
    const seen = {};
    seen[correct] = true;
    for (let i = 0; i < entries.length; i++) {
      pushNum(list, seen, entries[i].n, entries[i].sub, entries[i].tip);
    }
    const extras = [10, -10, r.A, -r.A, r.b2, r.b1, 1, -1, 2, 5, r.B, 100];
    for (let i = 0; i < extras.length && list.length < 6; i++) {
      pushNum(list, seen, correct + extras[i], 'check the hoppers', methodTip(r));
    }
    return list;
  }

  function segs(parts) {
    const out = [];
    for (let i = 0; i < parts.length; i++) out.push({ t: parts[i][0], hot: !!parts[i][1] });
    return out;
  }

  function stepShell(kicker, prompt, header, detail, segments, focus, fill, reveal) {
    return {
      kicker: kicker,
      prompt: prompt,
      header: header,
      detail: detail,
      segments: segments,
      focus: focus,
      fill: fill,
      reveal: reveal || {},
      cards: null,
      answer: ''
    };
  }

  function normalHeader(r) {
    return { header: r.A + ' ' + r.toy.title, detail: r.B + ' PARTS EACH' };
  }

  function attach(step, answer, correctCard, wrongs, r) {
    step.answer = String(answer);
    correctCard.text = String(answer);
    correctCard.correct = true;
    step.cards = finalize(correctCard, wrongs, methodTip(r));
    return step.cards;
  }

  function kindFor(tier, orderIndex) {
    if (tier === 'EASY') return orderIndex % 2 === 0 ? 'split-part' : 'two-parts';
    if (tier === 'MEDIUM') return orderIndex % 2 === 0 ? 'expr-total' : 'part-total';
    if (tier === 'HARD') return ['missing-toy', 'missing-factor', 'missing-ones', 'deduce-ones'][orderIndex % 4];
    return ['comp-total', 'friendly-total', 'comp-missing'][orderIndex % 3];
  }

  function baseFor(tier, kind) {
    if (tier === 'EXTREME') {
      if (kind === 'friendly-total') {
        const options = [
          { B: 25, b1: 20, b2: 5 },
          { B: 15, b1: 10, b2: 5 },
          { B: 14, b1: 10, b2: 4 },
          { B: 24, b1: 20, b2: 4 },
          { B: 16, b1: 10, b2: 6 },
          { B: 23, b1: 20, b2: 3 },
          { B: 21, b1: 20, b2: 1 },
          { B: 32, b1: 30, b2: 2 }
        ];
        const picked = choice(options);
        return { A: rand(12, 24), B: picked.B, b1: picked.b1, b2: picked.b2, op: '+', style: (picked.B === 25 || picked.B === 15) ? 'friendly' : 'regroup' };
      }
      const b1 = Math.random() < 0.45 ? 30 : 20;
      const b2 = Math.random() < 0.75 ? 1 : 2;
      return { A: rand(12, 24), B: b1 - b2, b1: b1, b2: b2, op: '-', style: 'compensation' };
    }
    if (tier === 'EASY') {
      const b2 = rand(2, 5);
      const b1 = Math.random() < 0.62 ? 20 : 10;
      return { A: rand(12, 19), B: b1 + b2, b1: b1, b2: b2, op: '+', style: 'tens' };
    }
    if (tier === 'MEDIUM') {
      let b1 = Math.random() < 0.55 ? 30 : 20;
      let b2 = rand(1, 5);
      if (Math.random() < 0.22) {
        b1 = 30;
        b2 = rand(6, 9);
      }
      return { A: rand(18, 32), B: b1 + b2, b1: b1, b2: b2, op: '+', style: 'tens' };
    }
    const b1 = Math.random() < 0.5 ? 20 : 30;
    const b2 = rand(2, 6);
    return { A: rand(15, 26), B: b1 + b2, b1: b1, b2: b2, op: '+', style: 'tens' };
  }

  function productStep(r, side, kicker) {
    const blue = side === 'blue';
    const factor = blue ? r.b1 : r.b2;
    const product = blue ? r.part1 : r.part2;
    const name = blue ? r.toy.tens : r.toy.ones;
    const other = blue ? r.part2 : r.part1;
    const otherName = blue ? r.toy.ones : r.toy.tens;
    const digit = factor >= 10 ? factor / 10 : factor + 1;
    const h = normalHeader(r);
    const step = stepShell(
      kicker,
      (kicker.indexOf('SHIP') === 0 ? 'SHIP ORDER — ' : '') + (blue ? 'Blue hopper: how many ' : 'Pink hopper: how many ') + name + ' for ' + r.A + ' ' + r.toy.plural + '?',
      h.header,
      h.detail,
      segs([[r.A + ' × ' + factor + ' = '], ['?', true]]),
      blue ? 'blue' : 'pink',
      blue ? 'blue' : 'pink',
      blue ? { blue: product } : { pink: product }
    );
    const wrongs = numberWrongs(product, [
      { n: r.A + factor, sub: 'added, not multiplied', tip: tipAdd(r, factor, name, product) },
      { n: r.A * digit, sub: 'place-value trap', tip: factor >= 10 ? tipTens(r) : methodTip(r) },
      { n: other, sub: otherName, tip: 'That count belongs in the other hopper (' + otherName + '). This hopper is ' + r.A + ' × ' + factor + '.' },
      { n: factor, sub: 'per toy only', tip: factor + ' is the count for ONE toy. Multiply by all ' + r.A + ' ' + r.toy.plural + '.' },
      { n: r.A * r.B, sub: 'whole order', tip: 'That is every part combined. This hopper only holds the ' + name + ': ' + r.A + ' × ' + factor + '.' }
    ], r);
    const cards = attach(step, product, card(product, name, true, ''), wrongs, r);
    if (!cards) return null;
    return step;
  }

  function totalWrongs(r) {
    const signWrong = r.op === '-' ? r.part1 + r.part2 : r.part1 - r.part2;
    const entries = [
      { n: r.part1, sub: 'blue hopper only', tip: r.op === '-' ? 'The blue hopper is the benchmark batch. Subtract the extra group: ' + r.part1 + ' − ' + r.part2 + '.' : 'The blue hopper is only the first batch. Add the pink hopper too: ' + r.part1 + ' + ' + r.part2 + '.' },
      { n: r.part2, sub: 'pink hopper only', tip: r.op === '-' ? 'Those are the extra parts you take away, not the total. Compute ' + r.part1 + ' − ' + r.part2 + '.' : 'That is only the ' + r.toy.ones + '. Ship both hoppers: ' + r.part1 + ' + ' + r.part2 + '.' },
      { n: r.part1 + r.b2, sub: 'forgot to multiply', tip: 'You added the ones count (' + r.b2 + ') instead of the ones batch (' + r.A + ' × ' + r.b2 + ' = ' + r.part2 + ').' },
      { n: r.A + r.B, sub: 'added the factors', tip: tipAdd(r, r.b1, r.toy.tens, r.part1) },
      { n: signWrong, sub: r.op === '-' ? 'used plus' : 'used minus', tip: r.op === '-' ? tipSign(r) : 'This split is added, not subtracted. ' + r.part1 + ' + ' + r.part2 + ' = ' + r.total + '.' },
      { n: r.A * Math.floor(r.B / 10), sub: 'tens digit only', tip: tipTens(r) }
    ];
    return numberWrongs(r.total, entries, r);
  }

  function stepsSplitPart(r) {
    const h = normalHeader(r);
    const s1 = stepShell(
      'STEP 1 · CALIBRATE',
      'Each ' + r.toy.one + ' needs ' + r.B + ' parts. How do the hoppers split ' + r.B + '?',
      h.header,
      h.detail,
      segs([[r.A + ' × ' + r.B + ' = (' + r.A + ' × '], ['?', true], [') + (' + r.A + ' × '], ['?', true], [')']]),
      'both',
      'both',
      {}
    );
    const answer = r.b1 + ' + ' + r.b2;
    const digit = Math.floor(r.b1 / 10);
    const wrongs = [
      card(digit + ' + ' + r.b2, 'tens digit, not tens', false, tipTens(r)),
      card(r.b1 + ' + ' + r.B, 'whole amount in both', false, r.B + ' is the whole parts list. Split it into ' + r.b1 + ' + ' + r.b2 + '.'),
      card(r.A + ' + ' + r.B, 'added toys and parts', false, "Don't add the " + r.A + ' toys to the ' + r.B + ' parts. Split ' + r.B + ' itself into ' + r.b1 + ' + ' + r.b2 + '.'),
      card(r.b2 + ' + ' + r.b1, 'hoppers swapped', false, 'Load the TENS part into the blue hopper first: ' + r.b1 + ' + ' + r.b2 + '.'),
      card(r.b1 + ' + ' + digit, 'mixed place values', false, tipTens(r))
    ];
    if (!attach(s1, answer, card(answer, r.toy.tens + ' + ' + r.toy.ones, true, ''), wrongs, r)) return null;
    const s2 = productStep(r, 'blue', 'STEP 2 · SHIP ORDER');
    if (!s2) return null;
    s2.prompt = 'SHIP ORDER — blue hopper ' + r.toy.tens + '. How many is ' + r.A + ' × ' + r.b1 + '?';
    return [s1, s2];
  }

  function stepsTwoParts(r) {
    const s1 = productStep(r, 'blue', 'STEP 1 · CALIBRATE');
    const s2 = productStep(r, 'pink', 'STEP 2 · SHIP ORDER');
    if (!s1 || !s2) return null;
    s2.prompt = 'SHIP ORDER — pink hopper ' + r.toy.ones + '. How many is ' + r.A + ' × ' + r.b2 + '?';
    return [s1, s2];
  }

  function stepsExprTotal(r) {
    const h = normalHeader(r);
    const sign = signOf(r.op);
    const s1 = stepShell(
      'STEP 1 · CALIBRATE',
      r.op === '-'
        ? r.B + ' is close to ' + r.b1 + '. Which compensation blueprint is right?'
        : 'Which blueprint shows the distributive split?',
      h.header,
      h.detail,
      (r.op === '-'
        ? segs([[r.A + ' × ' + r.B + ' = (' + r.A + ' × '], ['?', true], [') '], ['?', true], [' (' + r.A + ' × '], ['?', true], [')']])
        : segs([[r.A + ' × ' + r.B + ' = (' + r.A + ' × '], ['?', true], [') + (' + r.A + ' × '], ['?', true], [')']])),
      'both',
      'both',
      {}
    );
    const answer = exprText(r.A, r.b1, r.b2, r.op, false);
    const digit = Math.floor(r.b1 / 10);
    const wrongs = [];
    if (r.op === '-') {
      wrongs.push(card(exprText(r.A, r.b1, r.b2, '+', false), 'used plus', false, tipSign(r)));
      wrongs.push(card(exprText(r.A, digit, r.b2, '-', false), 'tens digit', false, tipTens(r)));
    } else {
      wrongs.push(card(exprText(r.A, digit, r.b2, '+', false), 'tens digit', false, tipTens(r)));
    }
    wrongs.push(card(exprText(r.A, r.b1, r.b2, r.op, true), 'one side not multiplied', false, tipForgot(r)));
    wrongs.push(card(addText(r.A, r.b1, r.b2, r.op), 'added, not multiplied', false, tipAdd(r, r.b1, r.toy.tens, r.part1)));
    wrongs.push(card(exprText(r.A, r.b2, r.b2, r.op, false), 'pink twice', false, 'The blue hopper must use the tens part ' + r.b1 + ', not ' + r.b2 + '.'));
    wrongs.push(card(exprText(r.b1, r.b2, r.b2, r.op, false), 'factors swapped', false, 'Multiply the toy count ' + r.A + ' by each part.'));
    if (!attach(s1, answer, card(answer, r.op === '-' ? 'subtract the extra group' : 'both hoppers', true, ''), wrongs, r)) return null;

    const s2 = stepShell(
      'STEP 2 · SHIP ORDER',
      r.op === '-'
        ? 'SHIP ORDER — subtract the extra group and send the total parts.'
        : 'SHIP ORDER — add both hoppers and send the total parts.',
      h.header,
      h.detail,
      segs([[r.A + ' × ' + r.B + ' = (' + r.A + ' × ' + r.b1 + ') ' + sign + ' (' + r.A + ' × ' + r.b2 + ') = '], ['?', true]]),
      'both',
      'both',
      { blue: r.part1, pink: r.part2 }
    );
    if (!attach(s2, r.total, card(r.total, 'total parts', true, ''), totalWrongs(r), r)) return null;
    return [s1, s2];
  }

  function stepsPartTotal(r) {
    const side = Math.random() < 0.5 ? 'blue' : 'pink';
    const s1 = productStep(r, side, 'STEP 1 · CALIBRATE');
    if (!s1) return null;
    const h = normalHeader(r);
    const sign = signOf(r.op);
    const s2 = stepShell(
      'STEP 2 · SHIP ORDER',
      'SHIP ORDER — blue ' + r.A + ' × ' + r.b1 + ' and pink ' + r.A + ' × ' + r.b2 + '. How many total parts?',
      h.header,
      h.detail,
      segs([['(' + r.A + ' × ' + r.b1 + ') ' + sign + ' (' + r.A + ' × ' + r.b2 + ') = '], ['?', true]]),
      'both',
      'both',
      { blue: r.part1, pink: r.part2 }
    );
    if (!attach(s2, r.total, card(r.total, 'total parts', true, ''), totalWrongs(r), r)) return null;
    return [s1, s2];
  }

  function stepsMissingToy(r) {
    const s1 = stepShell(
      'STEP 1 · CALIBRATE',
      'Calibrate the blue hopper on the blueprint: ' + r.A + ' × ' + r.b1 + ' ' + r.toy.tens + '.',
      'MYSTERY ' + r.toy.title,
      r.B + ' PARTS EACH',
      segs([[r.A + ' × ' + r.b1 + ' = '], ['?', true]]),
      'blue',
      'blue',
      { blue: r.part1 }
    );
    const wrongs1 = numberWrongs(r.part1, [
      { n: r.A + r.b1, sub: 'added', tip: tipAdd(r, r.b1, r.toy.tens, r.part1) },
      { n: r.A * Math.floor(r.b1 / 10), sub: 'tens digit', tip: tipTens(r) },
      { n: r.A, sub: 'toy count', tip: r.A + ' is the toy count hiding on the left. This step wants the blue parts: ' + r.A + ' × ' + r.b1 + '.' },
      { n: r.b1, sub: 'per toy', tip: r.b1 + ' is for one toy. Multiply by ' + r.A + '.' },
      { n: r.part2, sub: 'pink hopper', tip: 'That is the pink hopper (' + r.A + ' × ' + r.b2 + '). The blue hopper is ' + r.A + ' × ' + r.b1 + '.' }
    ], r);
    if (!attach(s1, r.part1, card(r.part1, r.toy.tens, true, ''), wrongs1, r)) return null;

    const s2 = stepShell(
      'STEP 2 · SHIP ORDER',
      'SHIP ORDER — both hoppers use the same toy count. What is the missing number of toys?',
      'MYSTERY ' + r.toy.title,
      r.B + ' PARTS EACH',
      segs([['', false], ['?', true], [' × ' + r.B + ' = (' + r.A + ' × ' + r.b1 + ') + (' + r.A + ' × ' + r.b2 + ')']]),
      'both',
      null,
      {}
    );
    s2.segments[0].t = '';
    const wrongs2 = numberWrongs(r.A, [
      { n: r.B, sub: 'parts per toy', tip: r.B + ' is how many parts each toy needs, not how many toys. The toy count is the number repeated in both bins: ' + r.A + '.' },
      { n: r.b1, sub: 'tens part', tip: r.b1 + ' is the tens part of the parts list. The missing toy count matches the ' + r.A + ' in ' + r.A + ' × ' + r.b1 + '.' },
      { n: r.b2, sub: 'ones part', tip: r.b2 + ' is the ones part. The missing box is the toy count ' + r.A + '.' },
      { n: r.A + r.b2, sub: 'mixed the bins', tip: 'Do not add a parts digit onto the toys. Both bins already say ' + r.A + ' toys.' },
      { n: r.part1, sub: 'blue parts', tip: r.part1 + ' is a parts total, not the toy count. The missing number is ' + r.A + '.' },
      { n: r.A - 1, sub: 'one short', tip: 'The toy count is copied from both bins: ' + r.A + ', not ' + (r.A - 1) + '.' },
      { n: r.A + 1, sub: 'one extra', tip: 'The toy count is copied from both bins: ' + r.A + '.' }
    ], r);
    if (!attach(s2, r.A, card(r.A, 'missing toy count', true, ''), wrongs2, r)) return null;
    return [s1, s2];
  }

  function stepsMissingFactor(r) {
    const h = { header: r.A + ' ' + r.toy.title, detail: 'PARTS PER TOY UNKNOWN' };
    const s1 = stepShell(
      'STEP 1 · CALIBRATE',
      'Fill the blue hopper first: ' + r.A + ' × ' + r.b1 + ' ' + r.toy.tens + '.',
      h.header,
      h.detail,
      segs([[r.A + ' × ' + r.b1 + ' = '], ['?', true]]),
      'blue',
      'blue',
      { blue: r.part1 }
    );
    const wrongs1 = numberWrongs(r.part1, [
      { n: r.A + r.b1, sub: 'added', tip: tipAdd(r, r.b1, r.toy.tens, r.part1) },
      { n: r.A * Math.floor(r.b1 / 10), sub: 'tens digit', tip: tipTens(r) },
      { n: r.B, sub: 'jumped to the multiplier', tip: r.b1 + ' + ' + r.b2 + ' is the missing multiplier, but this step wants the blue parts: ' + r.A + ' × ' + r.b1 + '.' },
      { n: r.part2, sub: 'pink hopper', tip: 'Pink is ' + r.A + ' × ' + r.b2 + '. Blue is ' + r.A + ' × ' + r.b1 + '.' }
    ], r);
    if (!attach(s1, r.part1, card(r.part1, r.toy.tens, true, ''), wrongs1, r)) return null;

    const s2 = stepShell(
      'STEP 2 · SHIP ORDER',
      'SHIP ORDER — the missing parts-per-toy is the two hopper multipliers added.',
      h.header,
      h.detail,
      segs([[r.A + ' × '], ['?', true], [' = (' + r.A + ' × ' + r.b1 + ') + (' + r.A + ' × ' + r.b2 + ')']]),
      'both',
      null,
      {}
    );
    const wrongs2 = numberWrongs(r.B, [
      { n: r.b1, sub: 'blue multiplier only', tip: r.b1 + ' is only the tens part. Add the ones part: ' + r.b1 + ' + ' + r.b2 + ' = ' + r.B + '.' },
      { n: r.b2, sub: 'pink multiplier only', tip: r.b2 + ' is only the ones part. The full multiplier is ' + r.b1 + ' + ' + r.b2 + ' = ' + r.B + '.' },
      { n: r.A, sub: 'toy count', tip: r.A + ' is how many toys, not how many parts each toy needs.' },
      { n: r.b1 * r.b2, sub: 'multiplied the parts', tip: 'Add the hopper multipliers. Do not multiply them: ' + r.b1 + ' + ' + r.b2 + ' = ' + r.B + '.' },
      { n: Math.abs(r.b1 - r.b2), sub: 'subtracted', tip: 'These parts are added: ' + r.b1 + ' + ' + r.b2 + ' = ' + r.B + '.' },
      { n: r.total, sub: 'parts total', tip: r.total + ' is every part in the order. The missing multiplier is ' + r.B + '.' }
    ], r);
    if (!attach(s2, r.B, card(r.B, 'parts per toy', true, ''), wrongs2, r)) return null;
    return [s1, s2];
  }

  function stepsMissingOnes(r) {

    const s1 = stepShell(
      'STEP 1 · CALIBRATE',
      'The tens part is already ' + r.b1 + '. How many ' + r.toy.tens + ' go in the blue hopper?',
      h.header,
      h.detail,

    );

      { n: r.A * Math.floor(r.b1 / 10), sub: 'tens digit', tip: tipTens(r) },
      { n: r.b2, sub: 'pink multiplier', tip: 'The pink multiplier is the later question. This step is ' + r.A + ' × ' + r.b1 + '.' },

    ], r);

      'SHIP ORDER — ' + r.B + ' parts = ' + r.b1 + ' + the pink multiplier. What is the pink multiplier?',

      h.detail,
      segs([[r.A + ' × ' + r.B + ' = (' + r.A + ' × ' + r.b1 + ') + (' + r.A + ' × '], ['?', true], [')']]),

    );

      { n: r.B, sub: 'all the parts', tip: r.B + ' is the whole parts list. Take away the tens part: ' + r.B + ' − ' + r.b1 + ' = ' + r.b2 + '.' },
      { n: Math.floor(r.b1 / 10), sub: 'tens digit', tip: tipTens(r) },
      { n: r.A, sub: 'toy count', tip: 'The toy count stays ' + r.A + '. The missing piece is the ones part ' + r.b2 + '.' },
      { n: r.b1 + r.b2, sub: 'added again', tip: r.b1 + ' + ' + r.b2 + ' is the full ' + r.B + '. The pink box is only ' + r.b2 + '.' }
    ], r);
    if (!attach(s2, r.b2, card(r.b2, r.toy.ones + ' each', true, ''), wrongs2, r)) return null;
    return [s1, s2];
  }

  function stepsDeduceOnes(r) {

      'STEP 1 · CALIBRATE',

    ], r);

    const s2 = stepShell(

      h.header,
      h.detail,
      segs([[r.A + ' × '], ['?', true], [' = ' + r.part2]]),
      'pink',
      'pink',
      {}
    );
    const wrongs2 = numberWrongs(r.b2, [

      { n: r.b1, sub: 'blue multiplier', tip: r.b1 + ' is the blue hopper. The pink multiplier is the other part: ' + r.b2 + '.' },
      { n: r.A, sub: 'toy count', tip: r.A + ' is the number of toys. The pink multiplier is ' + r.b2 + '.' },

    ], r);
    if (!attach(s2, r.b2, card(r.b2, 'pink multiplier', true, ''), wrongs2, r)) return null;
    return [s1, s2];
  }

  function stepsCompMissing(r) {
    const h = { header: r.A + ' ' + r.toy.title, detail: 'BENCHMARK ' + r.b1 };
    const s1 = stepShell(
      'STEP 1 · CALIBRATE',
      'Compensation split. Compute the right side: how many parts ship?',
      h.header,
      h.detail,
      segs([['(' + r.A + ' × ' + r.b1 + ') − (' + r.A + ' × ' + r.b2 + ') = '], ['?', true]]),
      'both',
      'both',
      { blue: r.part1, pink: r.part2 }
    );
    const wrongs1 = numberWrongs(r.total, [
      { n: r.part1 + r.part2, sub: 'used plus', tip: tipSign(r) },
      { n: r.part1, sub: 'forgot to subtract', tip: 'Subtract the extra group of ' + r.A + ': ' + r.part1 + ' − ' + r.part2 + ' = ' + r.total + '.' },
      { n: r.part1 - r.b2, sub: 'subtracted the digit only', tip: tipForgot(r) },
      { n: r.part2, sub: 'extra group only', tip: r.part2 + ' is the group you remove, not the shipment. Compute ' + r.part1 + ' − ' + r.part2 + '.' },
      { n: r.A + r.b1, sub: 'added', tip: tipAdd(r, r.b1, r.toy.tens, r.part1) }
    ], r);
    if (!attach(s1, r.total, card(r.total, 'parts that ship', true, ''), wrongs1, r)) return null;

    const s2 = stepShell(
      'STEP 2 · SHIP ORDER',
      'SHIP ORDER — the benchmark is ' + r.b1 + ', and each toy needs ' + r.b2 + ' fewer parts. What is the missing multiplier?',
      h.header,
      h.detail,
      segs([[r.A + ' × '], ['?', true], [' = (' + r.A + ' × ' + r.b1 + ') − (' + r.A + ' × ' + r.b2 + ')']]),
      'both',
      null,
      {}
    );
    const wrongs2 = numberWrongs(r.B, [
      { n: r.b1, sub: 'benchmark', tip: r.b1 + ' is the friendly benchmark. Because we are ' + r.b2 + ' under it, the multiplier is ' + r.b1 + ' − ' + r.b2 + ' = ' + r.B + '.' },
      { n: r.b1 + r.b2, sub: 'used plus', tip: tipSign(r) },
      { n: r.b2, sub: 'the extra only', tip: r.b2 + ' is how many you subtract from ' + r.b1 + ', not the parts per toy.' },
      { n: r.A, sub: 'toy count', tip: r.A + ' is the number of toys. The missing multiplier is ' + r.B + '.' },
      { n: r.total, sub: 'parts total', tip: r.total + ' is the parts total you just computed. The multiplier is ' + r.b1 + ' − ' + r.b2 + ' = ' + r.B + '.' }
    ], r);
    if (!attach(s2, r.B, card(r.B, 'missing multiplier', true, ''), wrongs2, r)) return null;
    return [s1, s2];
  }

  function makeSteps(r) {
    if (r.kind === 'split-part') return stepsSplitPart(r);
    if (r.kind === 'two-parts') return stepsTwoParts(r);
    if (r.kind === 'expr-total' || r.kind === 'comp-total') return stepsExprTotal(r);
    if (r.kind === 'part-total' || r.kind === 'friendly-total') return stepsPartTotal(r);
    if (r.kind === 'missing-toy') return stepsMissingToy(r);
    if (r.kind === 'missing-factor') return stepsMissingFactor(r);
    if (r.kind === 'missing-ones') return stepsMissingOnes(r);
    if (r.kind === 'deduce-ones') return stepsDeduceOnes(r);
    if (r.kind === 'comp-missing') return stepsCompMissing(r);
    return null;
  }

  function audit(round) {
    if (!round || !round.steps || round.steps.length !== 2) return false;
    if (round.total !== round.A * round.B) return false;
    if (round.part1 !== round.A * round.b1 || round.part2 !== round.A * round.b2) return false;
    if (round.op === '+') {
      if (round.b1 + round.b2 !== round.B) return false;
      if (round.part1 + round.part2 !== round.total) return false;
    } else if (round.op === '-') {
      if (round.b1 - round.b2 !== round.B) return false;
      if (round.part1 - round.part2 !== round.total) return false;
    } else {
      return false;
    }
    if (round.kind === 'split-part') {
      if (round.steps[0].answer !== round.b1 + ' + ' + round.b2) return false;
      if (round.steps[1].answer !== String(round.part1)) return false;
    }
    if (round.kind === 'two-parts') {
      if (round.steps[0].answer !== String(round.part1)) return false;
      if (round.steps[1].answer !== String(round.part2)) return false;
    }
    if (round.kind === 'expr-total' || round.kind === 'comp-total' || round.kind === 'part-total' || round.kind === 'friendly-total') {
      if (round.steps[1].answer !== String(round.total)) return false;
    }
    if (round.kind === 'expr-total' || round.kind === 'comp-total') {
      if (round.steps[0].answer.indexOf(String(round.b1)) < 0) return false;
      if (round.steps[0].answer.indexOf('× ' + round.b2) < 0 && round.steps[0].answer.indexOf('× ' + round.b2 + ')') < 0) return false;
    }
    if (round.kind === 'part-total' || round.kind === 'friendly-total') {
      const a = round.steps[0].answer;
      if (a !== String(round.part1) && a !== String(round.part2)) return false;
    }
    if (round.kind === 'missing-toy' && round.steps[1].answer !== String(round.A)) return false;
    if (round.kind === 'missing-factor' && round.steps[1].answer !== String(round.B)) return false;
    if (round.kind === 'missing-ones' && round.steps[1].answer !== String(round.b2)) return false;
    if (round.kind === 'deduce-ones') {
      if (round.steps[0].answer !== String(round.part2)) return false;
      if (round.steps[1].answer !== String(round.b2)) return false;
    }
    if (round.kind === 'comp-missing') {
      if (round.steps[0].answer !== String(round.total)) return false;
      if (round.steps[1].answer !== String(round.B)) return false;
    }
    for (let i = 0; i < 2; i++) {
      const s = round.steps[i];
      if (!s.prompt || !s.header || !s.cards || s.cards.length !== 4) return false;
      const good = [];
      const seen = {};
      let hot = false;
      for (let c = 0; c < s.cards.length; c++) {
        const cardItem = s.cards[c];
        if (!cardItem.text || seen[cardItem.text]) return false;
        seen[cardItem.text] = true;
        if (cardItem.correct) good.push(cardItem);
        else if (!cardItem.tip || cardItem.tip.length < 12) return false;
      }
      if (good.length !== 1 || good[0].text !== s.answer) return false;
      if (!s.segments || !s.segments.length) return false;
      for (let g = 0; g < s.segments.length; g++) {
        if (s.segments[g].hot) hot = true;
      }
      if (!hot) return false;
    }
    return true;
  }

  function compose(tier, orderIndex, toy, base) {
    const part1 = base.A * base.b1;
    const part2 = base.A * base.b2;
    const total = base.op === '-' ? part1 - part2 : part1 + part2;
    const round = {
      toy: toy,
      kind: kindFor(tier, orderIndex),
      tier: tier,
      A: base.A,
      B: base.B,
      b1: base.b1,
      b2: base.b2,
      op: base.op,
      style: base.style,
      part1: part1,
      part2: part2,
      total: total,
      key: base.A + 'x' + base.B,
      prefill: null,
      steps: null
    };
    if (round.kind === 'deduce-ones') round.prefill = { blue: part1 };
    round.steps = makeSteps(round);
    return round;
  }

  function buildRound(tier, orderIndex, history) {
    let last = null;
    for (let attempt = 0; attempt < 28; attempt++) {
      const toy = TOYS[rand(0, TOYS.length - 1)];
      const kind = kindFor(tier, orderIndex);
      const base = baseFor(tier, kind);
      const round = compose(tier, orderIndex, toy, base);
      last = round;
      if (!round.steps) continue;
      if (!audit(round)) continue;
      if (history && history.indexOf(round.key) !== -1) continue;
      return round;
    }
    const toy = TOYS[0];
    let fallback;
    const kind = kindFor(tier, orderIndex);
    if (tier === 'EXTREME' && kind !== 'friendly-total') {
      fallback = { A: 16, B: 19, b1: 20, b2: 1, op: '-', style: 'compensation' };
    } else if (tier === 'EXTREME') {
      fallback = { A: 16, B: 25, b1: 20, b2: 5, op: '+', style: 'friendly' };
    } else if (tier === 'MEDIUM') {
      fallback = { A: 24, B: 23, b1: 20, b2: 3, op: '+', style: 'tens' };
    } else if (tier === 'HARD') {
      fallback = { A: 17, B: 26, b1: 20, b2: 6, op: '+', style: 'tens' };
    } else {
      fallback = { A: 14, B: 23, b1: 20, b2: 3, op: '+', style: 'tens' };
    }
    const round = compose(tier, orderIndex, toy, fallback);
    if (round.steps && audit(round)) return round;
    return last;
  }

  function freshShown(round) {
    game.shown = { blue: null, pink: null };
    game.hopper.blue = 0;
    game.hopper.pink = 0;
    game.hopperTarget.blue = 0;
    game.hopperTarget.pink = 0;
    if (round.prefill && round.prefill.blue != null) {
      game.shown.blue = round.prefill.blue;
      game.hopper.blue = 0.82;
      game.hopperTarget.blue = 0.82;
    }
    if (round.prefill && round.prefill.pink != null) {
      game.shown.pink = round.prefill.pink;
      game.hopper.pink = 0.82;
      game.hopperTarget.pink = 0.82;
    }
  }

  function beginOrder() {
    const round = buildRound(game.tier, game.orderIndex, game.history);
    game.round = round;
    game.lastRound = round;
    if (game.history.indexOf(round.key) === -1) game.history.push(round.key);
    if (game.history.length > 8) game.history.shift();
    game.step = 1;
    game.phase = 'INPUT';
    game.phaseT = 0;
    game.timeMax = TIME_LIMIT[game.tier];
    game.timeLeft = game.timeMax;
    game.dirty = false;
    game.missLock = 0;
    game.lockedIndex = -1;
    game.cardFlash = null;
    game.tip = null;
    game.arm = 0;
    freshShown(round);
    for (let i = 0; i < game.players.length; i++) {
      game.players[i].cursor = -1;
      game.players[i].stun = 0;
    }
  }

  function normalizedMode() {
    if (game.playerCount <= 1) return 'SOLO';
    if (game.mode === 'SOLO') return 'COOP';
    return game.mode;
  }

  function startShift() {
    sfx.unlock();
    sfx.playStart();
    game.mode = normalizedMode();
    game.playerCount = game.playerCount < 1 ? 1 : game.playerCount;
    game.score = 0;
    game.combo = 0;
    game.bestCombo = 0;
    game.hearts = HEARTS;
    game.attempts = 0;
    game.solves = 0;
    game.shipped = 0;
    game.clean = 0;
    game.orderIndex = 0;
    game.particles = [];
    game.floaters = [];
    game.shake = 0;
    game.flash = 0;
    game.result = null;
    for (let i = 0; i < game.players.length; i++) {
      game.players[i].stars = 0;
      game.players[i].score = 0;
      game.players[i].stun = 0;
      game.players[i].cursor = -1;
    }
    game.screen = 'PLAYING';
    beginOrder();
  }

  function finishShift(ranOut) {
    const stars = game.players.map(p => p.stars);
    let winner = -1;
    if (game.mode === 'DUEL') {
      let best = -1;
      for (let i = 0; i < game.playerCount; i++) {
        const scoreKey = game.players[i].stars * 100000 + game.players[i].score;
        if (scoreKey > best) {
          best = scoreKey;
          winner = i;
        } else if (scoreKey === best) {
          winner = -1;
        }
      }
    }
    game.result = {
      ranOut: !!ranOut,
      winner: winner,
      stars: stars,
      accuracy: game.attempts ? Math.round(100 * game.solves / game.attempts) : 0
    };
    game.screen = 'RESULTS';
    game.phase = 'INPUT';
    if (!ranOut) {
      burst(420, 180, '#fbbf24', 18, true);
      burst(860, 180, '#38bdf8', 18, true);
      sfx.playFanfare();
    }
  }

  function applyReveal(step) {
    if (!step || !step.reveal) return;
    if (step.reveal.blue != null) game.shown.blue = step.reveal.blue;
    if (step.reveal.pink != null) game.shown.pink = step.reveal.pink;
    if (step.fill === 'blue' || step.fill === 'both') game.hopperTarget.blue = Math.max(game.hopperTarget.blue, 0.78);
    if (step.fill === 'pink' || step.fill === 'both') game.hopperTarget.pink = Math.max(game.hopperTarget.pink, 0.78);
  }

  function award(pi, base) {
    const mult = comboMult();
    let pts = base * mult;
    const ratio = game.timeMax > 0 ? game.timeLeft / game.timeMax : 0;
    let bonus = 0;
    if (ratio > 0.72) bonus = 100;
    else if (ratio > 0.4) bonus = 50;
    if (game.mode === 'DUEL') game.players[pi].score += pts + bonus;
    else game.score += pts + bonus;
    return { pts: pts, bonus: bonus, mult: mult };
  }

  function enterStep2() {
    game.step = 2;
    game.phase = 'INPUT';
    game.lockedIndex = -1;
    game.cardFlash = null;
    for (let i = 0; i < game.players.length; i++) game.players[i].cursor = -1;
  }

  function nextOrder() {
    game.orderIndex += 1;
    if (game.orderIndex >= ORDERS) {
      finishShift(false);
      return;
    }
    beginOrder();
  }

  function hurt() {
    if (game.mode === 'DUEL') return;
    game.hearts -= 1;
    game.flash = 0.18;
    game.flashColor = 'rgba(225, 29, 72, 0.28)';
    if (game.hearts <= 0) {
      game.hearts = 0;
      game.phase = 'DEAD';
      game.phaseUntil = performance.now() + 950;
    }
  }

  function onTimeout() {
    if (game.phase !== 'INPUT') return;
    game.timeLeft = 0;
    game.dirty = true;
    game.combo = 0;
    sfx.playBuzz();
    game.tip = { text: 'The factory timer hit zero. Split the multiplier into its parts, multiply each hopper, then combine.', life: 2.4 };
    game.shake = 0.2;
    hurt();
    if (game.phase !== 'DEAD') {
      game.phase = 'NEXT';
      game.phaseUntil = performance.now() + 850;
    }
  }

  function onCorrect(pi) {
    if (!canControl(pi)) return;
    const step = currentStep();
    if (!step) return;
    game.attempts += 1;
    game.solves += 1;
    game.lockedIndex = -1;
    for (let i = 0; i < step.cards.length; i++) {
      if (step.cards[i].correct) game.lockedIndex = i;
    }
    game.cardFlash = { index: game.lockedIndex, bad: false, t: 0.4 };
    const base = game.step === 1 ? 150 : 350;
    const got = award(pi, base);
    const px = game.mode === 'DUEL' ? 520 + pi * 150 : 700;
    spawnFloater('+' + got.pts, px, 198, '#15803d', 26);
    if (got.mult > 1) spawnFloater('COMBO ×' + got.mult, px, 226, '#db2777', 16);
    if (got.bonus) spawnFloater('SPEED +' + got.bonus, px, 252, '#b45309', 16);
    game.tip = null;
    game.arm = 1;
    if (game.step === 1) {
      applyReveal(step);
      sfx.playDrop();
      const blue = hopperAnchor('blue');
      const pink = hopperAnchor('pink');
      if (step.fill === 'blue' || step.fill === 'both') burst(blue.x, blue.y - 20, '#60a5fa', 12, false);
      if (step.fill === 'pink' || step.fill === 'both') burst(pink.x, pink.y - 20, '#fb7185', 12, false);
      game.phase = 'DROP';
      game.phaseUntil = performance.now() + 850;
      if (game.mode === 'DUEL') {
        spawnFloater(game.players[pi].name + ' LOCKED THE HOPPER', 640, 210, game.players[pi].color, 20);
      }
    } else {
      applyReveal(step);
      game.shown.blue = game.round.part1;
      game.shown.pink = game.round.part2;
      game.hopperTarget.blue = 1;
      game.hopperTarget.pink = 1;
      if (!game.dirty) {
        game.combo += 1;
        if (game.combo > game.bestCombo) game.bestCombo = game.combo;
        game.clean += 1;
      }
      game.shipped += 1;
      if (game.mode === 'DUEL') {
        game.players[pi].stars += 1;
        spawnFloater(game.players[pi].name + ' SHIPPED', 700, 286, game.players[pi].color, 20);
      } else {
        spawnFloater('ORDER SHIPPED', 700, 286, '#b45309', 20);
      }
      sfx.playBell();
      sfx.playFanfare();
      burst(UI.sheetX + 1080, UI.stageY + 200, '#fbbf24', 16, true);
      game.flash = 0.16;
      game.flashColor = 'rgba(250, 204, 21, 0.28)';
      game.phase = 'SHIP';
      game.phaseUntil = performance.now() + 1150;
    }
  }

  function onWrong(pi, cardItem) {
    if (!canControl(pi)) return;
    const step = currentStep();
    if (!step) return;
    game.attempts += 1;
    game.dirty = true;
    game.combo = 0;
    let idx = 0;
    for (let i = 0; i < step.cards.length; i++) if (step.cards[i] === cardItem) idx = i;
    game.cardFlash = { index: idx, bad: true, t: 0.45 };
    game.shake = 0.22;
    game.tip = { text: cardItem.tip || methodTip(game.round), life: 5 };
    sfx.playBuzz();
    if (game.mode === 'DUEL') {
      game.players[pi].stun = performance.now() + 1500;
      spawnFloater(game.players[pi].name + ' JAMMED 1.5s', 640, 220, '#be123c', 22);
    } else {
      game.missLock = performance.now() + 280;
      hurt();
    }
  }

  function selectCard(pi, index) {
    if (index < 0 || index > 3) return;
    if (game.mode === 'COOP' && pi !== activePlayer() && game.phase === 'INPUT' && game.screen === 'PLAYING') {
      if (pi === 0) spawnFloater(game.players[activePlayer()].name + ' ' + game.players[activePlayer()].full + ' IS AT THE LINE', 640, 230, game.players[activePlayer()].color, 18);
      return;
    }
    if (!canControl(pi)) return;
    const step = currentStep();
    if (!step || !step.cards[index]) return;
    game.players[pi].cursor = index;
    const chosen = step.cards[index];
    if (chosen.correct) onCorrect(pi);
    else onWrong(pi, chosen);
  }

  function nudge(pi, dir) {
    if (!canControl(pi)) return;
    const p = game.players[pi];
    if (p.cursor < 0) p.cursor = dir < 0 ? 3 : 0;
    else p.cursor = (p.cursor + dir + 4) % 4;
    sfx.playTick();
  }

  function confirmCursor(pi) {
    if (!canControl(pi)) return;
    if (game.players[pi].cursor < 0) return;
    selectCard(pi, game.players[pi].cursor);
  }

  function cycleTitle(dir) {
    const layout = titleLayout();
    if (game.titleRow === 0) {
      const next = game.playerCount + dir;
      if (next >= 1 && next <= 3) {
        game.playerCount = next;
        if (game.playerCount === 1) game.mode = 'SOLO';
        else if (game.mode === 'SOLO') game.mode = 'COOP';
      }
    } else if (game.titleRow === 1) {
      const keys = ['EASY', 'MEDIUM', 'HARD', 'EXTREME'];
      let idx = keys.indexOf(game.tier) + dir;
      if (idx < 0) idx = 0;
      if (idx > 3) idx = 3;
      game.tier = keys[idx];
    } else if (game.titleRow === 2) {
      const keys = ['SOLO', 'COOP', 'DUEL'];
      let idx = keys.indexOf(game.mode);
      for (let n = 0; n < 3; n++) {
        idx = (idx + dir + 3) % 3;
        const id = keys[idx];
        const allowed = (game.playerCount === 1 && id === 'SOLO') || (game.playerCount > 1 && id !== 'SOLO');
        if (allowed) {
          game.mode = id;
          break;
        }
      }
    }
    sfx.playTick();
    return layout;
  }

  function titleKey(low) {
    if (low === 'arrowup') game.titleRow = (game.titleRow + 3) % 4;
    else if (low === 'arrowdown') game.titleRow = (game.titleRow + 1) % 4;
    else if (low === 'arrowleft') cycleTitle(-1);
    else if (low === 'arrowright') cycleTitle(1);
    else if (low === 'enter' || low === ' ') startShift();
  }

  function resultKey(low) {
    if (low === 'enter' || low === ' ') startShift();
    else if (low === 'escape' || low === 'backspace') {
      game.screen = 'TITLE';
      sfx.playClick();
    }
  }

  function playKey(low) {
    const maps = [
      { keys: ['1', '2', '3', '4'], pi: 0 },
      { keys: ['q', 'w', 'e', 'r'], pi: 1 },
      { keys: ['u', 'i', 'o', 'p'], pi: 2 }
    ];
    for (let i = 0; i < maps.length; i++) {
      const idx = maps[i].keys.indexOf(low);
      if (idx >= 0) {
        selectCard(maps[i].pi, idx);
        return;
      }
    }
    const arrowsOk = game.mode !== 'DUEL' && (game.mode === 'SOLO' || activePlayer() === 0);
    if (!arrowsOk) return;
    if (low === 'arrowleft') nudge(0, -1);
    else if (low === 'arrowright') nudge(0, 1);
    else if (low === ' ' || low === 'enter') confirmCursor(0);
  }

  function onKeyDown(e) {
    if (e.repeat) return;
    const low = e.key.toLowerCase();
    if (low === ' ' || low === 'arrowleft' || low === 'arrowright' || low === 'arrowup' || low === 'arrowdown') e.preventDefault();
    sfx.unlock();
    if (low === 'm') {
      sfx.toggleMute();
      return;
    }
    if (game.screen === 'TITLE') titleKey(low);
    else if (game.screen === 'RESULTS') resultKey(low);
    else playKey(low);
  }
  window.addEventListener('keydown', onKeyDown);

  function cardAt(x, y) {
    const rects = cardsGeom();
    for (let i = 0; i < rects.length; i++) if (pointIn(x, y, rects[i])) return i;
    return -1;
  }

  function onPointerMove(e) {
    const p = screenToVirtual(e.clientX, e.clientY);
    game.mouse.x = p.x;
    game.mouse.y = p.y;
    if (game.screen !== 'PLAYING') {
      game.hover = -1;
      return;
    }
    const hit = cardAt(p.x, p.y);
    if (hit !== game.hover) {
      game.hover = hit;
      if (hit >= 0 && canControl(0)) {
        game.players[0].cursor = hit;
        sfx.playTick();
      }
    }
  }

  function onPointerDown(e) {
    sfx.unlock();
    const p = screenToVirtual(e.clientX, e.clientY);
    game.mouse.x = p.x;
    game.mouse.y = p.y;
    if (pointIn(p.x, p.y, muteRect())) {
      sfx.toggleMute();
      return;
    }
    if (game.screen === 'TITLE') {
      const layout = titleLayout();
      for (let i = 0; i < layout.counts.length; i++) {
        if (pointIn(p.x, p.y, layout.counts[i])) {
          game.playerCount = i + 1;
          game.titleRow = 0;
          if (game.playerCount === 1) game.mode = 'SOLO';
          else if (game.mode === 'SOLO') game.mode = 'COOP';
          sfx.playClick();
          return;
        }
      }
      const tierIds = ['EASY', 'MEDIUM', 'HARD', 'EXTREME'];
      for (let i = 0; i < layout.tiers.length; i++) {
        if (pointIn(p.x, p.y, layout.tiers[i])) {
          game.tier = tierIds[i];
          game.titleRow = 1;
          sfx.playClick();
          return;
        }
      }
      const modeIds = ['SOLO', 'COOP', 'DUEL'];
      for (let i = 0; i < layout.modes.length; i++) {
        if (pointIn(p.x, p.y, layout.modes[i])) {
          const id = modeIds[i];
          const allowed = (game.playerCount === 1 && id === 'SOLO') || (game.playerCount > 1 && id !== 'SOLO');
          if (!allowed) {
            sfx.playBuzz();
            return;
          }
          game.mode = id;
          game.titleRow = 2;
          sfx.playClick();
          return;
        }
      }
      if (pointIn(p.x, p.y, layout.start)) startShift();
      return;
    }
    if (game.screen === 'RESULTS') {
      const layout = resultLayout();
      if (pointIn(p.x, p.y, layout.again)) startShift();
      else if (pointIn(p.x, p.y, layout.title)) {
        game.screen = 'TITLE';
        sfx.playClick();
      }
      return;
    }
    const hit = cardAt(p.x, p.y);
    if (hit >= 0) selectCard(0, hit);
  }

  let lastPointerAt = 0;
  function pointerGate(e) {
    const now = performance.now();
    if (now - lastPointerAt < 40) return false;
    lastPointerAt = now;
    if (e && e.preventDefault) e.preventDefault();
    return true;
  }
  function onPrimaryDown(e) {
    if (!pointerGate(e)) return;
    onPointerDown(e);
  }
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerdown', onPrimaryDown);
  canvas.addEventListener('mousedown', onPrimaryDown);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  function pollGamepads() {
    let pads;
    try {
      pads = navigator.getGamepads ? navigator.getGamepads() : [];
    } catch (err) {
      return;
    }
    if (!pads) return;
    for (let i = 0; i < 3; i++) {
      const gp = pads[i];
      const prev = game.players[i].pad;
      if (!gp) {
        prev.a = prev.l = prev.r = prev.u = prev.d = false;
        continue;
      }
      const a = !!((gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[1] && gp.buttons[1].pressed));
      const l = !!((gp.buttons[14] && gp.buttons[14].pressed) || gp.axes[0] < -0.55);
      const r = !!((gp.buttons[15] && gp.buttons[15].pressed) || gp.axes[0] > 0.55);
      const u = !!((gp.buttons[12] && gp.buttons[12].pressed) || gp.axes[1] < -0.55);
      const d = !!((gp.buttons[13] && gp.buttons[13].pressed) || gp.axes[1] > 0.55);
      const fresh = (a && !prev.a) || (l && !prev.l) || (r && !prev.r) || (u && !prev.u) || (d && !prev.d);
      if (fresh) sfx.unlock();
      if (game.screen === 'TITLE' && i === 0) {
        if (u && !prev.u) game.titleRow = (game.titleRow + 3) % 4;
        if (d && !prev.d) game.titleRow = (game.titleRow + 1) % 4;
        if (l && !prev.l) cycleTitle(-1);
        if (r && !prev.r) cycleTitle(1);
        if (a && !prev.a) startShift();
      } else if (game.screen === 'RESULTS' && i === 0) {
        if (a && !prev.a) startShift();
      } else if (game.screen === 'PLAYING') {
        if (l && !prev.l) nudge(i, -1);
        if (r && !prev.r) nudge(i, 1);
        if (u && !prev.u) nudge(i, -1);
        if (d && !prev.d) nudge(i, 1);
        if (a && !prev.a) confirmCursor(i);
      }
      prev.a = a;
      prev.l = l;
      prev.r = r;
      prev.u = u;
      prev.d = d;
    }
  }

  function update(dt) {
    game.belt += dt * (game.phase === 'SHIP' ? 260 : 78);
    game.arm = Math.max(0, game.arm - dt);
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt);
    if (game.flash > 0) game.flash = Math.max(0, game.flash - dt);
    if (game.cardFlash) {
      game.cardFlash.t -= dt;
      if (game.cardFlash.t <= 0) game.cardFlash = null;
    }
    if (game.tip) {
      game.tip.life -= dt;
      if (game.tip.life <= 0) game.tip = null;
    }
    for (let i = 0; i < game.players.length; i++) {
      if (game.players[i].stun > 0 && game.players[i].stun <= performance.now()) game.players[i].stun = 0;
    }
    game.hopper.blue += (game.hopperTarget.blue - game.hopper.blue) * Math.min(1, dt * 4);
    game.hopper.pink += (game.hopperTarget.pink - game.hopper.pink) * Math.min(1, dt * 4);
    for (let i = game.particles.length - 1; i >= 0; i--) {
      const p = game.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.g * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) game.particles.splice(i, 1);
    }
    for (let i = game.floaters.length - 1; i >= 0; i--) {
      const f = game.floaters[i];
      f.y += f.vy * dt;
      f.life -= f.decay * dt;
      if (f.life <= 0) game.floaters.splice(i, 1);
    }
    if (game.screen === 'PLAYING' && game.phase === 'INPUT') {
      game.timeLeft -= dt;
      if (game.timeLeft <= 0) onTimeout();
    }
    if (game.screen === 'PLAYING' && game.phase !== 'INPUT' && performance.now() >= (game.phaseUntil || 0)) {
      const leaving = game.phase;
      game.phase = 'INPUT';
      if (leaving === 'DROP') enterStep2();
      else if (leaving === 'SHIP' || leaving === 'NEXT') nextOrder();
      else if (leaving === 'DEAD') finishShift(true);
    }
    sfx.applyHum();
  }

      const py = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py);
