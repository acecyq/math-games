    const m = muteRect();
    roundRect(m.x, m.y, m.w, m.h, 10, sfx.muted ? '#ffe4e6' : '#ecfeff', sfx.muted ? '#e11d48' : '#0f766e', 2);
    text(sfx.muted ? 'MUTE' : 'SOUND', m.x + m.w / 2, m.y + m.h / 2, 'bold 12px "Segoe UI", system-ui, sans-serif', sfx.muted ? '#be123c' : '#0f766e', 'center');
  }

  function drawBlueprint() {
    const r = game.round;
    const step = currentStep();
    roundRect(UI.sheetX, UI.sheetY, UI.sheetW, UI.sheetH, 16, 'rgba(255,255,255,0.94)', '#7dd3fc', 2);
    if (!r || !step) return;
    drawToy(r.toy.id, UI.sheetX + 46, UI.sheetY + 48, 0.58);
    ctx.save();
    ctx.beginPath();
    ctx.rect(UI.sheetX + 86, UI.sheetY + 10, 300, UI.sheetH - 20);
    ctx.clip();
    text(step.header, UI.sheetX + 88, UI.sheetY + 30, 'bold 16px "Segoe UI", system-ui, sans-serif', '#0f172a', 'left');
    text(step.detail, UI.sheetX + 88, UI.sheetY + 54, '600 13px "Segoe UI", system-ui, sans-serif', '#0369a1', 'left');
    ctx.restore();

    let pill = step.kicker;
    let pillColor = '#0f766e';
    if (game.mode === 'COOP') {
      const p = game.players[activePlayer()];
      pill = p.name + ' ' + p.full;
      pillColor = p.color;
    } else if (game.mode === 'DUEL') {
      pill = 'ALL RACE';
      pillColor = '#e11d48';
    }
    const pillX = UI.sheetX + UI.sheetW - 214;
    roundRect(pillX, UI.sheetY + 16, 198, 52, 12, '#ffffff', pillColor, 2);
    text(pill, pillX + 99, UI.sheetY + 34, 'bold 14px "Segoe UI", system-ui, sans-serif', pillColor, 'center');
    text(game.mode === 'COOP' ? step.kicker : ('ORDER ' + (game.orderIndex + 1)), pillX + 99, UI.sheetY + 54, '11px "Segoe UI", system-ui, sans-serif', '#475569', 'center');

    ctx.save();
    ctx.beginPath();
    ctx.rect(420, UI.sheetY + 8, 620, UI.sheetH - 16);
    ctx.clip();
    drawSegments(step.segments, 730, UI.sheetY + 42, 580);
    ctx.restore();
  }

  function drawSegments(segments, cx, cy, maxW) {
    let size = 22;
    const fontOf = (s) => 'bold ' + s + 'px "Segoe UI", system-ui, sans-serif';
    const widthOf = () => {
      let w = 0;
      ctx.font = fontOf(size);
      for (let i = 0; i < segments.length; i++) w += ctx.measureText(segments[i].t).width;
      return w;
    };
    let total = widthOf();
    while (total > maxW && size > 15) {
      size -= 1;
      total = widthOf();
    }
    let x = cx - total / 2;
    for (let i = 0; i < segments.length; i++) {
      const seg = segments[i];
      ctx.font = fontOf(size);
      const tw = ctx.measureText(seg.t).width;
      if (seg.hot && seg.t) {
        const pulse = 0.5 + 0.5 * Math.sin(animT * 5);
        roundRect(x - 5, cy - size / 2 - 4, tw + 10, size + 8, 8, 'rgba(253, 230, 138,' + (0.75 + pulse * 0.25) + ')', '#f59e0b', 2);
      }
      text(seg.t, x, cy, fontOf(size), seg.hot ? '#c2410c' : '#0f172a', 'left');
      x += tw;
    }
  }

  function drawStage() {
    const r = game.round;
    const step = currentStep();
    roundRect(UI.sheetX, UI.stageY, UI.sheetW, UI.stageH, 18, 'rgba(255,255,255,0.72)', '#bae6fd', 2);
    if (!r || !step) return;
    const drop = Math.sin(clamp(1 - game.arm, 0, 1) * Math.PI);
    drawArm(UI.sheetX + 120, UI.stageY + 8, drop);
    drawArm(UI.sheetX + 390, UI.stageY + 8, Math.max(0, drop - 0.15));

    const focus = step.focus;
    drawHopper(UI.sheetX + 36, UI.stageY + 18, 230, 150, {
      name: r.toy.tens,
      factor: r.A + ' × ' + r.b1,
      value: game.shown.blue == null ? '?' : String(game.shown.blue),
      fill: game.hopper.blue,
      color: '#2563eb',
      deep: '#1e3a8a',
      hot: focus === 'blue' || focus === 'both',
      minus: false
    });
    drawHopper(UI.sheetX + 290, UI.stageY + 18, 230, 150, {
      name: r.toy.ones,
      factor: (r.op === '-' ? '− ' : '') + r.A + ' × ' + r.b2,
      value: game.shown.pink == null ? '?' : String(game.shown.pink),
      fill: game.hopper.pink,
      color: '#fb7185',
      deep: '#9f1239',
      hot: focus === 'pink' || focus === 'both',
      minus: r.op === '-'
    });

    const previewX = UI.sheetX + 760;
    const previewY = UI.stageY + 96;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.ellipse(previewX, previewY + 28, 54, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    drawToy(r.toy.id, previewX, previewY, 1);
    text('ON THE LINE', previewX, UI.stageY + 28, 'bold 12px "Segoe UI", system-ui, sans-serif', '#0369a1', 'center');

    const giftBounce = game.phase === 'SHIP' ? Math.abs(Math.sin(animT * 8)) * 8 : 0;
    drawGift(UI.sheetX + 1040, UI.stageY + 78, 1.15, giftBounce);
    drawGift(UI.sheetX + 1100, UI.stageY + 96, 0.9, giftBounce * 0.6);
    text('GIFT DOCK', UI.sheetX + 1070, UI.stageY + 28, 'bold 12px "Segoe UI", system-ui, sans-serif', '#9d174d', 'center');

    const beltY = UI.stageY + 176;
    drawConveyor(UI.sheetX + 24, beltY, UI.sheetW - 48, 58);
    if (r) {
      for (let i = 0; i < 4; i++) {
        const span = 240;
        let x = UI.sheetX + 80 + ((game.belt * (game.phase === 'SHIP' ? 1 : 0.55) + i * span) % (UI.sheetW - 160));
        const boxed = game.phase === 'SHIP' && x > UI.sheetX + 980;
        if (boxed) drawGift(x, beltY + 24, 0.7, 0);
        else drawToy(r.toy.id, x, beltY + 18, 0.42);
      }
    }

    const ratio = game.timeMax > 0 ? clamp(game.timeLeft / game.timeMax, 0, 1) : 0;
    roundRect(UI.sheetX + 24, UI.stageY + UI.stageH - 18, UI.sheetW - 48, 8, 4, '#e2e8f0', null, 0);
    roundRect(UI.sheetX + 24, UI.stageY + UI.stageH - 18, (UI.sheetW - 48) * ratio, 8, 4, ratio < 0.25 ? '#fb7185' : '#14b8a6', null, 0);
  }

  function drawTip() {
    const step = currentStep();
    roundRect(UI.sheetX, UI.tipY, UI.sheetW, UI.tipH, 14, '#ffffff', game.tip ? '#fb7185' : '#67e8f9', 2);
    if (!step) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(UI.sheetX + 8, UI.tipY + 4, UI.sheetW - 16, UI.tipH - 8);
    ctx.clip();
    if (game.tip) {
      drawHat(UI.sheetX + 28, UI.tipY + 14, '#e11d48');
      text('CHIEF ENGINEER', UI.sheetX + 52, UI.tipY + 18, 'bold 12px "Segoe UI", system-ui, sans-serif', '#be123c', 'left');
      ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
      const lines = wrapLines(game.tip.text, UI.sheetW - 48, 2);
      for (let i = 0; i < lines.length; i++) {
        text(lines[i], UI.sheetX + 18, UI.tipY + 40 + i * 16, '600 15px "Segoe UI", system-ui, sans-serif', '#1f2937', 'left');
      }
    } else {
      text(step.kicker, UI.sheetX + 18, UI.tipY + 18, 'bold 12px "Segoe UI", system-ui, sans-serif', '#0f766e', 'left');
      let promptSize = 18;
      let promptFont = 'bold ' + promptSize + 'px "Segoe UI", system-ui, sans-serif';
      ctx.font = promptFont;
      while (promptSize > 13 && ctx.measureText(step.prompt).width > UI.sheetW - 40) {
        promptSize -= 1;
        promptFont = 'bold ' + promptSize + 'px "Segoe UI", system-ui, sans-serif';
        ctx.font = promptFont;
      }
      text(step.prompt, UI.sheetX + 18, UI.tipY + 42, promptFont, '#0f172a', 'left');
    }
    ctx.restore();
  }

  function keyLabels(index) {
    if (game.mode === 'DUEL') {
      const out = [];
      for (let p = 0; p < game.playerCount; p++) out.push({ t: game.players[p].keys[index], c: game.players[p].color });
      return out;
    }
    if (game.mode === 'COOP') {
      const p = game.players[activePlayer()];
      return [{ t: p.keys[index], c: p.color }];
    }
    return [{ t: game.players[0].keys[index], c: '#0f766e' }];
  }

  function drawCards() {
    const step = currentStep();
    if (!step) return;
    const rects = cardsGeom();
    const dim = game.phase !== 'INPUT';
    for (let i = 0; i < rects.length; i++) {
      const base = rects[i];
      const bad = game.cardFlash && game.cardFlash.bad && game.cardFlash.index === i;
      const jiggle = bad ? Math.sin(animT * 46) * 4 : 0;
      const r = { x: base.x + jiggle, y: base.y, w: base.w, h: base.h };
      const item = step.cards[i];
      let border = '#cbd5e1';
      let width = 2;
      let fill = '#ffffff';
      if (game.lockedIndex === i) {
        border = '#16a34a';
        width = 4;
        fill = '#f0fdf4';
      } else if (bad) {
        border = '#e11d48';
        width = 4;
        fill = '#fff1f2';
      } else if (game.hover === i || (canControl(0) && game.players[0].cursor === i && game.mode !== 'DUEL')) {
        border = '#f59e0b';
        width = 4;
        fill = '#fffbeb';
      }
      ctx.save();
      ctx.globalAlpha = dim && game.lockedIndex !== i ? 0.72 : 1;
      roundRect(r.x, r.y, r.w, r.h, 16, fill, border, width);
      ctx.save();
      ctx.beginPath();
      roundRect(r.x, r.y, r.w, r.h, 16, null, null, 0);
      ctx.clip();
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 1;
      for (let gx = r.x; gx < r.x + r.w; gx += 18) {
        ctx.beginPath();
        ctx.moveTo(gx, r.y);
        ctx.lineTo(gx, r.y + r.h);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = dim && game.lockedIndex !== i ? 0.72 : 1;

      if (game.mode === 'DUEL') {
        for (let p = 0; p < game.playerCount; p++) {
          if (game.players[p].cursor === i) {
            ctx.fillStyle = game.players[p].color;
            ctx.fillRect(r.x + 12 + p * 16, r.y + 8, 12, 6);
          }
        }
      } else if (canControl(0) && game.players[0].cursor === i) {
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(r.x + 12, r.y + 8, 36, 6);
      }

      const labels = keyLabels(i);
      for (let k = 0; k < labels.length; k++) {
        const lx = r.x + 16 + k * 36;
        roundRect(lx, r.y + 20, 30, 24, 6, labels[k].c, null, 0);
        text(labels[k].t, lx + 15, r.y + 32, 'bold 13px "Segoe UI", system-ui, sans-serif', '#ffffff', 'center');
      }

      let size = 30;
      if (item.text.length > 26) size = 16;
      else if (item.text.length > 20) size = 18;
      else if (item.text.length > 14) size = 22;
      else if (item.text.length > 8) size = 26;
      text(item.text, r.x + r.w / 2, r.y + 104, 'bold ' + size + 'px "Segoe UI", system-ui, sans-serif', '#0f172a', 'center');
      ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
      const subLines = wrapLines(item.sub || '', r.w - 28, 2);
      for (let s = 0; s < subLines.length; s++) {
        text(subLines[s], r.x + r.w / 2, r.y + 150 + s * 18, '600 14px "Segoe UI", system-ui, sans-serif', '#475569', 'center');
      }
      ctx.restore();
    }
  }

  function drawFloaters() {
    for (let i = 0; i < game.particles.length; i++) {
      const p = game.particles[i];
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (let i = 0; i < game.floaters.length; i++) {
      const f = game.floaters[i];
      ctx.globalAlpha = clamp(f.life, 0, 1);
      text(f.text, f.x, f.y, 'bold ' + f.size + 'px "Segoe UI", system-ui, sans-serif', f.color, 'center');
    }
    ctx.globalAlpha = 1;
    if (game.flash > 0) {
      ctx.globalAlpha = game.flash;
      ctx.fillStyle = game.flashColor;
      ctx.fillRect(0, 0, VW, VH);
      ctx.globalAlpha = 1;
    }
  }

  function controlBlurb() {
    if (game.playerCount === 1 || game.mode === 'SOLO') {
      return 'Mouse, keys 1 2 3 4, arrows + space, or gamepad A. Press M to mute.';
    }
    if (game.mode === 'COOP') {
      return 'Shared team score and hearts. Turns rotate. P1: 1 2 3 4 / mouse.   P2: Q W E R.   P3: U I O P.';
    }
    return 'First correct lock wins the star. A miss jams you for 1.5s. P1: 1 2 3 4.   P2: Q W E R.   P3: U I O P.';
  }

  function drawTitle() {
    drawBackground();
    roundRect(70, 52, VW - 140, 640, 24, '#ffffff', '#7dd3fc', 3);
    ctx.save();
    ctx.beginPath();
    roundRect(70, 52, VW - 140, 640, 24, null, null, 0);
    ctx.clip();
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(70, 52, VW - 140, 14);
    ctx.restore();
    drawToy('robot', 150, 128, 0.72);
    drawToy('bear', 1130, 128, 0.72);
    text('SINGAPORE PRIMARY 3–4  ·  DISTRIBUTIVE PROPERTY OF MULTIPLICATION', VW / 2, 72, 'bold 13px "Segoe UI", system-ui, sans-serif', '#0369a1', 'center');
    text('TOY-FORGE ASSEMBLY', VW / 2, 112, 'bold 46px "Segoe UI", system-ui, sans-serif', '#0f172a', 'center');
    text('Distributive Multiplication Lab', VW / 2, 152, 'bold 22px "Segoe UI", system-ui, sans-serif', '#db2777', 'center');
    text('Split a 2-digit parts list into two hoppers, multiply every toy, then ship the batch.', VW / 2, 186, '600 16px "Segoe UI", system-ui, sans-serif', '#334155', 'center');

    const layout = titleLayout();
    const focus = game.titleRow;
    text('TOYMAKERS', VW / 2, 220, 'bold 12px "Segoe UI", system-ui, sans-serif', focus === 0 ? '#b45309' : '#64748b', 'center');
    for (let i = 0; i < 3; i++) {
      const r = layout.counts[i];
      const on = game.playerCount === i + 1;
      roundRect(r.x, r.y, r.w, r.h, 14, on ? '#ecfeff' : '#ffffff', on ? '#0f766e' : '#cbd5e1', on ? 4 : 2);
      text((i + 1) + (i === 0 ? ' PLAYER' : ' PLAYERS'), r.x + r.w / 2, r.y + r.h / 2, 'bold 18px "Segoe UI", system-ui, sans-serif', on ? '#0f766e' : '#334155', 'center');
    }

    text('DIFFICULTY', VW / 2, 330, 'bold 12px "Segoe UI", system-ui, sans-serif', focus === 1 ? '#b45309' : '#64748b', 'center');
    const tierIds = ['EASY', 'MEDIUM', 'HARD', 'EXTREME'];
    for (let i = 0; i < 4; i++) {
      const r = layout.tiers[i];
      const meta = TIER_META[tierIds[i]];
      const on = game.tier === tierIds[i];
      roundRect(r.x, r.y, r.w, r.h, 14, on ? '#fffbeb' : '#ffffff', on ? meta.tint : '#cbd5e1', on ? 4 : 2);
      text(meta.name, r.x + r.w / 2, r.y + 24, 'bold 16px "Segoe UI", system-ui, sans-serif', meta.tint, 'center');
      text(meta.blurb, r.x + r.w / 2, r.y + 46, '12px "Segoe UI", system-ui, sans-serif', '#475569', 'center');
    }

    text('MODE', VW / 2, 452, 'bold 12px "Segoe UI", system-ui, sans-serif', focus === 2 ? '#b45309' : '#64748b', 'center');
    const modeIds = ['SOLO', 'COOP', 'DUEL'];
    for (let i = 0; i < 3; i++) {
      const r = layout.modes[i];
      const id = modeIds[i];
      const meta = MODE_META[id];
      const allowed = (game.playerCount === 1 && id === 'SOLO') || (game.playerCount > 1 && id !== 'SOLO');
      const on = game.mode === id && allowed;
      ctx.save();
      ctx.globalAlpha = allowed ? 1 : 0.38;
      roundRect(r.x, r.y, r.w, r.h, 14, on ? '#f0fdfa' : '#ffffff', on ? meta.tint : '#cbd5e1', on ? 4 : 2);
      text(meta.name, r.x + r.w / 2, r.y + 24, 'bold 16px "Segoe UI", system-ui, sans-serif', meta.tint, 'center');
      text(meta.blurb, r.x + r.w / 2, r.y + 46, '12px "Segoe UI", system-ui, sans-serif', '#475569', 'center');
      ctx.restore();
    }

    const start = layout.start;
    const startHot = focus === 3;
    roundRect(start.x, start.y, start.w, start.h, 16, '#0f766e', startHot ? '#fbbf24' : '#115e59', startHot ? 4 : 2);
    text('START THE SHIFT', start.x + start.w / 2, start.y + start.h / 2, 'bold 22px "Segoe UI", system-ui, sans-serif', '#ffffff', 'center');
    text(controlBlurb(), VW / 2, 648, '13px "Segoe UI", system-ui, sans-serif', '#334155', 'center');
    if (game.playerCount === 1) {
      text('Add a 2nd toymaker to open Team Co-op and Factory Duel.', VW / 2, 672, '12px "Segoe UI", system-ui, sans-serif', '#64748b', 'center');
    }
    drawMute();
  }

  function drawResults() {
    drawBackground();
    drawMute();
    roundRect(180, 70, VW - 360, 580, 24, 'rgba(255,255,255,0.96)', '#7dd3fc', 3);
    const res = game.result || { ranOut: false, winner: -1, accuracy: 0 };
    const title = res.ranOut ? 'FACTORY HEARTS RAN OUT' : 'SHIFT COMPLETE';
    text(title, VW / 2, 120, 'bold 34px "Segoe UI", system-ui, sans-serif', res.ranOut ? '#be123c' : '#0f766e', 'center');
    text(TIER_META[game.tier].role + '  ·  ' + (game.mode === 'COOP' ? 'TEAM CO-OP' : MODE_META[game.mode].name), VW / 2, 160, '600 16px "Segoe UI", system-ui, sans-serif', '#334155', 'center');

    if (game.mode === 'DUEL') {
      text(res.winner < 0 ? 'SHARED BELT — TIE' : (game.players[res.winner].name + ' ' + game.players[res.winner].full + ' WINS'), VW / 2, 210, 'bold 24px "Segoe UI", system-ui, sans-serif', '#b45309', 'center');
      for (let i = 0; i < game.playerCount; i++) {
        const p = game.players[i];
        const x = 420 + i * 180;
        drawHat(x, 250, p.color);
        text(p.name, x, 290, 'bold 16px "Segoe UI", system-ui, sans-serif', p.color, 'center');
        drawStar(x - 16, 320, 12, '#fbbf24');
        text(String(p.stars), x + 8, 320, 'bold 22px "Segoe UI", system-ui, sans-serif', '#0f172a', 'left');
        text(fmt(p.score) + ' pts', x, 348, '13px "Segoe UI", system-ui, sans-serif', '#475569', 'center');
      }
    } else if (game.mode === 'COOP') {
      text('TEAM SCORE', VW / 2, 214, 'bold 14px "Segoe UI", system-ui, sans-serif', '#64748b', 'center');
      text(fmt(game.score), VW / 2, 258, 'bold 48px "Segoe UI", system-ui, sans-serif', '#0f172a', 'center');
      text('One crew. One score. Hearts left: ' + game.hearts, VW / 2, 304, '16px "Segoe UI", system-ui, sans-serif', '#334155', 'center');
    } else {
      text('TOYMAKER POINTS', VW / 2, 214, 'bold 14px "Segoe UI", system-ui, sans-serif', '#64748b', 'center');
      text(fmt(game.score), VW / 2, 258, 'bold 48px "Segoe UI", system-ui, sans-serif', '#0f172a', 'center');
    }

    const y0 = game.mode === 'SOLO' ? 330 : (game.mode === 'COOP' ? 350 : 390);
    text('Orders shipped  ' + game.shipped + ' / ' + ORDERS, VW / 2, y0, '600 18px "Segoe UI", system-ui, sans-serif', '#0f172a', 'center');
    text('Clean shipments  ' + game.clean + '    Accuracy  ' + res.accuracy + '%    Best combo  ' + game.bestCombo, VW / 2, y0 + 32, '16px "Segoe UI", system-ui, sans-serif', '#334155', 'center');

    if (game.lastRound) {
      roundRect(240, y0 + 58, 800, 78, 12, '#f0fdfa', '#99f6e4', 2);
      text('LAST BLUEPRINT', VW / 2, y0 + 78, 'bold 12px "Segoe UI", system-ui, sans-serif', '#0f766e', 'center');
      text(identityLine(game.lastRound), VW / 2, y0 + 106, '600 16px "Segoe UI", system-ui, sans-serif', '#0f172a', 'center');
    }

    const layout = resultLayout();
    roundRect(layout.again.x, layout.again.y, layout.again.w, layout.again.h, 14, '#0f766e', '#115e59', 2);
    text('RUN ANOTHER SHIFT', layout.again.x + layout.again.w / 2, layout.again.y + 27, 'bold 16px "Segoe UI", system-ui, sans-serif', '#ffffff', 'center');
    roundRect(layout.title.x, layout.title.y, layout.title.w, layout.title.h, 14, '#ffffff', '#0284c7', 2);
    text('BACK TO TITLE', layout.title.x + layout.title.w / 2, layout.title.y + 27, 'bold 16px "Segoe UI", system-ui, sans-serif', '#0369a1', 'center');
    text('Enter runs another shift. Esc returns to the title.', VW / 2, 640, '13px "Segoe UI", system-ui, sans-serif', '#64748b', 'center');
  }

  function drawPlay() {
    drawBackground();
    drawHUD();
    drawBlueprint();
    drawStage();
    drawTip();
    drawCards();
    drawFloaters();
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastNow) / 1000) || 0.016;
    lastNow = now;
    animT += dt;
    try {
      pollGamepads();
      update(dt);
      ctx.save();
      if (game.shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      if (game.screen === 'TITLE') drawTitle();
      else if (game.screen === 'RESULTS') drawResults();
      else drawPlay();
      ctx.restore();
    } catch (err) {
      ctx.restore();
      if (!window.__loopError) window.__loopError = String(err && err.stack ? err.stack : err);
    }
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
