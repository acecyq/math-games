<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ratio Jet: Kaiju Strike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b1a2a;
      --cyan: #3de7ff;
      --amber: #ffc14a;
      --coral: #ff5d6c;
      --mint: #5dffb0;
      --hud: #e8f4ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--hud);
      background:
        radial-gradient(ellipse at 15% 0%, #1a4a6e 0%, transparent 45%),
        radial-gradient(ellipse at 90% 10%, #3a1a40 0%, transparent 40%),
        linear-gradient(180deg, #06101c 0%, #0d2138 55%, #132a20 100%);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #app {
      height: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(16, 35, 58, 0.92);
      border: 2px solid rgba(61, 231, 255, 0.35);
      border-radius: 14px;
      padding: 8px 12px;
      box-shadow: 0 0 24px rgba(61, 231, 255, 0.08);
    }
    h1 {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: clamp(0.95rem, 2.8vw, 1.25rem);
      letter-spacing: 0.04em;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(61, 231, 255, 0.45);
    }
    .hud-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chip {
      background: rgba(8, 20, 36, 0.85);
      border: 1px solid rgba(61, 231, 255, 0.3);
      border-radius: 999px;
      padding: 4px 12px;
      font-weight: 800;
      font-size: 0.85rem;
    }
    .chip.combo { color: var(--amber); border-color: rgba(255, 193, 74, 0.45); }
    .icon-btn {
      border: 2px solid rgba(61, 231, 255, 0.4);
      background: rgba(8, 20, 36, 0.9);
      color: var(--hud);
      border-radius: 12px;
      padding: 6px 10px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .boss-hud {
      background: rgba(16, 35, 58, 0.92);
      border: 2px solid rgba(255, 93, 108, 0.4);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .lane-hud-row {
      display: grid;
      grid-template-columns: minmax(132px, 190px) 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .lane-hud-row .who {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      line-height: 1.25;
    }
    .turnline {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--amber);
      letter-spacing: 0.03em;
    }
    .hp-track {
      height: 16px;
      border-radius: 999px;
      background: #061018;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }
    .hp-track.slim { height: 12px; }
    .hp-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.18);
      transition: width 0.35s ease-out;
    }
    .boss-hp-text { color: var(--amber); font-weight: 800; font-size: 0.82rem; }
    #stageWrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 180px;
      border: 2px solid rgba(61, 231, 255, 0.35);
      border-radius: 16px;
      overflow: hidden;
      background: #06101c;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.35);
    }
    #game { display: block; width: 100%; height: 100%; }
    #cockpit {
      background: rgba(16, 35, 58, 0.95);
      border: 2px solid rgba(61, 231, 255, 0.35);
      border-radius: 16px;
      padding: 8px;
      max-height: 46vh;
      overflow: auto;
      flex: 0 0 auto;
    }
    .waitline {
      text-align: center;
      font-weight: 800;
      color: var(--amber);
      padding: 8px 0 2px;
    }
    .boards { display: grid; gap: 8px; }
    .boards.n2 { grid-template-columns: 1fr 1fr; }
    .boards.n3 { grid-template-columns: 1fr 1fr 1fr; }
    .pilot-card { border-radius: 14px; padding: 2px; }
    .boards.duel .pilot-card,
    .boards.coop .pilot-card {
      border: 2px solid rgba(255, 255, 255, 0.16);
      background: rgba(6, 16, 28, 0.45);
      padding: 8px;
    }
    .who-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }
    .prompt {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: clamp(0.78rem, 1.7vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
      min-height: 2.5em;
      color: #dff7ff;
      margin-bottom: 4px;
    }
    .boards.n1 .prompt {
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      min-height: 1.4em;
    }
    .boards.n3 .prompt { font-size: 0.68rem; min-height: 2.5em; margin-bottom: 4px; }
    .boards.n3 .choice { min-height: 36px; font-size: 0.72rem; padding: 2px; }
    .boards.n3 .choices { gap: 6px; }
    .boards.duel .pilot-card { padding: 6px; }
    .prompt .ratio {
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(61, 231, 255, 0.35);
    }
    .tip {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--amber);
      min-height: 0;
    }
    .tip:empty { display: none; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .boards.n1 .choices { grid-template-columns: repeat(4, 1fr); }
    .choice {
      min-height: 52px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: clamp(0.82rem, 2vw, 1.12rem);
      font-weight: 700;
      cursor: pointer;
      color: #0b1a2a;
      padding: 8px 6px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.08s, filter 0.12s;
    }
    .choice:nth-child(1) { background: linear-gradient(180deg, #9ef0ff, #3de7ff); }
    .choice:nth-child(2) { background: linear-gradient(180deg, #ffe29a, #ffc14a); }
    .choice:nth-child(3) { background: linear-gradient(180deg, #b8ffd9, #5dffb0); }
    .choice:nth-child(4) { background: linear-gradient(180deg, #ffb3bc, #ff5d6c); color: #2a0a10; }
    .choice:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
    .choice:disabled { opacity: 0.55; cursor: not-allowed; }
    .choice.focused {
      outline: 3px solid #fff;
      outline-offset: 2px;
      filter: brightness(1.08);
      transform: translateY(-2px);
    }
    .choice.good { outline: 3px solid #0d5c32; box-shadow: 0 0 0 3px rgba(93, 255, 176, 0.45); }
    .choice.bad { outline: 3px solid #7a1020; filter: grayscale(0.35); }
    .choice .key {
      display: block;
      font-size: 0.62rem;
      opacity: 0.7;
      font-family: Nunito, sans-serif;
      letter-spacing: 0.04em;
    }
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(4, 10, 20, 0.82), rgba(4, 10, 20, 0.28));
      display: flex; align-items: flex-start; justify-content: center;
      z-index: 20; padding: 12px;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: linear-gradient(165deg, #14304d 0%, #0c1c30 100%);
      border: 3px solid rgba(61, 231, 255, 0.45);
      border-radius: 20px;
      padding: 16px 16px 12px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(61, 231, 255, 0.15);
      max-height: 94%;
      overflow-y: auto;
    }
    .modal h2 {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-size: 1.28rem;
      color: var(--cyan);
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }
    .modal p { font-size: 0.95rem; line-height: 1.45; margin-bottom: 8px; }
    .modal .help {
      text-align: left;
      font-size: 0.84rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 10px 12px;
      margin: 10px 0;
      line-height: 1.5;
    }
    .mode-row, .count-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .count-row.hidden { display: none; }
    .mode-btn, .count-btn {
      border: 2px solid rgba(61, 231, 255, 0.35);
      background: rgba(0, 0, 0, 0.28);
      color: var(--hud);
      font-family: 'Orbitron', system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.72rem;
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .mode-btn.on, .count-btn.on {
      background: linear-gradient(180deg, #6af0ff, #1ec8e0);
      color: #041018;
      border-color: transparent;
    }
    .primary, .ghost {
      font-family: 'Orbitron', system-ui, sans-serif;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 12px 18px;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .primary {
      border: none;
      background: linear-gradient(180deg, #6af0ff, #1ec8e0);
      color: #041018;
      box-shadow: 0 4px 0 #0a6a7a;
    }
    #startOverlay .primary {
      position: sticky;
      bottom: 0;
      z-index: 2;
      box-shadow: 0 4px 0 #0a6a7a, 0 -14px 16px #0e2438;
    }
    .primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #0a6a7a; }
    .ghost {
      border: 2px solid rgba(61, 231, 255, 0.45);
      background: transparent;
      color: var(--hud);
      margin-left: 8px;
    }
    .end-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
      text-align: left;
    }
    .stat {
      background: rgba(0,0,0,0.28);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(61,231,255,0.2);
    }
    .stat .label { font-size: 0.72rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em; }
    .stat .value { font-family: 'Orbitron', sans-serif; font-size: 1.05rem; color: var(--amber); margin-top: 2px; }
    @media (max-width: 680px) {
      .boards.n2, .boards.n3 { grid-template-columns: 1fr; }
      .boards.n1 .choices { grid-template-columns: 1fr 1fr; }
      .lane-hud-row { grid-template-columns: minmax(96px, 140px) 1fr auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>RATIO JET: KAIJU STRIKE</h1>
      <div class="hud-right">
        <div class="chip combo" id="comboChip">SOLO</div>
        <div class="chip" id="timeChip">READY</div>
        <button type="button" class="icon-btn" id="muteBtn" aria-label="Mute">🔊</button>
      </div>
    </header>

    <div class="boss-hud" id="bossHud"></div>

    <div id="stageWrap">
      <canvas id="game"></canvas>

      <div class="overlay" id="startOverlay">
        <div class="modal">
          <h2>MISSION BRIEFING</h2>
          <p id="modeBlurb">One ace, one kaiju. Every ratio is rolled at random.</p>
          <div class="mode-row" id="modeRow">
            <button type="button" class="mode-btn on" data-mode="solo">SOLO</button>
            <button type="button" class="mode-btn" data-mode="coop">CO-OP</button>
            <button type="button" class="mode-btn" data-mode="duel">DUEL</button>
          </div>
          <div class="count-row hidden" id="playerRow">
            <button type="button" class="count-btn on" data-n="2">2 PILOTS</button>
            <button type="button" class="count-btn" data-n="3">3 PILOTS</button>
          </div>
          <div class="help" id="helpBox"></div>
          <button type="button" class="primary" id="startBtn">LAUNCH MISSION</button>
        </div>
      </div>

      <div class="overlay hidden" id="winOverlay">
        <div class="modal">
          <h2 id="winTitle">MISSION ACCOMPLISHED</h2>
          <p id="winLead">Kaiju down.</p>
          <div class="stats" id="winStats"></div>
          <div class="end-row">
            <button type="button" class="primary" id="againBtn">REDEPLOY</button>
            <button type="button" class="ghost" id="briefBtn">CHANGE MODE</button>
          </div>
        </div>
      </div>
    </div>

    <div id="cockpit">
      <div id="boards"></div>
    </div>
  </div>

  <script>
(function () {
  'use strict';

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { var t = b; b = a % b; a = t; }
    return a || 1;
  }
  function gcdArr(arr) {
    return arr.reduce(function (g, n) { return gcd(g, n); }, arr[0]);
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function fmtRatio(terms) { return terms.join(' : '); }
  function scale(terms, k) { return terms.map(function (n) { return n * k; }); }
  function eqRatio(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  function sameRatio(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (var i = 1; i < a.length; i++) {
      if (a[0] * b[i] !== b[0] * a[i]) return false;
    }
    return true;
  }
  function within(terms, max) {
    for (var i = 0; i < terms.length; i++) {
      if (terms[i] < 1 || terms[i] > max || (terms[i] | 0) !== terms[i]) return false;
    }
    return true;
  }
  function randomBase(n) {
    var hi = n === 3 ? 9 : 12;
    for (var attempt = 0; attempt < 40; attempt++) {
      var terms = [];
      for (var i = 0; i < n; i++) terms.push(randInt(1, hi));
      if (gcdArr(terms) !== 1) continue;
      var mixed = false;
      for (var j = 1; j < terms.length; j++) if (terms[j] !== terms[0]) mixed = true;
      if (mixed) return terms;
    }
    return n === 3 ? [2, 3, 5] : [3, 5];
  }
  function promptLine(kind, terms) {
    var ratio = '<span class="ratio">' + fmtRatio(terms) + '</span>';
    var lines = kind === 'simplify'
      ? [
          'Find the simplest form of ' + ratio,
          'Simplify ' + ratio,
          'Which ratio is ' + ratio + ' in lowest terms?'
        ]
      : [
          'Which ratio is equivalent to ' + ratio + '?',
          'Find an equivalent ratio for ' + ratio,
          ratio + ' is equivalent to…'
        ];
    return lines[randInt(0, lines.length - 1)];
  }
  function makeDistractors(promptTerms, answer) {
    var out = [];
    var seen = {};
    seen[answer.join(':')] = true;
    function add(t) {
      if (!t || t.length !== answer.length || !within(t, 120)) return;
      if (sameRatio(t, answer) || sameRatio(t, promptTerms)) return;
      var key = t.join(':');
      if (seen[key]) return;
      seen[key] = true;
      out.push(t.slice());
    }
    var k1 = randInt(2, 5);
    var left = promptTerms.slice();
    left[0] = left[0] * k1;
    add(left);
    var right = promptTerms.slice();
    right[right.length - 1] = right[right.length - 1] * k1;
    add(right);
    if (promptTerms.length === 3) {
      var mid = promptTerms.slice();
      mid[1] = mid[1] * randInt(2, 4);
      add(mid);
    }
    var addN = randInt(1, 5);
    add(promptTerms.map(function (n) { return n + addN; }));
    add(promptTerms.map(function (n, i) { return n + addN + (i % 2); }));
    add(promptTerms.slice().reverse());
    add(answer.slice().reverse());
    for (var i = 0; i < answer.length; i++) {
      var up = answer.slice();
      up[i] = up[i] + 1;
      add(up);
      var down = answer.slice();
      down[i] = down[i] - 1;
      add(down);
    }
    var g = gcdArr(promptTerms);
    if (g > 1) {
      for (var f = 2; f < g; f++) {
        if (g % f === 0) {
          add(promptTerms.map(function (n) { return n / f; }));
          break;
        }
      }
    }
    var guard = 0;
    while (out.length < 3 && guard < 24) {
      guard++;
      add(answer.map(function (n, idx) { return n + randInt(1, 5) + idx + guard; }));
    }
    return out;
  }
  function tryQuestion() {
    var n = Math.random() < 0.32 ? 3 : 2;
    var kind = Math.random() < 0.52 ? 'simplify' : 'equivalent';
    var base = randomBase(n);
    var promptTerms;
    var answer;
    if (kind === 'simplify') {
      promptTerms = scale(base, randInt(2, n === 3 ? 6 : 8));
      answer = base.slice();
      if (!within(promptTerms, n === 3 ? 72 : 96)) return null;
    } else {
      var shown = Math.random() < 0.55 ? 1 : randInt(2, 3);
      promptTerms = scale(base, shown);
      answer = scale(promptTerms, randInt(2, n === 3 ? 4 : 5));
      if (!within(promptTerms, 48) || !within(answer, 96)) return null;
      if (eqRatio(answer, promptTerms)) return null;
    }
    var distractors = makeDistractors(promptTerms, answer);
    if (distractors.length < 3) return null;
    return {
      kind: kind,
      promptTerms: promptTerms,
      answer: answer,
      options: shuffle([answer].concat(distractors.slice(0, 3))),
      promptHtml: promptLine(kind, promptTerms),
      sig: kind + '|' + promptTerms.join(':') + '>' + answer.join(':')
    };
  }
  function fallbackQuestion() {
    var promptTerms = [8, 12];
    var answer = [2, 3];
    return {
      kind: 'simplify',
      promptTerms: promptTerms,
      answer: answer,
      options: shuffle([answer, [3, 2], [8, 10], [4, 8]]),
      promptHtml: promptLine('simplify', promptTerms),
      sig: 'simplify|8:12>2:3'
    };
  }
  function generateQuestion(avoid) {
    var q = null;
    for (var i = 0; i < 18; i++) {
      q = tryQuestion();
      if (!q) continue;
      var promptKey = q.promptTerms.join(':');
      if (avoid[q.sig] || avoid[promptKey]) continue;
      return q;
    }
    return q || fallbackQuestion();
  }
  function isRight(q, chosen) {
    if (!q || !chosen) return false;
    if (q.kind === 'equivalent') return sameRatio(chosen, q.answer);
    return eqRatio(chosen, q.answer);
  }

  var AudioFX = {
    ctx: null, muted: false, musicTimer: null, step: 0,
    ensure: function () {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },
    tone: function (freq, dur, type, gain, when) {
      if (this.muted) return;
      var actx = this.ensure();
      var t0 = (when || 0) + actx.currentTime;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(gain || 0.08, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    },
    noiseBurst: function (dur, gain) {
      if (this.muted) return;
      var actx = this.ensure();
      var n = Math.floor(actx.sampleRate * dur);
      var buf = actx.createBuffer(1, n, actx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = actx.createBufferSource();
      var g = actx.createGain();
      var f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 900;
      src.buffer = buf;
      g.gain.value = gain || 0.12;
      src.connect(f); f.connect(g); g.connect(actx.destination);
      src.start();
    },
    laser: function () {
      if (this.muted) return;
      var actx = this.ensure();
      var t0 = actx.currentTime;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(880, t0);
      o.frequency.exponentialRampToValueAtTime(220, t0 + 0.18);
      g.gain.setValueAtTime(0.07, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + 0.22);
    },

    body.addColorStop(0.55, '#b7e4f8');
    body.addColorStop(1, '#6eafd2');
    ctx.fillStyle = body;
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = pilot.color;
    ctx.beginPath();
    ctx.moveTo(42, 0); ctx.lineTo(14, -6); ctx.lineTo(14, 6); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#16324a';
    ctx.beginPath();
    ctx.ellipse(13, -1, 9, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(190, 240, 255, 0.85)';
    ctx.beginPath();
    ctx.ellipse(11, -3.5, 4.5, 2, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#203848';
    ctx.strokeStyle = '#0c1c28';
    ctx.fillRect(-30, -6, 10, 12);
    ctx.strokeRect(-30, -6, 10, 12);
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(t * 28);
    ctx.fillStyle = pilot.color;
    ctx.beginPath();
    ctx.moveTo(-30, -5);
    ctx.lineTo(-50 - Math.sin(t * 32) * 6, 0);
    ctx.lineTo(-30, 5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff6d2';
    ctx.beginPath();
    ctx.moveTo(-30, -2); ctx.lineTo(-38, 0); ctx.lineTo(-30, 2); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawAtmosphere(W, H, t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#07111f');
    g.addColorStop(0.42, '#16385c');
    g.addColorStop(0.78, '#1d4d62');
    g.addColorStop(1, '#204838');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    var neb = ctx.createRadialGradient(W * 0.78, H * 0.16, 8, W * 0.78, H * 0.16, W * 0.42);
    neb.addColorStop(0, 'rgba(255, 140, 90, 0.16)');
    neb.addColorStop(1, 'transparent');
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, W, H);
    var moonR = Math.max(16, Math.min(W, H) * 0.055);
    ctx.fillStyle = '#f6f1d4';
    ctx.beginPath();
    ctx.arc(W * 0.84, H * 0.14, moonR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(180, 170, 130, 0.35)';
    ctx.beginPath();
    ctx.arc(W * 0.84 - moonR * 0.2, H * 0.14 - moonR * 0.15, moonR * 0.28, 0, Math.PI * 2);
    ctx.fill();
    state.stars.forEach(function (s) {
      ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 2 + s.tw));
      ctx.fillStyle = '#f3fbff';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    state.clouds.forEach(function (c) {
      var cx = c.x * W;
      var cy = c.y * H;
      ctx.fillStyle = 'rgba(236, 246, 255, 0.14)';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 46 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 28 * c.s, cy + 4, 32 * c.s, 14 * c.s, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - 30 * c.s, cy + 6, 28 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  function drawLaneGround(box, t) {
    var H = box.h;
    var y0 = box.y;
    state.buildings.forEach(function (b) {
      var bx = b.x * box.w;
      var bw = b.w * box.w;
      var bh = Math.min(H * 0.34, b.h * H * 0.55);
      var by = y0 + H - bh;
      ctx.fillStyle = '#071421';
      ctx.fillRect(bx, by, bw, bh);
      var face = ctx.createLinearGradient(bx, by, bx, y0 + H);
      face.addColorStop(0, '#1a3348');
      face.addColorStop(1, '#0c1c2c');
      ctx.fillStyle = face;
      ctx.fillRect(bx + 2, by + 2, Math.max(2, bw - 4), bh);
      if (b.windows) {
        for (var wy = by + 8; wy < y0 + H - 8; wy += 11) {
          for (var wx = bx + 5; wx < bx + bw - 5; wx += 8) {
            if (Math.sin(wx * 0.17 + wy * 0.13 + t * 0.5) > 0.2) {
              ctx.fillStyle = Math.sin(wx + wy) > 0.9 ? '#ffe08a' : 'rgba(120, 230, 255, 0.35)';
              ctx.fillRect(wx, wy, 3, 4);
            }
          }
        }
      }
    });
    ctx.fillStyle = 'rgba(80, 255, 190, 0.08)';
    ctx.fillRect(0, y0 + H * 0.9, box.w, H * 0.1);
  }
  function drawLaneFx(lane) {
    state.projectiles.forEach(function (p) {
      if (p.lane !== lane) return;
      if (p.type === 'laser') {
        var u = p.t || 0;
        var lx = p.x + (p.tx - p.x) * u;
        var ly = p.y + (p.ty - p.y) * u;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.w;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(lx, ly);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(lx, ly, 3, 0, Math.PI * 2);
        ctx.fill();
      } else {
        if (p.trail) {
          for (var i = 0; i < p.trail.length; i++) {
            ctx.globalAlpha = i / p.trail.length * 0.6;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.trail[i].x, p.trail[i].y, 3, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = '#fff6d0';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    state.particles.forEach(function (p) {
      if (p.lane !== lane) return;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    state.thrusters.forEach(function (th) {
      if (th.lane !== lane) return;
      ctx.globalAlpha = Math.max(0, th.life * 3);
      ctx.fillStyle = th.color;
      ctx.beginPath();
      ctx.arc(th.x, th.y, th.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  function drawFloaters() {
    state.floaters.forEach(function (f) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.4));
      ctx.fillStyle = f.color;
      ctx.font = '800 18px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;
  }
  function drawWinBurst(t) {
    var k = Math.min(1, state.winBurst);
    ctx.fillStyle = 'rgba(255, 214, 120,' + (0.18 * (1 - k * 0.4)) + ')';
    ctx.beginPath();
    ctx.arc(state.winX, state.winY, 30 + k * 180, 0, Math.PI * 2);
    ctx.fill();
    for (var i = 0; i < 14; i++) {
      var ang = i / 14 * Math.PI * 2 + t;
      var rr = 50 + k * 150;
      ctx.fillStyle = i % 2 ? '#ffe08a' : '#fff';
      ctx.globalAlpha = 1 - k * 0.45;
      ctx.beginPath();
      ctx.arc(state.winX + Math.cos(ang) * rr, state.winY + Math.sin(ang) * rr, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function renderFrame(t) {
    var lay = layout();
    var W = lay.W;
    var H = lay.H;
    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }
    drawAtmosphere(W, H, t);
    for (var i = 0; i < lay.lanes.length; i++) {
      var box = lay.lanes[i];
      var ace = state.aces[i];
      if (!ace) continue;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, box.y, W, box.h);
      ctx.clip();
      if (lay.lanes.length > 1) {
        ctx.fillStyle = PILOTS[i].tint;
        ctx.fillRect(0, box.y, W, box.h);
      }
      drawLaneGround(box, t);
      drawMonster(ace, box.kaijuX, box.kaijuY, t, box.scale);
      if (state.mode === 'coop' && state.playersN > 1) {
        var slot = 0;
        for (var w = 0; w < state.playersN; w++) {
          if (w === activePlayer()) continue;
          var off = (slot - (state.playersN - 2) / 2) * 42;
          slot++;
          ctx.save();
          ctx.globalAlpha = 0.4;
          drawJet(box.jetX - 40 * box.scale, box.jetY + off * box.scale, t, PILOTS[w], ace, box.scale * 0.5, true, i);
          ctx.restore();
        }
      }
      drawJet(box.jetX, box.jetY, t, jetPilot(i), ace, box.scale, false, i);
      drawLaneFx(i);
      ctx.restore();
      ctx.textAlign = 'left';
      ctx.font = '700 12px Orbitron, sans-serif';
      if (lay.lanes.length > 1) {
        ctx.fillStyle = PILOTS[i].color;
        ctx.fillRect(0, box.y, W, 3);
      }
      ctx.fillStyle = lay.lanes.length > 1 ? PILOTS[i].color : KAIJU[ace.species].color;
      ctx.fillText((lay.lanes.length > 1 ? PILOTS[i].short + '   ' : '') + KAIJU[ace.species].name, 12, box.y + 18);
      ctx.font = '800 11px Nunito, sans-serif';
      ctx.fillStyle = 'rgba(232,244,255,0.86)';
      ctx.fillText(KAIJU[ace.species].title, 12, box.y + 32);
    }
    drawFloaters();
    if (state.winBurst > 0) drawWinBurst(t);
    ctx.restore();
  }

  function updateVFX(dt) {
    var i;
    for (i = state.projectiles.length - 1; i >= 0; i--) {
      var p = state.projectiles[i];
      p.life -= dt;
      if (p.life <= 0) { state.projectiles.splice(i, 1); continue; }
      if (p.type === 'laser') p.t = Math.min(1, (p.t || 0) + dt / 0.26);
      else {
        var dx = p.tx - p.x;
        var dy = p.ty - p.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        p.vx += (dx / dist) * 460 * dt;
        p.vy += (dy / dist) * 460 * dt;
        var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (sp > 560) { p.vx *= 560 / sp; p.vy *= 560 / sp; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 8) p.trail.shift();
      }
    }
    for (i = state.particles.length - 1; i >= 0; i--) {
      var pt = state.particles[i];
      pt.life -= dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 90 * dt;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }
    for (i = state.thrusters.length - 1; i >= 0; i--) {
      var th = state.thrusters[i];
      th.life -= dt;
      th.x += th.vx * dt;
      th.y += th.vy * dt;
      if (th.life <= 0) state.thrusters.splice(i, 1);
    }
    for (i = state.floaters.length - 1; i >= 0; i--) {
      state.floaters[i].life -= dt;
      state.floaters[i].y -= 42 * dt;
      if (state.floaters[i].life <= 0) state.floaters.splice(i, 1);
    }
    state.clouds.forEach(function (c) {
      c.x += c.v * dt;
      if (c.x > 1.25) c.x = -0.3;
    });
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
    for (i = 0; i < state.aces.length; i++) {
      var ace = state.aces[i];
      if (ace.flash > 0) ace.flash = Math.max(0, ace.flash - dt * 2.2);
      if (ace.hit > 0) ace.hit = Math.max(0, ace.hit - dt * 2.5);
      if (ace.charge > 0) ace.charge = Math.max(0, ace.charge - dt * 2);
      if (ace.shield > 0) ace.shield = Math.max(0, ace.shield - dt * 1.2);
      if (ace.hpDisplay > ace.hp) {
        ace.hpDisplay = Math.max(ace.hp, ace.hpDisplay - dt * 280);
        updateHUD();
      }
    }
    if (state.winBurst > 0 && state.winBurst < 3) state.winBurst += dt;
  }

  function moveFocus(player, dir) {
    if (state.phase !== 'play') return;
    var ace = state.aces[state.mode === 'duel' ? player : 0];
    if (!ace || !ace.question || ace.resolved) return;
    var n = ace.question.options.length;
    ace.focus = (ace.focus + dir + n) % n;
    renderBoards();
  }
  function findKey(k) {
    var limit = state.mode === 'solo' ? 1 : state.playersN;
    for (var p = 0; p < KEY_MAPS.length; p++) {
      if (KEY_MAPS[p][k] == null) continue;
      if (p >= limit) return null;
      return { player: p, index: KEY_MAPS[p][k] };
    }
    return null;
  }
  function pollGamepad() {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    if (!pads) return;
    var n = state.mode === 'solo' ? 1 : state.playersN;
    for (var p = 0; p < n; p++) {
      if (state.mode === 'coop' && p !== activePlayer()) continue;
      var gp = pads[p];
      if (!gp) continue;
      var buttons = gp.buttons || [];
      var axes = gp.axes || [];
      var pressed = function (btn) { return buttons[btn] && (buttons[btn].pressed || buttons[btn].value > 0.5); };
      var just = function (key, on) {
        var id = p + ':' + key;
        var was = !!state.gpPrev[id];
        state.gpPrev[id] = on;
        return on && !was;
      };
      var axX = axes[0] != null ? axes[0] : 0;
      var axY = axes[1] != null ? axes[1] : 0;
      var left = pressed(PAD.LEFT) || axX < -AXIS_DEAD;
      var right = pressed(PAD.RIGHT) || axX > AXIS_DEAD;
      var up = pressed(PAD.UP) || axY < -AXIS_DEAD;
      var down = pressed(PAD.DOWN) || axY > AXIS_DEAD;
      var focusPlayer = state.mode === 'duel' ? p : 0;
      var answerPlayer = state.mode === 'duel' ? p : activePlayer();
      if (just('L', left) || just('U', up)) moveFocus(focusPlayer, -1);
      else if (just('R', right) || just('D', down)) moveFocus(focusPlayer, 1);
      var ace = state.aces[focusPlayer];
      if (just('A', pressed(PAD.A)) && ace) selectChoice(answerPlayer, ace.focus);
      if (just('Y', pressed(PAD.Y))) selectChoice(answerPlayer, 0);
      if (just('X', pressed(PAD.X))) selectChoice(answerPlayer, 1);
      if (just('B', pressed(PAD.B))) selectChoice(answerPlayer, 2);
      if (just('RB', pressed(PAD.RB))) selectChoice(answerPlayer, 3);
    }
  }
  function update(dt) {
    if (state.phase === 'play') {
      state.elapsed = (performance.now() - state.startTime) / 1000;
      if (Math.floor(state.elapsed) !== Math.floor(state.elapsed - dt)) updateHUD();
      pollGamepad();
    } else if (state.phase === 'start' && state.mode !== 'duel') {
      state.showcaseT += dt;
      if (state.showcaseT > 2.6) {
        state.showcaseT = 0;
        state.showcase = (state.showcase + 1) % 3;
        if (state.aces[0]) state.aces[0].species = SPECIES_ORDER[state.showcase];
        state.hudSig = '';
        updateHUD();
      }
    }
    updateVFX(dt);
  }
  function loop(ts) {
    if (!state.lastTs) state.lastTs = ts;
    var dt = Math.min(0.05, (ts - state.lastTs) / 1000);
    state.lastTs = ts;
    resize();
    update(dt);
    renderFrame(ts / 1000);
    requestAnimationFrame(loop);
  }

  els.startBtn.addEventListener('click', startGame);
  els.againBtn.addEventListener('click', startGame);
  els.briefBtn.addEventListener('click', showBriefing);
  els.modeRow.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-mode]');
    if (!btn || state.phase !== 'start') return;
    state.mode = btn.getAttribute('data-mode');
    if (state.mode === 'solo') state.playersN = 1;
    else if (state.playersN < 2) state.playersN = 2;
    buildAces();
    syncBriefing();
    renderBoards();
    updateHUD();
  });
  els.playerRow.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-n]');
    if (!btn || state.phase !== 'start' || state.mode === 'solo') return;
    state.playersN = Number(btn.getAttribute('data-n'));
    buildAces();
    syncBriefing();
    renderBoards();
    updateHUD();
  });
  els.mute.addEventListener('click', function () {
    AudioFX.muted = !AudioFX.muted;
    els.mute.textContent = AudioFX.muted ? '🔇' : '🔊';
    if (AudioFX.muted) AudioFX.stopMusic();
    else if (state.phase === 'play') AudioFX.startMusic();
  });
  window.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && (state.phase === 'start' || state.phase === 'win')) {
      if (e.target && e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      startGame();
      return;
    }
    if (state.phase !== 'play') return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      moveFocus(0, -1);
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      moveFocus(0, 1);
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      var owner = state.mode === 'duel' ? 0 : activePlayer();
      selectChoice(owner, state.aces[0].focus);
      return;
    }
    if (e.repeat) return;
    var hit = findKey(e.key.toLowerCase());
    if (!hit) return;
    e.preventDefault();
    selectChoice(hit.player, hit.index);
  });
  window.addEventListener('resize', resize);

  PILOTS[0].keysHint = function () { return 'Keys 1–4'; };
  PILOTS.forEach(function (pilot, i) {
    if (!pilot.keysHint) pilot.keysHint = function () { return KEY_LABELS[i].join(' '); };
  });

  initBackdrop();
  buildAces();
  syncBriefing();
  resize();
  updateHUD();
  renderBoards();
  requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
