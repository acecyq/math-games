<!DOCTYPE html>
<html lang="en">

<title>Chubby Panda Feast: Ratio Bamboo Grove</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e7f6ea'/%3E%3Ccircle cx='24' cy='16' r='8' fill='%23231f1c'/%3E%3Ccircle cx='44' cy='16' r='8' fill='%23231f1c'/%3E%3Ccircle cx='32' cy='36' r='18' fill='%23fff'/%3E%3Cellipse cx='24' cy='34' rx='6' ry='7' fill='%23231f1c'/%3E%3Cellipse cx='40' cy='34' rx='6' ry='7' fill='%23231f1c'/%3E%3Ccircle cx='25' cy='34' r='2' fill='%23fff'/%3E%3Ccircle cx='41' cy='34' r='2' fill='%23fff'/%3E%3Cellipse cx='32' cy='42' rx='3' ry='2' fill='%23231f1c'/%3E%3Ccircle cx='18' cy='42' r='3' fill='%23f3a6b2'/%3E%3Ccircle cx='46' cy='42' r='3' fill='%23f3a6b2'/%3E%3C/svg%3E" />
<style>
  :root {
    --ink: #24180f;
    --cream: #fff6e4;
    --gold: #f0c14a;
    --leaf: #1f8a4c;
    --deep: #0c3a24;
    --p1: #e23d4a;
    --p2: #2f6fed;
    --p3: #1f9d55;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(900px 420px at 10% -10%, rgba(240, 193, 74, 0.28), transparent 55%),
      radial-gradient(700px 380px at 100% 0%, rgba(120, 190, 140, 0.2), transparent 50%),
      linear-gradient(180deg, #1c7a45 0%, #0e4a2c 48%, #08281a 100%);
    color: var(--cream);
    font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  button { font-family: inherit; cursor: pointer; }
  .screen { display: none; height: 100%; min-height: 0; }
  .screen.active { display: block; overflow: auto; }
  #play.active { display: flex; width: 100%; max-width: 100%; min-width: 0; overflow: hidden; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .wrap { width: min(1080px, calc(100% - 28px)); margin: 0 auto; padding: 12px 0 18px; }
  .hero { display: flex; gap: 16px; align-items: center; }
  .mark { width: 188px; height: 108px; position: relative; flex: 0 0 auto; }
  .panda {
    position: absolute; width: 46px; height: 46px; border-radius: 50%;
    background: #fff; top: 16px;
  }
  .panda::before, .panda::after {
    content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 50% 62%, #f7c2cc 0 4px, #1c1916 5px);
    top: -7px;
  }
  .panda::before { left: 2px; }
  .panda::after { right: 2px; }
  .panda span, .panda i, .panda b, .panda em { position: absolute; display: block; }
  .panda span {
    width: 56px; height: 42px; left: -5px; top: 28px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle at 50% 42%, #fff6ea 0 16px, #fff 17px);
    box-shadow: -12px 8px 0 -6px #1c1916, 12px 8px 0 -6px #1c1916;
  }
  .panda i {
    width: 13px; height: 15px; background: #1c1916; border-radius: 50%; top: 15px;
  }
  .panda i:nth-of-type(1) { left: 6px; transform: rotate(-12deg); }
  .panda i:nth-of-type(2) { right: 6px; transform: rotate(12deg); }
  .panda b {
    width: 9px; height: 9px; border-radius: 50%; top: 18px; z-index: 1;
    background: radial-gradient(circle at 35% 32%, #fff 0 1.5px, #1c1916 2px 3.4px, #fff 3.8px);
  }
  .panda b:nth-of-type(1) { left: 8px; }
  .panda b:nth-of-type(2) { right: 8px; }
  .panda em {
    width: 10px; height: 6px; left: 16px; top: 30px;
    border: 2px solid #1c1916; border-top: 0; background: transparent;
    border-radius: 0 0 10px 10px;
  }
  .panda em::before, .panda em::after {
    content: ""; position: absolute; width: 8px; height: 6px; border-radius: 50%;
    background: rgba(255, 154, 170, 0.9); top: -2px;
  }
  .panda em::before { left: -12px; }
  .panda em::after { right: -12px; }
  .pA { left: 4px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.04), 0 10px 0 -4px #e07a78; }
  .pB { left: 70px; top: 24px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.04), 0 10px 0 -4px #6aa6f5; }
  .pC { left: 132px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.04), 0 10px 0 -4px #79c98a; }
  .kicker { margin: 0; letter-spacing: 0.12em; font-size: 0.78rem; font-weight: 800; color: #ffe7a3; }
  h1 { margin: 2px 0 0; font-size: clamp(1.8rem, 4vw, 3rem); line-height: 1; letter-spacing: -0.03em; }
  .sub { margin: 6px 0 0; font-weight: 800; color: #d9ffe4; }
  h2 { margin: 12px 0 6px; font-size: 0.82rem; letter-spacing: 0.14em; color: #ffe7a3; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick, .go, .again {
    border: 3px solid rgba(255, 246, 228, 0.35);
    background: rgba(8, 40, 24, 0.35);
    color: var(--cream);
    border-radius: 14px;
    padding: 10px 14px;
    font-weight: 800;
    font-size: 0.95rem;
  }
  .pick small { display: block; font-weight: 700; opacity: 0.8; font-size: 0.72rem; }
  .pick.on { background: #fff6e4; color: var(--ink); border-color: var(--gold); }
  .pick:disabled { opacity: 0.35; cursor: not-allowed; }
  .pick:focus-visible, .go:focus-visible, .again:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #blurb { min-height: 2.6em; margin: 8px 0 0; font-weight: 700; line-height: 1.35; }
  .hint { margin: 8px 0 0; font-size: 0.92rem; font-weight: 700; color: #e7ffe9; }
  .go, .again {
    margin-top: 14px;
    background: linear-gradient(180deg, #ffe08a, #f0b429);
    color: #3a2508;
    border-color: #a87412;
    font-size: 1.15rem;
    padding: 12px 22px;
    box-shadow: 0 4px 0 #8a5a10;
  }
  .go:active, .again:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a5a10; }
  #stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; width: 100%; min-width: 0; max-width: 100%; min-height: 0; overflow: hidden; }
  #game { display: block; max-width: 100%; max-height: 100%; border-radius: 18px; box-shadow: 0 16px 40px rgba(0,0,0,0.28); touch-action: none; }
  #results .wrap { padding-top: 28px; }
  .scoreline { font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 800; margin: 8px 0; letter-spacing: -0.03em; }
  .lanes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .lane-card {
    flex: 1 1 220px;
    background: rgba(8, 32, 20, 0.45);

  }
  .lane-card.win { border-color: var(--gold); background: rgba(240, 193, 74, 0.16); }
  .lane-card h3 { margin: 0 0 4px; }
  .reason { font-weight: 800; color: #ffe7a3; }
</style>

<body>
<div id="title" class="screen active">
  <div class="wrap">
    <div class="hero">

        <div class="panda pA"><span></span><i></i><i></i><b></b><b></b><em></em></div>

        <div class="panda pC"><span></span><i></i><i></i><b></b><b></b><em></em></div>
      </div>
      <div>
        <p class="kicker">PRIMARY 6 · RATIO · UNITS 3.1–3.7</p>

    </div>
    <h2>PLAYERS</h2>
    <div class="row" id="player-row">
      <button type="button" class="pick on" data-players="1">1 Player<small>Solo feast</small></button>
      <button type="button" class="pick" data-players="2">2 Players<small>Co-op or duel</small></button>

    </div>

      <button type="button" class="pick on" data-tier="easy">EASY<small>Bamboo Cub · 3.1–3.2</small></button>
      <button type="button" class="pick" data-tier="medium">MEDIUM<small>Chubby Forager · 3.3–3.4</small></button>
      <button type="button" class="pick" data-tier="hard">HARD<small>Grove Master · 3.5–3.6</small></button>
      <button type="button" class="pick" data-tier="extreme">EXTREME<small>Grandmaster · 3.7 + mix</small></button>
    </div>
    <h2>MODE</h2>
    <div class="row" id="mode-row">
      <button type="button" class="pick on" id="m-solo" data-mode="solo">SOLO<small>3 hearts · high score</small></button>
      <button type="button" class="pick" id="m-coop" data-mode="coop">TEAM CO-OP<small>One score · shared hearts</small></button>
      <button type="button" class="pick" id="m-duel" data-mode="duel">PANDA DUEL<small>Own lane · own question</small></button>
    </div>
    <p id="blurb"></p>
    <button type="button" class="go" id="start">Start the Feast</button>
    <p class="hint">P1: mouse, 1–4, arrows + Space, gamepad A. P2: Q W E R or gamepad 2. P3: U I O P or gamepad 3. M mutes. Esc pauses.</p>
  </div>
</div>
<div id="play" class="screen">
  <div id="stage">
    <canvas id="game" width="1280" height="720" aria-label="Chubby Panda Feast board"></canvas>
  </div>
</div>
<div id="results" class="screen">
  <div class="wrap">
    <p class="kicker" id="res-kicker">FEAST</p>
    <h1 id="res-title">Grove clear</h1>
    <p class="reason" id="res-reason"></p>
    <div id="res-body"></div>
    <button type="button" class="again" id="again">Feast again</button>
    <button type="button" class="pick" id="home">Title</button>
  </div>
</div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const W = 1280;
  const H = 720;
  const ROUNDS = 6;
  const HEARTS = 3;
  const SPEED_WINDOW = 16;
  const FONT = '"Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif';
  const TIMES = { easy: 300, medium: 270, hard: 240, extreme: 180 };
  const P_NAME = ['Crimson Keeper', 'Azure Keeper', 'Emerald Keeper'];
  const P_SHORT = ['P1 RED', 'P2 BLUE', 'P3 GREEN'];
  const P_COLOR = ['#e23d4a', '#2f6fed', '#1f9d55'];
  const KEYCAP = [['1', '2', '3', '4'], ['Q', 'W', 'E', 'R'], ['U', 'I', 'O', 'P']];
  const CODES = [
    ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Numpad1', 'Numpad2', 'Numpad3', 'Numpad4'],
    ['KeyQ', 'KeyW', 'KeyE', 'KeyR'],
    ['KeyU', 'KeyI', 'KeyO', 'KeyP']
  ];
  const PANDA_COLOR = ['#e07a78', '#6aa6f5', '#79c98a'];
  const TIERS = {
    easy: { name: 'EASY', title: 'Bamboo Cub', blurb: 'Part-whole splits and 3-panda repeated identity. Align the units, then feed.' },
    medium: { name: 'MEDIUM', title: 'Chubby Forager', blurb: 'One panda stays the same, or bamboo moves inside the grove and the total stays the same.' },
    hard: { name: 'HARD', title: 'Grove Master', blurb: 'Equal gifts or equal bites (constant difference), plus shoot baskets: units × value.' },
    extreme: { name: 'EXTREME', title: 'Imperial Panda Grandmaster', blurb: 'Both pandas change by different amounts, mixed with every Unit 3.1–3.7 construct.' }
  };
  const MODES = {
    solo: { name: 'SOLO', blurb: 'One keeper. Mouse, keys 1–4, arrows with Space, or gamepad A. Three bamboo hearts.' },
    coop: { name: 'TEAM CO-OP', blurb: 'One team score and shared hearts only. Keepers swap Step 1 and Step 2 every round.' },
    duel: { name: 'PANDA DUEL', blurb: 'Each lane gets its own pandas and a different question. Own score, own 3 hearts. Highest grove points wins.' }
  };
  const CONST_TIP = 'Check what stayed constant: Only one panda changed (keep the other equal), internal transfer (keep Total equal), or equal change (keep Difference equal)!';
  const SHOOTS = [
    { name: 'Golden', cost: 40, kg: 4, hue: '#e2b340' },
    { name: 'Jade', cost: 50, kg: 5, hue: '#3aaa6a' },
    { name: 'Ink', cost: 30, kg: 3, hue: '#5c6b8a' },
    { name: 'Snow', cost: 24, kg: 3, hue: '#d5e4f2' },
    { name: 'Amber', cost: 36, kg: 4, hue: '#e0872f' },
    { name: 'River', cost: 20, kg: 2, hue: '#4aa3c7' },
    { name: 'Cloud', cost: 45, kg: 5, hue: '#c9d6e5' },
    { name: 'Moon', cost: 16, kg: 2, hue: '#f0e2a0' },
    { name: 'Plum', cost: 28, kg: 4, hue: '#c45b7a' },
    { name: 'Tea', cost: 18, kg: 3, hue: '#6a8f4e' },
    { name: 'Honey', cost: 32, kg: 4, hue: '#e6b422' },
    { name: 'Mist', cost: 15, kg: 3, hue: '#8fb8b0' }
  ];

  const history = [];
  const padPrev = [0, 1, 2].map(() => ({ a: false, left: false, right: false, up: false, down: false, cd: 0 }));
  const ui = { mute: { x: 0, y: 0, w: 0, h: 0 }, pause: { x: 0, y: 0, w: 0, h: 0 } };
  const state = {
    screen: 'title',
    players: 1,
    mode: 'solo',
    tier: 'easy',
    muted: false,
    paused: false,
    over: false,
    endReason: '',
    timeLeft: 300,
    timeMax: 300,
    score: 0
  };
  let lanes = [];
  let reduceMotion = false;
  let canvas;
  let ctx;
  let animT = 0;
  let lastNow = 0;

  function $(id) { return document.getElementById(id); }
  function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[ri(0, arr.length - 1)]; }
  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }
  function gcd(a, b) {
    a = Math.abs(Math.round(a));
    b = Math.abs(Math.round(b));
    while (b) {
      const t = a % b;
      a = b;
      b = t;
    }
    return a || 1;
  }
  function lcm(a, b) {
    if (!a || !b) return 0;
    return Math.round(Math.abs(a / gcd(a, b) * b));
  }
  function isInt(n) { return Number.isFinite(n) && Math.abs(n - Math.round(n)) < 1e-6; }
  function reduceParts(parts) {
    let g = 0;
    parts.forEach((p) => { g = gcd(g, p); });
    return parts.map((p) => Math.round(p / g));
  }
  function ratioText(parts) { return parts.join(' : '); }
  function fmtU(n) { return '1u = ' + n + ' kg'; }
  function fmtBundles(n) { return '1u = ' + n + ' bundles'; }
  function fmtKg(n) { return n + ' kg'; }
  function fmtMoney(n) { return '$' + n; }
  function fmtPcs(n) { return n + ' bundles'; }

  const PAIRS = [];
  for (let a = 1; a <= 8; a++) {
    for (let b = 1; b <= 8; b++) {
      if (gcd(a, b) === 1) PAIRS.push([a, b]);
    }
  }

  function hasToken(blob, label) {
    const esc = String(label).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp('(^|[^0-9])' + esc + '([^0-9]|$)').test(blob);
  }
  function pillBlob(p) {
    return (p.pills || []).map((row) => row.join(' ')).join(' | ');
  }
  function leaked(p) {
    const blob = pillBlob(p);
    if (hasToken(blob, p.answer1) || hasToken(blob, p.answer2)) return true;
    return false;
  }

  function takeFour(out) {
    const ok = out.find((o) => o.ok);
    if (!ok) return null;
    const wrongs = [];
    const seen = new Set([ok.label]);
    out.forEach((o) => {
      if (o.ok || seen.has(o.label)) return;
      seen.add(o.label);
      wrongs.push(o);
    });
    if (wrongs.length < 3) return null;
    let trap = wrongs.find((o) => o.trap) || wrongs[0];
    trap.trap = true;
    const rest = wrongs.filter((o) => o !== trap);
    return [ok, trap].concat(rest).slice(0, 4);
  }

  function makeTextOptions(correct, candidates, tip) {
    const used = new Set();
    const out = [];
    function add(label, trap) {
      if (!label || used.has(label) || label === correct) return;
      used.add(label);
      out.push({ label: label, ok: false, trap: !!trap, tip: tip });
    }
    candidates.forEach((label, i) => add(label, i === 0));
    const fillers = shuffle([
      '1 : 1 : 2', '1 : 2 : 3', '2 : 3 : 5', '3 : 2 : 1', '5 : 1 : 2', '4 : 1 : 1',
      '2 : 2 : 5', '3 : 5 : 1', '8 : 3 : 1', '6 : 3 : 2', '1 : 4 : 7', '9 : 3 : 2',
      '5 : 4 : 3', '7 : 1 : 2', '2 : 5 : 5', '4 : 2 : 6', '3 : 6 : 3', '8 : 4 : 4'
    ]);
    fillers.forEach((label) => {
      if (out.length < 6) add(label, out.length === 0);
    });
    out.unshift({ label: correct, ok: true, trap: false, tip: '' });
    return takeFour(out);
  }

  function makeNumOptions(correct, candidates, format, tip) {
    const used = new Set([Math.round(correct)]);
    const out = [{ label: format(correct), ok: true, trap: false, tip: '' }];
    function add(v, trap) {
      if (!isInt(v)) return;
      const n = Math.round(v);
      if (n <= 0 || n > 9999 || used.has(n)) return;
      used.add(n);
      out.push({ label: format(n), ok: false, trap: !!trap, tip: tip });
    }
    candidates.forEach((v, i) => add(v, i === 0));
    let k = 1;
    while (out.length < 6 && k < 30) {
      add(correct + k, out.length === 1);
      if (out.length < 6) add(correct + k + 3, false);
      k += 1;
    }
    return takeFour(out);
  }

  function shares3(A, B, C, u) {
    return [
      { key: 'A', units: A, kg: A * u },
      { key: 'B', units: B, kg: B * u },
      { key: 'C', units: C, kg: C * u }
    ];
  }
  function shares2(keys, units, u) {
    return keys.map((key, i) => ({ key: key, units: units[i], kg: units[i] * u }));
  }

  function pack(base) {
    const blobCheck = {
      pills: base.pills,
      answer1: base.answer1,
      answer2: base.answer2
    };
    if (leaked(blobCheck)) return null;
    if (!base.rawOptions[0] || !base.rawOptions[1]) return null;
    base.sig = [base.kind, base.answer1, base.answer2, base.pills.map((r) => r.join('/')).join('|')].join('~');
    return base;
  }

  function buildFraction(cfg) {
    const num = cfg.num;
    const den = cfg.den;
    const rb = cfg.rb;
    const rc = cfg.rc;
    const u = cfg.u;
    const step1 = cfg.step1;
    if (gcd(rb, rc) !== 1 || num >= den || num < 1 || u < 2 || u > 25) return null;
    const scale = rb + rc;
    let A = num * scale;
    let B = (den - num) * rb;
    let C = (den - num) * rc;
    const g = gcd(gcd(A, B), C);
    A /= g; B /= g; C /= g;
    const totalU = A + B + C;
    if (A * den !== num * totalU || B * rc !== C * rb) return null;
    const diffU = Math.abs(C - B);
    if (diffU < 1 || totalU > 40 || A > 30 || B > 30 || C > 30) return null;
    if (step1 === 'unit' && diffU < 2) return null;
    const diffKg = diffU * u;
    const totalKg = totalU * u;
    if (diffKg > 400 || totalKg > 1600) return null;
    const more = C > B ? 'C' : 'B';
    const less = C > B ? 'B' : 'C';
    const ratio = ratioText([A, B, C]);
    const tip = 'Panda A already took ' + num + '/' + den + '! Split ONLY the remaining ' + (den - num) + '/' + den + ' in the ratio B : C = ' + rb + ' : ' + rc + ' → A : B : C = ' + ratio + '!';
    const amounts = { A: A * u, B: B * u, C: C * u, total: totalKg };
    const ask2 = cfg.ask2;
    if (!amounts[ask2] || amounts[ask2] === diffKg) return null;
    const unscaled = reduceParts([num, rb, rc]);
    const trapsRatio = [
      ratioText(unscaled),
      ratioText([A, C, B]),
      ratioText(reduceParts([num * scale, rb, rc])),
      ratioText([num, B, C]),
      ratioText(reduceParts([den, rb, rc]))
    ];
    const wrongDiff = Math.abs(unscaled[2] - unscaled[1]);
    const badU = wrongDiff > 0 && diffKg % wrongDiff === 0 ? diffKg / wrongDiff : null;
    const badMap = {
      A: badU ? unscaled[0] * badU : null,
      B: badU ? unscaled[1] * badU : null,
      C: badU ? unscaled[2] * badU : null,
      total: badU ? (unscaled[0] + unscaled[1] + unscaled[2]) * badU : null
    };
    const opt1 = step1 === 'ratio'
      ? makeTextOptions(ratio, trapsRatio, tip)
      : makeNumOptions(u, [badU, diffU, totalU, diffKg, u * diffU, u + diffU], fmtU, tip);
    const opt2 = makeNumOptions(amounts[ask2], [badMap[ask2], diffKg, amounts.A, amounts.B, amounts.C, amounts.total, amounts[ask2] + u], fmtKg, tip);
    if (!opt1 || !opt2) return null;

  const audio = { ctx: null, master: null, music: null, sfx: null, noise: null, next: 0, step: 0 };

  function onPointerMove(e) {
    if (state.screen !== 'play' || state.paused || state.over) return;
    if (state.mode === 'coop' && activeIndex() !== 0) return;
    if (state.mode === 'duel') {
      /* Mouse aims the crimson lane only. */
    }
    const lane = lanes[0];
    if (!lane || lane.busy) return;
    const p = logicalPoint(e);
    lane.hitCards.forEach((rect, i) => {
      if (hit(rect, p.x, p.y)) lane.focus = i;
    });
  }
  function onPointerDown(e) {
    if (state.screen !== 'play') return;
    unlock();
    const p = logicalPoint(e);
    if (hit(ui.mute, p.x, p.y)) {
      toggleMute();
      e.preventDefault();
      return;
    }
    if (hit(ui.pause, p.x, p.y)) {
      state.paused = !state.paused;
      e.preventDefault();
      return;
    }
    if (state.paused || state.over) return;
    if (state.mode === 'coop' && activeIndex() !== 0) return;
    const lane = lanes[0];
    if (!lane) return;
    if (state.mode === 'duel' && !hit(lane.rect, p.x, p.y)) return;
    lane.hitCards.forEach((rect, i) => {
      if (hit(rect, p.x, p.y)) choose(0, i);
    });
    e.preventDefault();
  }
  function onKey(e) {
    if (e.code === 'KeyM') {
      toggleMute();
      e.preventDefault();
      return;
    }
    if (state.screen !== 'play') return;
    if (e.code === 'Escape') {
      state.paused = !state.paused;
      e.preventDefault();
      return;
    }
    if (state.paused || e.repeat) return;
    for (let p = 0; p < 3; p++) {
      const idx = CODES[p].indexOf(e.code);
      if (idx !== -1 && idx < 4) {
        if (canControl(p)) choose(p, idx);
        e.preventDefault();
        return;
      }
    }
    if (!canControl(0)) return;
    const lane = lanes[0];
    const cols = colsFor();
    if (e.code === 'ArrowLeft') moveFocus(lane, -1, 0, cols);
    else if (e.code === 'ArrowRight') moveFocus(lane, 1, 0, cols);
    else if (e.code === 'ArrowUp') moveFocus(lane, 0, -1, cols);
    else if (e.code === 'ArrowDown') moveFocus(lane, 0, 1, cols);
    else if (e.code === 'Space' || e.code === 'Enter') choose(0, lane.focus);
    else return;
    e.preventDefault();
  }

  function fit() {
    if (!canvas) return;
    const play = $('play');
    if (!play || !play.classList.contains('active')) return;
    const availW = Math.max(1, Math.min(play.clientWidth || window.innerWidth, window.innerWidth));
    const availH = Math.max(1, Math.min(play.clientHeight || window.innerHeight, window.innerHeight));
    if (availW < 20 || availH < 20) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const scale = Math.min(availW / W, availH / H);
    const cssW = Math.max(1, Math.floor(W * scale));
    const cssH = Math.max(1, Math.floor(H * scale));
    if (canvas.style.width === cssW + 'px' && canvas.style.height === cssH + 'px' && ctx.getTransform().a === dpr) return;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function syncTitle() {
    document.querySelectorAll('#player-row .pick').forEach((btn) => {
      btn.classList.toggle('on', Number(btn.dataset.players) === state.players);
    });
    document.querySelectorAll('#tier-row .pick').forEach((btn) => {
      btn.classList.toggle('on', btn.dataset.tier === state.tier);
    });
    const solo = $('m-solo');
    const coop = $('m-coop');
    const duel = $('m-duel');
    solo.disabled = state.players !== 1;
    coop.disabled = state.players < 2;
    duel.disabled = state.players < 2;
    if (state.players === 1) state.mode = 'solo';
    else if (state.mode === 'solo') state.mode = 'coop';
    document.querySelectorAll('#mode-row .pick').forEach((btn) => {
      btn.classList.toggle('on', btn.dataset.mode === state.mode);
    });
    const tier = TIERS[state.tier];
    const mode = MODES[state.mode];
    $('blurb').textContent = tier.title + ' · ' + mode.name + '. ' + tier.blurb + ' ' + mode.blurb;
  }

  function boot() {
    canvas = $('game');
    ctx = canvas.getContext('2d');
    reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('#player-row .pick').forEach((btn) => {
      btn.addEventListener('click', () => {
        unlock();
        state.players = Number(btn.dataset.players);
        syncTitle();
      });
    });
    document.querySelectorAll('#tier-row .pick').forEach((btn) => {
      btn.addEventListener('click', () => {
        unlock();
        state.tier = btn.dataset.tier;
        syncTitle();
      });
    });
    document.querySelectorAll('#mode-row .pick').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        unlock();
        state.mode = btn.dataset.mode;
        syncTitle();
      });
    });
    $('start').addEventListener('click', startGame);
    $('again').addEventListener('click', startGame);
    $('home').addEventListener('click', () => show('title'));
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', () => { if (state.screen === 'play') fit(); });
    syncTitle();
    lastNow = performance.now();
    requestAnimationFrame(frame);
  }

  function runMathSelfCheck() {
    const notes = [];
    let fail = 0;
    function expect(puzzle, answer1, answer2) {
      const why = validate(puzzle);
      if (!puzzle || why || puzzle.answer1 !== answer1 || puzzle.answer2 !== answer2) {
        fail += 1;
        notes.push((why || 'mismatch') + ' got ' + (puzzle && puzzle.answer1) + ' / ' + (puzzle && puzzle.answer2) + ' want ' + answer1 + ' / ' + answer2);
      }
    }
    expect(buildFraction({ num: 1, den: 4, rb: 1, rc: 3, u: 5, step1: 'ratio', ask2: 'total' }), '4 : 3 : 9', '80 kg');
    expect(buildFraction({ num: 2, den: 5, rb: 2, rc: 1, u: 4, step1: 'ratio', ask2: 'A' }), '2 : 2 : 1', '8 kg');
    expect(buildFixed({ rb: 3, rc: 1, p: 1, q: 5, u: 8, step1: 'ratio', ask2: 'total' }), '11 : 3 : 1', '120 kg');
    expect(buildRepeat({ a: 2, b1: 7, b2: 2, c: 1, u: 8, step1: 'ratio', ask2: 'A' }), '4 : 14 : 7', '32 kg');
    expect(buildExtSame({ before: [5, 4], after: [2, 3], unchanged: 'B', u: 3, ask2: 'unchanged' }), '1u = 3 kg', '36 kg');
    expect(buildTotal({ before: [1, 3], after: [2, 3], u: 3, ask2: 'total' }), '1u = 3 kg', '60 kg');
    expect(buildDiff({ before: [7, 2], after: [5, 3], u: 3, ask2: 'A' }), '1u = 3 kg', '42 kg');
    expect(buildValue({ itemA: SHOOTS[0], itemB: SHOOTS[1], r1: 5, r2: 3, u: 6, ask2: 'kg' }), '1u = 6 bundles', '210 kg');
    expect(buildExtChange({ a: 3, b: 4, u: 12, dA: 9, dB: -18, ask2: 'total' }), '1u = 12 kg', '84 kg');
    history.length = 0;
    ['easy', 'medium', 'hard', 'extreme'].forEach((tier) => {
      const sigs = [];
      for (let i = 0; i < 40; i++) {
        const puzzle = generate(tier, new Set());
        const why = validate(puzzle);
        if (why) {
          fail += 1;
          if (notes.length < 12) notes.push(tier + ' ' + why);
        }
        sigs.push(puzzle.sig);
        const slots = [];
        const lane = { lastSlot: -1 };
        for (let k = 0; k < 8; k++) slots.push(deal(puzzle.rawOptions[0], lane).findIndex((o) => o.ok));
        if (new Set(slots).size < 2) {
          fail += 1;
          notes.push('slot stick');
        }
      }
      for (let i = 0; i + 8 <= sigs.length; i++) {
        const windowSigs = sigs.slice(i, i + 8);
        if (new Set(windowSigs).size !== 8) {
          fail += 1;
          notes.push(tier + ' repeat');
          break;
        }
      }
    });
    const duel = [generate('extreme', new Set()), generate('extreme', new Set()), generate('extreme', new Set())];
    if (new Set(duel.map((p) => p.sig)).size !== 3) {
      fail += 1;
      notes.push('duel overlap');
    }
    return { fail: fail, notes: notes.slice(0, 15) };
  }

  if (typeof document !== 'undefined') boot();
  else if (typeof globalThis.PANDA_SELFTEST !== 'undefined') {
    const report = runMathSelfCheck();
    console.log(JSON.stringify(report));
  }
})();
</script>
