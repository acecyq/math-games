<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hydro-Pressure Engineer: Dual Gauge Sync</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Share+Tech+Mono&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #020b14;
      font-family: 'Orbitron', sans-serif;
      color: #d8f6ff;
    }
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, #0a3a4a 0%, transparent 55%),
        radial-gradient(ellipse at 20% 80%, #0a2840 0%, transparent 40%),
        linear-gradient(180deg, #031820 0%, #020b14 55%, #041018 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }
    #ui-overlay {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; padding: 10px 14px;
    }
    .hud-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hud-card {
      background: rgba(4, 28, 40, 0.9);
      border: 2px solid #2ec4b6; border-radius: 8px;
      padding: 6px 12px; font-size: 12px; font-weight: 700;
      letter-spacing: 0.4px; text-shadow: 0 1px 2px #000;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 0 12px rgba(46,196,182,0.12);
      white-space: nowrap;
    }
    .hud-card.p1 { border-color: #ff5a5a; color: #ffd0d0; }
    .hud-card.p2 { border-color: #4aa8ff; color: #c8e4ff; }
    .hud-card.score { border-color: #f0c040; color: #ffe9a0; }
    .btn {
      pointer-events: auto;
      background: linear-gradient(180deg, #2ec4b6 0%, #167a72 100%);
      color: #fff; border: 2px solid #7ff5ea; border-radius: 6px;
      padding: 6px 12px; font-family: inherit; font-size: 11px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    }
    .btn:hover { filter: brightness(1.12); }
    .btn.muted { background: linear-gradient(180deg, #4a5a68, #2a3440); border-color: #8a9aa8; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
      <div class="hud-bar">
        <div class="hud-card p1" id="hud-p1">P1 ⛑×3 ★0</div>
        <div class="hud-card" id="hud-mode">MODE: CO-OP</div>
        <div class="hud-card" id="hud-tier">TIER 1 · TITLE</div>
        <div class="hud-card score" id="hud-score">INTEGRITY 0</div>
        <div class="hud-card p2" id="hud-p2">P2 ⛑×3 ★0</div>
        <button id="btn-audio" class="btn">AUDIO: ON</button>
      </div>
    </div>
  </div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 1280, H = 720, time = 0, shake = 0;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
  }
  window.addEventListener('resize', resize);
  resize();

  /* ===================== AUDIO ===================== */
  class SoundEngine {
    constructor() {
      this.ac = null; this.muted = false; this.timer = null; this.step = 0; this.tempo = 118;
    }
    init() {
      if (!this.ac) {
        this.ac = new (window.AudioContext || window.webkitAudioContext)();
        this.startBGM();
      } else if (this.ac.state === 'suspended') this.ac.resume();
    }
    toggleMute() {
      this.muted = !this.muted;
      const b = document.getElementById('btn-audio');
      b.textContent = `AUDIO: ${this.muted ? 'OFF' : 'ON'}`;
      b.classList.toggle('muted', this.muted);
    }
    tone(freq, dur, type = 'square', gain = 0.07, slide = 0) {
      if (this.muted || !this.ac) return;
      try {
        const t0 = this.ac.currentTime;
        const o = this.ac.createOscillator();
        const g = this.ac.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t0);
        if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, freq + slide), t0 + dur);
        g.gain.setValueAtTime(gain, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(this.ac.destination);
        o.start(t0); o.stop(t0 + dur);
      } catch (_) {}
    }
    noise(dur = 0.12, gain = 0.06) {
      if (this.muted || !this.ac) return;
      try {
        const n = Math.floor(this.ac.sampleRate * dur);
        const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        const src = this.ac.createBufferSource();
        src.buffer = buf;
        const g = this.ac.createGain();
        const f = this.ac.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 900;
        g.gain.setValueAtTime(gain, this.ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ac.currentTime + dur);
        src.connect(f); f.connect(g); g.connect(this.ac.destination);
        src.start();
      } catch (_) {}
    }
    dialClick() { this.tone(680, 0.04, 'triangle', 0.06); this.tone(920, 0.03, 'square', 0.03); }
    needleTick() { this.tone(440, 0.05, 'sine', 0.05); this.tone(880, 0.04, 'triangle', 0.03, -120); }
    bubble() { this.tone(220, 0.12, 'sine', 0.05, 180); this.noise(0.08, 0.03); this.tone(520, 0.06, 'sine', 0.03); }
    sonar() { this.tone(880, 0.18, 'sine', 0.04, -400); this.tone(440, 0.25, 'triangle', 0.03); }
    steam() { this.noise(0.45, 0.09); this.tone(160, 0.4, 'sawtooth', 0.04, 80); }
    fanfare() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.32, 'triangle', 0.08), i * 95)); }
    error() { this.tone(120, 0.28, 'sawtooth', 0.12); this.noise(0.22, 0.1); this.tone(90, 0.35, 'square', 0.06); }
    select() { this.tone(420, 0.04, 'triangle', 0.04); }
    stamp() { this.tone(760, 0.06, 'triangle', 0.08); this.tone(1100, 0.05, 'square', 0.04); }
    startBGM() {
      if (this.timer) return;
      const bass = [110, 110, 130.81, 146.83, 110, 98, 130.81, 164.81];
      const arp = [329.63, 392, 440, 523.25, 440, 392, 349.23, 293.66];
      const ms = (60 / this.tempo) * 500;
      this.timer = setInterval(() => {
        if (!this.muted && this.ac && this.ac.state === 'running') {
          this.tone(bass[this.step % 8], 0.16, 'triangle', 0.03);
          if (this.step % 2 === 0) this.tone(arp[(this.step * 3) % 8], 0.08, 'square', 0.012);
          if (this.step % 8 === 0) this.tone(1760, 0.05, 'sine', 0.012, -900);
          if (this.step % 4 === 0) this.noise(0.025, 0.012);
        }
        this.step = (this.step + 1) % 64;
      }, ms);
    }
  }
  const audio = new SoundEngine();
  document.getElementById('btn-audio').onclick = () => { audio.init(); audio.toggleMute(); };

  /* ===================== MATH / FORMAT ===================== */
  function fmtNum(n) {
    const s = String(Math.round(n));
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function formatMass(v, mixed) {
    if (mixed && v >= 1000) {
      const kg = Math.floor(v / 1000);
      const g = v % 1000;
      if (g === 0) return `${kg} kg`;
      return `${kg} kg ${fmtNum(g)} g`;
    }
    return `${fmtNum(v)} g`;
  }

  function formatVol(v, mixed) {
    if (mixed && v >= 1000) {
      const L = Math.floor(v / 1000);
      const ml = v % 1000;
      if (ml === 0) return `${L} ℓ`;
      return `${L} ℓ ${fmtNum(ml)} mℓ`;
    }
    return `${fmtNum(v)} mℓ`;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function uniqPush(arr, set, v) {
    if (v == null || Number.isNaN(v) || set.has(v)) return;
    set.add(v); arr.push(v);
  }

  /* Templates: major label spacing, spaces (gaps), unit base */
  const MASS_TEMPLATES = {
    1: [
      { major: 10, spaces: 5, mixed: false, min: 0, max: 100 },
      { major: 25, spaces: 5, mixed: false, min: 0, max: 200 },
      { major: 50, spaces: 5, mixed: false, min: 0, max: 300 }
    ],
    2: [
      { major: 100, spaces: 5, mixed: false, min: 0, max: 800 },
      { major: 100, spaces: 4, mixed: false, min: 0, max: 800 },
      { major: 200, spaces: 4, mixed: false, min: 0, max: 1000 }
    ],
    3: [
      { major: 1000, spaces: 5, mixed: true, min: 0, max: 3000 },
      { major: 1000, spaces: 4, mixed: true, min: 0, max: 3000 }
    ]
  };

  const VOL_TEMPLATES = {
    1: [
      { major: 10, spaces: 5, mixed: false, min: 0, max: 100 },
      { major: 25, spaces: 5, mixed: false, min: 0, max: 200 },
      { major: 50, spaces: 5, mixed: false, min: 0, max: 300 }
    ],
    2: [
      { major: 100, spaces: 5, mixed: false, min: 0, max: 800 },
      { major: 100, spaces: 4, mixed: false, min: 0, max: 800 },
      { major: 200, spaces: 4, mixed: false, min: 0, max: 1000 }
    ],
    3: [
      { major: 1000, spaces: 5, mixed: true, min: 0, max: 3000 },
      { major: 1000, spaces: 10, mixed: true, min: 0, max: 3000 }
    ]
  };

  function buildInstrument(kind, tier) {
    const bank = kind === 'mass' ? MASS_TEMPLATES[tier] : VOL_TEMPLATES[tier];
    const t = bank[(Math.random() * bank.length) | 0];
    const step = t.major / t.spaces;
    const majors = [];
    for (let v = t.min; v <= t.max; v += t.major) majors.push(v);

    // Choose a lower major that still has an upper neighbour and room for unmarked steps
    const maxLowerIdx = majors.length - 2;
    const lowerIdx = 1 + ((Math.random() * Math.max(1, maxLowerIdx - 1)) | 0);
    const lower = majors[Math.min(lowerIdx, maxLowerIdx)];
    const upper = lower + t.major;
    let stepsPast = 1 + ((Math.random() * (t.spaces - 1)) | 0);
    if (stepsPast >= t.spaces) stepsPast = t.spaces - 1;
    const exact = lower + stepsPast * step;

    const tickTrapStep = t.spaces > 1 ? t.major / (t.spaces - 1) : step;
    const assume1 = lower + stepsPast; // "blindly assume 1"
    const tickTrapReading = Math.round(lower + stepsPast * tickTrapStep);
    const offStep = lower + (stepsPast + (stepsPast < t.spaces - 1 ? 1 : -1)) * step;

    const fmt = (v) => kind === 'mass' ? formatMass(v, t.mixed) : formatVol(v, t.mixed);
    const stepUnit = kind === 'mass' ? (t.mixed ? 'g' : 'g') : (t.mixed ? 'mℓ' : 'mℓ');
    const labelUnit = kind === 'mass' ? (t.mixed ? 'kg' : 'g') : (t.mixed ? 'ℓ' : 'mℓ');

    // Interval options
    const iSet = new Set();
    const iOpts = [];
    uniqPush(iOpts, iSet, step);
    uniqPush(iOpts, iSet, 1);
    uniqPush(iOpts, iSet, Math.round(tickTrapStep) === tickTrapStep ? tickTrapStep : Math.round(tickTrapStep * 10) / 10);
    uniqPush(iOpts, iSet, t.major);
    uniqPush(iOpts, iSet, step * 2);
    uniqPush(iOpts, iSet, Math.max(1, step - 1));
    while (iOpts.length < 4) uniqPush(iOpts, iSet, step + iOpts.length);
    shuffle(iOpts);
    const intervalOptions = iOpts.slice(0, 4);

    // Reading options
    const rSet = new Set();
    const rOpts = [];
    uniqPush(rOpts, rSet, exact);
    uniqPush(rOpts, rSet, assume1);
    uniqPush(rOpts, rSet, tickTrapReading);
    uniqPush(rOpts, rSet, offStep);
    uniqPush(rOpts, rSet, lower + stepsPast * t.major);
    uniqPush(rOpts, rSet, upper - step);
    while (rOpts.length < 4) uniqPush(rOpts, rSet, exact + step * ((Math.random() < 0.5 ? 1 : -1)));
    shuffle(rOpts);
    const readingOptions = rOpts.slice(0, 4);

    const lowerLabel = t.mixed
      ? (kind === 'mass' ? (lower === 0 ? '0 kg' : `${lower / 1000} kg`) : (lower === 0 ? '0 ℓ' : `${lower / 1000} ℓ`))
      : fmt(lower);
    const upperLabel = t.mixed
      ? (kind === 'mass' ? `${upper / 1000} kg` : `${upper / 1000} ℓ`)
      : fmt(upper);

    return {
      kind, tier, mixed: t.mixed, major: t.major, spaces: t.spaces, step,
      min: t.min, max: t.max, majors, lower, upper, stepsPast, exact,
      tickTrapStep, assume1, tickTrapReading,
      intervalOptions, readingOptions,
      stepUnit, labelUnit, fmt,
      tipInterval: `Count the SPACES, not the lines! Between ${lowerLabel} and ${upperLabel} there are ${t.spaces} spaces: ${fmtNum(t.major)} ÷ ${t.spaces} = ${fmtNum(step)} ${stepUnit} per step!`,
      tipReadingClean: `Each step is ${fmtNum(step)} ${stepUnit}, not 1 ${stepUnit}! ${stepsPast} steps past ${lowerLabel} = ${fmt(exact)}!`
    };
  }

  function makeWave(tier) {
    return {
      mass: buildInstrument('mass', tier),
      vol: buildInstrument('vol', tier),
      timer: 55 + tier * 5,
      timerMax: 55 + tier * 5,
      failed: false
    };
  }

  /* ===================== PLAYERS ===================== */
  const players = [0, 1].map(id => ({
    id,
    name: id === 0 ? 'P1' : 'P2',
    color: id === 0 ? '#ff5a5a' : '#4aa8ff',
    glow: id === 0 ? 'rgba(255,90,90,0.55)' : 'rgba(74,168,255,0.55)',
    x: 0, y: 0, shields: 3, stars: 0, score: 0,
    keys: { up: 0, down: 0, left: 0, right: 0, action: 0 },
    gpAction: 0, lastAction: 0, stickX: 0, stickY: 0, sel: 0, cool: 0,
    // competitive progress
    stage: 'massInterval', // massInterval -> massRead -> volInterval -> volRead -> done
    massIntervalLocked: false, massReadLocked: false,
    volIntervalLocked: false, volReadLocked: false
  }));

  window.addEventListener('keydown', e => {
    audio.init();
    const c = e.code;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(c)) e.preventDefault();
    if (c === 'KeyW') players[0].keys.up = 1;
    if (c === 'KeyS') players[0].keys.down = 1;
    if (c === 'KeyA') players[0].keys.left = 1;
    if (c === 'KeyD') players[0].keys.right = 1;
    if (c === 'KeyF' || c === 'Space') players[0].keys.action = 1;
    if (c === 'ArrowUp') players[1].keys.up = 1;
    if (c === 'ArrowDown') players[1].keys.down = 1;
    if (c === 'ArrowLeft') players[1].keys.left = 1;
    if (c === 'ArrowRight') players[1].keys.right = 1;
    if (c === 'Enter' || c === 'NumpadEnter') players[1].keys.action = 1;
  });
  window.addEventListener('keyup', e => {
    const c = e.code;
    if (c === 'KeyW') players[0].keys.up = 0;
    if (c === 'KeyS') players[0].keys.down = 0;
    if (c === 'KeyA') players[0].keys.left = 0;
    if (c === 'KeyD') players[0].keys.right = 0;
    if (c === 'KeyF' || c === 'Space') players[0].keys.action = 0;
    if (c === 'ArrowUp') players[1].keys.up = 0;
    if (c === 'ArrowDown') players[1].keys.down = 0;
    if (c === 'ArrowLeft') players[1].keys.left = 0;
    if (c === 'ArrowRight') players[1].keys.right = 0;
    if (c === 'Enter' || c === 'NumpadEnter') players[1].keys.action = 0;
  });

  function pollGamepads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < 2; i++) {
      const p = players[i], gp = pads[i];
      if (!gp) { p.gpAction = 0; p.stickX = 0; p.stickY = 0; continue; }
      const ax = Math.abs(gp.axes[0] || 0) > 0.35 ? gp.axes[0] : 0;
      const ay = Math.abs(gp.axes[1] || 0) > 0.35 ? gp.axes[1] : 0;
      // 8BitDo / Standard: D-pad buttons 12-15; hat sometimes on axis 9
      let hx = (gp.buttons[15]?.pressed ? 1 : 0) - (gp.buttons[14]?.pressed ? 1 : 0);
      let hy = (gp.buttons[13]?.pressed ? 1 : 0) - (gp.buttons[12]?.pressed ? 1 : 0);
      if (!hx && !hy && gp.axes[9] != null && gp.axes[9] !== 0) {
        const hat = gp.axes[9];
        if (hat < -0.5) hy = -1;
        else if (hat > 0.9) { /* idle */ }
        else if (hat > 0.5) hx = -1;
        else if (hat > 0.1) hy = 1;
        else if (hat > -0.2) hx = 1;
      }
      p.stickX = hx || ax;
      p.stickY = hy || ay;
      p.gpAction = gp.buttons[0]?.pressed ? 1 : 0;
    }
  }

  /* ===================== STATE ===================== */
  const S = { TITLE: 'title', PLAY: 'play', SYNC: 'sync', OVER: 'over' };
  let state = S.TITLE;
  let gameMode = 'coop'; // coop | versus
  let tier = 1, wave = 0, integrity = 0, titleSel = 0;
  let stationSwap = false; // false: P1=mass P2=vol; true: swapped
  let popup = null, sparks = [], steam = [], bubbles = [];
  let waveData = null;
  let diagnostic = null;

  // Shared coop locks
  let coop = {
    massInterval: false, volInterval: false,
    massRead: false, volRead: false,
    phase: 'interval', // interval -> reading -> readySync
    stampedMass: false, stampedVol: false,
    countAnimMass: 0, countAnimVol: 0
  };

  function showPopup(text, sub = '', color = '#7ff5ea', dur = 150) {
    popup = { text, sub, color, t: dur, max: dur };
  }

  function showDiag(msg) {
    diagnostic = { text: msg, t: 220 };
  }

  function updateHUD() {
    document.getElementById('hud-p1').textContent = `P1 ⛑×${players[0].shields} ★${players[0].stars}`;
    document.getElementById('hud-p2').textContent = `P2 ⛑×${players[1].shields} ★${players[1].stars}`;
    document.getElementById('hud-mode').textContent = `MODE: ${gameMode === 'coop' ? 'CO-OP SYNC' : 'GAUGE DUEL'}`;
    let phase = 'TITLE';
    if (state === S.PLAY && waveData) {
      if (gameMode === 'coop') {
        phase = coop.phase === 'interval' ? 'CALIBRATE INTERVALS'
          : coop.phase === 'reading' ? 'READ GAUGES'
          : 'VENT & SYNC';
      } else phase = 'DUEL RACE';
    } else if (state === S.SYNC) phase = 'REACTOR SYNCED';
    else if (state === S.OVER) phase = 'PRESSURE FAIL';
    document.getElementById('hud-tier').textContent = `TIER ${tier} · WAVE ${wave} · ${phase}`;
    document.getElementById('hud-score').textContent = `INTEGRITY ${integrity}`;
  }

  function resetPlayerProg(p) {
    p.stage = 'massInterval';
    p.massIntervalLocked = false;
    p.massReadLocked = false;
    p.volIntervalLocked = false;
    p.volReadLocked = false;
    p.sel = 0;
  }

  function startWave() {
    wave++;
    if (wave > 1 && wave % 4 === 1 && tier < 3) tier++;
    if (gameMode === 'coop' && wave > 1 && (wave - 1) % 3 === 0) {
      stationSwap = !stationSwap;
      showPopup('STATION ROTATION!', 'Swap gauges — practise both dial and cylinder!', '#f0c040', 160);
    }
    waveData = makeWave(tier);
    coop = {
      massInterval: false, volInterval: false,
      massRead: false, volRead: false,
      phase: 'interval',
      stampedMass: false, stampedVol: false,
      countAnimMass: 0, countAnimVol: 0
    };
    players.forEach(resetPlayerProg);
    state = S.PLAY;
    diagnostic = null;
    if (!(gameMode === 'coop' && wave > 1 && (wave - 1) % 3 === 0)) {
      showPopup(
        `REACTOR WAVE ${wave}`,
        `Tier ${tier} · Find step size = (upper − lower) ÷ spaces`,
        '#7ff5ea', 140
      );
    }
    updateHUD();
    audio.sonar();
  }

  function startGame(mode) {
    gameMode = mode;
    tier = 1; wave = 0; integrity = 0; stationSwap = false;
    players.forEach(p => { p.shields = 3; p.stars = 0; p.score = 0; });
    startWave();
  }

  function mistake(player, tip) {
    audio.error();
    shake = 14;
    showDiag(tip);
    showPopup('PRESSURE SPIKE!', tip.slice(0, 72) + (tip.length > 72 ? '…' : ''), '#ff5a5a', 120);
    if (player) player.shields = Math.max(0, player.shields - 1);
    for (let i = 0; i < 14; i++) {
      sparks.push({
        x: W * 0.5 + (Math.random() - 0.5) * 300,
        y: H * 0.45, vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 5, life: 28
      });
    }
    updateHUD();
    if (players[0].shields <= 0 && players[1].shields <= 0) {
      state = S.OVER;
      showPopup('ENGINEER CREW DOWN', 'Press ACTION to return to title', '#ff5a5a', 9999);
    }
  }

  function award(player, pts) {
    integrity += pts;
    if (player) { player.score += pts; }
    updateHUD();
  }

  /* Station assignment for coop */
  function massOwner() { return stationSwap ? 1 : 0; }
  function volOwner() { return stationSwap ? 0 : 1; }

  function coopReadySync() {
    return coop.massRead && coop.volRead;
  }

  function tryVentSync(player) {
    if (gameMode === 'coop') {
      if (!coopReadySync()) {
        showPopup('GAUGES NOT LOCKED', 'Calibrate & read BOTH instruments first', '#f0c040', 100);
        return;
      }
      doSync(player);
    } else {
      // Competitive: both must finish
      if (players.every(p => p.stage === 'done')) doSync(player);
      else showPopup('DUEL INCOMPLETE', 'Both engineers must finish Mass then Volume', '#f0c040', 100);
    }
  }

  function doSync(player) {
    state = S.SYNC;
    audio.steam();
    setTimeout(() => audio.fanfare(), 200);
    award(player, 350);
    if (gameMode === 'versus') {
      // Faster finisher already got stars; bonus integrity shared
    } else {
      players.forEach(p => { p.score += 175; });
    }
    for (let i = 0; i < 30; i++) {
      steam.push({
        x: W * 0.5 + (Math.random() - 0.5) * 80,
        y: H * 0.55, vx: (Math.random() - 0.5) * 3,
        vy: -1.5 - Math.random() * 3, life: 50 + Math.random() * 30, r: 8 + Math.random() * 18
      });
    }
    showPopup('REACTOR SYNCED! +350', 'Hydro-pressure balanced · Core stable', '#7ff5ea', 160);
    updateHUD();
    setTimeout(() => {
      if (state === S.SYNC) startWave();
    }, 2200);
  }

  /* ===================== LAYOUT HELPERS ===================== */
  function dialRect() {
    const top = H * 0.09, h = H * 0.52, w = W * 0.42, x = W * 0.03, y = top;
    return { x, y, w, h, cx: x + w * 0.5, cy: y + h * 0.52, r: Math.min(w, h) * 0.38 };
  }
  function cylRect() {
    const top = H * 0.09, h = H * 0.52, w = W * 0.42, x = W * 0.55, y = top;
    return { x, y, w, h, cx: x + w * 0.45, top: y + h * 0.12, bot: y + h * 0.88, tw: Math.min(70, w * 0.22) };
  }
  function syncBtnRect() {
    const w = Math.min(220, W * 0.18), h = 56;
    return { x: W * 0.5 - w / 2, y: H * 0.78, w, h, cx: W * 0.5, cy: H * 0.78 + h / 2 };
  }

  function cardsFor(side, count) {
    // side: 'left' | 'right' | 'center'
    const cardW = Math.min(130, W * 0.11), cardH = 58, gap = 10;
    const total = count * cardW + (count - 1) * gap;
    let x0;
    if (side === 'left') x0 = W * 0.04;
    else if (side === 'right') x0 = W * 0.96 - total;
    else x0 = W * 0.5 - total / 2;
    const y = H * 0.70;
    const out = [];
    for (let i = 0; i < count; i++) {
      const x = x0 + i * (cardW + gap);
      out.push({ x, y, w: cardW, h: cardH, cx: x + cardW / 2, cy: y + cardH / 2, i });
    }
    return out;
  }

  function optionsForPlayer(p) {
    if (!waveData) return { opts: [], kind: null, phase: null, side: 'left' };
    if (gameMode === 'coop') {
      const isMass = p.id === massOwner();
      const inst = isMass ? waveData.mass : waveData.vol;
      const side = isMass ? 'left' : 'right';
      if (coop.phase === 'interval') {
        if (isMass && coop.massInterval) return { opts: [], kind: 'mass', phase: 'done', side };
        if (!isMass && coop.volInterval) return { opts: [], kind: 'vol', phase: 'done', side };
        return { opts: inst.intervalOptions, kind: isMass ? 'mass' : 'vol', phase: 'interval', side, inst };
      }
      if (coop.phase === 'reading') {
        if (isMass && coop.massRead) return { opts: [], kind: 'mass', phase: 'done', side };
        if (!isMass && coop.volRead) return { opts: [], kind: 'vol', phase: 'done', side };
        return { opts: inst.readingOptions, kind: isMass ? 'mass' : 'vol', phase: 'reading', side, inst };
      }
      return { opts: [], kind: isMass ? 'mass' : 'vol', phase: 'sync', side, inst };
    }
    // versus
    const side = p.id === 0 ? 'left' : 'right';
    if (p.stage === 'massInterval') return { opts: waveData.mass.intervalOptions, kind: 'mass', phase: 'interval', side, inst: waveData.mass };
    if (p.stage === 'massRead') return { opts: waveData.mass.readingOptions, kind: 'mass', phase: 'reading', side, inst: waveData.mass };
    if (p.stage === 'volInterval') return { opts: waveData.vol.intervalOptions, kind: 'vol', phase: 'interval', side, inst: waveData.vol };
    if (p.stage === 'volRead') return { opts: waveData.vol.readingOptions, kind: 'vol', phase: 'reading', side, inst: waveData.vol };
    return { opts: [], kind: null, phase: 'done', side };
  }

  function formatOption(v, pack) {
    if (!pack.inst) return String(v);
    if (pack.phase === 'interval') {
      return `+${fmtNum(v)} ${pack.inst.stepUnit}`;
    }
    return pack.inst.fmt(v);
  }

  /* ===================== SELECTION ===================== */
  function trySelect(p) {
    if (state === S.TITLE) {
      startGame(titleSel === 0 ? 'coop' : 'versus');
      return;
    }
    if (state === S.OVER) {
      state = S.TITLE; updateHUD();
      showPopup('HYDRO-PRESSURE ENGINEER', 'Select mode · Dual Gauge Sync', '#7ff5ea', 140);
      return;
    }
    if (state !== S.PLAY || !waveData) return;

    const pack = optionsForPlayer(p);
    const sync = syncBtnRect();
    // If on sync button
    if (pack.phase === 'sync' || pack.phase === 'done' || (gameMode === 'versus' && p.stage === 'done')) {
      const cards = pack.opts.length ? cardsFor(pack.side, pack.opts.length) : [];
      // check if reticle near sync
      if (Math.hypot(p.x - sync.cx, p.y - sync.cy) < 80 || p.sel === -1) {
        tryVentSync(p);
        return;
      }
    }

    if (!pack.opts.length) {
      // Move to sync / wait
      if (gameMode === 'coop' && coopReadySync()) tryVentSync(p);
      else if (gameMode === 'versus' && players.every(x => x.stage === 'done')) tryVentSync(p);
      return;
    }

    const idx = Math.max(0, Math.min(pack.opts.length - 1, p.sel));
    const val = pack.opts[idx];
    const inst = pack.inst;

    if (pack.phase === 'interval') {
      if (val === inst.step) {
        audio.stamp();
        if (inst.kind === 'mass') audio.dialClick(); else audio.bubble();
        if (gameMode === 'coop') {
          if (inst.kind === 'mass') { coop.massInterval = true; coop.stampedMass = true; }
          else { coop.volInterval = true; coop.stampedVol = true; }
          award(p, 50);
          showPopup('INTERVAL LOCKED', `${formatOption(val, pack)} stamped on scale`, '#7ff5ea', 90);
          if (coop.massInterval && coop.volInterval) {
            coop.phase = 'reading';
            coop.countAnimMass = 0; coop.countAnimVol = 0;
            showPopup('READ THE GAUGES', 'Count steps from the lower numbered label', '#f0c040', 120);
          }
        } else {
          if (p.stage === 'massInterval') { p.massIntervalLocked = true; p.stage = 'massRead'; }
          else { p.volIntervalLocked = true; p.stage = 'volRead'; }
          award(p, 50);
          p.sel = 0;
          showPopup(`${p.name} INTERVAL OK`, formatOption(val, pack), p.color, 80);
        }
        updateHUD();
      } else {
        const tip = val === 1
          ? `Don't assume 1! ${inst.tipInterval}`
          : (Math.abs(val - inst.tickTrapStep) < 0.01
            ? `Off-by-one! Inner ticks ≠ spaces. ${inst.tipInterval}`
            : inst.tipInterval);
        mistake(p, tip);
      }
      return;
    }

    if (pack.phase === 'reading') {
      if (val === inst.exact) {
        audio.needleTick();
        if (inst.kind === 'vol') audio.bubble();
        if (gameMode === 'coop') {
          if (inst.kind === 'mass') coop.massRead = true;
          else coop.volRead = true;
          award(p, 100);
          showPopup('READING LOCKED', inst.fmt(inst.exact), '#7ff5ea', 90);
          if (coopReadySync()) {
            coop.phase = 'readySync';
            showPopup('MANIFOLD READY', 'Hit VENT & SYNC REACTOR!', '#f0c040', 140);
          }
        } else {
          if (p.stage === 'massRead') {
            p.massReadLocked = true;
            p.stage = 'volInterval';
            p.stars++;
            award(p, 100);
            showPopup(`${p.name} MASS DONE ★`, inst.fmt(inst.exact), p.color, 90);
          } else {
            p.volReadLocked = true;
            p.stage = 'done';
            p.stars++;
            award(p, 100);
            showPopup(`${p.name} VOLUME DONE ★`, inst.fmt(inst.exact), p.color, 90);
            if (players.every(x => x.stage === 'done')) {
              showPopup('BOTH ENGINEERS CLEAR', 'Trigger VENT & SYNC!', '#f0c040', 120);
            }
          }
          p.sel = 0;
        }
        updateHUD();
      } else {
        let tip = inst.tipReadingClean;
        if (val === inst.assume1) tip = `Blindly-assume-1 trap! ${inst.tipReadingClean}`;
        else if (val === inst.tickTrapReading) tip = `Tick-counting trap! ${inst.tipInterval}`;
        mistake(p, tip);
      }
    }
  }

  /* ===================== INPUT UPDATE ===================== */
  function updateInput() {
    pollGamepads();
    for (const p of players) {
      if (p.cool > 0) p.cool--;
      const mx = (p.keys.right - p.keys.left) || (p.stickX > 0.35 ? 1 : p.stickX < -0.35 ? -1 : 0);
      const my = (p.keys.down - p.keys.up) || (p.stickY > 0.35 ? 1 : p.stickY < -0.35 ? -1 : 0);

      if (state === S.TITLE) {
        if (p.cool === 0 && (mx !== 0)) {
          titleSel = mx > 0 ? 1 : 0;
          audio.select();
          p.cool = 12;
        }
        p.x = W / 2 - 260 + titleSel * 280 + 120;
        p.y = H * 0.52 + 50;
      } else if (state === S.PLAY) {
        const pack = optionsForPlayer(p);
        const sync = syncBtnRect();
        const n = pack.opts.length;
        const cards = n ? cardsFor(pack.side, n) : [];

        if (p.cool === 0 && (mx !== 0 || my !== 0)) {
          if (n > 0) {
            if (mx !== 0) {
              p.sel = (p.sel + (mx > 0 ? 1 : -1) + n) % n;
              audio.select();
              p.cool = 10;
            }
            if (my > 0 && (gameMode === 'coop' ? coopReadySync() : players.every(x => x.stage === 'done') || pack.phase === 'done')) {
              p.sel = -1; // sync
              p.cool = 10;
            } else if (my < 0 && p.sel === -1) {
              p.sel = 0; p.cool = 10;
            }
          } else if (my !== 0 || mx !== 0) {
            p.sel = -1;
          }
        }

        if (p.sel === -1 || (!n && (gameMode === 'coop' ? coopReadySync() : true))) {
          p.x += (sync.cx - p.x) * 0.25;
          p.y += (sync.cy - p.y) * 0.25;
        } else if (cards[p.sel]) {
          p.x += (cards[p.sel].cx - p.x) * 0.28;
          p.y += (cards[p.sel].cy - p.y) * 0.28;
        }
      }

      const act = p.keys.action || p.gpAction;
      if (act && !p.lastAction) trySelect(p);
      p.lastAction = act;
    }

    // Coop timer
    if (state === S.PLAY && gameMode === 'coop' && waveData && !waveData.failed) {
      waveData.timer -= 1 / 60;
      if (waveData.timer <= 0) {
        waveData.timer = 0;
        waveData.failed = true;
        showPopup('PRESSURE OVERLOAD!', 'Wave failed — shields stressed', '#ff5a5a', 120);
        players.forEach(p => { if (p.shields > 0) p.shields--; });
        updateHUD();
        if (players[0].shields <= 0 && players[1].shields <= 0) {
          state = S.OVER;
        } else {
          setTimeout(() => { if (state === S.PLAY) startWave(); }, 1200);
        }
      }
    }

    // Count animations
    if (coop.phase === 'reading' || coop.phase === 'readySync') {
      if (coop.stampedMass && coop.countAnimMass < waveData.mass.stepsPast) {
        if (time % 12 === 0) { coop.countAnimMass++; audio.dialClick(); }
      }
      if (coop.stampedVol && coop.countAnimVol < waveData.vol.stepsPast) {
        if (time % 12 === 6) { coop.countAnimVol++; audio.bubble(); }
      }
    }
  }

  /* ===================== DRAWING ===================== */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    // Deep sea base already on container; canvas accents
    ctx.fillStyle = '#021018';
    ctx.fillRect(0, 0, W, H);

    // Gradient wash
    const g = ctx.createRadialGradient(W * 0.5, H * 0.2, 40, W * 0.5, H * 0.5, W * 0.7);
    g.addColorStop(0, '#0a3d4a');
    g.addColorStop(0.45, '#041820');
    g.addColorStop(1, '#020810');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Sonar rings
    ctx.strokeStyle = 'rgba(46,196,182,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const rr = 80 + i * 90 + (time % 120);
      ctx.beginPath();
      ctx.arc(W * 0.5, H * 0.95, rr, Math.PI, 0);
      ctx.stroke();
    }

    // Portholes
    drawPorthole(W * 0.08, H * 0.88, 36);
    drawPorthole(W * 0.92, H * 0.88, 36);

    // Pipes
    ctx.strokeStyle = '#1a4a58';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(0, H * 0.62); ctx.lineTo(W * 0.12, H * 0.62); ctx.lineTo(W * 0.12, H * 0.95);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W, H * 0.62); ctx.lineTo(W * 0.88, H * 0.62); ctx.lineTo(W * 0.88, H * 0.95);
    ctx.stroke();
    ctx.fillStyle = '#2ec4b6';
    ctx.beginPath(); ctx.arc(W * 0.12, H * 0.62, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W * 0.88, H * 0.62, 6, 0, Math.PI * 2); ctx.fill();

    // Warning beacons
    const blink = 0.5 + 0.5 * Math.sin(time * 0.12);
    ctx.fillStyle = `rgba(255,90,50,${0.35 + blink * 0.45})`;
    ctx.beginPath(); ctx.arc(W * 0.5, H * 0.06, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(240,192,64,${0.25 + (1 - blink) * 0.4})`;
    ctx.beginPath(); ctx.arc(W * 0.47, H * 0.055, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W * 0.53, H * 0.055, 3, 0, Math.PI * 2); ctx.fill();

    // Floor console plate
    ctx.fillStyle = 'rgba(6, 30, 40, 0.85)';
    roundRect(W * 0.02, H * 0.66, W * 0.96, H * 0.30, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(46,196,182,0.35)';
    ctx.lineWidth = 2;
    roundRect(W * 0.02, H * 0.66, W * 0.96, H * 0.30, 14);
    ctx.stroke();
  }

  function drawPorthole(cx, cy, r) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
    ctx.fillStyle = '#1a3038'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    const pg = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 2, cx, cy, r);
    pg.addColorStop(0, '#1a6a7a'); pg.addColorStop(1, '#042028');
    ctx.fillStyle = pg; ctx.fill();
    ctx.strokeStyle = '#2ec4b6'; ctx.lineWidth = 2; ctx.stroke();
    // Cross bars
    ctx.strokeStyle = 'rgba(20,50,60,0.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
    ctx.restore();
  }

  function valueToDialAngle(inst, value) {
    // Sweep from 210° (lower-left) to -30° (lower-right) = 240° span
    const start = (Math.PI * 7) / 6; // 210°
    const span = (Math.PI * 4) / 3;  // 240°
    const t = (value - inst.min) / (inst.max - inst.min);
    return start + t * span;
  }

  function drawMassDial(inst, highlight) {
    const d = dialRect();
    // Panel
    ctx.fillStyle = 'rgba(8, 36, 48, 0.92)';
    roundRect(d.x, d.y, d.w, d.h, 12); ctx.fill();
    ctx.strokeStyle = '#2ec4b6'; ctx.lineWidth = 2;
    roundRect(d.x, d.y, d.w, d.h, 12); ctx.stroke();

    ctx.fillStyle = '#7ff5ea';
    ctx.font = '700 13px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('MASS HOPPER DIAL', d.cx, d.y + 22);
    ctx.fillStyle = '#a0c8d0';
    ctx.font = '600 11px "Share Tech Mono", monospace';
    ctx.fillText(inst.mixed ? 'kg / g' : 'grams (g)', d.cx, d.y + 38);

    const cx = d.cx, cy = d.cy, R = d.r;
    // Dial face
    const face = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R);
    face.addColorStop(0, '#e8f4f0'); face.addColorStop(1, '#b8d0c8');
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = face; ctx.fill();
    ctx.strokeStyle = '#1a4048'; ctx.lineWidth = 6; ctx.stroke();
    ctx.strokeStyle = '#2ec4b6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R - 4, 0, Math.PI * 2); ctx.stroke();

    // Ticks
    const start = (Math.PI * 7) / 6;
    const span = (Math.PI * 4) / 3;
    for (let v = inst.min; v <= inst.max + 0.001; v += inst.step) {
      const isMajor = Math.abs((v - inst.min) % inst.major) < 0.001 || Math.abs(v - inst.max) < 0.001;
      const a = valueToDialAngle(inst, v);
      const r0 = isMajor ? R - 18 : R - 12;
      const r1 = R - 6;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.strokeStyle = isMajor ? '#0a2030' : '#4a6870';
      ctx.lineWidth = isMajor ? 2.5 : 1.2;
      ctx.stroke();

      if (isMajor) {
        const lx = cx + Math.cos(a) * (R - 32);
        const ly = cy + Math.sin(a) * (R - 32);
        ctx.fillStyle = '#0a2030';
        ctx.font = '700 11px "Share Tech Mono", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let lab;
        if (inst.mixed) lab = v === 0 ? '0' : `${v / 1000}`;
        else lab = String(v);
        ctx.fillText(lab, lx, ly);
      }
    }
    ctx.textBaseline = 'alphabetic';

    // Space wedge scanner during interval calibration
    if (highlight && highlight.showSpaces) {
      const a0 = valueToDialAngle(inst, inst.lower);
      const a1 = valueToDialAngle(inst, inst.upper);
      for (let s = 0; s < inst.spaces; s++) {
        const t0 = a0 + (a1 - a0) * (s / inst.spaces);
        const t1 = a0 + (a1 - a0) * ((s + 1) / inst.spaces);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, R - 8, t0, t1);
        ctx.closePath();
        ctx.fillStyle = `rgba(46,196,182,${0.12 + 0.1 * Math.sin(time * 0.15 + s)})`;
        ctx.fill();
        const mid = (t0 + t1) / 2;
        const tx = cx + Math.cos(mid) * (R * 0.55);
        const ty = cy + Math.sin(mid) * (R * 0.55);
        ctx.fillStyle = '#067a70';
        ctx.font = '800 12px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(s + 1), tx, ty);
      }
      ctx.fillStyle = '#067a70';
      ctx.font = '700 11px "Share Tech Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`(${fmtNum(inst.upper)} − ${fmtNum(inst.lower)}) ÷ ${inst.spaces} = ?`, cx, cy + R * 0.35);
    }

    // Stamped step labels
    if (highlight && highlight.stamped) {
      for (let v = inst.lower; v < inst.upper; v += inst.step) {
        if (v === inst.lower) continue;
        const a = valueToDialAngle(inst, v);
        const tx = cx + Math.cos(a) * (R * 0.72);
        const ty = cy + Math.sin(a) * (R * 0.72);
        ctx.fillStyle = 'rgba(6,120,100,0.9)';
        ctx.font = '700 9px "Share Tech Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`+${fmtNum(inst.step)}`, tx, ty);
      }
    }

    // Step counter arcs during reading
    if (highlight && highlight.countSteps > 0) {
      for (let s = 1; s <= highlight.countSteps; s++) {
        const v0 = inst.lower + (s - 1) * inst.step;
        const v1 = inst.lower + s * inst.step;
        const t0 = valueToDialAngle(inst, v0);
        const t1 = valueToDialAngle(inst, v1);
        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.48, t0, t1);
        ctx.strokeStyle = `rgba(240,80,60,${0.5 + 0.3 * (s === highlight.countSteps ? 1 : 0.5)})`;
        ctx.lineWidth = 5;
        ctx.stroke();
      }
    }

    // Needle
    const wobble = Math.sin(time * 0.35) * 0.012;
    const na = valueToDialAngle(inst, inst.exact) + (highlight && highlight.lockNeedle ? 0 : wobble * (highlight && highlight.calm ? 0.3 : 1));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(na);
    ctx.fillStyle = '#d02020';
    ctx.beginPath();
    ctx.moveTo(0, -4); ctx.lineTo(R - 22, 0); ctx.lineTo(0, 4); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#801010';
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff6060';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Unit badge
    ctx.fillStyle = '#0a2030';
    ctx.font = '700 12px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(inst.mixed ? 'kg' : 'g', cx, cy + R * 0.22);

    // Status chip
    if (highlight && highlight.status) {
      ctx.fillStyle = highlight.statusOk ? 'rgba(46,196,182,0.25)' : 'rgba(240,192,64,0.2)';
      roundRect(d.x + 12, d.y + d.h - 36, d.w - 24, 24, 6); ctx.fill();
      ctx.fillStyle = highlight.statusOk ? '#7ff5ea' : '#ffe9a0';
      ctx.font = '700 11px Orbitron, sans-serif';
      ctx.fillText(highlight.status, d.cx, d.y + d.h - 20);
    }
  }

  function valueToCylY(inst, value, top, bot) {
    const t = (value - inst.min) / (inst.max - inst.min);
    return bot - t * (bot - top);
  }

  function drawVolumeCylinder(inst, highlight) {
    const c = cylRect();
    ctx.fillStyle = 'rgba(8, 36, 48, 0.92)';
    roundRect(c.x, c.y, c.w, c.h, 12); ctx.fill();
    ctx.strokeStyle = '#2ec4b6'; ctx.lineWidth = 2;
    roundRect(c.x, c.y, c.w, c.h, 12); ctx.stroke();

    ctx.fillStyle = '#7ff5ea';
    ctx.font = '700 13px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('COOLANT VOLUME CYLINDER', c.x + c.w * 0.5, c.y + 22);
    ctx.fillStyle = '#a0c8d0';
    ctx.font = '600 11px "Share Tech Mono", monospace';
    ctx.fillText(inst.mixed ? 'ℓ / mℓ' : 'millilitres (mℓ)', c.x + c.w * 0.5, c.y + 38);

    const cx = c.cx, top = c.top, bot = c.bot, tw = c.tw;
    const left = cx - tw, right = cx + tw;

    // Glass tube
    ctx.fillStyle = 'rgba(180, 230, 240, 0.15)';
    roundRect(left, top - 8, tw * 2, bot - top + 24, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(180, 230, 240, 0.55)';
    ctx.lineWidth = 2;
    roundRect(left, top - 8, tw * 2, bot - top + 24, 8); ctx.stroke();

    // Liquid
    const meniscusY = valueToCylY(inst, inst.exact, top, bot);
    const waveAmp = 2.5 + Math.sin(time * 0.2) * 1.2;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(left + 3, bot + 8);
    ctx.lineTo(left + 3, meniscusY);
    for (let x = left + 3; x <= right - 3; x += 4) {
      const wy = meniscusY + Math.sin(time * 0.18 + x * 0.08) * waveAmp;
      ctx.lineTo(x, wy);
    }
    ctx.lineTo(right - 3, bot + 8);
    ctx.closePath();
    const lg = ctx.createLinearGradient(cx, meniscusY, cx, bot);
    lg.addColorStop(0, 'rgba(40, 220, 200, 0.75)');
    lg.addColorStop(1, 'rgba(10, 100, 120, 0.85)');
    ctx.fillStyle = lg;
    ctx.fill();
    ctx.restore();

    // Graduations
    for (let v = inst.min; v <= inst.max + 0.001; v += inst.step) {
      const isMajor = Math.abs((v - inst.min) % inst.major) < 0.001 || Math.abs(v - inst.max) < 0.001;
      const y = valueToCylY(inst, v, top, bot);
      ctx.beginPath();
      ctx.moveTo(right - 2, y);
      ctx.lineTo(right + (isMajor ? 18 : 10), y);
      ctx.strokeStyle = isMajor ? '#d8f6ff' : '#5a8890';
      ctx.lineWidth = isMajor ? 2 : 1;
      ctx.stroke();
      if (isMajor) {
        ctx.fillStyle = '#d8f6ff';
        ctx.font = '700 11px "Share Tech Mono", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        let lab;
        if (inst.mixed) lab = v === 0 ? '0' : `${v / 1000}`;
        else lab = String(v);
        ctx.fillText(lab, right + 22, y);
      }
    }
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#7ff5ea';
    ctx.font = '700 10px Orbitron, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(inst.mixed ? 'ℓ' : 'mℓ', right + 22, top - 4);

    // Gap brackets during interval
    if (highlight && highlight.showSpaces) {
      const y0 = valueToCylY(inst, inst.lower, top, bot);
      const y1 = valueToCylY(inst, inst.upper, top, bot);
      for (let s = 0; s < inst.spaces; s++) {
        const ya = y0 + (y1 - y0) * (s / inst.spaces);
        const yb = y0 + (y1 - y0) * ((s + 1) / inst.spaces);
        const mid = (ya + yb) / 2;
        ctx.strokeStyle = `rgba(46,196,182,${0.55 + 0.25 * Math.sin(time * 0.15 + s)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(left - 28, ya); ctx.lineTo(left - 14, ya);
        ctx.lineTo(left - 14, yb); ctx.lineTo(left - 28, yb);
        ctx.stroke();
        ctx.fillStyle = '#7ff5ea';
        ctx.font = '800 11px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(s + 1), left - 40, mid + 4);
      }
      ctx.fillStyle = '#7ff5ea';
      ctx.font = '700 10px "Share Tech Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`(${fmtNum(inst.upper)} − ${fmtNum(inst.lower)}) ÷ ${inst.spaces} = ?`, cx, bot + 28);
    }

    // Stamped steps
    if (highlight && highlight.stamped) {
      for (let s = 1; s < inst.spaces; s++) {
        const v = inst.lower + s * inst.step;
        const y = valueToCylY(inst, v, top, bot);
        ctx.fillStyle = 'rgba(46,196,182,0.95)';
        ctx.font = '700 9px "Share Tech Mono", monospace';
        ctx.textAlign = 'right';
        ctx.fillText(`+${fmtNum(inst.step)}`, left - 6, y + 3);
      }
    }

    // Step count bars
    if (highlight && highlight.countSteps > 0) {
      for (let s = 1; s <= highlight.countSteps; s++) {
        const v = inst.lower + s * inst.step;
        const y = valueToCylY(inst, v, top, bot);
        ctx.fillStyle = `rgba(240,192,64,${0.4 + 0.4 * (s === highlight.countSteps)})`;
        ctx.fillRect(left + 6, y - 2, tw * 2 - 12, 4);
      }
    }

    // Meniscus marker
    ctx.strokeStyle = '#ff6060';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(left - 6, meniscusY);
    ctx.lineTo(right + 6, meniscusY);
    ctx.stroke();
    ctx.fillStyle = '#ff8080';
    ctx.beginPath();
    ctx.moveTo(left - 14, meniscusY); ctx.lineTo(left - 4, meniscusY - 5); ctx.lineTo(left - 4, meniscusY + 5);
    ctx.fill();

    // Bubbles
    if (time % 8 === 0) {
      bubbles.push({
        x: cx + (Math.random() - 0.5) * tw * 1.2,
        y: bot - 10, vy: -0.8 - Math.random(), life: 40 + Math.random() * 30, r: 1.5 + Math.random() * 2.5
      });
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y += b.vy; b.life--;
      if (b.y < meniscusY || b.life <= 0) { bubbles.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(180,240,255,${b.life / 50})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    }

    if (highlight && highlight.status) {
      ctx.fillStyle = highlight.statusOk ? 'rgba(46,196,182,0.25)' : 'rgba(240,192,64,0.2)';
      roundRect(c.x + 12, c.y + c.h - 36, c.w - 24, 24, 6); ctx.fill();
      ctx.fillStyle = highlight.statusOk ? '#7ff5ea' : '#ffe9a0';
      ctx.font = '700 11px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(highlight.status, c.x + c.w * 0.5, c.y + c.h - 20);
    }
  }

  function drawCards(p) {
    const pack = optionsForPlayer(p);
    if (!pack.opts.length) return;
    const cards = cardsFor(pack.side, pack.opts.length);
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      const on = p.sel === i;
      ctx.fillStyle = on ? 'rgba(240,192,64,0.22)' : 'rgba(6,28,40,0.92)';
      ctx.strokeStyle = on ? p.color : '#2ec4b6';
      ctx.lineWidth = on ? 3 : 1.5;
      roundRect(c.x, c.y, c.w, c.h, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#d8f6ff';
      ctx.font = '700 13px "Share Tech Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(formatOption(pack.opts[i], pack), c.cx, c.y + 28);
      ctx.fillStyle = on ? p.color : '#6a9098';
      ctx.font = '700 9px Orbitron, sans-serif';
      ctx.fillText(pack.phase === 'interval' ? 'STEP' : 'READ', c.cx, c.y + 46);
    }
    // Role label
    ctx.fillStyle = p.color;
    ctx.font = '700 11px Orbitron, sans-serif';
    ctx.textAlign = pack.side === 'left' ? 'left' : 'right';
    const lx = pack.side === 'left' ? cards[0].x : cards[cards.length - 1].x + cards[0].w;
    let role = '';
    if (gameMode === 'coop') {
      role = pack.kind === 'mass' ? `${p.name} · MASS` : `${p.name} · VOLUME`;
    } else {
      role = `${p.name} · ${String(p.stage).replace(/([A-Z])/g, ' $1').toUpperCase()}`;
    }
    ctx.fillText(role, lx, cards[0].y - 10);
  }

  function drawSyncButton() {
    const s = syncBtnRect();
    const ready = gameMode === 'coop' ? coopReadySync()
      : players.every(p => p.stage === 'done');
    const pulse = ready ? 0.5 + 0.5 * Math.sin(time * 0.2) : 0;
    ctx.fillStyle = ready ? `rgba(240,100,40,${0.35 + pulse * 0.35})` : 'rgba(40,50,60,0.8)';
    ctx.strokeStyle = ready ? '#ff8040' : '#556068';
    ctx.lineWidth = ready ? 3 : 1.5;
    roundRect(s.x, s.y, s.w, s.h, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = ready ? '#fff0e0' : '#809098';
    ctx.font = '800 12px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('VENT & SYNC', s.cx, s.y + 24);
    ctx.font = '700 10px Orbitron, sans-serif';
    ctx.fillText('REACTOR', s.cx, s.y + 42);

    if (gameMode === 'coop' && waveData) {
      const tw = 160, th = 8;
      const tx = W * 0.5 - tw / 2, ty = s.y - 18;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      roundRect(tx, ty, tw, th, 4); ctx.fill();
      const pct = Math.max(0, waveData.timer / waveData.timerMax);
      ctx.fillStyle = pct < 0.25 ? '#ff5a5a' : '#2ec4b6';
      roundRect(tx, ty, tw * pct, th, 4); ctx.fill();
    }
  }

  function drawReticles() {
    if (state === S.TITLE) {
      // only show selection highlight via cards
      return;
    }
    for (const p of players) {
      ctx.strokeStyle = p.color;
      ctx.shadowColor = p.glow; ctx.shadowBlur = 12;
      ctx.lineWidth = 2.5;
      const r = 16;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p.x - r - 5, p.y); ctx.lineTo(p.x - 5, p.y);
      ctx.moveTo(p.x + 5, p.y); ctx.lineTo(p.x + r + 5, p.y);
      ctx.moveTo(p.x, p.y - r - 5); ctx.lineTo(p.x, p.y - 5);
      ctx.moveTo(p.x, p.y + 5); ctx.lineTo(p.x, p.y + r + 5);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = p.color;
      ctx.font = '700 11px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, p.x, p.y - 22);
    }
  }

  function drawTitle() {
    ctx.fillStyle = 'rgba(2,12,20,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7ff5ea';
    ctx.font = '800 36px Orbitron, sans-serif';
    ctx.shadowColor = 'rgba(46,196,182,0.55)'; ctx.shadowBlur = 18;
    ctx.fillText('HYDRO-PRESSURE ENGINEER', W / 2, H * 0.22);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffe9a0';
    ctx.font = '700 18px Orbitron, sans-serif';
    ctx.fillText('Dual Gauge Sync', W / 2, H * 0.22 + 32);
    ctx.fillStyle = '#a0c8d0';
    ctx.font = '600 13px "Share Tech Mono", monospace';
    ctx.fillText('Primary 3–4 · Mass dials (g / kg) · Volume cylinders (mℓ / ℓ)', W / 2, H * 0.22 + 56);
    ctx.fillText('Step = (Upper − Lower) ÷ Spaces   ·   Count GAPS, not tick lines', W / 2, H * 0.22 + 76);

    const modes = [
      { t: 'ASYMMETRIC CO-OP SYNC', s: 'P1 Mass Dial · P2 Volume Tube · Swap every 3 waves · Shared timer' },
      { t: 'COMPETITIVE GAUGE DUEL', s: 'Race Mass then Volume · Stars for accurate lock-ins · P1 vs P2' }
    ];
    for (let i = 0; i < 2; i++) {
      const x = W / 2 - 270 + i * 290, y = H * 0.48, on = titleSel === i;
      ctx.fillStyle = on ? 'rgba(240,192,64,0.22)' : 'rgba(6,30,42,0.9)';
      ctx.strokeStyle = on ? '#f0c040' : '#2ec4b6';
      ctx.lineWidth = on ? 3 : 2;
      roundRect(x, y, 260, 110, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = on ? '#ffe9a0' : '#7ff5ea';
      ctx.font = '800 13px Orbitron, sans-serif';
      ctx.fillText(modes[i].t, x + 130, y + 36);
      ctx.fillStyle = '#a0c8d0';
      ctx.font = '600 11px "Share Tech Mono", monospace';
      const words = modes[i].s.split(' ');
      let line = '', yy = y + 58;
      for (const w of words) {
        const test = line + w + ' ';
        if (ctx.measureText(test).width > 230) { ctx.fillText(line, x + 130, yy); line = w + ' '; yy += 14; }
        else line = test;
      }
      ctx.fillText(line, x + 130, yy);
    }

    ctx.fillStyle = '#d8f6ff';
    ctx.font = '600 13px Orbitron, sans-serif';
    ctx.fillText('P1: WASD + F/Space   ·   P2: Arrows + Enter   ·   Gamepads: D-Pad + A', W / 2, H * 0.78);
    ctx.fillText('Press ACTION to dive', W / 2, H * 0.78 + 24);
  }

  function drawPopup() {
    if (!popup || popup.t <= 0) return;
    popup.t--;
    const a = Math.min(1, popup.t / 18, (popup.max - popup.t) / 12 + 0.65);
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(4,20,32,0.9)';
    roundRect(W / 2 - 300, H * 0.11, 600, 64, 10); ctx.fill();
    ctx.strokeStyle = popup.color; ctx.lineWidth = 2;
    roundRect(W / 2 - 300, H * 0.11, 600, 64, 10); ctx.stroke();
    ctx.fillStyle = popup.color;
    ctx.font = '800 16px Orbitron, sans-serif';
    ctx.fillText(popup.text, W / 2, H * 0.11 + 26);
    if (popup.sub) {
      ctx.fillStyle = '#c8e8f0';
      ctx.font = '600 12px "Share Tech Mono", monospace';
      ctx.fillText(popup.sub, W / 2, H * 0.11 + 48);
    }
    ctx.restore();
  }

  function drawDiagnostic() {
    if (!diagnostic || diagnostic.t <= 0) return;
    diagnostic.t--;
    ctx.save();
    ctx.globalAlpha = Math.min(1, diagnostic.t / 30);
    ctx.fillStyle = 'rgba(40,10,10,0.88)';
    roundRect(W * 0.1, H * 0.58, W * 0.8, 42, 8); ctx.fill();
    ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 1.5;
    roundRect(W * 0.1, H * 0.58, W * 0.8, 42, 8); ctx.stroke();
    ctx.fillStyle = '#ffc8c8';
    ctx.font = '600 12px "Share Tech Mono", monospace';
    ctx.textAlign = 'center';
    // wrap
    const maxW = W * 0.76;
    const words = diagnostic.text.split(' ');
    let line = '', y = H * 0.58 + 18;
    const lines = [];
    for (const w of words) {
      const test = line + w + ' ';
      if (ctx.measureText(test).width > maxW) { lines.push(line); line = w + ' '; }
      else line = test;
    }
    lines.push(line);
    lines.slice(0, 2).forEach((ln, i) => ctx.fillText(ln.trim(), W / 2, y + i * 16));
    ctx.restore();
  }

  function drawSparks() {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.22; s.life--;
      ctx.fillStyle = `rgba(255,${120 + s.life},60,${s.life / 28})`;
      ctx.fillRect(s.x, s.y, 3, 3);
      if (s.life <= 0) sparks.splice(i, 1);
    }
    for (let i = steam.length - 1; i >= 0; i--) {
      const s = steam[i];
      s.x += s.vx; s.y += s.vy; s.r += 0.3; s.life--;
      ctx.fillStyle = `rgba(200,230,240,${s.life / 80})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      if (s.life <= 0) steam.splice(i, 1);
    }
  }

  function massHighlight() {
    if (!waveData) return {};
    if (gameMode === 'coop') {
      return {
        showSpaces: coop.phase === 'interval' && !coop.massInterval,
        stamped: coop.stampedMass,
        countSteps: coop.phase !== 'interval' ? Math.min(coop.countAnimMass, waveData.mass.stepsPast) : 0,
        lockNeedle: coop.massRead,
        calm: coop.massInterval,
        status: coop.massRead ? 'LOCKED ✓ ' + waveData.mass.fmt(waveData.mass.exact)
          : coop.massInterval ? 'STEP ' + fmtNum(waveData.mass.step) + ' g · Read needle'
          : 'Calibrate interval (spaces)',
        statusOk: coop.massRead || coop.massInterval
      };
    }
    // versus: show shared instrument state based on any progress
    const anyMassInt = players.some(p => p.massIntervalLocked || ['massRead','volInterval','volRead','done'].includes(p.stage));
    const anyMassRead = players.some(p => p.massReadLocked || ['volInterval','volRead','done'].includes(p.stage));
    return {
      showSpaces: !anyMassInt,
      stamped: anyMassInt,
      countSteps: anyMassInt ? waveData.mass.stepsPast : 0,
      lockNeedle: anyMassRead,
      calm: anyMassInt,
      status: anyMassRead ? 'MASS CLEAR' : anyMassInt ? 'Read the needle' : 'Race: calibrate mass step',
      statusOk: anyMassInt
    };
  }

  function volHighlight() {
    if (!waveData) return {};
    if (gameMode === 'coop') {
      return {
        showSpaces: coop.phase === 'interval' && !coop.volInterval,
        stamped: coop.stampedVol,
        countSteps: coop.phase !== 'interval' ? Math.min(coop.countAnimVol, waveData.vol.stepsPast) : 0,
        status: coop.volRead ? 'LOCKED ✓ ' + waveData.vol.fmt(waveData.vol.exact)
          : coop.volInterval ? 'STEP ' + fmtNum(waveData.vol.step) + ' mℓ · Read meniscus'
          : 'Calibrate interval (spaces)',
        statusOk: coop.volRead || coop.volInterval
      };
    }
    const anyVolInt = players.some(p => p.volIntervalLocked || p.stage === 'volRead' || p.stage === 'done');
    const anyVolRead = players.some(p => p.volReadLocked || p.stage === 'done');
    const onVol = players.some(p => ['volInterval','volRead','done'].includes(p.stage));
    return {
      showSpaces: onVol && !anyVolInt,
      stamped: anyVolInt,
      countSteps: anyVolInt ? waveData.vol.stepsPast : 0,
      status: anyVolRead ? 'VOLUME CLEAR' : anyVolInt ? 'Read the meniscus' : (onVol ? 'Calibrate volume step' : 'Finish mass first'),
      statusOk: anyVolInt
    };
  }

  /* pointer */
  canvas.addEventListener('pointerdown', e => {
    audio.init();
    const rect = canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (canvas.width / rect.width);
    const py = (e.clientY - rect.top) * (canvas.height / rect.height);

    if (state === S.TITLE) {
      for (let i = 0; i < 2; i++) {
        const x = W / 2 - 270 + i * 290, y = H * 0.48;
        if (px >= x && px <= x + 260 && py >= y && py <= y + 110) {
          if (titleSel === i) {
            players[0].keys.action = 1; trySelect(players[0]);
            players[0].keys.action = 0; players[0].lastAction = 0;
          } else { titleSel = i; audio.select(); }
          return;
        }
      }
      players[0].keys.action = 1; trySelect(players[0]);
      players[0].keys.action = 0; players[0].lastAction = 0;
      return;
    }

    if (state === S.OVER) {
      players[0].keys.action = 1; trySelect(players[0]);
      players[0].keys.action = 0; players[0].lastAction = 0;
      return;
    }

    if (state !== S.PLAY) return;
    const sync = syncBtnRect();
    if (px >= sync.x && px <= sync.x + sync.w && py >= sync.y && py <= sync.y + sync.h) {
      players[0].sel = -1;
      tryVentSync(players[0]);
      return;
    }

    // Hit cards for nearest player or P1
    for (const p of players) {
      const pack = optionsForPlayer(p);
      if (!pack.opts.length) continue;
      const cards = cardsFor(pack.side, pack.opts.length);
      for (let i = 0; i < cards.length; i++) {
        const c = cards[i];
        if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) {
          p.sel = i; p.x = c.cx; p.y = c.cy;
          trySelect(p);
          return;
        }
      }
    }
  });

  /* ===================== LOOP ===================== */
  function frame() {
    time++;
    updateInput();

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.86;
      if (shake < 0.4) shake = 0;
    }

    drawBackground();

    if (state === S.TITLE) {
      // Preview gauges
      const previewMass = {
        kind: 'mass', mixed: false, major: 50, spaces: 5, step: 10,
        min: 0, max: 200, lower: 100, upper: 150, stepsPast: 3, exact: 130,
        majors: [0, 50, 100, 150, 200], fmt: (v) => formatMass(v, false)
      };
      const previewVol = {
        kind: 'vol', mixed: false, major: 50, spaces: 5, step: 10,
        min: 0, max: 250, lower: 150, upper: 200, stepsPast: 2, exact: 170,
        majors: [0, 50, 100, 150, 200, 250], fmt: (v) => formatVol(v, false)
      };
      drawMassDial(previewMass, { showSpaces: true, stamped: false, countSteps: 0, status: 'Demo · 5 spaces', statusOk: false });
      drawVolumeCylinder(previewVol, { showSpaces: true, stamped: false, countSteps: 0, status: 'Demo · count gaps', statusOk: false });
      drawTitle();
      drawReticles();
    } else if (waveData) {
      drawMassDial(waveData.mass, massHighlight());
      drawVolumeCylinder(waveData.vol, volHighlight());
      drawSyncButton();
      if (state === S.PLAY || state === S.SYNC) {
        drawCards(players[0]);
        drawCards(players[1]);
        drawReticles();
      }
      if (state === S.OVER) {
        ctx.fillStyle = 'rgba(4,10,16,0.7)';
        ctx.fillRect(0, 0, W, H);
      }
    }

    drawPopup();
    drawDiagnostic();
    drawSparks();
    ctx.restore();
    requestAnimationFrame(frame);
  }

  players[0].x = W * 0.3; players[0].y = H * 0.75;
  players[1].x = W * 0.7; players[1].y = H * 0.75;
  updateHUD();
  showPopup('HYDRO-PRESSURE ENGINEER', 'Select mode · Dual Gauge Sync', '#7ff5ea', 180);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
