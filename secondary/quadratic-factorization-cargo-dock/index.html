<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cargo Dock Tetris: The Area Fabricator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1220'/%3E%3Crect x='6' y='6' width='9' height='9' fill='%234aa3ff'/%3E%3Crect x='17' y='6' width='9' height='9' fill='%232ee59d'/%3E%3Crect x='6' y='17' width='9' height='9' fill='%232ee59d'/%3E%3Crect x='17' y='17' width='9' height='9' fill='%23e8a04a'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #05070e;
    overflow: hidden;
    font-family: system-ui, "Segoe UI", "Avenir Next", sans-serif;
  }
  body { display: flex; flex-direction: column; }
  canvas {
    display: block;
    flex: 1;
    width: 100%;
    min-height: 0;
    touch-action: none;
    cursor: crosshair;
    outline: none;
  }
  #bar {
    height: 42px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 14px;
    background: linear-gradient(#121a28, #0b1018);
    border-top: 3px solid #f5c400;
    color: #c5d4ea;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  #bar b { color: #ffd15c; font-weight: 750; }
  #mute {
    appearance: none;
    border: 2px solid #f5c400;
    background: #1a1404;
    color: #ffe38a;
    font: 750 13px/1 system-ui, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  #mute[aria-pressed="true"] {
    border-color: #6d7c96;
    color: #9aabC4;
    background: #121820;
  }
  #mute:focus-visible { outline: 2px solid #39e1ff; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Cargo Dock Tetris game. Factorise each quadratic by building a rectangle."></canvas>
<div id="bar">
  <span>SEC 2 G3 · AREA MODEL · <b>M</b> MUTE · <b>ESC</b> PAUSE</span>
  <button id="mute" type="button" aria-pressed="false" aria-label="Mute sound">SOUND ON</button>
</div>
<script>
(() => {
  'use strict';

  const VW = 1600;
  const VH = 900;
  const FONT = 'system-ui, "Segoe UI", "Avenir Next", sans-serif';
  const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const COL = {
    text: '#e7f0ff',
    dim: '#93a4c4',
    gold: '#ffd15c',
    hazard: '#f5c400',
    cyan: '#39e1ff',
    amber: '#ffb020',
    green: '#2ee59d',
    red: '#ff4d6a',
    blue: '#4aa3ff',
    bronze: '#e8a04a',
    neg: '#ff7a59',
  };

  const TIERS = [null,
    { name: 'POSITIVE DOCK', blurb: 'a = 1 and every term is positive. Both bracket numbers are positive.' },
    { name: 'RED RODS', blurb: 'The middle term is negative and the constant is positive, so both bracket numbers are negative.' },
    { name: 'OPPOSITE SIGNS', blurb: 'The constant is negative, so one bracket number is positive and the other is negative.' },
    { name: 'HEAVY CRATES', blurb: 'a is greater than 1. Split bx with the area product a × c, then read each laser.' },
  ];

  const SCRIPTED = {
    1: [[1, 2, 1, 3], [1, 3, 1, 4]],
    2: [[1, -2, 1, -4], [1, -3, 1, -5]],
    3: [[1, 5, 1, -2], [1, -4, 1, 2]],
    4: [[2, 1, 1, 3], [3, 2, 1, 2], [2, -3, 1, 2]],
  };

  const G = {
    ctx: null,
    canvas: null,
    mode: 'title',
    keys: new Set(),
    players: [],
    time: 0,
    scale: 1,
    offX: 0,
    offY: 0,
    shake: 0,
    particles: [],
    floats: [],
    stars: [],
    city: [],
    layout: null,
    problem: null,
    pallets: [],
    manifests: [],
    stage: 1,
    tier: 1,
    tierWins: 0,
    overtime: false,
    round: 1,
    revenue: 0,
    revenueShown: 0,
    shipped: 0,
    timer: 62,
    mistakes: 0,
    scaffold: false,
    hint: '',
    filled: false,
    inputEnabled: false,
    anim: null,
    scan: null,
    drone: null,
    toast: null,
    globalLock: 0,
    dieT: 0,
    bad: null,
    recent: [],
    queues: null,
    splitter: null,
    failed: false,
  };

  let bootError = null;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function choice(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { const t = a % b; a = b; b = t; }
    return a || 1;
  }
  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2;
  }
  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - ((-2 * t + 2) ** 2) / 2;
  }
  function money(n) {
    return '$' + Math.round(n).toLocaleString('en-US');
  }
  function fmtTime(s) {
    s = Math.max(0, Math.ceil(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function fmtMag(coef, variable) {
    const m = Math.abs(coef);
    if (!variable) return String(m);
    if (m === 1) return variable;
    return String(m) + variable;
  }
  function fmtBare(coef, variable) {
    return (coef < 0 ? '−' : '') + fmtMag(coef, variable);
  }
  function signedJoin(coef, variable) {
    return (coef < 0 ? ' − ' : ' + ') + fmtMag(coef, variable);
  }
  function fmtExpr(a, b, c) {
    return fmtBare(a, 'x²') + signedJoin(b, 'x') + signedJoin(c, '');
  }
  function fmtSignedTerm(coef, variable) {
    return (coef < 0 ? '−' : '+') + fmtMag(coef, variable);
  }
  function fmtRod(coef) {
    if (coef === 0) return '+0x';
    return (coef < 0 ? '−' : '+') + (Math.abs(coef) === 1 ? 'x' : Math.abs(coef) + 'x');
  }
  function fmtBinom(xCoef, c) {
    const xPart = xCoef === 1 ? 'x' : xCoef + 'x';
    return '(' + xPart + ' ' + (c < 0 ? '−' : '+') + ' ' + Math.abs(c) + ')';
  }
  function fmtHCFFactor(xCoef, c) {
    if (xCoef) return xCoef === 1 ? 'x' : xCoef + 'x';
    return (c < 0 ? '−' : '+') + Math.abs(c);
  }
  function pairKey(a, b) {
    return a < b ? a + ',' + b : b + ',' + a;
  }
  function sortRods(a, b) {
    const aa = Math.abs(a);
    const bb = Math.abs(b);
    if (aa !== bb) return aa > bb ? [a, b] : [b, a];
    return a >= b ? [a, b] : [b, a];
  }

  function makeProblem(hX, hC, wX, wC, tier) {
    const a = hX * wX;
    const tr = hX * wC;
    const bl = hC * wX;
    const c = hC * wC;
    const b = tr + bl;
    return {
      a, b, c, hX, hC, wX, wC, tr, bl, tier,
      expr: fmtExpr(a, b, c),
      height: fmtBinom(hX, hC),
      width: fmtBinom(wX, wC),
    };
  }

  function cornerSentence(p) {
    const right = (p.c < 0 ? '−' : '+') + Math.abs(p.c);
    return '(' + fmtBare(p.a, 'x²') + ') × (' + right + ') = ' + fmtSignedTerm(p.a * p.c, 'x²');
  }
  function splitInstruction(p) {
    const color = p.b > 0 ? 'green ' : 'red ';
    return 'Partition the ' + fmtBare(p.b, 'x') + ' ' + color +
      'cargo rods into two bays so their product equals ' + fmtSignedTerm(p.a * p.c, 'x²') + '.';
  }
  function ruleLine(p) {
    return 'The rods must add to ' + fmtSignedTerm(p.b, 'x') +
      ' and multiply to ' + fmtSignedTerm(p.a * p.c, 'x²') +
      '.   Target area product = ' + cornerSentence(p) + '.';
  }
  function splitExpression(p) {
    return fmtBare(p.a, 'x²') + signedJoin(p.tr, 'x') + signedJoin(p.bl, 'x') + signedJoin(p.c, '');
  }
  function grouped(p) {
    const left = p.hX === 1 ? 'x' : p.hX + 'x';
    const hc = p.hC < 0 ? '(−' + Math.abs(p.hC) + ')' : String(p.hC);
    return left + p.width + ' + ' + hc + p.width + ' = ' + p.height + p.width;
  }

  function stories(p) {
    const topC = fmtHCFFactor(p.hX, 0);
    const botC = fmtHCFFactor(0, p.hC);
    const leftC = fmtHCFFactor(p.wX, 0);
    const rightC = fmtHCFFactor(0, p.wC);
    const wX = fmtHCFFactor(p.wX, 0);
    const hX = fmtHCFFactor(p.hX, 0);
    const wC = (p.wC < 0 ? '−' : '+') + Math.abs(p.wC);
    const hC = (p.hC < 0 ? '−' : '+') + Math.abs(p.hC);
    return [
      {
        title: 'Top row  HCF(' + fmtBare(p.a, 'x²') + ', ' + fmtBare(p.tr, 'x') + ') = ' + topC,
        because: fmtBare(p.a, 'x²') + ' = (' + topC + ')(' + wX + ')   and   ' + fmtBare(p.tr, 'x') + ' = (' + topC + ')(' + wC + ')',
      },
      {
        title: 'Bottom row  HCF(' + fmtBare(p.bl, 'x') + ', ' + fmtBare(p.c, '') + ') = ' + botC,
        because: fmtBare(p.bl, 'x') + ' = (' + botC + ')(' + wX + ')   and   ' + fmtBare(p.c, '') + ' = (' + botC + ')(' + wC + ')',
      },
      {
        title: 'Side laser  HEIGHT = ' + p.height,
        because: 'Add the row factors ' + topC + ' and ' + botC + '. That sum is the height.',
      },
      {
        title: 'Left column  HCF(' + fmtBare(p.a, 'x²') + ', ' + fmtBare(p.bl, 'x') + ') = ' + leftC,
        because: fmtBare(p.a, 'x²') + ' = (' + leftC + ')(' + hX + ')   and   ' + fmtBare(p.bl, 'x') + ' = (' + leftC + ')(' + hC + ')',
      },
      {
        title: 'Right column  HCF(' + fmtBare(p.tr, 'x') + ', ' + fmtBare(p.c, '') + ') = ' + rightC,
        because: fmtBare(p.tr, 'x') + ' = (' + rightC + ')(' + hX + ')   and   ' + fmtBare(p.c, '') + ' = (' + rightC + ')(' + hC + ')',
      },
      {
        title: 'Top laser  WIDTH = ' + p.width,
        because: 'Add the column factors ' + leftC + ' and ' + rightC + '. That sum is the width.',
      },
    ];
  }

  function verifyModel(p) {
    if (p.hX * p.wX !== p.a) return 'a';
    if (p.hX * p.wC !== p.tr) return 'tr';
    if (p.hC * p.wX !== p.bl) return 'bl';
    if (p.hC * p.wC !== p.c) return 'c';
    if (p.tr + p.bl !== p.b) return 'b';
    if (gcd(p.hX, Math.abs(p.hC)) !== 1) return 'gcd-h';
    if (gcd(p.wX, Math.abs(p.wC)) !== 1) return 'gcd-w';
    if (!p.hX || !p.wX || !p.hC || !p.wC) return 'zero';
    return '';
  }

  function tierOk(p, tier) {
    if (verifyModel(p)) return false;
    if (p.b === 0) return false;
    if (tier === 1) return p.a === 1 && p.b > 0 && p.c > 0 && p.hC > 0 && p.wC > 0;
    if (tier === 2) return p.a === 1 && p.b < 0 && p.c > 0 && p.hC < 0 && p.wC < 0;
    if (tier === 3) return p.a === 1 && p.c < 0 && (p.hC * p.wC < 0);
    if (tier === 4) return p.a > 1;
    return false;
  }

  const FALLBACK = {
    1: [1, 2, 1, 3],
    2: [1, -2, 1, -4],
    3: [1, 5, 1, -2],
    4: [2, 1, 1, 3],
  };

  function randomProblem(tier, overtime) {
    for (let attempt = 0; attempt < 80; attempt++) {
      let hX = 1;
      let wX = 1;
      let hC = 1;
      let wC = 1;
      if (tier === 1) {
        hC = randInt(1, overtime ? 9 : 8);
        wC = randInt(1, overtime ? 9 : 8);
      } else if (tier === 2) {
        hC = -randInt(1, overtime ? 9 : 8);
        wC = -randInt(1, overtime ? 9 : 8);
      } else if (tier === 3) {
        hC = randInt(1, overtime ? 9 : 8);
        wC = -randInt(1, overtime ? 9 : 8);
        if (Math.random() < 0.5) { const t = hC; hC = wC; wC = t; }
      } else {
        const leads = overtime
          ? [[2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [2, 2], [3, 2], [4, 2], [3, 3]]
          : [[2, 1], [3, 1], [4, 1], [5, 1], [2, 2], [3, 2], [6, 1]];
        const pair = choice(leads);
        hX = pair[0];
        wX = pair[1];
        if (Math.random() < 0.5) { const t = hX; hX = wX; wX = t; }
        const mag = () => randInt(1, overtime ? 6 : 5);
        const roll = Math.random();
        if (roll < 0.5) { hC = mag(); wC = mag(); }
        else if (roll < 0.75) { hC = -mag(); wC = -mag(); }
        else {
          hC = mag();
          wC = -mag();
          if (Math.random() < 0.5) { const t = hC; hC = wC; wC = t; }
        }
      }
      if (gcd(hX, Math.abs(hC)) !== 1 || gcd(wX, Math.abs(wC)) !== 1) continue;
      const p = makeProblem(hX, hC, wX, wC, tier);
      const rodCap = overtime ? 24 : 18;
      const cCap = overtime ? 28 : 18;
      const bCap = overtime ? 32 : 24;
      if (Math.abs(p.c) > cCap || Math.abs(p.b) > bCap) continue;
      if (Math.abs(p.tr) > rodCap || Math.abs(p.bl) > rodCap) continue;
      if (!tierOk(p, tier)) continue;
      return p;
    }
    const f = FALLBACK[tier];
    return makeProblem(f[0], f[1], f[2], f[3], tier);
  }

  function buildPallets(p) {
    const ac = p.a * p.c;
    const used = new Set([pairKey(p.tr, p.bl)]);
    const chosen = [];
    function take(a, b, trap) {
      if (chosen.length >= 3) return false;
      if (a === 0 && b === 0) return false;
      const k = pairKey(a, b);
      if (used.has(k)) return false;
      if (a + b === p.b && a * b === ac) return false;
      used.add(k);
      chosen.push({ rods: sortRods(a, b), trap, correct: false });
      return true;
    }
    const sumTraps = [];
    for (let i = -18; i <= 18; i++) {
      const j = p.b - i;
      if (j < -18 || j > 18 || i < j) continue;
      if (i === 0 || j === 0) continue;
      if (i * j === ac) continue;
      sumTraps.push([i, j]);
    }
    sumTraps.sort((a, b) => Math.abs(a[0] * a[1] - ac) - Math.abs(b[0] * b[1] - ac));
    if (sumTraps[0]) take(sumTraps[0][0], sumTraps[0][1], 'Those rods add to the middle term, but their product misses the corners.');
    if (sumTraps[1]) take(sumTraps[1][0], sumTraps[1][1], 'Those rods add to the middle term, but their product misses the corners.');
    if (p.b !== 0) take(p.b, 0, 'A zero rod makes the area product 0.');
    take(-p.tr, -p.bl, 'Both signs are flipped.');
    take(p.tr, -p.bl, 'One rod has the wrong sign.');
    const facts = [];
    const lim = Math.max(12, Math.min(24, Math.abs(ac) + 2));
    for (let i = -lim; i <= lim; i++) {
      if (!i || ac % i !== 0) continue;
      const j = ac / i;
      if (j < i || Math.abs(j) > lim) continue;
      facts.push([i, j]);
    }
    facts.sort((a, b) => Math.abs(a[0] + a[1] - p.b) - Math.abs(b[0] + b[1] - p.b));
    for (const f of facts) {
      if (chosen.length >= 3) break;
      take(f[0], f[1], 'Those rods multiply to the corner product, but they do not add to the middle term.');
    }
    let guard = 0;
    while (chosen.length < 3 && guard++ < 60) {
      take(randInt(-8, 8), randInt(-8, 8), 'This split does not match both conditions.');
    }
    for (let a = -6; a <= 6 && chosen.length < 3; a++) {
      for (let b = a; b <= 6 && chosen.length < 3; b++) take(a, b, 'This split does not match both conditions.');
    }
    const all = chosen.slice(0, 3);
    all.push({ rods: sortRods(p.tr, p.bl), trap: '', correct: true });
    shuffle(all);
    all.forEach((o, i) => { o.letter = 'ABCD'[i]; });
    return all;
  }

  function buildManifests(p) {
    const correct = { hX: p.hX, hC: p.hC, wX: p.wX, wC: p.wC, correct: true, tag: 'Matches both lasers.' };
    const pool = [
      { hX: p.hX, hC: p.wC, wX: p.wX, wC: p.hC, tag: 'The constants were crossed between the lasers.' },
      { hX: p.hX, hC: -p.hC, wX: p.wX, wC: p.wC, tag: 'The height sign does not match the side laser.' },
      { hX: p.wX, hC: -p.wC, wX: p.hX, wC: -p.hC, tag: 'The lasers were swapped and the signs were flipped.' },
      { hX: p.hX, hC: -p.hC, wX: p.wX, wC: -p.wC, tag: 'Both signs were flipped.' },
      { hX: p.hX, hC: p.hC, wX: p.wX, wC: -p.wC, tag: 'The width sign does not match the top laser.' },
      { hX: p.wX, hC: p.wC, wX: p.hX, wC: p.hC, tag: 'Height and width are swapped.' },
    ];
    const key = (m) => m.hX + ',' + m.hC + ',' + m.wX + ',' + m.wC;
    const used = new Set([key(correct)]);
    const distractors = [];
    for (const m of pool) {
      if (m.hC === 0 || m.wC === 0 || m.hX < 1 || m.wX < 1) continue;
      const k = key(m);
      if (used.has(k)) continue;
      used.add(k);
      distractors.push({ ...m, correct: false });
      if (distractors.length === 3) break;
    }
    let bump = 1;
    while (distractors.length < 3 && bump < 8) {
      const m = { hX: p.hX, hC: p.hC + bump, wX: p.wX, wC: p.wC + bump, correct: false, tag: 'These dimensions do not match the lasers.' };
      bump++;
      if (m.hC === 0 || m.wC === 0) continue;
      const k = key(m);
      if (used.has(k)) continue;
      used.add(k);
      distractors.push(m);
    }
    const all = shuffle([correct, ...distractors.slice(0, 3)]);
    all.forEach((m, i) => {
      m.letter = 'ABCD'[i];
      m.height = fmtBinom(m.hX, m.hC);
      m.width = fmtBinom(m.wX, m.wC);
    });
    return all;
  }

  function selfTest() {
    const samples = [
      [1, 2, 1, 3, 'x² + 5x + 6'],
      [1, 3, 1, 4, 'x² + 7x + 12'],
      [1, -2, 1, -4, 'x² − 6x + 8'],
      [1, -3, 1, -5, 'x² − 8x + 15'],
      [1, 5, 1, -2, 'x² + 3x − 10'],
      [1, -4, 1, 2, 'x² − 2x − 8'],
      [2, 1, 1, 3, '2x² + 7x + 3'],
      [3, 2, 1, 2, '3x² + 8x + 4'],
      [2, -3, 1, 2, '2x² + x − 6'],
    ];
    function checkPack(p) {
      const why = verifyModel(p);
      if (why) throw new Error('model ' + why + ' for ' + p.expr);
      const pals = buildPallets(p);
      if (pals.length !== 4) throw new Error('pallet count ' + p.expr);
      const good = pals.filter((o) => o.correct);
      if (good.length !== 1) throw new Error('pallet correct ' + p.expr);
      const rods = good[0].rods;
      if (rods[0] + rods[1] !== p.b || rods[0] * rods[1] !== p.a * p.c) throw new Error('pallet math ' + p.expr);
      if (new Set(pals.map((o) => pairKey(o.rods[0], o.rods[1]))).size !== 4) throw new Error('dup pallet ' + p.expr);
      for (const o of pals) {
        if (!o.correct && o.rods[0] + o.rods[1] === p.b && o.rods[0] * o.rods[1] === p.a * p.c) {
          throw new Error('false trap ' + p.expr);
        }
      }
      const mans = buildManifests(p);
      if (mans.length !== 4 || mans.filter((m) => m.correct).length !== 1) throw new Error('manifest ' + p.expr);
      if (new Set(mans.map((m) => m.height + '|' + m.width)).size !== 4) throw new Error('dup manifest ' + p.expr);
      const cm = mans.find((m) => m.correct);
      if (cm.height !== p.height || cm.width !== p.width) throw new Error('manifest label ' + p.expr);
    }
    for (const row of samples) {
      const p = makeProblem(row[0], row[1], row[2], row[3], 1);
      if (p.expr !== row[4]) throw new Error('expr ' + p.expr + ' != ' + row[4]);
      checkPack(p);
    }
    const heavy = makeProblem(2, 1, 1, 3, 4);
    const pk = new Set(buildPallets(heavy).map((o) => pairKey(o.rods[0], o.rods[1])));
    for (const k of ['1,6', '2,5', '3,4', '0,7']) {
      if (!pk.has(k)) throw new Error('missing pallet ' + k + ' got ' + [...pk].join(' / '));
    }
    const mk = new Set(buildManifests(heavy).map((m) => m.height + '|' + m.width));
    for (const k of ['(2x + 1)|(x + 3)', '(2x + 3)|(x + 1)', '(2x − 1)|(x + 3)', '(x − 3)|(2x − 1)']) {
      if (!mk.has(k)) throw new Error('missing manifest ' + k + ' got ' + [...mk].join(' / '));
    }
    if (splitExpression(heavy) !== '2x² + 6x + x + 3') throw new Error(splitExpression(heavy));
    if (grouped(heavy) !== '2x(x + 3) + 1(x + 3) = (2x + 1)(x + 3)') throw new Error(grouped(heavy));
    const neg = makeProblem(1, -2, 1, -4, 2);
    if (splitExpression(neg) !== 'x² − 4x − 2x + 8') throw new Error(splitExpression(neg));
    if (grouped(neg) !== 'x(x − 4) + (−2)(x − 4) = (x − 2)(x − 4)') throw new Error(grouped(neg));
    const titles = stories(neg).map((s) => s.title);
    const expectTitles = [
      'Top row  HCF(x², −4x) = x',
      'Bottom row  HCF(−2x, 8) = −2',
      'Side laser  HEIGHT = (x − 2)',
      'Left column  HCF(x², −2x) = x',
      'Right column  HCF(−4x, 8) = −4',
      'Top laser  WIDTH = (x − 4)',
    ];
    expectTitles.forEach((s, i) => {
      if (titles[i] !== s) throw new Error('story ' + i + ' got ' + titles[i]);
    });
    const stH = stories(heavy);
    if (stH[0].title !== 'Top row  HCF(2x², 6x) = 2x') throw new Error(stH[0].title);
    if (stH[0].because !== '2x² = (2x)(x)   and   6x = (2x)(+3)') throw new Error(stH[0].because);
    if (stories(neg)[0].because !== 'x² = (x)(x)   and   −4x = (x)(−4)') throw new Error(stories(neg)[0].because);
    if (stories(neg)[4].because !== '−4x = (−4)(x)   and   8 = (−4)(−2)') throw new Error(stories(neg)[4].because);
    for (let tier = 1; tier <= 4; tier++) {
      const uniq = new Set();
      for (let i = 0; i < 36; i++) {
        const p = randomProblem(tier, false);
        if (!tierOk(p, tier)) throw new Error('tier ' + tier + ' bad ' + p.expr + ' ' + verifyModel(p));
        uniq.add(p.a + ',' + p.b + ',' + p.c);
        checkPack(p);
      }
      if (uniq.size < 8) throw new Error('variety tier ' + tier + ' only ' + uniq.size);
    }
  }

  const AudioBus = {
    ctx: null,
    master: null,
    music: null,
    sfx: null,
    noiseBuf: null,
    muted: false,
    started: false,
    step: 0,
    next: 0,
    hoverAt: [0, 0, 0],
    ensure() {
      if (this.ctx) return true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { this.ctx = new AC(); } catch (e) { return false; }
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 1;
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -12;
      comp.knee.value = 18;
      comp.ratio.value = 3.2;
      comp.attack.value = 0.004;
      comp.release.value = 0.18;
      this.master.connect(comp);
      comp.connect(this.ctx.destination);
      this.music = this.ctx.createGain();
      this.music.gain.value = 0.42;
      this.music.connect(this.master);
      this.sfx = this.ctx.createGain();
      this.sfx.gain.value = 0.9;
      this.sfx.connect(this.master);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      return true;
    },
    start() {
      if (!this.ensure()) return;
      const resume = this.ctx.resume();
      if (resume && resume.catch) resume.catch(() => {});
      if (!this.started) {
        this.started = true;
        this.step = 0;
        this.next = this.ctx.currentTime + 0.06;
      }
      this.master.gain.setTargetAtTime(this.muted ? 0 : 1, this.ctx.currentTime, 0.03);
    },
    toggle() {
      this.muted = !this.muted;
      if (this.ctx) this.master.gain.setTargetAtTime(this.muted ? 0 : 1, this.ctx.currentTime, 0.03);
      const btn = document.getElementById('mute');
      if (btn) {
        btn.textContent = this.muted ? 'SOUND OFF' : 'SOUND ON';
        btn.setAttribute('aria-pressed', this.muted ? 'true' : 'false');
      }
    },
    tick() {
      if (!this.ctx || !this.started || this.muted) return;
      const t = this.ctx.currentTime;
      if (this.next < t - 0.25) this.next = t + 0.02;
      const stepDur = 60 / 102 / 4;
      let guard = 0;
      while (this.next < t + 0.22 && guard++ < 24) {
        try { this.fire(this.step % 32, this.next); }
        catch (err) { this.audioError = String(err && err.message || err); }
        this.step++;
        this.next += stepDur;
      }
    },
    fire(step, when) {
      const bass = [33, 0, 0, 33, 36, 0, 33, 0, 28, 0, 31, 33, 0, 36, 0, 38, 33, 0, 0, 33, 36, 0, 33, 0, 28, 0, 0, 31, 33, 0, 36, 0];
      const mel = [69, 0, 0, 72, 0, 0, 74, 76, 0, 0, 74, 0, 72, 0, 69, 0, 67, 0, 69, 0, 0, 0, 72, 0, 76, 0, 0, 74, 72, 0, 69, 0];
      if (bass[step]) this.bass(when, bass[step]);
      if (mel[step]) this.toneHz(when, 440 * 2 ** ((mel[step] - 69) / 12), 0.13, 'square', 0.055, this.music, 1400);
      if (step === 0 || step === 8 || step === 16 || step === 22 || step === 24) this.kick(when);
      if (step === 4 || step === 12 || step === 20 || step === 28) this.snare(when);
      else if (step % 2 === 0) this.hat(when, step % 4 === 2 ? 0.045 : 0.028);
    },
    toneHz(when, freq, dur, type, gain, dest, cut) {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, when);
      let node = o;
      if (cut) {
        const f = this.ctx.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.setValueAtTime(cut, when);
        o.connect(f);
        node = f;
      }
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), when + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      node.connect(g);
      g.connect(dest);
      o.start(when);
      o.stop(when + dur + 0.02);
    },
    bass(when, midi) {
      const freq = 440 * 2 ** ((midi - 69) / 12);
      const o = this.ctx.createOscillator();
      const sub = this.ctx.createOscillator();
      const sg = this.ctx.createGain();
      const f = this.ctx.createBiquadFilter();
      const g = this.ctx.createGain();
      o.type = 'sawtooth';
      sub.type = 'sine';
      o.frequency.setValueAtTime(freq, when);
      sub.frequency.setValueAtTime(freq / 2, when);
      f.type = 'lowpass';
      f.frequency.setValueAtTime(680, when);
      f.frequency.exponentialRampToValueAtTime(160, when + 0.14);
      sg.gain.value = 0.45;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(0.5, when + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);
      o.connect(f);
      sub.connect(sg);
      sg.connect(f);
      f.connect(g);
      g.connect(this.music);
      o.start(when); sub.start(when);
      o.stop(when + 0.18); sub.stop(when + 0.18);
    },
    kick(when) {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(148, when);
      o.frequency.exponentialRampToValueAtTime(42, when + 0.12);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(0.85, when + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 0.18);
      o.connect(g); g.connect(this.music);
      o.start(when); o.stop(when + 0.2);
    },
    noise(when, dur, type, freq, q, gain, dest, toFreq) {

      src.buffer = this.noiseBuf;
      const f = this.ctx.createBiquadFilter();
      const g = this.ctx.createGain();
      f.type = type;
      f.frequency.setValueAtTime(Math.max(40, freq), when);
      f.Q.value = q;
      if (toFreq) f.frequency.exponentialRampToValueAtTime(Math.max(40, toFreq), when + dur);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(gain, when + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      src.connect(f); f.connect(g); g.connect(dest);
      src.start(when);
      src.stop(when + dur + 0.02);
    },
    snare(when) {
      this.noise(when, 0.12, 'bandpass', 1800, 0.8, 0.35, this.music);
      this.toneHz(when, 196, 0.08, 'triangle', 0.12, this.music);
    },
    hat(when, gain) {
      this.noise(when, 0.035, 'highpass', 7000, 0.7, gain, this.music);
    },
    playHover(id) {
      const now = performance.now();
      if (now - this.hoverAt[id] < 140) return;
      this.hoverAt[id] = now;
      if (!this.ctx || this.muted) return;
      this.toneHz(this.ctx.currentTime, 170 + id * 24, 0.08, 'sine', 0.03, this.sfx);
    },
    playClunk() {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime;
      this.toneHz(t, 210, 0.12, 'square', 0.16, this.sfx, 900);
      this.toneHz(t, 118, 0.16, 'sine', 0.22, this.sfx);
      this.noise(t, 0.07, 'highpass', 1200, 0.5, 0.18, this.sfx);
    },
    playHiss() {
      if (!this.ctx || this.muted) return;
      this.noise(this.ctx.currentTime, 0.28, 'highpass', 2400, 0.4, 0.16, this.sfx, 900);
    },
    playScan() {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime;
      this.toneHz(t, 880, 0.12, 'sine', 0.1, this.sfx);
      this.toneHz(t + 0.11, 1320, 0.16, 'sine', 0.09, this.sfx);
    },
    playBlip() {
      if (!this.ctx || this.muted) return;
      this.toneHz(this.ctx.currentTime, 660, 0.06, 'square', 0.04, this.sfx, 2000);
    },
    playWhoosh() {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime;
      this.noise(t, 0.7, 'bandpass', 320, 0.7, 0.28, this.sfx, 2400);
      this.toneHz(t, 90, 0.45, 'sawtooth', 0.06, this.sfx, 400);
    },
    playError() {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime;
      this.toneHz(t, 140, 0.28, 'square', 0.14, this.sfx, 700);
      this.toneHz(t, 92, 0.32, 'sawtooth', 0.08, this.sfx, 500);
      this.noise(t, 0.22, 'bandpass', 1600, 0.8, 0.2, this.sfx, 280);
    },
    playSuccess() {

      const t = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        this.toneHz(t + i * 0.07, f, 0.2, 'triangle', 0.1, this.sfx);

    },
    playZap() {

      this.noise(t, 0.18, 'highpass', 1800, 0.6, 0.2, this.sfx, 400);
      this.toneHz(t, 90, 0.14, 'square', 0.08, this.sfx, 600);
    },
    playFanfare() {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
