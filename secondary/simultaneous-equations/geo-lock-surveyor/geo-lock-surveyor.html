<script>
'use strict';

/* Geo-Lock Surveyor: Blueprint Algebra
   Singapore Sec 2 G3 — form and solve simultaneous linear equations
   from geometric constraints. Every blueprint is built from random
   integer parameters, solved exactly, and rejected if the diagram,
   the equations, or the distractors disagree. */

const W = 1280;
const H = 720;
const UI = '"Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif';
const MONO = 'ui-monospace, Consolas, "Courier New", monospace';
const MINUS = '\u2212';
const TIMES = '\u00d7';

const COL = {
  bg: '#07131d',
  ink: '#e7f6ff',
  dim: '#8eafc4',
  cyan: '#3ee0ff',
  magenta: '#ff3d9a',
  amber: '#ffc857',
  good: '#5dffb0',
  bad: '#ff4d6a',
  gold: '#ffe08a',
  p1: '#ff3355',
  p2: '#3aa0ff'
};

const GEO = {
  hud: { x: 16, y: 10, w: 1248, h: 52 },
  spec: { x: 16, y: 70, w: 1248, h: 68 },
  stage: { x: 16, y: 146, w: 1248, h: 312 },
  view: { x: 28, y: 158, w: 748, h: 288 },
  bus: { x: 788, y: 158, w: 464, h: 288 },
  deck: { x: 16, y: 466, w: 1248, h: 240 },
  mute: { x: 1168, y: 18, w: 80, h: 36 }
};

const TRIPLES = [
  [6, 8, 10], [8, 6, 10], [5, 12, 13], [12, 5, 13], [9, 12, 15], [12, 9, 15],
  [8, 15, 17], [15, 8, 17], [7, 24, 25], [20, 21, 29], [21, 20, 29],
  [12, 16, 20], [16, 12, 20], [18, 24, 30], [15, 20, 25], [20, 15, 25],
  [10, 24, 26], [9, 40, 41], [12, 35, 37], [28, 45, 53], [11, 60, 61],
  [15, 36, 39], [24, 32, 40], [21, 28, 35], [28, 21, 35], [18, 80, 82]
];

let canvas, ctx;
const game = {
  screen: 'title',
  mode: 'solo',
  round: 1,
  step: 0,
  phase: 'play',
  problem: null,
  shields: 3,
  maxShields: 3,
  pShields: [3, 3],
  score: 0,
  pScore: [0, 0],
  stars: [0, 0],
  combo: 0,
  pCombo: [0, 0],
  cleared: 0,
  sel: [0, 0],
  titleSel: 0,
  tip: '',
  tipT: 0,
  lock: 0,
  celebrateT: 0,
  time: 0,
  shake: 0,
  flash: 0,
  particles: [],
  floats: [],
  history: [],
  best: {},
  paused: false,
  fatal: '',
  overReason: '',
  winner: '',
  mouseX: 640,
  mouseY: 360,
  mouseIn: false,
  pointerDevice: 'mouse',
  hoverLock: false,
  padOn: [false, false],
  view: { s: 1, ox: 0, oy: 0 },
  lastAward: 0
};

const keysDown = new Set();
const keyEdge = new Set();
let pointerDown = false;
let pointerEdge = false;
let frameUsed = false;
let lastAudit = '';

const audio = {
  ctx: null,
  master: null,
  music: null,
  muted: false,
  started: false,
  step: 0,
  next: 0,
  noise: null
};

const padMem = [
  { buttons: [], dx: 0, dy: 0 },
  { buttons: [], dx: 0, dy: 0 }
];

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function randInt(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = a[i];
    a[i] = a[j];
    a[j] = t;
  }
  return a;
}
function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }

function ev(e, sol) { return e.a * sol.x + e.b * sol.y + e.c; }
function addE(p, q) { return { a: p.a + q.a, b: p.b + q.b, c: p.c + q.c }; }
function sameE(p, q) { return p.a === q.a && p.b === q.b && p.c === q.c; }

function stdDiff(left, right) {
  return { A: left.a - right.a, B: left.b - right.b, C: right.c - left.c };
}
function stdNum(expr, n) {
  return { A: expr.a, B: expr.b, C: n - expr.c };
}
function stdScale(expr, k, rhs) {
  return { A: k * expr.a, B: k * expr.b, C: rhs - k * expr.c };
}
function holdsStd(e, sol) { return e.A * sol.x + e.B * sol.y === e.C; }
function solve2(e1, e2) {
  const det = e1.A * e2.B - e2.A * e1.B;
  if (det === 0) return null;
  const nx = e1.C * e2.B - e2.C * e1.B;
  const ny = e1.A * e2.C - e2.A * e1.C;
  if (nx % det !== 0 || ny % det !== 0) return null;
  return { x: nx / det, y: ny / det };
}
function validSystem(e1, e2, sol) {
  if (!e1 || !e2) return false;
  if ((e1.A === 0 && e1.B === 0) || (e2.A === 0 && e2.B === 0)) return false;
  if (!holdsStd(e1, sol) || !holdsStd(e2, sol)) return false;
  const got = solve2(e1, e2);
  return !!got && got.x === sol.x && got.y === sol.y;
}
function proportional(p, q) {
  if (!p || !q) return false;
  if ((p.A === 0 && p.B === 0) || (q.A === 0 && q.B === 0)) return false;
  return p.A * q.B - q.A * p.B === 0 &&
    p.A * q.C - q.A * p.C === 0 &&
    p.B * q.C - q.B * p.C === 0;
}

function fmtExpr(e, v1, v2) {
  const parts = [];
  function push(coef, body) {
    if (!coef) return;
    parts.push({ c: coef, body: body });
  }
  if (e.a) push(e.a, (Math.abs(e.a) === 1 ? '' : String(Math.abs(e.a))) + v1);
  if (e.b) push(e.b, (Math.abs(e.b) === 1 ? '' : String(Math.abs(e.b))) + v2);
  if (e.c) push(e.c, String(Math.abs(e.c)));
  if (!parts.length) return '0';
  let s = '';
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (i === 0) s += (p.c < 0 ? MINUS : '') + p.body;
    else s += p.c < 0 ? ' ' + MINUS + ' ' + p.body : ' + ' + p.body;
  }
  return s;
}
function fmtAtom(e, v1, v2) {
  const s = fmtExpr(e, v1, v2);
  const terms = (e.a ? 1 : 0) + (e.b ? 1 : 0) + (e.c ? 1 : 0);
  if (terms > 1 || s.charAt(0) === MINUS) return '(' + s + ')';
  return s;
}
function parseMath(src) {
  const tokens = [];
  const re = /\{(\d+)\|(\d+)\}/g;
  let last = 0;
  let m;
  while ((m = re.exec(src))) {
    if (m.index > last) tokens.push({ t: 't', s: src.slice(last, m.index) });
    tokens.push({ t: 'f', n: m[1], d: m[2] });
    last = m.index + m[0].length;
  }
  if (last < src.length) tokens.push({ t: 't', s: src.slice(last) });
  if (!tokens.length) tokens.push({ t: 't', s: '' });
  return tokens;
}
function joinBits(items) {
  let s = '';
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const body = (Math.abs(item.c) === 1 && item.name ? '' : String(Math.abs(item.c))) + (item.name || '');
    if (i === 0) s += (item.c < 0 ? MINUS : '') + (item.name ? body : String(Math.abs(item.c)));
    else s += item.c < 0 ? ' ' + MINUS + ' ' + (item.name ? body : String(Math.abs(item.c))) : ' + ' + (item.name ? body : String(Math.abs(item.c)));
  }
  return s || '0';
}
function groupTip(exprs, v1, v2) {
  const as = [];
  const bs = [];
  exprs.forEach((e) => {
    if (e.a) as.push({ c: e.a, name: v1 });
    if (e.b) bs.push({ c: e.b, name: v2 });
  });
  const sum = exprs.reduce((acc, e) => addE(acc, e), { a: 0, b: 0, c: 0 });
  const bits = [];
  if (as.length) bits.push('(' + joinBits(as) + ')');
  if (bs.length) bits.push('(' + joinBits(bs) + ')');
  let left = bits.join(' + ');
  if (sum.c > 0) left += (left ? ' + ' : '') + sum.c;
  else if (sum.c < 0) left += ' ' + MINUS + ' ' + Math.abs(sum.c);
  return 'Combine like terms carefully: ' + left + ' = ' + fmtExpr(sum, v1, v2) + '!';
}

function sampleCoef(rng, allowZero) {
  const bag = allowZero
    ? [0, 0, 1, 1, 1, 2, 2, 3, 3, 4, -1, -1, -2, -3, 1, 2]
    : [1, 1, 1, 2, 2, 3, 3, 4, -1, -1, -2, -3, 2, 1];
  return bag[Math.floor(rng() * bag.length)];
}
function makeExpr(rng, sol, target, avoid, both) {
  const banned = avoid || [];
  for (let i = 0; i < 120; i++) {
    const a = sampleCoef(rng, !both);
    const b = sampleCoef(rng, !both);
    if (both && (a === 0 || b === 0)) continue;
    if (a === 0 && b === 0) continue;
    if (a < 0 || (a === 0 && b < 0)) continue;
    const c = target - a * sol.x - b * sol.y;
    if (Math.abs(c) > 14) continue;
    const e = { a: a, b: b, c: c };
    if (ev(e, sol) !== target) continue;
    if (banned.some((o) => sameE(o, e))) continue;
    return e;
  }
  return null;
}
function pickSol(rng, lo, hi) {
  const x = randInt(rng, lo, hi);
  let y = randInt(rng, lo, hi);
  if (y === x) y = x === hi ? lo : x + 1;
  return { x: x, y: y };
}
function flipExpr(e, which) {
  if (!e) return null;
  if (which === 'a' && !e.a) return null;
  if (which === 'b' && !e.b) return null;
  return {
    a: which === 'a' ? -e.a : e.a,
    b: which === 'b' ? -e.b : e.b,
    c: e.c
  };
}
function pickTriple(rng, pred) {
  const bag = TRIPLES.filter(pred);
  if (!bag.length) return null;
  return pick(rng, bag);
}

function makeEqCard(plain, ok, correct, trap, tip, std) {
  return {
    plain: plain,
    tokens: parseMath(plain),
    ok: ok,
    correct: !!correct,
    trap: trap || '',
    tip: correct ? '' : (tip || 'That equation does not match the marks on the blueprint.'),
    std: std || null,
    kind: 'eq',
    claim: null,
    dead: false
  };
}
function valueCard(vars, pair, measure, correct, trap, tip) {
  const plain = '(' + vars[0] + ', ' + vars[1] + ') = (' + pair.x + ', ' + pair.y + '),   ' +
    measure.label + ' = ' + measure.value + ' ' + measure.unit;
  return {
    plain: plain,
    tokens: parseMath(plain),
    ok: function () { return !!correct; },
    correct: !!correct,
    trap: trap || '',
    tip: correct ? '' : (tip || 'Solve both locked equations again, then substitute into the figure.'),
    std: null,
    kind: 'value',
    claim: { x: pair.x, y: pair.y, value: measure.value, label: measure.label, unit: measure.unit },
    dead: false
  };
}
function sameClaim(a, b) {
  return a.x === b.x && a.y === b.y && a.value === b.value && a.label === b.label;
}
function chooseCards(rng, sol, correct, pool) {
  if (!correct || !correct.ok(sol)) return null;
  const byPlain = {};
  pool.forEach(function (card) {
    if (!card || card.plain === correct.plain || card.ok(sol)) return;
    if (correct.claim && card.claim && sameClaim(correct.claim, card.claim)) return;
    const prev = byPlain[card.plain];
    if (!prev || (card.trap && !prev.trap)) byPlain[card.plain] = card;
  });
  const unique = [];
  Object.keys(byPlain).forEach(function (key) { unique.push(byPlain[key]); });
  const cards = [correct];
  const order = shuffle(rng, unique);
  for (let i = 0; i < order.length && cards.length < 4; i++) cards.push(order[i]);
  if (cards.length < 4) return null;
  return shuffle(rng, cards);
}
function buildValueStep(rng, vars, sol, measure, measureAt, traps) {
  const correct = valueCard(vars, sol, measure, true, '', '');
  const pool = [];
  traps.forEach((t) => {
    if (!Number.isInteger(t.value) || t.value <= 0 || t.value === measure.value) return;
    pool.push(valueCard(vars, sol, {
      label: measure.label, value: t.value, unit: measure.unit
    }, false, t.trap || '', t.tip || ''));
  });
  const alts = [
    { x: sol.y, y: sol.x },
    { x: sol.x + 1, y: sol.y },
    { x: sol.x, y: sol.y + 1 },
    { x: Math.max(1, sol.x - 1), y: sol.y },
    { x: sol.x + 1, y: Math.max(1, sol.y - 1) },
    { x: sol.x + 2, y: sol.y - 1 }
  ];
  alts.forEach((pair) => {
    if (pair.x === sol.x && pair.y === sol.y) return;
    if (pair.x <= 0 || pair.y <= 0) return;
    let v = measureAt(pair);
    if (!Number.isInteger(v) || v <= 0 || v > 900 || v === measure.value) {
      v = measure.value + pair.x;
      if (v === measure.value) return;
    }
    pool.push(valueCard(vars, pair, {
      label: measure.label, value: v, unit: measure.unit
    }, false, '', 'That pair does not satisfy both locked equations. Substitute only the true solution.'));
  });
  [measure.value + 2, measure.value * 2, Math.max(1, measure.value - 3)].forEach((v) => {
    if (v === measure.value) return;
    pool.push(valueCard(vars, sol, {
      label: measure.label, value: v, unit: measure.unit
    }, false, '', 'The ordered pair is only useful after you substitute it into every labelled edge.'));
  });
  const cards = chooseCards(rng, sol, correct, pool);
  if (!cards) return null;
  for (let i = 0; i < traps.length; i++) {
    if (traps[i].required && !cards.some((c) => c.trap === traps[i].trap)) return null;
  }
  return cards;
}

function plotSize() {
  return { w: GEO.view.w - 100, h: GEO.view.h - 68 };
}
function pxToNorm(px, py) {
  const s = plotSize();
  return { x: px / s.w * 100, y: py / s.h * 100 };
}
function placeIso(base, height) {
  const s = plotSize();
  const m = 16;
  const sc = Math.min((s.w - m * 2) / base, (s.h - m * 2) / height);
  const bw = base * sc;
  const bh = height * sc;
  const left = (s.w - bw) / 2;
  const top = (s.h - bh) / 2 + 4;
  return {
    A: pxToNorm(left + bw / 2, top),
    B: pxToNorm(left, top + bh),
    C: pxToNorm(left + bw, top + bh)
  };
}
function placeRect(len, wid, slant) {
  const s = plotSize();
  const m = 28;
  const availW = s.w - m * 2;
  const availH = s.h - m * 2;
  let sc = Math.min(availW / (len * (slant ? 1.2 : 1)), availH / wid);
  let bw = len * sc;
  let lean = slant ? Math.min(36, bw * 0.16) : 0;
  if (bw + lean > availW) {
    sc = availW / (len + len * 0.16);
    bw = len * sc;
    lean = slant ? Math.min(36, bw * 0.16) : 0;
  }
  const bh = wid * sc;
  const left = m + (availW - bw - lean) / 2;
  const top = m + (availH - bh) / 2;
  return {
    A: pxToNorm(left, top + bh),
    B: pxToNorm(left + bw, top + bh),
    C: pxToNorm(left + bw + lean, top),
    D: pxToNorm(left + lean, top)
  };
}
function placeAlt(half, height) {
  const s = plotSize();
  const m = 18;
  const base = half * 2;
  const sc = Math.min((s.w - m * 2) / base, (s.h - m * 2) / height);
  const bw = base * sc;
  const bh = height * sc;
  const left = (s.w - bw) / 2;
  const top = (s.h - bh) / 2 + 6;
  return {
    E: pxToNorm(left + bw / 2, top),
    D: pxToNorm(left, top + bh),
    F: pxToNorm(left + bw, top + bh),
    G: pxToNorm(left + bw / 2, top + bh)
  };
}
function placeRight(box, legX, legY) {
  const sc = Math.min(box.w / legX, box.h / legY);
  const bw = legX * sc;
  const bh = legY * sc;
  const x0 = box.x + (box.w - bw) / 2;
  const y0 = box.y + (box.h - bh) / 2;
  return {
    P: pxToNorm(x0, y0),
    R: pxToNorm(x0, y0 + bh),
    Q: pxToNorm(x0 + bw, y0 + bh)
  };
}

function edge(from, to, opts) {
  return {
    from: from,
    to: to,
    label: opts.label || '',
    value: opts.value,
    unit: opts.unit || 'cm',
    tick: opts.tick || 0,
    role: opts.role || '',
    known: !!opts.known,
    silent: !!opts.silent,
    reveal: !!opts.reveal,
    ghost: !!opts.ghost,
    manual: !!opts.manual,
    nudge: opts.nudge || null,
    t: opts.t == null ? 0.5 : opts.t
  };
}
function V(id, p) { return { id: id, x: p.x, y: p.y }; }

function halfAreaTip(kind, h, expr, area) {
  if (kind === 'tri' && h % 2 === 0) {
    return 'Area of a triangle is 1/2 ' + TIMES + ' base ' + TIMES + ' height! Don\'t forget the 1/2: ' + (h / 2) + '(' + expr + ') = ' + area + '!';
  }
  if (kind === 'tri') return 'Area of a triangle is 1/2 ' + TIMES + ' base ' + TIMES + ' height! Don\'t forget the 1/2.';
  if (kind === 'rhomb') return 'Area of a rhombus is 1/2 ' + TIMES + ' d1 ' + TIMES + ' d2! Don\'t drop the 1/2.';
  if (kind === 'trap') return 'Area of a trapezium is 1/2 ' + TIMES + ' (sum of the parallel sides) ' + TIMES + ' height! Don\'t drop the 1/2.';
  return 'The roof is a triangle, so its area is 1/2 ' + TIMES + ' width ' + TIMES + ' roof height. Don\'t drop that 1/2.';
}
function halfBaseTip(half, area, height) {
  const full = half * 2;
  return half + ' cm is only half the base (DG or GF)! The full base DF of \u0394DEF is ' + half + ' + ' + half + ' = ' + full + ' cm! Area = 1/2 ' + TIMES + ' ' + full + ' ' + TIMES + ' EG = ' + area + ', so EG = ' + height + ' cm.';
}

function genIso(rng) {
  const vars = ['x', 'y'];
  for (let attempt = 0; attempt < 90; attempt++) {
    const sol = pickSol(rng, 2, 8);
    const L = randInt(rng, 9, 18);
    const B = randInt(rng, 6, Math.max(6, Math.floor(L * 1.15)));
    if (B >= 2 * L - 2) continue;
    const tall = Math.sqrt(L * L - (B / 2) * (B / 2));
    if (!(tall > B * 0.28)) continue;
    const eAB = makeExpr(rng, sol, L, [], attempt < 50);
    const eAC = makeExpr(rng, sol, L, eAB ? [eAB] : [], attempt < 30);
    const eBC = makeExpr(rng, sol, B, [eAB, eAC].filter(Boolean), false);
    if (!eAB || !eAC || !eBC) continue;
    const std1 = stdDiff(eAB, eAC);
    const sum = addE(addE(eAB, eAC), eBC);
    const P = 2 * L + B;
    const std2 = stdNum(sum, P);
    if (!validSystem(std1, std2, sol)) continue;
    if (Math.abs(sum.a) > 16 || Math.abs(sum.b) > 16) continue;
    const v1 = vars[0];
    const v2 = vars[1];
    const eq1 = makeEqCard(
      fmtExpr(eAB, v1, v2) + ' = ' + fmtExpr(eAC, v1, v2),
      function (s) { return ev(eAB, s) === ev(eAC, s); },
      true, '', '', std1
    );
    const pool1 = [];
    pool1.push(makeEqCard(
      fmtExpr(eAB, v1, v2) + ' = ' + fmtExpr(eBC, v1, v2),
      function (s) { return ev(eAB, s) === ev(eBC, s); },
      false, 'wrong-pair', 'Those are not the matching sides. The tick marks set AB = AC.', null
    ));
    const flip = flipExpr(eAC, eAC.a ? 'a' : 'b');
    if (flip) {
      pool1.push(makeEqCard(
        fmtExpr(eAB, v1, v2) + ' = ' + fmtExpr(flip, v1, v2),
        function (s) { return ev(eAB, s) === ev(flip, s); },
        false, 'sign', 'Copy every sign on AC. The ticks set the two expressions equal as written.', null
      ));
    }
    const two = addE(eAB, eAC);
    pool1.push(makeEqCard(
      fmtExpr(two, v1, v2) + ' = ' + P,
      function (s) { return ev(two, s) === P; },
      false, 'two-sides', 'Adding the equal sides belongs to the perimeter step, and base BC is still missing.', null
    ));
    const tweak = { a: eAC.a, b: eAC.b, c: eAC.c + (eAC.c >= 8 ? -3 : 3) };
    pool1.push(makeEqCard(
      fmtExpr(eAB, v1, v2) + ' = ' + fmtExpr(tweak, v1, v2),
      function (s) { return ev(eAB, s) === ev(tweak, s); },
      false, '', 'A constant on AC was changed. Lock the expressions printed on the sides.', null
    ));
    pool1.push(makeEqCard(
      fmtExpr(eAC, v1, v2) + ' = ' + B,
      function (s) { return ev(eAC, s) === B; },
      false, '', 'That sets an equal side equal to the base length. Follow the tick marks instead.', null
    ));
    const cards1 = chooseCards(rng, sol, eq1, pool1);
    if (!cards1) continue;

    const eq2 = makeEqCard(
      fmtExpr(sum, v1, v2) + ' = ' + P,
      function (s) { return ev(sum, s) === P; },
      true, '', '', std2
    );
    const pool2 = [];
    const signTip = groupTip([eAB, eAC, eBC], v1, v2);
    [['a', eAB, 'AB'], ['b', eAC, 'AC'], ['a', eBC, 'BC'], ['b', eBC, 'BC']].forEach((spec) => {
      const host = spec[1];
      const flipped = flipExpr(host, spec[0]);
      if (!flipped) return;
      const bad = spec[2] === 'AB' ? addE(addE(flipped, eAC), eBC)
        : spec[2] === 'AC' ? addE(addE(eAB, flipped), eBC)
        : addE(addE(eAB, eAC), flipped);
      pool2.push(makeEqCard(
        fmtExpr(bad, v1, v2) + ' = ' + P,
        function (s) { return ev(bad, s) === P; },
        false, 'sign', signTip, null
      ));
    });
    pool2.push(makeEqCard(
      fmtExpr(two, v1, v2) + ' = ' + P,
      function (s) { return ev(two, s) === P; },
      false, 'two-sides', 'A perimeter adds all three sides. Base BC = ' + fmtExpr(eBC, v1, v2) + ' is missing.', null
    ));
    const miss = addE(eAB, eBC);
    pool2.push(makeEqCard(
      fmtExpr(miss, v1, v2) + ' = ' + P,
      function (s) { return ev(miss, s) === P; },
      false, 'two-sides', 'Count AB, AC and BC. One of the equal sides was left out of the perimeter.', null
    ));
    if (sum.c !== 0) {
      const dropped = { a: sum.a, b: sum.b, c: 0 };
      pool2.push(makeEqCard(
        fmtExpr(dropped, v1, v2) + ' = ' + P,
        function (s) { return ev(dropped, s) === P; },
        false, '', 'The constants on the three sides still have to be combined.', null
      ));
    }
    const cards2 = chooseCards(rng, sol, eq2, pool2);
    if (!cards2 || !cards2.some((c) => c.trap === 'sign') || !cards2.some((c) => c.trap === 'two-sides')) continue;

    const askBase = rng() < 0.42;
    const measure = askBase
      ? { label: 'BC', value: B, unit: 'cm' }
      : { label: 'AB', value: L, unit: 'cm' };
    const measureAt = askBase ? function (s) { return ev(eBC, s); } : function (s) { return ev(eAB, s); };
    const traps = askBase
      ? [{ value: L, tip: 'That length is an equal side, not base BC.' }, { value: P, tip: 'That is the whole perimeter, not base BC.' }]
      : [{ value: B, tip: 'That length is base BC, not the equal side AB.' }, { value: P, tip: 'That is the whole perimeter, not side AB.' }];
    const cards3 = buildValueStep(rng, vars, sol, measure, measureAt, traps);
    if (!cards3) continue;

    const pts = placeIso(B, tall);
    const figure = {
      verts: [V('A', pts.A), V('B', pts.B), V('C', pts.C)],
      edges: [
        edge('A', 'B', { label: fmtExpr(eAB, v1, v2), value: L, tick: 1, role: 'eq1' }),
        edge('A', 'C', { label: fmtExpr(eAC, v1, v2), value: L, tick: 1, role: 'eq1' }),
        edge('B', 'C', { label: fmtExpr(eBC, v1, v2), value: B, role: 'eq2' })
      ],
      dashes: [],
      angles: [],
      fills: [{ ids: ['A', 'B', 'C'], role: 'eq2' }]
    };
    return publish({
      arch: 'iso',
      name: 'ISOSCELES \u0394ABC',
      vars: vars,
      sol: sol,
      std: [std1, std2],
      givens: 'AB = AC (matching ticks).  Perimeter of \u0394ABC = ' + P + ' cm.',
      prompts: [
        'STEP 1 \u00b7 Tick marks set AB = AC. Lock Equation 1.',
        'STEP 2 \u00b7 Add all three sides and combine like terms. Perimeter = ' + P + ' cm.',
        'STEP 3 \u00b7 Solve (x, y) and find the length of ' + measure.label + '.'
      ],
      steps: [
        { cards: cards1 },
        { cards: cards2 },
        { cards: cards3 }
      ],
      figure: figure,
      measure: measure,
      measureAt: measureAt,
      facts: {
        check: function (s) {
          return ev(eAB, s) === L && ev(eAC, s) === L && ev(eBC, s) === B &&
            2 * L > B && L > 0 && B > 0 && tall > 0;
        }
      }
    });
  }
  return null;
}

function genRect(rng) {
  const vars = ['x', 'y'];
  for (let attempt = 0; attempt < 90; attempt++) {
    const sol = pickSol(rng, 1, 8);
    const L = randInt(rng, 8, 24);
    const Wd = randInt(rng, 6, 18);
    if (L === Wd || Math.abs(L - Wd) < 2) continue;
    const eL = makeExpr(rng, sol, L, [], attempt < 40);
    const eW = makeExpr(rng, sol, Wd, eL ? [eL] : [], attempt < 20);
    if (!eL || !eW) continue;
    const std1 = stdNum(eL, L);
    const std2 = stdNum(eW, Wd);
    if (!validSystem(std1, std2, sol)) continue;
    const v1 = vars[0];
    const v2 = vars[1];
    const slant = rng() < 0.4;
    const askArea = !slant && rng() < 0.55;
    const measure = askArea
      ? { label: 'Area', value: L * Wd, unit: 'cm\u00b2' }
      : { label: 'Perimeter', value: 2 * (L + Wd), unit: 'cm' };
    const eq1 = makeEqCard(
      fmtExpr(eL, v1, v2) + ' = ' + L,
      function (s) { return ev(eL, s) === L; },
      true, '', '', std1
    );
    const pool1 = [
      makeEqCard(fmtExpr(eL, v1, v2) + ' = ' + Wd, function (s) { return ev(eL, s) === Wd; }, false, 'wrong-pair', 'That number belongs to the double-tick pair, not the single-tick length.', null),
      makeEqCard(fmtExpr(eW, v1, v2) + ' = ' + L, function (s) { return ev(eW, s) === L; }, false, 'wrong-pair', 'Match each expression to the opposite side with the same tick marks.', null)
    ];
    const flipL = flipExpr(eL, eL.b ? 'b' : 'a');
    if (flipL) {
      pool1.push(makeEqCard(
        fmtExpr(flipL, v1, v2) + ' = ' + L,
        function (s) { return ev(flipL, s) === L; },
        false, 'sign', 'Keep the signs printed on the side. Only then set it equal to the opposite side.', null
      ));
    }
    pool1.push(makeEqCard(
      fmtExpr(eL, v1, v2) + ' = ' + (L + Wd),
      function (s) { return ev(eL, s) === L + Wd; },
      false, '', 'Opposite sides match one side to one side. Do not add the width yet.', null
    ));
    const cards1 = chooseCards(rng, sol, eq1, pool1);
    if (!cards1) continue;
    const eq2 = makeEqCard(
      fmtExpr(eW, v1, v2) + ' = ' + Wd,
      function (s) { return ev(eW, s) === Wd; },
      true, '', '', std2
    );
    const pool2 = [
      makeEqCard(fmtExpr(eW, v1, v2) + ' = ' + L, function (s) { return ev(eW, s) === L; }, false, 'wrong-pair', 'That number is the other pair. Double ticks mark the width.', null),
      makeEqCard(fmtExpr(addE(eL, eW), v1, v2) + ' = ' + (L + Wd), function (s) { return ev(eL, s) + ev(eW, s) === L + Wd; }, false, '', 'Each pair is its own equation. Do not add the two expressions together.', null)
    ];
    const flipW = flipExpr(eW, eW.a ? 'a' : 'b');
    if (flipW) {
      pool2.push(makeEqCard(
        fmtExpr(flipW, v1, v2) + ' = ' + Wd,
        function (s) { return ev(flipW, s) === Wd; },
        false, 'sign', 'A sign on the width was flipped. Read the label, then equate opposite sides.', null
      ));
    }
    pool2.push(makeEqCard(
      fmtExpr(eW, v1, v2) + ' = ' + (2 * Wd),
      function (s) { return ev(eW, s) === 2 * Wd; },
      false, '', 'The opposite side is ' + Wd + ' cm, not twice that length.', null
    ));
    const cards2 = chooseCards(rng, sol, eq2, pool2);
    if (!cards2) continue;
    const measureAt = askArea
      ? function (s) { return ev(eL, s) * ev(eW, s); }
      : function (s) { return 2 * (ev(eL, s) + ev(eW, s)); };
    const traps = askArea
      ? [
        { value: L + Wd, tip: 'Area of a rectangle is length ' + TIMES + ' width, not length + width.' },
        { value: 2 * (L + Wd), tip: 'That is the perimeter. Area multiplies the solved sides.' },
        { value: L * L, tip: 'Use both solved sides. Area = length ' + TIMES + ' width.' }
      ]
      : [
        { value: L + Wd, trap: 'two-sides', tip: 'Perimeter uses the whole outline: 2 ' + TIMES + ' (length + width). Two adjacent sides are not enough.' },
        { value: L * Wd, tip: 'That product is the area. The question asks for the perimeter.' },
        { value: 2 * L + Wd, tip: 'Both widths belong in the perimeter, not just one.' }
      ];
    const cards3 = buildValueStep(rng, vars, sol, measure, measureAt, traps);
    if (!cards3) continue;
    const pts = placeRect(Math.max(L, 8), Math.max(Wd, 6), slant);
    const figure = {
      verts: [V('A', pts.A), V('B', pts.B), V('C', pts.C), V('D', pts.D)],
      edges: [
        edge('A', 'B', { label: fmtExpr(eL, v1, v2), value: L, tick: 1, role: 'eq1' }),
        edge('D', 'C', { label: String(L), value: L, tick: 1, role: 'eq1', known: true }),
        edge('A', 'D', { label: fmtExpr(eW, v1, v2), value: Wd, tick: 2, role: 'eq2' }),
        edge('B', 'C', { label: String(Wd), value: Wd, tick: 2, role: 'eq2', known: true })
      ],
      dashes: [],
      angles: slant ? [] : [
        { at: 'A', a: 'B', b: 'D' },
        { at: 'B', a: 'A', b: 'C' },
        { at: 'C', a: 'B', b: 'D' },
        { at: 'D', a: 'A', b: 'C' }
      ],
      fills: []
    };
    return publish({
      arch: 'rect',
      name: slant ? 'PARALLELOGRAM ABCD' : 'RECTANGLE ABCD',
      vars: vars,
      sol: sol,
      std: [std1, std2],
      givens: 'Opposite sides are equal. Single ticks mark one pair. Double ticks mark the other pair.',
      prompts: [
        'STEP 1 \u00b7 Single ticks: lock the length equation.',
        'STEP 2 \u00b7 Double ticks: lock the width equation.',
        'STEP 3 \u00b7 Solve (x, y) and find the ' + measure.label.toLowerCase() + '.'
      ],
      steps: [{ cards: cards1 }, { cards: cards2 }, { cards: cards3 }],
      figure: figure,
      measure: measure,
      measureAt: measureAt,
      facts: {
        check: function (s) {
          return ev(eL, s) === L && ev(eW, s) === Wd && L > 0 && Wd > 0 &&
            (askArea ? measure.value === L * Wd : measure.value === 2 * (L + Wd));
        }
      }
    });
  }
  return null;
}

function genAlt(rng) {
  const vars = ['m', 'n'];
  for (let attempt = 0; attempt < 100; attempt++) {
    const tri = pickTriple(rng, function (t) {
      return t[0] >= 5 && t[0] <= 16 && t[1] >= 4 && t[1] <= 18 && t[2] <= 30 && t[0] * t[1] <= 320;
    });
    if (!tri) return null;
    const half = tri[0];
    const height = tri[1];
    const slant = tri[2];
    const area = half * height;
    if (half * half + height * height !== slant * slant) continue;
    const sol = pickSol(rng, 2, 8);
    const eDE = makeExpr(rng, sol, slant, [], attempt < 45);
    const eEF = makeExpr(rng, sol, slant, eDE ? [eDE] : [], attempt < 25);
    const eDG = makeExpr(rng, sol, half, [eDE, eEF].filter(Boolean), attempt < 35);
    const eGF = makeExpr(rng, sol, half, [eDE, eEF, eDG].filter(Boolean), false);
    if (!eDE || !eEF || !eDG || !eGF) continue;
    const std1 = stdDiff(eDE, eEF);
    const std2 = stdDiff(eDG, eGF);
    if (!validSystem(std1, std2, sol)) continue;
    const v1 = vars[0];
    const v2 = vars[1];
    const eq1 = makeEqCard(
      fmtExpr(eDE, v1, v2) + ' = ' + fmtExpr(eEF, v1, v2),
      function (s) { return ev(eDE, s) === ev(eEF, s); },
      true, '', '', std1
    );
    const pool1 = [];
    const flip = flipExpr(eEF, eEF.a ? 'a' : 'b');
    if (flip) {
      pool1.push(makeEqCard(
        fmtExpr(eDE, v1, v2) + ' = ' + fmtExpr(flip, v1, v2),
        function (s) { return ev(eDE, s) === ev(flip, s); },
        false, 'sign', 'Match DE to EF with the signs as printed on the slanted sides.', null
      ));
    }
    pool1.push(makeEqCard(
      fmtExpr(eDE, v1, v2) + ' = ' + fmtExpr(eDG, v1, v2),
      function (s) { return ev(eDE, s) === ev(eDG, s); },
      false, 'wrong-pair', 'DG is half the base, not a slanted side. Single ticks mark DE = EF.', null
    ));
    pool1.push(makeEqCard(
      fmtExpr(eDG, v1, v2) + ' = ' + fmtExpr(eGF, v1, v2),
      function (s) { return ev(eDG, s) === ev(eGF, s); },
      false, '', 'That is the base-bisection equation. Step 1 uses the slanted ticks, DE = EF.', null
    ));
    pool1.push(makeEqCard(
      fmtExpr(eDE, v1, v2) + ' = ' + area,
      function (s) { return ev(eDE, s) === area; },
      false, '', 'The area is not the length of DE. Use the tick marks first.', null
    ));
    const cards1 = chooseCards(rng, sol, eq1, pool1);
    if (!cards1) continue;
    if (cards1.some((c) => !c.correct && c.ok(sol))) continue;

    const eq2 = makeEqCard(
      fmtExpr(eDG, v1, v2) + ' = ' + fmtExpr(eGF, v1, v2),
      function (s) { return ev(eDG, s) === ev(eGF, s); },
      true, '', '', std2
    );
    const pool2 = [];
    const flipG = flipExpr(eGF, eGF.a ? 'a' : 'b');
    if (flipG) {
      pool2.push(makeEqCard(
        fmtExpr(eDG, v1, v2) + ' = ' + fmtExpr(flipG, v1, v2),
        function (s) { return ev(eDG, s) === ev(flipG, s); },
        false, 'sign', 'EG \u22a5 DF bisects the base, so DG and GF are equal as labelled. Check the signs.', null
      ));
    }
    pool2.push(makeEqCard(
      '{1|2} ' + TIMES + ' ' + fmtAtom(eDG, v1, v2) + ' ' + TIMES + ' EG = ' + area,
      function () { return false; },
      false, 'half-base', halfBaseTip(half, area, height), null
    ));
    pool2.push(makeEqCard(
      fmtExpr(eDE, v1, v2) + ' = ' + fmtExpr(eEF, v1, v2),
      function (s) { return ev(eDE, s) === ev(eEF, s); },
      false, '', 'DE = EF is already Equation 1. Equation 2 comes from DG = GF.', null
    ));
    const sumHalf = addE(eDG, eGF);
    pool2.push(makeEqCard(
      fmtExpr(sumHalf, v1, v2) + ' = ' + half,
      function (s) { return ev(sumHalf, s) === half; },
      false, '', 'DG and GF are each half of DF. Set them equal; do not add them and call the sum one half.', null
    ));
    pool2.push(makeEqCard(
      fmtExpr(eDG, v1, v2) + ' = ' + (half * 2),
      function (s) { return ev(eDG, s) === half * 2; },
      false, 'half-base', half + ' cm labels one half only. DG = GF, and the full base is ' + (half * 2) + ' cm.', null
    ));
    const cards2 = chooseCards(rng, sol, eq2, pool2);
    if (!cards2) continue;

    const measure = { label: 'EG', value: height, unit: 'cm' };
    const measureAt = function () { return height; };
    const traps = [
      { value: height * 2, trap: 'half-base', required: true, tip: halfBaseTip(half, area, height) },
      { value: half, tip: half + ' cm is DG (or GF), not the altitude EG.' },
      { value: half * 2, tip: 'That is the full base DF, not the height EG.' },
      { value: area, tip: 'That is the area in cm\u00b2, not the height in cm.' }
    ];
    const cards3 = buildValueStep(rng, vars, sol, measure, measureAt, traps);
    if (!cards3) continue;

    const pts = placeAlt(half, height);
    const figure = {
      verts: [V('E', pts.E), V('D', pts.D), V('F', pts.F), V('G', pts.G)],
      edges: [
        edge('D', 'E', { label: fmtExpr(eDE, v1, v2), value: slant, tick: 1, role: 'eq1' }),
        edge('E', 'F', { label: fmtExpr(eEF, v1, v2), value: slant, tick: 1, role: 'eq1' }),
        edge('D', 'G', { label: fmtExpr(eDG, v1, v2), value: half, tick: 2, role: 'eq2', t: 0.28 }),
        edge('G', 'F', { label: fmtExpr(eGF, v1, v2), value: half, tick: 2, role: 'eq2', t: 0.72 })
      ],
      dashes: [
        edge('E', 'G', { label: 'EG', value: height, role: '', nudge: { x: 18, y: 0 } })
      ],
      angles: [{ at: 'G', a: 'D', b: 'E' }],
      fills: [{ ids: ['D', 'E', 'F'], role: '' }]
    };
    return publish({
      arch: 'alt',
      name: 'ALTITUDE \u0394DEF',
      vars: vars,
      sol: sol,
      std: [std1, std2],
      givens: 'DE = EF.  EG \u22a5 DF and bisects DF.  Area of \u0394DEF = ' + area + ' cm\u00b2.',
      prompts: [
        'STEP 1 \u00b7 Single ticks: lock DE = EF.',
        'STEP 2 \u00b7 The altitude bisects the base. Lock DG = GF.',
        'STEP 3 \u00b7 Solve (m, n). Use the full base DF and the area to find EG.'
      ],
      steps: [{ cards: cards1 }, { cards: cards2 }, { cards: cards3 }],
      figure: figure,
      measure: measure,
      measureAt: function (s) {
        const hlf = ev(eDG, s);
        if (!hlf || area % hlf !== 0) return height + s.x;
        return area / hlf;
      },
      facts: {
        check: function (s) {
          return ev(eDE, s) === slant && ev(eEF, s) === slant &&
            ev(eDG, s) === half && ev(eGF, s) === half &&
            half * half + height * height === slant * slant &&
            area === half * height &&
            0.5 * (half * 2) * height === area;
        }
      }
    });
  }
  return null;
}

function genPaired(rng) {
  const vars = ['p', 'q'];
  for (let attempt = 0; attempt < 100; attempt++) {
    const tri = pickTriple(rng, function (t) {
      const area = t[0] * t[1] / 2;
      return t[0] >= 5 && t[0] <= 20 && t[1] >= 5 && t[1] <= 24 && t[2] <= 32 &&
        area >= 24 && area <= 240 && area === Math.floor(area);
    });
    if (!tri) return null;
    const height = tri[0];
    const base = tri[1];
    const hyp = tri[2];
    const area = height * base / 2;
    if (height * height + base * base !== hyp * hyp) continue;
    if (hyp <= height || hyp <= base) continue;
    const sol = pickSol(rng, 2, 8);
    const eQR = makeExpr(rng, sol, base, [], attempt < 40);
    const ePQ = makeExpr(rng, sol, hyp, eQR ? [eQR] : [], attempt < 40);
    const eST = makeExpr(rng, sol, hyp, [eQR, ePQ].filter(Boolean), attempt < 20);
    if (!eQR || !ePQ || !eST) continue;
    const std1 = stdDiff(ePQ, eST);
    const std2 = stdScale(eQR, height, 2 * area);
    if (!validSystem(std1, std2, sol)) continue;
    const v1 = vars[0];
    const v2 = vars[1];
    const baseAtom = fmtAtom(eQR, v1, v2);
    const eq1 = makeEqCard(
      fmtExpr(ePQ, v1, v2) + ' = ' + fmtExpr(eST, v1, v2),
      function (s) { return ev(ePQ, s) === ev(eST, s); },
      true, '', '', std1
    );
    const pool1 = [];
    const flip = flipExpr(eST, eST.a ? 'a' : 'b');
    if (flip) {
      pool1.push(makeEqCard(
        fmtExpr(ePQ, v1, v2) + ' = ' + fmtExpr(flip, v1, v2),
        function (s) { return ev(ePQ, s) === ev(flip, s); },
        false, 'sign', 'PQ = ST. Copy the hypotenuse labels before you equate them.', null
      ));
    }
    pool1.push(makeEqCard(
      fmtExpr(ePQ, v1, v2) + ' = ' + height,
      function (s) { return ev(ePQ, s) === height; },
      false, '', 'PR is a leg of ' + height + ' cm. The ticks equate the two hypotenuses, PQ and ST.', null
    ));
    pool1.push(makeEqCard(
      fmtExpr(eQR, v1, v2) + ' = ' + fmtExpr(eST, v1, v2),
      function (s) { return ev(eQR, s) === ev(eST, s); },
      false, 'wrong-pair', 'QR is the base of \u0394PQR, not the side marked equal to ST.', null
    ));
    pool1.push(makeEqCard(
      '{1|2} ' + TIMES + ' ' + height + ' ' + TIMES + ' ' + baseAtom + ' = ' + area,
      function (s) { return height * ev(eQR, s) === 2 * area; },
      false, '', 'That is the area equation. Step 1 locks the equal hypotenuses PQ = ST.', null
    ));
    const cards1 = chooseCards(rng, sol, eq1, pool1);
    if (!cards1) continue;

    const eq2plain = '{1|2} ' + TIMES + ' ' + height + ' ' + TIMES + ' ' + baseAtom + ' = ' + area;
    const eq2 = makeEqCard(
      eq2plain,
      function (s) { return height * ev(eQR, s) === 2 * area; },
      true, '', '', std2
    );
    const pool2 = [];
    pool2.push(makeEqCard(
      height + ' ' + TIMES + ' ' + baseAtom + ' = ' + area,
      function (s) { return height * ev(eQR, s) === area; },
      false, 'half-area', halfAreaTip('tri', height, fmtExpr(eQR, v1, v2), area), null
    ));
    pool2.push(makeEqCard(
      '{1|2} ' + TIMES + ' ' + height + ' ' + TIMES + ' ' + fmtAtom(ePQ, v1, v2) + ' = ' + area,
      function (s) { return height * ev(ePQ, s) === 2 * area; },
      false, '', 'Area uses the perpendicular base and height, not the hypotenuse.', null
    ));
    pool2.push(makeEqCard(
      '{1|2} ' + TIMES + ' ' + height + ' ' + TIMES + ' ' + baseAtom + ' = ' + (area * 2),
      function (s) { return height * ev(eQR, s) === 4 * area; },
      false, '', 'The given area is ' + area + ' cm\u00b2. Do not double it before writing the equation.', null
    ));
    pool2.push(makeEqCard(
      baseAtom + ' = ' + area,
      function (s) { return ev(eQR, s) === area; },
      false, 'half-area', 'The base is not the area. Start from 1/2 ' + TIMES + ' ' + height + ' ' + TIMES + ' base = ' + area + '.', null
    ));
    const cards2 = chooseCards(rng, sol, eq2, pool2);
    if (!cards2 || !cards2.some((c) => c.trap === 'half-area')) continue;

    const askHyp = rng() < 0.6;
    const measure = askHyp
      ? { label: 'PQ', value: hyp, unit: 'cm' }
      : { label: 'QR', value: base, unit: 'cm' };
    const measureAt = askHyp ? function (s) { return ev(ePQ, s); } : function (s) { return ev(eQR, s); };
    const forgotBase = height ? (2 * area) / height : base;
    const traps = askHyp
      ? [
        { value: height, tip: 'PR is the given height, ' + height + ' cm. PQ is the hypotenuse.' },
        { value: base, tip: 'That is base QR, not hypotenuse PQ.' }
      ]
      : [
        { value: area / height, trap: 'half-area', tip: halfAreaTip('tri', height, fmtExpr(eQR, v1, v2), area) + ' So base = 2 ' + TIMES + ' Area / height = ' + forgotBase + ' cm.' },
        { value: hyp, tip: 'That is the hypotenuse, not base QR.' }
      ];
    if (!askHyp && !Number.isInteger(area / height)) traps.shift();
    const cards3 = buildValueStep(rng, vars, sol, measure, measureAt, traps);
    if (!cards3) continue;

    const size = plotSize();
    const left = placeRight({ x: 10, y: 10, w: size.w * 0.44, h: size.h - 18 }, base, height);
    const rightLegs = base > height ? [12, 8] : [8, 14];
    const right = placeRight({ x: size.w * 0.54, y: 18, w: size.w * 0.42, h: size.h - 30 }, rightLegs[0], rightLegs[1]);
    const figure = {
      verts: [
        V('P', left.P), V('R', left.R), V('Q', left.Q),
        V('S', right.P), V('U', right.R), V('T', right.Q)
      ],
      edges: [
        edge('P', 'R', { label: String(height), value: height, known: true, role: 'eq2' }),
        edge('R', 'Q', { label: fmtExpr(eQR, v1, v2), value: base, role: 'eq2' }),
        edge('P', 'Q', { label: fmtExpr(ePQ, v1, v2), value: hyp, tick: 1, role: 'eq1' }),
        edge('S', 'U', { label: '', value: 0, silent: true, role: '' }),
        edge('U', 'T', { label: '', value: 0, silent: true, role: '' }),
        edge('S', 'T', { label: fmtExpr(eST, v1, v2), value: hyp, tick: 1, role: 'eq1' })
      ],
      dashes: [],
      angles: [
        { at: 'R', a: 'P', b: 'Q' },
        { at: 'U', a: 'S', b: 'T' }
      ],
      fills: [{ ids: ['P', 'R', 'Q'], role: 'eq2' }]
    };
    return publish({
      arch: 'paired',
      name: 'PAIRED RIGHT \u0394s',
      vars: vars,
      sol: sol,
      std: [std1, std2],
      givens: 'Right-angled at R and U.  PR = ' + height + ' cm.  Area of \u0394PQR = ' + area + ' cm\u00b2.  PQ = ST.',
      prompts: [
        'STEP 1 \u00b7 The hypotenuses match. Lock PQ = ST.',
        'STEP 2 \u00b7 Write the area of \u0394PQR. Keep the 1/2.',
        'STEP 3 \u00b7 Solve (p, q) and find ' + measure.label + '.'
      ],
      steps: [{ cards: cards1 }, { cards: cards2 }, { cards: cards3 }],
      figure: figure,
      measure: measure,
      measureAt: measureAt,
      facts: {
        check: function (s) {
          return ev(eQR, s) === base && ev(ePQ, s) === hyp && ev(eST, s) === hyp &&
            height * height + base * base === hyp * hyp &&
            height * base === 2 * area;
        }
      }
    });
  }
  return null;
}

function genRhombus(rng) {
  const vars = ['x', 'y'];
  for (let attempt = 0; attempt < 90; attempt++) {
    const tri = pickTriple(rng, function (t) {
      return t[0] >= 4 && t[0] <= 12 && t[1] >= 4 && t[1] <= 14 && t[2] <= 22;
    });
    if (!tri) return null;
    const u = tri[0];
    const v = tri[1];
    const side = tri[2];
    if (u * u + v * v !== side * side) continue;
    const d1 = 2 * u;
    const d2 = 2 * v;
    const area = d1 * d2 / 2;
    if (area !== Math.floor(area)) continue;
    const sol = pickSol(rng, 2, 8);
    const e1 = makeExpr(rng, sol, side, [], attempt < 40);
    const e2 = makeExpr(rng, sol, side, e1 ? [e1] : [], attempt < 25);
    const eD = makeExpr(rng, sol, d2, [e1, e2].filter(Boolean), attempt < 30);
    if (!e1 || !e2 || !eD) continue;
    const std1 = stdDiff(e1, e2);
    const std2 = stdScale(eD, d1, 2 * area);
    if (!validSystem(std1, std2, sol)) continue;
    const v1 = vars[0];
    const v2 = vars[1];
    const eq1 = makeEqCard(
      fmtExpr(e1, v1, v2) + ' = ' + fmtExpr(e2, v1, v2),
      function (s) { return ev(e1, s) === ev(e2, s); },
      true, '', '', std1
    );
    const pool1 = [];
    const flip = flipExpr(e2, e2.a ? 'a' : 'b');
    if (flip) {
      pool1.push(makeEqCard(
        fmtExpr(e1, v1, v2) + ' = ' + fmtExpr(flip, v1, v2),
        function (s) { return ev(e1, s) === ev(flip, s); },
        false, 'sign', 'Every side of a rhombus is equal. Keep the signs on both labels.', null
      ));
    }
    pool1.push(makeEqCard(
      fmtExpr(e1, v1, v2) + ' = ' + d1,
      function (s) { return ev(e1, s) === d1; },
      false, '', 'That number is a diagonal, not a side. Equate the two ticked sides.', null
    ));
    pool1.push(makeEqCard(
      '{1|2} ' + TIMES + ' ' + d1 + ' ' + TIMES + ' ' + fmtAtom(eD, v1, v2) + ' = ' + area,
      function (s) { return d1 * ev(eD, s) === 2 * area; },
      false, '', 'The diagonal formula is Equation 2. Equation 1 is the equal-side pair.', null
    ));
    pool1.push(makeEqCard(
      fmtExpr(e1, v1, v2) + ' = ' + fmtExpr(eD, v1, v2),
      function (s) { return ev(e1, s) === ev(eD, s); },
      false, 'wrong-pair', 'A diagonal is not a side. Match the two ticked edges.', null
    ));
    const cards1 = chooseCards(rng, sol, eq1, pool1);
    if (!cards1) continue;
    const eq2 = makeEqCard(
      '{1|2} ' + TIMES + ' ' + d1 + ' ' + TIMES + ' ' + fmtAtom(eD, v1, v2) + ' = ' + area,
      function (s) { return d1 * ev(eD, s) === 2 * area; },
      true, '', '', std2
    );
    const pool2 = [
      makeEqCard(
        d1 + ' ' + TIMES + ' ' + fmtAtom(eD, v1, v2) + ' = ' + area,
        function (s) { return d1 * ev(eD, s) === area; },
        false, 'half-area', halfAreaTip('rhomb', d1, fmtExpr(eD, v1, v2), area), null
      ),
      makeEqCard(
        '{1|2} ' + TIMES + ' ' + d1 + ' ' + TIMES + ' ' + fmtAtom(e1, v1, v2) + ' = ' + area,
        function (s) { return d1 * ev(e1, s) === 2 * area; },
        false, '', 'Use the two diagonals in the area formula, not a side.', null
      ),
      makeEqCard(
        '{1|2} ' + TIMES + ' ' + fmtAtom(eD, v1, v2) + ' = ' + area,
        function (s) { return ev(eD, s) === 2 * area; },
        false, 'half-area', 'Both diagonals belong in the formula: 1/2 ' + TIMES + ' ' + d1 + ' ' + TIMES + ' d2 = ' + area + '.', null
      ),
      makeEqCard(
        fmtExpr(e1, v1, v2) + ' = ' + fmtExpr(e2, v1, v2),
        function (s) { return ev(e1, s) === ev(e2, s); },
        false, '', 'The equal sides are Equation 1. Equation 2 is the diagonal area.', null
      )
    ];
    const cards2 = chooseCards(rng, sol, eq2, pool2);
    if (!cards2 || !cards2.some((c) => c.trap === 'half-area')) continue;
    const askPeri = rng() < 0.5;
    const measure = askPeri
      ? { label: 'Perimeter', value: 4 * side, unit: 'cm' }
      : { label: 'Side', value: side, unit: 'cm' };
    const measureAt = askPeri ? function (s) { return 4 * ev(e1, s); } : function (s) { return ev(e1, s); };
    const traps = askPeri
      ? [
        { value: 2 * side, trap: 'two-sides', tip: 'A rhombus has four equal sides. Perimeter = 4 ' + TIMES + ' side, not 2 ' + TIMES + ' side.' },
        { value: area, tip: 'That is the area. The perimeter walks all four sides.' },
        { value: d1, tip: 'That is a full diagonal, not the perimeter.' }
      ]
      : [
        { value: d1, tip: 'That is diagonal ' + d1 + ' cm. The side is shorter than the longer half-diagonal span.' },
        { value: d2, tip: 'That is the other diagonal. Substitute into a side label.' },
        { value: 4 * side, tip: 'That is the whole perimeter. The question asks for one side.' }
      ];
    const cards3 = buildValueStep(rng, vars, sol, measure, measureAt, traps);
    if (!cards3) continue;
    const size = plotSize();
    const sc = Math.min((size.w - 36) / d2, (size.h - 28) / d1);
    const hw = d2 * sc / 2;
    const hh = d1 * sc / 2;
    const cx = size.w / 2;
    const cy = size.h / 2 + 2;
    const top = pxToNorm(cx, cy - hh);
    const right = pxToNorm(cx + hw, cy);
    const bot = pxToNorm(cx, cy + hh);
    const left = pxToNorm(cx - hw, cy);
    const figure = {
      verts: [V('A', top), V('B', right), V('C', bot), V('D', left), V('O', pxToNorm(cx, cy))],
      edges: [
        edge('A', 'B', { label: fmtExpr(e1, v1, v2), value: side, tick: 1, role: 'eq1' }),
        edge('B', 'C', { label: fmtExpr(e2, v1, v2), value: side, tick: 1, role: 'eq1' }),
        edge('C', 'D', { label: '', value: side, tick: 1, role: 'eq1', silent: true, reveal: true }),
        edge('D', 'A', { label: '', value: side, tick: 1, role: 'eq1', silent: true, reveal: true })
      ],
      dashes: [
        edge('A', 'C', { label: String(d1), value: d1, known: true, role: 'eq2' }),
        edge('B', 'D', { label: fmtExpr(eD, v1, v2), value: d2, role: 'eq2' })
      ],
      angles: [{ at: 'O', a: 'A', b: 'B' }],
      fills: [{ ids: ['A', 'B', 'C', 'D'], role: 'eq2' }]
    };
    return publish({
      arch: 'rhombus',
      name: 'RHOMBUS ABCD',
      vars: vars,
      sol: sol,
      std: [std1, std2],
      givens: 'All sides equal. Diagonals cross at right angles. Area = ' + area + ' cm\u00b2.',
      prompts: [
        'STEP 1 \u00b7 All sides of a rhombus match. Lock the side equation.',
        'STEP 2 \u00b7 Use 1/2 ' + TIMES + ' d1 ' + TIMES + ' d2 for the area. Keep the 1/2.',
        'STEP 3 \u00b7 Solve (x, y) and find the ' + measure.label.toLowerCase() + '.'
      ],
      steps: [{ cards: cards1 }, { cards: cards2 }, { cards: cards3 }],
      figure: figure,
      measure: measure,
      measureAt: measureAt,
      facts: {
        check: function (s) {
          return ev(e1, s) === side && ev(e2, s) === side && ev(eD, s) === d2 &&
            u * u + v * v === side * side && d1 * d2 === 2 * area;
        }
      }
    });
  }
  return null;
}

function genTrapez(rng) {
  const vars = ['x', 'y'];
  for (let attempt = 0; attempt < 100; attempt++) {
    const tri = pickTriple(rng, function (t) {
      return t[0] >= 5 && t[0] <= 14 && t[1] >= 5 && t[1] <= 16 && t[2] <= 24;
    });
    if (!tri) return null;
    const O = tri[0];
    const Hh = tri[1];
    const S = tri[2];
    if (O * O + Hh * Hh !== S * S) continue;
    if ((O * Hh) % 2 !== 0) continue;
    const T = randInt(rng, 6, 16);
    const B = T + O;
    const area = (T + B) * Hh / 2;
    if (area !== Math.floor(area) || area > 520) continue;
    const sol = pickSol(rng, 2, 8);
    const eTop = makeExpr(rng, sol, T, [], attempt < 40);
    const eOver = makeExpr(rng, sol, O, eTop ? [eTop] : [], false);
    const eBot = makeExpr(rng, sol, B, [eTop, eOver].filter(Boolean), attempt < 30);
    const eSlant = makeExpr(rng, sol, S, [eTop, eOver, eBot].filter(Boolean), false);
    if (!eTop || !eOver || !eBot || !eSlant) continue;
    const rhs = addE(eTop, eOver);
    if (sameE(rhs, eBot)) continue;
    const std1 = stdDiff(eBot, rhs);
    const std2 = stdScale(addE(eTop, eBot), Hh, 2 * area);
    if (!validSystem(std1, std2, sol)) continue;
    const v1 = vars[0];
    const v2 = vars[1];
    const eq1 = makeEqCard(
      fmtExpr(eBot, v1, v2) + ' = ' + fmtExpr(rhs, v1, v2),
      function (s) { return ev(eBot, s) === ev(eTop, s) + ev(eOver, s); },
      true, '', '', std1
    );
    const pool1 = [];
    pool1.push(makeEqCard(
      fmtExpr(eBot, v1, v2) + ' = ' + fmtExpr(eTop, v1, v2),
      function (s) { return ev(eBot, s) === ev(eTop, s); },
      false, '', 'The bottom is longer than the top by the overhang. Include that segment.', null
    ));
    pool1.push(makeEqCard(
      fmtExpr(eBot, v1, v2) + ' = ' + fmtExpr(eOver, v1, v2),
      function (s) { return ev(eBot, s) === ev(eOver, s); },
      false, '', 'The overhang is only the extra piece, not the whole bottom.', null
    ));
    const flip = flipExpr(eOver, eOver.a ? 'a' : 'b');
    if (flip) {
      const bad = addE(eTop, flip);
      pool1.push(makeEqCard(
        fmtExpr(eBot, v1, v2) + ' = ' + fmtExpr(bad, v1, v2),
        function (s) { return ev(eBot, s) === ev(bad, s); },
        false, 'sign', 'Bottom = top + overhang. Keep the sign on the overhang label.', null
      ));
    }
    pool1.push(makeEqCard(
      fmtExpr(eSlant, v1, v2) + ' = ' + Hh,
      function (s) { return ev(eSlant, s) === Hh; },
      false, '', 'The vertical side is the height ' + Hh + ' cm. It is not equal to the slant.', null
    ));
    const cards1 = chooseCards(rng, sol, eq1, pool1);
    if (!cards1 || !cards1.some((c) => c.trap === 'sign')) continue;

    const topA = fmtAtom(eTop, v1, v2);
    const botA = fmtAtom(eBot, v1, v2);
    const eq2 = makeEqCard(
      '{1|2} ' + TIMES + ' [' + topA + ' + ' + botA + '] ' + TIMES + ' ' + Hh + ' = ' + area,
      function (s) { return Hh * (ev(eTop, s) + ev(eBot, s)) === 2 * area; },
      true, '', '', std2
    );
    const pool2 = [
      makeEqCard(
        '[' + topA + ' + ' + botA + '] ' + TIMES + ' ' + Hh + ' = ' + area,
        function (s) { return Hh * (ev(eTop, s) + ev(eBot, s)) === area; },
        false, 'half-area', halfAreaTip('trap'), null
      ),
      makeEqCard(
        '{1|2} ' + TIMES + ' ' + topA + ' ' + TIMES + ' ' + Hh + ' = ' + area,
        function (s) { return Hh * ev(eTop, s) === 2 * area; },
        false, '', 'A trapezium needs both parallel sides: 1/2 ' + TIMES + ' (top + bottom) ' + TIMES + ' height.', null
      ),
      makeEqCard(
        '{1|2} ' + TIMES + ' ' + botA + ' ' + TIMES + ' ' + Hh + ' = ' + area,
        function (s) { return Hh * ev(eBot, s) === 2 * area; },
        false, '', 'Do not use only the longer base. Add the two parallel sides first.', null
      ),
      makeEqCard(
        '{1|2} ' + TIMES + ' [' + topA + ' + ' + botA + '] ' + TIMES + ' ' + fmtAtom(eSlant, v1, v2) + ' = ' + area,
        function (s) { return ev(eSlant, s) * (ev(eTop, s) + ev(eBot, s)) === 2 * area; },
        false, '', 'The height is the perpendicular side, ' + Hh + ' cm, not the slant.', null
      )
    ];
    const cards2 = chooseCards(rng, sol, eq2, pool2);
    if (!cards2 || !cards2.some((c) => c.trap === 'half-area')) continue;

    const peri = T + B + Hh + S;
    const measure = { label: 'Perimeter', value: peri, unit: 'cm' };
    const measureAt = function (s) { return ev(eTop, s) + ev(eBot, s) + Hh + ev(eSlant, s); };
    const traps = [
      { value: T + B + Hh, trap: 'two-sides', tip: 'The perimeter walks the whole outline, including the slanted side ' + fmtExpr(eSlant, v1, v2) + '.' },
      { value: area, tip: 'That is the area in cm\u00b2. Add the four outer edges for the perimeter.' },
      { value: T + B + S, tip: 'The vertical height ' + Hh + ' cm is an outer edge too.' }
    ];
    const cards3 = buildValueStep(rng, vars, sol, measure, measureAt, traps);
    if (!cards3) continue;

    const size = plotSize();
    const sc = Math.min((size.w - 36) / B, (size.h - 28) / Hh);
    const bw = B * sc;
    const tw = T * sc;
    const bh = Hh * sc;
    const left = (size.w - bw) / 2;
    const top = (size.h - bh) / 2 + 4;
    const A = pxToNorm(left, top);
    const Bp = pxToNorm(left + tw, top);
    const G = pxToNorm(left + tw, top + bh);
    const C = pxToNorm(left + bw, top + bh);
    const D = pxToNorm(left, top + bh);
    const figure = {
      verts: [V('A', A), V('B', Bp), V('C', C), V('D', D), V('G', G)],
      edges: [
        edge('A', 'B', { label: fmtExpr(eTop, v1, v2), value: T, role: 'eq2' }),
        edge('D', 'C', { label: fmtExpr(eBot, v1, v2), value: B, role: 'both', t: 0.32 }),
        edge('A', 'D', { label: String(Hh), value: Hh, known: true, role: 'eq2' }),
        edge('B', 'C', { label: fmtExpr(eSlant, v1, v2), value: S, role: '' })
      ],
      dashes: [
        edge('B', 'G', { label: '', value: Hh, silent: true, role: '' })
      ],
      ghosts: [
        edge('G', 'C', { label: fmtExpr(eOver, v1, v2), value: O, role: 'eq1', nudge: { x: 0, y: 4 } })
      ],
      angles: [
        { at: 'A', a: 'B', b: 'D' },
        { at: 'D', a: 'A', b: 'C' },
        { at: 'G', a: 'D', b: 'B' }
      ],
      fills: [{ ids: ['A', 'B', 'C', 'D'], role: 'eq2' }]
    };
    return publish({
      arch: 'trapez',
      name: 'RIGHT TRAPEZIUM ABCD',
      vars: vars,
      sol: sol,
      std: [std1, std2],
      givens: 'AB \u2225 DC,  \u2220A = \u2220D = 90\u00b0.  The overhang is the extra base beyond G.  Area = ' + area + ' cm\u00b2.',
      prompts: [
        'STEP 1 \u00b7 Bottom = top + overhang. Lock that equation.',
        'STEP 2 \u00b7 Write the trapezium area. Keep the 1/2.',
        'STEP 3 \u00b7 Solve (x, y), substitute every edge, and find the perimeter.'
      ],
      steps: [{ cards: cards1 }, { cards: cards2 }, { cards: cards3 }],
      figure: figure,
      measure: measure,
      measureAt: measureAt,
      facts: {
        check: function (s) {
          return ev(eTop, s) === T && ev(eBot, s) === B && ev(eOver, s) === O && ev(eSlant, s) === S &&
            B === T + O && O * O + Hh * Hh === S * S &&
            (T + B) * Hh === 2 * area && measure.value === T + B + Hh + S;
        }
      }
    });
  }
  return null;
}

function genHouse(rng) {
  const vars = ['x', 'y'];
  for (let attempt = 0; attempt < 100; attempt++) {
    const tri = pickTriple(rng, function (t) {
      const even = t[0] % 2 === 0 ? t[0] : (t[1] % 2 === 0 ? t[1] : 0);
      const other = even === t[0] ? t[1] : t[0];
      return even >= 4 && even <= 14 && other >= 3 && other <= 12 && t[2] <= 20;
    });
    if (!tri) return null;
    let Ht;
    let u;
    if (tri[1] % 2 === 0 && (tri[0] % 2 !== 0 || rng() < 0.5)) {
      Ht = tri[1];
      u = tri[0];
    } else if (tri[0] % 2 === 0) {
      Ht = tri[0];
      u = tri[1];
    } else continue;
    const S = tri[2];
    if (u * u + Ht * Ht !== S * S) continue;
    if (Ht % 2 !== 0) continue;
    const Wd = 2 * u;
    const Hr = randInt(rng, 5, 12);
    const K = Hr + Ht / 2;
    const area = Wd * K;
    if (area > 640) continue;
    const sol = pickSol(rng, 2, 8);
    const eW = makeExpr(rng, sol, Wd, [], attempt < 40);
    const eS1 = makeExpr(rng, sol, S, eW ? [eW] : [], attempt < 35);
    const eS2 = makeExpr(rng, sol, S, [eW, eS1].filter(Boolean), attempt < 20);
    if (!eW || !eS1 || !eS2) continue;
    const std1 = stdDiff(eS1, eS2);
    const std2 = stdScale(eW, K, area);
    if (!validSystem(std1, std2, sol)) continue;
    const v1 = vars[0];
    const v2 = vars[1];
    const eq1 = makeEqCard(
      fmtExpr(eS1, v1, v2) + ' = ' + fmtExpr(eS2, v1, v2),
      function (s) { return ev(eS1, s) === ev(eS2, s); },
      true, '', '', std1
    );
    const pool1 = [];
    const flip = flipExpr(eS2, eS2.a ? 'a' : 'b');
    if (flip) {
      pool1.push(makeEqCard(
        fmtExpr(eS1, v1, v2) + ' = ' + fmtExpr(flip, v1, v2),
        function (s) { return ev(eS1, s) === ev(flip, s); },
        false, 'sign', 'The roof ticks say the slanted edges are equal. Keep both signs.', null
      ));
    }
    pool1.push(makeEqCard(
      fmtExpr(eS1, v1, v2) + ' = ' + fmtExpr(eW, v1, v2),
      function (s) { return ev(eS1, s) === ev(eW, s); },
      false, 'wrong-pair', 'The width is the rectangle base, not a roof edge. Match the two ticked slants.', null
    ));
    pool1.push(makeEqCard(
      fmtExpr(eW, v1, v2) + ' = ' + Hr,
      function (s) { return ev(eW, s) === Hr; },
      false, '', Hr + ' cm is the wall height, not the width.', null
    ));
    const wAtom = fmtAtom(eW, v1, v2);
    pool1.push(makeEqCard(
      wAtom + ' ' + TIMES + ' ' + Hr + ' + {1|2} ' + TIMES + ' ' + wAtom + ' ' + TIMES + ' ' + Ht + ' = ' + area,
      function (s) { return ev(eW, s) * K === area; },
      false, '', 'That composite area is Equation 2. Step 1 is the isosceles roof.', null
    ));
    const cards1 = chooseCards(rng, sol, eq1, pool1);
    if (!cards1) continue;
    const eq2 = makeEqCard(
      wAtom + ' ' + TIMES + ' ' + Hr + ' + {1|2} ' + TIMES + ' ' + wAtom + ' ' + TIMES + ' ' + Ht + ' = ' + area,
      function (s) { return 2 * ev(eW, s) * Hr + ev(eW, s) * Ht === 2 * area; },
      true, '', '', std2
    );
    const pool2 = [
      makeEqCard(
        wAtom + ' ' + TIMES + ' ' + Hr + ' + ' + wAtom + ' ' + TIMES + ' ' + Ht + ' = ' + area,
        function (s) { return ev(eW, s) * (Hr + Ht) === area; },
        false, 'half-area', halfAreaTip('house'), null
      ),
      makeEqCard(
        wAtom + ' ' + TIMES + ' ' + Hr + ' = ' + area,
        function (s) { return ev(eW, s) * Hr === area; },

function audit(p) {

  if (p.measureAt(p.sol) !== p.measure.value) return 'measure';
  if (!Number.isInteger(p.measure.value) || p.measure.value <= 0) return 'measure-int';
  if (!Number.isInteger(p.sol.x) || !Number.isInteger(p.sol.y)) return 'sol';
  for (let i = 0; i < 3; i++) {
    const cards = p.steps[i].cards;
    if (!cards || cards.length !== 4) return 'cards-' + i;
    const good = cards.filter((c) => c.correct);
    if (good.length !== 1) return 'count-' + i;
    if (!good[0].ok(p.sol)) return 'ok-' + i;
    const seen = {};
    for (let k = 0; k < cards.length; k++) {
      const c = cards[k];
      if (seen[c.plain]) return 'dup-' + i;
      seen[c.plain] = true;
      if (!c.correct && c.ok(p.sol)) return 'leak-' + i;
      if (!c.correct && !c.tip) return 'tip-' + i;
      if (!c.tokens || !c.tokens.length) return 'tokens-' + i;
    }
    if (i < 2) {
      if (!proportional(good[0].std, p.std[i])) return 'prop-' + i;
    } else if (!good[0].claim || good[0].claim.x !== p.sol.x || good[0].claim.y !== p.sol.y || good[0].claim.value !== p.measure.value) {
      return 'claim';
    }
  }
  if (p.arch === 'iso') {
    if (!p.steps[1].cards.some((c) => c.trap === 'sign')) return 'need-sign';
    if (!p.steps[1].cards.some((c) => c.trap === 'two-sides')) return 'need-two';
  }
  if (p.arch === 'alt' && !p.steps[2].cards.some((c) => c.trap === 'half-base')) return 'need-half-base';
  if ((p.arch === 'paired' || p.arch === 'rhombus' || p.arch === 'trapez' || p.arch === 'house') &&
      !p.steps[1].cards.some((c) => c.trap === 'half-area')) return 'need-half-area';
  if (p.arch === 'trapez' && !p.steps[0].cards.some((c) => c.trap === 'sign')) return 'need-sign-trap';

    if (v.x < -1 || v.x > 101 || v.y < -1 || v.y > 101) return 'vert-range';
    ids[v.id] = true;
  }
  const items = fig.edges.concat(fig.dashes || [], fig.ghosts || []);
  for (let i = 0; i < items.length; i++) {
    if (!ids[items[i].from] || !ids[items[i].to]) return 'edge-id';
  }
  return '';
}

function generateProblem(round, history, rng) {
  const random = rng || Math.random;
  const tier = tierOf(round);
  const recent = {};
  (history || []).forEach((h) => { recent[h.key] = true; });
  const last = history && history.length ? history[history.length - 1].arch : '';
  let pool = tier.arches.slice();
  if (last && pool.length > 1) {
    const filtered = pool.filter((a) => a !== last);
    if (filtered.length) pool = filtered;
  }
  for (let pass = 0; pass < 2; pass++) {
    const arches = pass === 0 ? pool : tier.arches;
    const tries = pass === 0 ? 36 : 24;
    for (let i = 0; i < tries; i++) {
      const arch = arches[Math.floor(random() * arches.length)];
      const problem = GENS[arch](random);
      if (!problem) continue;
      if (pass === 0 && recent[problem.key]) continue;
      if (audit(problem) !== '') continue;
      problem.tier = tier.name;
      return problem;
    }
  }

}

const CHORDS = [
  [62, 65, 69],
  [58, 62, 65],
  [65, 69, 72],
  [60, 64, 67]

const BASS = [38, 34, 41, 36];
function playMusicStep(index, time) {
  const bar = Math.floor(index / 16) % 4;
  const chord = CHORDS[bar];
  const step = index % 16;
  if (step % 8 === 0) blip(time, midi(BASS[bar]), 0.2, 'triangle', 0.08, audio.music);
  if (step % 2 === 0) {
    const order = [0, 2, 1, 2];
    const tone = chord[order[(step / 2) % order.length]];
    blip(time, midi(tone + 12), 0.11, 'square', 0.028, audio.music);
  }
  if (step === 0 || step === 8) blip(time, 90, 0.07, 'sine', 0.05, audio.music, 46);
  if (step === 4 || step === 12) noiseHit(time, 0.08, 0.025, 1800);
  if (step % 2 === 1) noiseHit(time, 0.03, 0.012, 4200);
  if (step === 14) blip(time, midi(chord[2] + 24), 0.08, 'triangle', 0.02, audio.music);
}
function tickMusic() {
  if (!audio.started || !audio.ctx || audio.muted || game.paused) return;
  const stepDur = (60 / 104) / 4;
  let guard = 0;
  while (audio.next < audio.ctx.currentTime + 0.12 && guard < 8) {
    playMusicStep(audio.step, audio.next);
    audio.step = (audio.step + 1) % 64;
    audio.next += stepDur;
    guard++;

function finishRound() {

    return;
  }
  game.round += 1;
  game.step = 0;
  game.phase = 'play';
  game.sel = [0, 0];
  game.tip = '';
  game.tipT = 0;

  game.problem = problem;
}

function pollPads() {
  const out = [null, null];
  const list = (navigator.getGamepads && navigator.getGamepads()) || [];

  for (let i = 0; i < list.length && found.length < 2; i++) if (list[i]) found.push(list[i]);

    const gp = found[p];
    const mem = padMem[p];
    if (!gp) {
      game.padOn[p] = false;
      mem.buttons = [];
      mem.dx = 0;
      mem.dy = 0;
      continue;
    }
    game.padOn[p] = true;
    const b = [];
    for (let i = 0; i < gp.buttons.length; i++) b[i] = !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.45));
    const ax = gp.axes && gp.axes.length ? gp.axes[0] : 0;
    const ay = gp.axes && gp.axes.length > 1 ? gp.axes[1] : 0;
    const dx = (b[14] || ax < -0.55) ? -1 : (b[15] || ax > 0.55) ? 1 : 0;
    const dy = (b[12] || ay < -0.55) ? -1 : (b[13] || ay > 0.55) ? 1 : 0;
    out[p] = {
      dx: dx !== 0 && mem.dx === 0 ? dx : 0,
      dy: dy !== 0 && mem.dy === 0 ? dy : 0,
      fire: b[0] && !mem.buttons[0],

    mem.dy = dy;

}
function pollInput() {

    toggleMute();

  if ((pads[0] && pads[0].start) || (pads[1] && pads[1].start)) {

    if (pressed(['ArrowRight', 'KeyD']) || (pads[0] && pads[0].dx > 0)) game.titleSel = (game.titleSel + 1) % 3;
    if (keyEdge.has('Digit1')) startMode('solo');
    else if (keyEdge.has('Digit2')) startMode('coop');
    else if (keyEdge.has('Digit3')) startMode('versus');
    else if (pressed(['Enter', 'Space']) || (pads[0] && pads[0].fire)) startMode(['solo', 'coop', 'versus'][game.titleSel]);

      const cards = titleGeom();
      for (let i = 0; i < cards.length; i++) {
        if (hit(game.mouseX, game.mouseY, cards[i])) startMode(cards[i].id);
      }
    }
    return;
  }
  if (game.screen === 'over') {
    const again = overGeom().again;
    const title = overGeom().title;
    if (pointerEdge && hit(game.mouseX, game.mouseY, title)) { game.screen = 'title'; return; }
    if (pointerEdge && hit(game.mouseX, game.mouseY, again)) { startMode(game.mode); return; }
    if (pressed(['Enter', 'Space']) || (pads[0] && pads[0].fire)) startMode(game.mode);
    if (keyEdge.has('Escape')) game.screen = 'title';

  }
  if (keyEdge.has('KeyP') || keyEdge.has('Escape')) {
    if (game.screen === 'play') game.paused = !game.paused;

    if (pointerEdge && hit(game.mouseX, game.mouseY, { x: 490, y: 390, w: 300, h: 52 })) game.paused = false;
    return;

    return;

  for (let p = 0; p < maps.length; p++) {
    const map = maps[p];

    if (pressed(map.left) || (pad && pad.dx < 0)) moveSel(p, -1);
    if (pressed(map.right) || (pad && pad.dx > 0)) moveSel(p, 1);
    if (pressed(map.up) || (pad && pad.dy < 0)) moveSel(p, -1);
    if (pressed(map.down) || (pad && pad.dy > 0)) moveSel(p, 1);
    if (pressed(map.fire) || (pad && pad.fire)) actors.push(p);

  if (actors.length === 2 && Math.random() < 0.5) actors.reverse();

    const deck = deckGeom();
    const who = hoverPlayer();
    if (hit(game.mouseX, game.mouseY, deck.lock)) confirm(who);
    else {
      for (let i = 0; i < deck.cards.length; i++) {

function advance(dt) {
  game.time += dt;
  /* Diagnostics stay until the next correct lock. */
  if (game.lock > 0) game.lock = Math.max(0, game.lock - dt);
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 26);
  if (game.flash > 0) game.flash = Math.max(0, game.flash - dt);
  if (game.phase === 'celebrate') {
    game.celebrateT -= dt;
    if (game.celebrateT <= 0) finishRound();
  }
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
  for (let i = game.floats.length - 1; i >= 0; i--) {
    const f = game.floats[i];
    f.life -= dt;
    f.y -= 28 * dt;
    if (f.life <= 0) game.floats.splice(i, 1);
  }
}

function drawBackground() {

  ctx.fillRect(0, 0, W, H);
  const drift = (game.time * 10) % 40;
  ctx.lineWidth = 1;
  for (let x = -40; x < W + 40; x += 40) {
    ctx.strokeStyle = (Math.round(x / 40) % 4 === 0) ? 'rgba(62,224,255,0.07)' : 'rgba(62,224,255,0.035)';
    ctx.beginPath();

    ctx.lineTo(x + drift, H);

function componentCentroid(fig, item) {

    adj[e.from].push(e.to);
    adj[e.to].push(e.from);

        stack.push(n);

  let y = 0;
  keys.forEach((id) => {

    y += v.y;

function outward(ax, ay, bx, by, cx, cy) {

  const dy = by - ay;
  const len = Math.hypot(dx, dy) || 1;
  let nx = -dy / len;
  let ny = dx / len;

}

function drawSegment(fig, item, dashed) {

  const b = n2s(vertById(fig, item.to));

  const col = glowColor(g);

function drawCaliper(fig) {

  });

  const item = segs[Math.floor(game.time * 0.35) % segs.length];

  const b = n2s(vertById(fig, item.to));

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(game.fatal).slice(0, 220), 12, 28);
}

function draw() {
  const dpr = canvas.width / Math.max(1, window.innerWidth);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  layoutView();
  ctx.save();
  ctx.translate(game.view.ox, game.view.oy);
  ctx.scale(game.view.s, game.view.s);
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  if (game.shake > 0) ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  drawBackground();
  if (game.screen === 'title') drawTitle();
  else {
    drawHUD();
    drawSpec();
    drawFigure();
    drawBus();
    drawDeck();
    drawFloats();
    if (game.flash > 0) {
      ctx.fillStyle = 'rgba(255, 50, 80, ' + (game.flash * 0.22) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (game.screen === 'play' && !game.paused && game.phase === 'play') drawReticles();
    if (game.screen === 'over') drawOver();
    if (game.paused) drawPause();
  }
  ctx.restore();
  const overUi = game.screen !== 'play' || game.paused || hit(game.mouseX, game.mouseY, GEO.mute);
  canvas.style.cursor = game.screen === 'play' && !game.paused && game.pointerDevice === 'mouse' && !overUi ? 'none' : 'default';
}
function update(dt) {
  layoutView();
  pollInput();
  if (game.screen === 'play' && !game.paused) advance(dt);
  else game.time += dt;
  tickMusic();
}

let lastTs = 0;
function frame(now) {
  const dt = Math.min(0.05, lastTs ? (now - lastTs) / 1000 : 0.016);
  lastTs = now;
  try {
    update(dt);
    draw();
    game.fatal = '';
  } catch (err) {
    game.fatal = err && err.stack ? err.stack : String(err);
    if (typeof console !== 'undefined') console.error(err);
    try { drawFatal(); } catch (e2) { /* ignore */ }
  }
  keyEdge.clear();
  pointerEdge = false;
  requestAnimationFrame(frame);
}

function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d', { alpha: false });
  try {
    const saved = localStorage.getItem('geo-lock-surveyor-best');
    if (saved) game.best = JSON.parse(saved) || {};
  } catch (err) { game.best = {}; }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', function (e) {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].indexOf(e.code) >= 0) e.preventDefault();
    if (e.repeat) return;
    keysDown.add(e.code);
    keyEdge.add(e.code);
    game.pointerDevice = 'key';
    resumeAudio();
  });
  window.addEventListener('keyup', function (e) { keysDown.delete(e.code); });
  canvas.addEventListener('mousemove', function (e) {
    const p = worldFromClient(e.clientX, e.clientY);
    game.mouseX = p.x;
    game.mouseY = p.y;
    game.mouseIn = true;
    game.pointerDevice = 'mouse';
    if (game.screen === 'title') {
      titleGeom().forEach((card, i) => { if (hit(p.x, p.y, card)) game.titleSel = i; });
    }
    if (game.screen === 'play' && game.phase === 'play') {
      const deck = deckGeom();
      const who = hoverPlayer();
      game.hoverLock = hit(p.x, p.y, deck.lock);
      for (let i = 0; i < deck.cards.length; i++) {
        if (hit(p.x, p.y, deck.cards[i])) game.sel[who] = i;
      }
    }
  });
  canvas.addEventListener('mouseleave', function () { game.mouseIn = false; });
  canvas.addEventListener('mousedown', function (e) {
    const p = worldFromClient(e.clientX, e.clientY);
    game.mouseX = p.x;
    game.mouseY = p.y;
    pointerEdge = true;
    pointerDown = true;
    game.pointerDevice = 'mouse';
    resumeAudio();
  });
  window.addEventListener('mouseup', function () { pointerDown = false; });
  canvas.addEventListener('touchstart', function (e) {
    const t = e.changedTouches[0];
    const p = worldFromClient(t.clientX, t.clientY);
    game.mouseX = p.x;
    game.mouseY = p.y;
    game.pointerDevice = 'mouse';
    pointerEdge = true;
    resumeAudio();
    e.preventDefault();
  }, { passive: false });
  requestAnimationFrame(frame);
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}
function inside(inner, outer) {
  return inner.x >= outer.x - 0.1 && inner.y >= outer.y - 0.1 &&
    inner.x + inner.w <= outer.x + outer.w + 0.1 && inner.y + inner.h <= outer.y + outer.h + 0.1;
}
function mulberry32(a) {
  return function () {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function geoTest() {
  const fails = [];
  const sample = solve2({ A: 2, B: 1, C: 13 }, { A: 3, B: -2, C: 9 });
  if (!sample || sample.x !== 5 || sample.y !== 3) fails.push('solve2 textbook');
  const pos = [0, 0, 0, 0];
  const arches = {};
  Object.keys(GENS).forEach((arch) => {
    let ok = 0;
    for (let i = 0; i < 18; i++) {
      const p = GENS[arch](mulberry32(1000 + i * 17 + arch.length * 13));
      if (!p) {
        fails.push('null ' + arch + ' ' + lastAudit);
        continue;
      }
      const reason = audit(p);
      if (reason) fails.push(reason + ' ' + arch);
      else ok += 1;
      arches[p.arch] = (arches[p.arch] || 0) + 1;
      p.steps.forEach((step) => {
        const idx = step.cards.findIndex((c) => c.correct);
        if (idx >= 0) pos[idx] += 1;
      });
    }
    if (ok < 12) fails.push('thin ' + arch + ' ' + ok);
  });
  for (let seed = 1; seed <= 6; seed++) {
    const rng = mulberry32(seed * 99);
    const hist = [];
    const seq = [];
    for (let round = 1; round <= 16; round++) {
      const p = generateProblem(round, hist, rng);
      if (!p) { fails.push('play-null ' + round + ' ' + lastAudit); break; }
      const reason = audit(p);
      if (reason) fails.push('play ' + reason);
      if (hist.some((h) => h.key === p.key)) fails.push('repeat ' + p.key);
      const tier = tierOf(round);
      if (tier.arches.indexOf(p.arch) < 0) fails.push('tier ' + round + ' ' + p.arch);
      if (hist.length && hist[hist.length - 1].arch === p.arch && tier.arches.length > 1) fails.push('adjacent ' + p.arch);
      hist.push({ arch: p.arch, key: p.key });
      if (hist.length > 6) hist.shift();
      seq.push(p.arch + ':' + p.sol.x + ',' + p.sol.y);
    }
    if (seed === 1 && seq.length < 16) fails.push('short-run');
  }
  const regions = [GEO.hud, GEO.spec, GEO.stage, GEO.deck];
  for (let i = 0; i < regions.length; i++) {
    const r = regions[i];
    if (r.x < 0 || r.y < 0 || r.x + r.w > W || r.y + r.h > H) fails.push('off ' + i);
    for (let j = i + 1; j < regions.length; j++) if (rectsOverlap(r, regions[j])) fails.push('panel ' + i + ' ' + j);
  }
  if (!inside(GEO.view, GEO.stage) || !inside(GEO.bus, GEO.stage)) fails.push('stage-child');
  if (rectsOverlap(GEO.view, GEO.bus)) fails.push('view-bus');
  if (!inside(GEO.mute, GEO.hud)) fails.push('mute');
  const deck = deckGeom();
  deck.cards.forEach((card, i) => {
    if (!inside(card, GEO.deck)) fails.push('card ' + i);
    if (rectsOverlap(card, deck.lock)) fails.push('card-lock');
    for (let j = i + 1; j < deck.cards.length; j++) if (rectsOverlap(card, deck.cards[j])) fails.push('cards');
  });
  ['prompt', 'role', 'tip', 'hint', 'lock'].forEach((name) => {
    if (!inside(deck[name], GEO.deck)) fails.push('deck-' + name);
  });
  if (rectsOverlap(deck.prompt, deck.tip) || rectsOverlap(deck.tip, deck.cards[0]) || rectsOverlap(deck.cards[0], deck.hint)) fails.push('deck-stack');
  if (rectsOverlap(deck.prompt, deck.role)) fails.push('prompt-role');
  if (pos.filter((n) => n > 0).length < 4) fails.push('slots ' + pos.join(','));
  return { fails: fails, pos: pos, arches: arches, lastAudit: lastAudit };
}

if (typeof window !== 'undefined') {
  window.__geoTest = geoTest;
  window.__geo = {
    game: game,
    generateProblem: generateProblem,
    audit: audit,
    GENS: GENS,
    startMode: startMode,
    GEO: GEO
  };
  boot();
}
</script>
</body>
