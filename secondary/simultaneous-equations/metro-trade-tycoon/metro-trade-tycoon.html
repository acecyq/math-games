  ctx.fillRect(tx + 8, rect.y + 100, 124, 40);
  text(spec.volume + ' ' + spec.unit, tx + 70, rect.y + 92, '700 16px ' + MONO, COL.gold, 'center', 'middle');
  text(spec.meanText + ' / ' + spec.unit, tx + 70, rect.y + 118, '700 13px ' + MONO, COL.ink, 'center', 'middle');
  [ax, bx].forEach(function (sx, i) {
    for (let d = 0; d < 5; d++) {
      const p = (game.time * 0.7 + d / 5) % 1;
      const y = rect.y + 40 + p * 40;
      const x = sx + (tx + 70 - sx) * p;
      ctx.fillStyle = i === 0 ? COL.cyan : COL.magenta;
      ctx.fillRect(x, y, 3, 7);
    }
  });
}

function drawHeights(spec, rect) {
  text('A ' + spec.hA + ' cm', rect.x, rect.y + 8, '700 14px ' + MONO, COL.cyan, 'left', 'middle');
  text('B ' + spec.hB + ' cm', rect.x + rect.w, rect.y + 8, '700 14px ' + MONO, COL.magenta, 'right', 'middle');
  const base = rect.y + rect.h - 36;
  const hA = 70 + (spec.hA % 20);
  const hB = 50 + (spec.hB % 18);
  ctx.fillStyle = 'rgba(62, 231, 255, 0.8)';
  ctx.fillRect(rect.x + 40, base - hA, 70, hA);
  ctx.fillStyle = 'rgba(255, 61, 154, 0.8)';
  ctx.fillRect(rect.x + rect.w - 110, base - hB, 70, hB);
  ctx.strokeStyle = COL.gold;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(rect.x, base - 60);
  ctx.lineTo(rect.x + rect.w, base - 60);
  ctx.stroke();
  ctx.setLineDash([]);
  text(spec.count + ' ' + spec.thing + '  ·  mean ' + spec.meanText, rect.x, rect.y + rect.h - 12, '600 14px ' + UI, COL.ink, 'left', 'middle');
}

function drawVault(spec, rect) {
  const reveal = game.phase === 'celebrate';
  const digits = reveal ? String(spec.reveal).padStart(2, '0').split('') : ['?', '?'];
  digits.forEach(function (digit, i) {
    const x = rect.x + 80 + i * 150;
    panel(x, rect.y + 10, 110, 120, COL.gold, 'rgba(8,12,24,0.85)');
    const bob = reveal ? 0 : Math.sin(game.time * 6 + i) * 8;
    text(digit, x + 55, rect.y + 70 + bob, '700 54px ' + MONO, COL.gold, 'center', 'middle');
  });
  text('10a + b', rect.x + rect.w - 10, rect.y + 30, '700 20px ' + MONO, COL.cyan, 'right', 'middle');
  text('reverse  10b + a', rect.x + rect.w - 10, rect.y + 58, '700 16px ' + MONO, COL.magenta, 'right', 'middle');
  text('Digit sum ' + spec.sum + '   ·   gap ' + spec.diff, rect.x, rect.y + rect.h - 8, '600 14px ' + UI, COL.dim, 'left', 'middle');
}

function drawStacked(cx, cy, num, den, size, color) {
  ctx.fillStyle = color;
  ctx.font = '700 ' + size + 'px ' + MONO;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const w = Math.max(ctx.measureText(String(num)).width, ctx.measureText(String(den)).width) + 10;
  ctx.fillText(String(num), cx, cy - size * 0.62);
  ctx.fillRect(cx - w / 2, cy - 1, w, 2);
  ctx.fillText(String(den), cx, cy + size * 0.68);
}

function drawFraction(spec, rect) {
  const reveal = game.phase === 'celebrate';
  if (reveal) drawStacked(rect.x + 70, rect.y + 70, spec.revealN, spec.revealD, 32, COL.gold);
  else {
    text('m', rect.x + 70, rect.y + 48, '700 28px ' + MONO, COL.ink, 'center', 'middle');
    ctx.fillStyle = COL.ink;
    ctx.fillRect(rect.x + 48, rect.y + 68, 44, 2);
    text('n', rect.x + 70, rect.y + 90, '700 28px ' + MONO, COL.ink, 'center', 'middle');
  }
  panel(rect.x + 170, rect.y + 8, rect.w - 180, 64, COL.cyan, 'rgba(10,16,30,0.7)');
  panel(rect.x + 170, rect.y + 82, rect.w - 180, 64, COL.magenta, 'rgba(10,16,30,0.7)');
  text('becomes  ' + spec.left, rect.x + 184, rect.y + 28, '700 16px ' + UI, COL.cyan, 'left', 'middle');
  text(spec.shift1, rect.x + 184, rect.y + 50, '600 13px ' + MONO, COL.dim, 'left', 'middle');
  text('becomes  ' + spec.right, rect.x + 184, rect.y + 102, '700 16px ' + UI, COL.magenta, 'left', 'middle');
  text(spec.shift2, rect.x + 184, rect.y + 124, '600 13px ' + MONO, COL.dim, 'left', 'middle');
}

function drawSim() {
  if (!game.problem) return;
  const titles = {
    orders: 'ORDER SCALES',
    split: 'INVENTORY SPLIT',
    share: 'VOUCHER SHARE',
    meter: 'TARIFF METER',
    banks: 'INTEREST VAULTS',
    vats: 'BLEND TANKS',
    heights: 'HEIGHT SURVEY',
    vault: 'DIGIT VAULT',
    fraction: 'FRACTION SHIFT'
  };
  drawSimFrame(titles[game.problem.visual] || 'SIMULATOR');
  const rect = simInner();
  const spec = game.problem.visualSpec;
  ctx.save();
  clipPanel(rect.x - 8, rect.y - 8, rect.w + 16, rect.h + 16, 8);
  if (game.problem.visual === 'orders') drawOrders(spec, rect);
  else if (game.problem.visual === 'split') drawSplit(spec, rect);
  else if (game.problem.visual === 'share') drawShare(spec, rect);
  else if (game.problem.visual === 'meter') drawMeter(spec, rect);
  else if (game.problem.visual === 'banks') drawBanks(spec, rect);
  else if (game.problem.visual === 'vats') drawVats(spec, rect);
  else if (game.problem.visual === 'heights') drawHeights(spec, rect);
  else if (game.problem.visual === 'vault') drawVault(spec, rect);
  else if (game.problem.visual === 'fraction') drawFraction(spec, rect);
  ctx.restore();
  drawTelemetry();
}

function drawCard(cardObj, rect, index, hot, mark, dead) {
  const stroke = dead ? 'rgba(255,77,106,0.35)' : hot ? COL.cyan : 'rgba(140,170,200,0.3)';
  panel(rect.x, rect.y, rect.w, rect.h, stroke, dead ? 'rgba(40, 10, 18, 0.72)' : 'rgba(8, 14, 28, 0.94)');
  text(String(index + 1).padStart(2, '0'), rect.x + 10, rect.y + 14, '700 11px ' + UI, COL.dim, 'left', 'middle');
  if (mark) text(mark, rect.x + rect.w - 10, rect.y + 14, '700 11px ' + UI, COL.gold, 'right', 'middle');
  if (cardObj && cardObj.frac) {
    drawStacked(rect.x + rect.w / 2, rect.y + rect.h / 2 + 8, cardObj.frac.n, cardObj.frac.d, 22, dead ? COL.dim : COL.ink);
    return;
  }
  const body = cardObj ? cardObj.text : '';
  let size = 16;
  ctx.font = '700 ' + size + 'px ' + MONO;
  let lines = wrapText(ctx, body, rect.w - 18);
  while (lines.length > 4 && size > 12) {
    size -= 1;
    ctx.font = '700 ' + size + 'px ' + MONO;
    lines = wrapText(ctx, body, rect.w - 18);
  }
  const top = rect.y + rect.h / 2 + 6 - ((lines.length - 1) * (size + 3)) / 2;
  lines.forEach(function (line, i) {
    text(line, rect.x + rect.w / 2, top + i * (size + 3), '700 ' + size + 'px ' + MONO, dead ? COL.dim : COL.ink, 'center', 'middle');
  });
}

function roleLine() {
  if (!game.problem) return '';
  if (game.phase === 'celebrate') return 'Click anywhere for the next contract';
  if (game.mode !== 'coop') return '';
  if (game.step >= 2) return 'Both directors click the same card';
  const owner = ownerFor(game.step);
  const who = owner === 0 ? 'P1 RED' : 'P2 BLUE';
  return who + ' clicks ' + (game.step === 0 ? 'Equation 1' : 'Equation 2');
}

function drawDeck() {
  const d = GEO.deck;
  panel(d.x, d.y, d.w, d.h, 'rgba(94, 255, 176, 0.22)');
  const geom = deckGeom();
  const prompt = game.problem && game.phase === 'play' ? game.problem.steps[game.step].prompt : (game.phase === 'celebrate' ? 'TRADE CLEARED' : 'LINKING THE LEDGERS');
  text(prompt, geom.prompt.x, geom.prompt.y + 10, '700 13px ' + UI, COL.ink, 'left', 'middle');
  const role = roleLine();
  if (role) text(role, geom.prompt.x + geom.prompt.w, geom.prompt.y + 10, '700 12px ' + UI, COL.amber, 'right', 'middle');
  const cards = currentCards();
  for (let i = 0; i < 4; i++) {
    const slot0 = game.cursor[0] === i;
    const slot1 = game.mode === 'versus' && game.cursor[1] === i;
    const votes = [];
    if (game.mode === 'coop' && game.step === 2) {
      if (game.armed[0] === i) votes.push('P1');
      if (game.armed[1] === i) votes.push('P2');
    }
    const dead = cards[i] && (game.mode === 'versus' ? (cards[i].deadFor[0] && cards[i].deadFor[1]) : cards[i].dead);
    drawCard(cards[i], geom.cards[i], i, slot0 || slot1, votes.join(' '), dead);
    if (slot0) strokeCursor(geom.cards[i], game.mode === 'coop' ? (ownerFor(game.step) === 1 ? COL.p2 : COL.p1) : (game.mode === 'versus' ? COL.p1 : COL.cyan));
    if (slot1) strokeCursor(geom.cards[i], COL.p2);
  }
}

function strokeCursor(rect, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = 0.85;
  roundRect(rect.x - 3, rect.y - 3, rect.w + 6, rect.h + 6, 14);
  ctx.stroke();
  ctx.restore();
}

function drawReticle(x, y, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(x, y, 9, 0, Math.PI * 2);
  ctx.moveTo(x - 14, y); ctx.lineTo(x - 5, y);
  ctx.moveTo(x + 5, y); ctx.lineTo(x + 14, y);
  ctx.moveTo(x, y - 14); ctx.lineTo(x, y - 5);
  ctx.moveTo(x, y + 5); ctx.lineTo(x, y + 14);
  ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  game.particles.forEach(function (dot) {
    ctx.globalAlpha = Math.max(0, dot.life / dot.max);
    ctx.fillStyle = dot.color;
    ctx.beginPath();
    ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}
function drawFloats() {
  game.floats.forEach(function (floater) {
    ctx.globalAlpha = Math.max(0, floater.life / floater.max);
    text(floater.text, floater.x, floater.y, '700 22px ' + UI, floater.color, 'center', 'middle');
  });
  ctx.globalAlpha = 1;
}

function drawCelebrate() {
  if (!game.problem) return;
  const s = GEO.sim;
  const x = s.x + 16;
  const y = s.y + 36;
  const w = s.w - 32;
  const h = s.h - 78;
  roundRect(x, y, w, h, 12);
  ctx.fillStyle = '#07140f';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = COL.gold;
  ctx.stroke();
  text('TRADE CLEARED', x + w / 2, y + 28, '700 18px ' + UI, COL.gold, 'center', 'middle');
  text(game.locked[0] || '', x + w / 2, y + 58, '700 16px ' + MONO, COL.cyan, 'center', 'middle');
  text(game.locked[1] || '', x + w / 2, y + 84, '700 16px ' + MONO, COL.magenta, 'center', 'middle');
  const good = game.problem.steps[2].cards.find(function (c) { return c.correct; });
  if (good && good.frac) drawStacked(x + w / 2, y + 128, good.frac.n, good.frac.d, 20, COL.gold);
  else text(game.locked[2] || '', x + w / 2, y + 118, '700 22px ' + MONO, COL.gold, 'center', 'middle');
  text('+350 TYCOON POINTS', x + w / 2, y + h - 22, '700 13px ' + UI, COL.good, 'center', 'middle');
}

function drawTitle() {
  text('NEON HARBOUR EXCHANGE', W / 2, 48, '700 13px ' + UI, COL.cyan, 'center', 'middle');
  text('METRO TRADE', W / 2, 92, '700 54px ' + UI, COL.ink, 'center', 'middle');
  text('& MIXTURE TYCOON', W / 2, 138, '700 28px ' + UI, COL.magenta, 'center', 'middle');
  text('Secondary 2  ·  simultaneous equations from trade, tariffs, mixtures, interest, and digit vaults', W / 2, 172, '600 14px ' + UI, COL.dim, 'center', 'middle');
  const buttons = titleGeom();
  const copy = [
    ['SOLO TYCOON', 'Mouse, keyboard, or one 8BitDo. Three capital shields, your combo, and your score.', 'Best ' + (game.best.solo || 0)],
    ['2P CO-OP TEAM', 'P1 and P2 swap Equation 1 and Equation 2 each round. Four shared shields. One team score only.', 'Best ' + (game.best.coop || 0)],
    ['2P VERSUS', 'Same contract, separate shields. First correct lock takes the step. Step 3 awards the tycoon star.', 'Best ' + (game.best.versus || 0)]
  ];
  buttons.forEach(function (btn, i) {
    const on = game.titleSel === i;
    panel(btn.x, btn.y, btn.w, btn.h, on ? COL.gold : COL.line, 'rgba(8,14,28,0.92)');
    text(i + 1 + '   ' + copy[i][0], btn.x + 20, btn.y + 42, '700 20px ' + UI, on ? COL.gold : COL.ink, 'left', 'middle');
    ctx.font = '600 15px ' + UI;
    wrapText(ctx, copy[i][1], btn.w - 40).slice(0, 4).forEach(function (line, li) {
      text(line, btn.x + 20, btn.y + 88 + li * 22, '600 15px ' + UI, COL.dim, 'left', 'middle');
    });
    text(copy[i][2], btn.x + 20, btn.y + btn.h - 28, '700 13px ' + MONO, COL.cyan, 'left', 'middle');
  });
  const help = 'Solo: mouse click, or WASD / arrows + Space.    Co-op & versus: P1 WASD + F, P2 arrows + Enter.    8BitDo: D-pad or stick, A confirms.    M mutes.    1–4 and 7–0 quick-pick cards.';
  ctx.font = '600 13px ' + UI;
  wrapText(ctx, help, 1100).forEach(function (line, i) {
    text(line, W / 2, 500 + i * 20, '600 13px ' + UI, COL.dim, 'center', 'middle');
  });
  text('Click a card to lock the answer. A wrong translation costs one capital shield and names the trap.', W / 2, 560, '600 14px ' + UI, COL.ink, 'center', 'middle');
  drawMuteIcon(GEO.mute.x, GEO.mute.y, audio.muted);
}

function drawOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(4, 6, 14, 0.72)';
  ctx.fillRect(0, 0, W, H);
  panel(300, 150, 680, 430, COL.gold, 'rgba(8, 12, 24, 0.96)');
  text('EXCHANGE CLOSED', W / 2, 196, '700 16px ' + UI, COL.bad, 'center', 'middle');
  text(modeLabel(), W / 2, 236, '700 28px ' + UI, COL.ink, 'center', 'middle');
  ctx.font = '600 16px ' + UI;
  wrapText(ctx, game.overReason || '', 580).forEach(function (line, i) {
    text(line, W / 2, 278 + i * 22, '600 16px ' + UI, COL.dim, 'center', 'middle');
  });
  if (game.mode === 'versus') {
    text('P1  ' + game.pScore[0] + '    stars ' + game.stars[0], W / 2, 360, '700 20px ' + MONO, COL.p1, 'center', 'middle');
    text('P2  ' + game.pScore[1] + '    stars ' + game.stars[1], W / 2, 392, '700 20px ' + MONO, COL.p2, 'center', 'middle');
  } else {
    text((game.mode === 'coop' ? 'TEAM SCORE  ' : 'SCORE  ') + game.score, W / 2, 360, '700 28px ' + MONO, COL.gold, 'center', 'middle');
    text('Contracts cleared  ' + game.cleared, W / 2, 398, '700 16px ' + UI, COL.ink, 'center', 'middle');
  }
  const buttons = overGeom();
  ['RETRY SAME MODE', 'TITLE'].forEach(function (label, i) {
    const btn = buttons[i];
    panel(btn.x, btn.y, btn.w, btn.h, game.overSel === i ? COL.gold : COL.line);
    text(label, btn.x + btn.w / 2, btn.y + btn.h / 2, '700 16px ' + UI, COL.ink, 'center', 'middle');
  });
  ctx.restore();
}

function drawPause() {
  ctx.save();
  ctx.fillStyle = 'rgba(4, 6, 14, 0.62)';
  ctx.fillRect(0, 0, W, H);
  panel(360, 220, 560, 260, COL.cyan, 'rgba(8,12,24,0.96)');
  text('MARKET PAUSED', W / 2, 268, '700 28px ' + UI, COL.ink, 'center', 'middle');
  text('Esc resumes. Q returns to the title.', W / 2, 312, '600 15px ' + UI, COL.dim, 'center', 'middle');
  const buttons = pauseGeom();
  ['RESUME', 'TITLE'].forEach(function (label, i) {
    const btn = buttons[i];
    panel(btn.x, btn.y, btn.w, btn.h, game.pauseSel === i ? COL.gold : COL.line);
    text(label, btn.x + btn.w / 2, btn.y + btn.h / 2, '700 16px ' + UI, COL.ink, 'center', 'middle');
  });
  ctx.restore();
}

function draw() {
  ctx.save();
  if (game.shake > 0) {
    const mag = game.shake;
    ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
  }
  drawBackground();
  if (game.screen === 'title') {
    drawTitle();
  } else {
    drawHUD();
    drawTicker();
    drawRail();
    drawLedgers();
    drawSim();
    drawDeck();
    drawParticles();
    drawFloats();
    if (game.screen === 'play' && !game.paused) {
      if (game.mode !== 'versus') drawReticle(game.ret[0].x, game.ret[0].y, game.mode === 'coop' ? (ownerFor(game.step) === 1 ? COL.p2 : COL.p1) : COL.cyan);
      else {
        drawReticle(game.ret[0].x, game.ret[0].y, COL.p1);
        drawReticle(game.ret[1].x, game.ret[1].y, COL.p2);
      }
    }
    if (game.phase === 'celebrate' && game.screen === 'play') drawCelebrate();
    if (game.paused) drawPause();
    if (game.screen === 'over') drawOver();
  }
  ctx.restore();
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
  canvas.width = Math.max(1, Math.round(W * scale * dpr));
  canvas.height = Math.max(1, Math.round(H * scale * dpr));
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}

function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  loadBest();
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', function (e) {
    const block = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    if (block.indexOf(e.code) >= 0) e.preventDefault();
    if (e.repeat) return;
    keysDown.add(e.code);
    keyEdge.add(e.code);
  });
  window.addEventListener('keyup', function (e) { keysDown.delete(e.code); });
  canvas.addEventListener('pointermove', function (e) {
    const pos = worldFromClient(e.clientX, e.clientY);
    game.mouseX = pos.x;
    game.mouseY = pos.y;
    game.mouseIn = true;
    if (game.screen === 'title') {
      titleGeom().forEach(function (btn, i) { if (hit(pos.x, pos.y, btn)) game.titleSel = i; });
    } else if (game.screen === 'play' && game.mode !== 'versus') {
      game.aim[0].x = pos.x;
      game.aim[0].y = pos.y;
      const geom = deckGeom();
      for (let i = 0; i < 4; i++) if (hit(pos.x, pos.y, geom.cards[i])) game.cursor[0] = i;
    } else if (game.screen === 'play' && game.mode === 'versus') {
      game.aim[0].x = pos.x;
      game.aim[0].y = pos.y;
      const geom = deckGeom();
      for (let i = 0; i < 4; i++) if (hit(pos.x, pos.y, geom.cards[i])) game.cursor[0] = i;
    }
  });
  canvas.addEventListener('pointerdown', function (e) {
    const pos = worldFromClient(e.clientX, e.clientY);
    pointerX = pos.x;
    pointerY = pos.y;
    pointerEdge = true;
    resumeAudio();
  });
  canvas.addEventListener('pointerleave', function () { game.mouseIn = false; });
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    try {
      if (!game.paused) pollInput();
      else pollInput();
      update(dt);
      tickMusic();
      draw();
    } catch (err) {
      game.fatal = err && err.message ? err.message : 'render error';
      console.error(err);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

buildCity();
if (typeof document !== 'undefined' && document && document.getElementById) boot();
</script>
