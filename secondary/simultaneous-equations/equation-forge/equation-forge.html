function deckGeom() {
  const y = 548;
  const h = 118;
  const execW = 150;
  const gap = 10;
  const x0 = 28;
  const cardW = (1224 - execW - gap * 4) / 4;
  const cards = [];
  for (let i = 0; i < 4; i++) cards.push({ x: x0 + i * (cardW + gap), y, w: cardW, h, i });
  const execute = { x: x0 + 4 * (cardW + gap), y, w: execW, h };
  return { cards, execute, prompt: { x: 28, y: 516, w: 1224, h: 26 } };
}
function titleGeom() {
  return [
    { id: 'solo', x: 70, y: 188, w: 360, h: 188 },
    { id: 'coop', x: 460, y: 188, w: 360, h: 188 },
    { id: 'versus', x: 850, y: 188, w: 360, h: 188 }
  ];
}
function hit(px, py, r) {
  return px >= r.x && py >= r.y && px < r.x + r.w && py < r.y + r.h;
}
function worldFromClient(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const cx = (clientX - rect.left) * (canvas.clientWidth / rect.width);
  const cy = (clientY - rect.top) * (canvas.clientHeight / rect.height);
  const v = game.view;
  return { x: (cx - v.ox) / v.s, y: (cy - v.oy) / v.s };
}
function ownerFor(step) {
  if (game.mode !== 'coop') return -1;
  if (step >= 2) return -1;
  const swap = game.round % 2 === 0;
  if (step === 0) return swap ? 1 : 0;
  return swap ? 0 : 1;
}
function clickPlayer() {
  if (game.mode === 'solo') return 0;
  if (game.mode === 'coop') {
    const o = ownerFor(game.step);
    return o < 0 ? 0 : o;
  }
  return 0;
}
function currentCards() {
  if (!game.problem || game.step > 2) return [];
  return game.problem.steps[game.step].cards;
}
function moveSel(player, dir) {
  const cards = currentCards();
  if (!cards.length) return;
  let i = game.sel[player] || 0;
  for (let k = 0; k < 4; k++) {
    i = (i + dir + 4) % 4;
    if (!cards[i] || !cards[i].dead) break;
  }
  game.sel[player] = i;
}

function award(player, step) {
  const base = step === 2 ? 350 : 120;
  const streak = Math.min(game.combo, 10) * 20;
  const speed = game.mode === 'versus' ? 80 : 0;
  const pts = base + streak + speed;
  if (game.mode === 'versus') game.pScore[player] += pts;
  else game.score += pts;
  game.combo += 1;
  if (game.mode === 'versus' && step === 2) game.stars[player] += 1;
  game.lastAward = { base, streak, speed, pts, player };
  game.floats.push({
    x: 430, y: 300, text: '+' + pts, life: 1.15, max: 1.15, color: COL.gold
  });
  saveBest();
}
function hurt(player) {
  game.combo = 0;
  if (game.mode === 'versus') {
    game.pShields[player] = Math.max(0, game.pShields[player] - 1);
    if (game.pShields[0] === 0 && game.pShields[1] === 0) endGame('Both translators lost their forge shields.');
  } else {
    game.shields -= 1;
    if (game.shields <= 0) endGame('The forge shields are gone.');
  }
}
function endGame(reason) {
  game.phase = 'over';
  game.screen = 'over';
  game.overReason = reason;
  saveBest();
}
function saveBest() {
  const key = game.mode;
  const val = game.mode === 'versus' ? Math.max(game.pScore[0], game.pScore[1]) : game.score;
  if (val > (game.best[key] || 0)) {
    game.best[key] = val;
    try { localStorage.setItem('equation-forge-best', JSON.stringify(game.best)); } catch (err) { /* ignore */ }
  }
}
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = speed * (0.35 + Math.random());
    game.particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 0.45 + Math.random() * 0.4, max: 0.85, r: 1.5 + Math.random() * 2.2, color
    });
  }
  if (game.particles.length > 140) game.particles.splice(0, game.particles.length - 140);
}

function onCorrect(player, step) {
  sfxLock();
  const cards = deckGeom().cards[game.sel[player]] || { x: 640, y: 600 };
  burst(cards.x + 40, cards.y + 40, COL.gold, 18, 140);
  award(player, step);
  if (step < 2) {
    const good = game.problem.steps[step].cards.find((c) => c.correct);
    game.locked[step] = good ? good.text : '';
  }
  game.tip = '';
  if (step === 0) {
    game.step = 1;
    game.sel = [0, 0];
  } else if (step === 1) {
    game.phase = 'link';
    game.linkT = 0.72;
    sfxSweep();
  } else {
    game.phase = 'celebrate';
    game.celebrateT = 2.8;
    game.cleared += 1;
    sfxFanfare();
    burst(960, 360, COL.gold, 36, 180);
    burst(960, 360, COL.cyan, 16, 120);
  }
}
function onWrong(player, card) {
  card.dead = true;
  sfxBuzz();
  game.shake = 8;
  game.tip = card.tip;
  game.tipT = 4.4;
  game.lock = 0.32;
  const rect = deckGeom().cards[game.sel[player]] || { x: 400, y: 600 };
  burst(rect.x + 50, rect.y + 40, COL.bad, 16, 120);
  hurt(player);
}

function confirm(player) {
  if (frameUsed || game.lock > 0 || game.paused) return;
  if (game.screen === 'title') {
    startMode(['solo', 'coop', 'versus'][game.titleSel] || 'solo');
    frameUsed = true;
    return;
  }
  if (game.screen === 'over') {
    startMode(game.mode);
    frameUsed = true;
    return;
  }
  if (game.phase === 'celebrate') {
    finishRound();
    frameUsed = true;
    return;
  }
  if (game.phase !== 'play' || !game.problem) return;
  if (game.mode === 'versus' && game.pShields[player] <= 0) return;
  const owner = ownerFor(game.step);
  if (owner !== -1 && owner !== player) {
    game.tip = (owner === 0 ? 'P1' : 'P2') + ' forges this equation.';
    game.tipT = 1.4;
    return;
  }
  const cards = currentCards();
  const card = cards[game.sel[player]];
  if (!card || card.dead) return;
  frameUsed = true;
  if (card.correct) onCorrect(player, game.step);
  else onWrong(player, card);
}

function finishRound() {
  game.round += 1;
  nextProblem();
}
function nextProblem() {
  let p = null;
  for (let i = 0; i < 10 && !p; i++) p = generateProblem(game.round, game.history);
  if (!p) {
    game.fatal = 'The forge could not build a contract.';
    return;
  }
  game.history.push({ arch: p.arch, key: p.key });
  if (game.history.length > 6) game.history.shift();
  game.problem = p;
  game.step = 0;
  game.phase = 'play';
  game.locked = [null, null];
  game.sel = [0, 0];
  game.tip = '';
  game.screen = 'play';
}
function startMode(mode) {
  resumeAudio();
  sfxUi();
  game.mode = mode;
  game.screen = 'play';
  game.round = 1;
  game.cleared = 0;
  game.combo = 0;
  game.score = 0;
  game.pScore = [0, 0];
  game.stars = [0, 0];
  game.shields = mode === 'coop' ? 4 : 3;
  game.maxShields = game.shields;
  game.pShields = [3, 3];
  game.paused = false;
  game.phase = 'play';
  game.fatal = '';
  game.particles = [];
  game.floats = [];
  game.shake = 0;
  game.lastAward = null;
  nextProblem();
}

function playerMaps() {
  if (game.mode === 'solo') {
    return [{
      up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'],
      left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
      fire: ['Space', 'Enter']
    }];
  }
  return [
    { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], fire: ['KeyF', 'Space'] },
    { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], fire: ['Enter'] }
  ];
}
function edge(codes) {
  for (let i = 0; i < codes.length; i++) if (keyEdge.has(codes[i])) return true;
  return false;
}

function pollPads() {
  const out = [null, null];
  let pads = [];
  try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (err) { pads = []; }
  for (let i = 0; i < 2; i++) {
    const pad = pads && pads[i];
    game.padOn[i] = !!(pad && pad.connected);
    if (!pad) continue;
    const prev = padMem[i];
    const buttons = pad.buttons.map((b) => !!(b && b.pressed));
    const ax = pad.axes && pad.axes.length ? pad.axes[0] || 0 : 0;
    const ay = pad.axes && pad.axes.length > 1 ? pad.axes[1] || 0 : 0;
    let dx = 0;
    let dy = 0;
    const dead = 0.55;
    if (Math.abs(ax) > dead && Math.abs(prev.ax) <= dead) dx = Math.sign(ax);
    if (Math.abs(ay) > dead && Math.abs(prev.ay) <= dead) dy = Math.sign(ay);
    const pressed = (idx) => buttons[idx] && !prev.buttons[idx];
    if (pressed(14)) dx = -1;
    if (pressed(15)) dx = 1;
    if (pressed(12)) dy = -1;
    if (pressed(13)) dy = 1;
    const fire = pressed(0) || pressed(1);
    prev.buttons = buttons;
    prev.ax = ax;
    prev.ay = ay;
    out[i] = { dx, dy, fire };
  }
  return out;
}

function pollInput() {
  frameUsed = false;
  if (keyEdge.has('KeyM')) toggleMute();
  if (keyEdge.has('KeyP') && (game.screen === 'play' || game.paused)) {
    game.paused = !game.paused;
    if (game.screen === 'play' || game.screen === 'over') {
      /* pause only mid-contract */
    }
    if (game.screen !== 'play') game.paused = false;
  }
  const pads = pollPads();
  if (game.screen === 'title') {
    const maps = [{ left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'], fire: ['Enter', 'Space'] }];
    if (edge(maps[0].left) || edge(maps[0].up) || (pads[0] && (pads[0].dx < 0 || pads[0].dy < 0))) game.titleSel = (game.titleSel + 2) % 3;
    if (edge(maps[0].right) || edge(maps[0].down) || (pads[0] && (pads[0].dx > 0 || pads[0].dy > 0))) game.titleSel = (game.titleSel + 1) % 3;
    if (keyEdge.has('Digit1')) startMode('solo');
    else if (keyEdge.has('Digit2')) startMode('coop');
    else if (keyEdge.has('Digit3')) startMode('versus');
    else if (edge(maps[0].fire) || (pads[0] && pads[0].fire)) startMode(['solo', 'coop', 'versus'][game.titleSel]);
    if (pointerEdge) {
      const cards = titleGeom();
      for (let i = 0; i < cards.length; i++) {
        if (hit(game.mouseX, game.mouseY, cards[i])) startMode(cards[i].id);
      }
    }
    return;
  }
  if (game.screen === 'over') {
    if (pointerEdge) {
      if (hit(game.mouseX, game.mouseY, { x: 390, y: 560, w: 240, h: 52 })) { game.screen = 'title'; return; }
      if (hit(game.mouseX, game.mouseY, { x: 650, y: 560, w: 240, h: 52 }) || edge(['Enter', 'Space']) || (pads[0] && pads[0].fire)) startMode(game.mode);
    } else if (edge(['Enter', 'Space']) || (pads[0] && pads[0].fire)) startMode(game.mode);
    if (keyEdge.has('Escape')) game.screen = 'title';
    return;
  }
  if (game.paused) {
    if (pointerEdge && hit(game.mouseX, game.mouseY, { x: 490, y: 390, w: 300, h: 52 })) game.paused = false;
    return;
  }
  const maps = playerMaps();
  for (let p = 0; p < maps.length; p++) {
    const map = maps[p];
    const pad = pads[p];
    if (edge(map.left) || (pad && pad.dx < 0)) moveSel(p, -1);
    if (edge(map.right) || (pad && pad.dx > 0)) moveSel(p, 1);
    if (edge(map.up) || (pad && pad.dy < 0)) moveSel(p, -1);
    if (edge(map.down) || (pad && pad.dy > 0)) moveSel(p, 1);
    if (edge(map.fire) || (pad && pad.fire)) confirm(p);
  }
  if (pointerEdge && game.phase === 'play') {
    const deck = deckGeom();
    if (hit(game.mouseX, game.mouseY, deck.execute)) confirm(clickPlayer());
    else {
      for (let i = 0; i < deck.cards.length; i++) {
        if (hit(game.mouseX, game.mouseY, deck.cards[i])) {
          const p = clickPlayer();
          game.sel[p] = i;
          confirm(p);
          break;
        }
      }
    }
  } else if (pointerEdge && game.phase === 'celebrate') finishRound();
}

function advance(dt) {
  game.time += dt;
  if (game.tipT > 0) game.tipT = Math.max(0, game.tipT - dt);
  if (game.lock > 0) game.lock = Math.max(0, game.lock - dt);
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 28);
  if (game.phase === 'link') {
    game.linkT -= dt;
    if (game.linkT <= 0) {
      game.phase = 'play';
      game.step = 2;
      game.sel = [0, 0];
    }
  } else if (game.phase === 'celebrate') {
    game.celebrateT -= dt;
    if (game.celebrateT <= 0) finishRound();
  }
  game.particles.forEach((p) => {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 40 * dt;
  });
  game.particles = game.particles.filter((p) => p.life > 0);
  game.floats.forEach((f) => {
    f.life -= dt;
    f.y -= 32 * dt;
  });
  game.floats = game.floats.filter((f) => f.life > 0);
}

/* ---------- drawing ---------- */

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function panel(x, y, w, h, accent) {
  roundRect(x, y, w, h, 12);
  ctx.fillStyle = 'rgba(7, 16, 30, 0.94)';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = accent || 'rgba(130, 190, 220, 0.35)';
  ctx.stroke();
}
function text(str, x, y, font, color, align) {
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function wrap(str, font, maxW) {
  ctx.font = font;
  const words = String(str).split(' ');
  const lines = [];
  let line = '';
  words.forEach((word) => {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = word;
    } else line = test;
  });
  if (line) lines.push(line);
  return lines;
}
function wrapSegments(segments, maxW, size) {
  ctx.font = '600 ' + size + 'px ' + UI;
  const atoms = [];
  segments.forEach((segItem) => {
    String(segItem.text).split(/(\s+)/).forEach((part) => {
      if (!part) return;
      atoms.push({ text: part, clue: segItem.clue || 0 });
    });
  });
  const lines = [];
  let line = [];
  let width = 0;
  atoms.forEach((atom) => {
    const tw = ctx.measureText(atom.text).width;
    const space = /^\s+$/.test(atom.text);
    if (!space && width + tw > maxW && line.length) {
      lines.push(line);
      line = [];
      width = 0;
    }
    if (space && !line.length) return;
    line.push(atom);
    width += tw;
  });
  if (line.length) lines.push(line);
  return lines;
}
function clueColor(clue, active, locked) {
  if (!clue) return COL.ink;
  const base = clue === 1 ? COL.cyan : COL.magenta;
  if (locked) return base;
  if (active) {
    const pulse = 0.65 + 0.35 * Math.sin(game.time * 5);
    return base;
  }
  return clue === 1 ? 'rgba(62, 224, 255, 0.55)' : 'rgba(255, 61, 154, 0.55)';
}
function fitSize(str, maxW, start, min) {
  let size = start;
  while (size > min) {
    ctx.font = '700 ' + size + 'px ' + MONO;
    if (ctx.measureText(str).width <= maxW) break;
    size -= 1;
  }
  return size;
}
function drawShield(x, y, on, color) {
  ctx.beginPath();
  ctx.moveTo(x, y - 8);
  ctx.lineTo(x + 7, y - 4);
  ctx.lineTo(x + 6, y + 4);
  ctx.lineTo(x, y + 9);
  ctx.lineTo(x - 6, y + 4);
  ctx.lineTo(x - 7, y - 4);
  ctx.closePath();
  ctx.fillStyle = on ? color : 'rgba(255,255,255,0.08)';
  ctx.fill();
  ctx.strokeStyle = on ? color : 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
}
function drawStar(x, y, r, on, color) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? r : r * 0.45;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const px = x + Math.cos(a) * rad;
    const py = y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = on ? color : 'rgba(255,255,255,0.1)';
  ctx.fill();
}
function drawSpeaker(x, y, muted) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = muted ? COL.dim : COL.cyan;
  ctx.fillRect(-8, -3, 4, 6);
  ctx.beginPath();
  ctx.moveTo(-4, -3);
  ctx.lineTo(2, -7);
  ctx.lineTo(2, 7);
  ctx.lineTo(-4, 3);
  ctx.fill();
  ctx.strokeStyle = muted ? COL.dim : COL.cyan;
  ctx.lineWidth = 1.4;
  if (muted) {
    ctx.beginPath();
    ctx.moveTo(5, -5);
    ctx.lineTo(12, 5);
    ctx.moveTo(12, -5);
    ctx.lineTo(5, 5);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(3, 0, 5, -0.8, 0.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(3, 0, 8, -0.7, 0.7);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#10243d');
  g.addColorStop(1, '#070d16');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.strokeStyle = 'rgba(90, 160, 200, 0.06)';
  ctx.lineWidth = 1;
  const shift = (game.time * 12) % 48;
  for (let x = -48 + shift; x < W; x += 48) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += 48) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();
}

function modeLabel() {
  if (game.mode === 'coop') return '2P CO-OP TEAM';
  if (game.mode === 'versus') return '2P VERSUS';
  return 'SOLO TRANSLATOR';
}
function roleLine() {
  if (!game.problem) return '';
  if (game.mode === 'versus') return 'RACE — FIRST CORRECT LOCK EARNS THE STEP';
  if (game.mode !== 'coop') return 'TRANSLATE THE CYAN CLUE, THEN THE MAGENTA CLUE';
  const owner = ownerFor(game.step);
  if (game.phase === 'link') return 'SOLVER MATRIX IS CROSS-LINKING BOTH EQUATIONS';
  if (owner < 0) return 'BOTH TRANSLATORS CONFIRM THE FINAL TARGET';
  return (owner === 0 ? 'P1' : 'P2') + ' FORGES THIS STEP';
}

function drawHUD() {

function drawPilot(x, y, index) {

function drawMuteButton() {

function drawBrief() {
  const b = GEO.brief;
  panel(b.x, b.y, b.w, b.h, 'rgba(130, 190, 220, 0.28)');
  const p = game.problem;
  if (!p) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(b.x + 10, b.y + 6, b.w - 20, b.h - 12);
  ctx.clip();
  text(p.kicker, 32, 86, '800 12px ' + UI, COL.amber, 'left');
  const step = game.step;
  let size = 16;
  let lines = wrapSegments(p.segments, 1216, size);
  if (lines.length > 3) {
    size = 14;
    lines = wrapSegments(p.segments, 1216, size);
  }
  const lh = lines.length > 3 ? 16 : 20;
  lines.slice(0, 4).forEach((line, i) => {
    let x = 32;
    const y = 112 + i * lh;
    line.forEach((atom) => {
      const active = (atom.clue === 1 && step === 0) || (atom.clue === 2 && step === 1);
      const locked = (atom.clue === 1 && step > 0) || (atom.clue === 2 && step > 1);
      const color = clueColor(atom.clue, active, locked);
      text(atom.text, x, y, '600 ' + size + 'px ' + UI, color, 'left');
      x += ctx.measureText(atom.text).width;
    });
  });

function edgeTag(x1, y1, x2, y2, cx, cy, label, color, dist) {
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2;
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  let nx = -dy / len;
  let ny = dx / len;
  if (nx * (mx - cx) + ny * (my - cy) < 0) { nx = -nx; ny = -ny; }
  tag(label, mx + nx * dist, my + ny * dist, color, 'center');
}
function tag(str, x, y, color, align) {

    const lines = wrap(card.text, '700 ' + size + 'px ' + MONO, rect.w - 22);
    const lh = size + 4;
    const block = lines.length * lh;
    lines.slice(0, 4).forEach((line, i) => {
      text(line, rect.x + rect.w / 2, rect.y + rect.h / 2 - block / 2 + lh / 2 + i * lh, '700 ' + size + 'px ' + MONO, COL.ink, 'center');
    });
  }
  ctx.restore();
  if (card.dead) {
    ctx.strokeStyle = COL.bad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(rect.x + 14, rect.y + rect.h / 2);
    ctx.lineTo(rect.x + rect.w - 14, rect.y + rect.h / 2);
    ctx.stroke();
  }
}
function drawRich(parts, rect) {
  ctx.font = '700 16px ' + MONO;
  let width = 0;
  parts.forEach((part) => {
    if (part.t) width += ctx.measureText(part.t).width;
    else width += 36;
  });
  let x = rect.x + rect.w / 2 - width / 2;
  const y = rect.y + rect.h / 2;
  parts.forEach((part) => {
    if (part.t) {
      text(part.t, x, y, '700 16px ' + MONO, COL.ink, 'left');
      x += ctx.measureText(part.t).width;
    } else {
      drawStacked(x + 16, y, part.n, part.d, 13, COL.ink);
      x += 36;
    }
  });
}
function selectionsOn(index) {
  const list = [];
  const colorOf = (p) => game.mode === 'solo' ? COL.cyan : (p === 0 ? COL.p1 : COL.p2);
  const count = game.mode === 'solo' ? 1 : 2;
  for (let p = 0; p < count; p++) {
    if (game.sel[p] !== index) continue;
    if (game.mode === 'versus' && game.pShields[p] <= 0) continue;
    if (game.mode === 'coop') {
      const owner = ownerFor(game.step);
      if (owner !== -1 && owner !== p) continue;
    }
    list.push({ player: p, color: colorOf(p) });
  }
  return list;
}
function cornerTicks(rect, color, offset) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  const inset = 6 + offset * 4;
  const s = 10;
  [[rect.x + inset, rect.y + inset, 1, 1], [rect.x + rect.w - inset, rect.y + inset, -1, 1], [rect.x + inset, rect.y + rect.h - inset, 1, -1], [rect.x + rect.w - inset, rect.y + rect.h - inset, -1, -1]].forEach((c) => {
    ctx.beginPath();
    ctx.moveTo(c[0], c[1] + c[3] * s);
    ctx.lineTo(c[0], c[1]);
    ctx.lineTo(c[0] + c[2] * s, c[1]);
    ctx.stroke();
  });
}
function drawExecute(rect) {
  const hot = hit(game.mouseX, game.mouseY, rect) && game.mouseMoved;
  roundRect(rect.x, rect.y, rect.w, rect.h, 10);
  ctx.fillStyle = 'rgba(20, 16, 6, 0.95)';
  ctx.fill();
  ctx.strokeStyle = COL.gold;
  ctx.globalAlpha = 0.7 + 0.3 * Math.sin(game.time * 4);
  ctx.lineWidth = hot ? 3 : 2;
  ctx.stroke();
  ctx.globalAlpha = 1;
  text('EXECUTE', rect.x + rect.w / 2, rect.y + 42, '800 16px ' + UI, COL.gold, 'center');
  text('SOLVER', rect.x + rect.w / 2, rect.y + 64, '800 16px ' + UI, COL.gold, 'center');
  text(game.step === 2 ? 'FINAL TARGET' : 'LOCK CHOICE', rect.x + rect.w / 2, rect.y + 90, '700 10px ' + UI, COL.dim, 'center');
}
function drawCelebrate() {
  const award = game.lastAward || { base: 350, streak: 0, speed: 0, pts: 350 };
  text('CONTRACT SEALED', W / 2, 536, '800 18px ' + UI, COL.gold, 'center');
  const bits = ['+' + award.base + ' TRANSLATOR POINTS'];
  if (award.streak) bits.push('STREAK +' + award.streak);
  if (award.speed) bits.push('SPEED +' + award.speed);
  text(bits.join('    '), W / 2, 560, '700 14px ' + UI, COL.ink, 'center');
  const lines = game.problem.worked || [];
  lines.slice(0, 4).forEach((line, i) => {
    const size = fitSize(line, 1100, 16, 12);
    text(line, W / 2, 588 + i * 22, '700 ' + size + 'px ' + MONO, i === lines.length - 1 ? COL.gold : COL.ink, 'center');
  });
}

function drawCrosshair() {
  if (!game.mouseMoved || game.mode === 'coop') return;
  ctx.save();
  ctx.strokeStyle = game.mode === 'versus' ? COL.p1 : COL.cyan;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(game.mouseX, game.mouseY, 9, 0, Math.PI * 2);
  ctx.moveTo(game.mouseX - 14, game.mouseY);
  ctx.lineTo(game.mouseX - 4, game.mouseY);
  ctx.moveTo(game.mouseX + 4, game.mouseY);
  ctx.lineTo(game.mouseX + 14, game.mouseY);
  ctx.moveTo(game.mouseX, game.mouseY - 14);
  ctx.lineTo(game.mouseX, game.mouseY - 4);
  ctx.moveTo(game.mouseX, game.mouseY + 4);
  ctx.lineTo(game.mouseX, game.mouseY + 14);
  ctx.stroke();
  ctx.restore();
}
function drawFloats() {
  game.particles.forEach((p) => {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  game.floats.forEach((f) => {
    ctx.globalAlpha = Math.max(0, f.life / f.max);
    text(f.text, f.x, f.y, '800 20px ' + UI, f.color, 'center');
    ctx.globalAlpha = 1;
  });
}

function drawTitle() {
  const grad = ctx.createLinearGradient(280, 0, 1000, 0);
  grad.addColorStop(0, COL.cyan);
  grad.addColorStop(1, COL.magenta);
  ctx.font = '800 54px ' + UI;
  ctx.fillStyle = grad;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('EQUATION FORGE', W / 2, 68);
  text('WORD-TO-WIRE TRANSLATOR', W / 2, 112, '800 16px ' + UI, COL.ink, 'center');
  text('Secondary 2  ·  simultaneous linear equations from words and diagrams', W / 2, 140, '600 14px ' + UI, COL.dim, 'center');
  const cards = [
    ['SOLO TRANSLATOR', 'Mouse, keyboard, or one 8BitDo.', '3 forge shields', 'One solo score', 'solo'],
    ['2P CO-OP TEAM', 'Pad 0 and pad 1, or two keyboards.', '4 shared shields', 'One team score only', 'coop'],
    ['2P VERSUS', 'Same controls, head to head.', 'Shields and stars each', 'First lock takes the step', 'versus']
  ];
  const geom = titleGeom();
  cards.forEach((card, i) => {
    const r = geom[i];
    const on = game.titleSel === i || (game.mouseMoved && hit(game.mouseX, game.mouseY, r));
    panel(r.x, r.y, r.w, r.h, on ? COL.cyan : 'rgba(130,190,220,0.25)');
    const color = i === 1 ? COL.magenta : (i === 2 ? COL.gold : COL.cyan);
    text(card[0], r.x + 20, r.y + 36, '800 18px ' + UI, color, 'left');
    wrap(card[1], '600 14px ' + UI, 320).forEach((line, li) => text(line, r.x + 20, r.y + 68 + li * 18, '600 14px ' + UI, COL.ink, 'left'));
    text(card[2], r.x + 20, r.y + 124, '700 14px ' + UI, COL.gold, 'left');
    text(card[3], r.x + 20, r.y + 148, '700 14px ' + UI, COL.dim, 'left');
  });
  const steps = [
    ['1', 'Forge equation 1 from the cyan clue.'],
    ['2', 'Forge equation 2 from the magenta clue.'],
    ['3', 'Solve the system and answer the final question.']
  ];
  steps.forEach((s, i) => {
    const x = 70 + i * 400;
    panel(x, 400, 376, 92, 'rgba(130,190,220,0.2)');
    text(s[0], x + 28, 446, '800 28px ' + UI, i === 2 ? COL.gold : (i === 0 ? COL.cyan : COL.magenta), 'center');
    wrap(s[1], '600 15px ' + UI, 280).forEach((line, li) => text(line, x + 58, 434 + li * 20, '600 15px ' + UI, COL.ink, 'left'));
  });
  text('A wrong card costs one shield and shows the translation trap. A sealed contract pays +350 points.', W / 2, 524, '600 14px ' + UI, COL.dim, 'center');
  text('Solo: mouse, WASD or arrows, Space.   Coop/Versus: P1 WASD+F, P2 arrows+Enter.', W / 2, 608, '600 14px ' + UI, COL.ink, 'center');
  text('8BitDo in XInput: D-pad or stick moves, bottom or right face button confirms. M mutes. P pauses.', W / 2, 634, '600 13px ' + UI, COL.dim, 'center');
  const linked = game.padOn.filter(Boolean).length;
  text(linked ? linked + ' gamepad' + (linked > 1 ? 's' : '') + ' linked' : 'No gamepad yet — keyboard and mouse are ready', W / 2, 668, '700 13px ' + UI, linked ? COL.good : COL.dim, 'center');
  const best = game.best.solo || game.best.coop || game.best.versus;
  if (best) text('BEST ' + best, 36, 692, '800 12px ' + UI, COL.amber, 'left');
  drawMuteButton();
}

function drawOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(4, 8, 14, 0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  panel(180, 70, 920, 570, COL.bad);
  text('FORGE OFFLINE', W / 2, 120, '800 32px ' + UI, COL.bad, 'center');
  text(game.overReason, W / 2, 158, '600 16px ' + UI, COL.ink, 'center');
  const scoreLine = game.mode === 'versus'
    ? 'P1  ' + game.pScore[0] + '   ★ ' + game.stars[0] + '      P2  ' + game.pScore[1] + '   ★ ' + game.stars[1]
    : ((game.mode === 'coop' ? 'TEAM SCORE ' : 'SOLO SCORE ') + game.score);
  text(scoreLine, W / 2, 198, '800 20px ' + UI, COL.gold, 'center');
  text('Contracts sealed  ' + game.cleared + '    ·    Best  ' + (game.best[game.mode] || 0), W / 2, 230, '700 15px ' + UI, COL.dim, 'center');
  if (game.problem) {
    text(game.problem.kicker, W / 2, 272, '800 13px ' + UI, COL.amber, 'center');
    (game.problem.worked || []).slice(0, 4).forEach((line, i) => {
      const size = fitSize(line, 820, 16, 12);
      text(line, W / 2, 308 + i * 26, '700 ' + size + 'px ' + MONO, COL.ink, 'center');
    });
  }
  if (game.tip) {
    wrap(game.tip, '600 14px ' + UI, 760).slice(0, 3).forEach((line, i) => {
      text(line, W / 2, 430 + i * 18, '600 14px ' + UI, '#ffd0d6', 'center');
    });
  }
  button(390, 560, 240, 52, 'TITLE', COL.dim);
  button(650, 560, 240, 52, 'FORGE AGAIN', COL.cyan);
}
function drawPause() {
  ctx.save();
  ctx.fillStyle = 'rgba(4, 8, 14, 0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  panel(390, 230, 500, 240, COL.cyan);
  text('DISPATCH PAUSED', W / 2, 290, '800 26px ' + UI, COL.ink, 'center');
  text('P resumes. The contract stays on the bench.', W / 2, 332, '600 14px ' + UI, COL.dim, 'center');
  button(490, 390, 300, 52, 'RESUME', COL.cyan);
}
function button(x, y, w, h, label, color) {
  const hot = game.mouseMoved && hit(game.mouseX, game.mouseY, { x, y, w, h });
  roundRect(x, y, w, h, 10);
  ctx.fillStyle = 'rgba(8, 18, 32, 0.96)';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = hot ? 3 : 1.5;
  ctx.stroke();
  text(label, x + w / 2, y + h / 2, '800 16px ' + UI, color, 'center');
}

function drawFatal() {
  if (!ctx) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#3a1020';
  ctx.fillRect(0, 0, canvas.width, 80);
  ctx.font = '16px monospace';
  ctx.fillStyle = '#ffd0d6';
  ctx.textAlign = 'left';
  ctx.fillText(String(game.fatal).slice(0, 180), 12, 28);
}

function draw() {
  const dpr = canvas.width / Math.max(1, window.innerWidth);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  ctx.fillStyle = '#070d16';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const ox = (window.innerWidth - W * s) / 2;
  const oy = (window.innerHeight - H * s) / 2;
  game.view = { s, ox, oy };
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  if (game.shake > 0) ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  drawBackground();
  if (game.screen === 'title') drawTitle();
  else {
    drawHUD();
    drawBrief();
    drawStage();
    drawDeck();
    drawFloats();
    if (game.screen === 'play' && !game.paused) drawCrosshair();
    if (game.screen === 'over') drawOver();
    if (game.paused) drawPause();
  }
  ctx.restore();
  const clickable = game.screen !== 'play' || game.paused || hit(game.mouseX, game.mouseY, GEO.mute);
  canvas.style.cursor = game.screen === 'play' && !game.paused && game.mouseMoved && !clickable ? 'none' : 'default';
}

function update(dt) {
  pollInput();
  if (pointerEdge && hit(game.mouseX, game.mouseY, GEO.mute)) toggleMute();
  if (game.screen === 'play' && !game.paused) advance(dt);
  else game.time += dt;
  tickMusic();
  if (audio.music) audio.music.gain.value = game.paused || audio.muted ? 0 : 0.55;
}

let lastTs = 0;
function frame(now) {
  const dt = Math.min(0.05, lastTs ? (now - lastTs) / 1000 : 0.016);
  lastTs = now;
  try {
    update(dt);
    draw();
    game.fatal = '';
  } catch (err) {
    game.fatal = err && err.stack ? err.stack : String(err);
    if (typeof console !== 'undefined') console.error(err);
    try { drawFatal(); } catch (e2) { /* ignore */ }
  }
  keyEdge.clear();
  pointerEdge = false;
  requestAnimationFrame(frame);
}

function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  try {
    const saved = localStorage.getItem('equation-forge-best');
    if (saved) game.best = JSON.parse(saved) || {};
  } catch (err) { game.best = {}; }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', (e) => {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].indexOf(e.code) >= 0) e.preventDefault();
    if (e.repeat) return;
    keysDown.add(e.code);
    keyEdge.add(e.code);
    resumeAudio();
  });
  window.addEventListener('keyup', (e) => keysDown.delete(e.code));
  canvas.addEventListener('mousemove', (e) => {
    const p = worldFromClient(e.clientX, e.clientY);
    game.mouseX = p.x;
    game.mouseY = p.y;
    game.mouseIn = true;
    game.mouseMoved = true;
    if (game.screen === 'play' && game.phase === 'play') {
      const deck = deckGeom();
      const who = clickPlayer();
      for (let i = 0; i < deck.cards.length; i++) {
        if (hit(p.x, p.y, deck.cards[i])) game.sel[who] = i;
      }
    }
    if (game.screen === 'title') {
      titleGeom().forEach((card, i) => { if (hit(p.x, p.y, card)) game.titleSel = i; });
    }
  });
  canvas.addEventListener('mouseleave', () => { game.mouseIn = false; });
  canvas.addEventListener('mousedown', (e) => {
    const p = worldFromClient(e.clientX, e.clientY);
    game.mouseX = p.x;
    game.mouseY = p.y;
    pointerEdge = true;
    pointerDown = true;
    resumeAudio();
  });
  window.addEventListener('mouseup', () => { pointerDown = false; });
  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    const p = worldFromClient(t.clientX, t.clientY);
    game.mouseX = p.x;
    game.mouseY = p.y;
    game.mouseMoved = true;
    pointerEdge = true;
    resumeAudio();
    e.preventDefault();
  }, { passive: false });
  requestAnimationFrame(frame);
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
}
function inside(inner, outer) {
  return inner.x >= outer.x - 0.1 && inner.y >= outer.y - 0.1 && inner.x + inner.w <= outer.x + outer.w + 0.1 && inner.y + inner.h <= outer.y + outer.h + 0.1;
}

function forgeTest() {
  const fails = [];
  const arches = {};
  let backups = 0;
  let n = 0;
  const pos = [0, 0, 0, 0];
  Object.keys(GENS).forEach((arch) => {
    const round = arch === 'H' || arch === 'I' ? 8 : arch === 'F' || arch === 'G' ? 6 : arch === 'D' || arch === 'E' ? 4 : 2;
    for (let i = 0; i < 12; i++) {
      const p = GENS[arch](Math.random, round);
      n++;
      if (!p) { fails.push('null ' + arch); continue; }
      const reason = verify(p);
      if (reason) fails.push(reason + ' :: ' + p.key);
      if (p.backup) backups++;
      arches[p.arch] = (arches[p.arch] || 0) + 1;
      p.steps.forEach((step) => {
        const idx = step.cards.findIndex((c) => c.correct);
        if (idx >= 0) pos[idx]++;
      });
    }
  });
  const hist = [];
  const seq = [];
  for (let round = 1; round <= 18; round++) {
    const p = generateProblem(round, hist);
    if (!p) { fails.push('play-null ' + round); continue; }
    const reason = verify(p);
    if (reason) fails.push('play ' + reason);
    if (hist.some((h) => h.key === p.key)) fails.push('repeat ' + p.key);
    if (hist.length && hist[hist.length - 1].arch === p.arch && tierOf(round).arches.length > 1) fails.push('adjacent ' + p.arch);
    hist.push({ arch: p.arch, key: p.key });
    if (hist.length > 6) hist.shift();
    seq.push(p.arch);
  }
  const deck = deckGeom();
  const siblings = [GEO.hud, GEO.brief, GEO.stage, GEO.deck];
  for (let i = 0; i < siblings.length; i++) {
    const r = siblings[i];
    if (r.x < 0 || r.y < 0 || r.x + r.w > W || r.y + r.h > H) fails.push('offscreen panel ' + i);
    for (let j = i + 1; j < siblings.length; j++) if (rectsOverlap(r, siblings[j])) fails.push('panel overlap ' + i + ' ' + j);
  }
  if (!inside(GEO.forge, GEO.stage) || !inside(GEO.schem, GEO.stage)) fails.push('stage children');
  if (rectsOverlap(GEO.forge, GEO.schem)) fails.push('forge/schem overlap');
  if (!inside(GEO.mute, GEO.hud)) fails.push('mute');
  deck.cards.forEach((card, i) => {
    if (!inside(card, GEO.deck)) fails.push('card out ' + i);
    if (rectsOverlap(card, deck.execute)) fails.push('card/exec ' + i);
    for (let j = i + 1; j < deck.cards.length; j++) if (rectsOverlap(card, deck.cards[j])) fails.push('cards overlap');
  });
  if (!inside(deck.execute, GEO.deck)) fails.push('exec out');
  if (rectsOverlap(deck.prompt, deck.cards[0])) fails.push('prompt overlap');
  const spread = pos.filter((c) => c > 0).length;
  if (spread < 4) fails.push('shuffle slots ' + pos.join(','));
  return { fails, n, backups, pos, arches, seq };
}

if (typeof window !== 'undefined') {
  window.__forgeTest = forgeTest;
  window.__forge = {
    game, startMode, generateProblem, verify, GENS, GEO, deckGeom, ownerFor, confirm
  };
  boot();
}
</script>
