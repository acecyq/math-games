<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Prism Breaker: Parallel & Crook Laser Lab</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060a12;
    font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    color: #e6f1ff;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
(() => {
  'use strict';

  // ============================================================================
  // 1. CANVAS SETUP & HIGH-DPI SCALING
  // ============================================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth;
  let H = window.innerHeight;
  let DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ============================================================================
  // 2. PROCEDURAL WEB AUDIO SYNTHESIZER (CHIPTUNE BGM + OPTICAL SFX)
  // ============================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.unlocked = false;
      this.bgmTimer = null;
      this.stepIdx = 0;
      this.masterGain = null;
      this.bgmGain = null;
      this.sfxGain = null;
    }

    unlock() {
      if (this.unlocked) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = this.muted ? 0 : 0.85;
        this.masterGain.connect(this.ctx.destination);

        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.value = 0.08;
        this.bgmGain.connect(this.masterGain);

        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.32;
        this.sfxGain.connect(this.masterGain);

        this.unlocked = true;
        this.startBGM();
      } catch (e) {
        // Ignore audio restrictions if blocked
      }
    }

    toggleMute() {
      this.unlock();
      this.muted = !this.muted;
      if (this.masterGain && this.ctx) {
        this.masterGain.gain.setTargetAtTime(this.muted ? 0 : 0.85, this.ctx.currentTime, 0.02);
      }
      return this.muted;
    }

    startBGM() {
      if (this.bgmTimer) return;
      // Upbeat sci-fi arpeggio (D minor / Dorian optical lab groove)
      const arpNotes = [
        293.66, 349.23, 440.00, 523.25,
        293.66, 349.23, 440.00, 587.33,
        261.63, 329.63, 392.00, 493.88,
        220.00, 261.63, 329.63, 440.00
      ];
      const bassNotes = [
        146.83, 146.83, 146.83, 146.83,
        146.83, 146.83, 146.83, 146.83,
        130.81, 130.81, 130.81, 130.81,
        110.00, 110.00, 110.00, 110.00
      ];

      this.bgmTimer = setInterval(() => {
        if (!this.unlocked || this.muted || !this.ctx || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;
        const idx = this.stepIdx % arpNotes.length;

        // Pluck Arp
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(arpNotes[idx], now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(gain);
        gain.connect(this.bgmGain);
        osc.start(now);
        osc.stop(now + 0.17);

        // Bass pulse on quarter notes
        if (idx % 2 === 0) {
          const bOsc = this.ctx.createOscillator();
          const bGain = this.ctx.createGain();
          bOsc.type = 'sine';
          bOsc.frequency.setValueAtTime(bassNotes[idx], now);
          bGain.gain.setValueAtTime(0.001, now);
          bGain.gain.linearRampToValueAtTime(0.24, now + 0.02);
          bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          bOsc.connect(bGain);
          bGain.connect(this.bgmGain);
          bOsc.start(now);
          bOsc.stop(now + 0.3);
        }
        this.stepIdx++;
      }, 190);
    }

    playTick(pitch = 680) {
      if (!this.unlocked || this.muted || !this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(pitch, now);
      osc.frequency.exponentialRampToValueAtTime(pitch * 1.25, now + 0.045);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain);
      gain.connect(this.sfxGain);
      osc.start(now);
      osc.stop(now + 0.055);
    }

    playStepLock(stepNum) {
      if (!this.unlocked || this.muted || !this.ctx) return;
      const now = this.ctx.currentTime;
      const base = stepNum === 1 ? 523.25 : 659.25;
      [base, base * 1.25, base * 1.5].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.055);
        gain.gain.setValueAtTime(0.22, now + i * 0.055);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.055 + 0.18);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(now + i * 0.055);
        osc.stop(now + i * 0.055 + 0.19);
      });
    }

    playLaserBlast() {
      if (!this.unlocked || this.muted || !this.ctx) return;
      const now = this.ctx.currentTime;
      // High-energy laser sweep + harmonic chime
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1250, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.34);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(this.sfxGain);
      osc.start(now);
      osc.stop(now + 0.36);

      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const cOsc = this.ctx.createOscillator();
        const cGain = this.ctx.createGain();
        cOsc.type = 'sine';
        cOsc.frequency.setValueAtTime(freq, now + 0.06 + i * 0.06);
        cGain.gain.setValueAtTime(0.22, now + 0.06 + i * 0.06);
        cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.38 + i * 0.06);
        cOsc.connect(cGain);
        cGain.connect(this.sfxGain);
        cOsc.start(now + 0.06 + i * 0.06);
        cOsc.stop(now + 0.4 + i * 0.06);
      });
    }

    playError() {
      if (!this.unlocked || this.muted || !this.ctx) return;
      const now = this.ctx.currentTime;
      [165, 130].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + i * 0.1);
        gain.gain.setValueAtTime(0.26, now + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.22);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(now + i * 0.1);
        osc.stop(now + i * 0.1 + 0.24);
      });
    }
  }

  const sfx = new SoundEngine();

  // ============================================================================
  // 3. MATH & GEOMETRY UTILITIES + FRACTION / EXPRESSION RENDERER
  // ============================================================================
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function formatLinear(a, b, varName = 'x', withDeg = false) {
    let str = '';
    if (a === 1) str = varName;
    else if (a === -1) str = '-' + varName;
    else str = `${a}${varName}`;
    if (b > 0) str += ` + ${b}`;
    else if (b < 0) str += ` - ${Math.abs(b)}`;
    return withDeg ? `(${str})°` : str;
  }

  /**
   * Renders mathematical strings with stacked fractions (e.g. `x/2` or `5x/6`)
   * cleanly centered at (cx, cy) on the HTML5 Canvas.
   */
  function drawMathText(ctx, text, cx, cy, fontSize = 16, color = '#ffffff', bold = true, maxWidth = 340) {
    ctx.save();
    const weight = bold ? '700' : '500';
    ctx.font = `${weight} ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
    ctx.fillStyle = color;
    ctx.strokeStyle = color;

    // Tokenize fractions of form [0-9]*[a-zA-Z]?/[0-9]+
    const fracRegex = /([0-9]*[a-zA-Z]?)\/([0-9]+)/g;
    if (!fracRegex.test(text)) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Auto-scale font if wider than maxWidth
      let w = ctx.measureText(text).width;
      if (w > maxWidth && maxWidth > 40) {
        const scaled = Math.max(11, Math.floor(fontSize * (maxWidth / w)));
        ctx.font = `${weight} ${scaled}px 'Segoe UI', system-ui, sans-serif`;
      }
      ctx.fillText(text, cx, cy);
      ctx.restore();
      return;
    }

    // Parse tokens for stacked fraction rendering
    fracRegex.lastIndex = 0;
    const tokens = [];
    let lastIdx = 0;
    let match;
    while ((match = fracRegex.exec(text)) !== null) {
      if (match.index > lastIdx) {
        tokens.push({ type: 'text', val: text.slice(lastIdx, match.index) });
      }
      tokens.push({ type: 'frac', num: match[1] || '1', den: match[2] });
      lastIdx = fracRegex.lastIndex;
    }
    if (lastIdx < text.length) {
      tokens.push({ type: 'text', val: text.slice(lastIdx) });
    }

    const subSize = Math.max(10, Math.round(fontSize * 0.76));
    let totalW = 0;
    tokens.forEach(t => {
      if (t.type === 'text') {
        ctx.font = `${weight} ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
        t.w = ctx.measureText(t.val).width;
      } else {
        ctx.font = `${weight} ${subSize}px 'Segoe UI', system-ui, sans-serif`;
        t.w = Math.max(ctx.measureText(t.num).width, ctx.measureText(t.den).width) + 6;
      }
      totalW += t.w;
    });

    const scale = totalW > maxWidth && maxWidth > 40 ? maxWidth / totalW : 1;
    let curX = cx - (totalW * scale) / 2;

    tokens.forEach(t => {
      const tw = t.w * scale;
      if (t.type === 'text') {
        ctx.font = `${weight} ${Math.round(fontSize * scale)}px 'Segoe UI', system-ui, sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.val, curX, cy);
      } else {
        const sFont = Math.round(subSize * scale);
        ctx.font = `${weight} ${sFont}px 'Segoe UI', system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(t.num, curX + tw / 2, cy - 2 * scale);

        ctx.lineWidth = Math.max(1.2, 1.6 * scale);
        ctx.beginPath();
        ctx.moveTo(curX + 2 * scale, cy);
        ctx.lineTo(curX + tw - 2 * scale, cy);
        ctx.stroke();

        ctx.textBaseline = 'top';
        ctx.fillText(t.den, curX + tw / 2, cy + 2 * scale);
      }
      curX += tw;
    });

    ctx.restore();
  }

  // ============================================================================
  // 4. PROCEDURAL PROBLEM GENERATOR (SINGAPORE SEC 1 G3 TOPIC 10)
  // ============================================================================
  class ProblemGenerator {
    constructor() {
      this.history = [];
    }

    isDuplicate(sig) {
      return this.history.includes(sig);
    }

    pushHistory(sig) {
      this.history.push(sig);
      if (this.history.length > 6) {
        this.history.shift();
      }
    }

    generate(roundNumber) {
      let problem = null;
      let attempts = 0;
      while (!problem && attempts < 25) {
        attempts++;
        let candidate = null;
        if (roundNumber <= 2) {
          candidate = Math.random() < 0.5 ? this.genRound1_IntersectingLines() : this.genRound1_ParallelTransversal();
        } else if (roundNumber <= 4) {
          const r = randInt(1, 3);
          if (r === 1) candidate = this.genRound3_TriangleExterior();
          else if (r === 2) candidate = this.genRound3_BowTieTriangles();
          else candidate = this.genRound3_IsoscelesRightCorner();
        } else if (roundNumber <= 6) {
          candidate = Math.random() < 0.55 ? this.genRound5_OneBendCrook() : this.genRound5_TwoBendCrook();
        } else {
          candidate = Math.random() < 0.55 ? this.genRound7_SawtoothWave() : this.genRound7_CoupledParallelXY();
        }
        if (candidate && !this.isDuplicate(candidate.sig)) {
          this.pushHistory(candidate.sig);
          problem = candidate;
        }
      }
      if (!problem) {
        problem = this.genRound5_OneBendCrook();
      }
      // Shuffle choices for all 3 steps while preserving correctness & trap metadata
      problem.steps.forEach(step => {
        step.choices = shuffle(step.choices);
      });
      return problem;
    }

    // --------------------------------------------------------------------------
    // TIER 1 (ROUNDS 1-2): INTERSECTING STRAIGHT LINES & POINT ANGLES
    // --------------------------------------------------------------------------
    genRound1_IntersectingLines() {
      const subType = Math.random() < 0.5 ? 'vert_opp' : 'point_360';
      if (subType === 'vert_opp') {
        // (ax - b)° = 90° + c° (vertically opposite angles)
        const x = randInt(24, 46);
        const a = pick([3, 4, 5]);
        const c = randInt(28, 64);
        const rhs = 90 + c;
        const b = a * x - rhs;
        if (b <= 4 || b >= 60) return null;

        const expr = formatLinear(a, -b, 'x', true);
        const exprNoDeg = formatLinear(a, -b, 'x', false);
        const sig = `r1_vo_${a}_${b}_${c}`;

        const trapNo90 = Math.round((c + b) / a);
        const trap180 = Math.round((180 - rhs + b) / a);

        return {
          sig,
          tierName: 'TIER 1 • INTERSECTING LINES',
          type: 'intersecting_vo',
          givens: `Lines PQ and RS intersect at M. A right-angle square (90°) is marked at M. Find x.`,
          params: { a, b, c, x, expr },
          steps: [
            {
              prompt: 'STEP 1: IDENTIFY THE GEOMETRIC RELATION AT VERTEX M',
              choices: [
                { text: 'Vert. Opp. ∠s (with 90° square)', correct: true },
                { text: 'Adj. ∠s on a str. line = 180°', correct: false, trap: 'Look across vertex M: the two opposite sectors share the same intersecting lines, so they are Vertically Opposite (equal), not supplementary!' },
                { text: 'Alt. ∠s, AB // CD', correct: false, trap: 'There are no parallel lines here — only two intersecting straight lines meeting at vertex M!' },
                { text: 'Vert. Opp. ∠s (ignoring 90°)', correct: false, trap: 'Check every symbol at vertex M! The small square marks a 90° right angle that must be included in the opposite sector!' }
              ]
            },
            {
              prompt: 'STEP 2: FORGE THE ALGEBRAIC ANGLE EQUATION',
              choices: [
                { text: `${exprNoDeg} = 90 + ${c}`, correct: true },
                { text: `${exprNoDeg} = ${c}`, correct: false, trap: 'Check every symbol at vertex M! The small square marks a 90° right angle, so the opposite angle is 90° + ' + c + '°!' },
                { text: `${exprNoDeg} + 90 + ${c} = 180`, correct: false, trap: 'Vertically opposite angles are EQUAL to each other — they do not add up to 180°!' },
                { text: `${exprNoDeg} + ${c} = 90`, correct: false, trap: 'These angles are vertically opposite across M, not complementary!' }
              ]
            },
            {
              prompt: 'STEP 3: SOLVE FOR x TO ALIGN THE PRISM BEAM',
              choices: [
                { text: `x = ${x}`, correct: true },
                { text: `x = ${trapNo90}`, correct: false, trap: `You forgot the 90° right-angle square! Add 90° + ${c}° = ${rhs}° before solving ${exprNoDeg} = ${rhs}.` },
                { text: `x = ${x - Math.round((2 * b) / a)}`, correct: false, trap: `Watch your sign when transposing -${b}! Add ${b} to both sides: ${a}x = ${rhs} + ${b} = ${a * x}.` },
                { text: `x = ${trap180 || x + 6}`, correct: false, trap: `Vertically opposite angles are equal (${exprNoDeg} = ${rhs}), not supplementary to 180°!` }
              ]
            }
          ]
        };
      } else {
        // Angles at a point: kx° + kx° + 90° + d° = 360°
        const k = pick([2, 3, 4]);
        const x = randInt(16, 32);
        const d = 360 - 90 - 2 * k * x;
        if (d < 45 || d > 175) return null;

        const sig = `r1_pt_${k}_${x}_${d}`;
        const wrongNo90 = Math.round((360 - d) / (2 * k));
        const wrong180 = Math.max(5, Math.round((180 - d) / (2 * k)));

        return {
          sig,
          tierName: 'TIER 1 • ANGLES AT A POINT',
          type: 'point_360',
          givens: `Four rays meet at point M, including a 90° right-angle square and two equal ${k}x° sectors. Find x.`,
          params: { k, x, d },
          steps: [
            {
              prompt: 'STEP 1: IDENTIFY THE ANGLE PROPERTY AT POINT M',
              choices: [
                { text: '∠s at a pt = 360° (incl. 90°)', correct: true },
                { text: 'Adj. ∠s on a str. line = 180°', correct: false, trap: 'The sectors wrap completely around point M! A full revolution around a point is 360°, not 180°!' },
                { text: '∠s at a pt = 360° (omit 90°)', correct: false, trap: 'Check every symbol at vertex M! The small square marks a 90° right angle, and all angles around point M sum to 360°!' },
                { text: 'Vert. Opp. ∠s are equal', correct: false, trap: 'These four rays do not form two straight crossing lines — sum all angles around point M to 360°!' }
              ]
            },
            {
              prompt: 'STEP 2: FORGE THE ALGEBRAIC ANGLE EQUATION',
              choices: [
                { text: `${k}x + ${k}x + 90 + ${d} = 360`, correct: true },
                { text: `${k}x + ${k}x + ${d} = 360`, correct: false, trap: 'Check every symbol at vertex M! The small square marks a 90° right angle, and all angles around point M sum to 360°!' },
                { text: `${k}x + 90 + ${d} = 360`, correct: false, trap: `There are TWO ${k}x° sectors at point M! Include both: ${k}x + ${k}x + 90 + ${d} = 360.` },
                { text: `${k}x + ${k}x + 90 + ${d} = 180`, correct: false, trap: 'A full circle around point M equals 360°, not 180°!' }
              ]
            },
            {
              prompt: 'STEP 3: SOLVE FOR x TO ENERGIZE THE CORE',
              choices: [
                { text: `x = ${x}`, correct: true },
                { text: `x = ${wrongNo90}`, correct: false, trap: `You omitted the 90° right-angle square! Subtract 90° as well: ${2 * k}x = 360 - 90 - ${d} = ${2 * k * x}.` },
                { text: `x = ${x * 2}`, correct: false, trap: `Remember to combine ${k}x + ${k}x = ${2 * k}x before dividing!` },
                { text: `x = ${wrong180}`, correct: false, trap: `All angles around point M sum to 360°, not 180°!` }
              ]
            }
          ]
        };
      }
    }

    // --------------------------------------------------------------------------
    // TIER 1 (ROUNDS 1-2): SINGLE-TRANSVERSAL PARALLEL LINES (AB // CD)
    // --------------------------------------------------------------------------
    genRound1_ParallelTransversal() {
      const isInterior = Math.random() < 0.55;
      if (isInterior) {
        // Interior angles (C-shape): (x - b)° + c° + d° = 180°
        const x = randInt(48, 88);
        const b = randInt(8, 22);
        const c = randInt(38, 62);
        const d = 180 - (x - b) - c;
        if (d < 42 || d > 78) return null;

        const expr = formatLinear(1, -b, 'x', true);
        const exprNoDeg = formatLinear(1, -b, 'x', false);
        const sig = `r1_par_int_${b}_${c}_${d}`;
        const trapEqual = d - c + b;

        return {
          sig,
          tierName: 'TIER 1 • PARALLEL TRANSVERSAL',
          type: 'parallel_interior',
          givens: `Parallel rails AB // CD are cut by a transversal. Interior C-shape angles are ${expr}, ${c}°, and ${d}°. Find x.`,
          params: { x, b, c, d, expr },
          steps: [
            {
              prompt: 'STEP 1: IDENTIFY THE PARALLEL LINE PROPERTY (AB // CD)',
              choices: [
                { text: 'Int. ∠s, AB // CD (C-shape = 180°)', correct: true },
                { text: 'Alt. ∠s, AB // CD (Z-shape equal)', correct: false, trap: 'Those angles lie on the SAME side of the transversal between parallel lines (C-shape) — interior angles add up to 180°, they are NOT equal!' },
                { text: 'Corr. ∠s, AB // CD (F-shape equal)', correct: false, trap: 'Corresponding F-shape angles sit in matching positions on the same side of the transversal, whereas these are trapped inside between AB and CD (C-shape = 180°)!' },
                { text: 'Vert. Opp. ∠s are equal', correct: false, trap: 'These angles sit at two different intersections along the transversal between AB // CD!' }
              ]
            },
            {
              prompt: 'STEP 2: FORGE THE ALGEBRAIC ANGLE EQUATION',
              choices: [
                { text: `${exprNoDeg} + ${c} + ${d} = 180`, correct: true },
                { text: `${exprNoDeg} + ${c} = ${d}`, correct: false, trap: 'Those angles lie on the SAME side of the transversal between parallel lines (C-shape) — interior angles add up to 180°, they are NOT equal!' },
                { text: `${exprNoDeg} + ${c} + ${d} = 360`, correct: false, trap: 'Co-interior C-shape angles between parallel lines sum to 180°, not 360°!' },
                { text: `x + ${b} + ${c} + ${d} = 180`, correct: false, trap: `Check the sign inside ${expr}: it is x - ${b}, not x + ${b}!` }
              ]
            },
            {
              prompt: 'STEP 3: SOLVE FOR x TO FIRE THE BEAM',
              choices: [
                { text: `x = ${x}`, correct: true },
                { text: `x = ${trapEqual > 0 ? trapEqual : x - 18}`, correct: false, trap: 'Those angles lie on the SAME side of the transversal between parallel lines (C-shape) — interior angles add up to 180°, they are NOT equal!' },
                { text: `x = ${x - 2 * b}`, correct: false, trap: `Watch the minus sign! (x - ${b}) + ${c + d} = 180 gives x + ${c + d - b} = 180, so x = ${x}.` },

    genRound3_IsoscelesRightCorner() {

      const sig = `r3_isos_${a}_${b}_${c}_${d}`;
      const trapUseComp = Math.max(4, Math.round((180 - baseAngle - comp + b) / a));
      const trapNoDiv2 = Math.max(4, Math.round((180 - (180 - c) - 90 + b) / a));

      return {

        givens: `An isosceles prism (apex ${c}°, equal-side tick marks) meets a 90° right-angle corner (a ${d}° ray splits that corner) along a straight base line with ${expr}. Find x.`,

            ]
          },
          {
            prompt: 'STEP 3: SOLVE FOR x TO STABILIZE THE PRISM',
            choices: [
              { text: `x = ${x}`, correct: true },
              { text: `x = ${trapNoDiv2}`, correct: false, trap: `You forgot ÷ 2 for the isosceles base angle! Each base angle is (180° - ${c}°) ÷ 2 = ${baseAngle}°.` },
              { text: `x = ${trapUseComp}`, correct: false, trap: `Don't replace the right angle with only 90° - ${d}° = ${comp}° — the full 90° corner sits on the straight line!` },
              { text: `x = ${Math.max(4, Math.round((targetAngle - b) / a))}`, correct: false, trap: `Transpose -${b} by adding ${b}: ${a}x = ${targetAngle} + ${b} = ${a * x}.` }

      if (!Number.isInteger(totalRight) || totalRight < 60 || totalRight > 130) return null;

        type: 'sawtooth',

              { text: 'Sum of Left ∠s = Sum of Right ∠s (Aux. Rays)', correct: true },
              { text: 'All sawtooth angles sum to 360°', correct: false, trap: 'Firing auxiliary parallel rays through each tooth splits every peak into Alternate Z-angles: Sum of left-pointing ∠s = Sum of right-pointing ∠s!' },
