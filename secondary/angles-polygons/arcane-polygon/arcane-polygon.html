function extOf(n) {

function sideLengths(interiors) {
  const n = interiors.length;
  const U = [];
  let h = 0;
  for (let i = 0; i < n; i++) {
    U.push({ x: Math.cos(h), y: Math.sin(h) });

  let sy = 0;
  let a00 = 0;
  let a01 = 0;
  let a11 = 0;

    sx += U[i].x;
    sy += U[i].y;
    a00 += U[i].x * U[i].x;
    a01 += U[i].x * U[i].y;
    a11 += U[i].y * U[i].y;

  if (Math.abs(det) < 1e-8) return null;

  const b1 = -sy;

function irregularPoints(interiors) {

  let y = 0;
  for (let i = 0; i < interiors.length; i++) {
    pts.push({ x: x, y: y });
    x += sol.U[i].x * sol.L[i];
    y += sol.U[i].y * sol.L[i];

function regularPoints(n) {
  const pts = [];
  const rot = -Math.PI / 2;

function lineIntersect(a, b, c, d) {

  const t = ((a.x - c.x) * (c.y - d.y) - (a.y - c.y) * (c.x - d.x)) / den;
  return { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y), t: t };

  const T = pts[3];

function buildTables() {
  GAP_PAIRS = [];

    for (let j = i; j < JOIN.length; j++) {
      const a = JOIN[i];
      const b = JOIN[j];
      const ia = intOf(a);
      const ib = intOf(b);
      const x = 360 - ia - ib;
      if (x >= 36 && x <= 150 && x !== ia && x !== ib) {
        GAP_PAIRS.push({ a: a, b: b, ia: ia, ib: ib, x: x });
      }
      const R = 360 - ia - ib;
      const E = 180 - R;
      if (E > 0 && E < 180 && (360 % E) === 0) {
        const n = 360 / E;
        if (n >= 3 && n <= 24 && intOf(n) === R) {

        }

    }
  }
}
function ratioBook() {
  if (RATIO_BOOK) return RATIO_BOOK;
  const book = { 5: [], 6: [] };
  [5, 6].forEach(function (n) {
    const S = sumOf(n);
    const lim = n === 5 ? 12 : 14;
    const parts = [];
    function rec(prev) {
      if (book[n].length > 18) return;
      if (parts.length === n) {
        let U = 0;
        for (let k = 0; k < parts.length; k++) U += parts[k];
        if (S % U !== 0) return;
        const unit = S / U;
        if (unit < 9 || unit > 36) return;
        const ints = parts.map(function (p) { return p * unit; });

        for (let k = 0; k < ints.length; k++) uniq[ints[k]] = true;

        if (!sideLengths(ints)) return;
        book[n].push({ parts: parts.slice(), unit: unit, ints: ints, S: S, U: U });
        return;

      for (let p = prev + 1; p <= lim; p++) {
        parts.push(p);
        rec(p);
        parts.pop();
        if (book[n].length > 18) return;

    rec(0);
  });

  return book;

function alertWhy(trap, num) {

  }

    if (num && num.n) {
      return 'A polygon with n sides splits into (n ' + MINUS + ' 2) triangles! Subtract 2 from the number of sides BEFORE multiplying by 180' + DEG + '! Sum = (' + num.n + ' ' + MINUS + ' 2) \u00d7 180' + DEG + ' = ' + sumOf(num.n) + DEG + '.';

    return 'Interior and exterior angles at any vertex lie on a straight line and add up to 180' + DEG + '!';

function buildCards(correct, wrongs, format, num) {
  if (!Number.isInteger(correct) || correct <= 0) return null;
  const chosen = [];
  const seen = {};
  seen[correct] = true;
  for (let i = 0; i < wrongs.length && chosen.length < 3; i++) {
    const w = wrongs[i];
    if (!w || !Number.isInteger(w.value) || w.value <= 0 || w.value > 4000 || seen[w.value]) continue;
    seen[w.value] = true;
    chosen.push({
      value: w.value,
      ok: false,
      trap: w.trap || '',
      why: w.why || alertWhy(w.trap, num),
      text: format(w.value),
      spent: false

  }

  for (let i = 0; i < fillers.length && chosen.length < 3; i++) {

    seen[v] = true;

      value: v,

      text: format(v),

function nearClean(n) {

function checkProof(proof, answers) {

    if (intOf(proof.n) !== proof.I) return 'int';

    return '';

function audit(p) {

function pack(spec) {
  const num = spec.num || {};
  const c1 = buildCards(spec.a1, spec.w1, spec.f1, num);
  const c2 = buildCards(spec.a2, spec.w2, spec.f2, num);
  if (!c1 || !c2) return null;
  const problem = {
    key: spec.key,
    tier: spec.tier,
    kind: spec.kind,
    prompt: spec.prompt,
    bridge: spec.bridge,
    hint: spec.hint,
    aoeN: spec.aoeN,
    hideN: !!spec.hideN,
    answers: [spec.a1, spec.a2],

    num: num,
    diagram: spec.diagram,

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = el ? el.a : COL.gold;
  ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) {
    ctx.save();
    ctx.translate(180 + k * 420, 140 + (k % 2) * 40);
    ctx.rotate(game.time * 0.15 + k);
    const n = [6, 5, 8][k];
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = i * 2 * Math.PI / n;
      const rad = 70 + k * 16;
      const x = Math.cos(a) * rad;
      const y = Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

function arcaneAudit(perTier) {
  buildTables();
  ratioBook();
  const tiers = ['EASY', 'MEDIUM', 'HARD', 'EXTREME'];
  const report = [];
  for (let t = 0; t < tiers.length; t++) {
    const hist = [];
    let ok = 0;
    let fail = 0;
    const keys = {};
    for (let i = 0; i < perTier; i++) {
      const p = freshProblem(tiers[t], hist, Math.random);
      if (!p) { fail++; continue; }
      ok++;
      keys[p.kind] = (keys[p.kind] || 0) + 1;
      hist.push(p.key);
      if (hist.length > 8) hist.shift();
      if (p.diagram.type === 'irregular' && !irregularPoints(p.diagram.angles)) fail++;
      if (p.diagram.type === 'extended' && !extendedFigure(p.diagram.n).X) fail++;
    }
    report.push({ tier: tiers[t], ok: ok, fail: fail, kinds: keys, gaps: GAP_PAIRS.length, trios: JOIN_TRIOS.length });
  }
  return report;
}
window.__arcaneAudit = arcaneAudit;

  game.mouse.y = w.y;
  game.mouse.inside = true;
  game.click = w;
  const m = layout().mute;
  if (hit(w.x, w.y, m) && game.screen === 'play') toggleMute();
});
canvas.addEventListener('pointermove', function (e) {
  const w = worldFromEvent(e);
  game.mouse.x = w.x;
  game.mouse.y = w.y;
  game.mouse.inside = true;
});
canvas.addEventListener('pointerleave', function () { game.mouse.inside = false; });

if (!ctx) {
  document.body.textContent = 'Canvas is not available in this browser.';
} else {
  buildTables();
  ratioBook();
  resize();
  requestAnimationFrame(frame);
}
</script>
</body>
