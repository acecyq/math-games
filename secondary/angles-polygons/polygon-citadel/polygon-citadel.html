    text(line, W / 2, 260 + i * 22, '700 16px ' + UI, COL.dim, 'center');
  });
  if (game.mode === 'versus') {
    text('P1  ' + game.stars[0] + ' stars   ' + game.pScore[0] + ' pts', W / 2, 340, '800 18px ' + MONO, COL.p1, 'center');
    text('P2  ' + game.stars[1] + ' stars   ' + game.pScore[1] + ' pts', W / 2, 372, '800 18px ' + MONO, COL.p2, 'center');
    text((game.winner || 'DRAW') + '  \u00b7  ' + game.cleared + ' fortresses cleared', W / 2, 420, '700 15px ' + UI, COL.gold, 'center');
  } else {
    text(String(game.score), W / 2, 350, '800 48px ' + MONO, COL.gold, 'center');
    text((game.mode === 'coop' ? 'TEAM SCORE' : 'SOLO SCORE') + '  \u00b7  ' + game.cleared + ' CLEARED', W / 2, 410, '700 15px ' + UI, COL.dim, 'center');
  }
  const buttons = overGeom();
  roundRect(buttons.title.x, buttons.title.y, buttons.title.w, buttons.title.h, 8);
  ctx.fillStyle = 'rgba(8,20,22,0.95)';
  ctx.fill();
  ctx.strokeStyle = COL.dim;
  ctx.stroke();
  text('TITLE', buttons.title.x + buttons.title.w / 2, buttons.title.y + 24, '800 16px ' + UI, COL.ink, 'center');
  roundRect(buttons.again.x, buttons.again.y, buttons.again.w, buttons.again.h, 8);
  ctx.fillStyle = 'rgba(8,20,22,0.95)';
  ctx.fill();
  ctx.strokeStyle = COL.gold;
  ctx.stroke();
  text('FORTIFY AGAIN', buttons.again.x + buttons.again.w / 2, buttons.again.y + 24, '800 15px ' + UI, COL.gold, 'center');
}
function drawPause() {
  ctx.fillStyle = 'rgba(4, 12, 14, 0.6)';
  ctx.fillRect(0, 0, W, H);
  panel(390, 240, 500, 230, COL.cyan);
  text('CITADEL PAUSED', W / 2, 300, '800 24px ' + UI, COL.cyan, 'center');
  text('P or Esc resumes. The blueprint stays put.', W / 2, 346, '600 15px ' + UI, COL.dim, 'center');
  roundRect(490, 390, 300, 52, 8);
  ctx.strokeStyle = COL.gold;
  ctx.stroke();
  text('RESUME', W / 2, 416, '800 16px ' + UI, COL.gold, 'center');
}
function drawFatal() {
  if (!ctx) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#3a1020';
  ctx.fillRect(0, 0, canvas.width, 64);
  ctx.font = '16px monospace';
  ctx.fillStyle = '#ffd0d6';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(game.fatal).slice(0, 220), 12, 28);
}
function draw() {
  const dpr = canvas.width / Math.max(1, window.innerWidth);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  layoutView();
  ctx.save();
  ctx.translate(game.view.ox, game.view.oy);
  ctx.scale(game.view.s, game.view.s);
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  if (game.shake > 0) ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  drawBackground();
  if (game.screen === 'title') drawTitle();
  else {
    drawHUD();
    drawSpec();
    drawFigure();
    drawDeck();
    drawFloats();
    if (game.flash > 0) {
      ctx.fillStyle = 'rgba(255, 50, 80, ' + (game.flash * 0.22) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (game.screen === 'play' && !game.paused && game.phase === 'play') drawReticles();
    if (game.screen === 'over') drawOver();
    if (game.paused) drawPause();
  }
  ctx.restore();
  const overUi = game.screen !== 'play' || game.paused || hit(game.mouseX, game.mouseY, GEO.mute);
  canvas.style.cursor = game.screen === 'play' && !game.paused && game.pointerDevice === 'mouse' && !overUi ? 'none' : 'default';
}
function update(dt) {
  layoutView();
  pollInput();
  if (game.screen === 'play' && !game.paused) advance(dt);
  else game.time += dt;
  tickMusic();
}

let lastTs = 0;
function frame(now) {
  const dt = Math.min(0.05, lastTs ? (now - lastTs) / 1000 : 0.016);
  lastTs = now;
  try {
    update(dt);
    draw();
    game.fatal = '';
  } catch (err) {
    game.fatal = err && err.stack ? err.stack : String(err);
    if (typeof console !== 'undefined') console.error(err);
    try { drawFatal(); } catch (e2) { /* ignore */ }
  }
  keyEdge.clear();
  pointerEdge = false;
  requestAnimationFrame(frame);
}

function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d', { alpha: false });
  try {
    const saved = localStorage.getItem('polygon-citadel-best');
    if (saved) game.best = JSON.parse(saved) || {};
  } catch (err) { game.best = {}; }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', function (e) {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].indexOf(e.code) >= 0) e.preventDefault();
    if (e.repeat) return;
    keysDown.add(e.code);
    keyEdge.add(e.code);
    game.pointerDevice = 'key';
    resumeAudio();
  });
  window.addEventListener('keyup', function (e) { keysDown.delete(e.code); });
  canvas.addEventListener('mousemove', function (e) {
    const p = worldFromClient(e.clientX, e.clientY);
    game.mouseX = p.x;
    game.mouseY = p.y;
    game.mouseIn = true;
    game.pointerDevice = 'mouse';
    if (game.screen === 'title') {
      titleGeom().forEach(function (card, i) { if (hit(p.x, p.y, card)) game.titleSel = i; });
    }
    if (game.screen === 'play' && game.phase === 'play') {
      const deck = deckGeom();
      const who = hoverPlayer();
      game.hoverLock = hit(p.x, p.y, deck.lock);
      for (let i = 0; i < deck.cards.length; i++) {
        if (hit(p.x, p.y, deck.cards[i])) game.sel[who] = i;
      }
    }
  });
  canvas.addEventListener('mouseleave', function () { game.mouseIn = false; });
  canvas.addEventListener('mousedown', function (e) {
    const p = worldFromClient(e.clientX, e.clientY);
    game.mouseX = p.x;
    game.mouseY = p.y;
    pointerEdge = true;
    pointerDown = true;
    game.pointerDevice = 'mouse';
    resumeAudio();
  });
  window.addEventListener('mouseup', function () { pointerDown = false; });
  canvas.addEventListener('touchstart', function (e) {
    const t = e.changedTouches[0];
    const p = worldFromClient(t.clientX, t.clientY);
    game.mouseX = p.x;
    game.mouseY = p.y;
    game.pointerDevice = 'mouse';
    pointerEdge = true;
    resumeAudio();
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('gamepadconnected', function () {});
  requestAnimationFrame(frame);
}

boot();
</script>
</body>
</html>
