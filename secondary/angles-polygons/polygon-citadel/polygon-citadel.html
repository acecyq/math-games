<script>
'use strict';

/* Polygon Citadel: Interior & Exterior Fortress
   Singapore Sec 1 G3 — special quadrilaterals, interior/exterior polygon
   theorems, shared-vertex rings, extended-side triangles, nested isosceles.
   Every blueprint is procedurally generated, solved exactly, and audited. */

const H = 720;

const MONO = 'ui-monospace, Consolas, "Courier New", monospace';
const DEG = '\u00b0';
const ANG = '\u2220';

const COL = {

const GEO = {

const CLEAN_N = [5, 6, 8, 9, 10, 12, 15, 18, 20, 24];

let canvas, ctx;
const game = {

  step: 0,

  problem: null,

  mouseY: 360,
  mouseIn: false,

  hoverLock: false,

  view: { s: 1, ox: 0, oy: 0 },
  lastAward: 0,
  auxGlow: 0,
  beamT: 0,
  junctionPulse: 0
};

const keysDown = new Set();
const keyEdge = new Set();
let pointerDown = false;
let pointerEdge = false;
let frameUsed = false;
let lastAudit = '';

const audio = {

  master: null,
  music: null,
  muted: false,
  started: false,
  step: 0,
  next: 0,
  noise: null
};

const padMem = [
  { buttons: [], dx: 0, dy: 0 },
  { buttons: [], dx: 0, dy: 0 }
];

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function randInt(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function uniq(arr) {
  const seen = {};
  const out = [];
  for (let i = 0; i < arr.length; i++) {
    const k = arr[i].plain || arr[i].label || JSON.stringify(arr[i]);
    if (seen[k]) continue;
    seen[k] = true;
    out.push(arr[i]);
  }
  return out;
}
function degSym(n) {
  if (typeof n === 'number' && !Number.isInteger(n)) {
    const s = Math.round(n * 100) / 100;
    return String(s) + DEG;
  }
  return String(n) + DEG;
}
function fmtNum(n) {
  if (typeof n !== 'number') return String(n);
  if (Number.isInteger(n)) return String(n);
  const r = Math.round(n * 100) / 100;
  return String(r);
}
function interiorOf(n) { return ((n - 2) * 180) / n; }
function exteriorOf(n) { return 360 / n; }

function card(o) {
  return {
    plain: o.plain,
    correct: !!o.correct,
    tip: o.tip || '',
    trap: o.trap || '',
    dead: false
  };
}
function padCards(cards, tip) {
  const out = uniq(cards).slice(0, 4);
  let n = 1;
  while (out.length < 4) {
    out.push(card({
      plain: 'Misaligned option ' + n,
      correct: false,
      tip: tip || TIPS.algebra,
      trap: 'pad'
    }));
    n++;
  }
  return out;
}
function makeSteps(reason, equation, answers) {
  return [
    {
      prompt: 'STEP 1 \u2014 Unlock the key polygon / quadrilateral angle',
      cards: shuffle(Math.random, padCards(reason, TIPS.algebra))
    },
    {
      prompt: 'STEP 2 \u2014 Formulate the equation / side-count n',
      cards: shuffle(Math.random, padCards(equation, TIPS.algebra))
    },
    {
      prompt: 'STEP 3 \u2014 Solve the final target (x, n, or sub-angle)',
      cards: shuffle(Math.random, padCards(answers, TIPS.solve))
    }
  ];
}
function pack(arch, key, title, givens, find, sol, steps, figure, highlight, tipBank) {
  return {
    arch: arch,
    key: key,
    title: title,
    givens: givens,
    find: find,
    sol: sol,
    steps: steps,
    figure: figure,
    highlight: highlight || {},
    tipBank: tipBank || {},
    tier: ''
  };
}
function tierOf(round) {
  if (round <= 2) {
    return {
      name: 'WARM-UP GATES',
      arches: ['rectDiag', 'parallelogram', 'trapezium', 'kite']
    };
  }
  if (round <= 4) {
    return {
      name: 'POLYGON SUMS',
      arches: ['irregExterior', 'irregInterior', 'ratioExterior', 'regularN']
    };
  }
  if (round <= 6) {
    return {
      name: 'JUNCTION RINGS',
      arches: ['dualVertex', 'tripleJunction', 'extendedSides', 'regularN']
    };
  }
  return {
    name: 'MASTER CITADEL',
    arches: ['nestedSquare', 'paraIsoChain', 'tripleJunction', 'extendedSides', 'dualVertex', 'kite']
  };
}

/* ─── Figure helpers (stage coords 0..100) ───────────────────────── */
function V(id, x, y) { return { id: id, x: x, y: y }; }
function E(from, to, style) { return { from: from, to: to, style: style || 'solid' }; }
function A(at, fromId, toId, label, color, r) {
  return { at: at, fromId: fromId, toId: toId, label: label, color: color || COL.arcA, r: r || 14 };
}
function RA(at, fromId, toId) { return { at: at, fromId: fromId, toId: toId }; }
function TK(a, b, marks) { return { edge: [a, b], marks: marks || 1 }; }
function AUX(from, to) { return { from: from, to: to }; }

function mapFig(fig, pad) {
  const verts = Array.isArray(fig) ? fig : fig.verts;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (let i = 0; i < verts.length; i++) {
    minX = Math.min(minX, verts[i].x);
    maxX = Math.max(maxX, verts[i].x);
    minY = Math.min(minY, verts[i].y);
    maxY = Math.max(maxY, verts[i].y);
  }
  const bw = Math.max(1, maxX - minX);
  const bh = Math.max(1, maxY - minY);
  const p = pad || 14;
  const sx = (100 - 2 * p) / bw;
  const sy = (100 - 2 * p) / bh;
  const s = Math.min(sx, sy);
  const ox = p + (100 - 2 * p - bw * s) / 2 - minX * s;
  const oy = p + (100 - 2 * p - bh * s) / 2 - minY * s;
  return verts.map(function (v) {
    return { id: v.id, x: v.x * s + ox, y: v.y * s + oy };
  });
}
function regularVerts(ids, cx, cy, r, startDeg) {
  const n = ids.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = ((startDeg || -90) + i * (360 / n)) * Math.PI / 180;
    out.push(V(ids[i], cx + r * Math.cos(a), cy + r * Math.sin(a)));
  }
  return out;
}
function irregularVertsFromExteriors(ids, exteriors, startDeg) {
  /* Turn by each exterior; solve two side lengths so the path closes.
     Equal sides only close when all exteriors are equal (regular). */
  const n = ids.length;
  if (n !== exteriors.length || n < 3) return null;
  let sum = 0;
  for (let i = 0; i < n; i++) {
    if (exteriors[i] <= 0 || exteriors[i] >= 180) return null;
    sum += exteriors[i];
  }
  if (Math.abs(sum - 360) > 0.01) return null;

  function build(ext, labels, freeScale) {
    const dirs = [];
    let heading = ((startDeg == null ? -90 : startDeg) * Math.PI / 180);
    for (let i = 0; i < n; i++) {
      dirs.push({ x: Math.cos(heading), y: Math.sin(heading) });
      /* Turn ext[i+1] at the NEXT vertex after walking side i (ext[0] closes at labels[0]). */
      heading += ext[(i + 1) % n] * Math.PI / 180;
    }
    const sides = [];
    let rx = 0, ry = 0;
    for (let i = 0; i < n - 2; i++) {
      const s = freeScale[(i % freeScale.length)];
      sides.push(s);
      rx += s * dirs[i].x;
      ry += s * dirs[i].y;
    }
    const a = dirs[n - 2].x, b = dirs[n - 1].x;
    const c = dirs[n - 2].y, d = dirs[n - 1].y;
    const det = a * d - b * c;
    if (Math.abs(det) < 1e-6) return null;
    const s0 = (-rx * d + ry * b) / det;
    const s1 = (-a * ry + c * rx) / det;
    if (s0 < 0.2 || s1 < 0.2 || s0 > 5 || s1 > 5) return null;
    sides.push(s0, s1);
    const raw = [];
    let x = 0, y = 0;
    for (let i = 0; i < n; i++) {
      raw.push({ id: labels[i], x: x, y: y });
      x += sides[i] * dirs[i].x;
      y += sides[i] * dirs[i].y;
    }
    if (Math.hypot(x, y) > 0.1) return null;
    return mapFig(raw, 16);
  }

  const scales = [
    [1, 1, 1, 1],
    [1, 1.2, 0.9, 1.1],
    [1.3, 0.8, 1, 1.15],
    [0.85, 1.25, 1, 0.95],
    [1.1, 1.1, 0.75, 1.2]
  ];
  /* Rotate which exterior sits where so the solved edges stay positive. */
  for (let rot = 0; rot < n; rot++) {
    const ext = [];
    const labels = [];
    for (let i = 0; i < n; i++) {
      ext.push(exteriors[(i + rot) % n]);
      labels.push(ids[(i + rot) % n]);
    }
    for (let s = 0; s < scales.length; s++) {
      const verts = build(ext, labels, scales[s]);
      if (verts) return verts;
    }
  }
  return null;
}
function cycleEdges(ids, style) {
  const e = [];
  for (let i = 0; i < ids.length; i++) e.push(E(ids[i], ids[(i + 1) % ids.length], style));
  return e;
}

const TIPS = {
  extSum: 'The sum of EXTERIOR angles of ANY convex polygon is ALWAYS 360' + DEG + ', no matter how many sides it has!',
  ratioExt: 'The LARGEST exterior angle belongs to the SMALLEST interior angle! Subtract the smallest interior from 180' + DEG + '.',
  rectHalf: 'Diagonals of a rectangle bisect each other equally (EA = EB), forming an ISOSCELES triangle — they do NOT bisect the corner angles unless it\'s a square!',
  paraOpp: 'In a parallelogram, opposite angles are equal and consecutive angles between parallel sides sum to 180' + DEG + '.',
  trapCo: 'In a trapezium with one pair of parallel sides, co-interior angles between the parallels sum to 180' + DEG + '.',
  kiteSym: 'A kite is symmetric across its main diagonal — base angles in the isosceles triangles are equal.',
  intSum: 'Sum of interior angles of an n-gon = (n \u2212 2) \u00d7 180' + DEG + '.',
  extShort: 'For a regular polygon: Exterior ' + ANG + ' = 180' + DEG + ' \u2212 Interior ' + ANG + ', then n = 360' + DEG + ' \u00f7 Exterior ' + ANG + '.',
  point360: 'Angles at a point sum to 360' + DEG + '. Subtract the known regular interiors from 360' + DEG + '.',
  iso: 'Equal-length sides (tick marks) make an isosceles triangle — base angles are equal.',
  algebra: 'Check the signs and which angles you combined. Lock the exact equation from the figure.',
  solve: 'Solve the locked equation carefully for x, n, or the target angle.'
};

function reasonCards(correctPlain, distractors) {
  const cards = [card({ plain: correctPlain, correct: true })];
  distractors.forEach(function (d) {
    cards.push(card({ plain: d.plain, correct: false, tip: d.tip, trap: d.trap || '' }));
  });
  return uniq(cards).slice(0, 4);
}
function eqCards(correctPlain, distractors) {
  const cards = [card({ plain: correctPlain, correct: true })];
  distractors.forEach(function (d) {
    cards.push(card({ plain: d.plain, correct: false, tip: d.tip || TIPS.algebra, trap: d.trap || 'algebra' }));
  });
  return uniq(cards).slice(0, 4);
}
function ansCards(correctPlain, wrongs, tip) {
  const cards = [card({ plain: correctPlain, correct: true })];
  wrongs.forEach(function (w) {
    cards.push(card({ plain: w, correct: false, tip: tip || TIPS.solve, trap: 'solve' }));
  });
  return uniq(cards).slice(0, 4);
}
function wrongNums(correct, extras) {
  const set = {};
  set[fmtNum(correct)] = true;
  const out = [];
  (extras || []).forEach(function (v) {
    const s = fmtNum(v);
    if (!set[s] && v > 0) { set[s] = true; out.push(v); }
  });
  return out;
}

/* ─── Generators ──────────────────────────────────────────────────── */

function genRectDiag(rng) {
  /* 2(ax \u00b1 c) + (180 - bec) = 180  =>  2(ax\u00b1c) = bec  => ax\u00b1c = bec/2 */
  const a = randInt(rng, 2, 5);
  let bec = 2 * randInt(rng, 28, 48); /* even so half is integer */
  const half = bec / 2;
  const useSub = rng() < 0.55;
  let c, x, expr, eqLeft;
  if (useSub) {
    c = randInt(rng, 2, Math.min(18, half - 4));
    if ((half + c) % a !== 0) {
      /* force integer x */
      x = randInt(rng, 6, 18);
      const val = a * x - c;
      if (val <= 20 || val >= 70) return null;
      bec = 2 * val;
      if (bec >= 160 || bec <= 40) return null;
    } else {
      x = (half + c) / a;
    }
    if (!Number.isInteger(x) || x < 4 || x > 30) return null;
    expr = '(' + a + 'x \u2212 ' + c + ')' + DEG;
    eqLeft = '2(' + a + 'x \u2212 ' + c + ') + (180 \u2212 ' + bec + ') = 180';
  } else {
    c = randInt(rng, 1, 12);
    if ((half - c) % a !== 0 || half - c <= 0) {
      x = randInt(rng, 6, 18);
      const val = a * x + c;
      if (val <= 20 || val >= 70) return null;
      bec = 2 * val;
      if (bec >= 160 || bec <= 40) return null;
    } else {
      x = (half - c) / a;
    }
    if (!Number.isInteger(x) || x < 4 || x > 30) return null;
    expr = '(' + a + 'x + ' + c + ')' + DEG;
    eqLeft = '2(' + a + 'x + ' + c + ') + (180 \u2212 ' + bec + ') = 180';
  }
  const vert = 180 - bec;
  const fig = {
    verts: mapFig([
      V('A', 12, 78), V('B', 88, 78), V('C', 88, 22), V('D', 12, 22), V('E', 50, 50)
    ]),
    edges: [E('A', 'B'), E('B', 'C'), E('C', 'D'), E('D', 'A'), E('A', 'C'), E('B', 'D')],
    angles: [
      A('E', 'B', 'C', degSym(bec), COL.arcA, 16),
      A('B', 'A', 'E', expr, COL.arcB, 14),
      A('A', 'B', 'E', expr, COL.arcC, 12)
    ],
    rightAngles: [RA('A', 'B', 'D'), RA('B', 'A', 'C')],
    parallels: [{ a: 'A', b: 'B', c: 'D', d: 'C' }],
    ticks: [TK('A', 'E', 1), TK('B', 'E', 1), TK('D', 'E', 1), TK('C', 'E', 1)],
    aux: [],
    labels: true,
    fill: ['A', 'B', 'C', 'D']
  };
  const wrongX = wrongNums(x, [x + 3, x - 2, Math.round(bec / 2), x + 5, Math.round(bec / a)]).slice(0, 3);
  const steps = makeSteps(
    reasonCards('EA = EB \u2192 isosceles \u25b3EAB (base ' + ANG + 's equal)', [
      { plain: ANG + 'ABE = ' + bec + DEG + ' \u00f7 2 (angle bisector)', tip: TIPS.rectHalf, trap: 'rectHalf' },
      { plain: 'Diagonals of a rectangle are perpendicular', tip: 'Rectangle diagonals are equal and bisect each other, but are only perpendicular in a rhombus/square.', trap: 'perp' },
      { plain: 'Opposite angles of a kite', tip: TIPS.rectHalf, trap: 'kite' }
    ]),
    eqCards(eqLeft, [
      { plain: '(' + a + 'x ' + (useSub ? '\u2212' : '+') + ' ' + c + ') = ' + bec, tip: TIPS.rectHalf, trap: 'rectHalf' },
      { plain: '2(' + a + 'x ' + (useSub ? '\u2212' : '+') + ' ' + c + ') + ' + bec + ' = 180', tip: 'The vertex angle at E in \u25b3EAB is the vertically opposite partner of ' + bec + DEG + ', which is ' + vert + DEG + '.', trap: 'algebra' },
      { plain: '2(' + a + 'x ' + (useSub ? '\u2212' : '+') + ' ' + c + ') = 180', tip: TIPS.algebra, trap: 'algebra' }
    ]),
    ansCards('x = ' + x, wrongX.map(function (v) { return 'x = ' + fmtNum(v); }), TIPS.rectHalf)
  );
  return pack('rectDiag', 'rd-' + a + '-' + x + '-' + bec, 'Rectangle ABCD \u00b7 diagonals at E',
    'ABCD is a rectangle \u00b7 ' + ANG + 'BEC = ' + bec + DEG + ' \u00b7 ' + ANG + 'ABE = ' + expr,
    'Find x', { x: x }, steps, fig, { rule: 'iso', glow: 'E' }, TIPS);
}

function genParallelogram(rng) {
  /* AB // DC, AC transversal => BAC = ACD (alternate). Express BAC algebraically. */
  const angD = randInt(rng, 100, 115);
  const angA = 180 - angD;
  const bacMax = Math.min(52, angA - 18);
  const bac = randInt(rng, 30, bacMax);
  const BCA_tri = 180 - bac - angD;
  if (BCA_tri <= 15 || BCA_tri >= 75) return null;
  const candidates = [];
  for (let den = 1; den <= 2; den++) {
    const as = den === 2 ? [3, 5] : [2, 3, 4, 5];
    for (let ai = 0; ai < as.length; ai++) {
      const a = as[ai];
      if ((bac * den) % a !== 0) continue;
      const x = (bac * den) / a;
      if (Number.isInteger(x) && x >= 6 && x <= 30) candidates.push({ a: a, den: den, x: x });
    }
  }
  if (!candidates.length) return null;
  const pickC = pick(rng, candidates);
  const a = pickC.a, den = pickC.den, x = pickC.x;
  const expr = den === 1 ? (a + 'x' + DEG) : ('(' + a + 'x/' + den + ')' + DEG);
  const eq = den === 1 ? (a + 'x = ' + bac) : (a + 'x/' + den + ' = ' + bac);
  const fig = {
    verts: mapFig([
      V('A', 18, 78), V('B', 82, 78), V('C', 92, 22), V('D', 28, 22)
    ]),
    edges: [E('A', 'B'), E('B', 'C'), E('C', 'D'), E('D', 'A'), E('A', 'C')],
    angles: [
      A('D', 'A', 'C', degSym(angD), COL.arcA, 14),
      A('C', 'A', 'D', degSym(bac), COL.arcB, 13),
      A('A', 'B', 'C', expr, COL.arcC, 15)
    ],
    rightAngles: [],
    parallels: [{ a: 'A', b: 'B', c: 'D', d: 'C' }],
    ticks: [],
    aux: [],
    labels: true,
    fill: ['A', 'B', 'C', 'D'],
    parallelNote: 'AB // DC'
  };
  const wrongX = wrongNums(x, [x + 4, x - 3, bac, Math.round(angA / a), x + 8]).slice(0, 3);
  const steps = makeSteps(
    reasonCards('Alt. ' + ANG + 's (Z): ' + ANG + 'BAC = ' + ANG + 'ACD  (AB // DC)', [
      { plain: 'Opp. angles of parallelogram: ' + ANG + 'BAC = ' + ANG + 'D', tip: TIPS.paraOpp, trap: 'opp' },
      { plain: 'Co-int. ' + ANG + 's: ' + ANG + 'BAC + ' + ANG + 'ACD = 180' + DEG, tip: 'These are alternate angles on transversal AC, so they are equal — not co-interior.', trap: 'coint' },
      { plain: 'Diagonals bisect the angles', tip: 'Parallelogram diagonals do not bisect the angles (unless it is a rhombus).', trap: 'bisect' }
    ]),
    eqCards(eq, [
      { plain: (den === 1 ? a + 'x' : a + 'x/' + den) + ' + ' + bac + ' = 180', tip: TIPS.paraOpp, trap: 'coint' },
      { plain: (den === 1 ? a + 'x' : a + 'x/' + den) + ' = ' + angD, tip: TIPS.paraOpp, trap: 'opp' },
      { plain: (den === 1 ? a + 'x' : a + 'x/' + den) + ' = ' + angA, tip: TIPS.algebra, trap: 'algebra' }
    ]),
    ansCards('x = ' + x, wrongX.map(function (v) { return 'x = ' + fmtNum(v); }))
  );
  return pack('parallelogram', 'pg-' + a + '-' + den + '-' + x + '-' + angD, 'Parallelogram ABCD \u00b7 diagonal AC',
    'ABCD is a parallelogram \u00b7 ' + ANG + 'ADC = ' + angD + DEG + ' \u00b7 ' + ANG + 'ACD = ' + bac + DEG + ' \u00b7 ' + ANG + 'BAC = ' + expr,
    'Find x', { x: x }, steps, fig, { rule: 'Z', glow: 'A' }, TIPS);
}

function genTrapezium(rng) {
  /* AB // DC, angle D = d, DAC = p, AC = BC (isos), ACB = ax+c */
  const d = randInt(rng, 100, 120);
  const angleA = 180 - d;
  const p = randInt(rng, 25, Math.min(45, angleA - 20));
  const bac = angleA - p;
  if (bac <= 15 || bac >= 55) return null;
  const acb = 180 - 2 * bac; /* AC=BC => base angles at A and B equal */
  if (acb <= 40 || acb >= 130) return null;
  const a = pick(rng, [3, 4, 5, 6, 8, 10, 12]);
  const cChoices = [];
  for (let c = 0; c <= 20; c++) {
    if ((acb - c) % a === 0) {
      const x = (acb - c) / a;
      if (Number.isInteger(x) && x >= 4 && x <= 25) cChoices.push({ c: c, x: x });
    }
  }
  if (!cChoices.length) return null;
  const pickC = pick(rng, cChoices);
  const c = pickC.c;
  const x = pickC.x;
  const expr = c === 0 ? (a + 'x' + DEG) : ('(' + a + 'x + ' + c + ')' + DEG);
  const eq = c === 0
    ? (a + 'x = ' + acb + '   (or  2\u00d7' + bac + ' + ' + a + 'x = 180)')
    : ('(' + a + 'x + ' + c + ') = ' + acb);
  const fig = {
    verts: mapFig([
      V('A', 22, 78), V('B', 78, 78), V('C', 92, 28), V('D', 10, 28)
    ]),
    edges: [E('A', 'B'), E('B', 'C'), E('C', 'D'), E('D', 'A'), E('A', 'C')],
    angles: [
      A('D', 'A', 'C', degSym(d), COL.arcA, 14),
      A('A', 'D', 'C', degSym(p), COL.arcB, 12),
      A('C', 'A', 'B', expr, COL.arcC, 15)
    ],
    rightAngles: [],
    parallels: [{ a: 'A', b: 'B', c: 'D', d: 'C' }],
    ticks: [TK('A', 'C', 1), TK('B', 'C', 1)],
    aux: [],
    labels: true,
    fill: ['A', 'B', 'C', 'D'],
    parallelNote: 'AB // DC'
  };
  const wrongX = wrongNums(x, [x + 3, x - 2, bac, Math.round((180 - d) / a), x + 6]).slice(0, 3);
  const steps = makeSteps(
    reasonCards('AB // DC \u2192 co-int. ' + ANG + 'A + ' + ANG + 'D = 180' + DEG + '; AC = BC \u2192 isos. \u25b3ABC', [
      { plain: 'Opp. angles of trapezium are equal', tip: TIPS.trapCo, trap: 'opp' },
      { plain: 'All exterior angles = 360' + DEG + ' / 4', tip: TIPS.trapCo, trap: 'reg' },
      { plain: 'Diagonals of a trapezium are equal', tip: 'Only an isosceles trapezium has equal diagonals — here AC = BC are sides of \u25b3ABC.', trap: 'diag' }
    ]),
    eqCards('2\u00d7' + bac + ' + (' + (c === 0 ? a + 'x' : a + 'x + ' + c) + ') = 180', [
      { plain: bac + ' + (' + (c === 0 ? a + 'x' : a + 'x + ' + c) + ') = 180', tip: TIPS.iso, trap: 'iso' },
      { plain: (c === 0 ? a + 'x' : a + 'x + ' + c) + ' = ' + d, tip: TIPS.algebra, trap: 'algebra' },
      { plain: angleA + ' + (' + (c === 0 ? a + 'x' : a + 'x + ' + c) + ') = 180', tip: 'First find ' + ANG + 'BAC = ' + ANG + 'A \u2212 ' + ANG + 'DAC, then use isosceles \u25b3ABC.', trap: 'algebra' }
    ]),
    ansCards('x = ' + x, wrongX.map(function (v) { return 'x = ' + fmtNum(v); }))
  );
  return pack('trapezium', 'tr-' + a + '-' + x + '-' + d, 'Trapezium ABCD (AB // DC)',
    'AB // DC \u00b7 ' + ANG + 'ADC = ' + d + DEG + ' \u00b7 ' + ANG + 'DAC = ' + p + DEG + ' \u00b7 AC = BC \u00b7 ' + ANG + 'ACB = ' + expr,
    'Find x', { x: x }, steps, fig, { rule: 'iso', glow: 'C' }, TIPS);
}

function kitePointD(ax, ay, cx, cy, angADeg, angCDeg) {
  /* Place D left of AC so \u25b3ADC has \u2220A = angADeg and \u2220C = angCDeg. */
  const angD = 180 - angADeg - angCDeg;
  if (angD <= 20 || angD >= 160) return null;
  const ac = Math.hypot(cx - ax, cy - ay) || 1;
  const ad = ac * Math.sin(angCDeg * Math.PI / 180) / Math.sin(angD * Math.PI / 180);
  const cd = ac * Math.sin(angADeg * Math.PI / 180) / Math.sin(angD * Math.PI / 180);
  const dx = cx - ax, dy = cy - ay;
  const d = Math.hypot(dx, dy) || 1;
  const aa = (ad * ad - cd * cd + d * d) / (2 * d);
  const hh = Math.sqrt(Math.max(0, ad * ad - aa * aa));
  if (!(hh > 0.5)) return null;
  const mx = ax + aa * dx / d, my = ay + aa * dy / d;
  const px = -dy / d * hh, py = dx / d * hh;
  const left = (mx + px < mx - px) ? { x: mx + px, y: my + py } : { x: mx - px, y: my - py };
  if (left.x < 2 || left.x > 98 || left.y < 2 || left.y > 98) return null;
  return left;
}

function genKite(rng) {
  /* Symmetric about AC. Angles in \u25b3ADC: DAC=p, DCA=q, ADC = ax\u00b1c */
  let p = randInt(rng, 28, 48);
  let q = randInt(rng, 28, 52);
  /* Keep base angles clearly unequal so AD \u2260 DC matches distinct kite tick pairs. */
  if (Math.abs(p - q) < 6) q = clamp(p + (q >= p ? 8 : -8), 28, 56);
  if (p + q >= 150 || p + q <= 70) return null;
  const adc = 180 - p - q;
  if (adc <= 40 || adc >= 120) return null;
  const a = pick(rng, [2, 3, 4, 5]);
  const variants = [];
  for (let c = 0; c <= 30; c++) {
    if ((adc + c) % a === 0) {
      const x = (adc + c) / a;
      if (Number.isInteger(x) && x >= 5 && x <= 40) variants.push({ op: '-', c: c, x: x });
    }
  }
  for (let c = 0; c <= 20; c++) {
    if ((adc - c) % a === 0 && adc - c > 0) {
      const x = (adc - c) / a;
      if (Number.isInteger(x) && x >= 5 && x <= 40) variants.push({ op: '+', c: c, x: x });
    }
  }
  if (!variants.length) return null;
  const v = pick(rng, variants);
  const expr = v.c === 0 ? (a + 'x' + DEG) : ('(' + a + 'x ' + (v.op === '-' ? '\u2212' : '+') + ' ' + v.c + ')' + DEG);
  const eqInner = v.c === 0 ? (a + 'x') : (a + 'x ' + (v.op === '-' ? '\u2212' : '+') + ' ' + v.c);
  const eq = p + ' + ' + q + ' + (' + eqInner + ') = 180';

  const ax = 50, ay = 14, cx = 50, cy = 86;
  const Dpt = kitePointD(ax, ay, cx, cy, p, q);
  if (!Dpt) return null;
  /* Reflect D across AC (x = 50) to get B — kite symmetry. */
  const bx = 100 - Dpt.x, by = Dpt.y;
  if (bx < 4 || bx > 96) return null;

  const equalBase = p === q; /* AD = DC \u21d2 rhombus kite: same tick on all sides */
  const ticks = equalBase
    ? [TK('A', 'B', 1), TK('A', 'D', 1), TK('B', 'C', 1), TK('D', 'C', 1)]
    : [TK('A', 'B', 1), TK('A', 'D', 1), TK('B', 'C', 2), TK('D', 'C', 2)];

  const fig = {
    verts: mapFig([
      V('A', ax, ay), V('B', bx, by), V('C', cx, cy), V('D', Dpt.x, Dpt.y)
    ]),
    edges: [E('A', 'B'), E('B', 'C'), E('C', 'D'), E('D', 'A'), E('A', 'C')],
    angles: [
      A('A', 'D', 'C', degSym(p), COL.arcA, 13),
      A('C', 'D', 'A', degSym(q), COL.arcB, 13),
      A('D', 'A', 'C', expr, COL.arcC, 18)
    ],
    rightAngles: [],
    parallels: [],
    ticks: ticks,
    aux: [],
    labels: true,
    fill: ['A', 'B', 'C', 'D'],
    symmetry: 'AC'
  };
  const wrongX = wrongNums(v.x, [v.x + 4, v.x - 3, adc, Math.round((180 - p) / a), v.x + 7]).slice(0, 3);
  const isoTrapTip = equalBase
    ? 'Those base angles are equal, so AD = DC — but you still need the triangle sum to solve for x.'
    : 'Use the given ' + ANG + 'DAC and ' + ANG + 'DCA — they need not be equal.';
  const steps = makeSteps(
    reasonCards('Kite symmetric about AC \u2192 \u25b3ADC angle sum = 180' + DEG, [
      { plain: 'Opp. angles of kite are all equal', tip: TIPS.kiteSym, trap: 'opp' },
      { plain: 'Diagonals of a kite are equal', tip: 'Only one diagonal of a kite is a line of symmetry; diagonals are not equal in general.', trap: 'diag' },
      { plain: ANG + 'ADC = ' + p + DEG + ' + ' + q + DEG, tip: TIPS.kiteSym, trap: 'sum' }
    ]),
    eqCards(eq, [
      { plain: p + ' + ' + q + ' + (' + eqInner + ') = 360', tip: TIPS.intSum, trap: 'point' },
      { plain: '2(' + p + ') + (' + eqInner + ') = 180', tip: isoTrapTip, trap: 'iso' },
      { plain: eqInner + ' = 180 \u2212 ' + p, tip: TIPS.algebra, trap: 'algebra' }
    ]),
    ansCards('x = ' + v.x, wrongX.map(function (n) { return 'x = ' + fmtNum(n); }))
  );
  return pack('kite', 'kt-' + a + '-' + v.x + '-' + p + '-' + q, 'Kite ABCD \u00b7 symmetry about AC',
    'ABCD is a kite (sym. about AC) \u00b7 ' + ANG + 'DAC = ' + p + DEG + ' \u00b7 ' + ANG + 'DCA = ' + q + DEG + ' \u00b7 ' + ANG + 'ADC = ' + expr,
    'Find x', { x: v.x }, steps, fig, { rule: 'iso', glow: 'D' }, TIPS);
}

function genIrregExterior(rng) {
  const n = pick(rng, [6, 7, 8, 9, 10]);
  const rest = n - 1;
  /* Choose equal exterior x first so 360 - rest*x is a clean known angle */
  const x = randInt(rng, 22, 48);
  const known = 360 - rest * x;
  if (known <= 35 || known >= 140 || known === x) return null;
  if (Math.abs(known - x) < 8) return null; /* must look clearly irregular */
  const eq = known + ' + ' + rest + 'x = 360';
  const trapEq = known + ' + ' + rest + 'x = ' + ((n - 2) * 180);
  const ids = 'ABCDEFGHIJ'.slice(0, n).split('');
  const exteriors = [known];
  for (let i = 1; i < n; i++) exteriors.push(x);
  const verts = irregularVertsFromExteriors(ids, exteriors, -100 + randInt(rng, 0, 40));
  if (!verts) return null;

  const fig = {
    verts: verts.slice(),
    edges: cycleEdges(ids),
    angles: [],
    rightAngles: [],
    parallels: [],
    ticks: [],
    aux: [],
    labels: true,
    fill: ids.slice(),
    exteriorRay: true,
    /* Spoilers off: students count sides from the figure. */
    note: 'Count the sides \u00b7 one exterior marked ' + known + DEG,
    labelIds: [ids[0], ids[1]], /* only the marked corners — no A\u2026G roll-call */
    hideNoteN: true
  };
  /* Exterior at A: extend side BA past A to X. Then ∠(prev, A, X) = exterior
     (adjacent to interior ∠GAB on the straight line B–A–X). Same idea at B→Y. */
  const vPrev = fig.verts.find(function (v) { return v.id === ids[n - 1]; });
  const v0 = fig.verts.find(function (v) { return v.id === ids[0]; });
  const v1 = fig.verts.find(function (v) { return v.id === ids[1]; });
  const v2 = fig.verts.find(function (v) { return v.id === ids[2]; });
  if (!vPrev || !v0 || !v1 || !v2) return null;
  const dxA = v0.x - v1.x, dyA = v0.y - v1.y;
  const lenA = Math.hypot(dxA, dyA) || 1;
  fig.verts.push(V('X', v0.x + dxA / lenA * 16, v0.y + dyA / lenA * 16));
  fig.edges.push(E(ids[0], 'X', 'dash'));
  fig.aux.push(AUX(ids[0], 'X'));
  const dxB = v1.x - v2.x, dyB = v1.y - v2.y;
  const lenB = Math.hypot(dxB, dyB) || 1;
  fig.verts.push(V('Y', v1.x + dxB / lenB * 14, v1.y + dyB / lenB * 14));
  fig.edges.push(E(ids[1], 'Y', 'dash'));
  fig.aux.push(AUX(ids[1], 'Y'));
  fig.angles = [
    A(ids[0], ids[n - 1], 'X', degSym(known), COL.arcA, 15),
    A(ids[1], ids[0], 'Y', 'x' + DEG, COL.arcB, 12)
  ];

  const wrongX = wrongNums(x, [x + 5, x - 4, Math.round(((n - 2) * 180 - known) / rest), 360 - known]).slice(0, 3);
  const steps = makeSteps(
    reasonCards('Sum of exterior ' + ANG + 's of ANY convex polygon = 360' + DEG, [
      { plain: 'Sum of exterior ' + ANG + 's = (n \u2212 2) \u00d7 180' + DEG, tip: TIPS.extSum, trap: 'extSum' },
      { plain: 'Sum of exterior ' + ANG + 's = n \u00d7 180' + DEG, tip: TIPS.extSum, trap: 'extSum' },
      { plain: 'Each exterior ' + ANG + ' = 360' + DEG + ' / n (even if irregular)', tip: 'That shortcut is only for REGULAR polygons. Here exteriors are not all equal — an irregular polygon may have a ' + known + DEG + ' exterior as long as all exteriors sum to 360' + DEG + '.', trap: 'reg' }
    ]),
    eqCards(eq, [
      { plain: trapEq, tip: TIPS.extSum, trap: 'extSum' },
      { plain: known + ' + ' + rest + 'x = 180', tip: TIPS.extSum, trap: 'extSum' },
      { plain: rest + 'x = 360', tip: 'Include the known exterior angle ' + known + DEG + ' in the sum. Count the sides first!', trap: 'algebra' }
    ]),
    ansCards('x = ' + x, wrongX.map(function (v) { return 'x = ' + fmtNum(v); }), TIPS.extSum)
  );
  return pack('irregExterior', 'ie-' + n + '-' + known + '-' + x, 'Irregular polygon \u00b7 exterior angles',
    'One exterior ' + ANG + ' = ' + known + DEG + ' \u00b7 all other exterior ' + ANG + 's = x' + DEG + ' each \u00b7 count the sides!',
    'Find x', { x: x }, steps, fig, { rule: 'ext', glow: ids[0], showRays: true }, TIPS);
}

function genIrregInterior(rng) {
  const n = pick(rng, [5, 6]);
  const sum = (n - 2) * 180;
  let x, exprList, eq;
  if (n === 6) {
    /* Pick x, then pick target expression values in (70,150), back-solve constants */
    x = randInt(rng, 35, 50);
    const e3 = randInt(rng, 85, 140);
    const e4 = randInt(rng, 85, 140);
    const e5 = randInt(rng, 85, 140);
    const e6 = randInt(rng, 70, 120);
    const a1 = randInt(rng, 100, 140);
    const a2f = sum - (a1 + e3 + e4 + e5 + e6);
    if (a2f < 90 || a2f > 150) return null;
    const c3 = 3 * x - e3;
    const c4 = 4 * x - e4;
    const c5 = e5 - 2 * x;
    const c6 = e6 + x;
    if (c3 < 0 || c4 < 0 || c5 < 0 || c6 < 20 || c6 > 160) return null;
    exprList = [
      degSym(a1),
      degSym(a2f),
      '(3x \u2212 ' + c3 + ')' + DEG,
      '(4x \u2212 ' + c4 + ')' + DEG,
      '(2x + ' + c5 + ')' + DEG,
      '(' + c6 + ' \u2212 x)' + DEG
    ];
    eq = a1 + ' + ' + a2f + ' + (3x \u2212 ' + c3 + ') + (4x \u2212 ' + c4 + ') + (2x + ' + c5 + ') + (' + c6 + ' \u2212 x) = 720';
  } else {
    x = randInt(rng, 25, 45);
    const e3 = randInt(rng, 80, 130);
    const e4 = randInt(rng, 80, 130);
    const e5 = randInt(rng, 70, 120);
    const a1 = randInt(rng, 90, 130);
    const a2f = sum - (a1 + e3 + e4 + e5);
    if (a2f < 80 || a2f > 150) return null;
    const c3 = e3 - 2 * x;
    const c4 = 3 * x - e4;
    const k = e5 + x;
    if (c3 < 0 || c4 < 0 || k < 80 || k > 160) return null;
    exprList = [
      degSym(a1),
      degSym(a2f),
      '(2x + ' + c3 + ')' + DEG,
      '(3x \u2212 ' + c4 + ')' + DEG,
      '(' + k + ' \u2212 x)' + DEG
    ];
    eq = a1 + ' + ' + a2f + ' + (2x + ' + c3 + ') + (3x \u2212 ' + c4 + ') + (' + k + ' \u2212 x) = 540';
  }
  const ids = 'ABCDEF'.slice(0, n).split('');
  const fig = {
    verts: mapFig(regularVerts(ids, 50, 52, 36, -90)),
    edges: cycleEdges(ids),
    angles: [],
    rightAngles: [],
    parallels: [],
    ticks: [],
    aux: [],
    labels: true,
    fill: ids.slice(),
    polyLabels: exprList,
    note: 'Count the sides \u00b7 interiors labelled',
    labelIds: ids.slice() /* letters ok once angles are marked; title does not name the n-gon */
  };
  for (let i = 0; i < n; i++) {
    const prev = ids[(i - 1 + n) % n];
    const next = ids[(i + 1) % n];
    fig.angles.push(A(ids[i], prev, next, exprList[i], [COL.arcA, COL.arcB, COL.arcC, COL.arcD, COL.amber, COL.cyan][i % 6], 11));
  }
  const wrongX = wrongNums(x, [x + 6, x - 5, Math.round(sum / n), x + 12]).slice(0, 3);
  const steps = makeSteps(
    reasonCards('Interior sum = (n \u2212 2) \u00d7 180' + DEG + ' = ' + sum + DEG, [
      { plain: 'Interior sum = 360' + DEG, tip: TIPS.intSum, trap: 'extSum' },
      { plain: 'Interior sum = n \u00d7 180' + DEG, tip: TIPS.intSum, trap: 'intSum' },
      { plain: 'Exterior sum = (n \u2212 2) \u00d7 180' + DEG, tip: TIPS.extSum, trap: 'extSum' }
    ]),
    eqCards(eq, [
      { plain: eq.replace(String(sum), '360'), tip: TIPS.intSum, trap: 'extSum' },
      { plain: eq.replace(String(sum), String(n * 180)), tip: TIPS.intSum, trap: 'intSum' },
      { plain: 'Average interior = ' + sum + ' / ' + n, tip: TIPS.algebra, trap: 'algebra' }
    ]),
    ansCards('x = ' + x, wrongX.map(function (v) { return 'x = ' + fmtNum(v); }))
  );
  return pack('irregInterior', 'ii-' + n + '-' + x + '-' + sum, 'Irregular polygon \u00b7 algebraic interiors',
    'Interior angles: ' + exprList.join(', ') + ' \u00b7 count the sides!',
    'Find x', { x: x }, steps, fig, { rule: 'int', glow: ids[2] }, TIPS);
}

function genRatioExterior(rng) {
  /* Ratio parts for pentagon or hexagon interiors; find LARGEST exterior */
  const n = pick(rng, [5, 6]);
  const sum = (n - 2) * 180;
  let parts;
  if (n === 5) {
    parts = pick(rng, [
      [2, 3, 4, 5, 6],
      [1, 2, 3, 4, 5],
      [2, 2, 3, 4, 5],
      [1, 3, 4, 5, 6]
    ]);
  } else {
    parts = pick(rng, [
      [1, 2, 3, 4, 5, 6],
      [2, 3, 3, 4, 5, 6],
      [1, 2, 2, 3, 4, 5]
    ]);
  }
  const total = parts.reduce(function (s, v) { return s + v; }, 0);
  if (sum % total !== 0) return null;
  const unit = sum / total;
  const interiors = parts.map(function (p) { return p * unit; });
  const smallest = Math.min.apply(null, interiors);
  const largestInt = Math.max.apply(null, interiors);
  const largestExt = 180 - smallest;
  const trapExt = 180 - largestInt; /* common wrong: using largest interior */
  const trapShare = largestInt; /* taking largest interior as "largest exterior" */
  if (largestExt <= 20 || largestExt >= 160) return null;
  if (!Number.isInteger(unit)) return null;

  const ids = 'ABCDEF'.slice(0, n).split('');
  const fig = {
    verts: mapFig(regularVerts(ids, 50, 52, 36, -90)),
    edges: cycleEdges(ids),
    angles: [],
    rightAngles: [],
    parallels: [],
    ticks: [],
    aux: [],
    labels: true,
    fill: ids.slice(),
    ratioBanner: parts.join(' : '),
    note: 'Count the sides \u00b7 interior ratio shares'
  };
  for (let i = 0; i < n; i++) {
    const prev = ids[(i - 1 + n) % n];
    const next = ids[(i + 1) % n];
    fig.angles.push(A(ids[i], prev, next, parts[i] + 'k', [COL.arcA, COL.arcB, COL.arcC, COL.arcD, COL.amber, COL.cyan][i % 6], 12));
  }
  const wrong = wrongNums(largestExt, [trapExt, trapShare, smallest, 180 - largestInt, Math.round(360 / n)]).slice(0, 3);
  const steps = makeSteps(
    reasonCards('Interior sum = ' + sum + DEG + ' \u00b7 unit k = ' + sum + '/' + total + ' = ' + unit + DEG, [
      { plain: 'Exterior sum = (n \u2212 2) \u00d7 180' + DEG, tip: TIPS.extSum, trap: 'extSum' },
      { plain: 'Largest ratio share \u21d2 largest exterior ' + ANG, tip: TIPS.ratioExt, trap: 'ratioExt' },
      { plain: 'Each interior = 360' + DEG + ' / n', tip: TIPS.intSum, trap: 'reg' }
    ]),
    eqCards('Smallest interior = ' + parts[parts.indexOf(Math.min.apply(null, parts))] + '\u00d7' + unit + ' = ' + smallest + DEG + ' \u2192 largest ext. = 180 \u2212 ' + smallest,
      [
        { plain: 'Largest interior = ' + largestInt + DEG + ' is the largest exterior', tip: TIPS.ratioExt, trap: 'ratioExt' },
        { plain: 'Largest exterior = 180 \u2212 ' + largestInt, tip: TIPS.ratioExt, trap: 'ratioExt' },
        { plain: 'Largest exterior = ' + smallest + DEG, tip: TIPS.ratioExt, trap: 'ratioExt' }
      ]),
    ansCards(largestExt + DEG, wrong.map(function (v) { return fmtNum(v) + DEG; }), TIPS.ratioExt)
  );
  return pack('ratioExterior', 're-' + n + '-' + parts.join('') + '-' + largestExt,
    'Irregular polygon \u00b7 interior ratio ' + parts.join(' : '),
    'Interior ' + ANG + 's in ratio ' + parts.join(' : ') + ' \u00b7 sum = ' + sum + DEG + ' \u00b7 count the sides!',
    'Find the LARGEST exterior ' + ANG, { x: largestExt }, steps, fig, { rule: 'ratio', glow: ids[parts.indexOf(Math.min.apply(null, parts))] }, TIPS);
}

function genRegularN(rng) {
  const n = pick(rng, CLEAN_N.filter(function (v) { return v >= 5 && v <= 24; }));
  const ext = exteriorOf(n);
  const inn = interiorOf(n);
  const mode = pick(rng, ['interior', 'times', 'exterior']);
  let title, givens, step1, eq, find, k = 0;
  if (mode === 'interior') {
    title = 'Regular polygon \u00b7 interior ' + inn + DEG;
    givens = 'Each interior ' + ANG + ' of a regular polygon = ' + inn + DEG;
    step1 = 'Exterior ' + ANG + ' = 180' + DEG + ' \u2212 ' + inn + DEG + ' = ' + ext + DEG;
    eq = 'n = 360' + DEG + ' \u00f7 ' + ext + DEG;
    find = 'Find n (number of sides)';
  } else if (mode === 'times') {
    /* interior = k * exterior => (180 - e) = k*e => 180 = (k+1)e => e = 180/(k+1) */
    k = Math.round(inn / ext);
    if (k * ext !== inn) return null;
    title = 'Regular polygon \u00b7 interior = ' + k + ' \u00d7 exterior';
    givens = 'Interior ' + ANG + ' is ' + k + ' times the exterior ' + ANG;
    step1 = 'Let exterior = e \u2192 ' + k + 'e + e = 180' + DEG + ' \u2192 e = ' + ext + DEG;
    eq = 'n = 360' + DEG + ' \u00f7 ' + ext + DEG;
    find = 'Find n';
  } else {
    title = 'Regular polygon \u00b7 exterior ' + ext + DEG;
    givens = 'Each exterior ' + ANG + ' of a regular polygon = ' + ext + DEG;
    step1 = 'Exterior ' + ANG + ' = ' + ext + DEG + ' (given)';
    eq = 'n = 360' + DEG + ' \u00f7 ' + ext + DEG;
    find = 'Find n';
  }

  /* Local corner only — never draw the full n-gon or name n (that is the answer).
     For ratio mode use a neutral opening so the picture does not leak the degree size. */
  const drawInn = mode === 'times' ? 120 : inn;
  const open = drawInn * Math.PI / 180;
  const fig = {
    verts: mapFig([
      V('P', 18, 70),
      V('A', 48, 70),
      V('B', 48 + 36 * Math.cos(Math.PI - open), 70 - 36 * Math.sin(Math.PI - open))
    ]),
    edges: [E('P', 'A'), E('A', 'B')],
    angles: [],
    rightAngles: [],
    parallels: [],
    ticks: [],
    aux: [],
    labels: true,
    fill: [],
    labelIds: ['P', 'A', 'B'],
    note: 'Regular polygon \u00b7 one vertex (n unknown)'
  };
  const vA = fig.verts.find(function (v) { return v.id === 'A'; });
  const vB = fig.verts.find(function (v) { return v.id === 'B'; });
  const dx = vA.x - vB.x, dy = vA.y - vB.y;
  const len = Math.hypot(dx, dy) || 1;
  fig.verts.push(V('X', vA.x + dx / len * 18, vA.y + dy / len * 18));

  if (mode === 'times') {
    /* Ratio only — no degree values that would hand over n. */
    fig.edges.push(E('A', 'X', 'dash'));
    fig.aux.push(AUX('A', 'X'));
    fig.angles = [
      A('A', 'P', 'B', k + 'e', COL.arcA, 16),
      A('A', 'P', 'X', 'e', COL.arcB, 12)
    ];
    fig.note = 'Regular polygon \u00b7 interior = ' + k + ' \u00d7 exterior';
  } else if (mode === 'exterior') {
    fig.edges.push(E('A', 'X', 'dash'));
    fig.aux.push(AUX('A', 'X'));
    fig.angles = [A('A', 'P', 'X', degSym(ext), COL.arcA, 15)];
    fig.note = 'Regular polygon \u00b7 one exterior marked';
  } else {
    fig.angles = [A('A', 'P', 'B', degSym(inn), COL.arcA, 15)];
    fig.note = 'Regular polygon \u00b7 one interior marked';
  }

  const wrongN = wrongNums(n, [n + 2, n - 2, Math.round(360 / inn), 180 / ext, n + 5].map(Math.round)).filter(function (v) {
    return v >= 3 && v <= 36 && v !== n;
  }).slice(0, 3);
  const steps = makeSteps(
    reasonCards(step1, [
      { plain: 'Exterior = (n \u2212 2) \u00d7 180' + DEG + ' / n', tip: TIPS.extShort, trap: 'intSum' },
      { plain: 'n = 180' + DEG + ' \u00f7 exterior', tip: TIPS.extShort, trap: 'half' },
      { plain: 'Interior = 360' + DEG + ' / n', tip: TIPS.extShort, trap: 'mix' }
    ]),
    eqCards(eq, [
      { plain: 'n = 360' + DEG + ' \u00f7 ' + inn + DEG, tip: TIPS.extShort, trap: 'mix' },
      { plain: 'n = (180 \u2212 ' + ext + ') / ' + ext, tip: TIPS.extShort, trap: 'algebra' },
      { plain: 'n = (' + inn + ' / 180) + 2', tip: 'Rearrange (n\u22122)\u00d7180/n = interior carefully, or use the exterior shortcut.', trap: 'algebra' }
    ]),
    ansCards('n = ' + n + ' sides', wrongN.map(function (v) { return 'n = ' + v + ' sides'; }), TIPS.extShort)
  );
  return pack('regularN', 'rn-' + mode + '-' + n, title, givens, find, { x: n }, steps, fig, { rule: 'n', glow: 'A', showRays: true }, TIPS);
}

function genDualVertex(rng) {
  const pairs = [
    [9, 5], [8, 5], [10, 6], [12, 5], [9, 6], [8, 6], [15, 5], [12, 6], [10, 5], [9, 8]
  ];
  const pair = pick(rng, pairs);
  const n1 = pair[0], n2 = pair[1];
  const i1 = interiorOf(n1), i2 = interiorOf(n2);
  const x = 360 - i1 - i2;
  if (x <= 20 || x >= 160) return null;
  const names = { 5: 'pentagon', 6: 'hexagon', 8: 'octagon', 9: 'nonagon', 10: 'decagon', 12: 'dodecagon', 15: '15-gon' };
  const fig = {
    verts: mapFig([
      V('A', 18, 70), V('B', 50, 78), V('C', 82, 70),
      V('P', 28, 30), V('Q', 50, 18), V('R', 72, 30),
      V('V', 50, 52)
    ]),
    edges: [
      E('A', 'B'), E('B', 'C'), E('C', 'V'), E('V', 'A'),
      E('P', 'Q'), E('Q', 'R'), E('R', 'V'), E('V', 'P'),
      E('A', 'P'), E('C', 'R')
    ],
    angles: [
      A('V', 'A', 'B', degSym(i1), COL.arcA, 16),
      A('V', 'Q', 'R', degSym(i2), COL.arcB, 14),
      A('V', 'C', 'R', 'x' + DEG, COL.arcC, 18)
    ],
    rightAngles: [],
    parallels: [],
    ticks: [],
    aux: [],
    labels: true,
    fillPolys: [['A', 'B', 'C', 'V'], ['P', 'Q', 'R', 'V']],
    junction: 'V',
    note: 'Regular ' + names[n1] + ' + regular ' + names[n2]
  };
  const wrongX = wrongNums(x, [i1 + i2, 180 - x, 360 - i1, i1 - i2, x + 20]).filter(function (v) { return v > 0; }).slice(0, 3);
  const steps = makeSteps(
    reasonCards('1 interior of regular ' + names[n1] + ' = ' + i1 + DEG + '; ' + names[n2] + ' = ' + i2 + DEG, [
      { plain: 'Exterior of ' + names[n1] + ' = ' + i1 + DEG, tip: TIPS.extShort, trap: 'mix' },
      { plain: 'Interior = 360' + DEG + ' / n', tip: TIPS.extShort, trap: 'mix' },
      { plain: 'Co-interior angles sum to 180' + DEG, tip: TIPS.point360, trap: 'coint' }
    ]),
    eqCards('x = 360' + DEG + ' \u2212 ' + i1 + DEG + ' \u2212 ' + i2 + DEG, [
      { plain: 'x = 180' + DEG + ' \u2212 ' + i1 + DEG + ' \u2212 ' + i2 + DEG, tip: TIPS.point360, trap: 'straight' },
      { plain: 'x = ' + i1 + ' + ' + i2, tip: TIPS.point360, trap: 'sum' },
      { plain: 'x = 360' + DEG + ' \u2212 ' + exteriorOf(n1) + DEG + ' \u2212 ' + exteriorOf(n2) + DEG, tip: 'At the shared vertex use the INTERIOR angles of each regular polygon.', trap: 'mix' }
    ]),
    ansCards('x = ' + x, wrongX.map(function (v) { return 'x = ' + fmtNum(v); }), TIPS.point360)
  );
  return pack('dualVertex', 'dv-' + n1 + '-' + n2 + '-' + x,
    'Shared-vertex ring \u00b7 regular ' + names[n1] + ' + ' + names[n2],
    'Regular ' + names[n1] + ' (' + i1 + DEG + ') + regular ' + names[n2] + ' (' + i2 + DEG + ') share a vertex',
    'Find x' + DEG + ' at the junction', { x: x }, steps, fig, { rule: '360', glow: 'V', junction: true }, TIPS);
}

function genTripleJunction(rng) {
  /* Three regular polygons meet at a point: interiors sum to 360°. */
  const fixed = pick(rng, [
    { nA: 6, nB: 4, nameA: 'hexagon', nameB: 'square' },
    { nA: 8, nB: 4, nameA: 'octagon', nameB: 'square' },
    { nA: 5, nB: 6, nameA: 'pentagon', nameB: 'hexagon' },
    { nA: 9, nB: 4, nameA: 'nonagon', nameB: 'square' },
    { nA: 10, nB: 4, nameA: 'decagon', nameB: 'square' }
  ]);
  const iA = interiorOf(fixed.nA);
  const iB = fixed.nB === 4 ? 90 : interiorOf(fixed.nB);
  const iN = 360 - iA - iB;
  if (iN <= 90 || iN >= 170) return null;
  const ext = 180 - iN;
  if (360 % ext !== 0) return null;
  const n = 360 / ext;
  if (CLEAN_N.indexOf(n) < 0 && n !== 4 && n !== 3) return null;
  /* In regular n-gon corner △QST, base ∠QTS = (180 − interior)/2 = exterior/2 */
  const tip = ext / 2;
  const ask = pick(rng, ['n', 'tip', 'both']);
  let find, ansPlain, solX;
  if (ask === 'n') {
    find = 'Find n (sides of the third regular polygon)';
    ansPlain = 'n = ' + n + ' sides';
    solX = n;
  } else if (ask === 'tip') {
    find = 'Find ' + ANG + 'QTS in isosceles \u25b3QST';
    ansPlain = ANG + 'QTS = ' + tip + DEG;
    solX = tip;
  } else {
    find = 'Find n and ' + ANG + 'QTS';
    ansPlain = 'n = ' + n + ', ' + ANG + 'QTS = ' + tip + DEG;
    solX = n;
  }

  /* Clean fan at S: three corner wedges using the true sector angles (canvas y↓).
     Rays: T (A|n shared) → D (A|B) → Q (B|n) → back to T. */
  const Sx = 50, Sy = 52, R = 34, rFar = 21;
  function ray(deg, rad) {
    const a = deg * Math.PI / 180;
    return { x: Sx + rad * Math.cos(a), y: Sy + rad * Math.sin(a) };
  }
  const a0 = -205;
  const a1 = a0 + iA;
  const a2 = a1 + iB;
  const PT = ray(a0, R);
  const PD = ray(a1, R);
  const PQ = ray(a2, R);
  const FA = ray(a0 + iA / 2, rFar);
  const FB = ray(a1 + iB / 2, fixed.nB === 4 ? rFar * 0.72 : rFar);
  const fig = {
    verts: mapFig([
      V('S', Sx, Sy),
      V('T', PT.x, PT.y),
      V('D', PD.x, PD.y),
      V('Q', PQ.x, PQ.y),
      V('A', FA.x, FA.y),
      V('B', FB.x, FB.y)
    ]),
    edges: [
      E('T', 'S'), E('S', 'D'), E('T', 'A'), E('A', 'D'),
      E('S', 'Q'), E('D', 'B'), E('B', 'Q'),
      E('Q', 'T')
    ],
    angles: [
      A('S', 'T', 'D', degSym(iA), COL.arcA, 18),
      A('S', 'D', 'Q', fixed.nB === 4 ? '' : degSym(iB), COL.arcB, 14),
      A('S', 'Q', 'T', '?', COL.arcC, 16),
      A('T', 'Q', 'S', ask === 'n' ? '' : ('x' + DEG), COL.arcD, 11)
    ].filter(function (ang) { return ang.label !== ''; }),
    rightAngles: fixed.nB === 4 ? [RA('S', 'D', 'Q')] : [],
    parallels: [],
    ticks: [TK('Q', 'S', 1), TK('S', 'T', 1)],
    aux: [],
    labels: true,
    fillPolys: [
      ['S', 'T', 'A', 'D'],
      ['S', 'D', 'B', 'Q'],
      ['S', 'Q', 'T']
    ],
    labelIds: ['S', 'T', 'D', 'Q'],
    junction: 'S',
    note: 'Three regular polygons meet at S \u00b7 QS = ST'
  };

  const wrongN = wrongNums(n, [n + 2, n - 2, Math.round(360 / iN), 8, 10]).filter(function (v) { return v >= 3 && v !== n; }).slice(0, 3);
  const wrongAns = ask === 'n'
    ? wrongN.map(function (v) { return 'n = ' + v + ' sides'; })
    : ask === 'tip'
      ? wrongNums(tip, [ext, iN / 2, 180 - iN, tip * 2]).slice(0, 3).map(function (v) { return ANG + 'QTS = ' + fmtNum(v) + DEG; })
      : ['n = ' + (n + 2) + ', ' + ANG + 'QTS = ' + tip + DEG, 'n = ' + n + ', ' + ANG + 'QTS = ' + ext + DEG, 'n = ' + Math.round(360 / iN) + ', ' + ANG + 'QTS = ' + tip + DEG];

  const steps = makeSteps(
    reasonCards('Angles at point S: ' + iA + DEG + ' + ' + iB + DEG + ' + interior_n = 360' + DEG, [
      { plain: 'Sum to 180' + DEG + ' on a straight line', tip: TIPS.point360, trap: 'straight' },
      { plain: 'Interior_n = ' + iA + ' + ' + iB, tip: TIPS.point360, trap: 'sum' },
      { plain: 'Use exterior angles of the first two polygons', tip: 'At the junction, subtract the INTERIOR angles from 360' + DEG + '.', trap: 'mix' }
    ]),
    eqCards('Interior_n = 360 \u2212 ' + iA + ' \u2212 ' + iB + ' = ' + iN + DEG + ' \u2192 ext = ' + ext + DEG + ' \u2192 n = 360/' + ext,
      [
        { plain: 'n = 360 / ' + iN, tip: TIPS.extShort, trap: 'mix' },
        { plain: 'Interior_n = 180 \u2212 ' + iA + ' \u2212 ' + iB, tip: TIPS.point360, trap: 'straight' },
        { plain: 'n = (n \u2212 2) \u00d7 180 / ' + iN, tip: TIPS.extShort, trap: 'algebra' }
      ]),
    ansCards(ansPlain, wrongAns, TIPS.extShort)
  );
  return pack('tripleJunction', 'tj-' + fixed.nA + '-' + fixed.nB + '-' + n + '-' + ask,
    'Triple junction \u00b7 ' + fixed.nameA + ' + ' + fixed.nameB + ' + regular n-gon',
    'Regular ' + fixed.nameA + ' (' + iA + DEG + ') + ' + fixed.nameB + ' (' + iB + DEG + ') + regular n-gon at a point',
    find, { x: solX }, steps, fig, { rule: '360', glow: 'S', junction: true }, TIPS);
}

function genExtendedSides(rng) {
  const n = pick(rng, [12, 15, 18, 20, 24]);
  const ext = exteriorOf(n);
  const rxs = 180 - 2 * ext;
  if (rxs <= 60 || rxs >= 160) return null;
  /* Labels PQRSTU... with QR and ST extended to X */
  const fig = {
    verts: mapFig([
      V('P', 18, 42), V('Q', 32, 22), V('R', 55, 18), V('S', 72, 32),
      V('T', 82, 55), V('U', 78, 78), V('V', 55, 88), V('W', 28, 78),
      V('X', 88, 8)
    ]),
    edges: [
      E('P', 'Q'), E('Q', 'R'), E('R', 'S'), E('S', 'T'), E('T', 'U'), E('U', 'V'), E('V', 'W'), E('W', 'P'),
      E('Q', 'X', 'dash'), E('S', 'X', 'dash')
    ],
    angles: [
      A('R', 'Q', 'X', degSym(ext), COL.arcA, 13),
      A('S', 'T', 'X', degSym(ext), COL.arcB, 13),
      A('X', 'R', 'S', 'x' + DEG, COL.arcC, 16)
    ],
    rightAngles: [],
    parallels: [],
    ticks: [],
    aux: [AUX('Q', 'X'), AUX('S', 'X')],
    labels: true,
    fill: ['P', 'Q', 'R', 'S', 'T', 'U', 'V', 'W'],
    note: 'Regular ' + n + '-gon \u00b7 QR & ST extended to X',
    exteriorRay: true
  };
  const ask = pick(rng, ['rxs', 'ext', 'both']);
  let find, ans, solX, wrongs;
  if (ask === 'ext') {
    find = 'Find ' + ANG + 'XRS';
    ans = ANG + 'XRS = ' + ext + DEG;
    solX = ext;
    wrongs = wrongNums(ext, [interiorOf(n), 360 / (n - 2), ext * 2, 180 - ext]).slice(0, 3).map(function (v) { return ANG + 'XRS = ' + fmtNum(v) + DEG; });
  } else if (ask === 'rxs') {
    find = 'Find ' + ANG + 'RXS';
    ans = ANG + 'RXS = ' + rxs + DEG;
    solX = rxs;
    wrongs = wrongNums(rxs, [180 - ext, 2 * ext, interiorOf(n), 360 - 2 * ext]).slice(0, 3).map(function (v) { return ANG + 'RXS = ' + fmtNum(v) + DEG; });
  } else {
    find = 'Find ' + ANG + 'XRS and ' + ANG + 'RXS';
    ans = ANG + 'XRS = ' + ext + DEG + ', ' + ANG + 'RXS = ' + rxs + DEG;
    solX = rxs;
    wrongs = [
      ANG + 'XRS = ' + interiorOf(n) + DEG + ', ' + ANG + 'RXS = ' + rxs + DEG,
      ANG + 'XRS = ' + ext + DEG + ', ' + ANG + 'RXS = ' + (180 - ext) + DEG,
      ANG + 'XRS = ' + ext + DEG + ', ' + ANG + 'RXS = ' + (2 * ext) + DEG
    ];
  }
  const steps = makeSteps(
    reasonCards('Exterior ' + ANG + ' of regular ' + n + '-gon = 360' + DEG + ' \u00f7 ' + n + ' = ' + ext + DEG, [
      { plain: 'Exterior = (n \u2212 2) \u00d7 180 / n', tip: TIPS.extShort, trap: 'intSum' },
      { plain: ANG + 'XRS = interior = ' + interiorOf(n) + DEG, tip: 'The angle between a side and the extension of an adjacent side is the EXTERIOR angle.', trap: 'mix' },
      { plain: 'Alternate angles on parallel sides', tip: 'Use exterior angles of the regular polygon at R and S.', trap: 'par' }
    ]),
    eqCards(ANG + 'XRS = ' + ANG + 'XSR = ' + ext + DEG + ' \u2192 ' + ANG + 'RXS = 180 \u2212 2\u00d7' + ext,
      [
        { plain: ANG + 'RXS = 360 \u2212 2\u00d7' + ext, tip: TIPS.iso, trap: 'point' },
        { plain: ANG + 'RXS = 180 \u2212 ' + ext, tip: 'Triangle RXS is isosceles with TWO exterior angles at R and S.', trap: 'iso' },
        { plain: ANG + 'RXS = ' + interiorOf(n), tip: TIPS.algebra, trap: 'mix' }
      ]),
    ansCards(ans, wrongs, TIPS.extShort)
  );
  return pack('extendedSides', 'es-' + n + '-' + ask + '-' + rxs,
    'Extended sides of regular ' + n + '-gon',
    'Regular ' + n + '-gon PQRSTU\u2026 \u00b7 QR and ST extended meet at X',
    find, { x: solX }, steps, fig, { rule: 'ext', glow: 'X', showRays: true }, TIPS);
}

function genNestedSquare(rng) {
  /* Square ABCD, diagonals at M (45 each). N on AB with BN = BM. Find angle AMN = 22.5 */
  /* Or generalize: ask for BMN = 67.5 or AMN = 22.5 */
  const ask = pick(rng, ['amn', 'bmn']);
  const amn = 22.5;
  const bmn = 67.5;
  const target = ask === 'amn' ? amn : bmn;
  const fig = {
    verts: mapFig([
      V('A', 18, 78), V('B', 82, 78), V('C', 82, 22), V('D', 18, 22),
      V('M', 50, 50), V('N', 66, 78)
    ]),
    edges: [
      E('A', 'B'), E('B', 'C'), E('C', 'D'), E('D', 'A'),
      E('A', 'C'), E('B', 'D'), E('M', 'N')
    ],
    angles: [
      A('M', 'B', 'A', '45' + DEG, COL.arcA, 12),
      A('B', 'A', 'M', '45' + DEG, COL.arcB, 11),
      A('M', 'B', 'N', ask === 'bmn' ? 'x' + DEG : degSym(bmn), COL.arcC, 14),
      A('M', 'A', 'N', ask === 'amn' ? 'x' + DEG : degSym(amn), COL.arcD, 13)
    ],
    rightAngles: [RA('A', 'B', 'D'), RA('B', 'A', 'C')],
    parallels: [],
    ticks: [TK('B', 'N', 1), TK('B', 'M', 1)],
    aux: [],
    labels: true,
    fill: ['A', 'B', 'C', 'D'],
    note: 'Square ABCD \u00b7 BN = BM'
  };
  const wrong = wrongNums(target, [45, 90 - 45, 30, 60, 15, 75, 22, 67]).filter(function (v) { return v !== target; }).slice(0, 3);
  const steps = makeSteps(
    reasonCards('Square diagonals \u2192 ' + ANG + 'ABM = 45' + DEG + '; BN = BM \u2192 isosceles \u25b3MBN', [
      { plain: 'Diagonals of a square bisect corner angles only — skip BN = BM', tip: TIPS.iso, trap: 'iso' },
      { plain: ANG + 'MBN = 90' + DEG, tip: 'At B, ' + ANG + 'ABC = 90' + DEG + ' and ' + ANG + 'ABM = 45' + DEG + ', so ' + ANG + 'MBN = 45' + DEG + '.', trap: 'right' },
      { plain: 'Rectangle property: EA = EB only', tip: TIPS.iso, trap: 'rect' }
    ]),
    eqCards(ANG + 'MBN = 45' + DEG + ' \u2192 base ' + ANG + 's of \u25b3MBN = (180\u221245)/2 = 67.5' + DEG + ' \u2192 ' + ANG + 'AMN = 90 \u2212 67.5',
      [
        { plain: ANG + 'BMN = (180 \u2212 45)/2 = 67.5, so ' + ANG + 'AMN = 67.5', tip: ANG + 'AMN and ' + ANG + 'BMN are adjacent on straight? Actually on diagonal path: ' + ANG + 'AMB = 90' + DEG + ' in square, so ' + ANG + 'AMN = 90 \u2212 ' + ANG + 'BMN.', trap: 'algebra' },
        { plain: ANG + 'BMN = 45' + DEG, tip: TIPS.iso, trap: 'iso' },
        { plain: ANG + 'AMN = 45' + DEG + ' / 2', tip: TIPS.algebra, trap: 'half' }
      ]),
    ansCards('x = ' + fmtNum(target) + DEG, wrong.map(function (v) { return 'x = ' + fmtNum(v) + DEG; }), TIPS.iso)
  );
  return pack('nestedSquare', 'ns-' + ask,
    'Square ABCD \u00b7 diagonals at M \u00b7 BN = BM',
    'ABCD square \u00b7 diagonals meet at M \u00b7 N on AB with BN = BM',
    'Find ' + (ask === 'amn' ? ANG + 'AMN' : ANG + 'BMN'),
    { x: target }, steps, fig, { rule: 'iso', glow: 'M' }, TIPS);
}

function genParaIsoChain(rng) {
  /* Parallelogram PQRS, SR = SQ, SP = SX, angle PSX = p. Find angle QRS and/or QSX */
  const p = pick(rng, [20, 22, 24, 26, 28, 30, 32]);
  /* Chain: SP = SX => base angles at P and X in \u25b3PSX equal.
     Angle at S in \u25b3PSX = 180 - 2*((180-p)/2 wait)
     In \u25b3PSX: angle at P = angle at X; angle at S = p? User said angle PSX = 26.
     So angle at S = 26. Base angles = (180-26)/2 = 77.
     SR = SQ => \u25b3SRQ isosceles with SR=SQ, so angles at R and Q equal.
     Parallel chase: angle QRS = 180 - angle SPQ (co-int) or opposite.
     Classic result often: angle QRS = 2*77 - something... Let me build a clean chain:
     Angle PSX = p (at S).
     SP=SX => angles at P and X = (180-p)/2 = base.
     Let base = (180-p)/2.
     Angle QSP (straight or adjacent): often X is on extension or inside.
     Simpler verified puzzle:
     - PQRS parallelogram
     - SQ = SR => angles at PQR side: angles SQR = SRQ = (180 - angle QSR)/2
     - Given angle PSX = p with SP=SX
     - Find angle QSX = base = (180-p)/2  (isosceles in \u25b3PSX... wait angle at S is p, so base angles (180-p)/2)
     And angle QRS via parallel: angle QRS = angle QPS (opp) or 180 - angle SPQ.
     Let angle QPS = base (same as angle at P in \u25b3PSX if X is along direction...).
     Clean version used in many textbooks:
     angle PSX = p, SP=SX => angle SPX = angle SXP = (180-p)/2
     SQ=SR => and S,Q,R form isosceles.
     angle QRS = 180 - p  (if co-interior with something) — too guessy.

  I'll use a fully verified mini-chain:
  1) SP = SX, angle PSX = p => base angles = (180-p)/2 each.
  2) Ask for angle QSX which equals the base angle at X when Q-S-X related...
  Actually angle QSX = angle QS P + angle PSX or angle QSX = (180-p)/2 if Q lies on XP.

  Simpler problem:
  Parallelogram PQRS with SQ = SR. Given angle P = alpha (or angle PSQ).
  Let angle PSR = d (given numerically), SQ=SR => angles at Q and R in \u25b3SQR equal.
  angle QSR = d? 

  Verified:
  - Angle SPQ = A (opposite to R)
  - Given angle PSX = p where X on RQ extended or X such that SP=SX
  - Target angle QSX = (180 - p)/2

  And angle QRS = 180 - A, with A = (180-p)/2 if angle SPQ equals base angle.
  So angle QRS = 180 - (180-p)/2 = (180+p)/2

  Check with p=26: base=77, QRS=103, QSX=77. Good clean numbers.
  */
  const base = (180 - p) / 2;
  if (!Number.isInteger(base) && Math.round(base * 2) !== base * 2) {
    /* allow .5 */
  }
  const qrs = (180 + p) / 2;
  const ask = pick(rng, ['qsx', 'qrs', 'both']);
  let find, ans, solX, wrongs;
  if (ask === 'qsx') {
    find = 'Find ' + ANG + 'QSX';
    ans = ANG + 'QSX = ' + fmtNum(base) + DEG;
    solX = base;
    wrongs = wrongNums(base, [p, 180 - p, qrs, base * 2]).slice(0, 3).map(function (v) { return ANG + 'QSX = ' + fmtNum(v) + DEG; });
  } else if (ask === 'qrs') {
    find = 'Find ' + ANG + 'QRS';
    ans = ANG + 'QRS = ' + fmtNum(qrs) + DEG;
    solX = qrs;
    wrongs = wrongNums(qrs, [p, base, 180 - p, 90 + p / 2]).slice(0, 3).map(function (v) { return ANG + 'QRS = ' + fmtNum(v) + DEG; });
  } else {
    find = 'Find ' + ANG + 'QRS and ' + ANG + 'QSX';
    ans = ANG + 'QRS = ' + fmtNum(qrs) + DEG + ', ' + ANG + 'QSX = ' + fmtNum(base) + DEG;
    solX = qrs;
    wrongs = [
      ANG + 'QRS = ' + fmtNum(base) + DEG + ', ' + ANG + 'QSX = ' + fmtNum(qrs) + DEG,
      ANG + 'QRS = ' + (180 - p) + DEG + ', ' + ANG + 'QSX = ' + fmtNum(base) + DEG,
      ANG + 'QRS = ' + fmtNum(qrs) + DEG + ', ' + ANG + 'QSX = ' + p + DEG
    ];
  }
  const fig = {
    verts: mapFig([
      V('P', 20, 75), V('Q', 78, 75), V('R', 92, 30), V('S', 34, 30),
      V('X', 8, 48)
    ]),
    edges: [
      E('P', 'Q'), E('Q', 'R'), E('R', 'S'), E('S', 'P'),
      E('S', 'Q'), E('S', 'X'), E('P', 'X')
    ],
    angles: [
      A('S', 'P', 'X', degSym(p), COL.arcA, 14),
      A('X', 'S', 'P', fmtNum(base) + DEG, COL.arcB, 11),
      A('Q', 'S', 'X', ask === 'qsx' || ask === 'both' ? 'x' + DEG : fmtNum(base) + DEG, COL.arcC, 15),
      A('R', 'Q', 'S', ask === 'qrs' || ask === 'both' ? 'y' + DEG : fmtNum(qrs) + DEG, COL.arcD, 14)
    ],
    rightAngles: [],
    parallels: [{ a: 'P', b: 'Q', c: 'S', d: 'R' }],
    ticks: [TK('S', 'R', 1), TK('S', 'Q', 1), TK('S', 'P', 2), TK('S', 'X', 2)],
    aux: [],
    labels: true,
    fill: ['P', 'Q', 'R', 'S'],
    parallelNote: 'PQ // SR',
    note: 'SR = SQ \u00b7 SP = SX'
  };
  const steps = makeSteps(
    reasonCards('SP = SX \u2192 isos. \u25b3PSX \u00b7 base ' + ANG + 's = (180 \u2212 ' + p + ')/2 = ' + fmtNum(base) + DEG, [
      { plain: ANG + 'PSX bisects ' + ANG + 'PSR', tip: TIPS.iso, trap: 'bisect' },
      { plain: 'Opp. angles only — ignore tick marks', tip: TIPS.iso, trap: 'opp' },
      { plain: 'Exterior angle = ' + p + DEG, tip: TIPS.iso, trap: 'ext' }
    ]),
    eqCards(ANG + 'QPS = ' + fmtNum(base) + DEG + ' (same base) \u2192 co-int./opp. chase \u2192 ' + ANG + 'QRS = 180 \u2212 ' + fmtNum(base),
      [
        { plain: ANG + 'QRS = ' + p, tip: TIPS.paraOpp, trap: 'para' },
        { plain: ANG + 'QRS = 2\u00d7' + p, tip: TIPS.algebra, trap: 'algebra' },
        { plain: ANG + 'QSX = ' + p, tip: TIPS.iso, trap: 'iso' }
      ]),
    ansCards(ans, wrongs, TIPS.iso)
  );
  return pack('paraIsoChain', 'pic-' + p + '-' + ask,
    'Parallelogram PQRS \u00b7 SR = SQ \u00b7 SP = SX',
    'PQRS parallelogram \u00b7 SR = SQ \u00b7 SP = SX \u00b7 ' + ANG + 'PSX = ' + p + DEG,
    find, { x: solX }, steps, fig, { rule: 'iso', glow: 'S' }, TIPS);
}

function audit(p) {
  if (!p || !p.steps || p.steps.length !== 3) return 'steps';
  if (!p.sol || p.sol.x == null) return 'sol';
  if (!p.figure || !p.figure.verts || !p.figure.edges) return 'figure';
  for (let i = 0; i < 3; i++) {
    const cards = p.steps[i].cards;
    if (!cards || cards.length < 4) return 'cards-' + i;
    const good = cards.filter(function (c) { return c.correct; });
    if (good.length !== 1) return 'correct-' + i;
    const plains = {};
    for (let k = 0; k < cards.length; k++) {
      if (!cards[k].plain) return 'plain-' + i;
      if (plains[cards[k].plain]) return 'dup-' + i;
      plains[cards[k].plain] = true;
      if (!cards[k].correct && !cards[k].tip) return 'tip-' + i;
    }
  }
  return '';
}

function generateProblem(round, history, rng) {
  const random = rng || Math.random;
  const tier = tierOf(round);
  const recent = {};
  (history || []).forEach(function (h) { recent[h.key] = true; });
  const last = history && history.length ? history[history.length - 1].arch : '';
  let pool = tier.arches.slice();
  if (last && pool.length > 1) {
    const filtered = pool.filter(function (a) { return a !== last; });
    if (filtered.length) pool = filtered;
  }
  for (let pass = 0; pass < 2; pass++) {
    const arches = pass === 0 ? pool : tier.arches;
    const tries = pass === 0 ? 64 : 48;
    for (let i = 0; i < tries; i++) {
      const arch = arches[Math.floor(random() * arches.length)];
      let problem = null;
      try { problem = GENS[arch](random); } catch (err) { problem = null; }
      if (!problem) continue;
      if (pass === 0 && recent[problem.key]) continue;
      const a = audit(problem);
      if (a !== '') { lastAudit = a + ':' + arch; continue; }
      problem.tier = tier.name;
      return problem;
    }
  }
  return null;
}

/* ─── Audio ───────────────────────────────────────────────────────── */
function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
function ensureAudio() {
  if (audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio.ctx = new AC();
  audio.master = audio.ctx.createGain();
  audio.master.gain.value = audio.muted ? 0 : 0.2;
  audio.master.connect(audio.ctx.destination);
  audio.music = audio.ctx.createGain();
  audio.music.gain.value = 0.38;
  audio.music.connect(audio.master);
  const len = Math.floor(audio.ctx.sampleRate * 0.25);
  audio.noise = audio.ctx.createBuffer(1, len, audio.ctx.sampleRate);
  const data = audio.noise.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
}
function resumeAudio() {
  try {
    ensureAudio();
    if (!audio.ctx) return;
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    if (!audio.started) {
      audio.started = true;
      audio.next = audio.ctx.currentTime + 0.05;
    }
  } catch (err) { /* optional */ }
}
function toggleMute() {
  resumeAudio();
  audio.muted = !audio.muted;
  if (audio.master) audio.master.gain.value = audio.muted ? 0 : 0.2;
}
function blip(time, freq, dur, type, gain, dest, slide) {
  if (!audio.ctx || audio.muted) return;
  const o = audio.ctx.createOscillator();
  const g = audio.ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(40, freq), time);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), time + dur);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(gain, time + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g);
  g.connect(dest || audio.master);
  o.start(time);
  o.stop(time + dur + 0.03);
}
function noiseHit(time, dur, gain, freq) {
  if (!audio.ctx || audio.muted || !audio.noise) return;
  const src = audio.ctx.createBufferSource();
  src.buffer = audio.noise;
  const filter = audio.ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = freq || 1400;
  const g = audio.ctx.createGain();
  g.gain.setValueAtTime(gain, time);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  src.connect(filter);
  filter.connect(g);
  g.connect(audio.master);
  src.start(time);
  src.stop(time + dur + 0.02);
}
function sfxChime() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  blip(t, 784, 0.08, 'triangle', 0.05);
  blip(t + 0.06, 1175, 0.1, 'sine', 0.04);
  blip(t + 0.12, 1568, 0.14, 'triangle', 0.035);
}
function sfxLock() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  blip(t, 392, 0.09, 'square', 0.04);
  blip(t + 0.07, 523, 0.12, 'square', 0.045);
  blip(t + 0.16, 784, 0.18, 'triangle', 0.04);
}
function sfxFanfare() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  blip(t, 200, 0.35, 'sawtooth', 0.03, audio.master, 1200);
  [523, 659, 784, 1047].forEach(function (f, i) { blip(t + 0.08 + i * 0.07, f, 0.24, 'triangle', 0.05); });
}
function sfxBuzz() {
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  blip(t, 70, 0.22, 'sawtooth', 0.05, audio.master, 40);
  noiseHit(t, 0.15, 0.05, 500);

  if (!audio.ctx) return;

}

const CHORDS = [[67, 71, 74], [62, 67, 71], [69, 72, 76], [64, 67, 71]];
const BASS = [43, 38, 45, 40];
function playMusicStep(index, time) {
  const bar = Math.floor(index / 16) % 4;
  const chord = CHORDS[bar];
  const step = index % 16;
  if (step % 8 === 0) blip(time, midi(BASS[bar]), 0.18, 'triangle', 0.065, audio.music);
  if (step % 2 === 0) {
    const order = [0, 2, 1, 2];
    blip(time, midi(chord[order[(step / 2) % 4]] + 12), 0.1, 'square', 0.022, audio.music);
  }
  if (step === 0 || step === 8) blip(time, 96, 0.06, 'sine', 0.04, audio.music, 52);
  if (step === 4 || step === 12) noiseHit(time, 0.07, 0.02, 2000);
  if (step % 2 === 1) noiseHit(time, 0.025, 0.009, 4500);
  if (step === 14) blip(time, midi(chord[2] + 24), 0.08, 'triangle', 0.016, audio.music);
}
function tickMusic() {
  if (!audio.started || !audio.ctx || audio.muted || game.paused) return;
  const stepDur = (60 / 112) / 4;
  let guard = 0;
  while (audio.next < audio.ctx.currentTime + 0.12 && guard < 8) {
    playMusicStep(audio.step, audio.next);
    audio.step = (audio.step + 1) % 64;
    audio.next += stepDur;
    guard++;
  }
}

      endGame((player === 0 ? 'P1' : 'P2') + ' citadel shields shattered. ' + game.winner + ' claims the fortress.');
    }
  } else {
    game.shields -= 1;
    if (game.shields <= 0) endGame('Citadel shields depleted. The holo-fortress collapses.');

function confirm(player) {
  if (frameUsed || game.lock > 0 || game.phase !== 'play' || game.screen !== 'play') return;
  if (game.mode === 'coop') {
    const owner = ownerFor(game.step);
    if (owner >= 0 && player !== owner) {
      floatText(W / 2, 430, 'P' + (owner + 1) + ' LOCKS THIS STEP', owner === 0 ? COL.p1 : COL.p2);
      return;
    }
  }
  if (game.mode === 'versus' && game.pShields[player] <= 0) return;
  const cards = currentCards();
  const c = cards[game.sel[player]];
  if (!c || c.dead) return;
  frameUsed = true;
  if (!c.correct) fail(player, c);
  else succeed(player);

  let ox = dx / len;
  let oy = dy / len;
  /* Keep letters close to the vertex; swing them sideways off any exterior angle pill. */
  let dist = 16;
  if (avoidAngles && avoidAngles[id]) {
    const bis = avoidAngles[id];
    /* Exterior pills sit on -bis; push the letter along the tangent instead. */
    const tx = -bis.y, ty = bis.x;
    const side = (ox * tx + oy * ty) >= 0 ? 1 : -1;
    ox = clamp(ox * 0.35 + tx * side * 0.9, -1, 1);
    oy = clamp(oy * 0.35 + ty * side * 0.9, -1, 1);
    const n = Math.hypot(ox, oy) || 1;
    ox /= n; oy /= n;
    dist = 18;
  }
  const lx = clamp(P.x + ox * dist, rect.x + 12, rect.x + rect.w - 12);
  const ly = clamp(P.y + oy * dist, rect.y + 12, rect.y + rect.h - 12);
  ctx.beginPath();
  ctx.arc(lx, ly, 11, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(4, 14, 16, 0.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(232, 255, 246, 0.4)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  text(id, lx, ly, '800 13px ' + UI, COL.ink, 'center');
}

function drawFigure() {
  const p = game.problem;
  if (!p || !p.figure) return;
  const rect = stageRect();
  panel(GEO.stage.x, GEO.stage.y, GEO.stage.w, GEO.stage.h, 'rgba(47,224,192,0.25)');
  const fig = p.figure;
  const vm = vertMap(fig);
  const showAux = game.step >= 1 || game.phase === 'celebrate' || game.auxGlow > 0;
  const gold = game.phase === 'celebrate' || game.beamT > 0;

  /* fills */
  if (fig.fill && fig.fill.length) {
    ctx.beginPath();
    fig.fill.forEach(function (id, i) {
      const v = vm[id]; if (!v) return;
      const P = toStage(v, rect);
      if (i === 0) ctx.moveTo(P.x, P.y); else ctx.lineTo(P.x, P.y);
    });
    ctx.closePath();
    ctx.fillStyle = gold ? 'rgba(255, 224, 138, 0.12)' : 'rgba(47, 224, 192, 0.07)';
    ctx.fill();
  }
  if (fig.fillPolys) {
    fig.fillPolys.forEach(function (poly, pi) {
      ctx.beginPath();
      poly.forEach(function (id, i) {
        const v = vm[id]; if (!v) return;
        const P = toStage(v, rect);
        if (i === 0) ctx.moveTo(P.x, P.y); else ctx.lineTo(P.x, P.y);
      });
      ctx.closePath();
      ctx.fillStyle = pi === 0 ? 'rgba(47,224,192,0.08)' : 'rgba(255,193,74,0.07)';
      ctx.fill();
    });
  }

  /* edges */
  for (let i = 0; i < fig.edges.length; i++) {
    const e = fig.edges[i];
    const a = vm[e.from], b = vm[e.to];
    if (!a || !b) continue;
    const A = toStage(a, rect), B = toStage(b, rect);
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.lineTo(B.x, B.y);
    if (e.style === 'dash') {
      ctx.setLineDash([7, 6]);
      ctx.strokeStyle = COL.aux;
      ctx.lineWidth = 2;
      ctx.globalAlpha = showAux ? 0.9 : 0.25;
    } else {
      ctx.setLineDash([]);
      ctx.strokeStyle = gold ? COL.gold : COL.rail;
      ctx.lineWidth = 2.6;
      ctx.shadowColor = gold ? COL.gold : COL.cyan;
      ctx.shadowBlur = gold ? 14 : 8;
      ctx.globalAlpha = 1;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
  }

  /* parallel chevrons */
  if (fig.parallels && fig.parallels.length) {
    const pr = fig.parallels[0];
    const a = vm[pr.a], b = vm[pr.b], c = vm[pr.c], d = vm[pr.d];
    if (a && b) {
      const A = toStage(a, rect), B = toStage(b, rect);
      drawChevron(A.x, A.y, B.x, B.y, 0.42);
      drawChevron(A.x, A.y, B.x, B.y, 0.58);
    }
    if (c && d) {
      const C = toStage(c, rect), D = toStage(d, rect);
      drawChevron(C.x, C.y, D.x, D.y, 0.42);
      drawChevron(C.x, C.y, D.x, D.y, 0.58);
    }
    text(fig.parallelNote || 'parallel', rect.x + rect.w - 12, rect.y + 18, '800 13px ' + UI, COL.cyan, 'right');
  }

  /* aux dashed */
  if (showAux && fig.aux) {
    const pulse = 0.55 + 0.45 * Math.sin(game.time * 6);
    ctx.save();
    ctx.setLineDash([8, 7]);
    ctx.globalAlpha = 0.35 + 0.5 * Math.min(1, game.auxGlow || (game.step >= 1 ? 1 : 0)) * pulse;
    ctx.strokeStyle = COL.aux;
    ctx.lineWidth = 2.2;
    for (let i = 0; i < fig.aux.length; i++) {
      const a = vm[fig.aux[i].from], b = vm[fig.aux[i].to];
      if (!a || !b) continue;
      const A = toStage(a, rect), B = toStage(b, rect);
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ticks */
  if (fig.ticks) {
    for (let i = 0; i < fig.ticks.length; i++) {
      const t = fig.ticks[i];
      const a = vm[t.edge[0]], b = vm[t.edge[1]];
      if (!a || !b) continue;
      const A = toStage(a, rect), B = toStage(b, rect);
      drawTickMarks(A.x, A.y, B.x, B.y, t.marks || 1);
    }
  }

  /* right angles */
  if (fig.rightAngles) {
    for (let i = 0; i < fig.rightAngles.length; i++) drawRightAngle(vm, fig.rightAngles[i], rect);
  }

  /* junction pulse ring */
  if ((fig.junction || (p.highlight && p.highlight.junction)) && (game.step >= 1 || game.junctionPulse > 0 || game.phase === 'celebrate')) {
    const jid = fig.junction || p.highlight.glow;
    const jv = vm[jid];
    if (jv) {
      const J = toStage(jv, rect);
      const pulse = 0.5 + 0.5 * Math.sin(game.time * 5);
      ctx.beginPath();
      ctx.arc(J.x, J.y, 22 + pulse * 8, 0, Math.PI * 2);
      ctx.strokeStyle = COL.amber;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.45 + 0.4 * pulse;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(J.x, J.y, 34 + pulse * 6, 0, Math.PI * 2);
      ctx.strokeStyle = COL.cyan;
      ctx.globalAlpha = 0.25 + 0.3 * pulse;
      ctx.stroke();
      ctx.globalAlpha = 1;
      text('360' + DEG, J.x, J.y - 44, '800 12px ' + MONO, COL.amber, 'center');
    }
  }

  /* angles: arcs first, vertex letters next, value pills last (always on top) */
  const glow = game.step >= 1 || game.phase === 'celebrate';
  const angleGeoms = [];
  const avoidAngles = {};
  if (fig.angles) {
    const peers = {};
    for (let i = 0; i < fig.angles.length; i++) {
      const key = fig.angles[i].at;
      if (!peers[key]) peers[key] = [];
      peers[key].push(i);
    }
    for (let i = 0; i < fig.angles.length; i++) {
      const group = peers[fig.angles[i].at];
      const g = angleGeom(vm, fig.angles[i], rect, group.indexOf(i), group.length);
      if (!g) continue;
      drawAngleArcOnly(g, glow);
      angleGeoms.push(g);
      if (!avoidAngles[g.at]) avoidAngles[g.at] = { x: 0, y: 0, n: 0 };
      avoidAngles[g.at].x += g.cosM;
      avoidAngles[g.at].y += g.sinM;
      avoidAngles[g.at].n += 1;
    }
    Object.keys(avoidAngles).forEach(function (id) {
      const a = avoidAngles[id];
      const n = Math.hypot(a.x, a.y) || 1;
      a.x /= n; a.y /= n;
    });
  }

  /* note / ratio banner */
  if (fig.note) text(fig.note, rect.x + 12, rect.y + 18, '700 13px ' + UI, COL.dim, 'left');
  if (fig.ratioBanner) text('ratio ' + fig.ratioBanner, rect.x + 12, rect.y + 38, '700 13px ' + MONO, COL.amber, 'left');

  /* vertex labels — nudged away from angle bisectors */
  const allowLabels = fig.labelIds ? fig.labelIds.slice() : null;
  const fillSet = fig.fill ? fig.fill : null;
  for (let i = 0; i < fig.verts.length; i++) {
    const id = fig.verts[i].id;
    const isRayTip = id === 'X' || id === 'Y';
    if (isRayTip && !showAux && !(p.highlight && p.highlight.showRays)) continue;
    if (isRayTip) {
      drawLabel(vm, id, rect, avoidAngles);
      continue;
    }
    if (allowLabels && allowLabels.indexOf(id) < 0) {
      /* Unlabeled corner dots — students count sides without an A\u2026G roll-call. */
      if (fillSet && fillSet.indexOf(id) < 0) continue;
      const P = toStage(fig.verts[i], rect);
      ctx.beginPath();
      ctx.arc(P.x, P.y, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = COL.rail;
      ctx.fill();
      continue;
    }
    drawLabel(vm, id, rect, avoidAngles);
  }

  /* angle value pills on top so they never sit under arcs or letters */
  const edgeList = stageEdgeList(vm, fig, rect);
  const occupied = [];
  for (let i = 0; i < angleGeoms.length; i++) {
    const g = angleGeoms[i];
    if (!g || !g.label) continue;
    const sz = pillSize(g.label);
    const seat = pickPillSeat(g.M.x, g.M.y, g.cosM, g.sinM, g.r, sz.tw, sz.th, rect, edgeList, occupied, Math.abs(g.delta));
    occupied.push({ x: seat.x, y: seat.y, tw: sz.tw, th: sz.th });
    drawAnglePill(seat.x, seat.y, g.label, g.color, rect);
  }

  /* celebration gold wash */
  if (game.beamT > 0) {
    ctx.save();
    ctx.globalAlpha = game.beamT * 0.55;
    const y = rect.y + rect.h * 0.55;
    const grd = ctx.createLinearGradient(rect.x, y, rect.x + rect.w, y);
    grd.addColorStop(0, 'rgba(47,224,192,0)');
    grd.addColorStop(0.5, 'rgba(255,224,138,0.95)');
    grd.addColorStop(1, 'rgba(47,224,192,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(rect.x, y - 5, rect.w, 10);
    ctx.restore();
  }
}

function drawShields(x, y, n, max, color) {
  for (let i = 0; i < max; i++) {
    const on = i < n;
    ctx.beginPath();
    ctx.moveTo(x + i * 18 + 6, y - 8);
    ctx.lineTo(x + i * 18 + 12, y - 1);
    ctx.lineTo(x + i * 18 + 10, y + 8);
    ctx.lineTo(x + i * 18 + 2, y + 8);
    ctx.lineTo(x + i * 18, y - 1);
    ctx.closePath();
    ctx.fillStyle = on ? color : 'rgba(255,255,255,0.12)';
    ctx.fill();
  }
}

function drawDeck() {

  let role = '';
  if (game.mode === 'coop') {

  if (game.phase === 'celebrate') {

function drawReticles() {
  if (game.pointerDevice === 'mouse' && game.mouseIn) {
    const x = game.mouseX, y = game.mouseY;
    ctx.strokeStyle = game.mode === 'coop' ? (hoverPlayer() === 0 ? COL.p1 : COL.p2) : COL.cyan;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 20, y); ctx.lineTo(x - 8, y);
    ctx.moveTo(x + 8, y); ctx.lineTo(x + 20, y);
    ctx.moveTo(x, y - 20); ctx.lineTo(x, y - 8);
    ctx.moveTo(x, y + 8); ctx.lineTo(x, y + 20);
    ctx.stroke();
  }
  if (game.mode !== 'solo') {
    const deck = deckGeom();
    for (let p = 0; p < (game.mode === 'versus' ? 2 : 1); p++) {
      const who = game.mode === 'coop' ? hoverPlayer() : p;
      const r = deck.cards[game.sel[who]];
      if (!r) continue;
      ctx.strokeStyle = who === 0 ? COL.p1 : COL.p2;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.7;
      roundRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8, 14);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}
