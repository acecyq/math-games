    ctx.fillStyle = color;
    ctx.fillText(title, x, y - h + 14);
    setFont("700", fs(11));
    ctx.fillStyle = COL.ink;
    ctx.fillText(detail, x, y - h + 30);
  }

  function drawSpringRig(rect, m) {
    const sp = m.spring;
    const mass = G.celebrate > 0 ? m.focusX : G.play;
    const stableMax = Math.max(m.yMax, 16);
    const ceiling = rect.y + 44;
    const avail = Math.max(30, rect.h - 92);
    const px = avail / stableMax;
    const midL = rect.x + rect.w * 0.34;
    const midR = rect.x + rect.w * 0.66;
    const lenA = springCm(sp.a, mass);
    const lenB = springCm(sp.b, mass);
    ctx.strokeStyle = "#d5e6f5";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(rect.x + 20, ceiling);
    ctx.lineTo(rect.x + rect.w - 20, ceiling);
    ctx.stroke();
    drawOneSpring(midL, ceiling, lenA, px, COL.cyan, "A", mass);
    drawOneSpring(midR, ceiling, lenB, px, COL.magenta, "B", mass);
    // Nameplates overlaid under the beam so Spring A / B stay obvious.
    drawSpringBadge(midL, ceiling + 44, COL.cyan, "SPRING A", fmtNum(lenA) + " cm");
    drawSpringBadge(midR, ceiling + 44, COL.magenta, "SPRING B", fmtNum(lenB) + " cm");
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    const rx = rect.x + 18;
    ctx.beginPath();
    ctx.moveTo(rx, ceiling);
    ctx.lineTo(rx, ceiling + stableMax * px);
    ctx.stroke();
    setFont("600", fs(10), true);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = COL.dim;
    const tick = stableMax > 30 ? 5 : 2;
    for (let cm = 0; cm <= stableMax; cm += tick) {
      const yy = ceiling + cm * px;
      ctx.fillText(String(cm), rx - 4, yy);
    }
    if (G.reveal >= 2) {
      setFont("700", fs(12));
      ctx.textAlign = "left";
      ctx.fillStyle = COL.amber;
      const cap = wrap(m.eqCaption, rect.w - 24);
      ctx.fillText(cap[0], rect.x + 12, rect.y + rect.h - 28);
    }
  }

  function drawOneSpring(x, y, cm, pxPer, color, name, mass) {
    const len = Math.max(18, cm * pxPer);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    const coils = 8;
    const steps = coils * 8;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const px = x + Math.sin(t * coils * Math.PI * 2) * 12;
      const py = y + len * t;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    const hy = y + len;
    // Colored weight plate with clear A/B letter.
    roundRect(x - 22, hy, 44, 34, 6);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.22;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#101826";
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    setFont("900", fs(16));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.fillText(name, x - 12, hy + 17);
    setFont("700", fs(11));
    ctx.fillStyle = COL.ink;
    ctx.fillText(Math.round(mass) + " g", x + 10, hy + 17);
  }

  function axisTicks(min, max, goal) {
    const span = Math.max(0.001, max - min);
    const rough = span / goal;
    const pow = Math.pow(10, Math.floor(Math.log10(rough)));
    const err = rough / pow;
    const step = err >= 7.5 ? 10 * pow : err >= 3.5 ? 5 * pow : err >= 1.5 ? 2 * pow : pow;
    const out = [];
    let v = Math.ceil((min - 1e-6) / step) * step;
    for (let i = 0; i < 14 && v <= max + step * 0.01; i++, v += step) {
      out.push(Math.round(v * 1000) / 1000);
    }
    return out;
  }

  function drawXAxisLabels(xt, X, plot, xMax, clockTicks) {
    setFont("600", fs(clockTicks ? 10 : 11));
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillStyle = COL.dim;
    const rowGap = fs(10) + 3;
    const candidates = xt.filter((t) => t.v >= -0.01 && t.v <= xMax + 0.01);
    const items = candidates.map((t) => {
      const label = String(t.label || fmtNum(t.v));
      const tw = ctx.measureText(label).width;
      const cx = X(t.v);
      return { label: label, cx: cx, left: cx - tw / 2 - 4, right: cx + tw / 2 + 4, row: 0 };
    });
    // Greedy left-to-right stagger when clock labels sit too close (e.g. short rest stops).
    for (let i = 0; i < items.length; i++) {
      let row = 0;
      for (; row < 3; row++) {
        const hit = items.slice(0, i).some((p) => p.row === row && !(items[i].right < p.left || items[i].left > p.right));
        if (!hit) break;
      }
      items[i].row = row;
    }
    // Keep journey start/end clocks on the top row; push any colliding middle labels down.
    if (items.length) {
      items[0].row = 0;
      items[items.length - 1].row = 0;
      for (let j = 1; j < items.length - 1; j++) {
        const clashStart = !(items[j].right < items[0].left || items[j].left > items[0].right);
        const clashEnd = !(items[j].right < items[items.length - 1].left || items[j].left > items[items.length - 1].right);
        if ((clashStart || clashEnd) && items[j].row === 0) items[j].row = 1;
      }
    }
    for (const p of items) {
      ctx.fillText(p.label, p.cx, plot.y + plot.h + 4 + p.row * rowGap);
    }
  }

  function drawGraph(rect) {
    const m = G.mission;
    panel(rect.x, rect.y, rect.w, rect.h, "rgba(255,79,216,0.22)");
    setFont("700", fs(11));
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = COL.magenta;
    ctx.fillText("LINEAR GRAPH", rect.x + 14, rect.y + 10);
    if (G.reveal >= 2 && m.eqCaption) {
      setFont("700", fs(12));
      ctx.fillStyle = COL.amber;
      const cap = G.reveal >= 3 && m.resultCaption ? m.resultCaption : m.eqCaption;
      const shown = wrap(cap, rect.w - 150);
      ctx.fillText(shown[0], rect.x + 130, rect.y + 10);
    }
    const clockTicks = !!(m.xTicks && m.xTicks.length && String(m.xTicks[0].label || "").indexOf(":") !== -1);
    const bottomPad = clockTicks ? 78 : 64;
    const plot = {
      x: rect.x + 54,
      y: rect.y + 36,
      w: Math.max(10, rect.w - 70),
      h: Math.max(10, rect.h - bottomPad),
    };
    const mix = G.reveal >= 2 ? clamp(G.line, 0, 1) : 0;
    const xMax = lerp(m.xMaxTable, m.xMaxFull, m.xMaxFull > m.xMaxTable + 0.5 ? mix : 0);
    const yMax = m.yMax;
    G.plot = { x: plot.x, y: plot.y, w: plot.w, h: plot.h, xMin: 0, xMax: xMax, yMin: 0, yMax: yMax };
    const X = (v) => plot.x + (v / xMax) * plot.w;
    const Y = (v) => plot.y + plot.h - (v / yMax) * plot.h;
    ctx.save();
    ctx.beginPath();
    ctx.rect(plot.x, plot.y, plot.w, plot.h);
    ctx.clip();
    ctx.strokeStyle = "rgba(90, 140, 180, 0.18)";
    ctx.lineWidth = 1;
    const xt = m.xTicks || axisTicks(0, xMax, 6).map((v) => ({ v: v, label: fmtNum(v) }));
    const yt = axisTicks(0, yMax, 5);
    for (const t of yt) {
      ctx.beginPath();
      ctx.moveTo(plot.x, Y(t));
      ctx.lineTo(plot.x + plot.w, Y(t));
      ctx.stroke();
    }
    for (const t of xt) {
      ctx.beginPath();
      ctx.moveTo(X(t.v), plot.y);
      ctx.lineTo(X(t.v), plot.y + plot.h);
      ctx.stroke();
    }
    if (G.reveal >= 2 && m.segs) {
      ctx.lineWidth = 3;
      ctx.lineJoin = "round";
      const endT = (m.segs[m.segs.length - 1].t1) * G.line;
      for (const s of m.segs) {
        if (s.t0 >= endT) break;
        const t1 = Math.min(s.t1, endT);
        const u = (t1 - s.t0) / (s.t1 - s.t0 || 1);
        ctx.strokeStyle = s.color;
        ctx.beginPath();
        ctx.moveTo(X(s.t0), Y(s.d0));
        ctx.lineTo(X(s.t0 + (s.t1 - s.t0) * u), Y(s.d0 + (s.d1 - s.d0) * u));
        ctx.stroke();
      }
    }
    if (G.reveal >= 2 && m.lines) {
      for (const ln of m.lines) {
        const x1 = xMax * G.line;
        ctx.strokeStyle = ln.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(X(0), Y(ln.c));
        ctx.lineTo(X(x1), Y(ln.m * x1 + ln.c));
        ctx.stroke();
      }
    }
    if (G.step >= 2 && m.guide && G.reveal < 3) {
      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = COL.amber;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (m.guide.axis === "y") {
        ctx.moveTo(plot.x, Y(m.guide.value));
        ctx.lineTo(plot.x + plot.w, Y(m.guide.value));
      } else {
        ctx.moveTo(X(m.guide.value), plot.y);
        ctx.lineTo(X(m.guide.value), plot.y + plot.h);
      }
      ctx.stroke();
      ctx.restore();
    }
    if (G.reveal >= 3 && m.solution) {
      const marks = m.solution.marks || [{ x: m.solution.x, y: m.solution.y, color: COL.amber }];
      for (const mk of marks) {
        if (mk.y == null) continue;
        ctx.fillStyle = mk.color || COL.amber;
        ctx.beginPath();
        ctx.arc(X(mk.x), Y(mk.y), 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    if (G.reveal >= 2) {
      const tx = G.play;
      if (m.lines) {
        for (const ln of m.lines) {
          const yy = ln.m * tx + ln.c;
          ctx.fillStyle = ln.color;
          ctx.beginPath();
          ctx.arc(X(clamp(tx, 0, xMax)), Y(yy), 4.5, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        const yy = sampleAt(m, tx);
        ctx.fillStyle = COL.cyan;
        ctx.beginPath();
        ctx.arc(X(clamp(tx, 0, xMax)), Y(yy), 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (const p of m.points) {
      ctx.fillStyle = p.color || COL.ink;
      ctx.beginPath();
      ctx.arc(X(p.x), Y(p.y), 4.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#071018";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    if (G.mouseOn && G.pointer) {
      const mx = G.mouseX;
      const my = G.mouseY;
      if (mx >= plot.x && mx <= plot.x + plot.w && my >= plot.y && my <= plot.y + plot.h) {
        const dx = ((mx - plot.x) / plot.w) * xMax;
        const dy = ((plot.y + plot.h - my) / plot.h) * yMax;
        ctx.save();
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = "rgba(231,242,255,0.65)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(mx, plot.y);
        ctx.lineTo(mx, plot.y + plot.h);
        ctx.moveTo(plot.x, my);
        ctx.lineTo(plot.x + plot.w, my);
        ctx.stroke();
        ctx.restore();
        const label = "(" + fmtNum(dx) + ", " + fmtNum(dy) + ")";
        setFont("700", fs(12), true);
        const tw = ctx.measureText(label).width + 12;
        const lx = clamp(mx + 10, plot.x, plot.x + plot.w - tw);
        const ly = clamp(my - 26, plot.y, plot.y + plot.h - 20);
        roundRect(lx, ly, tw, 18, 4);
        ctx.fillStyle = "rgba(6,12,24,0.9)";
        ctx.fill();
        ctx.fillStyle = COL.ink;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(label, lx + 6, ly + 9);
      }
    }
    ctx.restore();
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(plot.x, plot.y);
    ctx.lineTo(plot.x, plot.y + plot.h);
    ctx.lineTo(plot.x + plot.w, plot.y + plot.h);
    ctx.stroke();
    drawXAxisLabels(xt, X, plot, xMax, clockTicks);
    setFont("600", fs(11));
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = COL.dim;
    for (const t of yt) ctx.fillText(fmtNum(t), plot.x - 6, Y(t));
    setFont("600", fs(11));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = COL.dim;
    ctx.fillText(m.xLabel, plot.x + plot.w / 2, rect.y + rect.h - (clockTicks ? 12 : 14));
    ctx.save();
    ctx.translate(rect.x + 14, plot.y + plot.h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(m.yLabel, 0, 0);
    ctx.restore();
    if (m.lines && m.lines.length > 1) {
      setFont("700", fs(11));
      ctx.textAlign = "left";
      ctx.fillStyle = COL.cyan;
      ctx.fillText("A", rect.x + rect.w - 46, rect.y + 28);
      ctx.fillStyle = COL.magenta;
      ctx.fillText("B", rect.x + rect.w - 28, rect.y + 28);
    }
  }

  function richWidth(line, size) {
    if (typeof line === "string") {
      setFont("700", size);
      return ctx.measureText(line).width;
    }
    setFont("700", size);
    const prefix = line.prefix ? ctx.measureText(line.prefix).width : 0;
    const whole = line.whole ? ctx.measureText(String(line.whole)).width + 4 : 0;
    const fsSmall = Math.max(10, Math.round(size * 0.58));
    setFont("700", fsSmall);
    const fw = Math.max(ctx.measureText(String(line.n)).width, ctx.measureText(String(line.d)).width) + 6;
    setFont("700", size);
    const suffix = line.suffix ? ctx.measureText(line.suffix).width : 0;
    return prefix + whole + fw + suffix;
  }

  function drawRich(line, cx, y, size, color) {
    ctx.fillStyle = color;
    if (typeof line === "string") {
      setFont("700", size);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(line, cx, y);
      return;
    }
    const fsSmall = Math.max(10, Math.round(size * 0.58));
    const width = richWidth(line, size);
    let x = cx - width / 2;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    if (line.prefix) {
      setFont("700", size);
      ctx.fillText(line.prefix, x, y);
      x += ctx.measureText(line.prefix).width;
    }
    if (line.whole) {
      setFont("700", size);
      ctx.fillText(String(line.whole), x, y);
      x += ctx.measureText(String(line.whole)).width + 4;
    }
    setFont("700", fsSmall);
    const fw = Math.max(ctx.measureText(String(line.n)).width, ctx.measureText(String(line.d)).width) + 6;
    const mid = x + fw / 2;
    ctx.textAlign = "center";
    ctx.fillText(String(line.n), mid, y - fsSmall * 0.58);
    ctx.fillText(String(line.d), mid, y + fsSmall * 0.66);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, size / 14);
    ctx.beginPath();
    ctx.moveTo(x + 1, y);
    ctx.lineTo(x + fw - 1, y);
    ctx.stroke();
    x += fw;
    if (line.suffix) {
      setFont("700", size);
      ctx.textAlign = "left";
      ctx.fillText(line.suffix, x, y);
    }
  }

  function drawDeck(rect) {
    const m = G.mission;
    const step = m.steps[G.step];
    const narrow = G.layout.narrow;
    const pad = 12;
    G.ui.cards = [];
    const lockW = narrow ? rect.w - pad * 2 : Math.max(118, rect.w * 0.13);
    if (!narrow) {
      const gap = 8;
      const cardsW = rect.w - pad * 2 - lockW - 10;
      const cw = (cardsW - gap * 3) / 4;
      const ch = rect.h - 18;
      const y = rect.y + 9;
      for (let i = 0; i < 4; i++) {
        const x = pad + i * (cw + gap);
        G.ui.cards.push({ x: x, y: y, w: cw, h: ch });
      }
      G.ui.lock = { x: pad + cardsW + 10, y: y, w: lockW, h: ch };
    } else {
      const gap = 8;
      const cw = (rect.w - pad * 2 - gap) / 2;
      const lockH = 42;
      const ch = (rect.h - 16 - lockH - gap) / 2;
      const y0 = rect.y + 8;
      for (let i = 0; i < 4; i++) {
        const col = i % 2;
        const row = i < 2 ? 0 : 1;
        G.ui.cards.push({ x: pad + col * (cw + gap), y: y0 + row * (ch + gap), w: cw, h: ch });
      }
      G.ui.lock = { x: pad, y: rect.y + rect.h - lockH - 6, w: rect.w - pad * 2, h: lockH };
    }
    for (let i = 0; i < 4; i++) drawCard(G.ui.cards[i], step.options[i], i);
    drawLock(G.ui.lock);
    G.ui.cards.forEach((c, i) => zones.push({ id: "card", index: i, x: c.x, y: c.y, w: c.w, h: c.h }));
    zones.push({ id: "lock", x: G.ui.lock.x, y: G.ui.lock.y, w: G.ui.lock.w, h: G.ui.lock.h });
  }

  function cardHot(i) {
    if (G.mode === "solo") return G.players[0].sel === i;
    return G.players[0].sel === i || G.players[1].sel === i;
  }
  function cardArmed(i) {
    return G.players[0].armed === i || (G.mode !== "solo" && G.players[1].armed === i);
  }

  function drawCard(r, opt, index) {
    const hot = cardHot(index);
    const armed = cardArmed(index);
    const flash = G.flash && G.flash.index === index && performance.now() < G.flash.until;
    let accent = "rgba(140,170,210,0.28)";
    if (armed) accent = COL.cyan;
    if (hot) accent = COL.amber;
    if (flash) accent = G.flash.ok ? COL.good : COL.bad;
    roundRect(r.x, r.y, r.w, r.h, 12);
    ctx.fillStyle = flash ? (G.flash.ok ? "rgba(61,255,154,0.16)" : "rgba(255,77,106,0.16)") : (armed ? "rgba(61,240,255,0.1)" : "rgba(12,18,34,0.94)");
    ctx.fill();
    ctx.lineWidth = hot || armed ? 2.4 : 1.4;
    ctx.strokeStyle = accent;
    ctx.stroke();
    const lines = opt.lines;
    let size = fs(16);
    const maxW = r.w - 16;
    for (let guard = 0; guard < 8; guard++) {
      const widest = Math.max.apply(null, lines.map((ln) => richWidth(ln, size)));
      if (widest <= maxW || size <= 11) break;
      size -= 1;
    }
    const gap = size + 8;
    let y = r.y + r.h / 2 - ((lines.length - 1) * gap) / 2;
    for (const line of lines) {
      drawRich(line, r.x + r.w / 2, y, size, COL.ink);
      y += gap;
    }
    const tags = [];
    if (G.players[0].propose === index) tags.push({ t: "P1", c: COL.red });
    if (G.players[1].propose === index) tags.push({ t: "P2", c: COL.blue });
    tags.forEach((tag, i) => {
      setFont("800", fs(10));
      ctx.fillStyle = tag.c;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(tag.t, r.x + 8 + i * 28, r.y + 6);
    });
  }

  function drawLock(r) {
    const hot = cardHot(4);
    const coopDual = G.mode === "coop" && G.step === 2;
    roundRect(r.x, r.y, r.w, r.h, 12);
    const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    g.addColorStop(0, "#243044");
    g.addColorStop(1, "#151c2c");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = hot ? 2.5 : 1.5;
    ctx.strokeStyle = hot ? COL.amber : "rgba(140,160,190,0.4)";
    ctx.stroke();
    setFont("800", fs(r.h < 70 ? 11 : 13));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = COL.ink;
    ctx.fillText(coopDual ? "DUAL LOCK" : "CLICK A CARD", r.x + r.w / 2, r.y + r.h / 2 - 8);
    setFont("700", fs(10));
    ctx.fillStyle = COL.dim;
    ctx.fillText(coopDual ? "same card both" : "or Space / A", r.x + r.w / 2, r.y + r.h / 2 + 10);
  }

  function drawHint(rect) {
    if (!G.hint || rect.h < 16) return;
    const color = G.hintKind === "ok" ? COL.good : G.hintKind === "bad" ? COL.bad : COL.cyan;
    roundRect(rect.x, rect.y, rect.w, rect.h, 10);
    ctx.fillStyle = "rgba(8, 12, 24, 0.92)";
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    setFont("600", fs(14));
    ctx.fillStyle = color;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    const lines = wrap(G.hint, rect.w - 24);
    let y = rect.y + 8;
    for (const line of lines) {
      ctx.fillText(line, rect.x + 12, y);
      y += fs(14) + 3;
    }
  }

  function drawReticles() {
    if (G.screen !== "play") return;
    const count = G.mode === "solo" ? 1 : 2;
    for (let pi = 0; pi < count; pi++) {
      if (G.mode === "coop" && owners().indexOf(pi) === -1 && G.step !== 2) continue;
      const pos = reticlePos(pi);
      const color = G.mode === "solo" ? COL.cyan : (pi === 0 ? COL.red : COL.blue);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 11, 0, Math.PI * 2);
      ctx.moveTo(pos.x - 16, pos.y);
      ctx.lineTo(pos.x - 6, pos.y);
      ctx.moveTo(pos.x + 6, pos.y);
      ctx.lineTo(pos.x + 16, pos.y);
      ctx.moveTo(pos.x, pos.y - 16);
      ctx.lineTo(pos.x, pos.y - 6);
      ctx.moveTo(pos.x, pos.y + 6);
      ctx.lineTo(pos.x, pos.y + 16);
      ctx.stroke();
      if (G.mode !== "solo") {
        setFont("800", fs(11));
        ctx.fillStyle = color;
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.fillText(pi === 0 ? "P1" : "P2", pos.x + 14, pos.y - 10);
      }
      ctx.restore();
    }
  }

  function reticlePos(pi) {
    if (G.pointer && G.mouseOn && mousePlayer() === pi) return { x: G.mouseX, y: G.mouseY };
    const sel = G.players[pi].sel;
    let z = null;
    if (sel >= 0 && sel <= 3 && G.ui.cards[sel]) z = G.ui.cards[sel];
    if (sel === 4) z = G.ui.lock;
    if (z) return { x: z.x + z.w / 2, y: z.y + 16 };
    return { x: view.w * (pi === 0 ? 0.35 : 0.65), y: view.h - 70 };
  }

  function drawFloaters() {
    for (const f of floaters) {
      const a = 1 - f.age / f.life;
      ctx.globalAlpha = Math.max(0, a);
      setFont("800", fs(20));
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawMute() {
    const r = { x: view.w - 88, y: 10, w: 74, h: Math.max(28, (G.layout ? G.layout.hudH : 56) - 20) };
    roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = audio.muted ? "rgba(255,77,106,0.2)" : "rgba(61,240,255,0.12)";
    ctx.fill();
    ctx.strokeStyle = audio.muted ? COL.bad : COL.cyan;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    setFont("800", fs(12));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = COL.ink;
    ctx.fillText(audio.muted ? "MUTED" : "SOUND", r.x + r.w / 2, r.y + r.h / 2);
    zones.push({ id: "mute", x: r.x, y: r.y, w: r.w, h: r.h });
  }

  function drawTitle() {
    setFont("800", fs(18));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = COL.cyan;
    ctx.fillText("SINGAPORE SECONDARY 1  ·  LINEAR GRAPHS", view.w / 2, view.h * 0.12);
    setFont("800", fs(40));
    ctx.fillStyle = COL.ink;
    ctx.fillText("CHRONO-MOTION & HOOKE'S LAB", view.w / 2, view.h * 0.2);
    setFont("700", fs(18));
    ctx.fillStyle = COL.amber;
    ctx.fillText("Rate Simulator", view.w / 2, view.h * 0.26);
    setFont("600", fs(15));
    ctx.fillStyle = COL.dim;
    const sub = "Read c at x = 0, read the gradient as a rate, then predict.";
    ctx.fillText(sub, view.w / 2, view.h * 0.32);
    const modes = [
      { id: "solo", t: "SOLO PHYSICIST", d: "Mouse, keyboard, or one 8BitDo. Three lab shields." },
      { id: "coop", t: "2P CO-OP TEAM", d: "Shared team score only. You alternate steps, then lock step 3 together." },
      { id: "versus", t: "2P VERSUS", d: "Same experiment. First correct lock takes speed points. Step 3 awards a star." },
    ];
    const bw = Math.min(760, view.w - 80);
    const bh = 64;
    const x = (view.w - bw) / 2;
    let y = view.h * 0.4;
    modes.forEach((mode, i) => {
      const hot = G.titleSel === i;
      roundRect(x, y, bw, bh, 12);
      ctx.fillStyle = hot ? "rgba(61,240,255,0.12)" : "rgba(10,16,32,0.9)";
      ctx.fill();
      ctx.strokeStyle = hot ? COL.cyan : "rgba(140,170,200,0.3)";
      ctx.lineWidth = hot ? 2.4 : 1.4;
      ctx.stroke();
      setFont("800", fs(16));
      ctx.textAlign = "left";
      ctx.fillStyle = COL.ink;
      ctx.fillText(mode.t, x + 18, y + 24);
      setFont("600", fs(13));
      ctx.fillStyle = COL.dim;
      ctx.fillText(mode.d, x + 18, y + 46);
      zones.push({ id: "mode", mode: mode.id, index: i, x: x, y: y, w: bw, h: bh });
      y += bh + 12;
    });
    setFont("600", fs(13));
    ctx.textAlign = "center";
    ctx.fillStyle = COL.dim;
    ctx.fillText("Click a card once to lock     ·     P1 W/A/S/D + Space     ·     P2 Arrows + Enter     ·     8BitDo A     ·     M mute", view.w / 2, view.h * 0.86);
    ctx.fillStyle = COL.amber;
    ctx.fillText("BEST SCORE  " + G.best, view.w / 2, view.h * 0.91);
    if (G.pointer) {
      const z = zoneAt(G.mouseX, G.mouseY);
      if (z && z.id === "mode") G.titleSel = z.index;
    }
  }

  function drawOver() {
    panel(view.w / 2 - 280, view.h / 2 - 180, 560, 360, COL.bad);
    setFont("800", fs(28));
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = COL.bad;
    ctx.fillText("SHIELDS DOWN", view.w / 2, view.h / 2 - 120);
    setFont("600", fs(16));
    ctx.fillStyle = COL.ink;
    const reason = G.mode === "versus" ? versusLead() : (G.overReason || "Lab shields depleted.");
    const lines = wrap(reason, 480);
    lines.forEach((line, i) => ctx.fillText(line, view.w / 2, view.h / 2 - 78 + i * 22));
    ctx.fillStyle = COL.amber;
    if (G.mode === "versus") {
      ctx.fillText("P1  ★ " + G.players[0].stars + "   " + G.players[0].score + "     P2  ★ " + G.players[1].stars + "   " + G.players[1].score, view.w / 2, view.h / 2 - 10);
    } else {
      ctx.fillText((G.mode === "coop" ? "TEAM SCORE  " : "SCORE  ") + G.score + "    ·    ROUND " + G.round, view.w / 2, view.h / 2 - 10);
    }
    const labels = ["RUN IT BACK", "TITLE"];
    labels.forEach((label, i) => {
      const x = view.w / 2 - 220 + i * 230;
      const y = view.h / 2 + 50;
      roundRect(x, y, 200, 52, 10);
      ctx.fillStyle = G.overSel === i ? "rgba(61,240,255,0.16)" : "rgba(8,12,24,0.5)";
      ctx.fill();
      ctx.strokeStyle = G.overSel === i ? COL.cyan : "rgba(140,170,200,0.35)";
      ctx.stroke();
      ctx.fillStyle = COL.ink;
      setFont("800", fs(15));
      ctx.fillText(label, x + 100, y + 26);
      zones.push({ id: "over", index: i, x: x, y: y, w: 200, h: 52 });
    });
  }

  function drawFatal() {
    drawBackground();
    panel(40, view.h / 2 - 80, view.w - 80, 160, COL.bad);
    setFont("700", fs(16));
    ctx.fillStyle = COL.bad;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    const lines = wrap(G.fatal || "Lab fault", view.w - 120);
    lines.slice(0, 5).forEach((line, i) => ctx.fillText(line, 60, view.h / 2 - 60 + i * 24));
  }

  function draw() {
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.clearRect(0, 0, view.w, view.h);
    if (G.shake > 0 && !REDUCE) {
      const s = G.shake * 7;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    drawBackground();
    if (G.fatal) {
      drawFatal();
      drawMute();
      return;
    }
    if (G.screen === "title") drawTitle();
    else if (G.screen === "over") drawOver();
    else if (G.mission) {
      const L = G.layout;
      drawHUD(L);
      drawBrief(L.brief);
      if (L.rig.h > 30) drawRig(L.rig);
      if (L.graph.h > 30) drawGraph(L.graph);
      drawHint(L.hint);
      drawDeck(L.deck);
      drawFloaters();
      drawReticles();
    }
    drawParticles();
    drawMute();
  }

  function resize() {
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    view.w = window.innerWidth;
    view.h = window.innerHeight;
    canvas.width = Math.max(1, Math.round(view.w * view.dpr));
    canvas.height = Math.max(1, Math.round(view.h * view.dpr));
  }

  function setupAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const actx = new AC();
    const master = actx.createGain();
    master.gain.value = 0.85;
    master.connect(actx.destination);
    const music = actx.createGain();
    music.gain.value = 0.16;
    music.connect(master);
    const sfx = actx.createGain();
    sfx.gain.value = 0.5;
    sfx.connect(master);
    const len = actx.sampleRate;
    const buffer = actx.createBuffer(1, len, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    audio.ctx = actx;
    audio.master = master;
    audio.music = music;
    audio.sfx = sfx;
    audio.noise = buffer;
    audio.next = actx.currentTime + 0.05;
    audio.started = true;
    applyMute();
  }
  function ensureAudio() {
    if (!audio.ctx) setupAudio();
    if (audio.ctx && audio.ctx.state === "suspended") audio.ctx.resume();
  }
  function applyMute() {
    if (!audio.master) return;
    audio.master.gain.value = audio.muted ? 0 : 0.85;
  }
  function toggleMute() {
    ensureAudio();
    audio.muted = !audio.muted;
    applyMute();
  }
  function tone(dest, when, freq, dur, type, gain, slide) {
    if (!audio.ctx || audio.muted) return;
    const o = audio.ctx.createOscillator();
    const g = audio.ctx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, when);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), when + dur);
    g.gain.setValueAtTime(gain, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    o.connect(g);
    g.connect(dest);
    o.start(when);
    o.stop(when + dur + 0.02);
  }
  function noiseHit(when, dur, gain) {
    if (!audio.ctx || audio.muted || !audio.noise) return;
    const src = audio.ctx.createBufferSource();
    src.buffer = audio.noise;
    const filter = audio.ctx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 1800;
    const g = audio.ctx.createGain();
    g.gain.setValueAtTime(gain, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + dur);
    src.connect(filter);
    filter.connect(g);
    g.connect(audio.sfx);
    src.start(when);
    src.stop(when + dur);
  }
  function musicTick() {
    if (!audio.ctx || audio.muted || !audio.started) return;
    if (audio.next < audio.ctx.currentTime - 0.05) audio.next = audio.ctx.currentTime + 0.02;
    const stepDur = 60 / 104 / 2;
    const arp = [293.66, 349.23, 440, 523.25, 392, 493.88, 440, 349.23];
    while (audio.next < audio.ctx.currentTime + 0.18) {
      const s = audio.step % 16;
      if (s % 4 === 0) tone(audio.music, audio.next, s % 8 === 4 ? 82.41 : 73.42, stepDur * 1.7, "triangle", 0.55);
      tone(audio.music, audio.next, arp[s % arp.length], stepDur * 0.42, "square", 0.07);
      if (s % 2 === 1) noiseHit(audio.next, 0.03, 0.035);
      if (s % 8 === 4) noiseHit(audio.next, 0.07, 0.05);
      audio.next += stepDur;
      audio.step += 1;
    }
  }
  function playBlip() { if (!audio.ctx) return; tone(audio.sfx, audio.ctx.currentTime, 660, 0.06, "square", 0.08); }
  function playBuzz() {
    if (!audio.ctx) return;
    const t = audio.ctx.currentTime;
    tone(audio.sfx, t, 110, 0.22, "sawtooth", 0.08, 70);
    noiseHit(t, 0.18, 0.08);
  }
  function playSweep() {
    if (!audio.ctx) return;
    tone(audio.sfx, audio.ctx.currentTime, 240, 0.38, "sine", 0.1, 980);
  }
  function playChord() {
    if (!audio.ctx) return;
    const t = audio.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(audio.sfx, t + i * 0.03, f, 0.55, "sine", 0.08));
  }
  function playRigSting(rig) {
    if (!audio.ctx) return;
    const t = audio.ctx.currentTime;
    if (rig === "spring") tone(audio.sfx, t, 320, 0.28, "triangle", 0.12, 90);
    else if (rig === "journey") {
      tone(audio.sfx, t, 880, 0.12, "sine", 0.1);
      tone(audio.sfx, t + 0.08, 1320, 0.16, "sine", 0.06);
    } else {
      tone(audio.sfx, t, 520, 0.1, "sine", 0.09);
      tone(audio.sfx, t + 0.09, 780, 0.16, "sine", 0.08);
    }
  }

  function boot() {
    canvas = document.getElementById("game");
    ctx = canvas.getContext("2d");
    liveEl = document.getElementById("live");
    REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    try { G.best = Number(localStorage.getItem(STORE) || 0) || 0; } catch (e) { G.best = 0; }
    const audit = runMathAudit();
    if (audit) G.fatal = audit;
    resize();
    G.layout = computeLayout();
    window.addEventListener("resize", resize);
    window.addEventListener("keydown", (e) => {
      const block = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Enter"];
      if (block.indexOf(e.code) !== -1) e.preventDefault();
      if (keysDown.has(e.code)) return;
      keysDown.add(e.code);
      onKey(e.code);
    });
    window.addEventListener("keyup", (e) => keysDown.delete(e.code));
    canvas.addEventListener("pointermove", (e) => {
      const p = pointerXY(e);
      G.pointer = true;
      G.mouseOn = true;
      G.mouseX = p.x;
      G.mouseY = p.y;
      if (G.screen !== "play") return;
      const pi = mousePlayer();
      const z = zoneAt(p.x, p.y);
      if (!z) return;
      if (z.id === "card") G.players[pi].sel = z.index;
      else if (z.id === "lock") G.players[pi].sel = 4;
      else G.players[pi].sel = -1;
    });
    canvas.addEventListener("pointerleave", () => { G.mouseOn = false; });
    canvas.addEventListener("pointerdown", (e) => {
      ensureAudio();
      canvas.focus();
      const p = pointerXY(e);
      G.pointer = true;
      G.mouseX = p.x;
      G.mouseY = p.y;
      const z = zoneAt(p.x, p.y);
      if (!z) return;
      if (z.id === "mute") { toggleMute(); return; }
      if (G.screen === "title" && z.id === "mode") { startGame(z.mode); return; }
      if (G.screen === "over" && z.id === "over") {
        G.overSel = z.index;
        if (z.index === 0) startGame(G.mode);
        else goTitle();
        return;
      }
      if (G.screen !== "play") return;
      const pi = mousePlayer();
      if (G.roundWait > 0.25) { G.roundWait = 0.05; G.busy = 0.05; return; }
      if (!canControl(pi)) return;
      if (z.id === "card") {
        G.players[pi].sel = z.index;
        trySubmit(pi, z.index);
      } else if (z.id === "lock") {
        G.players[pi].sel = 4;
        confirmPlayer(pi);
      }
    });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    window.addEventListener("gamepadconnected", () => {});
    let last = performance.now();
    function frame(now) {
      const dt = clamp((now - last) / 1000, 0, 0.034) || 0.016;
      last = now;
      if (!G.fatal) {
        try {
          G.layout = computeLayout();
          update(dt, now);
          zones.length = 0;
          draw();
        } catch (err) {
          G.fatal = (err && err.message) ? err.message : String(err);
        }
      } else {
        try {
          zones.length = 0;
          drawFatal();
          drawMute();
        } catch (e2) { /* keep the loop alive */ }
      }
      requestAnimationFrame(frame);
    }
    if (liveEl) liveEl.textContent = "Chrono-Motion and Hooke's Lab. Choose solo, co-op, or versus.";
    requestAnimationFrame(frame);
  }

  if (typeof document === "undefined") {
    globalThis.__CHRONO_TEST__ = { runMathAudit: runMathAudit, generateMission: generateMission, auditMission: auditMission };
    return;
  }
  boot();
})();
</script>
</body>
