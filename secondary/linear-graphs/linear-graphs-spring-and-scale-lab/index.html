    wrapped.forEach((line, i) => ctx.fillText(line, x + 18, y + fs(68) + i * lh));
    setFont(800, fs(13));
    ctx.fillStyle = "#3d6d8a";
    ctx.fillText(foot, x + 18, y + h - fs(20));
  }

  function drawClear() {
    const r = game.round;
    const lines = [
      eqNamed("A", r.mA, r.cA),
      eqNamed("B", r.mB, r.cB),
      `Same length at x = ${fmt(r.xInt)} g,  L = ${fmt(r.lInt)} cm`,
      `Team lab prestige +200`,
    ];
    players.forEach((p) => lines.push(`${p.name}: ${p.roundStars} star${p.roundStars === 1 ? "" : "s"} this experiment`));
    if (game.healed) lines.push("Careful handling: each cracked flask is restored by 1.");
    drawNotebook("Experiment complete", lines, "Both models locked", "Space, A, or click for the next experiment");
  }

  function drawTitle() {
    const wide = view.w >= 980;
    const lab = wide
      ? { x: 20, y: 78, w: Math.min(500, view.w * 0.4), h: view.h - 110 }
      : { x: 12, y: 70, w: view.w - 24, h: Math.max(180, view.h * 0.34) };
    drawApparatus(lab, false);
    const px = wide ? lab.x + lab.w + 28 : 28;
    const py = wide ? 86 : lab.y + lab.h + 16;
    const pw = view.w - px - 24;
    setFont(800, fs(13));
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "#8fd4ff";
    ctx.fillText("SINGAPORE SECONDARY 2   ·   G2 LINEAR GRAPHS", px, py);
    let titleSize = fs(46);
    setFont(800, titleSize);
    while (titleSize > 26 && ctx.measureText("SPRING & SCALE LAB").width > pw) {
      titleSize -= 2;
      setFont(800, titleSize);
    }
    ctx.fillStyle = "#f7fbff";
    ctx.fillText("SPRING & SCALE LAB", px, py + fs(22));
    setFont(700, fs(20));
    ctx.fillStyle = COL.gold;
    ctx.fillText("Dual-Crane Equilibrium", px, py + fs(22) + titleSize + 4);
    setFont(650, fs(16));
    ctx.fillStyle = "#d5e4ef";
    const blurb = wrap("Read the spring table. Build L = mx + c for both cranes. Then find the mass where their lengths match.", pw);
    blurb.slice(0, 3).forEach((line, i) => ctx.fillText(line, px, py + fs(22) + titleSize + fs(36) + i * fs(22)));
    const controls = [
      ["#ff4b55", "P1 Red", "Arrows move   ·   Space locks   ·   keys 1–4   ·   Pad A"],
      ["#3c7dff", "P2 Blue", "W A S D move   ·   F locks   ·   Pad A"],
      ["#ffd23f", "P3 Yellow", "I J K L move   ·   H locks   ·   Pad A"],
    ];
    const cy = py + fs(22) + titleSize + fs(36) + blurb.slice(0, 3).length * fs(22) + 16;
    controls.forEach((row, i) => {
      const y = cy + i * fs(28);
      ctx.fillStyle = row[0];
      ctx.beginPath();
      ctx.arc(px + 7, y + 8, 5, 0, Math.PI * 2);
      ctx.fill();
      setFont(800, fs(14));
      ctx.fillStyle = row[0];
      const labelW = ctx.measureText(row[1]).width;
      ctx.fillText(row[1], px + 20, y);
      setFont(650, fs(14));
      ctx.fillStyle = "#d5e4ef";
      ctx.fillText(row[2], px + 20 + labelW + 14, y);
    });
    const by = cy + fs(100);
    const bw = Math.min(320, pw);
    const pulse = 0.5 + 0.5 * Math.sin(game.time * 3);
    roundRect(px, by, bw, fs(48), 12);
    ctx.fillStyle = `rgba(255, 209, 92, ${0.9})`;
    ctx.fill();
    setFont(800, fs(18));
    ctx.fillStyle = "#2a2108";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("BEGIN EXPERIMENT", px + bw / 2, by + fs(24));
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    setFont(650, fs(13));
    ctx.fillStyle = `rgba(215, 228, 239, ${0.7 + pulse * 0.3})`;
    ctx.fillText("Space, click, or gamepad A.   First correct lock earns the star.   A wrong lock cracks only your flask.", px, by + fs(58));
    if (game.best > 0) {
      setFont(800, fs(14));
      ctx.fillStyle = COL.gold;
      ctx.fillText(`Best lab prestige  ${game.best | 0}`, px, by + fs(82));
    }
    setFont(650, fs(12));
    ctx.fillStyle = "#9eb4c4";
    ctx.fillText("8BitDo: standard / X-input layout. D-pad or stick moves, A confirms.", px, by + fs(104));
  }

  function render() {
    layout = computeLayout();
    ui.cards = [];
    ctx.clearRect(0, 0, view.w, view.h);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    if (game.fatal) {
      ctx.fillStyle = "#fff8ec";
      ctx.fillRect(0, 0, view.w, view.h);
      setFont(700, 18);
      ctx.fillStyle = "#1b2b3c";
      ctx.fillText(game.fatal, 24, 40);
      return;
    }
    drawBackdrop();
    if (game.mode === "title") {
      drawTitle();
      drawTop();
      return;
    }
    ctx.save();
    if (game.shake > 0) {
      const m = game.shake * 8;
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }
    drawApparatus(layout.lab, true);
    drawGraph(layout.graph);
    ctx.restore();
    drawConsole();
    if (game.mode === "play" || game.mode === "review") players.forEach(drawReticle);
    particles.forEach((p) => {
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    floaters.forEach((f) => {
      ctx.globalAlpha = Math.max(0, 1 - f.age / f.life);
      setFont(800, fs(16));
      ctx.fillStyle = f.color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;
    drawHint();
    const q = currentQ();
    if (game.mode === "review" && q && game.review) {
      drawNotebook(game.review.title, q.working, q.answer, "Space, A, or click to continue");
    } else if (game.mode === "over" && q && game.review) {
      drawNotebook(game.review.title, q.working, q.answer, "Flasks return to 2. Space or click to continue.");
    } else if (game.mode === "clear") drawClear();
    if (game.padNotice) {
      setFont(800, fs(14));
      ctx.fillStyle = "#f4f8fb";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(game.padNotice.text, 16, layout.topH + 8);
    }
    drawTop();
  }

  function frame(ts) {
    if (!frame.last) frame.last = ts;
    const dt = Math.min(0.05, (ts - frame.last) / 1000 || 0);
    frame.last = ts;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  function resize() {
    view.dpr = Math.min(2, window.devicePixelRatio || 1);
    view.w = Math.max(360, window.innerWidth);
    view.h = Math.max(520, window.innerHeight);
    canvas.width = Math.round(view.w * view.dpr);
    canvas.height = Math.round(view.h * view.dpr);
    canvas.style.width = `${view.w}px`;
    canvas.style.height = `${view.h}px`;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  }

  function boot() {
    try { selfTest(); } catch (err) {
      console.error(err);
      game.fatal = err && err.message ? err.message : String(err);
    }
    canvas = document.getElementById("game");
    ctx = canvas.getContext("2d");
    liveEl = document.getElementById("live");
    try {
      audio.muted = localStorage.getItem("springScaleMute") === "1";
      game.best = Number(localStorage.getItem("springScaleBest") || 0) || 0;
    } catch (e) { /* ignore */ }
    REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    resize();
    window.addEventListener("resize", resize);
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    window.addEventListener("blur", () => keys.clear());
    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    window.addEventListener("gamepadconnected", (e) => {
      game.padNotice = { text: `Gamepad ${e.gamepad.index + 1} ready`, life: 2.6 };
    });
    canvas.focus();
    requestAnimationFrame(frame);
  }

  if (typeof window !== "undefined") {
    window.__springLab = {
      get state() {
        const q = currentQ();
        return {
          mode: game.mode,
          wave: game.wave,
          qIndex: game.qIndex,
          kind: q && q.kind,
          prompt: q && q.prompt,
          answer: q && q.answer,
          choices: q ? q.choices.map((c) => ({ text: c.lines.join(" | "), correct: c.correct })) : [],
          prestige: game.prestige,
          hearts: players.map((p) => p.hearts),
          stars: players.map((p) => p.stars),
          known: Object.assign({}, game.known),
          fatal: game.fatal,
          timer: game.timer,
        };
      },
      cards() { return ui.cards.map((c) => ({ i: c.i, x: c.x, y: c.y, w: c.w, h: c.h })); },
      start: startGame,
    };
  }

  if (typeof document === "undefined") selfTest();
  else boot();
})();
</script>
</body>
</html>
