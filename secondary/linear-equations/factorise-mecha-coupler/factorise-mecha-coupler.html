      G.floats.forEach((f) => text(ctx, f.msg, f.x, f.y, { size: 18, color: f.color, alpha: 1 - f.age / f.life }));
      if (G.toast && G.toastT > 0) {
        textFit(ctx, G.toast, view.w / 2, view.h - 28, view.w - 24, { size: 14, min: 11, color: '#ffe1a8', alpha: Math.min(1, G.toastT) });
      }
      if (G.mode === 'pause') {
        drawOverlay(ctx, 'LINE PAUSED', [
          'Any crew member can lock either claw or the master clamp.',
          'P1 arrows + space    P2 WASD + F    P3 IJKL + H',
          '8BitDo in X-input mode: stick aims, button A engages.',
          'Press Esc, click, or A to resume. Press R to end the shift.',
        ]);
      } else if (G.mode === 'over') {
        const lines = [
          'Hulls coupled  ' + G.built + '    ·    Factory output  ' + G.score.toLocaleString('en-SG'),
        ];
        G.players.forEach((p) => lines.push(p.name + ' ' + p.role + '    stars ' + p.stars + '    cells ' + p.cells + '/3'));
        lines.push('Press Space, click, or gamepad A for a new shift.');
        drawOverlay(ctx, 'SHIELD CELLS DEPLETED', lines);
      } else if (G.mode === 'victory') {
        const lines = [
          'Nine hulls walked off the line.',
          'Factory output  ' + G.score.toLocaleString('en-SG'),
        ];
        G.players.forEach((p) => { if (p.joined) lines.push(p.name + ' engineering stars  ' + p.stars); });
        lines.push('Press Space, click, or A for tier 3 overtime.');
        drawOverlay(ctx, 'SHIFT COMPLETE', lines);
      }
    }
    if (G.flash > 0) {
      ctx.fillStyle = G.flashColor;
      ctx.globalAlpha = G.flash * 0.18;
      ctx.fillRect(0, 0, view.w, view.h);
    }
    if (G.loopError) {
      text(ctx, G.loopError.split('\n')[0], view.w / 2, 80, { size: 14, color: COL.red });
    }
    ctx.restore();
  }

  function resize() {
    const bar = document.getElementById('bar');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = Math.max(1, window.innerHeight - (bar ? bar.offsetHeight : 0));
    view.w = w;
    view.h = h;
    view.dpr = dpr;
    G.canvas.width = Math.max(1, Math.floor(w * dpr));
    G.canvas.height = Math.max(1, Math.floor(h * dpr));
    G.canvas.style.width = w + 'px';
    G.canvas.style.height = h + 'px';
  }

  function toView(clientX, clientY) {
    const r = G.canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left) * (view.w / r.width),
      y: (clientY - r.top) * (view.h / r.height),
    };
  }

  function boot() {
    persist = true;
    G.canvas = document.getElementById('game');
    G.ctx = G.canvas.getContext('2d');
    G.players = makePlayers();
    G.reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    resize();
    UI = layout();
    window.addEventListener('resize', () => { resize(); UI = layout(); });
    window.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      AudioBus.start();
      if (e.repeat) {
        if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
        return;
      }
      const key = e.key === ' ' ? ' ' : e.key.toLowerCase();
      G.keys.add(key);
      const block = [' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd', 'f', 'i', 'j', 'k', 'l', 'h'];
      if (block.indexOf(key) >= 0) e.preventDefault();
      if (key === 'escape') {
        e.preventDefault();
        if (G.mode === 'play') G.mode = 'pause';
        else if (G.mode === 'pause') G.mode = 'play';
        return;
      }
      if (key === 'm') { e.preventDefault(); AudioBus.toggle(); return; }
      if (key === 'r' && (G.mode === 'pause' || G.mode === 'victory')) { endShift(); G.mode = 'title'; return; }
      G.players.forEach((p) => {
        if (key === p.up || key === p.down || key === p.left || key === p.right || key === p.fire) {
          if (!p.joined) { p.joined = true; toast(p.name + ' joined the line'); }
        }
        if (key === p.fire) onFire(p);
      });
    });
    window.addEventListener('keyup', (e) => {
      const key = e.key === ' ' ? ' ' : e.key.toLowerCase();
      G.keys.delete(key);
    });
    window.addEventListener('blur', () => G.keys.clear());
    window.addEventListener('gamepadconnected', (e) => toast('Gamepad linked: ' + (e.gamepad.id || 'pad')));
    G.canvas.addEventListener('pointerdown', (e) => {
      G.canvas.focus();
      AudioBus.start();
      const v = toView(e.clientX, e.clientY);
      if (G.mode === 'title') { startShift(false); return; }
      if (G.mode === 'pause') { G.mode = 'play'; return; }
      if (G.mode === 'over') { startShift(false); return; }
      if (G.mode === 'victory') { startShift(true); return; }
      const actor = G.players[0].cells > 0 ? G.players[0] : living()[0];
      if (!actor) return;
      actor.x = clamp(v.x, 16, view.w - 16);
      actor.y = clamp(v.y, 16, view.h - 16);
      onFire(actor);
    });
    document.getElementById('mute').addEventListener('click', () => {
      AudioBus.start();
      AudioBus.toggle();
      G.canvas.focus();
    });
    G.canvas.focus();
    window.MECHA.step = (dt) => {
      UI = layout();
      window.MECHA.UI = UI;
      try { update(dt || 1 / 60); render(); }
      catch (err) { G.loopError = (err && err.stack) ? err.stack : String(err); }
    };
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      UI = layout();
      if (window.MECHA) window.MECHA.UI = UI;
      try {
        if (!document.hidden) {
          update(dt);
          AudioBus.tick();
        }
        render();
      } catch (err) {
        G.loopError = (err && err.stack) ? err.stack : String(err);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  try {
    selfTest();
    if (typeof window === 'undefined') console.log('SELFTEST OK');
  } catch (err) {
    bootError = (err && err.stack) ? err.stack : String(err);
    if (typeof window === 'undefined') throw err;
  }

  if (typeof window !== 'undefined') {
    window.MECHA = { G, selfTest, assemble, createProblem, diagnose, genTier };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})();
</script>
</body>
